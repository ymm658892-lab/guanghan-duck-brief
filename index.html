  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

"物理AI技術革命即將引爆", "full": "摩根大通發布報告指出，結合大語言模型與實體機器人的「物理AI」，其突破性的「ChatGPT時刻」最早可能在明年出現。屆時機器人理解與操作物理世界的能力將出現飛躍式的提升。", "think": "大模型與實體硬體的結合是科技業下一個巨大浪潮，可能重塑製造業與服務業形態。對一般人而言，持續學習AI工具運用將是保持職場競爭力的關鍵。", "question": "若物理AI時代比預期更早到來，你的職場技能具備不可被機器取代的優勢嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiSEFVX3lxTE1peHl6UWVINWQ3emVzZTNfZV95YTJ5Ty1IMkJJNThNLWVnSW5nUGx5VnpQbkgyNXRwVUtBeGI4dkVnWkpBdEQwSg?oc=5", "name": "鉅亨號"}]}, {"title": "TEL機器人大賽落幕 首辦互動展覽館培育成育台灣科技新世代", "teaser": "產官學合作培育機器人人才", "full": "東京威力科創（TEL）主辦的機器人大賽順利落幕，今年首度設立互動展覽館開放體驗。賽事旨在鼓勵年輕世代投入半導體與自動化機器人研發，為台灣科技產業儲備未來的硬體與控制人才。", "think": "企業透過競賽培育人才，突顯出自動化控制在半導體生態系中的戰略地位。科技技術下沉至教育端，也代表自動化產業前景長期看好。", "question": "面對科技人才競爭日益激烈的環境，你如何維持自己在專業領域的學習與進化？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVEFVX3lxTE9fR25IcEdkdlp4NVQ2MHFrN0lfR1doRmVudUhwWDZlY3BlOU80Mk9qNVlBUmI1VlpUcUNWYmx5MWR0d1lqcS1rT3E5WDVGcDJFaTYzdw?oc=5", "name": "東森新聞"}]}, {"title": "機器人通用化指引集結24家夥伴 聚焦關鍵零組件切入國際供應鏈", "teaser": "國內產官學推進機器人規格化", "full": "國內產業推動「機器人通用化指引」，集結24家關鍵策略夥伴共同響應，專注於模組化與關鍵零組件開發。政府與產業冀望透過標準化規範，協助台灣業者擺脫單打獨鬥，打入國際人形機器人供應鏈。", "think": "規範與通用標準化是產業大規模商業化的第一步，台灣零組件廠具有極高的製造技術優勢。若能成功標準化，將有利於台廠在全球市場中占據一席之地。", "question": "台灣零組件廠若順利整合進國際機器人供應鏈，你看好哪些次產業率先受惠？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiWkFVX3lxTE1oLTlhWEhIb2wwMUFTanVnb0dGR2NzUGpnTTFDVDJSR1c4cUllMGd6Q2FSZVhEVW51cTdzZnhXcFVSRVZ3eWpBLU9DOFg4RkVkR2g2QWFEd29rdw?oc=5", "name": "經濟日報"}]}], "tech": [{"title": "狗跑出去會再跑回來！家登邱銘乾看旺AI基本面強調計畫不變", "teaser": "半導體封裝鏈大廠看好AI需求", "full": "半導體載具大廠家登董事長邱銘乾針對近期股市波動表示，市場就像「狗跑出去還是會跑回主人身邊」，AI基本面非常強勁，公司的擴產與投資計畫完全不受短線波動影響，展現強烈信心。", "think": "大廠高層的比喻生動說明了「價格圍繞價值波動」的常理。在市場情緒動盪不安時，了解產業實質基本面比起關注短線股價走勢更為重要。", "question": "當市場出現短期恐慌時，你是否也能如實業家一樣保持對長期基本面的信念？", "sources": [{"url": "https://technews.tw/2026/11/25/gudeng-bullish-on-ai-fundamentals/", "name": "科技新報"}]}, {"title": "愛思強遭機構降評 憂光通訊設備需求放緩致股價崩跌", "teaser": "半導體設備廠遭降評引發賣壓", "full": "晶體成長設備大廠愛思強（Aixtron）因為研究機構下修投資評等，市場擔心其光通訊與化合物半導體設備需求成長動能趨緩，衝擊股價出現重挫。這反映出市場對非AI單一主題硬體支出的疑慮。", "think": "科技產業內部出現分化，非AI或特定先進製程之外的領域可能面臨需求復甦不如預期的風險。投資時需細分具體次領域，切忌一概而論。", "question": "在科技股投資中，你是否有做好「AI先進製程」與「成熟傳統半導體」的分流策略？", "sources": [{"url": "https://finance.technews.tw/2026/11/25/aixtron-downgraded-to-sell-as-shares-plunge/", "name": "科技新報"}]}, {"title": "SpaceX有望提前進標普500 被動買盤效應可期", "teaser": "太空科技巨頭潛在納入標普", "full": "市場傳出馬斯克的太空探索公司 SpaceX 資本化進程加速，有望提前獲得納入標普500指數的資格。若順利入列，將引發龐大的指數追蹤型被動基金強制買盤，對公司估值帶來重要支撐。", "think": "SpaceX若進入標普500，代表商業太空產業完全走向主流資本市場。指數型投資人也將順理成章分享太空經濟成長的紅利。", "question": "當前太空經濟正逐漸商業化，你的投資組合中是否已經包含太空科技相關暴光？", "sources": [{"url": "https://finance.technews.tw/2026/11/25/possible-tesla-merger-could-aid-spacexs-sp-500-entry/", "name": "科技新報"}]}, {"title": "服務中斷遭重創！微軟啟動紅色警戒目標一小時內恢復全球服務", "teaser": "雲端巨頭微軟強化系統韌性", "full": "微軟近期因雲端服務大規模中斷備受壓力，正式啟動內部「紅色警戒」機制，訂定未來發生全球服務故障時，必須在一小時內完成全面修復與恢復的嚴格目標，以確保企業客戶的業務持續性。", "think": "雲端基礎建設已成為全球經濟運行的水電設施，穩定度高於一切。微軟宣示提高修復效率，突顯出系統穩定對科技巨頭商譽與客戶信任的重要性。", "question": "面對日益依賴雲端服務的工作環境，你的團隊有做好系統中斷時的備案計畫嗎？", "sources": [{"url": "https://infosecu.technews.tw/2026/11/25/microsoft-declares-code-red-to-overhaul-service-failure-prevention-and-response/", "name": "科技新報"}]}, {"title": "Meta把Muse AI助理搬進Instagram私訊 打造免切換對話體驗", "teaser": "社群平台整合AI助理新功能", "full": "Meta宣布將 Muse AI 助理直接整合進 Instagram 私訊對話框中，使用者無需切換 App 即可詢問貼文背景、規劃旅行行程或生成內容。此舉進一步將AI軟體體驗無縫嵌入日常社群互動。", "think": "社群巨頭把AI直接帶入日常聊天場景，能大幅降低用戶使用AI的門檻。未來AI應用將不再是單獨軟體，而是無所不在的背景輔助功能。", "question": "在日常使用的社群軟體中導入AI對話助手，會改變你搜尋資訊與對話的習慣嗎？", "sources": [{"url": "https://technews.tw/2026/11/25/meta-brings-its-muse-ai-assistant-directly-into-instagram-dms/", "name": "科技新報"}]}]}}</script>

    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
