  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

<script type="application/json" id="slot-1300">{"date": "10月13日．週二", "tldr": "週二台股午盤受亞股疲軟與外資匯出影響，加權指數大跌近2%，盤面震盪劇烈，投資人需密切留意科技股賣壓與資金流向，保持冷靜應對市場波動。", "indicators": {"note": "今日台股與費半同步重挫，顯示半導體與科技產業遭遇強勁賣壓，外資撤離跡象明顯，台積電ADR走弱加劇大盤壓力，盤勢進入高風險震盪期。", "tiles": [{"label": "台股加權指數", "value": "48,341.31", "valueClass": "fall", "delta": "-1.97%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "27,245.90", "valueClass": "fall", "delta": "-0.44%", "deltaClass": "fall"}, {"label": "費半指數", "value": "12,236.79", "valueClass": "fall", "delta": "-2.67%", "deltaClass": "fall"}, {"label": "台積電ADR", "value": "444.35", "valueClass": "fall", "delta": "-1.98%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "AI前景疑慮引發賣壓　亞股全面領跌", "teaser": "科技股震盪，台股首當其衝", "full": "近期市場對AI產業的投資前景出現疑慮，導致投資人信心動搖，科技股面臨沉重拋售壓力。受此情緒感染，亞洲股市今日普遍走弱，日、韓及台股皆呈現領跌格局，市場賣壓顯著。", "think": "AI熱潮在經過長時間狂奔後，投資人開始回頭檢視獲利實質落地情況。當市場對成長動能產生懷疑，高本益比的科技股往往會成為資金首要避開的目標。", "question": "當市場風向轉變，你手中的持股是具備實質獲利支撐的資產，還是僅靠題材支撐的泡沬？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610130274.aspx", "name": "中央社"}]}, {"title": "外資瘋狂提款台股　新台幣爆量狂瀉", "teaser": "匯市震盪，資金外逃壓力大", "full": "受國際局勢與台股賣壓影響，外資今日在台股市場呈現大舉匯出趨勢。新台幣匯率盤中出現劇烈波動，貶值幅度超過3角，並爆出史上罕見的成交巨量，顯示資金流出壓力沉重。", "think": "匯率是資金流向最直接的指標，當外資不計成本匯出時，台股權值股往往面臨修正壓力。上班族在投資時，需特別留意匯率變動對整體市場流動性的影響。", "question": "面對外資的大規模撤離，你是否已準備好足夠的現金水位來應對市場的潛在回檔？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610130233.aspx", "name": "中央社"}]}, {"title": "均豪獲利亮眼　均華EPS表現強勁", "teaser": "設備廠受惠，獲利逆勢成長", "full": "在半導體產業鏈中，均豪第三季獲利表現亮眼，單季表現已超越上半年總和。同集團的均華每股純益達9.38元，展現出強勁的營收動能，顯示設備需求在市場波動中仍具韌性。", "think": "在半導體設備領域，獲利成長是支撐股價的關鍵底氣。即便大盤修正，具備實質訂單支撐的公司仍有機會展現抗跌性，投資人可持續追蹤這類個股的法說會資訊。", "question": "在產業庫存調整期，能繳出亮眼財報的設備商，是否為你資產配置中的防禦性選擇？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610130278.aspx", "name": "中央社"}]}, {"title": "9月證交稅降溫　仍創下歷史新高", "teaser": "交易熱度趨緩，稅收仍豐", "full": "近期台股成交值出現降溫跡象，反映出市場追價力道減弱。儘管證交稅連三個月呈現月減趨勢，但在累積成交量的支撐下，整體稅收仍維持在歷史相對高檔區間。", "think": "成交量是市場人氣的溫度計，量縮代表市場觀望氣氛轉濃。對於投資人而言，這也意味著波動幅度可能隨流動性下降而放大，操作上需更嚴控資金水位。", "question": "當股市成交量從高點滑落，這是否暗示著市場資金正在進行新一輪的板塊調整？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610130256.aspx", "name": "中央社"}]}, {"title": "服務業人力吃緊　外籍勞動政策待鬆綁", "teaser": "缺工潮持續，產業面臨挑戰", "full": "服務業面臨嚴重的缺工困境，成為產業發展的一大瓶頸。企業界呼籲政府應放寬外籍勞動政策，以解決基層人力短缺問題，並維持服務品質與營運穩定性。", "think": "缺工問題將墊高服務業的經營成本，長期來看可能影響企業獲利能力。投資相關產業時，需觀察公司如何透過數位化或自動化來緩解人力不足的衝擊。", "question": "除了政策面，企業是否有其他自動化解決方案來應對長期的人口紅利衰退？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610130266.aspx", "name": "中央社"}]}], "robotics": [{"title": "和椿Q3營收破紀錄　AI伺服器需求旺", "teaser": "營收創新高，動能來自AI", "full": "和椿第三季營收繳出亮眼成績，寫下歷年單季新高紀錄。主要受惠於半導體設備與AI伺服器相關零件的強勁拉貨動能，顯示在自動化與AI基礎設施領域，該公司已成功卡位供應鏈核心。", "think": "AI伺服器與半導體是當前自動化產業的兩大引擎。和椿的業績表現證明，只要能搭上這波基礎設施建設的熱潮，即便整體市況波動，仍能維持強勁的成長動能。", "question": "你是否已將AI供應鏈中的設備與零組件業者，納入長期追蹤的觀察名單中？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiT0FVX3lxTFBsMUJ1VGVVYlJoR1JCSVVJRVRSN182S2ZNTGZzd3VtZGhfMUMtVnp2ZFoxbC1uRjJSMUd1WF9lclJ0YVRQbm5wcE55ZmNKMjg?oc=5", "name": "鉅亨網"}]}, {"title": "杭州工廠導入人形機器人　優化重複作業", "teaser": "自動化升級，人形機器人進廠", "full": "杭州一家汽車零件廠近日正式引進人形機器人，專門負責工廠內的重複性上下料作業。這項導入旨在提升生產線效率，並降低人工在重複性高、枯燥環境下的負擔，落實智慧製造目標。", "think": "人形機器人從實驗室走進工廠，象徵著自動化技術邁向更靈活的階段。未來工廠的勞動力結構將發生重大改變，低階重複性人力將加速被機器人取代。", "question": "隨著機器人進入生產線，企業的競爭優勢是否已從人力成本轉向技術整合能力？", "sources": [{"url": "https://news.google.com/rss/articles/CBMidEFVX3lxTE04em5ONHd3TEFmUXhkdGo3NTNiWXlJRlFITWM3MTBnUVpTUG1hRUZhd3NCMUg3eFV2LVo4dGtUZ3hudzRUQWF1dW8ySUNCLU50cFppZkhiT3E0VlU4N1JwbFBoa3M0dWs3QU9XOEdvU01PZXlh?oc=5", "name": "LINE TODAY"}]}, {"title": "聯卡中心數位服務　機器人客服上線", "teaser": "客服數位化，提升服務效率", "full": "聯卡中心不再單純依賴人工客服，近期正式上線「聯卡e客服」APP，並同步導入機器人服務系統。此舉不僅能提供24小時不間斷的諮詢服務，也能有效處理大量且重複的客戶查詢需求。", "think": "金融服務業導入機器人客服已成趨勢，這不僅是為了節省成本，更是為了提升客戶體驗的即時性。這類數位轉型案例，也為其他服務業提供了很好的參考範本。", "question": "當機器人客服成為標配，你認為哪種服務情境是AI短期內仍無法完全替代人類的？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTFBCUVBzQ2R2NUhNcXFpMnJVWklWeTRydFBUd3lZSGpUalljelN3ZzhTSi1qX2FyTWZkQldTbDBxclFFWWQ4bERmYldxU1poNzB3MUh1SXJJeTNNYVo5Qng00gFkQVVfeXFMTTRPMUQ2bERqRzRqM3lBc3JERWlVZ1FFWEhjNm1MX2FYbHd5dl9zVGxwTW9MT1llQ2hZM2VlLV9fa0RyN0oxNUR5ZHdRNUtkTzNYN0pUdnQ2ZjZyX0lza3J0UkVFNQ?oc=5", "name": "自由財經"}]}, {"title": "手術機器人市場展望　美股產業週報", "teaser": "醫療自動化，手術機器人潛力", "full": "手術機器人領域在醫療科技中持續扮演關鍵角色，指標性企業如ISRG、JNJ與MDT等皆在此領域深耕。隨著微創手術普及，手術機器人的滲透率與應用範圍正逐步擴大，成為長線投資焦點。", "think": "醫療機器人結合精密工程與AI，是少數具備高進入門檻的產業。對於投資人而言，這是一個結合人口老化紅利與科技創新的長線成長賽道，值得長期關注。", "question": "若醫療手術機器人能顯著提升存活率，你認為這類技術的普及會遇到哪些倫理或成本阻礙？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiWEFVX3lxTE11QkYyVHI0ZDNJZWtURnhJdkNSR2d2VEFmSkd1ZjNNOUppZURlTHVaaEJONnBmeEdhNXhsZHJ0ekxtanlVa3cyRmc1NVNRRUJUcTdoQjVVZ3g?oc=5", "name": "CMoney"}]}, {"title": "物理AI與人形機器人　AI下個發展階段", "teaser": "AI新趨勢，實體機器人崛起", "full": "業界普遍認為，物理人工智能與人形機器人將是AI發展的下一階段關鍵。隨著輝達等科技巨頭的布局，結合感知與實體操作的機器人，將能更靈活地在現實世界中執行各類複雜任務。", "think": "AI若僅存在於軟體中，影響力終究有限。當AI擁有了實體軀殼，將徹底改變製造、物流甚至居家服務的格局，這是未來十年最值得關注的科技趨勢。", "question": "你認為AI要進化到什麼程度，人類才會真正放心讓機器人進入家庭執行日常事務？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiugFBVV95cUxONDZwYWthaVo2cEg2dUdFSWpJaS1ZQjZFWEJEZnVsbW9Sa2dWVG9BOHo3N2ZubEF3WXNPYmpFeUpsSFlnbzY3S1lXZlg0NXZIU1NpaFVUWEtMbkRiRUdpYXpkMl96emxQSjVMQjRYZkVRZWRoR2tobW5NcmN1eUhqUE9lbG5NbVVWVlN6R3hac1VxcWhEWjhpY0Jyd0VYUlg3eWhkQkkxUHFneURGcGxiVW5DeWtsMC1Cd2c?oc=5", "name": "Moomoo"}]}], "tech": [{"title": "輝達AMD點火AI機櫃　散熱族群蓄勢待發", "teaser": "AI機櫃升級，散熱需求爆發", "full": "輝達與AMD近期持續推動AI機櫃規格升級，帶動800 VDC電源管理與高效散熱技術的需求大增。相關供應鏈業者正積極備戰，以應對未來更嚴苛的AI運算功耗與散熱挑戰。", "think": "AI算力提升必然伴隨著驚人的功耗，散熱與電源管理已成為AI伺服器的核心關鍵。這不僅是技術升級，更是供應鏈中含金量最高的環節之一。", "question": "在AI硬體競賽中，除了晶片本身，你是否也關注了背後提供穩定運作的基礎設施供應商？", "sources": [{"url": "https://technews.tw/2026/10/13/nvidia-amd-ai-server-rack-specs-emerge-800vdc-power-liquid-cooling-opportunities/", "name": "科技新報"}]}, {"title": "AI Agent進入LINE　訂閱會員享進階功能", "teaser": "LINE升級，AI助手更聰明", "full": "AI Agent正式整合進LINE聊天室，為使用者提供更智慧的互動體驗。訂閱制用戶可解鎖多項進階功能，將AI應用場景從單純的聊天延伸至個人生產力工具，提升日常處理事務的效率。", "think": "從搜尋引擎到通訊軟體，AI正全面滲透我們的數位生活。當AI成為聊天室的一部分，我們處理資訊的方式將從「主動搜尋」轉變為「AI協助篩選」。", "question": "隨著LINE導入AI功能，你覺得未來人與人之間的溝通，是否會因為AI的介入而產生質變？", "sources": [{"url": "https://infosecu.technews.tw/2026/10/13/line-converge-taiwan-2026-1/", "name": "科技新報"}]}, {"title": "華為下一代麒麟晶片就緒　摺疊技術演進", "teaser": "晶片技術突破，摺疊機再進化", "full": "華為宣告下一代麒麟晶片已準備就緒，將持續推動邏輯摺疊技術的演進。在晶片製造與硬體整合的雙重突破下，華為展現出在行動裝置市場中維持技術競爭力的決心，力圖打破外部封鎖。", "think": "華為在晶片端的持續投入，顯示其已建立起一套獨立的技術生態系。這對全球手機硬體市場的競爭格局，將產生深遠的影響，值得持續觀察其市佔率變化。", "question": "如果華為能穩定供應高階晶片，你認為這對全球智慧型手機供應鏈會帶來哪些結構性衝擊？", "sources": [{"url": "https://technews.tw/2026/10/13/huawei-next-gen-kirin-chip-ready-sustainable-logic-folding-evolution/", "name": "科技新報"}]}, {"title": "SpaceXAI推高CP值訂閱　打包Grok與Cursor", "teaser": "AI訂閱戰，整合服務成主流", "full": "SpaceXAI推出全新的「The X Subscription」方案，以高CP值打包Grok AI、Cursor程式開發工具與X平台特權。此舉旨在透過整合性服務，吸引更多開發者與重度AI使用者加入生態系。", "think": "AI訂閱市場競爭激烈，單一功能的AI工具已難以留住用戶。透過將開發工具與社群平台打包，SpaceXAI正試圖建立一個全方位的數位工作環境。", "question": "面對眾多AI訂閱方案，你認為整合性的工具包，還是單一專業功能的AI更具市場競爭力？", "sources": [{"url": "https://technews.tw/2026/10/13/spacexai-bundles-grok-cursor-and-x-features-into-unified-subscription-tiers/", "name": "科技新報"}]}, {"title": "iPhone Duo轉軸設計　隱藏散熱巧思", "teaser": "摺疊機熱點，散熱設計關鍵", "full": "針對傳聞中的iPhone Duo摺疊機型，外界關注其轉軸結構設計。最新消息指出，蘋果在轉軸處藏有特殊的散熱巧思，旨在解決摺疊機在狹窄空間下常見的過熱問題，提升裝置運作穩定性。", "think": "硬體設計的魔鬼在於細節，摺疊機因空間受限，散熱處理往往是產品成敗的關鍵。蘋果的設計思路，往往會成為後續產業跟進的參考標準。", "question": "如果手機摺疊後會犧牲散熱效能，你願意為了摺疊的便利性而妥協效能表現嗎？", "sources": [{"url": "https://technews.tw/2026/10/13/iphone-duo-graphite-pipe/", "name": "科技新報"}]}]}}</script>

<script>

  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
