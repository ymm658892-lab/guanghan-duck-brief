  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

成本。不過長遠來看，能源轉型成本仍是全民需共同面對的課題。", "question": "在追求能源穩定與控制財政支出的兩難中，你贊成政府持續補貼電價嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610180143.aspx", "name": "中央社"}]}, {"title": "星宇直飛布拉格載客率逾8成 拓展觀光助半導體供應鏈串聯", "teaser": "星宇捷克航線熱絡", "full": "星宇航空布拉格新航線載客率突破八成表現亮眼，除了帶動歐洲觀光熱潮外，捷克作為歐洲重要科技節點，航線開通更大幅增進台灣半導體工程師與供應鏈往返歐洲的便利性，促成台歐經貿深化。", "think": "航線開通不僅是旅遊商機，更是台廠全球化布局的基礎設施。台積電赴歐設廠帶動周邊聚落發展，台灣人才向海外延伸的舞台正越來越廣闊。", "question": "隨著台灣科技鏈走向歐洲，你是否也為自己在跨國供應鏈中的定位做好準備？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610180131.aspx", "name": "中央社"}]}], "robotics": [{"title": "人型機器人加速商業化 2030年智慧製造將佔出貨45%", "teaser": "人型機器人商業化", "full": "產業分析指出人型機器人正從實驗室快步邁向商業落地，預估到2030年智慧製造領域將佔據其全球出貨量的45%。隨著AI模型與運動控制成熟，工廠自動化已不再侷限於固定機械手臂，而是朝全功能人形發展。", "think": "製造業少子化與缺工是全球不可逆的痛點，人型機器人的普及將徹底翻轉產線生態。這提醒我們重覆性高、標準化的勞力將快速被自動化替代。", "question": "當工廠半數任務能由機器人承擔，未來製造業管理層最重視的核心技能會是什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMinwFBVV95cUxNT0VqOGlnY3hydk5oZ3FTZVZBZVc3amtmWF9qTUM3eFJZM0dFZGg2dk5rNF83NWwzLTUzRHg4OFl0SXlXVG5tYmR1ZS1EYnBIUmlvX1U2YVAzWWtnQmRrSmtJakd2ZnE1QzhWemkyM0hfd3lodHlxRUR5ajZMNTI1TmF2N3Uxb1dJaDRBWThSbmZlYjBpR1JUdW5ESXFYS1U?oc=5", "name": "電子工程專輯"}]}, {"title": "訂單能見度看到2027年Q3！精密傳動大廠搶攻CPO與機器人商機", "teaser": "機器人傳動鏈單長", "full": "國內精密傳動關鍵零組件大廠因卡位機器人關節與共同封裝光學（CPO）商機，訂單能見度已排至2027年第三季，前三季營收大幅成長。關鍵零組件技術門檻高，讓台廠在機器人浪潮中站穩全球供應鏈核心席位。", "think": "機器人熱潮並非只是軟體AI的狂歡，硬體機械結構如減速機、滾珠螺桿同樣不可或缺。投資時除了追捧演算法概念股，具硬技術的台灣隱形冠軍更值得長期追蹤。", "question": "在機器人產業鏈中，除了AI晶片外，你是否有關注台灣擅長的精密機械零組件？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiS0FVX3lxTE4yb0VLNEdkb0RRNmxwUzJFMVc1TzZzMUlrQ0FKWVJNTG5FT01RX1hUU2tqM1RvNkNzcGxLUnBtWWJKU09sQ2RNZ2JnZw?oc=5", "name": "FTNN 新聞網"}]}, {"title": "抗議搶人類飯碗 賓大退休教授阻止送餐機器人 當街被捕", "teaser": "阻機器人教授被捕", "full": "美國賓州大學一名退休教授因擔憂自動化將全面剝奪基層勞工飯碗，在街頭以肉身阻擋送餐機器人運行，最終遭到警方逮捕。這起事件引發社會對於機器人加速走入日常生活與勞工生計衝突的廣泛激辯。", "think": "自動化取代基層人力的衝突已從理論變成現實社會問題。科技演進的速度若大幅超越社會救助與勞工轉型機制，未來恐會引發更多科技倫理與社會反彈。", "question": "當科技便利與底層勞動權益發生正面衝突，社會該如何在進步與包容間取得平衡？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiYkFVX3lxTFBkTlFZX081c1ZOdmlKd1dxbnJPSG9haWt5alZKeDd5VkZxWlFrVHRfRXd6VEtVTWl6NndwOEVQVDJxZXZUMGlzUU04a2k2dFRpN3hGaEQ1Sk5FLXdyalFHYVZ30gFnQVVfeXFMT2JLME44Qm9MQlFYUDZlVjg2MEEzMHk3WmdRMlpFM28xc0JLem9CXzdQSzMxaGRZUzJTT0V4QUNieFMzak1CeEJSRTIxWnoyMWZpaE1weGVUVXMybld6UV9rakRGTXZmOA?oc=5", "name": "世界新聞網"}]}, {"title": "OpenAI衝刺機器人領域 鴻海等台廠供應鏈受惠", "teaser": "OpenAI結盟鴻海", "full": "OpenAI正積極重組並加速實體AI（Embodied AI）研發，力圖將先進大模型導入機器人硬體。市場傳出其與鴻海等具備全球製造量產能力的台廠洽談合作，藉此降低製造成本並實現快速規模化生產。", "think": "頂尖AI軟體巨頭終究需要硬體量產作為軀體，鴻海等電子代工巨擘的系統組裝實力再次成為國際大廠首選。這證明台灣在軟硬整合時代依舊具備難以取代的戰略價值。", "question": "AI大廠爭相涉足硬體，台灣代工龍頭能否藉此從代工升級為高附加價值的合作夥伴？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTFBRZGNFd1N6ZTRGOGN4TnhJT1RfWkt1QWRuTUhiMk9qcFVFVTBXQkJ1T1ZHbDI5NVdwUGpzaXY4eWpFOEtmdG9saUE1aF8zeS1m0gFWQVVfeXFMUDl2eEpxTzdGWkk2QTk2b2Rnb3MyUHE0Smk4VElpOVdDM2ZRZGJhcjZZQTNkTTZ6MERfcS1ULXNZaW1sajZFLXhjcUFWVDRfMXg4NTJlcWc?oc=5", "name": "UDN"}]}, {"title": "特斯拉上季獲利恐走下坡 市場更關注自駕小黃與機器人發展", "teaser": "特斯拉焦點在自駕", "full": "市場預期特斯拉即將公布的最新季度財報獲利恐因電動車價格戰而承壓，然而華爾街與投資人現階段更聚焦於其自駕計程車Robotaxi及Optimus人型機器人的具體量產進程，將其視為評估長期估值的核心指標。", "think": "純賣車的商業模式利潤正面臨極限，特斯拉正奮力將自己重新定義為AI與機器人公司。評估科技成長股時，市場願景與落地執行力往往比短期財報數字更能左右股價走向。", "question": "你認為機器人與自駕技術，何時能真正取代傳統電動車銷售成為企業獲利主力？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTFA2a01TalVVYmtLZHJJalpob3hpTUZXT0xHNjdNRGViUFpFN3FEM1M2bUcxV1BEalRxMmFkTTdaOWJsdzB6VjlMS01UWWtMaUpW?oc=5", "name": "UDN"}]}], "tech": [{"title": "高盛調升奇鋐目標價至4,736元 卻下修今年獲利預估", "teaser": "奇鋐目標價獲調升", "full": "高盛證券在最新報告中大幅調升散熱大廠奇鋐的長期目標價，但同時因短期出貨結構調整而小幅下修今年的獲利預估。法人看好水冷散熱在次世代AI伺服器中的不可替代性，長線成長動能依舊強勁。", "think": "法人對科技股的評價邏輯常展現「看長不看短」，短線營收認列的時間差不影響產業長線大趨勢。投資人解讀外資報告時，應釐清長期護城河與短期雜音的差異。", "question": "面對外資「調高目標價卻下修短期獲利」的報告，你習慣採取何種策略應對？", "sources": [{"url": "https://finance.technews.tw/2026/10/19/avc-target-price/", "name": "科技新報"}]}, {"title": "全球EV銷量7個月來首度縮減 呈現歐洲創新高、北美暴減態勢", "teaser": "全球電車銷量首縮", "full": "最新數據顯示全球電動車單月銷量遭遇7個月來首次萎縮，各地區表現呈現兩極化。歐洲受惠於新補貼政策銷量創歷史新高，而北美市場則受高利率與消費力道轉弱衝擊出現大幅衰退，全球車市轉型面臨波折。", "think": "綠能與電動車的普及並非一路向上，而是受到利率、政府補貼政策與充電基建多重制約。這顯示即使是大勢所趨的新能源產業，短期景氣循環依然不可輕忽。", "question": "在電動車滲透率出現區域分化的情況下，傳統車廠與造車新勢力誰更有抗跌底氣？", "sources": [{"url": "https://technews.tw/2026/10/19/global-ev-sales-contract-first-time-7-months-europe-record-north-america-plummets/", "name": "科技新報"}]}, {"title": "消息傳ASML可能進軍混合鍵合領域 設備廠貝思股價嚇跌", "teaser": "ASML傳踩封裝設備", "full": "市場傳聞半導體微影設備龍頭ASML有意跨足先進封裝的核心技術「混合鍵合」（Hybrid Bonding），消息一出衝擊現有封裝設備大廠貝思（Besi）股價重挫。先進製程微縮逼近物理極限，設備巨頭紛紛將觸角延伸至先進封裝領域。", "think": "半導體巨頭間的護城河正在打破，當摩爾定律放緩，先進封裝成為兵家必爭之地。企業唯有不斷創新、拓寬業務邊界，才能在巨頭跨界競爭的風暴中存活。", "question": "當上游設備巨擘開始搶食下游領域，原本專精單一環節的廠商該如何自保？", "sources": [{"url": "https://finance.technews.tw/2026/10/19/asml-besi-hybrid-bonding/", "name": "科技新報"}]}, {"title": "三成上班族用AI不敢說 怕效率翻倍反遭「加量不加薪」甚至裁員", "teaser": "三成上班族隱瞞AI", "full": "最新職場調查顯示，超過三成上班族在工作中使用生成式AI卻不敢向主管透露，主要擔憂效率翻倍後會被公司指派更多雜務，甚至引發被AI取代而遭到資遣的焦慮。這項數據揭露了數位轉型下的職場真實心態。", "think": "AI工具帶來了生產力躍升，但傳統KPI機制若未能跟上調整，容易導致員工產生防禦性行為。職場人應把省下來的時間投入於策略思考與溝通，讓個人價值難以被工具取代。", "question": "你在日常工作中會主動向主管展示AI帶來的效率提升，還是選擇低調使用？", "sources": [{"url": "https://technews.tw/2026/10/19/solution-ai-efficiency-worker-panic/", "name": "科技新報"}]}, {"title": "零下80度也能順利運作 NASA研發新型固態電池迎戰月球極端溫差", "teaser": "NASA研發固態電池", "full": "美國太空總署（NASA）成功研發出新型固態電池，即使在零下80度的極端低溫環境中仍能穩定運作，專為未來阿提米絲月球探測任務打造。這項材料突破未來若轉化為民用，有望解決極地及冬季電動車續航驟降的痛點。", "think": "航太尖端科技往往是民用技術突破的搖籃，極端條件下催生的高穩定性材料，通常會在數年後外溢至消費市場，值得持續留意下一代電池產業鏈的革新。", "question": "一旦耐低溫固態電池成功商業化，現有的鋰電池產業鏈將面臨怎樣的洗牌？", "sources": [{"url": "https://technews.tw/2026/10/19/nasa-develops-batteries-to-power-humanitys-return-to-moon/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-1300">{"date": "10月18日．週日", "tldr": "美股費半大跌加深台股補跌壓力，而AI與機器人創新持續加速；面對變革浪潮，上班族更應警惕能力幻覺以扎實底蘊。", "indicators": {"note": "美股費半走跌且台積電ADR受挫，台股盤中雖小幅抗跌，但短線仍須慎防國際科技股補跌震盪。", "tiles": [{"label": "台股加權指數", "value": "47,111.26", "valueClass": "rise", "delta": "+0.30%", "deltaClass": "rise"}, {"label": "那斯達克", "value": "26,140.03", "valueClass": "fall", "delta": "-2.14%", "deltaClass": "fall"}, {"label": "費半指數", "value": "11,137.29", "valueClass": "fall", "delta": "-3.83%", "deltaClass": "fall"}, {"label": "台積電ADR", "value": "412.61", "valueClass": "fall", "delta": "-2.28%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "費半指數續跌 法人看台股短線面臨補跌壓力", "teaser": "費半走弱提防台股補跌", "full": "受到美股費城半導體指數接連回檔修正影響，市場風險偏好轉趨保守。法人機構指出，儘管台股盤中表現相對抗跌，但在高檔震盪且國際科技股承壓下，短線仍需慎防外資調節引發的技術性補跌賣壓。", "think": "美股半導體走弱往往是外資調節台股權值股的先行信號。投資人在盤中不宜躁進追高，保留適度現金部位有助於應對短線震盪。", "question": "面對國際半導體回檔修正，你的投資組合是否已做好相應的風險控管？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610180030.aspx", "name": "中央社"}]}, {"title": "胡連成立50年首次國際併購 張子雄：開始打世界盃", "teaser": "汽配龍頭啟動跨國併購", "full": "台灣車用端子大廠胡連宣布啟動成立五十年來首次國際併購，展現布局全球市場的雄心。董事長張子雄表示，此舉將有助於加速打入歐美等海外車廠供應鏈，擴大國際市占率並提升長期毛利表現。", "think": "本土零組件廠透過跨國併購晉升為全球一階供應商，是擺脫代工低毛利的關鍵轉折。具備跨國整併與出海能力的傳產龍頭，長期營運韌性更值得期待。", "question": "當台灣本土製造業邁向全球整併，哪些供應鏈最具產業升級潛力？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610180025.aspx", "name": "中央社"}]}, {"title": "國銀外幣存款8月底破17.5兆元 續創新高", "teaser": "外幣存款規模再創新高", "full": "金管會最新統計顯示，國銀外幣存款餘額於八月底突破十七點五兆元大關，持續刷新歷史紀錄。主因在於市場對主要貨幣利率預期分歧，加上進出口廠商基於避險考量，傾向將充裕資金停泊於外幣高息帳戶。", "think": "外幣存款續創新高反映市場資金對匯率及全球景氣仍抱持觀望態度。上班族在賺取外幣利息時，需同步考量換匯成本與未來降息循環帶來的利差變化。", "question": "在外幣高利與匯率波動之間，你的資產配置如何取得最佳平衡？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610180061.aspx", "name": "中央社"}]}, {"title": "公股投信四合一邁步 拚10/22董事會通過", "teaser": "公股整併打造資產航母", "full": "財政部推動公股投信整合進入關鍵階段，四家公股投信整併案力拚於十月二十二日提報各自董事會決議。官方期望透過資源整合擴大資產管理規模，藉此強化在被動式ETF與財富管理市場的競爭力。", "think": "金融機構整併有助於壓低後台營運成本並提升產品研發規模。未來公股若能推出更具費率競爭力的投資商品，將有利於廣大定期定額 ng-gains-varied-by-experience/", "name": "科技新報"}]}, {"title": "25歲工程師捨微軟高薪 靠AI零資金創辦理財工具", "teaser": "捨高薪靠AI零資金創業", "full": "一名前微軟軟體工程師毅然放棄超過六百萬台幣的高額年薪，憑藉生成式AI輔助編碼與營運，以零外部資金創辦個人理財工具Treasury。這項案例展現出AI大幅降低了軟體開發與創業門檻，讓一人公司也能具備極高產能。", "think": "AI技術顯著壓低了軟體創業的初期資本門檻，「一人微型企業」正在成為現實。個人利基專業結合AI工具，將是未來職場個體戶最具爆發力的商業模式。", "question": "如果AI能替你承擔八成執行工作，你心中最具商業價值的點子是什麼？", "sources": [{"url": "https://finance.technews.tw/2026/10/18/engineer-leaves-microsoft-high-paying-job-for-ai-startup/", "name": "科技新報"}]}, {"title": "優達科技展示1.6T網路架構 動態實測驗證液冷散熱可行性", "teaser": "實測液冷驗證AI散熱", "full": "優達科技在OCP全球高峰會上展示最新1.6T AI高速網路架構，並透過動態實測驗證其先進液冷平台的散熱可行性。隨著AI算力爆發帶動晶片功耗飆升，超高速傳輸與高效液冷散熱已成為新一代資料中心不可或缺的基建。", "think": "AI軍備競賽已從純算力晶片擴展至高頻寬傳輸與極限散熱架構。具備完整高頻傳輸技術與液冷解方的台系網通零組件廠，產業前景持續看好。", "question": "隨著資料中心功耗逼近物理極限，液冷散熱何時能成為伺服器標準配備？", "sources": [{"url": "https://technews.tw/2026/10/18/ufispace-s9331-64ho3l/", "name": "科技新報"}]}, {"title": "蘋果：iPhone磁吸配件恐干擾鏡頭 影響對焦與防手震功能", "teaser": "磁吸配件恐干擾手機鏡頭", "full": "蘋果官方發布支援文件提醒用戶，部分第三方磁吸配件所產生的強大磁場，可能會干擾iPhone鏡頭內部的光學防手震與閉迴路自動對焦功能。消費者在選購保護殼或背貼支架時，應確認是否符合官方磁屏蔽規範。", "think": "現代智慧手機的微型精密光學模組對外在磁場極為敏感。在追求配件外型與磁吸便利之際，挑選符合原廠規範的配件才能避免無謂損害昂貴硬體。", "question": "在選購手機周邊配件時，你是否曾留意過其對手機精密功能的潛在干擾？", "sources": [{"url": "https://technews.tw/2026/10/18/why-strong-magnets-can-hinder-the-iphones-rear-facing-camera/", "name": "科技新報"}]}, {"title": "Fed前理事華許：AI是我一生中影響最深遠的經濟變革", "teaser": "華許看AI為最深遠變革", "full": "美國聯準會前理事、知名經濟學者華許公開表示，人工智慧帶來的生產力革命，堪稱他一生中所見過影響最深遠的經濟變革。他認為AI將深刻改變通膨結構、勞動力市場動態與全球長期潛在經濟產出成長率。", "think": "央行政策專家從長期宏觀生產力視角高度肯定AI，代表該技術並非短期炒作。長期來看，AI推動的生產力紅利有望抑制結構性通膨壓力。", "question": "若AI大幅提高全社會生產效率，未來的央行貨幣政策與利率格局將如何重塑？", "sources": [{"url": "https://technews.tw/2026/10/18/kevin-warsh-calls-ai-the-most-consequential-economic-shift/", "name": "科技新報"}]}]}}</script>

  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
