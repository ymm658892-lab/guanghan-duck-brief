  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

om.tw/news/aopl/202611240103.aspx", "name": "中央社"}]}, {"title": "中小企業導入 AI 低？經部助萬家轉型平均營收增 268 萬", "teaser": "AI 不只是大廠專利，中小企業轉型成效顯著。", "full": "經濟部積極推動中小企業導入 AI 應用，目前已協助超過一萬家企業進行數位轉型。根據最新統計，參與轉型的企業平均營收增加了 268 萬元，顯示 AI 技術在優化生產流程與提升行銷效率方面具有實質貢獻。政府計畫持續擴大補助範圍，解決中小企業在導入新技術時面臨的資金與人才缺口。", "think": "這對在中小企業上班的通勤族是個好消息，AI 轉型不再是口號，而是能帶來實質業績增長的工具。掌握 AI 應用能力，將成為未來職場上的核心競爭力。", "question": "在你的工作中，有哪些重複性的流程是可以透過 AI 優化來提升效率的？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611240140.aspx", "name": "中央社"}]}, {"title": "總統盃黑客松揭曉，AI 助高齡者辨識詐騙", "teaser": "科技溫暖人心，AI 成為守護長輩的新防線。", "full": "總統盃黑客松國際松卓越團隊名單揭曉，其中一項受矚目的應用是利用 AI 技術協助高齡者辨識電信與網路詐騙。該系統能即時分析通話內容與簡訊特徵，提供警示以防長輩受騙。這類應用展示了 AI 除了在商業領域發光熱，也能在社會安全與高齡照護領域發揮關鍵作用，提升整體社會韌性。", "think": "這讓我們看到科技的社會責任。對於家有長輩的上班族來說，AI 的普及將能有效減輕照護壓力並降低財產損失風險，科技的價值在於解決人類最真實的痛點。", "question": "除了防詐騙，你認為 AI 還能在哪些生活場景中提供高齡者實質的幫助？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611240114.aspx", "name": "中央社"}]}], "robotics": [{"title": "三星手機離線跑 AI 機器人，飛航模式下秒回信件", "teaser": "邊緣運算大突破，手機離線也能擁有強大 AI。", "full": "三星最新研發的離線 AI 聊天機器人，讓使用者即使在飛航模式或無網路環境下，依然能快速生成郵件回覆或處理文書工作。這項技術透過優化手機內部的 NPU 處理能力，實現了「邊緣 AI」的高效運作，大幅提升了行動辦公的隱私性與便利性，預計將引發新一波智慧型手機的硬體規格競賽。", "think": "對於時常需要出差或在移動中工作的通勤族來說，離線 AI 是效率救星。不再受限於網路訊號，意味著生產力可以隨時隨地爆發，這也是未來智慧終端的標配。", "question": "當 AI 可以完全在你的裝置上離線運行，你會更放心讓它處理機密文件嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMi5gJBVV95cUxQWTNabDFRQ2dBSVY3TGdEcUFBOG5oMEJfMjVjaVNXeUVGRWtyMlZ3b2hrSnNNRkJJeWZLUExfeTFhUkR2Vk1kWC1JWk94ZXN5Nld2ZzhGd0N5TzdONlFRVXJWU1dKenpSanE3aDZhSHFfYjRTWmQtR2lVS2lBSGFCckg1OVhpckpjdmtMOGt0aFl5UlI0M0psVWZxU0l1R3hTUnN4cTI1eUpEV1lHYUQwRkJycEM2MzBGTzI1MkRFTDdJajY3YUU0RlpoblB0UnlUb1JZMnFGWkRmeS16UkpLQTc1RENMUHVHQzFZdUhSb0lxdkVKLWlKeTM3cTRUTlJzbmFVd1ZpV3FMQllsVERuSHZRTm8tX2xtNWZfMnJzNXV0NFB3eGp0SmtfQms1akgwSjFLb3VxZ0V3RTBZdUZxd2ZlZzB3akpxc0xvbUZZelJzQzJVS3BoRTN6ellOeXd3Y3h4MTR3?oc=5", "name": "商傳媒"}]}, {"title": "攻半導體與機器人，東佑達布局下一波成長", "teaser": "本土廠商布局高階設備，鎖定機器人成長商機。", "full": "台灣傳動元件大廠東佑達積極轉型，將研發重心轉向半導體製程與機器人應用領域。公司透過全自製的技術優勢，切入高階自動化設備市場，力求在下一波 AI 機器人浪潮中佔據關鍵地位。東佑達目前的布局涵蓋了 CPO 光學封裝與人型機器人零組件，顯示台灣供應鏈正從單純代工轉向高附加價值的核心技術研發。", "think": "台灣在機器人硬體供應鏈中佔有優勢，這類「隱形冠軍」的轉型值得投資人留意。隨著全球對自動化需求提升，這些提供核心組件的廠商將是最大的受益者。", "question": "在 AI 軟體爆發後，你認為台灣的硬體優勢是否能成功轉化為機器人產業的領導力？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiggFBVV95cUxNVmE4WFAwOTVZcnR3N0RPNkxGOUlfeHI2YVp4NXplV1FOaHg5QlIteXYyczhLeUEzLTJWTGlRc3FjTFFBYjVsMEFwTTB5ZkoxQ0I3VGN5N2pwR0Y3cXJ0SDg0bldXMXZFUmh5ay0wcXRkUHo2b2w0engwNnBaVEVuX2tn?oc=5", "name": "MoneyDJ"}]}, {"title": "屈臣氏集團物流中心導入 AI 機器人，產能翻倍", "teaser": "零售物流自動化，機器人助攻電商配送效率。", "full": "屈臣氏集團宣布在其全球 55 座以上的物流中心大規模導入 AI 系統與自動化機器人。在比荷盧地區的試點顯示，導入後物流產能成功翻倍，顯著縮短了訂單處理時間。這套系統能精準預測庫存需求並自動分揀貨物，有效解決了零售業面臨的人力短缺問題，並提升了消費者在電商平台的購物體驗。", "think": "零售業的數位轉型已進入收割期。機器人不僅是工廠的專利，在倉儲與物流端的應用直接影響了我們的收貨速度，這也是零售股估值重塑的關鍵指標。", "question": "當物流效率因機器人而大幅提升，你對電商服務的期待是否也會隨之增高？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiekFVX3lxTE11QXdteEc5SXpyTUdKSmdNVUpfQWtGVlFNZzFYYWlUSVo4dVdkbnBoQk1GYVR2T2Z2OEMxbDRqRVNJZlJoSUhPU194MVVwb09tajdMOWppanN1NVBYdU5EeWRtcHJ2X2FQMjlsdkZKVkxOYmV2bmFKV1F3?oc=5", "name": "BigGo 財經"}]}, {"title": "三大指數續漲，人型機器人與半導體續強", "teaser": "市場熱錢湧向硬體，人型機器人成投資新寵。", "full": "近期全球股市表現強勁，其中人型機器人概念股與半導體板塊成為領漲主力。投資人看好 AI 演算法與機械硬體的深度結合，將使人型機器人從實驗室走向工廠甚至家庭。隨著感測器與馬達技術的成熟，相關供應鏈的訂單能見度大幅提升，帶動整體自動化產業的估值向上修正，市場對「AI 實體化」的期待達到新高點。", "think": "人型機器人是 AI 的終極載體。這不只是科技噱頭，而是解決全球勞動力缺口的長期方案。對於投資者來說，尋找能提供關鍵關節或感測元件的公司是目前的重點。", "question": "你認為人型機器人最快會在幾年內出現在我們的日常辦公室環境中？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxPS1YxWm95OFB4bDJwenlpVkxWdjNmZnRKcS00ZjFQWmJycVRST3BlY21vVVZFYXRYQnFmeFFsNjh1aXR1TzJHd3VUNDBibmtKQ0hFM2FTVHU2dU5IcWFhWm9weGZTZzVXOVBuRE1rRl8tSl9pTWliUDdsLVRXcXZwcU1yeGd6VGx2?oc=5", "name": "富聯網"}]}, {"title": "達發與東佑達通吃半導體與人型機器人商機", "teaser": "IC 設計與硬體強強聯手，搶攻高階設備市場。", "full": "聯發科旗下達發與東佑達展開深度合作，針對人型機器人與高階半導體設備開發專用晶片與傳動系統。透過「全自製」的策略，兩家公司旨在降低對國外技術的依賴，並提供客戶更高整合度的解決方案。這種跨領域的合作模式，被視為台灣科技業在 AI 時代保持競爭力的重要途徑，特別是在精準控制與高速傳輸領域。", "think": "IC 設計與精密機械的結合，是台灣發展機器人產業最強大的護城河。這種強強聯手的模式，能創造出更具競爭力的產品，對相關公司的營收展望有正面助益。", "question": "跨領域的技術整合是否會成為未來科技公司能否勝出的關鍵門檻？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiWEFVX3lxTE5JSE1FSnhHWDZfMFRKSVpHQWlCTnRsNWJJdDhBUzBfNE1ob2FPaGJFbUY0SnZoMjBXSXc1X1V1eWNsdVhZTWltZUFsOVdWZXdQcHo4UkRlYkU?oc=5", "name": "CMoney"}]}], "tech": [{"title": "黃仁勳回鍋有利開放模型？國安派若敗恐傷封閉 AI", "teaser": "AI 發展路線之爭，開放與封閉陣營的權力賽局。", "full": "黃仁勳重返輝達後，其對於 AI 生態系的態度引發討論。市場分析認為，黃仁勳傾向支持更開放的 AI 發展環境，這可能有利於開源模型的普及。然而，這也引起了注重國安與控管的「封閉派」擔憂。這場關於 AI 權力分配的爭論，將直接影響未來 AI 技術的監管走向以及科技巨頭之間的競爭格局。", "think": "AI 發展的方向決定了未來技術是掌握在少數巨頭手中，還是全民共享。對於開發者與企業用戶來說，開放模型意味著更低的成本與更高的彈性，值得持續關注。", "question": "你支持 AI 技術走向開源共享，還是應該由少數公司嚴格控管以確保安全？", "sources": [{"url": "https://technews.tw/2026/11/24/jensen-huang-return-benefit-open-models-national-security-faction-loses-harm-closed-ai/", "name": "科技新報"}]}, {"title": "Google 專利曝光 AI 個人化電視頻道「My Channel」", "teaser": "電視牆變身個人頻道，AI 打造專屬影音體驗。", "full": "Google 最新專利揭露了一項名為「My Channel」的技術，利用 AI 根據使用者的觀影習慣、興趣甚至當下情緒，自動生成專屬的電視頻道。這項技術打破了傳統頻道預排程序的模式，實現了真正的「千人千面」影音服務。AI 不僅負責推薦內容，還能自動剪輯與編排，讓電視成為真正了解使用者的個人助手。", "think": "這代表媒體消費習慣的徹底變革。未來我們不再是「選片看」，而是 AI 為我們「編排台」。對於內容創作者來說，如何進入 AI 的推薦池將是未來的獲利關鍵。", "question": "當 AI 幫你決定所有收視內容，你會擔心陷入資訊繭房，還是享受這種極致的便利？", "sources": [{"url": "https://technews.tw/2026/11/24/google-wants-to-make-ai-tv-shows-starring-you/", "name": "科技新報"}]}, {"title": "日本 DeNA 推出 AI 社員服務，首創加班上限控管用量", "teaser": "AI 也不能過勞？創新的 Token 用量管理模式。", "full": "日本科技公司 DeNA 推出「AI 社員」外派服務，特別的是該服務首創了「加班時間」上限，透過控管 Token 用量來模擬人類的工作節奏與成本支出。這項設計旨在幫助企業更合理地分配 AI 資源，避免無止盡的運算成本浪費。這種將 AI 擬人化的管理模式，為企業導入數位勞動力提供了一種全新的思考框架與成本控制方案。", "think": "這是一個非常有趣的日本式創新。將 AI 當作「社員」管理，不僅是成本控管，也是在重新定義人機協作的關係。對上班族來說，學會管理你的 AI 同事將是新技能。", "question": "如果 AI 也有「勞基法」限制工作量，你會如何重新規劃你的工作流程？", "sources": [{"url": "https://technews.tw/2026/11/24/dena-ai-employee-services/", "name": "科技新報"}]}, {"title": "Supermicro 全快閃儲存伺服器出貨，助力 AI 訓練", "teaser": "硬體效能再進化，PCIe Gen 6 提升 AI 算力。", "full": "美超微（Supermicro）宣布首批搭載 PCIe Gen 6 技術的全快閃儲存伺服器開始出貨。這款伺服器專為 AI 訓練與推理設計，能提供極高的資料傳輸速度與低延遲表現，有效解決 AI 模型在處理海量數據時的瓶頸。隨著 AI 模型規模不斷擴大，硬體設備的更新速度成為決定 AI 研發進度的關鍵因素。", "think": "硬體更新是 AI 發展的基石。美超微的技術突破顯示出伺服器市場競爭依然激烈，對於追求極致效能的企業來說，這類高階硬體是維持領先的必要投資。", "question": "在軟體不斷進化的同時，你是否意識到背後支撐這一切的硬體設備正在經歷革命性的變革？", "sources": [{"url": "https://technews.tw/2026/11/24/supermicro-petascale-all-flash-server/", "name": "科技新報"}]}, {"title": "黃仁勳重返輝達股價狂飆，川普帳面獲利達 4.9 億元", "teaser": "科技與政治交織，領袖回歸帶動股價財富效應。", "full": "黃仁勳重返輝達的消息不僅令科技圈興奮，也意外揭露了其政經影響力。隨著輝達股價應聲狂飆，相關持股者的帳面價值水漲船高，據傳川普相關資產的帳面獲利最高達 4.9 億元。這一現象反映出市場對於科技巨頭與政策走向之間的高度敏感，也顯示出輝達作為全球 AI 指標股，其股價變動具有強大的財富外溢效應。", "think": "這則新聞突顯了科技股如何影響全球政經版圖。當科技公司的波動足以影響政治人物的財富或國家政策時，投資者更應關注科技巨頭在政治遊說與法規遵循上的動作。", "question": "當科技股的影響力跨越國界與政壇，你認為這對市場長期穩定是好事嗎？", "sources": [{"url": "https://finance.technews.tw/2026/11/24/jensen-huang-comeback-nvidia-stock-surge-trump-profit-490-million/", "name": "科技新報"}]}]}}</script>

    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
