  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

運階段。對市場來說，算力租賃服務業者的短期營收成長可能面臨檢視。", "question": "科技巨頭從擴張算力轉向成本控管，會如何影響未來雲端市場的競爭格局？", "sources": [{"url": "https://www.cna.com.tw/news/ait/202611070005.aspx", "name": "中央社"}]}, {"title": "美國10月大增16萬5000名就業人口 添聯準會升息壓力", "teaser": "就業市場火熱添升息隱憂", "full": "美國10月新增非農就業人口達16.5萬人，表現相當亮眼，但也引發市場對勞動力市場持續過熱的焦慮。強勁的就業數據可能讓聯準會（Fed）在貨幣政策上維持偏鷹態度，增加未來調升利率的壓力。", "think": "經濟數據好壞往往是雙面刃，雖然證明景氣不差，但也推遲了資金寬鬆的時間點。投資人在佈局時應注意利率環境高企對高估值股票的壓抑效果。", "question": "當強勁的經濟數據成為升息理由時，你該如何調整高權重資產的配置？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202611060360.aspx", "name": "中央社"}]}], "robotics": [{"title": "Anthropic機器人報告：接管34%工作但比人工便宜者不足1%", "teaser": "機器人接管工作成本仍偏高", "full": "Anthropic發布最新研究報告指出，現行AI與機器人技術已具備接管全美34%工作的能力。然而在實際經濟考量下，目前部署機器人比雇用真人更便宜的情形卻不到1%，顯示成本問題仍是普及最大障礙。", "think": "這意味著短時間內「機器人搶走工作」的全面性威脅不會立即發生。企業在引進自動化時，不僅看重技術可行性，更著重於長期投資報酬率。", "question": "你認為自己的工作領域中，有哪些環節是機器人「成本效益最低」而無法取代的？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTE54N1V1SWNhYjJDWUJxdHVNcjYyYVFYTE1nbEFQd1hnbUR2N0ZkOUZQbjRsUVI1ejBZS1pkaEVwaUkwQjhMb2RwMWc3OGVNZkhMS2poU3hWY2pzWUV6MS1HV0s2RjhYT0xybFE?oc=5", "name": "TechOrange 科技報橘"}]}, {"title": "自主移動機械臂機器人市場展望2035：倉儲自動化推動擴張", "teaser": "缺工潮推升移動機械臂需求", "full": "根據研調機構統計，隨著全球物流倉儲自動化需求激增與全球缺工議題加劇，自主移動機械臂（AMMR）市場正迎來加速擴張期。預計至2035年前，該領域將成為自動化設備產業的成長核心。", "think": "缺工是不可逆的全球趨勢，這為工業與物流自動化硬體廠商帶來長期的穩定訂單。投資自動化供應鏈相關標的，是掌握長期人口紅利消退題材的好方向。", "question": "面對自動化倉儲與物流的普及，你認為傳統人力勞動將如何轉型？", "sources": [{"url": "https://news.google.com/rss/articles/CBMijgJBVV95cUxNMjN0dWtYOGZnWUdZUVpIaWNjY2JLRE5nNklfXzBHRmhHSmpXVklCSjVCRVg5ampxOW1veVRVYjVKUWtQMHJ0UkVGa3RsNks1QVBnckcybUhYSjRHMnpNa3VsY1pCeFN6TzBDa0FoU0dqYTJpOF9McFRCWkhmREpkTG1vTmc2SmVDcDdZTzlCc3lSZ1l5Y1V4YjNsSnB2RV9ENmhQcGlRWERxSHVqY1pEZTdtY0MzMFRRcGNLQzEtQUYzRDItd0gxS18yclJrVXVtc09oSmhyXzgyUjlaQU12UGRNeHhfT1NDNm5pbEFIZVR6Mk9LSTAxMU1lWFRVUWl4ZUtfZEpqMGlydnViMkE?oc=5", "name": "IndexBox"}]}, {"title": "特斯拉證實明年停產Cybertruck！全面押注自駕與機器人", "teaser": "特斯拉停產車款轉戰機器人", "full": "特斯拉官方證實將於明年停產皮卡Cybertruck，將公司所有核心資源轉向全力開發全自動駕駛（ l": "AI巨頭Anthropic儘管在過去半年內大幅虧損約800億元，但其估值依然逼近2兆台幣，並積極籌備挑戰歷史上規模最大的IPO。這場豪賭反映出投資人對高研發成本與龐大市場前景的極致博弈。", "think": "這是典型的科技高成長股策略——以短期鉅額虧損換取絕對的技術與市場領先地位。對公開市場投資人來說，未來的獲利模式將是最大的考驗。", "question": "面對高虧損卻擁有極高估值的科技獨角獸，你會選擇參與其IPO嗎？", "sources": [{"url": "https://finance.technews.tw/2026/11/07/anthropic-2-trillion-market-cap-biggest-ipo-challenge-wall-street-nervous/", "name": "科技新報"}]}, {"title": "矽谷 AI 領袖「效率至上」文化與大眾經驗脫節 難造貼近消費者產品", "teaser": "AI產品設計脫離大眾真實需求", "full": "業界評論指出，矽谷科技領袖普遍奉行極致的「效率至上」工程文化，導致研發出的AI產品往往與一般大眾的日常生活經驗脫節。這種思維落差使AI產品在邁向大眾化消費市場時面臨不少推廣障礙。", "think": "科技進步不能只留在工程師的同溫層裡，真正成功的產品必須具備同理心與便利性。上班族在挑選工具時，應以能否解決自身痛點為優先考量。", "question": "在日常生活中，你覺得目前哪些AI工具太過工程化、不夠貼近一般人？", "sources": [{"url": "https://technews.tw/2026/11/07/ai-execs-may-be-too-out-of-touch-to-build-for-the-general-public/", "name": "科技新報"}]}, {"title": "輝達要求台積電進軍先進記憶體？傳組建 3D DRAM 產線解缺貨荒", "teaser": "輝達攜台積電解算力記憶體瓶頸", "full": "傳出輝達為解決高階AI晶片面臨的記憶體供不應求問題，積極促成台積電組建專屬的3D DRAM產線。若消息屬實，這將加速高頻寬記憶體與先進封裝技術的深度融合，解決產能缺口。", "think": "AI運算的真正瓶頸往往在於資料傳輸與記憶體頻寬。兩大巨頭的深度合作，代表未來半導體產業將更朝向高度客製化與一站式整合邁進。", "question": "當先進封裝與記憶體整合成為趨勢，傳統單獨設計晶片的模式是否會逐漸式微？", "sources": [{"url": "https://finance.technews.tw/2026/11/07/3d-dram/", "name": "科技新報"}]}, {"title": "聯發科 AI ASIC 第四季營收上看 25 億美元 蔡力行：投資回收仍有過渡期", "teaser": "聯發科ASIC看升但提醒回收期", "full": "聯發科執行長蔡力行表示，公司客製化晶片（AI ASIC）第四季營收表現強勁，上看25億美元。但他同時提醒，整體產業對AI的龐大投資在轉化為實質回報的過程中，仍需要一段過渡期的沉澱。", "think": "晶片大廠的看法相當務實——硬體銷售搶先實現營收，但終端應用要產生足夠效益需要時間。投資人在看好晶片股之餘，也要對應用端的落地速度保持耐性。", "question": "面對科技巨頭資本支出龐大、回收期漫長的情況，你該如何保持長期投資的定力？", "sources": [{"url": "https://technews.tw/2026/11/07/mediatek-rick-tsai-reveals-the-truth-about-ai-investment/", "name": "科技新報"}]}]}}</script>

    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
