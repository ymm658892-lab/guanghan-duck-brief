  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

<script type="application/json" id="slot-1300">{"date": "10月4日．週日", "tldr": "台股法說會接力登場，輝達與鴻海大秀AI機器人組裝實力，帶動科技與金融板塊維持穩健盤堅格局。", "indicators": {"note": "美股與台積電ADR強勢領漲，帶動台股維持高檔震盪，多頭氣勢依然強勁。", "tiles": [{"label": "台股加權指數", "value": "48,475.74", "valueClass": "rise", "delta": "+0.25%", "deltaClass": "rise"}, {"label": "那斯達克", "value": "27,190.86", "valueClass": "rise", "delta": "+1.19%", "deltaClass": "rise"}, {"label": "費半指數", "value": "13,136.67", "valueClass": "rise", "delta": "+2.40%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "472.78", "valueClass": "rise", "delta": "+2.96%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "面板雙虎力拼轉型，法人聚焦先進封裝技術新進展", "teaser": "面板雙虎跨界封裝迎新契機", "full": "台灣面板大廠群創與友達積極推動轉型，將既有廠房技術延伸至半導體先進封裝領域。法人高度關注其扇出型面板級封裝（FOPLP）的最新進展，這不僅能活化舊世代產線，更有望為公司注入全新的成長動能，翻轉市場對面板業的傳統印象。", "think": "面板產業從傳統的景氣循環股，努力跨足高科技半導體封裝。這啟示我們，成熟企業若能靈活運用既有資產進行「異業轉型」，就能在紅海中找到全新藍海，散戶投資人也應重新評估其長期轉型價值。", "question": "當傳統產業開始跨足高科技半導體，你會如何重新評估這類轉型股的投資價值？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610040107.aspx", "name": "中央社"}]}, {"title": "台電澄清現階段無電價調整規劃，盼國會支持追加預算", "teaser": "台電暫無調價計畫盼預算過關", "full": "面對外界對電價波動的疑慮，台電表示目前並無進一步調整電價的規劃，並強調先前調整已考量民生穩定。台電期盼國會能順利通過追加預算案，以維持電網穩定與財務健全，確保國內產業與民生用電無虞。", "think": "電價與國內通膨和企業營運成本息息相關。台電承諾暫不調整電價，能讓大眾與企業暫時鬆一口氣，但也提醒我們能源成本仍是長期隱憂，投資時需多留意高耗能產業的應變能力。", "question": "面對長期能源轉型與電價波動，你的投資組合中是否已做好因應高通膨的準備？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610040104.aspx", "name": "中央社"}]}, {"title": "金融三業前8月稅前大賺1.17兆，超越去年全年紀錄", "teaser": "金融業賺翻！前八月獲利創高", "full": "台灣金融三業（銀行、證券、保險）今年前8月累計稅前盈餘達1.17兆元，不僅表現亮眼，更直接超越去年全年紀錄。這主要得益於台股上半年行情熱絡，帶動財富管理手續費、證券經紀業務及投資收益大豐收。", "think": "金融股一向是存股族的最愛，今年亮眼的獲利表現，預期將反映在明年的股利配發上。對於追求穩定配息的上班族來說，這是一個進場佈局或持續抱緊優質金融股的強烈訊號。", "question": "金融業獲利創新高，你會選擇在此時加碼金融股，還是獲利了結轉投其他標的？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610040090.aspx", "name": "中央社"}]}, {"title": "數發部推百億AI投資方案，開放主要營運在台境外公司納投", "teaser": "百億AI基金放寬境外公司投資", "full": "數位發展部積極推動百億元規模的AI產業投資方案，為了吸引更多國際資源，宣布放寬限制，只要主要營運地在台灣的境外公司，也有機會納入投資對象。此舉旨在加速本土AI生態系的國際化與技術升級。", "think": "政府祭出實質資金扶持AI產業，並擴大投資對象，將吸引更多外資與新創技術落地台灣。這對於台灣整體的軟體與AI應用供應鏈是長期利多，上班族可多留意相關AI新創或協力廠商的發展。", "question": "政府百億資金助攻AI，你認為這會為台灣的軟體產業帶來怎樣的質變？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610040029.aspx", "name": "中央社"}]}, {"title": "台股重量級法說會接力登場，法人預估盤勢將震盪盤堅", "teaser": "重量級法說登場，台股震盪盤堅", "full": "隨著第三季進入尾聲，台股多檔重量級指標股的法說會即將陸續召開。市場法人普遍認為，雖然短期內仍會受到國際局勢與總體經濟數據影響而出現波動，但整體基本面依然強韌，大盤可望呈現震盪盤堅的格局。", "think": "法說會是檢視企業基本面與未來展望的試金石。在震盪盤堅的行情中，建議投資人切忌追高殺低，應趁著盤勢拉回時，分批佈局法說展望佳、具備實質基本面支撐的績優股。", "question": "面對即將到來的法說會旺季，你準備好如何調整手中的持股比例了嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610040026.aspx", "name": "中央社"}]}], "robotics": [{"title": "記憶體成硬通貨、機器人搶進產線，算力巨頭展開激烈競爭", "teaser": "算力巨頭爭奪記憶體與機器人", "full": "隨著AI算力需求爆發，記憶體已成為市場上的關鍵硬通貨，各大科技巨頭紛紛展開搶購。與此同時，自動化機器人也加速導入製造產線，引發算力巨頭在硬體與供應鏈上的激烈競爭，推動產業技術快速更迭。", "think": "記憶體與機器人的需求暴增，顯示AI硬體競賽已從小眾研發走向大規模工業應用。身為投資人，我們應將目光投向這些關鍵零組件與設備供應商，因為它們才是這場AI軍備競賽中穩賺不賠的「賣鏟人」。", "question": "當機器人與高階記憶體成為產線標配，你認為哪一個供應鏈環節最具有長期投資價值？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiSEFVX3lxTFB0bmotNVVqajlZWXh3NWJ0cTZKeUptQTV5RTY0QlpiTmJIOWVIZ1dfVlotblY1OVQyNU9PRER4MUVRbXFheTM5Ng?oc=5", "name": "鉅亨號"}]}, {"title": "鴻海導入機器人進行AI伺服器組裝，量產出貨有望帶動營收", "teaser": "鴻海機器人組裝AI伺服器迎量產", "full": "鴻海積極將機器人技術導入高階AI伺服器的組裝產線，力求提升生產效率與良率。市場與法人高度關注，這項高度自動化的生產模式在進入大規模量產出貨後，能否顯著降低成本並進一步拉抬鴻海整體的營收與毛利率。", "think": "鴻海身為代工龍頭，率先將機器人應用於最複雜的AI伺服器組裝，這是製造業升級的重要指標。若能成功量產，不僅能鞏固其代工霸主地位，也為台灣的智慧製造與工業機器人產業注入強心針。", "question": "鴻海利用機器人提升組裝效率，這會如何改變未來全球電子代工業的競爭版圖？", "sources": [{"url": "https://news.google.com/rss/articles/CBMihwFBVV95cUxOQzlrc3E5NGxQMFFtcTItQ0cwOTZwS2dzOUdIeFNzLXZJNGV0aWQ2WHJYTHNmY0VSWmlXYnVEN1dlVmx1U0FHYU13MGNCUUJYTWVkdFdRcEVVN25kTFdPTWtrRzRZNlNaLVNrU0xDRi1TRUZRZmp5YUdtdm5ielZvTVNnTTYyQXc?oc=5", "name": "CMoney投資網誌"}]}, {"title": "輝達與鴻海大秀AI伺服器自動化組裝，機器人組裝成功率逾95%", "teaser": "輝達攜手鴻海展示機器人組裝", "full": "輝達與鴻海強強聯手，展示了全新AI伺服器GB300的自動化組裝實力。透過先進的AI與機器人技術，目前組裝成功率已順利突破95%，大幅降低了人工組裝的失誤率，向全面智慧化生產邁出關鍵一步。", "think": "組裝成功率突破95%代表機器人已具備處理極度精密工業組裝的能力。這不僅能解決高階製造業勞動力短缺的問題，也揭示了「AI設計、機器人生產」的未來工廠模式已經離我們不遠。", "question": "當機器人組裝精密伺服器的成功率超越人類，未來勞動市場將面臨怎樣的轉型挑戰？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiT0FVX3lxTFBLRkFTbldGemI2dHJZZjM5NkZXVWFZX1VmaHBQRk1YUTJQQUtac1JwOUY3SXdTbnRrQjR4QjR5bHl0ZmtFbFRfVHNiazBvYlE?oc=5", "name": "news.cnyes.com"}]}, {"title": "Figure AI機器人跳熔爐自毀，阿諾現身重現魔鬼終結者", "teaser": "機器人重現魔鬼終結者自毀經典", "full": "知名機器人公司 Figure AI 釋出最新影音，展示其人形機器人模擬經典電影《魔鬼終結者》跳入熔爐自毀的畫面，甚至連主角阿諾史瓦辛格也驚喜現身。此舉成功吸引全球眼球，展現了機器人極高的肢體協調度。", "think": "這場極具創意的行銷活動，不僅拉近了前沿科技與大眾的距離，也展現了人形機器人在動作模仿與精準控制上的驚人進步。科技不再只是冰冷的代碼，軟性的文化行銷更能激發大眾對未來科技的無限想像。", "question": "看到人形機器人完美重現電影經典畫面，你認為機器人走入日常生活的日子還會遠嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiT0FVX3lxTE9JbUdCUS14bWN3dzFIMVBSRkY0SDRHTk4xUERRbWpCZS1ubVVIVTN1Ym9tcUwyQVN5Z3I1RkNaVW5icGQ0eVpKZFpFV3NjeWM?oc=5", "name": "TVBS新聞網"}]}, {"title": "巡邏機器人撞爛20盆花，慘遭停職關入箱子", "teaser": "巡邏機器人出包撞花慘遭停職", "full": "一台負責社區安全維護的巡邏機器人，在執行任務時疑似系統異常，竟失控撞爛了路旁的20盆裝飾花卉。這起令人啼笑皆非的意外導致該機器人當場被「停職處分」，並被關回紙箱中等待工程師進行檢修。", "think": "雖然AI與機器人技術日新月異，但這起「撞花事件」幽默地提醒我們，機器人在複雜的現實環境中仍有許多盲點與極限。在完全信任自動化系統之前，人類的監督與即時介入依然不可缺。", "question": "巡邏機器人也會「出包被停職」，這是否讓你對目前的自動化技術多了一分理性思考？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiigFBVV95cUxNWTJPWUx4S0ExUGNTYTNHYjBJcTY5MVRaaUo4SDFrcVR2blBvQnhBNG4tQlRJX2xCQm50VTRFZGFVVjE2T3I1Rkk4UkVCQ1ZySE5FdEZNUmhhNDA0dGgydmR4dkZUYVZtOUlsbDhLa2ZEZkFtVjItTU5nNlE4QXphZ3h1ckFnbjJKVFE?oc=5", "name": "壹蘋新聞網"}]}], "tech": [{"title": "美國 FDA 推動法規轉型，以器官晶片與電腦模型取代動物實驗", "teaser": "FDA推器官晶片取代動物實驗", "full": "美國食品藥物管理局（FDA）正積極推動生醫法規轉型，計畫逐步採用先進的「器官晶片」與電腦模擬模型，來替代傳統的動物實驗。這項變革不僅能提高藥物研發的精準度，還能大幅縮短新藥開發的時間與成本。", "think": "器官晶片結合了半導體技術與生物醫學，是極具潛力的跨領域新星。這項法規的轉變將催生龐大的晶片生醫市場，對於尋求長期生技與半導體跨界機會的投資人來說，是個值得提早佈局的藍海領域。", "question": "當器官晶片能完全模擬人體反應，你認為這會對全球生技製藥產業帶來多大的顛覆？", "sources": [{"url": "https://technews.tw/2026/10/04/tech-to-replace-animal-testing-is-almost-ready/", "name": "科技新報"}]}, {"title": "法軍打造自主 AI 空戰架構，2028 年測試戰機與無人僚機協同", "teaser": "法軍2028測試AI無人僚機協同", "full": "法國軍方正致力於建構自主的AI空戰系統，預計於2028年正式進行載人戰機與AI無人僚機的協同飛行測試。這項技術旨在利用AI分擔飛行員的戰術決策壓力，並大幅提升空戰中的生存率與作戰效率。", "think": "國防軍工一向是前沿科技的最強推手。AI從輔助駕駛走向戰場協同，顯示軍工產業的智慧化已成不可逆趨勢。相關的軍用航太、無人機與高階晶片供應鏈，在未來幾年將持續獲得各國政府的預算挹注。", "question": "AI無人僚機即將進入實戰測試，你認為這對未來的全球地緣政治與軍工產業投資有何啟示？", "sources": [{"url": "https://technews.tw/2026/10/04/french-air-force-is-building-its-own-military-ai-systems/", "name": "科技新報"}]}, {"title": "AI 時代的禮儀與邊界，人類監督與透明揭露成為核心價值", "teaser": "AI時代的核心在人類監督與透明", "full": "隨著生成式AI深入日常生活，業界開始反思AI的「禮儀」與使用邊界。專家指出，無論AI技術多麼發達，人類的最終監督與對AI生成內容的透明揭露，才是確保科技不被濫用、維持社會信任的核心價值。", "think": "身為職場通勤族，我們在享受AI帶來便利的同時，也必須學會如何「合規且誠實」地使用它。懂得在工作中適度發揮AI優勢、同時保持人類獨特的批判思考與責任感，才是未來職場不被淘汰的關鍵。", "question": "在日常工作中使用AI時，你是否會主動向主管或客戶揭露這份內容是由AI輔助生成的？", "sources": [{"url": "https://technews.tw/2026/10/04/the-rules-of-ai-etiquette/", "name": "科技新報"}]}, {"title": "仁寶亮相 OCP 全球峰會，展示輝達 AI 工廠基礎設施方案", "teaser": "仁寶秀輝達AI工廠基礎設施", "full": "代工大廠仁寶電腦在 OCP 全球峰會上大放異彩，現場展示了與輝達合作開發的 AI 工廠基礎設施解決方案。仁寶藉此展現其在高效能運算、冷卻技術與伺服器設計上的硬實力，積極搶攻下一波AI資料中心建置商機。", "think": "仁寶從傳統筆電代工成功轉型，跨足高毛利的AI伺服器與基礎設施領域，並緊抱輝達大腿。這證明了台廠在AI供應鏈中無可替代的製造實力，也為尋求轉型題材的投資人提供了絕佳的觀察範本。", "question": "看到老牌代工廠仁寶在AI工廠領域的突破，你是否對台股電子代工板塊的轉型更有信心了？", "sources": [{"url": "https://technews.tw/2026/10/04/compal-2026-ocp/", "name": "科技新報"}]}, {"title": "搭車狂刷短影音不戴耳機，通勤族最痛恨的擴音公害為何越來越多", "teaser": "通勤族痛恨的擴音公害為何變多", "full": "許多通勤族在搭乘大眾運輸時，常遇到旁人毫無顧忌地擴音播放短影音，形成新興的「擴音公害」。專家分析，短影音的成癮機制讓使用者專注於螢幕，進而忽略了周遭環境與公共禮儀，造成大眾社交邊界的崩解。", "think": "這則新聞簡直說中了所有通勤族的心聲！科技的便利有時會伴隨著公德心的退化。在碎片化訊息轟炸的時代，我們更需要學會在公共空間保持自律與尊重，這也是維護職場人際關係與個人品牌的一種無形修養。", "question": "面對車廂內越來越多的「擴音公害」，你會選擇默默忍受、戴上抗噪耳機，還是主動出聲勸阻？", "sources": [{"url": "https://technews.tw/2026/10/04/why-do-so-many-people-watch-videos-in-public-without-headphones/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-2000">{"date": "10月4日．週日", "tldr": "週日晚間國際與科技動態頻傳，輝達與鴻海聯手推機器人組裝，美股與台積電ADR強勢，為新一週台股注入樂觀期待。", "indicators": {"note": "指標顯示美股科技盤與台積電ADR強勢，為即將開盤的台股奠定樂觀基調，反映AI供應鏈仍是市場領合羊。", "tiles": [{"label": "台股加權指數", "value": "48,475.74", "valueClass": "rise", "delta": "+0.25%", "deltaClass": "rise"}, {"label": "那斯達克", "value": "27,190.86", "valueClass": "rise", "delta": "+1.19%", "deltaClass": "rise"}, {"label": "費半指數", "value": "13,136.67", "valueClass": "rise", "delta": "+2.40%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "472.78", "valueClass": "rise", "delta": "+2.96%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "輝達鴻海合作自動化機器人組裝 提升GB300成功率", "teaser": "雙強聯手再創AI新巔峰", "full": "輝達與鴻海宣布深化合作，導入自動化機器人技術進行GB300伺服器的組裝，藉此提升生產良率與效率。這項合作不僅展現台灣代工龍頭在AI硬體製造的領先地位，也為供應鏈自動化轉型立下新標竿。", "think": "這代表AI硬體製造正走向高度自動化，能有效解決高階晶片組裝的良率瓶頸。對於投資人而言，鴻海等供應鏈核心成員的技術護城河將更為穩固，值得長期關注。", "question": "自動化生產比重提升，對台股電子代工板塊的毛利率會有什麼長遠影響？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610040183.aspx", "name": "中央社"}]}, {"title": "金融三業前8月稅前大賺1.17兆 創歷史新高", "teaser": "金融業獲利大爆發創新高", "full": "台灣金融三業今年前8個月累計稅前盈餘高達1.17兆元，提前改寫歷史全年新高紀錄。這主要得益於台股上半年表現亮眼、投資收益豐厚以及財富管理業務的強勁成長。", "think": "金融股作為台股的穩定器，今年獲利創高意味著明年的配息空間相當可期。對於追求穩定股息的通勤族與存股族來說，此時正是檢視金融股配置的好時機。", "question": "在金融業獲利創高後，你是否會調整手中存股標的的分配比例？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610040090.aspx", "name": "中央社"}]}, {"title": "台股重量級法說會登場 法人預期震盪盤堅", "teaser": "法說會旺季引領台股風向", "full": "台股即將迎來多場重量級企業法說會，市場法人預期在基本面支撐與國際市場回溫下，大盤將呈現震盪盤堅的格局。投資人此時高度關注各大廠對第四季與明年第一季的營運展望。", "think": "法說會是檢視企業真實業績與未來前景的試金石，其釋出的訊息往往決定個股的中長期走勢。建議上班族投資人保持耐心，避免在法說會前過度追高。", "question": "面對即將到來的法說會震盪，你的投資策略是觀望還是逢低布局？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610040026.aspx", "name": "中央社"}]}, {"title": "面板雙虎轉型 法人聚焦先進封裝技術進展", "teaser": "面板廠跨界半導體尋生路", "full": "面板雙虎群創與友達近年積極尋求轉型，法人目前將目光聚焦於兩大廠在先進封裝技術的研發與量產進展。此舉有望打破傳統面板景氣循環的限制，開闢全新成長曲線。", "think": "面板業跨足半導體封裝，代表台灣產業供應鏈的跨界整合能力正在提升。這給投資人的啟示是，傳統夕陽產業若能成功連結熱門的AI半導體技術 <script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
