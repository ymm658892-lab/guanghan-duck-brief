  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

攀升至多年來的高點，反映出全球央行政策與資金成本的最新變化。受債市殖利率走高影響，亞洲股市在資金挪移的效應下表現互有漲跌，投資人對高利率環境的適應成為盤面焦點。市場正持續評估這波利率走勢對實體經濟與股市評價的影響。", "think": "公債殖利率創高代表無風險利率上升，會直接影響股票市場的估值模型與資金動能。上班族在規劃理財時，不妨重新檢視手中資產在利率走高環境下的防禦能力。", "question": "在債券殖利率維持高檔的時期，您的資金配置會傾向定存、債券還是股票？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609250164.aspx", "name": "中央社"}]}, {"title": "福斯奧迪汽車螺絲鏽蝕恐釀轉向失效 全球召回近286萬輛", "teaser": "零件鏽蝕釀隱憂，全球大舉召回", "full": "德國車廠福斯與奧迪旗下的車輛驚傳因零件螺絲鏽蝕，可能導致轉向系統失效的安全隱患，官方因此宣佈全球大規模召回近286萬輛車。這項大規模的品質瑕疵事件不僅影響品牌商譽，也再次凸顯汽車製造業在供應鏈管理與零組件品管上的嚴格挑戰。相關車主正等待原廠的檢修與零件更換通知。", "think": "汽車製造屬於高度精密且講究安全的產業，任何微小零件的疏忽都可能釀成巨額成本。這對所有製造業從業人員都是個警惕，品質控管永遠是企業長久經營的命脈。", "question": "如果您是受影響車款的車主，對於車廠的召回補救措施會有信心嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609250202.aspx", "name": "中央社"}]}], "robotics": [{"title": "AI獲得機器人身體…實體AI，製造業成為主戰場", "teaser": "實體AI大爆发，製造業搶當主戰場", "full": "隨著人工智慧與硬體技術的融合，「實體AI」（Embodied AI）正成為科技界的新顯學，讓AI正式擁有機器人的物理身體。製造業首當其衝，成為各大科技巨頭與新創公司驗證機器人自主作業能力的主戰場。這項趨勢預示著工廠自動化將從傳統的重複性機械，跨入具備環境適應力的高階智慧生產時代。", "think": "軟體AI已經改變了我們的辦公桌，而實體AI則將徹底顛覆工廠與勞動市場。這波浪潮不只是科技題材，更是未來十年產業競爭力的關鍵分水嶺。", "question": "當機器人具備實體AI後，您覺得哪一個傳統行業最容易被徹底重塑？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiekFVX3lxTE9MdzhoNWJXMkFISUpBd0Rzc0hZOTNkdVd6X0NibHMwcEcwLXNPUVEwYjdhSEhIcmVRTzY1b1o0V0JLSVQzaDZxUlN3RzZlY0FqQUVzbUhMQnlqNHJ4ZzAzX0QxcUN6emkzYU93djVxTE43YnI0aENQcDln?oc=5", "name": "BigGo 財經"}]}, {"title": "特斯拉Optimus機器人產能已提升10倍 目標年底周產千台", "teaser": "特斯拉機器人產能飆升十倍", "full": "特斯拉在人形機器人Optimus的量產進度上傳出捷報，近期產能順利提升了整整10倍之多。官方更進一步設定了雄心勃勃的目標，希望在今年底前達成每週生產千台機器人的規模。這顯示特斯拉正加速將其自動駕駛與AI技術平移至人形機器人硬體上，試圖搶佔未來龐大的勞動力替代市場。", "think": "交出漂亮的產能數字是硬道理，特斯拉展現了其一貫的「量產狂魔」效率。對投資人而言，觀察人形機器人從概念走向大量製造，將是檢視AI硬體供應鏈泡沫與否的重要指標。", "question": "您期待未來家裡或職場出現像特斯拉Optimus這樣的人形機器人嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMivgFBVV95cUxOVDBCNm1kaWptXzNKODFWTmNXRnM2c0w3VHB4bFFTdHhBai03ZkFpeFJfaW1idV8weURJVHdiWHJ3R19Cdl8yT0cwbS1ldGxSMUlmOENMTkVONWZDRTVRaXE5WXJLVDh3ZS1QWUJ3bi1hTnRuYS1rZzdTQ01aQkZSeVZfWlVhUEFaa2Y1ODFmMXZxVEk4ZXA4SHE4dVVjM3RnZFFVSDVhZktBZl9saXBxenhfMWJoTzZrUWJXYUtn?oc=5", "name": "富途牛牛"}]}, {"title": "特斯拉Optimus機器人量產受阻 機械手成最大瓶頸", "teaser": "量產卡關機械手，技術挑戰仍鉅", "full": "儘管整體產能傳出提升好消息，但特斯拉的Optimus人形機器人量產過程並非一帆風順，精細的機械手設計仍是當前最大的技術瓶頸。要複製人類雙手靈活抓握、施力的複雜動作，在工程學上需要極高的精密傳動與感測技術。這也點出了當前人形機器人產業從展示走向實際落地的共同痛點。", "think": "最困難往往不是整體的宏觀設計，而是微觀處的工藝極限。這提醒我們看待任何科技突破時，都要關注供應鏈中最難克服的關鍵零組件瓶頸。", "question": "您認為要克服機器人機械手的靈活度障礙，還需要突破哪些關鍵技術？", "sources": [{"url": "https://news.google.com/rss/articles/CBMicEFVX3lxTFBLLVJaZ2NKQkVaTEd4UE5SQXBrdW1ER3BsaWxBLURTOENXNVA3cUVEdGwzY3l2aDhDM3hBTXdraHd2aTc2T2d3U0FrX2dRZUxRVk40YVcyREJSNzhFaFk0azFZeEx0cnBMQlhzZzAzNHc?oc=5", "name": "Investing.com 香港 - 股市報價& 財經新聞"}]}, {"title": "邊緣AI與機器人商機引爆 北美訂單出貨比飆破2，這2檔工業電腦廠大啖紅利", "teaser": "邊緣AI需求強勁，訂單出貨比飆高", "full": "受惠於邊緣AI與智慧機器人需求的強力引爆，北美市場相關設備的訂單出貨比（B/B值）一路飆破2，創下亮眼水準。台灣多家具備利基型的工業電腦廠憑藉扎實的硬體實力，成功打入這波供應鏈大啖紅利。這股強勁的拉貨力道顯示，終端市場對智慧自動化的導入已從觀望轉為實質採購。", "think": "訂單出貨比飆破2代表需求遠大於供給，相關台廠供應鏈的營運爆發力值得期待。上班族在研究科技股時，掌握這種具備實質訂單支撐的產業往往比追逐純題材安全。", "question": "面對爆發的邊緣AI商機，台灣供應鏈該如何維持長期的護城河？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiggFBVV95cUxONVI1ZDNNVTBSS3FuTFVwVzAzN0U0UUc4bENjS3RJbUdHdFBpODFpdVVMcTZYcU11eWdOamp3NHhXSVFxZHJuRnZrcWJWTDZkMTdZZFBMamdLdUVIdjBxeE8zYWg4dGNQbzRzT3paVVV0MFJuTmpwNzBjMGVXT0xOTGxn?oc=5", "name": "CMoney投資網誌"}]}, {"title": "機器人造反不是危言聳聽 人類智能退化是更大隱憂", "teaser": "機器人威脅未到，人類智力先堪憂", "full": "近期關於機器人與AI發展的討論熱烈，有專家指出，與其擔心科幻小說中的「機器人造反」，人類因過度依賴科技而導致自身智能與思考能力退化，反而是更大的潛在隱憂。當所有計算、記憶與決策都外包給機器，人類自身的大腦是否正在逐漸退化，引發了學界與社會的深層反思。如何在科技便利與自我成長之間取得平衡，成為當代人的重要課題。", "think": "工具本意是解放人類，但如果用得過度，反而會讓自己失去原本具備的能力。這給現代上班族很好的啟示：擁抱AI工具的同時，千萬不要放棄獨立思考的習慣。", "question": "您是否也曾覺得過度依賴智慧型手機或AI，讓自己的記憶力或專注力變差了？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTE9mQVBYX2ZjSmFpek9fRkQ3Q2piNXdMRE13b2tIUk9ZUGQxcHpaaTh1TDZmYXBmMGZ1UHo1UGs4akVNcmdPX0hray1FM1RWQk9lbXc?oc=5", "name": "mirrordaily.news"}]}], "tech": [{"title": "別再盲目蓋資料中心，AI 算力競賽轉向智慧控電與架構最佳化雙軌戰場", "teaser": "算力競賽轉向，控電與架構變關鍵", "full": "隨著AI模型規模不斷擴大，盲目擴建資料中心的時代似乎正在過去，算力競賽正式轉向「智慧控電」與「架構最佳化」的雙軌戰場。面對驚人的耗電量與散熱需求，科技巨頭們開始將重點放在如何用更少電力發揮更高運算效率。這項轉變正徹底考驗伺服器硬體設計、軟體排程以及能源管理的綜合實力。", "think": "當電力成為AI發展的天花板，綠能與節能技術就成了兵家必爭之地。這不僅是技術問題，更是企業能否在AI賽局中控制成本的生存關鍵。", "question": "您覺得未來的資料中心會不會因為電力短缺，而被迫遷往能源更豐富的地區？", "sources": [{"url": "https://finance.technews.tw/2026/09/26/ai-compute-competition-pivots-intelligent-power-management-architectural-optimization-dual-track-battlefield/", "name": "科技新報"}]}, {"title": "Airbnb 執行長靠 AI 打造「企業大腦」，會議砍半更帶動 17% 營收成長", "teaser": "Airbnb靠AI大腦，會議減半營收增", "full": "知名短租平台 Airbnb 的執行長近期分享了他們如何透過內部導入 AI 建立「企業大腦」，成功將冗長的會議砍半，並進一步帶動了 17% 的營收成長。這項內部改造證明了 AI 不僅能對外創造新產品，對內更能透過資訊整合與流程簡化，大幅提升組織的營運效率。這也為全球企業在數位轉型上樹立了極佳的成功典範。", "think": "開會往往是企業效率的黑洞，用AI幫忙整理資訊、減少無效溝通才是科技轉型的真諦。這也提醒我們，工作要講求方法與工具，不見得加班多就代表產出高。", "question": "如果公司的例行會議能砍半，您會把省下來的時間拿來做什麼更有價值的事？", "sources": [{"url": "https://finance.technews.tw/2026/09/25/airbnb-ceo-halves-meeting-time-ai/", "name": "科技新報"}]}, {"title": "馬斯克：Colossus 2 年底前輝達晶片數量將翻倍，上看 120 萬顆", "teaser": "馬斯克超級電腦，晶片數量將翻倍", "full": "科技狂人馬斯克旗下事業再度展現驚人的算力企圖心，預告其超級電腦計畫在今年底前，內含的輝達（Nvidia）AI晶片數量將會翻倍成長，總數上看驚人的120萬顆。這項大規模的算力擴充計畫，旨在為其龐大的自動駕駛與AI模型訓練提供源源不絕的火力支援。這也再次凸顯頂尖科技巨頭對高階AI晶片的需求依然處於強勁的高原期。", "think": "百萬等級的晶片部署規模簡直是天文數字，凸顯了頂尖AI競賽的資本門檻有多高。這也解釋了為什麼輝達等半導體龍頭的營運能持續維持強韌的成長動能。", "question": "面對算力無極限的軍備競賽，您認為小型AI新創還有機會突圍嗎？", "sources": [{"url": "https://technews.tw/2026/09/25/elon-musk-aims-to-double-colossus-2s-nvidia-chips-by-year-end/", "name": "科技新報"}]}, {"title": "不只搬產線，更要拚 AI！台商南向泰馬越星，四路並進迎接黃金爆發期", "teaser": "台商南向拼AI，四路並進迎爆發期", "full": "面對全球供應鏈重組與AI浪潮的雙重夾擊，台商近年積極展開南向布局，足跡遍及泰國、馬來西亞、越南與新加坡，不僅單純遷移產線，更全面導入AI智慧製造。這種「四路並進」的策略讓台商在東南亞打造出全新的科技製造聚落，準備迎接新一波的黃金爆發期。這項轉變也讓台灣的硬體製造優勢在海外市場得以延續並升級。", "think": "台商的韌性向來展現在隨機應變與全球布局的能力上。從傳統代工升級為AI智慧製造，不僅避開了地緣政治風險，也找到了下一階段的成長動能。", "question": "如果您是企業主，在佈局海外產線時會把AI自動化列為首要考量嗎？", "sources": [{"url": "https://finance.technews.tw/2026/09/26/delta-profit-57-teco-revives-20-year-factory-asean-taiwanese-ai-southbound-now-building-real-plants/", "name": "科技新報"}]}, {"title": "美國 SMR estion": "當連傳統儲存設備都傳出缺貨時，您覺得會對終端電子產品的價格造成什麼連鎖反應？", "sources": [{"url": "https://technews.tw/2026/09/26/dell-highlights-hdd-shortage-hard-drive-supply-remains-tight/", "name": "科技新報"}]}, {"title": "英國陸軍想要更優秀的無人機飛手，祭出「無 GPS 與輔助」最難飛行訓練課程", "teaser": "英軍推無GPS無人機訓練", "full": "為了因應現代電子戰與嚴苛戰場環境，英國陸軍開始尋求更優秀的無人機操作人才。軍方特別推出完全屏除GPS與電子輔助工具的高難度飛行訓練課程，強調培養飛行員在極端環境下的純粹操控與應變能力。這反映出軍事科技正朝向去導航依賴發展。", "think": "電子干擾與資安防護是現代科技的最高標準。這項軍事訓練的變革也啟發我們，專業技能不該過度依賴單一工具。", "question": "如果有一天高科技輔助工具全數失效，您對自己的核心專業能力還剩下多少信心？", "sources": [{"url": "https://technews.tw/2026/09/26/the-british-army-wants-better-drone-pilots-so-it-makes-them-learn-the-hardest-way-to-fly/", "name": "科技新報"}]}, {"title": "餐飲缺工新解方？燒肉品牌彩豚屋雇 AI 當員工", "teaser": "燒肉品牌引進AI員工", "full": "面對嚴峻的餐飲業缺工浪潮，知名燒肉品牌彩豚屋選擇大膽創新，直接聘雇AI系統擔任店內員工來協助營運。這項應用展示了生成式AI與自動化服務在第一線服務業的實地落地成果。不僅有助於緩解人力短缺，也為餐飲服務模式帶來全新變革。", "think": "服務業導入AI已從噱頭走向實際營運解方。這對上班族而言，是勞動市場結構轉變的重要訊號，學會與AI協作將是基本功。", "question": "如果您去餐廳用餐發現服務生全是AI與機器人，您的消費體驗會有什麼樣的轉變？", "sources": [{"url": "https://technews.tw/2026/09/26/cai-tun-wu-hires-ai-to-help-make-reservations/", "name": "科技新報"}]}, {"title": "麥肯錫警告：代理式 AI 成本難估算，同任務執行成本可差到 30 倍", "teaser": "麥肯錫示警AI執行成本", "full": "顧問公司麥肯錫發布警告指出，企業導入先進的「代理式 AI（Agentic AI）」時，面臨最大的痛點之一就是成本極難估算。由於任務複雜度不同，執行同一個任務的成本落差甚至可高達30倍。這為企業在評估AI投資回報率時帶來財務風險與挑戰。", "think": "技術很炫酷，但企業要賺錢就得算成本。AI的效益若無法壓倒高昂的運算開銷，盲目導入可能變成企業的財務黑洞。", "question": "您服務的公司在導入AI工具時，是否有認真評估過實際產出與成本是否成正比？", "sources": [{"url": "https://finance.technews.tw/2026/09/26/mckinsey-warns-that-ai-may-get-a-lot-more-expensive-for-companies/", "name": "科技新報"}]}, {"title": "進化的惡意程式改由 AI 模型投票決策，駭客不必下指令也能竊取資料", "teaser": "AI投票決策惡意程式", "full": "資安領域出現最新威脅，駭客開始利用AI模型來組成投票決策機制，讓惡意程式具備自主演進與攻擊能力。這意味著駭客不需要再手動下達指令，惡意軟體就能自動化尋找漏洞並竊取資料。這對全球企業的資訊安全防護網帶來前所未有的嚴峻考驗。", "think": "AI是一把雙面刃，壞人也在利用它升級犯罪手法。對上班族來說，資安意識已經不能只是被動防守，必須時刻保持警覺。", "question": "當連惡意程式都學會用AI自主決策時，我們個人的數位帳號安全到底該如何自保？", "sources": [{"url": "https://infosecu.technews.tw/2026/09/26/how-customizable-ai-models-are-enabling-hackers-to-conduct-cybercrime-s <script type="application/json" id="slot-2000">{"date": "9月25日．週五", "tldr": "週五盤後總結，美股多空交織但科技與半導體展現韌性，國際地緣政治與AI算力擴張成為市場焦點，投資人宜審慎看待風險。", "indicators": {"note": "台股微幅拉回整理，但美股那斯達克與費半走揚，顯示國際科技與半導體動能依舊強勁，為下週台股提供支撐。", "tiles": [{"label": "台股加權指數", "value": "48,024.60", "valueClass": "fall", "delta": "-0.28%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "27,086.74", "valueClass": "rise", "delta": "+0.55%", "deltaClass": "rise"}, {"label": "費半指數", "value": "12,713.12", "valueClass": "rise", "delta": "+1.77%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "452.06", "valueClass": "rise", "delta": "+0.20%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "台積電赴美投資核准達440億美元 經部：預期持續送件審查", "teaser": "台積電赴美投資持續推進", "full": "經濟部證實台積電對美投資核准金額已達相當規模，並預期未來仍會有相關投資案持續送件審查。這反映出台灣半導體龍頭在全球產能佈局上的長遠考量，持續深化國際供應鏈的連結。在全球地緣政治與客戶需求交織下，台廠的海外動向備受產業界與投資人高度關注。", "think": "護國神山的大規模海外布局，不僅是企業營運策略的延伸，也牽動著台灣本土產業聚落的轉型。對投資人而言，關注供應鏈的全球化移動，有助於精準掌握長線的產業趨勢與機會。", "question": "當半導體大廠加速全球在地化生產，台灣本土的供應鏈優勢該如何維持與升級？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609250036.aspx", "name": "中央社"}]}, {"title": "AI熱潮不是雨露均霑 記憶體水漲船高、科技廠發展兩極", "teaser": "AI狂潮下的產業分化", "full": "市場觀察指出，雖然人工智慧熱潮持續延燒，但並非所有科技廠都能雨露均霑。隨著需求結構改變，記憶體等特定領域因需求暢旺而水漲船高，部分科技廠則面臨發展兩極化的挑戰。這顯示出科技產業正經歷結構性調整，基本面表現將更加分歧。", "think": "這提醒我們在追逐熱門題材時，不能只看單一的光環，更要深入檢視個別企業在供應鏈中的實際定位與獲利能力。產業的分化往往是幾家歡樂幾家愁，選股邏輯必須更加細緻。", "question": "在產業發展兩極化的趨勢下，您的投資組合是否具備足夠的抗震與利基能力？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609250029.aspx", "name": "中央社"}]}, {"title": "美國30年期房貸利率突破7% 創川普重返白宮以來新高", "teaser": "美房貸利率升破七趴", "full": "美國房貸利率近期再度走高，30年期房貸利率突破百分之七大關，創下特定政治變局後的新高紀錄。借貸成本的攀升直接衝擊當地房市的買氣與流動性，也反映出總體經濟環境中的通膨與利率壓力依然存在。市場正密切評估高利率環境對整體消費動能的實質影響。", "think": "房貸利率是觀察美國內需與消費強弱的重要風向球，當融資成本居高不下，消費者的荷包縮水可能進一步外溢到其他零售與經濟領域，影響層面值得持續追蹤。", "question": "面對美國居高不下的房貸與利率水準，您認為會對全球金融市場帶來哪些連鎖反應？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202609250018.aspx", "name": "中央社"}]}, {"title": "投資人聚焦美伊戰爭 美股多收黑", "teaser": "地緣政治牽動美股表現", "full": "受到中東地緣政治緊張局勢升溫的影響，投資人的避險情緒隨之升高，導致美股多數主要指數在盤中與收盤時面臨賣壓而收黑。市場資金對於區域衝突可能擴大保持高度警戒，隨時評估對全球供應鏈及能源市場的潛在衝擊。整體盤勢在不確定因素干擾下顯得較為脆弱。", "think": "國際地緣政治風險往往難以預測，且總是在市場情緒過熱時給予當頭棒喝。投資人在布局時，適度配置防禦性資產或保留現金，是因應黑天鵝事件的重要防身術。", "question": "面對突發的地緣政治衝突，您的投資心態是否容易隨之起伏，或者已有應對的配置？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609250013.aspx", "name": "中央社"}]}, {"title": "葉門叛軍射彈攻擊沙烏地 國際油價上漲約3%", "teaser": "葉門叛軍襲擊推升油價", "full": "中東產油國周邊再度傳出軍事衝突，葉門叛軍發動飛彈攻擊引發市場對原油供應受阻的擔憂。受此地緣政治事件激勵，國際油價應聲走揚，漲幅約達百分之三左右。能源價格的波動再度牽動全球通膨敏感神經，也讓央行未來的貨幣政策增添變數。", "think": "油價往往是通膨的領先指標，能源成本的推升會直接侵蝕企業獲利並增加民眾生活負擔。上班族在規劃日常開銷與投資配置時，不可忽視原油市場的動態。", "question": "當國際油價因突發衝突而震盪時，哪些產業會率先感受到成本壓力或轉機？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609250011.aspx", "name": "中央社"}]}], "robotics": [{"title": "報道：特斯拉Optimus機器人產能已提升10倍，目標年底周產千台", "teaser": "特斯拉機器人產能大增", "full": "根據外媒與相關產業消息報導，特斯拉旗下的人形機器人Optimus在產能上取得顯著突破，產量在近期大幅提升十倍。團隊正積極優化製造流程，並將年底前達到每週生產一千台設定為重要目標。這顯示人形機器人正從概念展示逐步邁向規模化量產的關鍵階段。", "think": "從實驗室走向工廠量產，是所有硬體創新最艱難的一步。特斯拉若能順利衝高產能，不僅能驗證其自動化實力，也將加速機器人在實際場域落地的進程。", "question": "您認為人形機器人真正走入一般工廠或家庭普及的時間點，會比市場預期的更快還是更慢？", "sources": [{"url": "https://news.google.com/rss/articles/CBMivgFBVV95cUxOVDBCNm1kaWptXzNKODFWTmNXRnM2c0w3VHB4bFFTdHhBai03ZkFpeFJfaW1idV8weURJVHdiWHJ3R19Cdl8yT0cwbS1ldGxSMUlmOENMTkVONWZDRTVRaXE5WXJLVDh3ZS1QWUJ3bi1hTnRuYS1rZzdTQ01aQkZSeVZfWlVhUEFaa2Y1ODFmMXZxVEk4ZXA4SHE4dVVjM3RnZFFVSDVhZktBZl9saXBxenhfMWJoTzZrUWJXYUtn?oc=5", "name": "富途牛牛"}]}, {"title": "特斯拉Optimus機器人量產受阻，機械手成最大瓶頸", "teaser": "機械手成量產大考驗", "full": "儘管整體產能傳出提升的好消息，但產業分析也指出，特斯拉的Optimus機器人在量產過程中仍面臨實質阻礙。其中，高度精密且需兼顧靈活度的「機械手」設計與製造，成了當前技術與供應鏈的最大瓶頸。如何突破此一關鍵零件的良率與成本，將決定後續量產的成敗。", "think": "這凸顯了科技產品「看得到的美好」與「做得到的困難」往往存在巨大落差。投資在尖端科技時，釐清真正的技術瓶頸與關鍵供應商，比盲目追逐題材更有價值。", "question": "當一項革命性產品在關鍵零件卡關時，您通常會如何評估其背後的投資風險？", "sources": [{"url": "https://news.google.com/rss/articles/CBMicEFVX3lxTFBLLVJaZ2NKQkVaTEd4UE5SQXBrdW1ER3BsaWxBLURTOENXNVA3cUVEdGwzY3l2aDhDM3hBTXdraHd2aTc2T2d3U0FrX2dRZUxRVk40YVcyREJSNzhFaFk0azFZeEx0cnBMQlhzZzAzNHc?oc=5", "name": "I <script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
