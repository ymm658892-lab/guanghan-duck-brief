  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

技巨頭長期的競爭力與股價表現？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608240333.aspx", "name": "中央社"}]}, {"title": "外界關注全球央行年會華許談話　盼為債市提供指引", "teaser": "央行年會牽動全球債市", "full": "市場目光緊盯即將召開的全球央行年會，關注重要學者與決策者的公開演講，期盼從中解讀未來的利率走向與貨幣政策框架，為近期波動劇烈的全球債市提供清晰指引。", "think": "央行年會的發言往往會指引未來幾個月的總體經濟風向。上班族與投資人在規劃借貸或投資時，應多加關注這類利率政策訊息，以調整財務計畫。", "question": "在利率走向尚不明朗前，你如何管理自己的個人貸款與投資槓桿？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202608240327.aspx", "name": "中央社"}]}], "robotics": [{"title": "NVIDIA 財報季收估920 億美元；中國包辦全球人形機器人前五大", "teaser": "AI與機器人產業雙箭齊發", "full": "NVIDIA財報預估亮眼，帶動AI伺服器供應鏈價格上漲；與此同時，中國廠商在人形機器人領域表現強勁，包辦全球前五大，顯示AI算力正快速落地至硬體載體。", "think": "AI算力的突破正加速機器人的落地應用，軟硬體整合成為下一波高成長賽道。身為上班族，認識AI硬體的演進，能幫助我們提早掌握產業轉型的大趨勢。", "question": "當AI算力走入實體機器人，你認為哪種職場工作最快受到改變？", "sources": [{"url": "https://news.google.com/rss/articles/CBMihgFBVV95cUxOeUR3TVRCUkc4SThGa1ZJUmFmZ2V4V05VNDBtNG85UUZMOVM3Y29WaHFYRWFSSVhnM2F6RDZXeWxVWTBrdzZMNktFZXp2eGlPcXM3MV84Z3Y5YzMtc0s5NWp0ajZjSXhaS1NLSDhZUnRCbVgzaGVGSU40SzF2STU0bzRDazkzQQ?oc=5", "name": "TechOrange 科技報橘"}]}, {"title": "中國人形機器人領先，日本要靠核心零部件捲土重來", "teaser": "日本靠零組件重振競爭力", "full": "儘管中國在人形機器人整機市場保持領先，日本製造業則發揮精密機械優勢，積極布局減速器、馬達等核心零部件，企圖在全球機器人產業鏈中佔據不可或缺的地位。", "think": "整機製造與關鍵零組件各有商業壁壘。日本選擇深耕技術門檻極高的核心元件，說明在科技競賽中，「關鍵零組件」往往具備極高的利潤與話語權。", "question": "在職場或個人技能上，什麼是你獨一無二且難以被替換的「核心零組件」？", "sources": [{"url": "https://news.google.com/rss/articles/CBMihAFBVV95cUxPQ1RnNDhvM1FMVTFMQjFpMXMxbnNLNkpxRDRzR0NfaVJHUTZLVE1hZXM2eTVKVFFMVzhmcC1iU0ZOSWhJcVZ4SE5TZlJLaWxaNDczSC01S1Q3WUs2VFM4UjFJLUw3Z3ZzZzBIWmstNW9DV2hCYmNOdnZmYWdKNTBZY3didVA?oc=5", "name": "日經中文網"}]}, {"title": "靈心巧手：美股七雄退潮下一波浪潮是機器人", "teaser": "機器人成下一波投資焦點", "full": "美股科技七雄漲勢趨緩後，資金正尋求下一個成長引擎。靈活精巧的人形機器人與工業自動化設備被視為潛力股，有望接棒成為資本市場與產業升級的下一個超級浪潮。", "think": "市場資金總是尋求最高成長性的題材。機器人從概念走向實用，標誌著自動化新時代的到來，投資人應關注供應鏈中真正具備量產與落地能力的企業。", "question": "科技浪潮不斷轉移，你該如何保持敏銳度以發掘下一個產業紅利？", "sources": [{"url": "https://news.google.com/rss/articles/CBMid0FVX3lxTE5LZzdKb0ZRUWNXemV6U25RMl9hVnNlMVhDNTNZRlBrTXdOS0V3MHdOaWdwVDlLWkhaYnMwUngzTXBNbkl1WEcyOGY5ZHhKTGVoQkJBQS0wMU84M09vd0JOemNNQ0lTWk44dVhmUGdzUFFIRTdFbndR?oc=5", "name": "香港文匯報"}]}, {"title": "美債爆危機橋水基金急籲買進資產，機器人投資慘停損", "teaser": "機器人投資熱潮伴隨風險", "full": "面對美債與總體經濟不確定性，大型基金呼籲防禦布局；同時資深投資人也分享在機器人概念股慘遭停損的經驗，提醒市場雖然題材火熱，但個股波動與評價風險依然極高。", "think": "新興題材雖然前景廣闊，但初期股價往往波動劇烈且夾雜泡沫。盲目跟風主題投資容易遭遇大幅拉回，建立嚴格的停損紀律與風險意識至關重要。", "question": "當熱門主題遭遇大幅修正時，你的停損與風險管理策略是什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMijwNBVV95cUxPZ1ZSLUlZaWZHZ2J6eENnam1GUU0tWjg5OUhuZ3lLbGI4dDZocTdFZXlGWUtfMUQzYmNvd1Q3bnFYRVJITVdJNnNGVUtfT0d2YU1tdFhUYUpYZEp5M3NrNjdNSkdGRkZHYkNXMlZiUnl5djVWb1h4S1U0OHVNUTJHYlFoNU12Z3NXQlhkcXpxaXNOX2FsaGR2VTJhTVlXaTRFZlhHWVc1dnpCZlNqc1hnUmlQdFM2WG1XNUFXQlNHRW1sNS1ac2psMWhvNXBDYXBudTBpMjVudHd0bHRfMEpvZUZjb2Jfa1E3RGMxd0tRaTRaVEVhYTI5QU94MzdXTXZ3U0prMW82U1kxMmdnTUd6M29RdHZxZlphamNGSlFNZW1iakcxUVE1azZ4RjZ4NHFhZmEzcmRlM3A2a3VGM3ZjQmJqVm1rNi1RMWUtYmxsZlNTSEEzMkdDY3EtOVp6VHQ0U0ZMOW1Bbnh6LTRZcV9PUl9qZ1luRkdMNEx5WmZBMGR4TlZ1M2k3ZnlBaF9Ub3M?oc=5", "name": "Yahoo新聞"}]}, {"title": "AI機器人料2035年融入日常生活", "teaser": "機器人未來十年融入生活", "full": "業界預測AI機器人將在2035年前深耕日常生活中，從家庭照護、清潔到商業服務無所不在。技術的成熟與成本的降低，將全面翻轉人類的生活模式與勞力結構。", "think": "科技普及的速度往往超乎預期。機器人進入日常生活將解決勞動力短缺問題，但也會重塑服務業型態，提早適應「人機共存」的環境是未來必修課。", "question": "面對十年內可能普及的家務與服務機器人，你最希望它幫你解決什麼問題？", "sources": [{"url": "https://news.google.com/rss/articles/CBMidEFVX3lxTFBCc0JhWkZCbUxIVFFvbUFXdlM1SzVOLV9Za1FsSl9kMXRkNURIaENScE9Jd1ZrSWFxN2N3b0pKX1lfZ3Y1UEg5ZzlUWWNLeUVteExQMVVFamdvRERpYzhyXzdBQ3NYbzBmOGxsZmltdEZKeEE3?oc=5", "name": "大公文匯網"}]}], "tech": [{"title": "AI 幫忙「白話摘要」學術文時，多講的幾句話是真的還幻覺？", "teaser": "警惕AI摘要中的幻覺風險", "full": "研究發現AI在幫助使用者將複雜學術文章進行白話摘要時，經常會自行添加原文未載明的內容。這種「幻覺」現象提醒使用者在依賴AI處理關鍵資訊時必須保持審慎。", "think": "AI雖然能大幅提升閱讀與彙整效率，但「似真實假」的資訊幻覺依然存在。上班族在將AI生成的摘要用於決策或報告前，務必進行第二次交叉查證。", "question": "在日常工作中使用AI輔助時，你建立了哪些查核機制來避免被錯誤資訊誤導？", "sources": [{"url": "https://infosecu.technews.tw/2026/08/25/covering-the-fastest-computers-in-the-world-and-the-people-who-run-them-10/", "name": "科技新報"}]}, {"title": "百億預算砸給生成式 AI，一文看懂華爾街六大巨頭的 AI 軍備競賽", "teaser": "金融巨頭開啟AI軍備競賽", "full": "華爾街六大金融巨頭砸下數百億美元預算投入生成式AI，從風險控制、演算法交易到客戶服務進行全方位升級，象徵傳統金融業已將AI升級提升至戰略核心地位。", "think": "金融巨頭的高額資本支出證明了AI並非一時熱潮，而是提升企業運營效率的必要武器。這將促使各行各業加速數位轉型，提升整體產業的技術門檻。", "question": "當傳統巨頭都砸重金轉型AI，你所在的產業該如何善用AI保持競爭力？", "sources": [{"url": "https://finance.technews.tw/2026/08/25/wall-street-ai-race/", "name": "科技新報"}]}, {"title": "中國長鑫存儲 2027 年產能賣光，蘋果要取得足夠記憶體很吃力", "teaser": "記憶體產能緊繃考驗供應鏈", "full": "中國長鑫存儲未來數年的記憶體產能已預訂一空，這使得蘋果等全球消費電子巨頭在爭取足夠記憶體供應時面臨巨大挑戰，反映出整體半導體供應鏈緊張情況持續加劇。", "think": "記憶體作為電子產品的核心元件，其產能緊張將直接影響終端產品的成本與出貨。供應鏈的排他性競爭，考驗著終端品牌廠的供應鏈調度與議價能力。", "question": "供應鏈瓶頸若導致電子產品價格上漲，會影響你今年更換新設備的意願嗎？", "sources": [{"url": "https://finance.technews.tw/2026/08/25/cxmts-2027-production-capacity-sold-out/", "name": "科技新報"}]}, {"title": "英特爾 18A-P 製程突破，技術革新重塑 Diamond Rapids 處理器與資料中心效能", "teaser": "英特爾製程技術迎新突破", "full": "英特爾宣布18A-P先進製程取得關鍵進展，這將重塑其Diamond Rapids處理器架構，大幅提升資料中心運算效能，為其在晶圓代工與高效能運算領域注入強心針。", "think": "英特爾在先進製程上的反攻，預示著半導體代工與伺服器晶片市場的競爭將更加白熱化。技術突破有助於降低算力成本，帶動整體雲端產業進步。", "question": "半導體雙雄競爭加劇下，對整體雲端算力的成本與普及會有何影響？", "sources": [{"url": "https://finance.technews.tw/2026/08/25/intels-18a-p-process-breakthrough/", "name": "科技新報"}]}, {"title": "IBM 藉 2 奈米製程技術，建構全球首款雙指令集架構大型主機處理器", "teaser": "IBM推首款雙指令集晶片", "full": "IBM利用2奈米製程技術，打造出全球首款採用雙指令集架構的大型主機處理器。這項創新大幅提升了資料處理效率與相容性，為企業級關鍵任務提供強大的算力支撐。", "think": "頂尖半導體製程不僅應用於智慧型手機與消費電子，更能突破企業級核心伺服器的性能極限。技術創新的多樣化，正不斷拓寬資料處理的邊界。", "question": "企業核心系統效能躍升，將如何改善我們日常使用的各類金融與網路服務體驗？", "sources": [{"url": "https://finance.technews.tw/2026/08/25/ibm-builds-the-worlds-first-dual-instruction-set-architecture-mainframe-processor/", "name": "科技新報"}]}]}}</script>

}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
