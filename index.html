  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

業的防禦底氣。這項長期政策將有助於本土關鍵供應鏈在未來地緣變局中維持穩定優勢。", "question": "當戰略物資自給成為顯學，台灣本土特用化學與材料業者是否迎來新契機？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610240025.aspx", "name": "中央社"}]}, {"title": "蘋果首款摺疊手機iPhone Duo開賣 各地果粉排隊搶購", "teaser": "摺疊新機引爆果粉換機潮", "full": "蘋果正式推出旗下首款摺疊智慧型手機iPhone Duo並在全球開賣，吸引各地果粉排隊搶購。這款劃時代的新品不僅為成熟的智慧手機市場注入強心針，也預期帶動軸承與柔性螢幕供應鏈的新一輪拉貨。", "think": "龍頭品牌切入摺疊機市場，象徵該硬體形態已從早期嚐鮮轉變為成熟主流產品。這不僅考驗消費者的換機預算，也是檢驗相關零組件供應鏈獲利爆發力的關鍵時刻。", "question": "摺疊手機成為主流後，你認為其高昂售價是否能持續支撐消費者的換機動能？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202610230270.aspx", "name": "中央社"}]}], "robotics": [{"title": "北京觀察》機器人產業競爭將「非常慘烈」！宇樹科技王興興：實體AI突破瓶頸", "teaser": "實體AI迎來產業殘酷洗牌", "full": "宇樹科技創辦人王興興指出，隨著實體AI（Embodied AI）技術逐步突破演算法與控制瓶頸，機器人產業將迎來關鍵轉折點，但隨之而來的市場競爭也將變得極為慘烈，技術淘汰速度將大幅加快。", "think": "新興硬體賽道在技術突破後往往伴隨著激烈的資本淘汰賽。對投資人而言，單看概念題材已不足夠，能兼具量產成本控制與軟硬體整合能力的企業才能笑到最後。", "question": "在機器人產業即將進入殘酷淘汰賽之際，你評估贏家與輸家的標準是什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTE5FYUxFem8yQ2RkOXZlRHFnV2hSU01EX2s0MENGTFpnTzhKX2Ztem01d1BFYkR5ZVhsdWNrNjJ3aWdmNTVIbFdCNE5uRThDZw?oc=5", "name": "風傳媒"}]}, {"title": "馬斯克終極野心：打造科技「全棧帝國」從衛星、電力到晶片與機器人", "teaser": "跨界整合打造AI全棧生態", "full": "馬斯克正加速整合旗下企業資源，串聯低軌衛星、能源電力、AI晶片及人形機器人，意圖構建從能源基礎設施到終端智能應用的科技全棧帝國，藉此牢牢掌握AI未來發展的全球產業命脈。", "think": "AI的終極競賽早已超越軟體模型本身，延伸到電力、算力與實體硬體的立體戰。這種大集團的一體化布局，將對單一環節的獨立新創業者帶來巨大的競爭壁壘。", "question": "當算力與電力成為限制AI發展的天花板，軟硬全棧整合是否是科技巨頭的唯一解方？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiT0FVX3lxTE9mY1JVcEI2N2JxNG94ellMOGlIekJkOFNnRmZHQWF3ZmdsWFpsblZUamJ1MnQ0d3E2a1Nmc1dzVUNUelJLNnZDZEh6MF9yWGs?oc=5", "name": "鉅亨網"}]}, {"title": "英特爾報告：邊緣AI算力是自動化規模後盾，專用型AMR與工業手臂為產出主力", "teaser": "邊緣算力引領工廠自動化", "full": "英特爾發布機器人準備度報告指出，邊緣AI算力是推動智慧製造大規模落地的核心後盾。報告強調，專用型自主移動機器人（AMR）與高精度工業協作手臂，將是協助企業產出翻倍的實質主力。", "think": "相較於遙遠的人形機器人全面普及，工業端與物流場域的專用AMR才是目前能最快帶來生產力變現的利器。企業若能善用邊緣運算即時決策，將大幅拉開與對手的生產效率差距。", "question": "你的工作場域中，是否有重複度極高的搬運或作業流程正等待被邊緣自動化取代？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiaEFVX3lxTE1aUkJj 球AI基建中具備不可替代的核心戰略價值。", "question": "當先進封裝成為算力關鍵瓶頸，你是否已掌握這波硬體技術升級的核心受惠族群？", "sources": [{"url": "https://technews.tw/2026/10/24/nvidia-names-4-supply-chain-boost-production-shipments-kyec-unimicron-spil/", "name": "科技新報"}]}, {"title": "AI 成功法則：20% 靠技術、80% 靠轉型，打造對手難以複製的護城河", "teaser": "組織轉型才是AI致勝關鍵", "full": "科技專家分析企業導入AI的成敗關鍵指出，演算法與算力等技術層面僅占20%，真正的挑戰與高達80%的勝負在於內部組織流程的再造與文化轉型。唯有重塑商業模式，才能建立持久的護城河。", "think": "買進昂貴的AI軟體或工具只是第一步，若沒有改變既有的思維與工作流，數位投資往往淪為昂貴的裝飾品。在日常工作中主動運用工具優化流程的人，往往比單純懂技術的人更具價值。", "question": "在日常工作中使用AI時，你是在簡化既有流程，還是只是替舊習慣換上新包裝？", "sources": [{"url": "https://finance.technews.tw/2026/10/24/rules-for-successful-ai-transformation/", "name": "科技新報"}]}, {"title": "科學家發現「抗凍」金屬，-253°C 極限低溫仍不脆裂", "teaser": "極端低溫合金取得重大突破", "full": "材料科學家最新發現一種具備優異抗凍特性的新型金屬合金，即使置身於接近絕對零度的-253°C極限超低溫環境下，依然能維持極佳的韌性與強度而不脆裂，將為深空探測與超導低溫儲存帶來重大突破。", "think": "基礎材料科學的突破雖然研發週期長，但往往是催生太空探索、量子計算與新型能源革命的最底層基石。長期關注材料進展，往往能提前看見下一世代科技爆發的先兆。", "question": "面對深空探索與超低溫存儲技術的突破，你認為哪些未來產業會最先迎來商用轉機？", "sources": [{"url": "https://technews.tw/2026/10/24/scientists-discover-extremely-low-temperature-antifreeze-metal/", "name": "科技新報"}]}, {"title": "Wi-Fi 也能當金屬探測器用！瑞典開發 AI 系統辨識隱藏手槍，準確率達 72.5%", "teaser": "日常無線訊號化身安防雷達", "full": "瑞典研究團隊成功開發出一套利用現有Wi-Fi訊號散射特性的AI辨識系統，能透過無線電波擾動精準探測隱藏的金屬手槍，準確率已達72.5%，為公共場所安防提供免安裝昂貴設備的全新低成本方案。", "think": "利用生活周遭隨處可見的現成基礎設施（如Wi-Fi）結合AI演算法賦予其新功能，是極具商業潛力且環保的創新模式。跳脫硬體思維、用軟體重新定義硬體價值，是數位時代的重要哲學。", "question": "身邊那些習以為常的日常基礎設施，是否也有可能透過AI賦予意想不到的新用途？", "sources": [{"url": "https://technews.tw/2026/10/24/researchers-train-ai-to-detect-concealed-handguns-using-wi-fi-signals/", "name": "科技新報"}]}, {"title": "免吃藥開刀，研究證實客製化「微調走路角度」有效緩解膝關節痛", "teaser": "微調步態有效減輕關節壓力", "full": "最新醫學研究證實，退化性關節炎患者透過專業客製化微調走路時的足部角度與步態模式，能顯著改變膝關節受力分布，無須吃藥或開刀即能有效緩解膝蓋疼痛，提供非侵入式復健新解方。", "think": "健康管理正如資產配置，微小但正確的日常習慣調整，長期累積下來往往能產生驚人的複利效果。上班族在忙碌之餘，留意自己的體態與走路習慣，是最低成本的健康投資。", "question": "在日常生活中，有哪些看似微不足道的微小習慣調整，能為你帶來長期的健康回報？", "sources": [{"url": "https://technews.tw/2026/10/24/changing-walking-angle-can-relieve-arthritis/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-1300">{"date": "10月24日．週六", "tldr": "週六午間盤中聚焦台股連假後匯市走向與災後復原，科技與AI應用持續擴大，投資人可在休息時段掌握最新國際與產業脈動。", "indicators": {"note": "台股加權指數隨美股拉回修正，但費半與台積電ADR逆勢收紅，顯示半導體供應鏈依舊具備相對強韌的支撐力道。", "tiles": [{"label": "台股加權指數", "value": "46,041.43", "valueClass": "fall", "delta": "-1.81%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "25,955.34", "valueClass": "fall", "delta": "-0.21%", "deltaClass": "fall"}, {"label": "費半指數", "value": "10,779.46", "valueClass": "rise", "delta": "+0.44%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "418.51", "valueClass": "rise", "delta": "+1.49%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "美股下跌Fed開會在即　學者看連假過後新台幣短線貶勢居多", "teaser": "美股回檔連假後匯市偏弱", "full": "受到美股下跌及美國聯準會即將開會的觀望氣氛影響，學者評估連假過後新台幣短線可能面臨較大的貶值壓力。市場資金動向與匯率波動，將牽動台股開盤後的法人資金流向。", "think": "匯率往往是外資進出台股的重要風向球，短線若新台幣走貶，可能代表資金短暫匯出，對權值股的表現會帶來一定壓力。上班族在休假期間也可以稍微關注國際總經情勢，作為後續資產配置的參考。", "question": "面對短線匯率貶值與外資調節的可能，你的投資組合準備好防禦了嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610240131.aspx", "name": "中央社"}]}, {"title": "亞馬遜雲端運算產能至2027年被訂光　部分訂單排到2028年", "teaser": "雲端伺服器產能供不應求", "full": "全球雲端巨頭亞馬遜的運算產能需求強勁，資料顯示其雲端產能已被預訂至2027年，部分訂單甚至排到2028年。這反映出AI與雲端服務的基礎建設需求依然處於爆發性成長階段。", "think": "雲端大廠訂單滿手，直接證明了AI與大數據的長期需求沒有泡沫化，對台灣相關的伺服器、散熱與晶片代工供應鏈來說是強心針。這類長線基本面佳的產業，拉回時往往是逢低佈局的機會。", "question": "當全球科技巨頭都在搶訂未來幾年的運算產能，你的投資清單裡有跟著受惠的供應鏈嗎？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202610240126.aspx", "name": "中央社"}]}, {"title": "越南GDP成長估最高9.7%  專家：資金不足恐形式主義增長", "teaser": "越南高經濟成長背後隱憂", "full": "有專家預估越南今年的GDP成長率最高可達9.7%，表現亮眼，但同時也有學者提醒，若缺乏實質資金與基礎建設配合，可能導致形式主義的表面增長。這顯示出新興市場在快速發展時，資金鏈與結構性問題仍需審慎評估。", "think": "東協市場近年成為全球供應鏈移轉的熱點，高成長背後往往伴隨高風險，投資新興市場不能只看亮眼的成長率數字。對於一般投資人而言，分散風險、深入了解當地實際體質才是王道。", "question": "在追逐高成長的新興市場基金或股票時，你有把基礎建設與資金風險考慮進去嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610240107.aspx", "name": "中央社"}]}, {"title": "產品遭停供下載　訊連：占去年營收比重近15%、已提申訴", "teaser": "訊連產品遭停供影響營收", "full": "知名軟體大廠訊連科技傳出部分產品遭到停供下載，該業務占去年營收比重大約近15%，目前公司已經正式提出申訴並積極處理中。這項突發狀況對短期營運與財務表現將造成一定程度的考驗。", "think": "企業營收高度集中於特定產品或通路時，往往承受不起突發的外部政策或通路變故，這也是審視個股風險的重要指標。投資人在挑選個股時，營收來源的多元化與應變能力是不可忽視的防禦指標。", "question": "你手上的持股是否有單一產品營收占比過高、抗風險能力較弱的隱憂？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610240065.aspx", "name": "中央社"}]}, {"title": "特休放滿還能領2.8萬　公股銀大手筆祭休假獎金福利", "teaser": "公股銀行祭休假高額獎金", "full": "為了鼓勵員工落實休假並兼顧生活品質，有公股銀行大手筆祭出特休放滿即可領取高額獎金的福利措施。這種「鼓勵員工好好放假」的企業文化，在金融業中顯得格外吸睛，也成為搶人才的利器。", "think": "好的福利不僅能留住人才，也反映出企業財務體質健全且願意與員工共享獲利，對職場工作者來說是極佳的轉職參考指標。投資人在看金融股時，也可以觀察其人資政策與企業文化的永續性。", "question": "如果一間公司的福利好到鼓勵你把假休完還發獎金，你會對它的向心力更有信心嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610240034.aspx", "name": "中央社"}]}], "robotics": [{"title": "宇樹科技機器人號稱可救人！表演空翻卻「斷腿噴飛」自己先工傷", "teaser": "人形機器人表演意外斷腿", "full": "中國宇樹科技的人形機器人原先主打可投入救援任務，但在公開表演後空翻動作時，卻發生「斷腿噴飛」的意外插曲。這段影片在網路上引起熱議，也讓外界對高難度動作下的機器人穩定度產生討論。", "think": "機器人技術雖然進步神速，但從「展示用的大招」到「實際落地的穩定商用」還有一段路要走，研發過程中的失敗也是常態。這提醒我們看待熱門科技題材時，應保持理性期待，關注技術突破而非僅看行銷宣傳。", "question": "當你看見炫目的科技展示出包時，會影響你對該產業長遠發展的信心嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTE5NMGRieGlnZlJvcEZtNXBNNE1CYlpHcEYzV2ROZzd0Wl93WS1VZmFpSHAxVDh3dzZSOWJ4WnhpanBOcGt0VFJIM2tqYVdVQQ?oc=5", "name": "TVBS新聞網"}]}, {"title": "中國機器人太狼性？猛踹汽車瞬間凹陷 強大殺傷力畫面曝", "teaser": "機器人力道展現震撼網民", "full": "網路上流傳一段影片顯示，某款中國產製的機器人展現出驚人的爆發力與力道，一腳猛踹便讓汽車金屬瞬間凹陷。強大的殺傷力與破壞力畫面曝光後，讓外界再次驚嘆於機械動能的進化程度。", "think": "機器人展現出的強大物理破壞力，一方面代表工業與動力技術的大幅提升，另一方面也引發大眾對安全規範與倫理防線的擔憂。科技雙面刃的特質在機器人領域上表露無遺，未來法規如何跟進將是關鍵。", "question": "當機器人的力量超越人類想像，我們該如何為它設定安全防線？", "sources": [{"url": "https://news.google.com/rss/articles/CBMijgFBVV95cUxNeWU1TElESDBPTlN2Yk8xQVhzcm5RalQxVlpad0NXV1hXSGlKM3FZWkpaSDZwMERFbXZ2UFZLdktTdl9pV1RGdUd5RnBGY3FzOGwwTWQtMGVyeVFMTmEzV2g3dE9mVUNlRmVZSXJ0ZU9jdjlyOEdlcWlkak11OW1sUXlkeWlTY1U1THVkR1VR?oc=5", "name": "TEEPR 亮新聞"}]}, {"title": "醫院重視環境清消但清潔人力負擔大！臺大醫導入「AI消毒機器人」助力", "teaser": "臺大醫院導入AI消毒幫手", "full": "面對繁重的醫療環境清消工作以及日益吃緊的清潔人力，臺大醫院正式導入AI消毒機器人來分擔基層負擔。這項應用不僅提升了院內感染控制的效率，也具體緩解了醫療現場缺工的痛點。", "think": "醫療場域是AI機器人落地的最佳練兵場之一，因為它有高度痛點（缺工）與明確需求（高標準清消）。這類能真正解決勞動力短缺的實用型機器人，商業化前景往往比噱頭十足的表演型機器人更穩健。", "question": "你身邊的職場或日常環境，是否也有急需AI機器人來補足人力缺口的地方？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE9QbzZqTlBvbEI1SXZ6NktXU1JjaC1tYlBKQzJsS3RJMURsa3FMeHBIQ1VPSmxiWVFSWGFNZ2h2WjJPVVNGM0puTmxpa1U2SnZoVF9kRzJB?oc=5", "name": "健康醫療網"}]}, {"title": "智元110台人形機器人同時跳舞，創吉尼斯世界紀錄", "teaser": "百台人形機器人齊舞創紀錄", "full": "機器人領域再傳佳績，智元科技旗下的一百一十台人形機器人齊聚同步跳舞，成功創下金氏世界紀錄。這項壯舉展現了大規模機器人集群控制與軟硬體協同的成熟度。", "think": "能讓上百台機器人做出整齊劃一的動作，背後代表的是極其複雜的通訊、演算法與硬體同步技術。這不只是行銷噱頭，更證明了人形機器人在群體作業與智慧化管理上的潛在實力。", "question": "當群體機器人協作技術越來越成熟，未來工廠或展演會場會有怎樣的變貌？", "sources": [{"url": "https://news.google.com/rss/articles/CBMioAFBVV95cUxOazR1QjVhWklKY3h3em91Skx5REJUaTZCZDZYdFh1Y1BBM3FZQU0zQWJwaHg0NHZJR19mUXd0RFU0Y2dHTkkwbDE4NFpsVzJBWHAxWXp6OFBST1cya29WMTN6OWFiNk9PZWRoc0FrazJRUV82MkdBbFhPQ1dvY1NPNVJfbmtrem1KR294MzZxMXNBSzRSa09kdm90NWZOZzZn?oc=5", "name": "富途牛牛"}]}, {"title": "奈及利亞政府斥資逾2500億奈拉助醫學教育 推動機器人手術訓練", "teaser": "奈及利亞砸重金推機器人醫療", "full": "奈及利亞政府提撥高達兩千五百億奈拉的巨資，全力推動醫學教育並引進機器人手術訓練。這顯示出高階醫療科技不再只是先進國家的專利，發展中國家也正積極透過科技升級醫療水準。", "think": "醫療機器人的普及正在全球各地加速，連新興經濟體都願意砸重金投入，這擴大了整個產業的終端市場規模。對投資人而言，醫療科技供應鏈的長期成長曲線值得持續追蹤。", "question": "連醫療資源相對缺乏的地區都開始布局機器人手術，這對全球醫材產業釋放了什麼訊號？", "sources": [{"url": "https://news.google.com/rss/articles/CBMilwNBVV95cUxPalJKOTVwVUpRZ0k3ZDJ2Tk1RWEUwUzU5UEdheDRETnZxbWozVm1wVzMyaWcwd29Qdl85MVFpaWZjSTAwVDVDUl8yMlBGb2ZrTzNwcndEb05oT1ZJQS1jU0g2NWJPLTdmUXJ1Mktoak1qOE5vV1Z2c2RKVV9qWmRRU1h5TWNySkR3M3A5QnQwNFlSMnN2SjVBbnlndmVtcHllMFh2cnBMbzlST1JUSTNNVEoybnA5M2VHQVNSbGQxNTc2SElPaGZPN3hPTEJKMGJMaklzWDBTVVVWZ2VPQ2JrNWNJOTVLaHBGcXJnRTNweXRLODFfQllJNmtGYjBBSUlPd2ZwN3NZVV9wWG43OVVRS0dOQW1FTko2dnR0SXRXZ29ONzY0c0dQVk1mdGlFWU84aXRGVko3ZXAwSGhlTjdZal9haWNBZFpFd01lclJCM0RBSXlBN29fX0cwMlB4TWhpczB5T3B1Q2dkOGlHS29ZdGZZaEM4RXlocVo2dGl4RFZGYU9jSGtGZ2pRc0wtOGRITUp1Zzh1OA?oc=5", "name": "商傳媒 - SUN MEDIA"}]}], "tech": [{"title": "沒有指令的 AI 都在做什麼？MIT 虛擬島嶼實驗：它們會玩耍、推理，甚至做實驗", "teaser": "MIT虛擬島嶼AI自主實驗", "full": "美國麻省理工學院（MIT）進行了一項有趣的虛擬島嶼實驗，觀察沒有人類下達具體指令時，AI會展現出何種行為。結果發現它們不僅會互相玩耍、進行邏輯推理，甚至還會自主做實驗，展現出高度的自主性。", "think": "當AI開始具備自主探索與學習的能力，未來的軟體發展將從「人類給指令、機器照做」進化到「人類設目標、AI找解法」。這種典範轉移將徹底改變我們工作與思考的模式。", "question": "如果AI不需要人類下指令就能自主學習與實驗，未來人類的核心價值會是什麼？", "sources": [{"url": "https://technews.tw/2026/10/24/researchers-stranded-an-ai-agent-on-a-virtual-island/", "name": "科技新報"}]}, {"title": "非科學家團隊靠 Claude 設計抗蠍毒蛋白質，64 小時完成、實驗驗證成功", "teaser": "非專業團隊用AI設計解毒蛋白", "full": "一組並非科學家背景的團隊，透過AI工具Claude在短短64小時內成功設計出抗蠍毒蛋白質，並通過實驗驗證。這項成果打破了過去生醫研發必須由頂尖專家長期蹲點的傳統門檻。", "think": "AI正在民主化各行各業的專業知識，過去需要高度專業與時間成本的生醫設計，現在透過大語言模型就能加速突破。這對生技產業的研發效率帶來革命性影響，但也伴隨著生物安全等需要審慎規範的議題。", "question": "當AI把生醫設計的門檻降到非專家也能操作，我們該如何平衡創新速度與安全風險？", "sources": [{"url": "https://technews.tw/2026/10/24/ai-does-the-lab-work/", "name": "科技新報"}]}, {"title": "AMD 玩家福音！新模組讓 Radeon 也能跑 NVIDIA DLSS，首度解鎖光線重建", "teaser": "AMD顯示卡解鎖N卡畫質技術", "full": "有開發者推出全新模組，讓AMD的Radeon顯示卡也能夠運行NVIDIA的DLSS技術，並且首度解鎖了光線重建功能。這對遊戲玩家來說是一大福音，能夠在非官方支援下享有更佳的視覺體驗。", "think": "開源與軟體優化常常能突破硬體大廠之間的藩籬，為消費者帶來意料之外的性價比體驗。這也說明了在科技世界裡，軟體與社群的力量往往能重新定義硬體的價值。", "question": "當硬體競爭不再是唯一護城河，跨界軟體優化會如何改變消費性電子產品的選擇邏輯？", "sources": [{"url": "https://technews.tw/2026/10/24/all-dlss-features-including-ray-reconstruction-have-been-ported-to-rdna-4-and-3/", "name": "科技新報"}]}, {"title": "美國砸 3.89 億美元扶植功率半導體，鎖定 AI 資料中心與核融合應用", "teaser": "美砸重金扶植功率半導體", "full": "美國政府宣布投入3.89億美元資金，大力扶植功率半導體的研發與製造，明確鎖定未來AI資料中心以及核融合等前瞻應用。這顯示出高功率、高效能的晶片已經成為大國戰略物資。", "think": "AI資料中心對電力的極度渴望，讓功率半導體與能源科技的地位水漲船高，不再只是配角。台灣在半導體供應鏈完整的情況下，這類基礎建設的升級往往會為相關台廠帶來龐大商機。", "question": "當AI運算的終點是龐大電力需求，你的投資雷達是否也掃描到了能源與功率半導體？", "sources": [{"url": "https://technews.tw/2026/10/24/us-invests-389-million-boost-power-semiconductors-ai-data-centers-nuclear-fusion-applications/", "name": "科技新報"}]}, {"title": "超導類神經網路晶片通過核融合測試，每秒即時分析百萬筆電漿資料", "teaser": "超導晶片極速解析核融合數據", "full": "最新的超導類神經網路晶片成功通過核融合測試，展現出每秒鐘即時分析高達百萬筆電漿數據的驚人實力。這項技術突破有助於人類朝向清潔、無限的核融合能源夢想再邁進一大步。", "think": "核融合被視為終極能源解答，而其最大的挑戰在於如何即時控制極度不穩定的電漿，超導AI晶片的誕生正好補上了這個關鍵拼圖。科技的極限正在彼此交       '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
