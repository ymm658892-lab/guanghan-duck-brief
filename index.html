  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

<script type="application/json" id="slot-1300">{"date": "9月17日．週四", "tldr": "今天台股開盤展現抗跌韌性，美股因聯準會如預期升息一碼而劇烈震盪。政策預算加持AI與機器人產業，日美半導體合作與科技新品研發持續推進，整體盤勢震盪中尋求支撐。", "indicators": {"note": "這四項指標反映台股在美股震盪下仍具備抗跌韌性，台積電ADR與費半走高為台股提供有力支撐。", "tiles": [{"label": "台股加權指數", "value": "46,288.00", "valueClass": "rise", "delta": "+1.71%", "deltaClass": "rise"}, {"label": "那斯達克", "value": "25,978.42", "valueClass": "fall", "delta": "-0.01%", "deltaClass": "fall"}, {"label": "費半指數", "value": "11,246.11", "valueClass": "rise", "delta": "+0.63%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "417.72", "valueClass": "rise", "delta": "+1.23%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "台股開盤上漲87點，早盤呈現震盪偏多格局", "teaser": "開盤紅盤，多頭敲門", "full": "台北股市今日開盤表現亮眼，早盤上漲達87.21點。雖然受到美股近期多空交夾的波動影響，台股開盤後依然展現出不俗的抗跌韌性，盤中資金持續在電子股與大型權值股之間健康輪動，為今日的走勢注入了一劑強心針。", "think": "開盤走高給了市場信心，但盤中仍需觀察成交量是否能跟上。對通勤族來說，這代表整體市場氣氛不差，可留意手中有題材的個股。", "question": "面對開盤上漲，你會選擇加碼還是先獲利了結？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609170029.aspx", "name": "中央社"}]}, {"title": "新台幣開盤微幅貶值2.2分，匯市呈現區間震盪", "teaser": "匯率微貶，外資動向成焦點", "full": "新台幣兌美元今天開盤微幅貶值2.2分，開在31.91元。隨著近期國際美元走勢偏強以及聯準會決策的影響，外資在台股的匯入與流出動作皆趨於謹慎，短期內匯率預計將維持在區間內震盪整理，靜待進一步方向。", "think": "匯率微貶對出口導向的電子股有利，但可能壓抑外資買盤。上班族可以藉此觀察外資在盤中的資金調度態度，作為中長線布局的參考。", "question": "新台幣維持在31.9元附近，對你出國旅遊或投資美股有影響嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609170028.aspx", "name": "中央社"}]}, {"title": "聯準會如預期升息一碼，市場聚焦未來政策風向", "teaser": "升息一碼，靴子落地", "full": "美國聯準會正式宣布升息一碼，此舉完全符合市場先前的預期。本次會議的焦點主要在於未來的利率路徑與通膨控制成效，隨不確定性逐漸消除，市場普遍預期這將有助於穩定國際金融市場的投資信心。", "think": "符合預期的升息通常能讓市場鬆一口氣，這就是所謂的「利空出盡」。投資人此時可將注意力轉回基本面優異的個股。", "question": "當利率走勢明朗化，你會調整高股息與成長股的配置比例嗎？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202609170023.aspx", "name": "中央社"}]}, {"title": "聯準會啟動升息循環，美股道瓊指數重挫逾600點", "teaser": "美股震盪，道瓊重摔", "full": "聯準會宣布三年多以來的首次升息，引發美股市場劇烈震盪，道瓊工業指數終場大跌超過600點。市場對於資金收緊與未來經濟成長放緩的擔憂再度升溫，短期內這股觀望與避險情緒仍將主導美股的走勢。", "think": "美股的重挫反映了市場對高利率環境的適應期。台股雖有抗性，但難免受到拖累，上班族操作上應保持適度現金水位，不宜過度追高。", "question": "面對美股的大幅波動，你的資產配置有做好抗震準備嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609170013.aspx", "name": "中央社"}]}, {"title": "聯準會全力打擊通膨，市場預期升息循環將延續至明年中", "teaser": "鷹風陣陣，抗通膨是長期戰", "full": "為了全力打擊居高不下的通膨，聯準會在此次會議中展現出強硬的態度。市場分析師與法人普遍預估，本輪的升息循環可能要持續到明年年中，意味著高利率的環境預計將維持更長的時間，考驗企業的財務韌性。", "think": "升息循環拉長代表資金成本將持續在高檔，這對高槓桿企業較不利。投資人應多關注負債比率低、現金流充沛的穩健型企業。", "question": "長期高利率環境下，你覺得哪些產業最能展現韌性？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202609170008.aspx", "name": "中央社"}]}], "robotics": [{"title": "台南推動「半導體+AI+智慧機器人」金三角聚落", "teaser": "南台灣崛起，科技新地標", "full": "台南正積極整合在地的產業優勢，全力打造全台唯一的半導體、AI與智慧機器人金三角聚落。此舉旨在透過產業鏈的垂直整合，吸引更多國內外科技大廠進駐南部，加速推動台灣南部科技產業的全面升級。", "think": "台灣的科技重心正在往南延伸，這不僅帶動地方就業，也為相關供應鏈帶來長期利多。上班族可關注南科周邊概念股的潛力。", "question": "科技聚落南移，會讓你考慮到南部尋找新的工作機會嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVEFVX3lxTE01OEdZOC1KMk5XMEZtTHF6eDM0aXBEZVFLZFRLYlFXN0gxMzl1OTcweVBCZEpQZUJObjRRRGVIWW1pZUYxQ3YwcVNEb2Vhck9vSmg4bw?oc=5", "name": "【飛揚新聞】"}]}, {"title": "宜鼎旗下安提推出旗艦款機器人大腦，搶攻邊緣AI商機", "teaser": "智慧大腦，賦能機器人", "full": "工業級儲存大廠宜鼎持股的子公司安提，針對機器人應用推出全新旗艦款運算平台。該產品如同機器人的「大腦」，能大幅提升邊緣端的AI運算效率，強化機器人在複雜環境中的即時反應與決策能力。", "think": "機器人要夠聰明，邊緣運算晶片與模組是關鍵。這項新品推出顯示台灣廠商在機器人核心零組件上已具備強大競爭力，值得長期追蹤。", "question": "當機器人擁有更聰明的大腦，你最希望它幫你分擔什麼工作？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiWEFVX3lxTFBQVkdGRVZMOEdXZmo3c1hDNlp5c2R0TXlXdGlvLTV1Ni1xN2JTRHhLQkczSG9qeWdEOG9CRGZMeVIwSGEySFhtb3drd1FRRDliZlZudXcyMTk?oc=5", "name": "CMoney"}]}, {"title": "明年科技預算飆2292億，主權AI與機器人成政策發展重點", "teaser": "政策加持，預算創新高", "full": "政府明年度的科技預算預計將大幅成長至2292億元，其中主權AI與智慧機器人技術被列為核心發展項目。精密零件大廠宇隆等企業也趁勢展示其最新研發技術，積極爭取政策紅利與未來的市場商機。", "think": "有政府預算與政策背書的產業，通常具有較高的安全邊際。科技預算的大幅成長，將為國內AI與機器人供應鏈注入源源不絕的資金活水。", "question": "政策大力扶持的AI與機器人領域，會是你的投資首選嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiggFBVV95cUxQVXIyVTQ1N2dNdWJOanNJN0h2SVp0cFN6N2VPUUdtel9NR2w5aFpqQ1RSV245ekxpb0hCZ196TzFrcHd4Q0FObTVmQTdCTlFqWW5aWlFBeVgzRnlnZngyenJKUjc3UEFIeTZDYU43VjU3SnN5bjdaN3NVMnpJQXNzZ0J3?oc=5", "name": "CMoney投資網誌"}]}, {"title": "黃仁勳造訪現代集團，深化自駕與機器人領域合作", "teaser": "巨頭聯手，開創自駕新頁", "full": "輝達執行長黃仁勳近日親自拜訪韓國現代集團，雙方就自動駕駛與智慧機器人等前沿領域探討深度合作。此舉顯示出輝達正加速將其強大的AI技術落地到實體載具中，為未來的智慧出行與工業自動化鋪路。", "think": "輝達的布局方向一向是科技界的風向球。自駕車本質上就是大型移動機器人，兩大巨頭聯手將加速自駕與工業機器人的商用化進程。", "question": "你認為自動駕駛普及後，會如何改變我們的通勤日常？", "sources": [{"url": "https://news.google.com/rss/articles/CBMifEFVX3lxTE01MGJIUEw3OGdoUkFDb3RDQ2tFNjdocTIwT1Bvd1Zid3p4aE5aaFZLU1NpdWdHRFhnel9EU2FYYWt6MTFLMlByMjhnRW1IZ21pZzRDZkx1a285bWU3NnNwb3dmRlIxQWxiOG9ZZllQQTRrZDdCNzVjNTlfQmU?oc=5", "name": "台視全球資訊網"}]}, {"title": "矽谷風向變了！百億美元資金湧入AI硬體與機器人深科技", "teaser": "熱錢湧入，硬體迎來黃金期", "full": "矽谷創投圈的資金流向正出現明顯轉移，高達百億美元的資金開始大量湧入AI硬體與機器人等「深科技」領域。這顯示出市場投資熱點已從純軟體研發，轉向能與物理世界進行實質互動的實體科技應用。", "think": "軟體固然重要，但能落地到硬體的「實體AI」才是未來。創投資金的流向通常預示著未來3到5年的產業大趨勢，硬體製造強國台灣將從中受益。", "question": "當全球資金轉向硬體與機器人，台灣的硬體供應鏈是否迎來了最佳時機？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTE1mVnlTSGwtczJYRk1sWXVVMjdNbzlUTkhhZ3hLYnEtSVA0R0E1bm4zN0RYckF2OFhrYklPbEVCOXBOWnhzdTh1Rk5zSm84LUh5Nmc?oc=5", "name": "蕃新聞"}]}], "tech": [{"title": "Google Home MCP發表，實現智慧家居與AI代理無縫接軌", "teaser": "智慧家居，AI管家來了", "full": "Google推出全新的Google Home MCP平台，允許第三方的AI代理與智慧居家環境進行深度結合。這項技術將讓家中的智慧裝置變得更加聰明，能夠主動理解並預測使用者的生活需求，實現無縫接軌。", "think": "智慧家居不再只是用手機開關燈，而是有AI幫你打理生活。這項技術的普及將帶動智慧物聯網（IoT）裝置的新一波升級潮。", "question": "如果家裡有一個無微不至的AI管家，你最希望它幫你做什麼？", "sources": [{"url": "https://ccc.technews.tw/2026/09/17/google-opens-early-access-to-model-context-protocol-for-google-home/", "name": "科技新報"}]}, {"title": "宏致積極布局BE業務，800V高壓線材預計年底完成驗證", "teaser": "高壓線材，搶攻車用商機", "full": "連接器大廠宏致全力衝刺BE業務，目標明年該項業務營收挑戰新台幣30億元。旗下關鍵的800V高壓線材產品預計將於今年底前完成客戶端驗證，為搶占高階電動車與快充市場奠定堅實的成長基礎。", "think": "電動車朝高壓快充發展已是必然趨勢，800V線材的驗證通過將是宏致業績爆發的催化劑。這反映出台灣零組件廠在電動車轉型中的關鍵地位。", "question": "面對電動車快充技術的演進，你看好哪些周邊零組件的成長潛力？", "sources": [{"url": "https://technews.tw/2026/09/17/hongzhi-be-business-targets-3-billion-next-year-800v-cables-year-end-validation/", "name": "科技新報"}]}, {"title": "日本財經雙   }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
