  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTE5GdWZnOXF3VmFvbGw3eEpGSjVva25HNkZzOVEtUGV5NWhXUFBNYnVnSFh1WlF6NjgtWnBORk1UMTZaVTVjMF9iMzcyVVpFaUxFVHc?oc=5", "name": "蕃新聞"}]}, {"title": "《金融》機器人理財9年規模衝187億 客戶近26萬", "teaser": "機器人理財規模逼近兩百億", "full": "金管會統計顯示，台灣機器人理財業務推動近9年來，資產管理規模已突破187億元，累積客戶數將近26萬人。以演算法自動調配資產、降低人為情緒干擾的智能理財模式，逐漸獲得年輕與通勤投資族群的青睞。", "think": "紀律投資與自動化資產配置，正成為忙碌現代人管理財富的主流工具之一。善用演算法輔助長期投資，有助於降低因市場短期震盪而產生的情緒化追高殺低。", "question": "面對市場高度波動，你會考慮運用自動化理財工具來維持長期投資的紀律嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE9wdlZqOUNNTVVMNmRvNmc3N2tRR0pmWkttVDJLczJaZXZhREVKcXdSMGxFaE9XejVxbksweXJrOWRzQUVvNkl4ZDdqUXZpZzljNEQ2NzFqVWNjcmR4VTVN?oc=5", "name": "工商時報"}]}, {"title": "三星SDS攜手OpenAI、Anthropic AI事業擴及機器人轉型", "teaser": "三星聯手AI巨頭攻機器人", "full": "三星SDS宣布與全球頂尖AI團隊OpenAI及Anthropic展開深度合作，將大型語言模型與生成式AI技術導入企業自動化流程，並全面跨足機器人智慧轉型，加速軟硬體整合的實體AI應用落地。", "think": "軟體巨頭的大型語言模型與硬體製造巨頭的實體設備深度結合，是機器人邁向自主思考的重要里程碑。跨國跨界結盟將是未來智慧科技發展的常態。", "question": "當生成式AI全面賦予機器人更聰明的大腦，你期待機器人最先幫你解決工作上的什麼痛點？", "sources": [{"url": "https://news.google.com/rss/articles/CBMijgFBVV95cUxOQnNvb0pWWFdRNzN4SzAzRTJUQ3FaN1pxNHlBSWpzd0JZQ243T0JNVTBULUQ5Zm5HdFptYWE0Y0h1bkJoNkktbHJObHdFYXJ3RUg3V1dNU2V4NEN0Zjl6ZWh5NzNhVlZLTEVmckNjZk13b0NCZ0xiT3RJc1ZjalBuV2VQLXBWc2lKeHhRZnpR?oc=5", "name": "DIGITIMES"}]}], "tech": [{"title": "確保擴產無虞！長鑫、長江提前囤足 3 年所需 ASML DUV 設備", "teaser": "陸半導體廠囤設備防堵封鎖", "full": "為防範地緣政治與出口管制進一步收緊，中國記憶體晶片大廠長鑫存儲與長江存儲已提前向ASML採購並儲備未來3年擴產所需的DUV微影設備，以確保產線擴充不受外部供應鏈限制影響。", "think": "半導體成熟與利基製程的競合持續加劇，提前囤貨凸顯供應鏈自主化的迫切性。未來全球半導體產能分布與設備市場將受到更多非市場因素的重塑。", "question": "各國積極追求半導體供應鏈自主化，對全球科技產業的分工效率會帶來什麼長遠改變？", "sources": [{"url": "https://technews.tw/2026/09/09/cxmt-and-ymtc-asml-duv-machines/", "name": "科技新報"}]}, {"title": "康寧拿下 Verizon 光纖 AI 基建大單 光通訊股齊飆", "teaser": "康寧奪光纖大單光通訊齊揚", "full": "材料大廠康寧成功取得美國電信巨頭Verizon的AI基礎建設光纖大單，帶動隔夜美股光通訊板塊全面大漲。AI資料中心與新世代電信網路對高速傳輸及超低延遲的要求，推動光纖與光模組需求爆發性成長。", "think": "算力擴張的背後必然伴隨巨量資料傳輸需求，光傳輸升級是AI基建不可或缺的拼圖。光通訊與高速傳輸概念股具備長期結構性增長題材。", "question": "在關注AI晶片之餘 股高檔震盪之際，具備高殖利率與低基期的傳產股，或許是資金避風港。", "question": "當電子股漲多時，你會考慮配置部分資金到景氣回溫的傳產股嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609080167.aspx", "name": "中央社"}]}, {"title": "台灣大推AI Agent　林之晨：未來3年是企業AI關鍵期", "teaser": "未來三年迎來企業AI關鍵期", "full": "台灣大哥大積極布局企業應用，推出全新AI Agent服務。總經理林之晨指出，未來三年將是企業導入AI的黃金關鍵期，電信業者將扮演關鍵的整合者角色，協助企業進行數位與智慧轉型。", "think": "電信業不再只是賣門號，而是透過AI加值服務轉型為企業方案提供者。這代表AI的應用端正在加速落地，未來能成功變現的軟體與服務業者將迎來新一波成長。", "question": "除了硬體製造，你認為台灣在AI軟體與應用端有哪些發展優勢？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609080159.aspx", "name": "中央社"}]}], "robotics": [{"title": "機器人進無塵室也要穿衣！豪紳從台灣首件無塵衣跨向設備防護", "teaser": "台灣首件無塵衣大廠跨界創新", "full": "隨著半導體製程高度自動化，無塵室內的機器人也需要專屬防護。台灣無塵衣先驅豪紳纖維，成功研發出機器人專用防護衣，不僅防止機器人運作時產生微塵，更保護高精密設備不受污染。", "think": "這則新聞展示了「隱形冠軍」的轉型智慧。當機器人普及，周邊的耗材、防護與保養需求也會跟著爆發，這類利基型市場往往藏著高毛利且穩健的投資機會。", "question": "在關注機器人本體的同時，你是否也注意到周邊配件與維護的商機？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiWkFVX3lxTE1ZdmlqMlRnemlINWI0Z3pqNnJCRU5EbmV0emQ4a09EOGRBTXRiQV90ZWNyLWFCM1d2Z3ZZNGpzbDdBbkpmLVhkc0w1TmJfVWhvT2ljRnVzRWI5dw?oc=5", "name": "工商時報"}]}, {"title": "營收暴增58%股價卻不買單？機殼大廠受惠散熱與機器人後市動能仍強", "teaser": "散熱與機器人題材後市可期", "full": "某機殼大廠公布8月營收暴增58%創下新高，然而市場股價卻未立即反映。儘管如此，分析指出受惠於散熱與機器人應用的雙重加持，該公司中長期的成長動能依然強勁，後市表現仍值得期待。", "think": "營收利多卻股價不漲，往往是市場主力在洗盤或利多實現的短期現象。投資人此時更應回歸基本面，若產業趨勢未變，短期的股價回檔反而可能提供良好的佈局時點。", "question": "面對「營收創新高、股價卻下跌」的背離現象，你會選擇買進還是觀望？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiS0FVX3lxTE9INDZSdS1aLW8yNWJFVHZLVm96YjhnTERLNFk4cnJWRE1SSEhLWXJoUEE3WE5TZFBiRU5tZUd6Tmt3M3hkR2JfVDhBNA?oc=5", "name": "FTNN 新聞網"}]}, {"title": "南市府與台糖簽訂MOU 新營糖廠變身機器人產業基地", "teaser": "傳統糖廠轉型科技研發重鎮", "full": "台南市政府與台糖公司正式簽署合作備忘錄，計劃將歷史悠久的新營糖廠轉型為現代化機器人產業基地。此舉將完善南台灣在機器人研發、實證與製造的完整布局，為地方注入科技新動能。", "think": "舊資產活化結合新興科技，是地方產業升級的絕佳範例。南台灣科技廊帶從半導體向機器人延伸，未來將吸引更多上下游廠商進駐，帶動周邊土地與產業鏈的長線價值。", "question": "隨著中南部科技園區陸續成形，這會如何影響你的置產或就業選擇？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE5zejA1a1JZMG9jYnJSa0FrLWk0aThHUnNBeFRYYVUwZ2l0b2NjNTREdTNl     '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
