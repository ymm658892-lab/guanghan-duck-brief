  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

入的資產呢？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608220047.aspx", "name": "中央社"}]}, {"title": "AI紅利催動經濟，2027年台灣人均GDP可望近5萬美元", "teaser": "AI浪潮助推台灣經濟", "full": "主計總處預測，在AI產業紅利與半導體供應鏈的強勁拉動下，台灣人均GDP將持續成長，預計在2027年有機會逼近5萬美元大關。這顯示台灣在全球科技轉型中扮演著無可取代的核心角色。", "think": "國家經濟看好，但上班族更要思考如何讓自己的技能與AI接軌，才能在這一波黃金成長期中分得一杯羹。", "question": "面對即將到來的人均五萬美元時代，你準備好提升自己的含金量了嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608220038.aspx", "name": "中央社"}]}], "robotics": [{"title": "人形機器人化身百米飛人，速度超越人類紀錄", "teaser": "機器人跑得比人還快", "full": "在最新的機器人展示中，一款人形機器人展現了驚人的爆發力，在百米奔跑中突破了人類極限紀錄。這項突破不僅展現了馬達控制與演算法的極致融合，也象徵人形機器人在動態平衡上的重大進步。", "think": "當機器人的體能與速度全面超越人類，未來在搜救、軍事或極端環境中的應用將會以想像不到的速度普及。", "question": "如果未來機器人能做得比人更快更好，人類的核心價值會是什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMid0FVX3lxTE5iUmxTbDFKdG8ySEpkWmplMUZIZlhxcmFISnR1c3hPb216c0RfVHI0NEFqTHRwVDBDa1FDM2N5d2lJdU02NVcwVUoybzRxcnJraVFJWWRldUpCM1hFTThVS1VZUU5oZGhQajdHQWNiQWgtQVVNRTBJ?oc=5", "name": "香港文匯報"}]}, {"title": "從好看走向好用，機器人加速融入千行百業", "teaser": "機器人實用化時代來臨", "full": "機器人技術正從實驗室的展示品，加速走向工廠、醫院與服務業等實際應用場景。透過更成熟的AI大模型賦能，機器人不再只是機械性地重複動作，而是能理解複雜指令並協助解決各行各業的缺工痛點。", "think": "缺工是全球趨勢，機器人「好用化」將會是自動化設備廠的巨大商機，相關概念股值得中長期投資人留意。", "question": "你的工作環境中，有哪些重複性高、最可能先被機器人取代的環節？", "sources": [{"url": "https://news.google.com/rss/articles/CBMidEFVX3lxTE9NT3dNVFFaUk4zeHQwVkhYTGlGc3IyaElqaE5TMG5HSEkzb0cwSjBseWdwRGhjbDZRS2ExckZ3UXVfdVBFSWt5TjdqVkFaTHQzMVJjUllkNjl2WGdfYnJoYi1RQTI4cnhwTzNKTXpsVzJTRjEz?oc=5", "name": "大公文匯網"}]}, {"title": "機器人奧運會終點設軟墊與擔架，防撞安全成焦點", "teaser": "機器人比賽也怕受傷", "full": "在一場機器人競技大賽中，主辦單位特別在百米終點線後方架設了軟墊牆與準備擔架。這並非為了人類，而是因為高速奔跑的機器人慣性極大，一旦失控可能造成機體嚴重損毀，凸顯了機器人控制安全的挑戰。", "think": "科技發展再快，安全與控制依然是落地應用的底線。這提醒我們在追求技術突破時，配套的防護與保險機制同樣是龐大商機。", "question": "在引進新科技時，我們是否也做好了應對失控風險的準備？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE9PcThwck1BQ3dGemcwc3I1ZXNTbEE4YmJwUXUyX2ExVy1zazhleDNiZzN3bW1lTnp6ZnBlVGY2QjN3RWF4Y0tXenZSazhHV0VBSHZnMmlR?oc=5", "name": "Business Insider Taiwan"}]}, {"title": "機器人運動會極限飆速，過彎失控引發火花", "teaser": "極限競速下的科技翻車", "full": "機器人運動會上，參賽機器人在極速過彎時因摩擦與失控，現場爆出激烈火花，引發觀眾驚呼。這場意外展現了機器人在極限物理邊界下，運動控制與硬體耐受度仍有待克服的技術瓶頸。", "think": "失敗是創新的必經之路。看到火花四射的同時，我們應該看見工程師在極限測試中累積的寶貴數據，這正是技術進步的養分。", "question": "面對工作或投資上的挫折，你是否也能像工程師一樣從中收集數據、持續優化？", "sources": [{"url": "https://news.google.com/rss/articles/CBMi2wJBVV95cUxNT1R2WVlQdWdqbWhZeldHUjdQZXEtQlhHbkNteE5aRzlVWXFxZklUZEZra0UzVnUxWDAwamxoUWEwS0FoSGk0S2R4SDFGeEIzeWJhVDY2SjU5SzZWMTJuUkEyNElMUHhMWXBwRjN0Tnp6S09xbWIzcEZ0NVp5WWVrV2VheDB3UDRUWTA1Q2ZfNU5WS0h5WjRRMHg2TkV3b0p2NTBPZlJIWmFseUQ1aTF0cUNJUEFpSGNVazNrbVZDajZjbmdTLWdIZW10cHlvSWwwT2I2dHNSOUZmMk4yTkNKZW9MRngtWXZVV2RtS2RyUEp2b0gwMUZzbEtYYlZSbWhSMGEzWTFwQXZ5Qi1nZDdzcldsRndQaHk2N2RVMjVLa3FSbzhrbUZsWnpfMW55MlNxZVhGSUp4RF9kcUQxT3djYUtyUTVJdXJES0VpbEZZNnFJM2JPSkxOTnJQVQ?oc=5", "name": "facebook.com"}]}, {"title": "人形機器人百米成績刷新，科技跨越新里程碑", "teaser": "速度極限再次被改寫", "full": "隨著關節驅動技術與即時感測演算法的突破，人形機器人在百米測試中跑出了超越人類世界紀錄的佳績。這項成就證明了機械結構在特定運動表現上，已經具備超越生物極限的物理潛力。", "think": "機器人超越人類速度只是起點，未來的關鍵在於如何將這種高超的運動能力，轉化為日常生產力與高難度協作。", "question": "當機器人的物理極限超越人類，你認為哪些人類特質是機器人永遠無法取代的？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiZ0FVX3lxTE9DLVRnUC1CZnk4dDBJZlo2VHpsbFFyS1BQMWIxS0JHNTdRYmJpWFA0d1N3RE5qR0VfeVpneWhOSXVVa1NPaFBfbHFzNnYxQ09wVk1XMUJEWEdCenAydFJleHdfQjdlcjA?oc=5", "name": "中國評論新聞"}]}], "tech": [{"title": "AI代理「幫上課」成風潮，高等教育迎來新危機", "teaser": "學生下令AI代讀大學", "full": "隨著AI代理技術成熟，許多學生開始利用AI幫忙聽課、寫作業甚至參與討論，自己只負責下達指令。這種現象引發教育界擔憂，認為這可能徹底瓦解傳統高等教育的學習意義與評量機制。", "think": "AI工具能提高效率，但若連「思考與學習」的過程都外包，終將失去個人競爭力。在AI時代，主動學習的態度反而變得更加稀缺與珍貴。", "question": "你在使用AI工具時，是在提升效率，還是悄悄外包了自己的思考能力？", "sources": [{"url": "https://technews.tw/2026/08/23/i-found-a-prompt-that-keeps-ai-agents-from-taking-tasks-too-far/", "name": "科技新報"}]}, {"title": "超級電腦資料塞車有解！新壓縮術速度暴增640倍", "teaser": "數據傳輸速度大躍進", "full": "科學家研發出全新的資料壓縮技術，每秒可吞吐高達60GB的數據，讓超級電腦的資料傳輸速度暴增640倍。這項突破有效解決了高效能運算中的資料塞車痛點，將大幅提升AI訓練與科學模擬的效率。", "think": "數據傳輸是算力時代的隱形瓶頸。這項壓縮技術的突破，將直接惠及雲端運算與大數據分析，是半導體與伺服器產業的重要利多。", "question": "當數據傳 <script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
