  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

人的保單是否涵蓋天然災害相關保障？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610220420.aspx", "name": "中央社"}]}, {"title": "薔琵颱風影響 台積電10/24運動會取消", "teaser": "颱風影響台積運動會取消", "full": "考量颱風薔琵路徑與氣象預報的潛在風雨風險，台積電宣布取消原定於10月24日舉辦的年度運動會。這項決定主要是為了維護全體員工與家屬的安全，防範氣候異常造成的意外風險。", "think": "大型企業彈性調整活動安排以員工安全為優先，展現風險管理意識。這也提醒通勤族在颱風天應隨時注意防颱資訊與通勤安全。", "question": "極端氣候頻率增加，你平時是否做好隨時應對突發天氣變化的準備？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610220413.aspx", "name": "中央社"}]}], "robotics": [{"title": "輝達前團隊打造新創 Dream Labs 獲 9,000 萬美元融資，推出通用機器人 API", "teaser": "輝達前團隊獲鉅額融資", "full": "由輝達前技術團隊成立的新創公司 Dream Labs 成功籌得 9,000 萬美元資金，並發布軟體開發者專用的通用機器人 API。此舉旨在降低軟體工程師開發機器人應用的門檻，加速具身智慧落地。", "think": "通用API的普及將軟體開發與硬體控制解耦，大幅縮短機器人產品開發週期。未來機器人開發可能就像寫手機App一樣便利。", "question": "當機器人開發門檻大幅降低，哪些產業最快會迎來自動化轉型？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiZEFVX3lxTE1WSGdxNldGRldBNHUxZHo5ckVQQkVZS0FacTBGaXMzNGVEbjN6c3lYS2diOUtlMVk2ekw1N3FUVk9YU01CcUVUWUFfcXpNa1RrZVhwQ3c4bEFIejFCdDJPUnQycmM?oc=5", "name": "TechNews 科技新報"}]}, {"title": "防晶片生產受阻 美FCC核准英特爾外國機器人豁免", "teaser": "美國豁免晶片廠外國機器人", "full": "為了確保本土半導體晶圓廠的順利建置與產能推進，美國聯邦通信委員會（FCC）核准了英特爾引進外國製造機器人設備的豁免申請。此舉展現出政策在晶片法案落實過程中的彈性度。", "think": "高科技製造業極度依賴高度自動化設備，供應鏈彈性至關重要。政策豁免反映出實體產業對自動化裝備的強烈硬性需求。", "question": "地緣政治與產業供應鏈的拉鋸，會如何影響未來高階機器人的發展？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiYEFVX3lxTE10UVpKaUd4c21hb0pSalVPdjFfbU1DV2ZERzV2QVQ0aHdDTmU4b3FBZ2ZuMmYwU001U3BDVWxUQlM3SVJtME9kY0h6UUs2UVJhelBnLTltZ0hWX1RYZ29LMQ?oc=5", "name": "民視新聞網"}]}, {"title": "照護機器人難在理解人體 AI建模、物理模擬成關鍵", "teaser": "AI建模解決照護機器人痛點", "full": "長照與照護機器人被視為高齡化社會的關鍵解方，但互動時的人體安全與精準力道控制技術難度極高。業界目前正透過AI人體建模與物理模擬技術，提升機器人在照護情境下的安全性與靈巧度。", "think": "照護機器人不僅是硬體開發，更是複雜的人機互動與安全AI驗證。隨著技術突破，銀髮經濟將成為機器人落地的巨大市場。", "question": "面對高齡化趨勢，你是否期待未來由機器人輔助照護家中長輩？", "sources": [{"url": "https://news.google.com/rss/articles/CBMijgFBVV95cUxPbmV5bXdXN2NseHROM3FUbmJyYkozRVlFRXpOc080dG9CNDB6T3d1M0l2OTNMRS1paUQybGEwRFllbjMySEN2WWR1bmVhbUc5b1FZZUtaTlBkdXV5YzdIa3o1X1NtREJXS2k3VGdYeF9ncXV6YTBCTTNYOXlBeVBLVjVfc0djN0tZY2F4Vm5n?oc=5", "name": "DIGITIMES"}]}, {"title": "特斯拉Optimus人形機器人拚明年底出貨", "teaser": "特斯拉機器人拼年底出貨", "full": "特斯拉持續推進 Optimus 人形機器人的量產進程，目標是在明年底前實現市場出貨。隨著供應鏈逐漸成熟與內部工廠驗證，特斯拉希望能率先在自家工廠部署，並逐漸擴展至商業銷售市場。", "think": "人形機器人從概念展示進入量產時程表，標誌著實體AI進入商業驗證期。供應鏈台廠若能進入相關組件供應，將帶來長期動能。", "question": "若人形機器人普及，你認為對你目前的日常工作會產生什麼改變？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTE9xTVpjYTVROTZjbWw4T1VEc0NJWUdrM2NoNGlFRmRDOExVYjdUNkxFZHpNN2F1d3hzOTlVN3Axel9WNDFNVWR0WjhoeTBOdXJO?oc=5", "name": "UDN"}]}, {"title": "評析：機器人泡沫能吹多久？ 宇樹估值慘修正、實體AI迎考驗", "teaser": "估值修正考驗實體AI實力", "full": "隨著資本市場對AI概念轉趨理性，部分機器人新創面臨估值下修與融資收緊的考驗。市場評析指出，實體AI不能僅停留在展示影片階段，唯有落實具體應用場景與盈利模式，才能在資本寒冬中生存。", "think": "高估值概念股迎來擠水分過程，這有助於市場資源重新回歸到真正具有商業化能力的團隊。投資人應關注落地應用而非單純話題炒作。", "question": "在科技泡沫與技術突破之間，你如何判斷新技術的真實價值？", "sources": [{"url": "https://news.google.com/rss/articles/CBMia0FVX3lxTE1ON0JqV3djdlp4MHVJMUxjS2dRN0VIbERzZ0JSTlduYTB4emFwXzBvWE9tQ0FsRHRyV2JzZGRZNUdUbEpoOWxzaHVXMjBReEdROWtJM0J6OFZMM3U5OTJqUHdoOGlseTE1X1FJ?oc=5", "name": "DIGITIMES"}]}], "tech": [{"title": "中國前 9 個月召回逾 2,000 萬輛智慧汽車，警告勿犧牲安全搶上市", "teaser": "智慧汽車品質堪憂大召回", "full": "中國監管單位公布數據顯示，今年前 9 個月已召回超過 2,000 萬輛智慧汽車，並對車企發出警告，不得為了搶先上市而忽視產品安全。多數召回涉及車載軟體故障與輔助駕駛系統漏洞。", "think": "智慧汽車本質上是輪子上的大型電腦，軟體穩定度直接關係人生安全。車企在快速迭代時，若缺乏嚴謹品管將面臨巨大品牌風險。", "question": "購買智慧車款時，你更看重新穎的軟體功能還是成熟的安全紀錄？", "sources": [{"url": "https://technews.tw/2026/10/23/china-recalled-over-20-million-smart-cars-in-first-9-months-warning-against-sacrificing-safety-for-market-launch/", "name": "科技新報"}]}, {"title": "006208 啟動分割計畫！預估一張變八張重返發行價 30 元以上", "teaser": "006208股票分割降門檻", "full": "熱門台股ETF富邦台50（006208）計畫進行股票分割，預計將「一張拆成八張」，使單價回落至約30元水平。此項舉措主要是為了降低小資族與定期定額投資人的入場門檻，提升市場流動性。", "think": "股票分割不改變ETF的總市值與底層資產價值，但能大幅降低投資門檻。這反映出投信業者積極爭取小資族與定期定額買盤的策略。", "question": "降低單價門檻後，會增加你透過ETF定期定額投資台股的意願嗎？", "sources": [{"url": "https://finance.technews.tw/2026/10/23/segmentation/", "name": "科技新報"}]}, {"title": "Vibe Coding 太普及，企業需守住關鍵步驟以免日後付出更高代價", "teaser": "AI寫程式快但需守住品質", "full": "隨著AI輔助編程（Vibe Coding）在開發者之間迅速普及，許多程式碼生成速度大幅提升。然而業界專家提醒，忽視基礎架構審查與安全測試可能導致日後維護成本劇增，企業必須維持關鍵審核機制。", "think": "AI工具能顯著提升工作效率，但缺乏專業監督容易積累技術債。無論任何領域，人為的品質把關依然是防範重大失誤的最終防線。", "question": "日常使用AI提升效率時，你是否有建立個人審核與確認品質的機制？", "sources": [{"url": "https://infosecu.technews.tw/2026/10/23/vibe-coding-be-sure-to-include-these-critical-development-steps/", "name": "科技新報"}]}, {"title": "市場投資人難以被滿足，科技大廠資本支出變化引發美股科技股重挫", "teaser": "資本支出過高引發科技跌勢", "full": "美股巨頭持續擴大AI基礎建設支出，但市場開始審視這些龐大資本投下的短期變現能力。由於投資人對財報指引的期望極高，任何支出增加或獲利增速放緩的疑慮，都觸發了近期科技股的劇烈拋售。", "think": "科技巨頭陷入AI軍備競賽，資本支出成為雙面刃。短期內企業盈餘可能受折舊與支出壓抑，投資人需要給予產業轉型更多耐心。", "question": "當市場對AI熱情暫時降溫，你認為科技大廠會放緩資本支出腳步嗎？", "sources": [{"url": "https://finance.technews.tw/2026/10/23/changes-in-capital-expenditures-by-major-tech-companies-triggered-a-sharp-drop-in-us-tech-stocks/", "name": "科技新報"}]}, {"title": "路透：台積電探尋稀土零組件替代方案，防中國管制衝擊", "teaser": "台積電尋稀土替代防管制", "full": "外媒報導指出，台積電正積極尋求稀土相關零組件與材料的替代方案，以因應潛在的地緣政治出口管制風險。此舉旨在降低對單一國家關鍵礦產的依賴，確保先進製程晶片產能不受突發管制影響。", "think": "供應鏈去風險化已成為全球晶片龍頭的最高原則。台積電超前部署替代供應鏈，展現出高度的企業韌性與風險管理能力。", "question": "科技大廠積極進行去風險化，對相關替代材料供應鏈帶來哪些新商機？", "sources": [{"url": "https://technews.tw/2026/10/23/tsmc-seeks-factory-equipment-alternatives-to-thwart-chinas-rare-earths-grip/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-1300">{"date": "10月23日．週五", "tldr": "午安！今日台股受美股科技股重挫與AI疑慮波及而拉回修正，費半大跌超過6%，但在基本面如工業生產指數連紅支撐下，午盤持續消化賣壓，上班族午休不妨放寬心胸，理性看待短期波動。", "indicators": {"note": "美科技股與費半因AI投資疑慮重挫，直接拖累台股與台積電ADR今日開低走低，反映出國際資金在盤勢高檔時的避險與調節動作。", "tiles": [{"label": "台股加權指數", "value": "46,041.43", "valueClass": "fall", "delta": "-1.81%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "26,008.86", "valueClass": "fall", "delta": "-2.60%", "deltaClass": "fall"}, {"label": "費半指數", "value": "10,731.98", "valueClass": "fall", "delta": "-6.72%", "deltaClass": "fall"}, {"label": "台積電ADR", "value": "412.35", "valueClass": "fall", "delta": "-4.52%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "AI投資疑慮加劇美科技股重挫　油價上漲拖累日股收低", "teaser": "國際股市走跌連動台股", "full": "受到市場對AI相關投資報酬的疑慮加深，美股科技股出現明顯重挫，連帶影響亞股表現。油價上漲也進一步推升通膨壓力，拖累日股等區域市場收低，整體國際資金風險偏好顯得保守。", "think": "當美股科技巨頭因AI投資回報問題遭到修正時，供應鏈完整的台股很難完全置身事外。這提醒我們，面對國際利空時，檢視手中持股的實際訂單與基本面，比盲目隨盤勢起伏更重要。", "question": "面對美股科技股的領跌，你的投資組合是否具備足夠的防禦力？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610230128.aspx", "name": "中央社"}]}, {"title": "AI需求暢旺　9月工業生產指數年增19.17%、連31紅", "teaser": "強勁基本面支撐產業", "full": "受惠於全球對人工智慧與高效能運算的需求持續暢旺，帶動相關產業鏈出貨熱絡。我國9月工業生產指數延續成長態勢，繳出年增率雙位數的亮眼成績單，達成連續31個月正成長的記錄。", "think": "儘管股市短線因情緒面拉回，但實體經濟與出口動能依然穩健。短期的盤勢震盪往往是市場情緒的反應，長線來看，有實質AI訂單與產能支撐的企業，才是度過亂流的定海神針。", "question": "在總體經濟數據亮眼但股市下跌時，你認為這是危機還是布局的好機會？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610230153.aspx", "name": "中央社"}]}, {"title": "亞股收盤互有漲跌　科技股收復早盤部分失土", "teaser": "盤中跌幅收斂現韌性", "full": "亞洲主要股市在午盤過後呈現互有漲跌的局面，早盤受到美股大跌衝擊而走弱的科技股，在部分低接買盤進場下，陸續收復了早盤的部分失土。整體盤勢並未出現全面性的恐慌性崩跌。", "think": "跌深後的買盤進場說明市場並非全面看壞，科技股展現了一定的抗跌韌性。對上班族投資人來說，午盤的收斂暗示市場情緒正在沈澱，不必在恐慌中急著砍在阿呆谷。", "question": "看到科技股試圖收復失土，你會選擇觀望還是進場撿便宜？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610230166.aspx", "name": "中央社"}]}, {"title": "畢業生投入職場　9月失業率3.36%創26年同月歷年最低", "teaser": "就業市場維持穩定", "full": "隨著畢業季新鮮人陸續投入職場並找到工作，國內勞動市場供需保持平穩。9月的失業率創下26年來同月的歷史最低紀錄，顯示整體就業與經濟活動維持在相當健康的狀態。", "think": "失業率處於極低水準，代表內需與整體經濟基底相當扎實，有助於支撐國內消費市場。對上班族而言，這也意味著職場轉職或本業發展的安全性與選擇性相對充裕。", "question": "就業市場的穩定，會不會增加你對本業發展或兼顧投資的信心？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610230161.aspx", "name": "中央社"}]}, {"title": "美光桃園工會堅持分潤制　協商因颱風延至27日", "teaser": "勞資權益備受關注", "full": "美光在桃園的廠區因工會堅持爭取分潤制度，原訂的勞資協商會議受到颱風影響而順延至27日舉行。這場協商牽動外商半導體廠的員工福利與薪酬結構，成為科技圈關注焦點。", "think": "科技業不僅看股價，勞資關係與人才留任也是企業長遠發展的關鍵。這類分潤機制的討論，反映出高科技產業勞工對自身權益的重視，也值得投資人關注企業人事成本的變化。", "question": "你如何看待科技製造業勞資雙方在分潤制度上的拉鋸與溝通？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610230158.aspx", "name": "中央社"}]}], "robotics": [{"title": "AI機器人推升晶片運算力與軟體服務需求 NVIDIA以7成市佔領跑", "teaser": "龍頭穩居機器人核心", "full": "隨著AI機器人應用加速落地，市場對底層晶片運算能力與相關軟體服務的需求急速攀升。輝達（NVIDIA）憑藉其強大的生態系與技術優勢，在相關領域拿下高達7成的市佔率，穩居領跑地位。", "think": "機器人的本質就是「具身AI」，而晶片與運算力是所有智慧硬體的軍火庫。當我們看好機器人產業時，掌握底層運算標準的權威企業往往是風險最低、最具確定性的切入點。", "question": "在機器人浪潮中，你是傾向投資賣鏟子的晶片商，還是應用端的機器人品牌？", "sources": [{"url": "https://news.google.com/rss/articles/CBMifEFVX3lxTE9IYTRPTXluQnFGbVU4S3VzTmhnSUZfVEU4UFIyY1VKRjI0TG5pX3NjRDlSaUdpREZhbG9SN2Mwa05qenZpWmhTb3pVSHJ2QVpzQy1oRFhtQVBRT2lxTVA3eGZQVnJLdC15bDNFV1hRc0N5RUxKWXVOTzE0WXQ?oc=5", "name": "DIGITIMES"}]}, {"title": "美股異動｜英特爾盤前升超3%，美國FCC批准針對“機器人進口禁令”的豁免申請", "teaser": "政策鬆綁激勵族群", "full": "美國聯邦通信委員會（FCC）針對一項機器人進口禁令批准了豁免申請，消息一出激勵相關科技股盤前表現，英特爾等概念股也隨之走高。這項政策放寬緩解了供應鏈對零件與設備流通的擔憂。", "think": "政策與法規往往是科技創新落地最大的推手或絆腳石。這次豁免顯示官方對於新興自動化硬體進口的態度轉趨務實，對整個供應鏈的全球化佈局是一劑強心針。", "question": "政策面開綠燈對機器人產業鏈的推進有多大幫助？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTE9vRkNZcS1IdS1vX0RHOFJsdnVCR2lVb3hFNzc0UmM4RExJUVRGNXoteGltMFcwRVJjWUw4SWVJSGozVmVkN1hOOVU3ajBINVJscmVpM1U1VE5wX3A5OVpGUTNuc3VBbF9qNlE?oc=5", "name": "TradingView"}]}, {"title": "美國限制外國機器人反傷本土市場？IDC 估人形機器人 2030 年營收較預期少 58%", "teaser": "地緣政治牽動商機", "full": "市場研究機構 IDC 發布最新評估指出，若美國持續對外國機器人施加嚴格限制，恐將反而傷害本土市場的發展動能。預估這將導致人形機器人在2030年的整體營收規模較原先預期大幅減少58%。", "think": "這是一個典型的保護主義雙面刃，過度防範可能導致本土產業失去規模化與快速迭代的機會。對於長線投資人來說，地緣政治對供應鏈造成的成本墊高與延遲，是不可忽視的隱形成本。", "question": "當國安與產業發展發生衝突時，技術普及的速度是否會被嚴重犧牲？", "sources": [{"url": "https://news.google.com/rss/articles/CBMikAFBVV95cUxOZUNTSE1reWUzckRYVEtnZUtKcDIzT0tNbk9PZmRLeWlwbUpMWTA4YlhiRlJUUW5zUEVRc0poZTFhblMzR0w2NXprNjNCV2FVcTZOWHM5SkZCaTZ2YUlYaXFSOWJYZWMwN185WF9lVm1ESUNZN3hQbUhLVVV5UUZqODhic2RnbXBBdlNUUFdCS0Q?oc=5", "name": "TechOrange 科技報橘"}]}, {"title": "陸股逾5,000檔下跌滬指失守3,600點、機器人逆勢走強", "teaser": "資金避風港抗跌性高", "full": "在今日大盤走弱、超過5000檔個股下跌且滬指失守3600點的弱勢格局中，機器人概念股展現出相對抗跌的走勢，成為盤面資金逆勢點火的焦點板塊，吸引短線資金目光。", "think": "當大盤慘綠而特定題材逆勢突圍，通常代表有特定買盤或政策加持，具備高度話題性。不過這也伴隨較高的波動風險，投資人追高時仍須留意整體市場的系統性風險。", "question": "在全面拉回的盤勢中，能逆勢走強的次產業是否具備更強的主流爆發力？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTFAtSkZiSm5ubU11TVA2YVZIb3Z1djdfTVM5X0RSaGFkR0dfX0NSbDZQU0NQTVlCQU9fZnNISHdKdElHdUdPUDROT2hKaEJfNVBnd2xhR1AyZE5zQTAtRHgzNXZFSDVLSi1EeUE?oc=5", "name": "旺得富理財網"}]}, {"title": "【IPO追蹤】傳松延動力港股秘密遞表：萬元人形機器人的破局者？", "teaser": "平價機器人拼上市", "full": "市場傳出人形機器人新創企業松延動力已向港交所遞交上市申請，主打人民幣萬元級距的親民定價策略試圖打破市場僵局。若順利掛牌，將為人形機器人的商業化量產與資本籌措開啟新篇章。", "think": "人形機器人要走入尋常百姓家或一般工廠，「價格」絕對是最大痛點。當製造商開始主打平價並尋求資本市場奧援，意味著機器人正從實驗室展示走向真正的規模化商業競爭。", "question": "你期待家裡出現一台萬元等級的人形機器人幫忙做家事嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMieEFVX3lxTE5IR0tOVUx2SkktX2RreGdzT3RWUnNVcE9Ca011LTRtNmZGRFFKZUVnNlBEWUVTNUVTOXZiaGF6bGxiaThSaTR1bXRGaHRsMUpGVkNjeFVGdlgyMVh6ZUtndEpHcmpNbndyS3RfOFRoQzQzUnFfRFh3Sg?oc=5", "name": "財華網"}]}], "tech": [{"title": "576 顆 GPU 合體成一顆巨型 GPU，輝達揭露 Rubin Ultra NVL576 架構", "teaser": "算力極限再度突破", "full": "輝達在技術發表中揭露了全新的 Rubin Ultra NVL576 架構，透過將高達576顆GPU完美合體，打造出如同單一顆巨型運算晶片的強大效能，再次將AI資料中心的算力極限推向新高度。", "think": "AI模型的規模成長沒有極限，對基礎設施的要求也以等比級數上升。這種「巨型GPU」的設計思維，顯示出硬體效能瓶頸必須透過架構創新來破解，也確保了上游先進封裝與代工廠的高訂單能見度。", "question": "當AI算力需求持續以超乎想像的速度成長，晶片架構的極限究竟在哪裡？", "sources": [{"url": "https://technews.tw/2026/10/23/nvidia-to-connect-576-rubin-ultra-gpus-using-cpo-to-create-one-giant-gpu/", "name": "科技新報"}]}, {"title": "日本擬設 AI 資安專隊，以模擬攻擊對抗 AI 網攻趨勢", "teaser": "以AI防範AI攻防戰", "full": "因應日益猖獗的AI自動化網路攻擊趨勢，日本政府計劃成立專門的AI資安防禦部隊。該團隊將利用人工智慧進行實時的模擬攻擊與防守演練，藉此強化國家關鍵基礎設施的資安韌性。", "think": "科技雙面刃在資安領域最為明顯，駭客用AI攻擊，防守方也必須用AI應戰。這也帶動了全球企業對資安防護與AI防禦系統的龐大採購需求，是科技支出中不可或缺的剛性需求。", "question": "在萬物皆聯網的時代，你對個人與企業的數位資安防護有足夠信心嗎？", "sources": [{"url": "https://infosecu.technews.tw/2026/10/23/japan-to-reorganize-defense-research-around-ai-cyber/", "name": "科技新報"}]}, {"title": "PHP 漏洞修補前四天已遭攻擊，AWS 揭駭客提前鎖定目標", "teaser": "零時差漏洞威脅大", "full": "雲端巨頭亞馬遜AWS發布安全報告指出，某個熱門程式語言PHP的重大漏洞，在官方正式發布修補程式前的四天內，就已經遭到有心駭客精準鎖定並發動攻擊，凸顯零時差漏洞的防範難度。", "think": "資安漏洞的揭露與修補永遠存在時間差，而這段空窗期往往是駭客溫床。這提醒軟體開發商與企業管理者，自動化更新與持續漏洞掃描比事後補救更為重要。", "question": "面對防不勝防的零時差攻擊，企業該如何建立更敏捷的資安防禦網？", "sources": [{"url": "https://infosecu.technews.tw/2026/10/23/php-loopholes-aws/", "name": "科技新報"}]}, {"title": "日本免稅改「退款制」，11 月起先付含稅價出境再退稅", "teaser": "訪日旅遊新規上路", "full": "日本政府針對外國旅客的購物免稅制度進行重大變革，預計從11月起取消現行的店鋪內直接扣除免稅額方式，改為旅客必須先支付含稅價格，並在出境時統一辦理退稅手續。", "think": "這對經常去日本旅遊的台灣上班族來說是一大消費習慣改變，不僅購物當下的流程變繁複，出境時的退稅排隊人潮也可能增加。政策變動往往會影響海外旅遊的消費意願與體驗。", "question": "日本改採出境退稅制後，會影響你未來到日本血拼的消費規劃嗎？", "sources": [{"url": "https://finance.technews.tw/2026/10/23/japan-tax-free-system-changes-refund-model-november-pay-tax-inclusive-departure-refund/", "name": "科技新報"}]}, {"title": "iPhone Duo 完美復刻任天堂 DS，摺起手機還能讓遊戲休眠", "teaser": "創意硬體概念吸睛", "full": "科技社群近期流傳一項有趣的硬體概念設計「iPhone Duo」，完美復刻了經典掌機任天堂 DS 的雙螢幕摺疊造型。當手機摺疊起來時，還能自動讓執行的遊戲進入休眠狀態，引發果粉熱烈討論。", "think": "這種跨界與復古的設計點子，展現了消費者對於智慧型手機外型求新求變的渴望。雖然多半是概念性質，但也啟發了硬體製造商在摺疊機設計上可以有更多跳脫傳統的想像空間。", "question": "如果真的有一款能玩懷舊掌機的摺疊iPhone，你會想買單嗎？", "sources": [{"url": "https://technews.tw/2026/10/23/iphone-duo-nintendo-ds/", "name": "科技新報"}]}]}}</script>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
