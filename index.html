  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

"sources": [{"url": "https://news.google.com/rss/articles/CBMiWEFVX3lxTE43bEs4dG4yM1NoYk9Qd0UwcXNUMDR5N1hrWXZBOFpMWHVncWNEN1JTQlRZdE1JMFlIYThna05Va2Y0X190ODBFYlBWT0ZSazlHYVdTMHNVZzI?oc=5", "name": "Techritual"}]}, {"title": "AI與機器人真正走進現實世界", "teaser": "AI與機器人全面走入現實", "full": "隨著軟硬體技術的成熟，人工智慧與機器人正在擺脫過去純粹的概念炒作，真正走進現實世界的各個應用場景。從物流、製造到日常服務，技術的落地速度正在超越許多人的預期。", "think": "科技從「想像」變成「日常」的速度往往比我們想像的更快。身為上班族，主動了解並適應這些新工具，將能幫助自己在職場上保持競爭優勢。", "question": "你有感受到身邊的AI與機器人服務變多嗎？這對你的生活有什麼影響？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTFA3M19DczloYlU5ZEJ5UGphUmY4b2NIc2h0YVRTV1ltWmlnRm95eUJLWVRpcHZTRG9JNl9kTnhDdjdSMjJLd0tVbTZQV3FaNG1YTlE?oc=5", "name": "蕃新聞"}]}, {"title": "3C科技/從展演到實戰：世界人形機器人運動會繪就具身智能新圖景", "teaser": "人形機器人從展演走向實戰", "full": "透過近期舉辦的世界人形機器人運動會等大型活動，人形機器人的發展已經從單純的技術展演，逐漸轉為考驗真實作戰能力的實戰階段。這標誌著具身智能正朝著更複雜、更具實用性的方向快速演進。", "think": "當機器人開始比拼「實戰能力」，代表它們離真正分擔人類工作不遠了。這不僅是工程技術的突破，也將重新定義未來勞動市場的樣貌。", "question": "你心目中完美的人形機器人，第一件要幫你做的事情是什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMidEFVX3lxTE9YTDA5SnJDeTRVQV9aM2E0ak1ObGFGam5jczJXMG5TaGF0NUIxZnJZdjh6cE5iOVloSjB6c1BNZGx3akRTNTUteUM1NDQ3OEpKMWtCbDFHdTFweUEwM0VWaWM2WEV2OWt0VDNSLWZsMkFHOWNw?oc=5", "name": "大公文匯網"}]}], "tech": [{"title": "締造 93 倍報酬操盤手清原達郎：別妄想抓準市場高點，當心日股過熱與 AI 基礎設施投資泡沫", "teaser": "傳奇操盤手示警AI與日股泡沫", "full": "日本傳奇操盤手清原達郎指出，投資人切勿妄想精準抓到市場高點，並特別提醒市場應當心日股過熱以及AI基礎設施可能存在的投資泡沫。這類來自市場老手的警語，在行情熱絡時往往提供了一股冷靜思考的力量。", "think": "在大盤氣勢如虹的時候，聽聽資深操盤手的風險警示，有助於投資人克制貪婪。居安思危、做好資金控管，永遠是市場長青的不二法門。", "question": "面對市場熱度，你如何確保自己不會被FOMO（錯失恐懼）沖昏頭？", "sources": [{"url": "https://finance.technews.tw/2026/09/20/tatsuro-kiyohara/", "name": "科技新報"}]}, {"title": "你越低潮它越推，首份腦波研究證實短影音演算法恐加劇負面情緒迴圈", "teaser": "腦波研究揭露短影音負面循環", "full": "最新腦波研究首度證實，當使用者處於低潮情緒時，短影音平台的演算法往往會推播更多類似內容，進而加劇使用者的負面情緒迴圈。這項發現凸顯了演算法機制對人類心理健康的潛在影響。", "think": "我們以為是自己在滑手機，實際上可能是演算法在操控我們的情緒。適度關掉螢幕、覺察自己的心理狀態，是現代數位生活的重要課題。", "question": "當你心情不好時，是不是也習慣刷短影音？這真的有幫你放鬆嗎？", "sources": [{"url": "https://technews.tw/2026/09/19/social-media-algorithms-depression/", "name": "科技新報"}]}, {"title": "書籍總量激增 19 倍、營收卻只漲 8 倍，AI「書海戰術」發威導致單本收入暴跌", "teaser": "AI書海戰術致單本收入暴跌", "full": "在AI工具的助攻下，出版市場的書籍總量出現爆炸性成長，但整體營收的漲幅卻遠遠追不上數量，導致單本書籍的平均收入大幅暴跌。這反映出AI雖然降低了創作門檻，但也引發了嚴重的資訊過載與價值稀釋問題。", "think": "當內容生產變得無比廉價，稀缺性就會轉移到「能見度」與「真正的品質」上。無論是寫作還是其他知識工作，建立個人獨特的觀點比單純拼產量更重要。", "question": "在資訊爆炸的時代，你有多久沒有好好讀完一本書了？", "sources": [{"url": "https://technews.tw/2026/09/20/ai-disrupts-publishing-industry/", "name": "科技新報"}]}, {"title": "錢卓望遠鏡發現神祕 X 射線天體，或能解答天體物理學兩大難題", "teaser": "錢卓望遠鏡解密神祕X射線", "full": "天文學家利用錢卓望遠鏡觀測到神祕的X射線天體，這項重大發現有助於科學界解答長期困擾天體物理學的兩大難題。基礎科學的每一小步，往往都是人類拓展宇宙認知的重要里程碑。", "think": "雖然這類天文發現不能馬上幫我們賺錢，但它展現了人類對未知世界的探索精神。保持好奇心，也是在繁忙工作中維持生活熱情的好方法。", "question": "如果宇宙中真的有未解的神祕訊號，你希望它是來自哪裡？", "sources": [{"url": "https://technews.tw/2026/09/19/nasas-chandra-unveils-mysterious-x-ray-objects/", "name": "科技新報"}]}, {"title": "台股 9 月六檔 ETF 逆勢狂吸金！00962 受益人單月大增 41.32%", "teaser": "台股ETF逆勢吸金表現亮眼", "full": "儘管市場環境多變，台股仍有特定ETF展現強大吸金能力，其中部分標的單月受益人大幅成長。這顯示國內投資人對於透過ETF進行資產配置的熱情不減，資金持續向熱門主題靠攏。", "think": "ETF成為全民理財的主流工具，反映出上班族偏好紀律投資與分散風險的理財習慣。不過在跟風熱門標的時，仍需看清其底層成分股是否符合自己的投資屬性。", "question": "你的投資組合裡有幾檔ETF？你挑選它們的核心標準是什麼？", "sources": [{"url": "https://finance.technews.tw/2026/09/19/00962/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-1300">{"date": "9月20日．週日", "tldr": "今天台股量能回溫，指數震盪盤堅大漲；科技界關注AI學習與CPO技術量產，機器人應用也正加速走入日常生活。", "indicators": {"note": "這四項指標反映出台股今天氣勢如虹，伴隨美股與台積電ADR的強勢表現，整體市場投資信心十分強勁。", "tiles": [{"label": "台股加權指數", "value": "47,368.04", "valueClass": "rise", "delta": "+3.31%", "deltaClass": "rise"}, {"label": "那斯達克", "value": "26,522.54", "valueClass": "rise", "delta": "+0.39%", "deltaClass": "rise"}, {"label": "費半指數", "value": "11,921.69", "valueClass": "rise", "delta": "+2.78%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "434.67", "valueClass": "rise", "delta": "+1.02%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "台股量能回溫 類股輪動推動指數震盪盤堅", "teaser": "量能回溫類股輪動", "full": "台股近期交易量明顯回溫，在各類股輪流表態與資金健康輪動下，推動大盤指數呈現震盪盤堅的走勢。這顯示市場資金信心逐步恢復，投資人操作意願提高，整體市場氛圍偏向樂觀，有利於後續多頭格局的延續。", "think": "當大盤呈現輪動格局時，代表資金並非單一集中在特定族群，這對散戶來說是個好現象，有助於分散風險。在操作上，不宜盲目追高，反而可以留意尚未起漲但基期較低的優質個股。", "question": "你的持股是否也跟上這波輪動的節奏了呢？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609200021.aspx", "name": "中央社"}]}, {"title": "印度發展半導體尋跨國合作 龍頭大廠肯定台灣領先地位", "teaser": "印度尋求半導體合作", "full": "印度正積極發展本土半導體產業，並積極尋求跨國合作夥伴。國際龍頭大廠也公開肯定台灣在全球半導體供應鏈中的領先地位與關鍵角色，這顯示台灣在全球科技版圖中仍具有不可替代的戰略價值，未來合作機會將更廣泛。", "think": "台灣半導體的實力再次獲得國際認證，這不僅穩固了台廠的國際地位，也為相關供應鏈帶來長期的合作商機。隨著各國積極建構自主供應鏈，台灣的技術輸出與跨國合作將成為未來幾年的重要成長動能。", "question": "面對地緣政治變化，你如何看待台灣半導體的長期投資價值？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202609190239.aspx", "name": "中央社"}]}, {"title": "資安署籲中小企業強化資安 代理式AI須設人工審核", "teaser": "代理式AI須人工審核", "full": "數位發展部資安署呼籲國內中小企業必須強化資訊安全防護，特別是針對新興的代理式AI應用，應建立人工審核機制以防範潛在風險。隨著AI技術快速普及，企業在享受便利的同時，也面臨更多新型態的資安威脅與考驗。", "think": "AI雖然好用，但資安依然是企業運作的命脈。對於投資人來說，隨著政府與企業對安全防護的重視提高，資安概念股在未來數位轉型中將是不容忽視的長期題材，值得提前佈局。", "question": "在你的工作環境中，是否有針對AI工具制定相應的安全規範？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609200029.aspx", "name": "中央社"}]}, {"title": "數位憑證皮夾擬增購票驗證 防黃牛機器人搶票", "teaser": "數位皮夾防黃牛搶票", "full": "政府規劃在數位憑證皮夾中新增購票驗證功能，期望透過更嚴格的身份識別技術，有效阻擋黃牛利用自動化機器人惡意搶票。這項措施旨在維護公平的消費市場秩序，讓一般民眾能更有機會以合理價格購得熱門票券。", "think": "這項政策若能成功落地，不僅能保障一般大眾的消費權益，也展示了數位身分驗證技術在日常生活中的實際應用場景。這類「信任科技」在未來的數位經濟中將扮演越來越關鍵的角色。", "question": "你認為結合數位憑證的購票系統，能徹底解決長久以來的黃牛問題嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609200016.aspx", "name": "中央社"}]}, {"title": "國科會：未來科技館閉幕 加速科研成果走向市場應用", "teaser": "加速科研成果商業化", "full": "國科會主辦的「未來科技館」圓滿閉幕，官方強調將會持續加速國內學術與研究機構的科研成果轉化，幫助優質技術順利走向市場商業應用。這不僅能提升台灣產業的競爭力，也能讓前瞻科技切實解決社會大眾的日常痛點。", "think": "科研成果能成功商業化，才是推動產業升級的關鍵。投資人可以多留意學術界與產業界合作的最新動向，這往往是尋找下一波具備爆發力之「黑馬股」的重要線索。", "question": "你會傾向投資已經獲利穩定的老牌企業，還是擁有前瞻技術的科研新創？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609190216.aspx", "name": "中央社"}]}], "robotics": [{"title": "英特爾搶實體AI大餅！新一代處理器攻機器人 逾130項設計落地", "teaser": "英特爾新處理器攻機器人", "full": "英特爾積極搶攻實體AI市場，推出專為機器人設計的新一代處理器，目前已有超過130項相關設計成功落地應用。這展現了英特爾在邊緣運算領域的野心，也預示著未來機器人將擁有更強大的自主運算與即時反應能力。", "think": "晶片大廠紛紛跨足機器人領域，顯示「硬體+AI」的實體化應用已是不可逆的趨勢。這不僅會帶動整體機器人供應鏈的蓬勃發展，也為半導體產業開闢了智慧型手機與PC之外的全新藍海市場。", "question": "隨著晶片效能提升，你認為下一個會被機器人普及化的行業是什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMi8gJBVV95cUxNVk93QWVfYTRRQmhLRmxBSDBNSHE4MDJnY1BkMWhPOTl1d09qdWNqLWxyS0FxUktOYVRxZ2RUWkk0Nm9oRGZXbHlHcFg3bGNRTm54LU0yOG9fT3BBUEdyeUFXSFhiUmkxNjVNWmgzVy1RSE5CT2RSaWNXQUdua1NzN2FMZWpxZ1pIX0dfTnpzZFgzNS1lT2o2c3VfYUt3WTJxYnhRckw3TzZJSFZFZUJmWGR4dzVtNFNZYWp6d2RsMm5NcWVSQ1VTOW9yUUhRa3M4VTJnU2F1OWg5dUJBb2Z6QWwwOHJzNFRNeGl4SXc3T25NM2s5dm5fMU1QR045Q2dBelBiNGJPR19zUG1WUFJoVzNYVWNheVdlelN3UmVOel9IWlJTbVFhQ2pKbTZPVXB3WkxBWm9qMlFkTHJBbFBrZlZxOVNBUzlkRTNQV1BPS2o1NDJkUGN3ZTVjQ2c4SUhfcko2Tk55REFRMlpFaHIzcGxB?oc=5", "name": "Yahoo新聞"}]}, {"title": "97%壟斷全球！馬斯克直接點名中國：中國機器人已成美國最大對手", "teaser": "馬斯克點名中製機器人", "full": "特斯拉執行長馬斯克公開表示，中國在機器人製造領域的供應鏈與產能極具威脅，甚至已掌握全球極高市佔率，成為美國在該領域的最大競爭對手。這番言論點出了美中在硬體製造與AI技術上的激烈角力已延伸至機器人產業。", "think": "機器人產業已上升到國家競爭力層級。美中兩大強權在AI與硬體製造的角力，將會影響未來全球供應鏈的重新解構，而擁有高精密製造優勢的台灣廠商，有望在其中扮演關鍵的關鍵供應角色。", "question": "面對中美機器人產業的競爭，台灣供應鏈應該如何定位自己以爭取最大利益？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiSEFVX3lxTFBQSV8wakVldkZwbmVxcEc5S1FrNF93d1dTcXRhUE9LYV8ybGZYXzdGdENMWUxVeTdneFp6NkVrQ09mdjhNdlN3Sw?oc=5", "name": "鉅亨號"}]}, {"title": "免特訓直接上工！美打掃機器人親民價比鐘點工便宜 鋪床摺衣都行", "teaser": "便宜打掃機器人問世", "full": "美國推出一款主打親民價格的打掃機器人，不需複雜設定即可執行鋪床、摺衣服等日常家務，費用甚至比聘請傳統鐘點工還要劃算。這項產品的問世，代表家用服務型機器人正朝向高實用性與低門檻邁進，有望加速走入尋常百姓家。", "think": "家務機器人從高不可攀的科技玩具，逐漸走向平價與實用化，這意味著大眾消費市場的機器人時代即將加速到來。這不僅能釋放人類的家務時間，也將徹底改變家政服務產業的商業模式。", "question": "如果家務機器人價格降到與一般家電相當，你會考慮買一台來幫忙做家事嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiTEFVX3lxTFBoNUxsX1FxWE1iOGZCSkNGZFh6eDJhNFl6TnhYT0hQRzd3T21tZ2dXMzFfU0tha3dDb1UxTVJXVXMwbFMtWDBTU0dYbFXSAVJBVV95cUxPNTczNDUyNkVyaVlZa3paX2x4U2tGZzRKcXVmWWZ0VWlqVy1UVy1iWHZuS21mMGxOMDBOcjJTTVExclhfNmt4UC1fd2JHbEQxME93?oc=5", "name": "NOWnews今日新聞"}]}, {"title": "焦慮不敢上學？英校派「機器人替身」代打 76%學生成功返校", "teaser": "機器人替身助學生返校", "full": "英國學校引進「機器人替身」幫助因焦慮症而無法上學的學生，透過遠端參與課堂互動，成功讓高達76%的學生最後順利重返校園。這項創新的科技應用，不僅解決了學生的學習中斷問題，也展示了科技在輔助心理健康上的溫暖力量。", "think": "機器人不僅能代替人類勞動，還能在心理諮商與社會適應上扮演輔助角色。這為科技的人文關懷開闢了全新路徑，也提醒我們在評估科技價值時，除了產值，更要看重其帶來的社會效益。", "question": "你認為科技工具在未來是否能完全替代人類在情感與社交上的陪伴需求？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiT0FVX3lxTFBaN053WU9zeXBLbmdTVVhRZXQ0U2liUXIyd2NKUngyUHhXTjRVQVdZb3FqWS1qNmlVMWRkbUpnb2huenRGX0tJWk5aZmpfSEk?oc=5", "name": "TVBS新聞網"}]}, {"title": "戶外區域占9成 台南山上水道引進機器人割草機", "teaser": "台南引進機器人割草機", "full": "台南山上花園水道博物館因戶外綠地面積廣大，正式引進自動化機器人割草機來協助日常維護，大幅節省人工除草的時間與人力成本。這項舉措不僅提升了園區的管理效率，也為公共綠地維護展示了智慧自動化應用的可行性。", "think": "勞動力短缺已是各行各業面臨的共同難題，地方政府與公共設施導入機器人，正是解決人力荒的具體示範。未來這種「機器人勞動力」在公共服務領域的滲透率將會越來越高。", "question": "在你的日常工作或生活中，有哪些重複性高的體力活也適合交給機器人處理？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiZEFVX3lxTE8tV1RBSURMWkpsNUFocWxDUHVjcFhhX0FsMFNFWnhRcThwTVpuaHpHZW5KLXBhbHlVM3d6eU5oc0dOU3JPYWpVQkYxQzFRdjdSeWlEZU1Kekx6TjlMLWtUTk9CQUjSAWpBVV95cUxQOVd0czBZTVQwVTA2dWY4WUxzLUhKR28wSWtZTEU4V0xtYV9yemJ2U3ZxOE9aVHlfOVZpTDdkd3RPRURfTXJiVDR4UGE4VmhwbVFEaWJFV1VxQVhmdktEU3FFVG53cU80WnB3?oc=5", "name": "自由時報"}]}], "tech": [{"title": "「AI 對學習來說很糟糕！」吳恩達談育兒與職場：用 AI「出題」比直接要答案更重要", "teaser": "吳恩達談AI與學習方法", "full": "AI大師吳恩達指出，若只用AI直接要答案，對學習有害無益。他建議不論是育兒或職場，應該翻轉思考，用AI來給自己「出題」進行自我挑戰與思維訓練。這樣才能真正理解知識，並在AI輔助下培養更深層的批判性思考能力。", "think": "這給了上班族很好的啟發：與其把AI當成幫你寫報告的懶人工具，不如把它當作思考的教練。主動提問、引導AI給予反饋，才能在AI時代保持個人不可被取代的深度思考競爭力。", "question": "你平時使用AI時，是習慣直接要答案，還是會引導它與你進行深度對話？", "sources": [{"url": "https://technews.tw/2026/09/20/andrew-ng-says-ai-is-bad-for-learning/", "name": "科技新報"}]}, {"title": "CPO 產品結構持續演進，均英精密 FAU 客製檢測從抽樣導入量產測試", "teaser": "CPO檢測導入量產測試", "full": "共同光學封裝（CPO）技術持續演進，均英精密成功將光纖陣列（FAU）客製化檢測技術，從原本的抽樣檢驗正式導入量產測試階段。這代表該技術已具備高度成熟度與穩定性，有助於加速下一代高速傳輸元件的規模化生產與應用。", "think": "CPO是下一代半導體傳輸的關鍵技術。檢測技術走向量產化，代表這項前瞻科技正加速走向規模商用。對於投資人而言，相關檢測與封裝供應鏈的商機即將爆發，是值得持續追蹤的硬實力題材。", "question": "隨著高速傳輸需求大增，你是否有提前佈局CPO這類具備未來潛力的科技題材？", "sources": [{"url": "https://technews.tw/2026/09/20/gen-precision-brings-custom-fau-testing-into-mass-production-testing/", "name": "科技新報"}]}, {"title": "每天一杯手搖飲代價有多大？哈佛最新研究：胃癌風險狂飆 2.5 倍", "teaser": "手搖飲恐飆胃癌風險", "full": "哈佛大學最新研究指出，每天飲用一杯手搖飲料，可能會讓罹患胃癌的風險大幅飆升2.5倍，呼籲大眾正視高糖飲料對身體的長期危害。對於習慣靠含糖飲料紓壓的現代人來說，這項數據警示了飲食習慣與重大疾病之間的直接關聯。", "think": "對於每天靠手搖飲慰勞自己的上班族來說，這無疑是個震撼警訊。在追求工作效率與生活小確幸的同時，更要兼顧身體健康，畢竟健康才是你最重要、且無法用金錢買回的終身資產。", "question": "看完這項研究，你今天下午還會打算點一杯全糖手搖飲來喝嗎？", "sources": [{"url": "https://technews.tw/2026/09/20/sugary-drinks-gastric-cancer-risk/", "name": "科技新報"}]}, {"title": "不需電力、沒有邏輯電路，科學家開發史上算術最快的 DNA 分子電腦", "teaser": "科學家開發DNA分子電腦", "full": "科學家成功研發出新型的DNA分子電腦，這款電腦不需要傳統電力與邏輯電路，卻能展現史上最快的算術速度，為運算科技帶來全新突破。這項研究打破了傳統矽晶片的物理限制，為未來的生物運算與超高速科技開闢了全新可能。", "think": "傳統晶片物理極限即將到來，生物運算（如DNA電腦）提供了另一種突破框架的可能。雖然距離商業化仍有一段路，但這讓我們看見科技跨領域融合的無限想像，也為未來的科技投資指引了全新方向。", "question": "你認為生物科技與資訊科技的跨界融合，在未來十年會如何改變我們的生活？", "sources": [{"url": "https://technews.tw/2026/09/20/scaffolded-dna-molecular-computer-basic-operation/", "name": "科技新報"}]}, {"title": "台灣大深化內容布局，攜智寶推〈電鋸甜心 2〉進軍全球遊戲版圖", "teaser": "台灣大進軍全球遊戲版圖", "full": "台灣大哥大持續深化在內容與娛樂產業的佈局，宣布攜手智寶公司共同推出經典遊戲續作，積極開拓全球遊戲市場版圖。這項合作顯示出電信業者正透過跨界整合，積極尋求傳統電信業務以外的新成長曲線，以提升長期競爭優勢。", "think": "電信三雄不再只靠傳統資費賺錢，跨足遊戲與影音內容已成顯學。這種多元化經營策略，有助於提升企業的長期獲利韌性與估值。投資人在評估電信股時，其數位娛樂版圖的發展也將是關鍵指標。", "question": "你在評估電信股投資時，除了看殖利率，也會考量他們在數位娛樂領域的佈局嗎？", "sources": [{"url": "https://finance.technews.tw/2026/09/20/taiwan-mobile-nada/", "name": "科技新報"}]}]}}</script>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
