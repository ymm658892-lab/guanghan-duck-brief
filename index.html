  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

<script type="application/json" id="slot-1300">{"date": "10月3日．週六", "tldr": "今天台股盤中微幅上揚，台積電法說會與台英半導體合作成市場焦點，同時美中機器人與AI競賽持續升溫。", "indicators": {"note": "美股與台積電ADR強勢領漲，帶動台股盤中維持紅盤，顯示半導體與AI供應鏈依然是市場信心支撐。", "tiles": [{"label": "台股加權指數", "value": "48,475.74", "valueClass": "rise", "delta": "+0.25%", "deltaClass": "rise"}, {"label": "那斯達克", "value": "27,190.86", "valueClass": "rise", "delta": "+1.19%", "deltaClass": "rise"}, {"label": "費半指數", "value": "13,136.67", "valueClass": "rise", "delta": "+2.40%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "472.78", "valueClass": "rise", "delta": "+2.96%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "台英簽署科學技術協議！攜手推動矽光子與半導體人才合作", "teaser": "台英科技合作再升級", "full": "台灣與英國正式簽署「科學創新及技術合作協議」，未來將聚焦於矽光子、半導體人才培育及生物技術等三大關鍵領域。這項合作不僅能強化台灣在國際半導體供應鏈的戰略地位，更可藉由英國的學術研發實力，為台灣產業注入高階研發能量。", "think": "這顯示半導體已非單純商業競爭，而是升級為國家級的戰略防線。台英合作將為台灣科技人才開啟更多國際舞台，也讓矽光子等前瞻技術的商用化時程更加明朗。", "question": "身為投資人，我們該如何提早佈局下一個世代的矽光子概念股？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610030090.aspx", "name": "中央社"}]}, {"title": "AI強勁助攻！精測9月及第3季營收雙雙創下新高", "teaser": "AI測試需求大爆發", "full": "半導體測試介面大廠中華精測受惠於AI晶片測試需求強勁，9月及第三季營收表現亮眼，創下歷史新高紀錄。同時，PCB大廠南電營收也創下同期次高，反映出高階載板與測試介面在AI熱潮下，正迎來穩健的復甦與成長動能。", "think": "晶片設計再好，也必須通過嚴格的測試才能出貨，這正是精測等測試廠的價值所在。這提醒我們在關注AI晶片大廠之餘，供應鏈中的測試與載板等隱形冠軍同樣極具投資潛力。", "question": "在AI供應鏈中，除了晶圓代工，你還注意到哪些不可或缺的周邊關鍵廠商？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610030077.aspx", "name": "中央社"}]}, {"title": "台英經貿對話企業團規模創10年新高！雙方戰略合拍成關鍵", "teaser": "台英經貿熱度達頂峰", "full": "今年台英經貿對話的英國企業團規模創下十年來新高，顯示英國對台灣市場與產業實力的重視。官方表示，雙方在半導體安全、綠能及數位貿易等領域的「戰略合拍」是促成此次盛會的關鍵，未來雙邊經貿交流將更加緊密。", "think": "地緣政治變化讓歐洲各國更積極與台灣建立實質經貿連結。這對台灣企業來說，是拓展歐洲市場、分散地緣風險的絕佳時間窗口，也為相關概念股帶來長期利多。", "question": "面對台英經貿深化，哪些產業最有可能率先受惠並擴大歐洲版圖？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610030043.aspx", "name": "中央社"}]}, {"title": "台積電是否赴德州建第2園區？15日法說會聚焦先進製程與擴產", "teaser": "全球關注台積電法說", "full": "市場高度關注台積電是否會前往美國德州建立第二個生產園區，所有的謎底預計將在15日的法說會上揭曉。屆時，法人與投資人將聚焦於台積電在先進製程的 東南亞的效應持續發酵，越南作為製造業新重鎮的地位正日益鞏固。", "think": "東南亞市場的崛起不容小覷，特別是越南在供應鏈重組中受惠極深。對於尋求海外資產配置的投資人來說，東協相關基金或在越南有深厚佈局的台商，都是值得長線關注的標的。", "question": "隨著越南經濟高速成長，這會如何影響台商在全球供應鏈的產能布局？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202610030194.aspx", "name": "中央社"}]}, {"title": "和泰車看好第4季車市穩健 估全年新車銷量維持43萬輛", "teaser": "台灣車市年終買氣不減", "full": "汽車龍頭和泰車表示，展望第4季台灣車市表現依舊穩健，預估全年台灣新車市場總銷量將可維持在43萬輛的高水準。這顯示國內消費動能依然強勁，車廠也將在年底傳統旺季推出更多新車款刺激買氣。", "think": "汽車銷量是內需消費的重要指標。在通膨壓力下，台灣車市仍能維持43萬輛的預估值，顯示中高階消費力並未衰退，對於內需型產業或汽車零組件供應鏈來說是一顆定心丸。", "question": "面對電動車與燃油車的轉型期，你認為傳統車廠該如何維持高市佔率？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610030157.aspx", "name": "中央社"}]}], "robotics": [{"title": "馬斯克自曝Optimus量產難關 機器人概念股面臨考驗", "teaser": "特斯拉機器人量產路漫漫", "full": "特斯拉執行長馬斯克近期透露，旗下人形機器人Optimus在邁向大規模量產的過程中，面臨了許多技術與供應鏈上的嚴苛難關。這項消息為近期熱絡的機器人投資市場澆了一盆冷水，引發市場對商用化時程的重新評估。", "think": "創新科技從實驗室走向工廠量產，本來就充滿挑戰。馬斯克的坦言提醒投資人，機器人概念股雖然前景看好，但短期內仍需面對技術落地與良率的陣痛期，投資佈局不宜過度追高。", "question": "當科技巨頭都坦言量產困難時，你認為這會延後機器人普及的時間嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiW0FVX3lxTE96RXdCVDJQakdUSTZrNEV6bUZzV2NtVldpMWFtNVJJNmJ5UVpIVmhubTA2eDNFelNKUXphU1lOTnBpSXNtanBQbmNtYlU4RHZqVUlmX0ZXQmc3VTg?oc=5", "name": "非凡新聞台"}]}, {"title": "小型人形機器人崛起 投資者需重新思考市場格局", "teaser": "輕量化機器人成為新焦點", "full": "隨著技術演進，體積更小、成本更低的小型人形機器人正快速崛起。分析指出，這類機器人因具備較高的部署彈性與價格優勢，可能比大型人形機器人更快實現商業化，投資人需要重新評估機器人產業的市場格局。", "think": "我們常想像機器人要像人一樣高大，但「剛好夠用、成本低」的小型機器人，反而可能最先幫企業省錢。在投資機器人產業時，實用性與商用速度往往比炫目的技術更重要。", "question": "面對不同尺寸的機器人，你認為哪一種最先進入我們的日常生活或辦公室？", "sources": [{"url": "https://news.google.com/rss/articles/CBMijgFBVV95cUxNdXh1eTdVTmxxU0dfeVJLQTBTSVRacWQ5NmllckoxWEtZNWgxM042MWFVcmluTE9SS2gzV3l2RW5GLS01TEIxT1psT1dDUHgwdGpubU80bUpFa0J3WldqYnpaRVlaX3JQaURyT2I3b3FmN3FGWEttRHQ2dHBBbU1YWU42cHpkclFLNWU3dzVB?oc=5", "name": "CMoney投資網誌"}]}, {"title": "人形機器人產業被半身機搶戲？出貨數據恐誤導投資人", "teaser": "釐清機器人出貨數據迷思", "full": "市場分析指出，目前人形機器人產業中，許多出貨量其實是由結構較簡單的「半身機」所貢獻，這可能讓投資人誤判全功能人形機器人的普及速度。專家警告，解讀出貨數據時應更加謹慎，避免被樂觀的數字誤導。", "think": "投資新興產業最怕看錯數據。分清「半身」與「全身」機器人的技術差距，能幫我們過濾掉市場炒作的雜音。這提醒上班族在做投資功課時，必須深入了解產品的實際規格與應用場景。", "question": "在評估科技新創公司時，你通常會用什麼方法來驗證其產品的真實市場需求？", "sources": [{"url": "https://news.google.com/rss/articles/CBMizwFBVV95cUxQSUk3ZkFmekNZSnYyM1BSMlAyTXVKb01LZnQtYk1mR3dSd1lyaWdhQ0dQZU9acnBRaGNFbU8xQ3U4ZENfc2RHZmNSYVd1U1Z6X1RhazNJMHZvLW9mYXlRc2VDdEtzZUxFamVJQ3JGLTZ2NEZCeXU5OWREd1ZfMk02elZnSzVuMjlNYkM2QjhCd1E1X21hOTlYSTdfajVaX3VVWVFueEdhcHNBcEl1S1dpanFkTXY4SG5tT3l5M0dkYm0tYVZGMVBYemR5bmpadWM?oc=5", "name": "CMoney投資網誌"}]}, {"title": "AI與機器人加速標本數位化 英國打造網路超級博物館", "teaser": "科技讓七千萬件標本重生", "full": "英國正利用人工智慧與機器人技術，加速將館藏高達7千萬件的生物標本進行數位化，計劃打造一座無邊界的網路超級博物館。這項科技應用不僅大幅縮短了傳統人工數位化的時間，也為科學研究開創了全新可能。", "think": "機器人的應用不只在工廠，文化與科學領域也是大有可為。這顯示出「AI+機器人」正在重塑人類保存歷史與知識的方式，未來相關的數位化服務與雲端儲存需求將持續看漲。", "question": "當歷史文物都能被完美數位化，你認為實體博物館的價值會因此提升還是降低？", "sources": [{"url": "https://news.google.com/rss/articles/CBMipAFBVV95cUxOQjRURnBLc2hLZUFTdUZfS2dzRklxSXY1dU8yUzFRM3lqTkQtdkE4cVZxTUtwTWtQdDF5YTZ6NUF1cnNrVUFHelNUWGNhckRfckFvSWVOaDRPM29NOVVjbHc4QkJyNVBZNnBuTkhiOGZ3OWQ5c2VCRTE4bWZ1cDU3eklYd0ptWHlRY2ZBb1NQWllrcVdCRFlxZWVjVG9KSm1mazRnYw?oc=5", "name": "TechNews 科技新報"}]}, {"title": "機器人也有專門學校？分科實訓持證上崗成新趨勢", "teaser": "機器人也需要考證照上班", "full": "為了讓機器人能更精準地投入特定產業，市場上開始出現為機器人量身打造的「專門學校」。透過分科實訓，機器人必須通過特定技能檢定並「持證上崗」，以確保其在工作崗位上的專業度與安全性。", "think": "連機器人都需要上學拿證照，這不僅是技術標準化的體現，也代表未來的職場將是「人機協作」的專業時代。身為上班族，我們更需要思考如何提升自己無法被機器人標準化取代的獨特價值。", "question": "如果未來連機器人都有專業證照，你覺得人類有哪些能力是永遠無法被標準化的？", "sources": [{"url": "https://news.google.com/rss/articles/CBMidEFVX3lxTE1adUpXSkdhbHVMNmlsYXZfaXlObFp6NkZPOXpwSXBqU2REWFpMMUdHSVBhUjBSWGFzUVI0UzN3cE1EOEFQcUdiY0V3a09jWEVZUW9YY00xNE9mSGdyRXc1SUkwcF84SlJ2Xzh5YWdDWnJKVWd3?oc=5", "name": "flamingwheels.online"}]}], "tech": [{"title": "近九成開發者用AI寫程式 報告指出信任與驗證成新挑戰", "teaser": "AI寫程式普及但仍需把關", "full": "美國學界最新報告指出，目前已有將近九成的軟體開發者在使用AI輔助編寫程式。然而，隨著AI產出內容的增加，如何建立有效的信任機制與驗證流程，確保程式碼的安全與正確性，已成為軟體產業的下一個重要關卡。", "think": "AI工具已經成為工程師的標配，這大幅降低了技術門檻。但這也意味著「會寫程式」不再是絕對優勢，「懂得驗證與debug」的邏輯思考能力，才是未來職場上更值錢的黃金技能。", "question": "當AI大幅降低寫程式的門檻，你認為未來的程式設計師該如何證明自己的價值？", "sources": [{"url": "https://technews.tw/2026/10/03/engineering-trustworthy-software-systems-with-ai-at-scale/", "name": "科技新報"}]}, {"title": "為付離婚財產分割金 SK會長崔泰源擬出售巨額持股", "teaser": "豪門離婚案引發股權變動", "full": "韓國第三大財閥SK集團會長崔泰源，為了支付高昂的離婚財產分割金，正計畫出售價值高達9,440億韓圜的集團持股。這項舉動引發市場對於SK集團未來股權結構與經營權穩定性的高度關注。", "think": "企業大老的私人生活，有時對股價與公司治理的影響不亞於市場景氣。這提醒投資人在評估家族企業或集團股時，除了看財務報表，大股東的股權結構與潛在變動風險也是必須納入考量的重要因子。", "question": "面對大股東因私人因素被迫出售股權，身為一般投資人你會選擇避開還是逢低布局？", "sources": [{"url": "https://technews.tw/2026/10/03/sk-chairman-chey-tae-won-sell-94-4-billion-won-in-sk-shares/", "name": "科技新報"}]}, {"title": "華為最新麒麟9050 Pro晶片照曝光 垂直堆疊技術受矚目", "teaser": "華為晶片堆疊技術再突破", "full": "華為最新的麒麟9050 Pro晶片照片在網路曝光，顯示其採用了兩層Die（裸晶）垂直堆疊的先進封裝技術，成功在限制下進一步縮小晶片尺寸。這顯示在面臨外部技術封鎖的情況下，中國半導體業者正積極透過封裝創新來尋求突圍。", "think": "垂直堆疊技術的應用，反映出在無法取得最先進製程設備時，晶片設計廠如何透過「架構創新」來壓榨出更多效能。這股自主研發的趨勢，將持續牽動全球半導體版圖的消長。", "question": "面對封裝技術的快速演進，你認為這會縮短非先進製程與先進製程之間的效能差距嗎？", "sources": [{"url": "https://technews.tw/2026/10/03/huaweis-latest-kirin-9050-pro-chip/", "name": "科技新報"}]}, {"title": "三星量產Exynos 2700晶片 產能提升並搭載新旗艦機", "teaser": "三星新晶片量產力拼對手", "full": "三星電子宣布已開始量產採用先進製程的Exynos 2700晶片，據悉產能提升了10%以上。這款新一代晶片預計將搭載於未來的Galaxy S27等多款旗艦手機中，展現三星在行動處理器市場與對手一較高下的決心。", "think": "三星在晶片代工與自有處理器上的進展，直接關係到其與台積電、高通等對手的競爭態勢。產能的提升有助於降低成本與提高市佔率，是科技股投資人評估智慧型手機供應鏈時的重要風向球。", "question": "三星新晶片的量產，是否會改變你對未來旗艦智慧型手機市場的品牌偏好？", "sources": [{"url": "https://technews.tw/2026/10/03/samsung-electronics-starts-mass-production-of-exynos-2700/", "name": "科技新報"}]}, {"title": "川普召集科技巨頭擬簽AI憲法 機制能否解失控風險引熱議", "teaser": "科技巨頭齊聚共商AI規範", "full": "美國前總統川普計畫召集黃仁勳、馬斯克等科技巨頭，共同簽署一項「AI憲法」，並規劃了四層稽核機制來防範AI失控的風險。這項舉措引發了科技界與政界對於AI監管力道與創新自由之間平衡的熱烈討論。", "think": "當AI技術發展到連國家領袖與科技巨頭都必須聯手制定規範時，代表AI的影響力已深入社會運作的底層。未來的AI發展不再只是技術競賽，合規性與道德標準將成為企業能否走得長遠的關鍵。", "question": "如果由科技巨頭自己來制定「AI憲法」，你認為這能真正保護一般民眾的權益嗎？", "sources": [{"url": "https://technews.tw/2026/10/03/trump-ai-constitution-jensen-huang-tech-giants-four-layer-audit-prevent-ai-rogue/", "name": "科技新報"}]}]}}</script>

}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
