  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

與理財計畫會做何種調整？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609150011.aspx", "name": "中央社"}]}, {"title": "台積電德國廠封頂儀式 擇吉日、滿鏟土融入台灣習俗", "teaser": "台積電德廠舉行封頂儀式", "full": "台積電位於德國德勒斯登的新廠舉行完工封頂儀式，活動特別融入擇吉日與滿鏟土等台灣傳統習俗。這象徵著台積電全球化佈局邁入新里程碑，持續鞏固歐洲車用半導體供應鏈。", "think": "跨國擴廠不僅是產能延伸，更是企業文化的輸出與全球供應鏈的重新布局。護國神山的全球影響力擴大，長期有利於強化台灣半導體的競爭壁壘。", "question": "台灣科技業持續拓展海外產能，這對於在地供應鏈供應商帶來哪些新契機？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609150017.aspx", "name": "中央社"}]}], "robotics": [{"title": "波士頓動力Atlas機器人才剛起步 2027 IPO機率低", "teaser": "波士頓動力短期難上市", "full": "分析指出波士頓動力的Atlas人形機器人仍處於技術迭代與商業化初期，預計2027年前上市公開募資的機率較低。這反映出高端人形機器人要走向大規模商業化仍需時間突破。", "think": "機器人技術雖然充滿未來感，但從實驗室走到資本市場盈利需要漫長轉化。投資人切忌將科技前景直接等同於短期股價回報，需理性觀察商業化落地節奏。", "question": "你認為人形機器人要走入一般家庭或工廠，目前最大瓶頸是技術還是成本？", "sources": [{"url": "https://news.google.com/rss/articles/CBMikAFBVV95cUxQY01JMVBxT21WeTRZTDJvRzNLakZWN3JSVm1GMEJlM2dfRUsyTlV6Z1dOMl9WQ1NjQjNqdV9LaXI5cExDZUtwcXZwWnhaLThnZV9pSEhSM3pLTVh6XzZCb3lvVGdkYmxTZDJqajUwdDF2MXNxejgtM2JfeUlSUkVYYTcwX2JRUHJFOFJoRU9WRXQ?oc=5", "name": "MoneyDJ"}]}, {"title": "Travis Kalanick機器人新創延攬Meta老將掌舵AI職務", "teaser": "機器人新創延攬巨頭老將", "full": "Uber創辦人卡拉尼克成立的機器人新創公司Atoms，近日成功挖角Meta資深高管擔任AI部門負責人。此舉顯示頂尖人才正從傳統軟體巨頭流向實體AI與機器人新創領域。", "think": "人才的流向往往代表下一個產業風口所在，軟硬整合與具身智慧成為頂尖工程師新舞台。職場人可關注這波AI實體化所創造的跨領域求職機會。", "question": "軟體高管轉戰機器人硬體領域，對於個人職涯發展提供了什麼新的思考方向？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE9UdjNUMlNvU09FS0lPWWxyNjdFRXFudFBaUWV5Yml4MzR3MnFFUWJZMXdEMlNrRjNhV2lLWlJTT092cEd3am1sYUxzOFB1MjF2d1hKTVRR?oc=5", "name": "Business Insider Taiwan"}]}, {"title": "科學人／機器人的手感 AI 能拿捏嗎？", "teaser": "具身智慧精細觸覺挑戰大", "full": "最新科學研究探討AI能否精準掌握機器人的觸覺與手感，這需要強大的感測器數據與即時演算法搭配。突破精細操作瓶頸將是機器人進入醫療手術與精密製造的關鍵。", "think": "機器人不只要有大腦，更需要極其敏銳的神經系統與感測器。這意謂著未來感測元件與精密零組件廠商，將在機器人產業鏈中扮演關鍵角色。", "question": "當機器人擁有了超越人類的精細觸覺，哪些傳統依靠手工技術的行業最容易被替代？", "sources": [{"url": "https://news.google.com/rss/articles/CBMickFVX3lxTFBNZk8zdktLNjc1RTlDbFNNVDVSVXVsX0ctSzZEWnJmRnhLZzVkZGMxdDFfZ1FDZGlxRUNPV 推升資安股飆漲", "full": "隨著AI技術廣泛應用，企業面對的新型資安威脅與AI風險急劇增加，帶動資訊安全需求大增。美股資安龍頭如CrowdStrike與Palo Alto股價強勢上漲，成為資本市場焦點。", "think": "AI應用爆發的同時，資訊安全轉變為剛性需求，成為企業防護不可或缺的一環。對投資人而言，資安板塊提供了具備防禦性與成長性的雙重配置價值。", "question": "在企業加速導入AI工具的同時，你的公司是否也具備了相應的資安防禦措施？", "sources": [{"url": "https://infosecu.technews.tw/2026/09/15/why-crowdstrike-and-palo-alto-are-leading-the-software-stock-rally/", "name": "科技新報"}]}, {"title": "AI 加持、半導體猛 韓 ICT 出口額飆增 1.6 倍、破紀錄", "teaser": "韓國資通訊出口額創新高", "full": "受惠於全球AI需求強勁及半導體晶片大賣，韓國資通訊出口額實現高達1.6倍的驚人增長，創下歷史新高。這突顯出亞洲半導體供應鏈在AI浪潮中的核心戰略地位。", "think": "韓國出口強勁印證了全球AI硬體拉貨潮依舊熱絡，亞洲半導體聚落持續享有產業紅利。台灣與韓國作為核心供應鏈，中長期出口動能依然深具支撐力。", "question": "亞洲半導體出口數據創新高，是否能抵銷短期美股科技股拉回帶來的市場情緒不安？", "sources": [{"url": "https://finance.technews.tw/2026/09/15/korea-ict-exports-1-6x-record-ai-semiconductor-boom/", "name": "科技新報"}]}, {"title": "AI 寫程式普及率破八成，軟體開發者的核心競爭力正悄悄轉移", "teaser": "八成開發者已使用AI寫程式", "full": "調查顯示AI輔助寫程式的普及率已超過八成，軟體開發工作流程產生根本變革。工程師的核心價值正從純粹寫程式碼，轉化為系統架構設計、需求理解與問題定義能力。", "think": "AI已經不是取代工程師，而是成為標配工具，無法善用AI的開發者恐面臨淘汰風險。不論何種行業的上班族，提升與AI協作的提問與溝通能力都是當務之急。", "question": "當AI能處理基礎編程與重複工作時，你在職場上的獨特不可替代性是什麼？", "sources": [{"url": "https://technews.tw/2026/09/15/mastering-ai-assisted-programming/", "name": "科技新報"}]}, {"title": "新 S11 晶片讓蘋果手錶 AI 效能大躍進，4 核 NPU 與 4GB 記憶體的強力加持", "teaser": "蘋果晶片大幅提升手錶AI", "full": "蘋果最新一代S11晶片配備4核NPU與4GB記憶體，硬體規格大幅升級，讓智慧手錶能順暢執行複雜的邊緣AI運算。這標誌著個人穿戴設備進入更為智慧與即時的個人助理時代。", "think": "邊緣運算落地穿戴裝置，代表個人隱私與即時健康監測將有突破性升級。這將帶動周邊感測器與高階封裝供應鏈的繁榮。", "question": "當穿戴裝置具備強大的邊緣AI能力，你最期待它為生活帶來什麼樣的改變？", "sources": [{"url": "https://technews.tw/2026/09/15/apple-watch-chipsets-faced-years-of-neglect-with-subpar-improvements/", "name": "科技新報"}]}]}}</script>

  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
