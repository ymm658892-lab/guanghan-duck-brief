  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

BmdmNVczdkX3VBcDBPeUQyMlZuSmtJZXFFTmNoUmIzS2Z3?oc=5", "name": "BigGo 財經"}]}, {"title": "從黑手窟到AI機器人！中彰投強強聯手挺江啟臣 盧秀燕重現「小蝦米翻大鯨魚」氣勢", "teaser": "傳統精密機械轉型智慧AI", "full": "中部地區作為台灣傳統精密機械重鎮，正加速結合 AI 與機器人技術進行產業升級。透過跨縣市產學研資源整合，在地供應鏈鏈結智慧製造，期盼將過去的傳統黑手聚落打造為全球具身智慧的供應核心。", "think": "台灣中部的機械產業鏈具備極強的硬體製造實力，轉型結合 AI 機器人將創造極大的附加價值。傳產與高科技的融合，是台灣產業升級的重要看點。", "question": "面對 AI 與機器人浪潮，台灣傳統製造業應如何利用既有優勢轉型？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTE9ZeUhnZTZiOU1rdXo4eDlGVWloaTV0OFg1VkJjV3FzeE5sek1rc1dPdHdkNmJSWUxQc1MwaFk0Qkl5VTNZNzZoRHdEdGVuQQ?oc=5", "name": "台中日報"}]}, {"title": "全球缺工引爆人形機器人商機！產值有望成長數十倍 2台廠搶先卡位", "teaser": "全球缺工掀人形機器人熱潮", "full": "全球人口結構改變與勞動力短缺問題，推升了市場對人形機器人的強勁需求。產業分析指出未來數年人形機器人產值將呈爆發式成長，國內已有關鍵零組件與系統整合台廠搶先布局，搶攻龐大的替換商機。", "think": "缺工是全球長期的結構性問題，人形機器人為自動化帶來最終解方。早期卡位關鍵零組件與製造供應鏈的台廠，有機會獲得長期成長紅利。", "question": "你認為人形機器人最快會在幾年內走入我們的日常工作與生活環境？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTFBRN1pPd3g5OTJ3Q2VETUlMOFNPZFFvQlFjLXdNZGFCMWIxRzdwalZTODdiZW8zcjlLV3lsbnZZVklOVVhnbXNsWEg3ZVpzQQ?oc=5", "name": "Money 錢"}]}, {"title": "OpenAI撤銷獨立機器人團隊，通用大模型「接管」具身智慧路線之爭升溫", "teaser": "OpenAI調整機器人戰略", "full": "OpenAI 宣布撤銷獨立的硬體機器人團隊，將發展重心全面轉向以通用大模型為核心的「具身智慧」模式。這項策略轉變引發業界對於機器人技術路線的熱烈討論，顯示軟體與大模型在硬體控制中的主導地位大增。", "think": "OpenAI 的調整顯示出 AI 大模型才是具身智慧的大腦靈魂。未來機器人競爭的核心可能不再只是硬體製造，而是誰能提供更聰明的通用 AI 模型。", "question": "你認為機器人的核心競爭力在於卓越的硬體工藝，還是聰明的大模型大腦？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiekFVX3lxTE1zUTdmX0dFSEV0dXA1TS1vOFR4THBnNUxOUWNZdGczVnpPZHlHTk1SYy1USk93cnJCT3RTY3JtaEZWQXJlZ01xZjMydFhieXF5YXZzNHJPUS1yc1lmZjZodnQ4WG9ic3dGM010a1M0eEhVWFd2cERaZENB?oc=5", "name": "BigGo 財經"}]}], "tech": [{"title": "AI 加劇記憶體供需失衡！擷發科：短缺是長期結構性問題，AI 只是觸發點", "teaser": "記憶體結構性缺貨持續", "full": "晶片設計公司指出，目前高頻寬與高效能記憶體的供需失衡並非短期現象，而是長期的結構性供給不足。AI 算力大增只是加速了問題爆發，未來幾年記憶體市場將持續面臨產能緊繃與價格支撐。", "think": "算力爆發對記憶體提出了更高的規格要求，供應鏈的產能瓶頸短時間內難以解套。投資人應關注記憶體產業鏈中具備高階產能與定價權的相關廠商。", "question": "面對科技產業的結構性缺貨，你在評估相關概念股時會重點看哪些指標？", "sources": [{"url": "https://technews.tw/2026/11/15/microip-talk-about-memory/", "name": "科技新報"}]}, {"title": "那斯達克改了，白天也能買美股！全球股市為何搶拚 24 小時不打烊？", "teaser": "美股交易迎向全天候時代", "full": "那斯達克正規劃推進全天候交易機制，未來亞洲投資人也能在白天的正常作息時間內直接進行美股買賣。全球交易所競相延長交易時間，旨在吸引跨國資金並提升資產的全球流動性。", "think": "24 小時交易讓跨國投資更加便利，但也意味著市場對突發消息的反應會更加迅速。投資人需要建立更完善的風險控管策略，避免過度頻繁交易。", "question": "美股若實現全天候交易，是否會改變你目前的投資習慣與資產配置方式？", "sources": [{"url": "https://finance.technews.tw/2026/11/15/why-global-markets-are-racing-toward-24-hour-trading/", "name": "科技新報"}]}, {"title": "光電整合進入「打群架」時代，聯發科侯上勇：CPO路線未定，良率才是關鍵", "teaser": "CPO技術良率成量產關鍵", "full": "聯發科高層在論壇中指出，共同封裝光學（CPO）技術正成為下一代高頻寬傳輸的核心，但目前產業技術路線尚未統一。產業必須跨界合作打群架，而決定 CPO 能否大規模商用化普及的真正關鍵在於製造良率。", "think": "高頻寬與高速傳輸是 AI 伺服器的核心需求，CPO 技術具備極大潛力。但在良率尚待提升的階段，投資人需密切關注先進封裝產業鏈的技術驗證進度。", "question": "在面對尚未完備的新技術時，你會選擇早期布局還是等待技術成熟？", "sources": [{"url": "https://technews.tw/2026/11/15/cpo-mediatek-hou-shang-yong-optoelectronic-integration-battleground-tech-choices-not-just-cost/", "name": "科技新報"}]}, {"title": "「雨露均霑」時代終結！AI 狂潮首現明確減速訊號，專家示警：未來投資心臟要夠大", "teaser": "AI投資浪潮轉向精準篩選", "full": "市場分析指出，過去只要沾邊 AI 就能上漲的普漲行情正在告一段落，部分領域出現支出放緩與獲利檢視的減速訊號。專家提醒，未來 AI 投資將回歸基本面與實質變現能力，個股分化與波動度將明顯加大。", "think": "AI 產業從盲目本夢比轉向實質獲利檢視是市場健全發展的必然過程。投資人應檢視手中持股是否具備實質獲利能力，而非單純仰賴題材炒作。", "question": "當 AI 股票出現顯著分化時，你該如何重新檢視並篩選手中的投資組合？", "sources": [{"url": "https://finance.technews.tw/2026/11/15/ai-sector-shows-first-signs-of-slowdown-in-three-years/", "name": "科技新報"}]}, {"title": "為向妻子證明自己沒打呼，英國創業家自學寫程式打造熱門睡眠 App", "teaser": "素人寫程式打造熱門App", "full": "一位英國創業家為了釐清自己是否有打呼問題，毅然自學程式設計並開發出一款睡眠監測軟體。沒想到這款最初源於生活小紛爭的工具，憑藉優異的實用性意外爆紅，成為下載量極高的熱門 App。", "think": "最成功的產品往往源自解決真實生活中的痛點。在 AI 寫程式工具日益普及的今天，個人憑藉創意與執行力創造市場價值變得比以往更加容易。", "question": "在日常工作中，你是否也發現過能透過技術工具或數位產品來解決的痛點？", "sources": [{"url": "https://technews.tw/2026/11/15/the-snoring-problem-that-launched-a-tech-company-how-one-entrepreneur-is-reinventing-sleep/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-1300">{"date": "11月15日．週日", "tldr": "今日重點聚焦輝達執行長更迭對台股供應鏈的影響，以及DRAM記憶體市場明年緊繃情勢，同時關注企業AI轉型與機器人技術的最新發展。", "indicators": {"note": "雖然美股科技股與費半指數同步回檔，台股加權指數盤中仍展現韌性逆勢上揚，顯示本土資金對台股產業鏈信心十足。", "tiles": [{"label": "台股加權指數", "value": "43,675.12", "valueClass": "rise", "delta": "+1.35%", "deltaClass": "rise"}, {"label": "那斯達克", "value": "25,136.27", "valueClass": "fall", "delta": "-0.91%", "deltaClass": "fall"}, {"label": "費半指數", "value": "10,146.32", "valueClass": "fall", "delta": "-3.43%", "deltaClass": "fall"}, {"label": "台積電ADR", "value": "398.73", "valueClass": "fall", "delta": "-1.67%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "DRAM明年上半年更缺 模組廠惜售因應", "teaser": "DRAM明年上半年供需持續緊繃", "full": "受到上游原廠產能調配與高頻寬記憶體需求持續擴增影響，DRAM市場預計明年上半年缺貨狀況將更為明顯。記憶體模組大廠因應供需吃緊，正採取惜售策略以維持高毛利率與庫存價值。這顯示記憶體產業復甦態勢確立，價格漲勢可望延續。", "think": "記憶體產業回溫意味著相關族群的獲利能見度提高。投資人可留意模組廠與封測廠的庫存回升狀況，作為佈局傳產與科技交集板塊的參考指標。", "question": "在產業面臨缺貨與價格上漲時，你會如何評估庫存水位高的台股供應鏈標的？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611150073.aspx", "name": "中央社"}]}, {"title": "黃仁勳辭輝達執行長 專家：AI發展趨健康、台灣產業鏈不受影響", "teaser": "黃仁勳卸任震驚市場但影響有限", "full": "輝達創辦人黃仁勳傳出辭去執行長職務，引發全球科技業震撼。不過產業專家分析，輝達高層交接代表AI產業邁入常態化與成熟階段，結構發展更加健康。由於台灣供應鏈在硬體製造具不可替代性，整體合作關係不受影響。", "think": "關鍵領袖變動短期難免造成心理波動，但產業基本面與供應鏈合作關係比單一人物更加堅固。上班族投資時應關注企業的長期技術競爭力，而非單一新聞情緒。", "question": "當指標企業發生高層人事異動時，你會先觀望還是把握波動調整部位？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611150052.aspx", "name": "中央社"}]}, {"title": "黃仁勳去職後首場輝達財報說明會 法人看AI展望牽動台股", "teaser": "輝達財報說明會成市場關鍵焦點", "full": "在黃仁勳卸任後，輝達即將召開最新一季財報說明會，成為全球金融市場關注的絕對焦點。法人指出，市場將嚴格檢視新經營團隊對AI算力需求與資本支出的展望。這場說明會的指引將直接牽動台股AI伺服器供應鏈的股價走勢。", "think": "法說會不僅是檢驗過去績效，更是觀察法向與景氣循環的重要窗口。了解美股大廠的展望，能幫助我們更精準地抓出台股相關題材的受惠順序。", "question": "你平時會參考美股權值股的法說會展望，來調整台股個股的持股策略嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611150033.aspx", "name": "中央社"}]}, {"title": "台灣首顆GPGPU獲飛行履歷 捷揚太空代工轉攻研發拓商機", "teaser": "首顆國產晶片搶攻航太高階商機", "full": "台灣自主研發的首顆通用圖形處理器（GPGPU）成功獲得飛行履歷認證，驗證其在極端太空環境下的穩定性。負責代工與研發的捷揚太空正積極轉型，藉由這項技術突破擴大商業航太與邊緣運算的市場版圖，展現國產晶片硬實力。", "think": "台灣半導體實力從消費性電子延伸至航太極限領域，大幅拓展產業天花板。這代表台灣科技業具備高附加價值的多元成長動能，值得中長期關心。", "question": "太空科技與高階晶片結合帶來的長期商機，是否會進入你的投資觀察清單？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611150026.aspx", "name": "中央社"}]}, {"title": "黃仁勳辭執行長 馬斯克：輝達將失去部分關鍵交易", "teaser": "馬斯克看黃仁勳卸任的潛在衝擊", "full": "針對黃仁勳辭去輝達執行長一事，特斯拉執行長馬斯克發表看法，認為輝達可能因此失去部分高度依賴個人信任的關鍵商業交易。馬斯克直言，黃仁勳個人魅力與談判風格是輝達過去快速擴張的重要推手，交接期恐面臨商業考驗。", "think": "科技巨頭之間的商業合作常建立在頂層信任上，領袖交棒期往往帶來市場對未來訂單的猜測。我們在評估供應鏈時，也要關注客戶關係轉移的流暢度。", "question": "你認為個人魅力對一家巨型科技企業的商業談判有多大的影響力？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202611140227.aspx", "name": "中央社"}]}], "robotics": [{"title": "智能傳動營收年增逾4成！精密齒輪大廠Q3創高 人形機器人齒輪明年拚量產", "teaser": "齒輪大廠業績創高拚機器人量產", "full": "精密齒輪大廠公布第三季營收與獲利雙雙創下歷史新高，智能傳動業務年增率突破四成。公司表示，針對人形機器人所開發的高精度齒輪已完成客戶認證，預計於明年正式進入量產階段，為公司注入強勁的新成長引擎。", "think": "機器人概念逐漸從題材演變為實際營收貢獻。製造業轉型與自動化升級趨勢下，關鍵零組件廠商將是首波受益的隱形冠軍。", "question": "當科技概念轉化為實際量產出貨時，你會如何調整該族群的投資評價？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiS0FVX3lxTE05OXZtZExmcVRqX1BXNURnQ2xUUVhfNlBoZU5CRmktckdiQTlsUWZWNmMxcU5Jb2MzaVVLdnNjRkZSQ2FzNnZwQUJEOA?oc=5", "name": "FTNN"}]}, {"title": "「創新科技科普講堂」城大首場開講 以AI機器人推動創科普及教育", "teaser": "香港城大以AI機器人推普及教育", "full": "香港城市大學舉辦創新科技科普講堂，首場特別以AI機器人為主題，邀請專家探討機器人技術如何融入教育與日常應用。活動旨在激發青年對創科的興趣，透過實作展示與理論講解，培育未來人工智慧與機器人領域的人才。", "think": "科普教育的普及是科技產業長期發展的基石。隨著機器人教育向下扎根，未來技術人才的供給與創新應用落地速度將大幅加快。", "question": "你認為將AI與機器人課程納入基礎教育，對下一代競爭力有何幫助？", "sources": [{"url": "https://news.google.com/rss/articles/CBMid0FVX3lxTE10NnJHMDFheE91alNHZDk2c25xNjNXUkFEQ25iM0ZUSE91eUlYVGgzTWRlM1hrczNYeklTV213eXB0SzNZMWExRUU1NW54eFBTTWJDNzZmYnVQYzMzamxrdlpIM2w4cjc1dUN6Q2ttOV81Y29xU2JN?oc=5", "name": "香港文匯報"}]}, {"title": "烏克蘭的戰鬥機器人開始擊落俄羅斯的無人機 這最終可能改變殺戮區的戰鬥方式", "teaser": "戰鬥機器人實戰擊落無人機", "full": "烏克蘭戰場上出現最新技術應用，地面戰鬥機器人成功擊落空中無人機，展現高度自動化的防禦能力。軍事專家分析，無人機與機器人的對抗標誌著新型態戰爭的來臨，自動化與AI系統將逐步改變高風險戰區的作戰模式。", "think": "國防科技往往是最新機器人與AI技術的試煉場。這些在極端環境驗證的抗干擾與自動控制技術，未來極可能回流至民用自動化領域。", "question": "面對國防與工業自動化需求暴增，你如何看待軍民通用科技的發展潛力？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFB4ajBBeVVwS2RIVFJ6RXJzOGFBNlVWNDFEUHI4TnVJZWp0RWM1TVdJVF9UeUNWa1JqXy03ZmRSNFFjZjJNd0p3TXhUMkUxV092MTJKMjVR?oc=5", "name": "Business Insider Taiwan"}]}, {"title": "美台高科技論壇矽谷登場 輝達副總裁強調台灣為關鍵供應鏈", "teaser": "輝達力挺台灣為機器人關鍵鏈", "full": "美台高科技論壇於矽谷盛大舉行，輝達副總裁在演講中重申，台灣在AI與先進機器人供應鏈中扮演不可或缺的角色。從晶片製造到精密機械組裝，台灣企業具備完整的生態系，是全球推動次世代機器人發展的最強後盾。", "think": "美台高科技合作日益緊密，台灣在硬體製造與系統整合的優勢再度獲得國際科技巨頭認證。這為台灣相關供應鏈帶來長期利多與全球排他性。", "question": "在國際科技巨頭持續加碼台灣的情況下，你最看好台灣機器人供應鏈的哪個環節？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiS0FVX3lxTFA1VXppcE03VTJtMGlCTWdzUHhNMnpORzdmWXl5Q1pFYlhxZmJ4cjltcDJsNnVlUDl6TkVkZFpwTV96ZklqR2JvTk1pcw?oc=5", "name": "三立新聞網SETN.com"}]}, {"title": "訓練資料爭奪戰升溫，Memories.ai 推打工平台付錢請大家拍影片給機器人看", "teaser": "付費徵求日常影片訓練機器人", "full": "為了讓機器人更好地理解人類真實世界的物理互動，新創公司Memories.ai推出全新打工平台。該平台付費邀請一般大眾上傳日常生活影片，作為訓練人形機器人視覺與動作模型的素材，顯示AI模型對高質量真實數據的需求極其迫切。", "think": "AI大模型競爭已延伸至視覺與物理互動數據。一般人的日常生活影像變成了有價資產，展現了AI經濟下全新的商業模式與兼職機會。", "question": "如果拍下日常家務動作能獲得報酬，你會願意提供影片幫忙訓練機器人嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMisgFBVV95cUxPLUNNcTREcG5Edm9DR2t5c2lldDZ1N3FPSTFIRFlVWlNnOTVGclE5R2JlWHFGZTRxakRBR3FBNkpEMTN4aWQ4dTZUdEJQZ0tGamtGYnF3aGJHdElOMzE4ZW52Smt5R1BvWXZ3Y0k2TUhyNnBPSmxXakxtS3VveFlOOVJVQnJOdm5CT1B2MGdMT2E5V2VwczBTRURFRzNnZWdRZmxEN1psSmxodWF6WnlFUHln?oc=5", "name": "TechNews 科技新報"}]}], "tech": [{"title": "訓練資料爭奪戰升溫 Memories.ai推打工平台付錢請大眾拍影片", "teaser": "資料戰升溫拍日常影片賺零用錢", "full": "隨著AI模型對真實世界數據需求擴增，Memories.ai推出打工平台，付費請用戶拍攝並提供日常行為影片。這些影片將用於訓練機器人與AI系統的空間感知與動作回應，標誌著數據採集進入全民參與的新階段。", "think": "數據成為AI時代的新石油。未來除了程式開發與硬體製造，內容與行為數據的供給者也將在數位經濟中獲得一席之地。", "question": "隨著個人數據價值提升，你認為大眾應如何平衡隱私保護與數據變現？", "sources": [{"url": "https://technews.tw/2026/11/15/memories-ai-launches-memories-upload-a-gig-work-platform-for-robot-training-data/", "name": "科技新報"}]}, {"title": "阿茲海默症治療新突破 義大利研發「羊膜細胞鼻噴劑」有望逆轉記憶退化", "teaser": "羊膜細胞鼻噴劑逆轉記憶退化", "full": "義大利研究團隊在阿茲海默症治療領域取得重大突破，成功開發出一款「羊膜細胞鼻噴劑」。實驗顯示，該療法能有效傳遞修復因子至大腦，減緩甚至逆轉神經退化導致的記憶喪失，為全球廣大的高齡失智患者帶來全新曙光。", "think": "高齡化社會對神經退化性疾病療法的需求極為殷切。生技醫療技術的創新不僅提升生活品質，也預示著高齡健康產業的龐大市場潛力。", "question": "面對生醫技術頻傳突破，你會如何評估生技醫療族群在長期投資中的定位？", "sources": [{"url": "https://technews.tw/2026/11/15/nasal-spray-alzheimers-treatment-promise/", "name": "科技新報"}]}, {"title": "四成主管認 AI 無法取代專業、「AI 回歸」比例達 19%，逾五成勞工喊漲薪資", "teaser": "主管認AI無法完全取代專業", "full": "最新職場調查顯示，高達四成主管認為AI工具無法取代員工的專業判斷與核心技能；同時更有近兩成企業出現「AI回歸」現象，即重新調回人工處理複雜業務。此外，隨著技能門檻提升，超過五成勞工要求提高薪資待遇。", "think": "AI並非萬能，人類的批判性思考與專業經驗仍具不可替代性。上班族應著重提升軟實力與跨領域整合能力，而非盲目焦慮被AI取代。", "question": "在工作中，你如何發揮AI無法取代的個人獨特價值與專業判斷？", "sources": [{"url": "https://technews.tw/2026/11/15/ai-re-hiring-trend-companies-acknowledge-ai-limits/", "name": "科技新報"}]}, {"title": "遠古病毒「關閉」黑猩猩關鍵基因 意外成就人類複雜大腦", "teaser": "遠古病毒基因變異成就人類大腦", "full": "科學家最新研究發現，數百萬年前入侵祖先基因組的遠古病毒，意外「關閉」了黑猩猩身上的某些關鍵基因，進而促進了人類大腦皮質的快速演化與複雜化。這項研究揭示了病毒在人類大腦演化史中扮演的重要推手角色。", "think": "生命的演化充滿了隨機性與轉機。了解演化史能給我們靈感：有時看似負面的干擾或危機，長期來看反而可能是推動突破的催化劑。", "question": "這項科學發現是否改變了你對歷史隨機事件與創新突破之間關係的看法？", "sources": [{"url": "https://technews.tw/2026/11/15/ancient-viruses-evolution-human-brain/", "name": "科技新報"}]}, {"title": "AI 重整組織打擊員工士氣 科技主管點出導致轉型失敗最常見錯誤", "teaser": "企業AI轉型盲點恐打擊士氣", "full": "多位科技資深主管警告，許多企業在導入AI重整組織時過於急躁，忽視了與員工的溝通，導致內部士氣大受打擊甚至引發離職潮。主管點出，缺乏明確轉型目標與忽視人本管理，是導致企業AI數位轉型失敗的最常見錯誤。", "think": "技術只是工具，組織轉型的關鍵永遠在於「人」。成功導入科技需要透明的溝通與配套培訓，否則強行導入反而會損害企業核心競爭力。", "question": "你的公司在導入新科技工具時，是否有提供足夠的溝通與培訓配套？", "sources": [{"url": "https://finance.technews.tw/2026/11/15/what-tech-leaders-get-wrong-about-ai-restructuring-and-morale/", "name": "科技新報"}]}]}}</script>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
