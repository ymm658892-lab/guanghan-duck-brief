  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

<script type="application/json" id="slot-1300">{"date": "9月18日．週五", "tldr": "週五午盤台股與美股科技強勢聯動，費半大漲帶動半導體信心，AI供應鏈與先進封裝持續受到市場高度關注。", "indicators": {"note": "四大指標全面大漲逾1%，顯示國際資金持續簇擁科技股，台積電ADR與費半強勢表態，為台股午後盤中注入強心針。", "tiles": [{"label": "台股加權指數", "value": "47,180.75", "valueClass": "rise", "delta": "+2.90%", "deltaClass": "rise"}, {"label": "那斯達克", "value": "26,418.30", "valueClass": "rise", "delta": "+1.69%", "deltaClass": "rise"}, {"label": "費半指數", "value": "11,599.49", "valueClass": "rise", "delta": "+3.14%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "430.26", "valueClass": "rise", "delta": "+3.00%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "市調：台積電CoWoS-L具良率優勢　居主流至2028年", "teaser": "先進封裝良率優勢穩固", "full": "最新市場調查指出，台積電的CoWoS-L先進封裝技術展現出強大的良率優勢，預期將在未來數年內持續穩居市場主流地位。這項優勢不僅鞏固了其在AI晶片代工的領導地位，也確保了相關供應鏈在未來幾年的訂單能見度與成長動能。", "think": "對投資人而言，半導體龍頭的技術護城河越深，台灣整體科技類股的底氣就越足。這類核心供應鏈往往是資金在盤勢震盪時的避風港與獲利核心。", "question": "當市場主流技術底定後，供應鏈中哪些二線廠能跟著喝湯？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609180182.aspx", "name": "中央社"}]}, {"title": "新台幣升7.3分　收31.808元", "teaser": "匯市震盪走升引關注", "full": "台北外匯市場今日表現偏升，新台幣兌美元匯率終場收在31.808元，升值7.3分。匯價的變動反映了國際美元的走勢以及外資在台股的資金動向，午盤前後的匯市波動也牽動著外資進出台股的實質意願。", "think": "匯率是外資熱錢的風向球，台幣走升通常意味著資金匯入意願仍在。上班族在關注股市之餘，也可以留意匯市對特定進出口產業帶來的潛在影響。", "question": "你手中的資產配置，是否有將匯率波動的風險考慮進去？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609180177.aspx", "name": "中央社"}]}, {"title": "AI通膨來襲？央行：短期可控、長期生產力提升將降壓", "teaser": "AI通膨短期可控", "full": "針對市場關注的AI浪潮是否會引發結構性通膨，中央銀行在最新報告中指出，短期之內的影響仍在可控範圍之內。從長期來看，隨著AI技術應用普及、帶動整體生產力提升，反而有助於減輕未來的通膨壓力。", "think": "總體經濟的穩定是股市多頭的根本，央行的正面表態給了市場一顆定心丸。對於一般民眾來說，理解科技如何改變生產力，有助於看清未來幾年的通膨與薪資趨勢。", "question": "你覺得自己的工作效率，是否已經開始感受到AI帶來的生產力革命？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609180167.aspx", "name": "中央社"}]}, {"title": "Forge Nano押注台灣　打造先進ALD設備生產基地", "teaser": "外商來台設立基地", "full": "外商Forge Nano正式宣布加碼投資台灣，計畫在當地打造先進原子層沉積（ALD）設備的生產基地。這項舉動不僅突顯出台灣在全球半導體先進製程供應鏈中的不可替代性，也進一步吸引了國際關鍵設備商的在地化布局。", "think": "國際設備大廠願意在地深耕，證明台灣半導體生態系的聚落效應極強。這類產業動態暗示著台灣供應鏈在設備與材料自主化上，正迎來更多合作與投資契機。", "question": "外商頻頻加碼台灣，對本土相關設備廠會是威脅還是合作機會？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609180165.aspx", "name": "中央社"}]}, {"title": "科技股激勵　日經收漲", "teaser": "亞洲科技股同步走揚", "full": "受到美股科技類股強勢表現的激勵，亞洲主要鄰近市場如日經指數今日也跟進收漲。整體區域市場在半導體與AI題材的帶動下，展現出不錯的跟漲力道，投資人對週末前的盤勢保持相對樂觀的態度。", "think": "亞股通常具有高度的連動性，當美股科技股大漲、日韓股市同步表態時，台股往往也能沾光。這種跨國市場的共振，是檢視全球風險胃納的重要指標。", "question": "你在配置資產時，會不會把亞鄰市場的科技股表現一起納入觀察？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609180156.aspx", "name": "中央社"}]}], "robotics": [{"title": "OpenAI進軍機器人領域 工程師年薪最高50萬美元", "teaser": "天價搶挖頂尖AI人才", "full": "人工智慧巨頭OpenAI正式跨足機器人領域，並開出高達年薪50萬美元的條件招募頂尖工程師。此舉象徵AI大腦與實體機器人的結合已進入加速期，科技巨頭們正全力搶佔人形機器人與自動化背後的技術制高點。", "think": "人才在哪裡，錢就在哪裡。當頂尖軟體大廠開始砸重金進軍硬體機器人，意味著AI的下一個爆發點很可能就是「軟硬整合」的實體應用。", "question": "如果AI工程師的身價水漲船高，傳統製造業該如何留住自動化人才？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1Hd0lTRWRwcEZ1UFRqYVowcnFNZTdhU1c2dnFfa1RxU05xQmJubTl3d0xxZ0ZCRHNDUTJxUFI4eFlCQ2ZWT3NOYTZJb05xSkJIanRZTGxB?oc=5", "name": "Business Insider Taiwan"}]}, {"title": "MISUMI Americas 成立 5,000 萬美元創投基金 搶攻機器人工業 AI 市場", "teaser": "大廠砸巨資搶攻AI", "full": "零組件大廠MISUMI Americas宣佈成立高達5,000萬美元的創投基金，專門用於搶攻機器人與工業AI市場。這顯示出產業鏈上下游正積極透過資本投入，加速推動傳統製造設備的智慧化轉型。", "think": "傳統工業零件商轉向擁抱創投與AI，說明自動化已經不再只是「機械手臂」，而是全面的智慧升級。這類資金動向是尋找潛力供應鏈的重要線索。", "question": "當傳統工業巨頭紛紛轉型成創投推手，對新創團隊來說意味著什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMikAFBVV95cUxNUmk3NEFxa1d0UXUtcXpTYWRKUkxGblluSFhTc2tzZHJjTnZHY0hpazg4STQySlJBZ2MzUnRNdW1ZOTJzeHJrdmhScVlzNy1nWExMdGVrQnhYS0tNa1V3WGdBM1lyeEtKUnN3RGNqaV82dEh1VkwtOTZESzlDRG9UQ3FENndyUFppWjhMLVhoekc?oc=5", "name": "Yahoo股市"}]}, {"title": "傳特斯拉團隊赴浙審廠，推進機器人Optimus量產", "teaser": "特斯拉推進量產腳步", "full": "市場傳出特斯拉的機器人開發團隊已前往浙江實地審廠，積極為旗下人形機器人Optimus的量產做準備。這項供應鏈訪視動作被外界解讀為量產時程正逐步逼近，相關供應鏈廠商有望迎來實質訂單。", "think": "特斯拉在電動車領域的成功模式，正複製貼上到人形機器人上。對投資人而言，跟緊龍頭廠的供應鏈足跡，往往能掌握最真實的產業成長脈動。", "question": "你認為人形機器人真正大量走入工廠的那一天，會比想像中來得快嗎？", "sources":   }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
