  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

大廠的必爭之地。", "question": "面對先進封裝與ASIC潮，台廠供應鏈能否在新一波轉型中繼續保持領先？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202610250133.aspx", "name": "中央社"}]}, {"title": "長榮航：客運旺、AI貨運無淡季　油價成最大變數", "teaser": "客貨雙利多迎營運高峰", "full": "長榮航表示受惠於旅遊復甦與AI伺服器空運需求帶動，貨運呈現「無淡季」強勁態勢。然而國際油價波動作為主要成本變數，將持續考驗航空業者的獲利表現與營運彈性。", "think": "AI不只帶來軟硬體革命，連實體物流供應鏈也大受裨益。急單與高單價晶片的需求讓航空貨運淡季不淡，反映科技供應鏈的急迫性。", "question": "國際油價對運輸業營運影響深遠，投資航運股時你是否會同步監控能源指標？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610250131.aspx", "name": "中央社"}]}], "robotics": [{"title": "特斯拉 Optimus 機器人啟動量產 供應鏈多元與產能挑戰並存", "teaser": "特斯拉人形機器人步入量產", "full": "特斯拉將人形機器人Optimus推進量產階段，並積極尋求多元供應鏈支援。儘管市場高度期待，但關鍵零組件的穩定度與產能瓶頸，仍是實現大規模商業化必須突破的關卡。", "think": "人形機器人正從科幻演化為真實的工業產品，零組件供應鏈將成為下一個受惠領域。從馬達、減速器到感測器，產業鏈商機正在發酵。", "question": "未來幾年若機器人走入工廠與家庭，你最期待它幫你處理什麼工作？", "sources": [{"url": "https://news.google.com/rss/articles/CBMigANBVV95cUxQZDV3Wk04M1c5QktieHppdFBaaHhYeGV0WlhvN0h0Q2FYZHFlYXBLTzRDbDMyZzA5bTZSZFluUEJkOWEyZFBxOEVheDN1SHV1Y19nVUpBTkFxaS1hMmxaTXFzLUpiTGxHLUFBV2JMTXRqYXpBWTVIVWg2aEV1MUxWbGZGWXZ6d2c3NEtRZ09FRGM0ZHhYdkNzc3NvQWE0R0toSVZmYTJjckJvcmpadndIZU5temM2NjgtZkRlSTI1bzZRWnQzUzY0Y2ZBdVdmNEttRUlqdVJRclhCSVI2MXlXQzI3WGx5Q0JzRjczZ0lpSmhCNlZjTDJXNjV5cHhiTllUdklRSUxTLTdXaTRveWN3OFNKQTNNRHZxNC1SYUFzQlgyZkp0emFRRWVhSGlNbHRpcFgzTThUMjRPMVZZd1ZSYlQ1cmJWNzB3RS1MVWRSa0V3dEx3d2lqY1FncG1zcGdSWHNmOHM2WXVQUDFKNGN6aEFnYmNjeWoyUjRtdDNySzY?oc=5", "name": "商傳媒 - SUN MEDIA"}]}, {"title": "減輕勞力與工安風險，JR 西日本引進科幻感人型機器人", "teaser": "鐵道維修導入人型機器人", "full": "JR西日本正式在鐵道維護作業中引進大型人形機器人，由人工遠端操作進行高空高壓電線等危險工序。此舉能有效降低工安意外風險，並補足高齡化社會下的勞動力缺口。", "think": "機器人結合人眼操作是解決重工業高風險與缺工的最佳過渡方案。未來危險與高體力負擔的工作，將逐步由遠端自動化設備接管。", "question": "你的行業中，是否有高風險或重複性高的工作適合改由機器人代勞？", "sources": [{"url": "https://news.google.com/rss/articles/CBMingFBVV95cUxNcEdIcllvSlZyNFdJLUJxRHZBaF9aaFhVM0JsQlJZYWFJQjAzRThZVGtCWVJjcDdPQ0ZXWDJmeENQLUcyVTB6WXF1aWNCc2E0STRXQnhiWTBJWkRPeXp5MW55aFJBM0FrTnVtWXhGLXJTQjV2QzFudVNHZjJXYjFSZTRVdzFSeDItQjh0aXFwOUZIU0pHaUY2QjgzY0l2Zw?oc=5", "name": "TechNews 科技新報 "AI提前預報六週天氣", "full": "人工智慧技術在氣象預測領域取得重大突破，未來有望提前六週精準掌握天氣趨勢。這項技術不僅能幫助農業與物流業提前應對，也展示了AI在非傳統領域的強大預測能力。", "think": "AI的價值在於處理海量複雜數據並找出隱含規律。當氣象預報從幾天拉長到數週，許多依賴氣候的產業將能大幅降低突發災害帶來的損失。", "question": "如果能提前六週準確知道天氣狀況，你會想改變哪些既有的生活或投資計畫？", "sources": [{"url": "https://technews.tw/2026/10/26/researchers-improve-weather-forecasts-looking-two-to-six-weeks-out/", "name": "科技新報"}]}, {"title": "搶食大馬百萬廢車商機！銘福攜手 Naza 合攻城市採礦商機", "teaser": "銘福進軍大馬廢車商機", "full": "台灣環保大廠銘福集團攜手馬來西亞 Naza 集團，共同搶攻當地每年百萬輛的廢車回收市場。雙方合作聚焦於「城市採礦」，從廢棄車輛中提煉出高價值的再生資源。", "think": "循環經濟不再只是環保口號，而已成為真金白銀的龐大商機。當全球原物料開採成本越來越高，廢棄物再利用的「城市採礦」將是下一個兵家必爭之地。", "question": "你身邊有哪些物品，是你覺得最應該被納入循環回收經濟體系的？", "sources": [{"url": "https://finance.technews.tw/2026/10/26/naza-enviro/", "name": "科技新報"}]}, {"title": "輝達預訂產能至 2028 滿載，欣興簡山傑揭密：AI 高階載板不能再單打獨鬥", "teaser": "輝達產能滿載至2028", "full": "隨著輝達高階晶片需求強勁，相關產能預訂已一路滿載到2028年。欣興董事長簡山傑指出，面對龐大的AI商機，高階載板供應鏈必須深化合作，不能再維持過去單打獨鬥的模式。", "think": "這證明AI基礎建設的需求具備高度的可見性與長線延續性。供應鏈走向大聯盟式的合作，也意味著門檻拉高，小廠的生存空間將受到壓縮。", "question": "當產業鏈走向大者恆大與深度合作，中小企業該如何找到自己的獨特定位？", "sources": [{"url": "https://finance.technews.tw/2026/10/26/unimicron-jensen-huang-capacity-rush-jan-shan-jie-new-pcb-game/", "name": "科技新報"}]}, {"title": "雅特力 AT32 AI Studio 強化邊緣智慧，加速 AI 應用落地", "teaser": "雅特力強化邊緣智慧", "full": "雅特力推出 AT32 AI Studio，旨在強化微控制器領域的邊緣智慧運算能力。這項工具能協助開發者更快速地將 AI 應用部署到各種終端裝置上，加速智慧化產品落地。", "think": "AI正從雲端資料中心快速下放至日常的邊緣裝置。不需要連網也能運算的邊緣AI，將使各種智慧家電與工業設備變得更加普及且實用。", "question": "你手邊哪一項日常用品，最需要具備本地AI運算能力來提升便利性？", "sources": [{"url": "https://finance.technews.tw/2026/10/26/artery-at32-ai-studio-enhances-edge-intelligence-accelerating-ai-application-deployment/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-2000">{"date": "10月26日．週一", "tldr": "美股與科技股表現強勁帶動夜盤氣氛，雖然台股今日震盪拉回，但Anthropic申請上市與Meta加碼AI支出，顯見全球AI產業熱潮依然十分強勁。", "indicators": {"note": "台股盤後拉回整理，但美股與費半表現強勁，台積電ADR上揚預示夜盤與明日台股開高氣氛。", "tiles": [{"label": "台股加權指數", "value": "46,041.43", "valueClass": "fall", "delta": "-1.81%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "26,224.97", "valueClass": "rise", "delta": "+1.04%", "deltaClass": "rise"}, {"label": "費半指數", "value": "11,166.38", "valueClass": "rise", "delta": "+3.59%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "428.38", "valueClass": "rise", "delta": "+2.36%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "國際油價小幅回落 歐洲股市收盤揚升", "teaser": "通膨壓力趨緩帶動歐股升檔", "full": "隨著國際原油價格小幅拉回，市場對通膨居高不下的擔憂有所減緩。歐洲主要股市在買盤湧入下收盤紛紛上揚，顯示出市場對於整體宏觀經濟韌性與企業獲利前景仍抱持樂觀態度。", "think": "原油價格下滑能有效減輕企業營運成本與通膨壓力。對投資人而言，能源市場趨穩往往是全球股市短期止跌回升的正面訊號。", "question": "當國際油價波動影響整體通膨時，你的投資組合是否具備抗通膨的資產配置？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610270003.aspx", "name": "中央社"}]}, {"title": "AI熱潮助攻 ASML今年對荷蘭經濟貢獻估達1.6%", "teaser": "半導體巨頭成國家經濟柱石", "full": "受惠於全球生成式AI爆發帶動的高端晶片需求，半導體設備龍頭ASML接單暢旺。最新評估指出，ASML今年對荷蘭國內生產毛額的貢獻率預估將達到1.6%，充分凸顯關鍵科技產業對單一國家經濟的巨大影響力。", "think": "科技巨頭已超越單一公司範疇，躍升為國家經濟的核心命脈。這提醒我們在進行全球資產配置時，應高度關注科技供應鏈關鍵節點的領頭羊。", "question": "你是否觀察過半導體與高端設備供應鏈在各國經濟中所扮演的關鍵角色？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202610260257.aspx", "name": "中央社"}]}, {"title": "蘋果新iPad mini首換OLED螢幕 售價2.29萬元起", "teaser": "小尺寸平板迎面板重大升級", "full": "蘋果公司正式推出了新款iPad mini，最大亮點在於首次採用了OLED面板，能提供更出色的對比度與色彩表現。產品定價自新台幣2.29萬元起，預期將帶動一波中小尺寸高端平板的換機潮與相關供應鏈拉貨。", "think": "蘋果逐步將產品線轉向OLED面板，將推動顯示器供應鏈的規格升級與產能消納。對於關心消費電子供應鏈的投資人來說，可密切觀察面板與組裝廠的後續動能。", "question": "面對消費電子產品規格提升與售價調整，你會因為螢幕升級而產生換機意願嗎？", "sources": [{"url": "https://www.cna.com.tw/news/ait/202610260248.aspx", "name": "中央社"}]}, {"title": "Anthropic公開IPO遞件 那斯達克上市股票代碼ANT", "teaser": "生成式AI巨頭邁向資本市場", "full": "知名AI獨角獸Anthropic已正式向美國證券交易委員會提交IPO申請，預計將於那斯達克交易所掛牌上市，股票代碼定為ANT。此舉標誌著頂級AI模型開發商正式跨入公開資本市場，為A <script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
