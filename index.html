  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

數震盪，通勤族在上班時若一直盯盤容易影響工作心情。大盤高檔震盪是常態，回歸基本面選股才能讓投資生活更安穩。", "question": "台股盤中動不動就震盪數百點，你是會心驚膽顫還是老神在在呢？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611120037.aspx", "name": "中央社"}]}, {"title": "新台幣開盤貶4分 為32.9元", "teaser": "新台幣開盤走貶", "full": "台北外匯市場新台幣兌美元匯率今日開盤走貶4分，以32.9元開出。受到國際美元走勢與外資動向影響，匯市近期持續呈現狹幅盤整偏貶的態勢。", "think": "新台幣貶值有利於以出口為導向的電子與傳產大廠，但對於有海外旅遊或海外代購需求的上班族來說，荷包購買力就會相對縮水。匯率變化牽動著整體進出口成本。", "question": "最近新台幣走貶，你有沒有順便調整你的外幣資產或換匯計畫？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611120032.aspx", "name": "中央社"}]}], "robotics": [{"title": "中國機器人泡沫要破了？謝金河揭發那科、宇樹「這驚人差距」", "teaser": "謝金河揭機器人差距", "full": "財訊傳媒董事長謝金河針對機器人產業發表看法，點出日本工業機器人大廠發那科與中國人形機器人新創宇樹之間的驚人差距。他分析了市場熱度與實際獲利能力的對比，提醒投資人留意產業泡沫化的潛在風險。", "think": "當市場對人形機器人的想像被炒得火熱時，往往容易出現本益比過高的泡沫現象。一般投資人追逐熱門題材之餘，還是要回頭檢視企業有沒有扎實的獲利支撐。", "question": "面對話題不斷的人形機器人熱潮，你認為技術實力與資本炒作哪個比較重要？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiYEFVX3lxTE00NFRIOGxGVFJIZ1hENUVfNXVRbVpjcHU2dGZQczdLNkhIUUNJanBaMS1GcGNkLXZWbWtWbnFCZHo1M0ZuWVZzR0RSS2JvV0tCeUxyU3NLOGtqUktnUGVZSQ?oc=5", "name": "民視新聞網"}]}, {"title": "中國機器人跳春晚、跑馬拉松獲利卻暴跌？謝金河對比2大廠財報：本益比竟飆552倍", "teaser": "本益比飆高引發關注", "full": "中國機器人雖然在春晚表演或馬拉松賽事上話題十足，但財報卻顯示獲利面臨嚴峻挑戰。專家對比兩大廠的財務表現，發現部分熱門標的的本益比竟然飆高到552倍，凸顯市場估值與現實營運的落差。", "think": "行銷話題做得很足不代表公司賺大錢，超高的本益比意味著市場已經預支了未來好幾年的成長。投資人切忌被華麗的科技展演沖昏頭，忽略了高估值帶來的回檔風險。", "question": "你會願意買進一家話題十足但本益比高達數百倍的科技股嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTE9HaGhpb1MxWjExd2hxaDRqbFdnNlVLUGdUVmZjUFhnUzZ5eFRNenJZMVQtdnFVaGdJSk9yZ3dPNmNTLXoxNjJLQktsNGliQQ?oc=5", "name": "風傳媒"}]}, {"title": "機器人的眼睛營收狂飆35.7％！前10月衝破百億、EPS提前超車去年 AI相機新單拚2027再成長", "teaser": "機器人視覺營收狂飆", "full": "被視為機器人靈魂的視覺與AI相機相關供應鏈傳出捷報，前十月營收表現亮眼並順利突破百億大關，每股盈餘更是提前超越去年同期。業者看好後續AI相機新訂單動能，積極布局2027年的成長爆發期。", "think": "與其盲目追逐整機組裝廠的炒作題材，不如尋找具有實質營收貢獻的關鍵零組件供應商。機器人需要「眼睛」才能運作，視覺感測器是相對穩健的切入點。", "question": "在機器人供應鏈中，你覺得賣零組件還是賣整機的商業模式比較穩健？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiS0FVX3lxTFBWZktyUjhPMkpPVmJocmlyV0VBbzZqbF9jUFV0UXRSRXBRem8yeTU4ajczbE9rdVNyQjlEXzE4MzR4REZBaWV2Q21Xcw?oc=5", "name": "FTNN 新聞網"}]}, {"title": "日本堅守機器手、中國押注人形機器人！謝金河：宇樹市值超越發那科，到底誰更有底氣？", "teaser": "日中機器人路線大不同", "full": "日本與中國在機器人發展走出了截然不同的道路，日本老牌大廠堅守工業用的機器手臂，而中國則大舉押注吸睛的人形機器人。雖然新創公司的市值一度超越老牌大廠，但業界與專家紛紛探討究竟誰的商業底氣更足。", "think": "一邊是工業生產線不可或缺的穩健營收，另一邊是充滿未來感的題材想像，兩種路線反映了不同的資本邏輯。對上班族來說，認清產業是「實用」還是「題材」有助於降低投資風險。", "question": "你認為未來走入家庭的人形機器人，會比工廠裡的機械手臂更有市場嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMie0FVX3lxTE1veXF4cmpPTE9HTFg0Wlk2QUwtdzVpaG5WT25BQ2NMbnBaTWRQMXBWaHJldnY2UzlLWXpIaFVnZDJnZTNxdFE4TnVQWmw0UE96bTRDV0wtQ05yS292dmNPVzZnR3FVVUhIUXltM0pDMEtUSkJ1THVaal9jdw?oc=5", "name": "財訊"}]}, {"title": "AI 是美夢還是惡夢？ 陳冲示警：機器人繳稅不是天方夜譚", "teaser": "陳冲示警機器人繳稅", "full": "前行政院長陳冲公開示警，探討人工智慧與自動化發展究竟會帶來美夢還是惡夢，並提到未來讓機器人負擔稅負已不再是天方夜譚。隨著自動化取代人力，社會與稅制結構勢必得面臨全面性的變革。", "think": "當企業大量以機器人取代勞動力時，傳統的薪資所得稅基將受到衝擊，引發社會公平與福利制度的討論。這不僅是科技議題，更是未來每位職場工作者都必須關注的結構性變局。", "question": "如果有一天你工作的職缺被AI機器人取代，你覺得政府該向機器人抽稅來發放基本收入嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTE95c3VZLTdueVpPWVZmdDU0TTJvUDdBUzFQdXdFOGZkQzBTaXFISHE2UVdoSDVjdFRBWUZnU2xsTHU2Vk0ya190ODY4V3FiWmNj0gFWQVVfeXFMTy0xNWxJdDBHdks4eXVwY19ieDJ4dkx6QTAxNkpGVDVVSmZJM21OaGJnTkpNTkZaQ3FfM2dkRk1aRXRaNkFiUzhJdDZQOWdRbmg5bVNQMEE?oc=5", "name": "udn"}]}], "tech": [{"title": "任天堂明年 1 月底終止 Google 與蘋果帳號登入，改推通行密鑰", "teaser": "任天堂將改推通行密鑰", "full": "遊戲大廠任天堂宣布，將於明年1月底正式終止支援Google與蘋果的第三方帳號登入方式，全面改為推行更為安全便利的「通行密鑰」機制。這項調整旨在提升玩家帳戶的資安防護等級，減少遭外部盜用與密鑰外洩的風險。", "think": "各大網路服務近年紛紛推動免密碼或通行密鑰登入，主要是為了防範釣魚網站與帳號密碼外洩。對玩家與網民來說，跟上資安更新不僅能保護個人數位資產，也是數位生活的基本功。", "question": "你習慣使用第三方帳號快速登入遊戲或網站嗎？對於改用通行密鑰有什麼看法？", "sources": [{"url": "https://ccc.technews.tw/2026/11/12/your-google-account-will-lose-its-ability-to-unlock-your-nintendo-account-next-year/", "name": "科技新報"}]}, {"title": "黃仁勳去留添變數 輝達傳尋接班人、白宮不介入", "teaser": "輝達傳出尋找接班人", "full": "市場傳出輝達執行長黃仁勳的去留增添變數，公司內部甚至傳出開始尋找接班人的相關消息，而白宮方面則表示不予介入。這項動態立刻引發科技圈與投資人高度關注，成為半導體業界最受矚目的焦點。", "think": "創辦人兼執行長往往是一家頂尖科技巨頭的靈魂人物，任何高層異動的傳聞都會牽動投資人敏感的神经。不過實務上，成熟的跨國企業通常具備完善的治理與接班計畫來穩定軍心。", "question": "如果靈魂人物黃仁勳卸任，你覺得對輝達的霸主地位會有致命影響嗎？", "sources": [{"url": "https://finance.technews.tw/2026/11/12/nvidia-working-with-outside-firm-to-identify-ceo-candidates/", "name": "科技新報"}]}, {"title": "押寶 Anthropic 有望大賺！亞馬遜與 Google 合計持股逾 25%", "teaser": "科技巨頭押寶AI獲利豐厚", "full": "科技巨頭亞馬遜與Google早期策略性押寶AI新創公司Anthropic，傳出雙方合計持股比例已經超過25%。隨著生成式AI市場蓬勃發展，這筆成功的早期投資有望為兩大巨頭帶來相當可觀的潛在財務回報。", "think": "科技巨頭除了自身研發AI，透過龐大資金直接投資潛力新創，是鞏固生態系與賺取資本利得的高招。這也提醒我們，找對趨勢並提早卡位，往往能創造出驚人的複利效果。", "question": "你在看好某個產業趨勢時，會選擇買進龍頭股還是尋找潛力新創來投資？", "sources": [{"url": "https://finance.technews.tw/2026/11/12/amazon-and-google-stand-to-reap-massive-gains-from-anthropic-s-ipo/", "name": "科技新報"}]}, {"title": "瑪莎拉蒂設計加華為智慧駕駛，傳雙方合作新車 2027 年底量產", "teaser": "瑪莎拉蒂攜手華為造車", "full": "車壇傳出義大利跑車品牌瑪莎拉蒂將與中國科技巨頭華為展開跨界合作，結合義式經典車輛設計與華為先進的智慧駕駛技術，預計打造全新車款並在2027年底正式量產上市。", "think": "傳統豪華車廠在軟體與自駕技術上面臨轉型壓力，選擇與科技大廠強強聯手已成行業趨勢。傳統造車工藝加上頂級AI軟體，正重新定義未來汽車的價值。", "question": "當義大利跑車遇上華為的智慧駕駛系統，你會對這種跨界車款感興趣嗎？", "sources": [{"url": "https://technews.tw/2026/11/12/maserati-could-unveil-new-alliance-with-huawei-and-jac-in-december/", "name": "科技新報"}]}, {"title": "幣安警告 iOS 漏洞恐外洩錢包私鑰，但蘋果最新系統更新還未修補", "teaser": "幣安警告iOS漏洞", "full": "加密貨幣交易所幣安發出安全警告，指出蘋果iOS系統存在一項潛在漏洞，恐導致用戶的數位錢包私鑰外洩。不過截至目前為止，蘋果釋出的最新系統更新中尚未針對該特定漏洞進行修補。", "think": "數位資產的安全性永遠是投資人第一要務，當官方系統尚未修補漏洞時，用戶只能提高自身警覺。把大筆加密貨幣放在熱錢包中隨時有風險，冷錢包或離線保存依舊最安心。", "question": "手機作業系統傳出資安漏洞時，你通常會立刻停用相關App還是保持觀望？", "sources": [{"url": "https://infosecu.technews.tw/2026/11/12/binance-warns-iphone-crypto-holders-of-security-flaw/", "name": "科技新報"}]}]}}</script>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
