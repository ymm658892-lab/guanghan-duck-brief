  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

不動產信託商品，你會考慮納入個人退休規劃嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608200347.aspx", "name": "中央社"}]}, {"title": "中國出口管制關鍵材料 經部：對台廠短期影響可控", "teaser": "原材料管制短期影響可控", "full": "中國宣布對部分關鍵工業材料實施出口管制，引發供應鏈焦慮。經濟部對此表示，已針對國內主要產業進行評估，業者目前均有儲備庫存與多元替代來源，預期短期內對台灣製造業的整體衝擊相對有限。", "think": "關鍵原材料供應鏈重組已成常態，台廠韌性高且調適能力強。投資人宜觀察企業是否具備長遠的備援供應鏈管理實力。", "question": "你的任職公司或投資標的，是否有做好地緣政治下的備援供應鏈準備？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608200337.aspx", "name": "中央社"}]}], "robotics": [{"title": "具身智能進千行百業 世界機器人大會直擊實景作業", "teaser": "具身智能翻轉產業勞動力", "full": "世界機器人大會展現具身智能的最新突破，人形與工廠機器人正逐步從實驗室走入各行各業實景作業。展示現場顯示機器人已具備更高自主性，能完成複雜的人力搬運與精密操作，加速邁向商業化落實。", "think": "AI與硬體的結合正重塑基層勞動結構。上班族需意識到重複性工作被自動化取代的速度正在加快，職場技能升級刻不容緩。", "question": "你目前從事的工作中，有哪些環節在未來三年內最可能被機器人輔助或取代？", "sources": [{"url": "https://news.google.com/rss/articles/CBMid0FVX3lxTE1QZ0VVSERiTTV4VzdzU1BrQ0JzT2pEdWE4NFBtR1dhVUZnZGlva1QtSGFIWDVyQjlDeXdOM1NBa01USnoxWlpvTDJCa19jdlZUQlplcEpGRWNIaEg2dHJmR1BRZXVHenBZaFoxVXRWQ01tNVd3Zjdn?oc=5", "name": "香港文匯報"}]}, {"title": "北京機器人大會登場 產業拚走進千家萬戶", "teaser": "家用機器人加速普及商機", "full": "世界機器人大會聚焦於如何將機器人技術商業化並導入家庭生活。從銀髮照護、清潔維護到家庭陪伴，各大廠商均致力於降低製造成本，預期機器人將在不久的未來成為普及的家用智慧家電。", "think": "家用機器人時代來臨，將大幅釋放家庭勞務時間。這不僅帶來生活品質提升，也蘊含巨大的龐大消費與供應鏈投資商機。", "question": "若家庭機器人價格降至智慧手機等級，你最希望它幫你處理什麼家務？", "sources": [{"url": "https://news.google.com/rss/articles/CBMia0FVX3lxTE9IX1dDTWFiaWdubG1UbFBwUW80dGNKVk9Najh6UjA4QUlaSDN4M3c2VmZpSXliaWZKa1Z6d1BLNUtleEEtUWZOaDFsTElpeWJmT1FMTl85VnhZbE5ZbWotazVycWpWV3BsRW80?oc=5", "name": "中時新聞網"}]}, {"title": "飛傲科技「機器人創新中心」進駐高軟 陳其邁表歡迎", "teaser": "機器人創新中心進駐高雄", "full": "飛傲科技正式宣佈將「機器人創新中心」進駐高雄軟體園區，高雄市長陳其邁親自表達歡迎，並期待透過產官學合作推動南台灣智慧製造與機器人產業聚落的快速茁壯，帶動地方科技轉型。", "think": "科技產業重鎮正逐漸南移與擴散，為南台灣帶來高薪科技職缺與在地發展機會。職場人應關注區域產業聚落移轉帶來的機會。", "question": "產業聚落的南北轉移，會影響你未來選擇工作地點或職涯規劃的考量嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMijwFBVV95cUxOdlNQazhYYkptWHcxM1FkeThVMnVieVFUdVVmNzl2cGVsN0xLb1lELXAwb0t0UUVyZjh1bzVuN2JDRUhVNTFNRkoxT1I4eXUtcmk3RVUwZmZueHdQUGNuVTlyM19M s": [{"url": "https://www.cna.com.tw/news/afe/202608200043.aspx", "name": "中央社"}]}, {"title": "能源署推動再生能源目標極大化，克服法規力拼非光電發展", "teaser": "綠能新政策力拼極大化", "full": "經濟部能源署表示，為了落實綠能轉型，政府將推動再生能源目標極大化，並致力克服現有法規限制，積極發展非光電的再生能源。這項政策旨在確保多元綠電供應穩定，以滿足產業發展需求。", "think": "綠電是台灣科技業走向國際的剛性需求。政府政策持續作多再生能源，對相關重電及綠能概念股而言，長期基本面依舊看好。", "question": "在淨零碳排趨勢下，綠能產業是否已納入你的長期觀察清單？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608200081.aspx", "name": "中央社"}]}], "robotics": [{"title": "人形機器人迎來商用化，中國市場2026年規模估150億人民幣", "teaser": "機器人從秀技術走向獲利", "full": "人形機器人產業正從單純展示技術，加速轉向尋求實際獲利模式。市場預估，隨著應用場景落地，中國人形機器人市場規模將在2026年達到150億人民幣，商用化與產業化進程超乎預期。", "think": "機器人不再只是科幻展品，而是即將進入工廠與家庭的實用工具。投資人應關注哪些公司能率先實現量產與獲利，而非僅停留在概念階段。", "question": "你認為人形機器人最先會在你的工作環境中取代哪種任務？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiW0FVX3lxTE1Fa0NreHRoUU9aQWRkSnd3SlJuaThjNXg4WGRwOU1nM1VSZGotXzFudTJhS044TnFsT0o2aEF3MWFFVVdBdHhlMEltRGlKTUFIWVlUMm4weGNUVGc?oc=5", "name": "Newtalk新聞"}]}, {"title": "上緯攜手羅比芯與富田電機，共構AI機器人關鍵動力鏈", "teaser": "台廠聯手打造機器人動力", "full": "上緯控股宣布與羅比芯科技、富田電機展開合作，共同建構AI機器人關鍵動力供應鏈。三方將結合各自在材料與電機領域的優勢，搶攻全球AI機器人的核心零組件市場，展現台廠整合實力。", "think": "台灣廠商正透過強強聯手，切入機器人最核心的動力與控制系統。這種供應鏈的整合，有助於台廠在國際機器人舞台上占據關鍵一席。", "question": "面對全球機器人供應鏈重組，台灣零組件廠的優勢在哪裡？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE12UXRYT1h3ck14angta3NGYlpwS0swbnJpc2hMUDA0RFVLZkpXV2tIX1I5eVNNWC1Ib0d0cUVYSkYxb2JqRmxVNkZYWFNYUW05cTJNeHhVNVpmc2U5cG13?oc=5", "name": "工商時報"}]}, {"title": "機器人概念股營收暴增，大單最快第四季落地", "teaser": "前七月營收飆增四引擎開", "full": "機器人產業需求強勁，指標性個股前7月營收暴增近4成，主要得益於四個成長引擎全開。隨著大單預計最快於第四季落地，公司的營運動能有望一路旺到年底，吸引市場高度關注。", "think": "營收數據是檢驗題材股是否具備真本領的試金石。有實質業績支撐的機器人概念股，在市場回檔時會展現出更好的抗跌與反彈力道。", "question": "你在挑選科技概念股時，會優先看重題材熱度還是實際營收？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiS0FVX3lxTE5mZ3VVMkJkM0ZHU081a0pfQmhtTGJwMzN0QXBnMTJ1WVBlTmIwTExEXzB6LUFiOERaUWN3MlNQWFo3M19RMGx1MER5SQ?oc=5", "name": "FTNN 新聞網"}]}, {"title": "全球人形機器人出貨量迎爆發，2026上半年估年增近300%", "teaser": "兩萬台人形機器人將出貨", "full": "根據最新產業研究報告， function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
