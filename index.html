  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

<script type="application/json" id="slot-2000">{"date": "9月9日．週三", "tldr": "今晚台股外資連四買，緯創與日月光營收創新高，AI與機器人供應鏈出貨旺，下班後建議關注美股科技股盤前震盪。", "indicators": {"note": "反映台股今日小幅修正與美股盤前震盪，費半獨紅顯示半導體仍有撐，美股科技股則面臨回檔壓力。", "tiles": [{"label": "台股加權指數", "value": "47,183.36", "valueClass": "fall", "delta": "-0.30%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "26,247.88", "valueClass": "fall", "delta": "-0.66%", "deltaClass": "fall"}, {"label": "費半指數", "value": "11,933.99", "valueClass": "rise", "delta": "+0.39%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "435.57", "valueClass": "fall", "delta": "-0.78%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "外資買超台股209億連4買 敲進群創居冠", "teaser": "外資連四買力挺台股", "full": "外資今日持續站在買方，買超台股達209億元，已是連續第四個交易日買超。其中，面板大廠群創獲得外資強力敲進，高居買超榜首，顯示在市場震盪之際，具有題材或低基期的個股仍受到法人資金的青睞。", "think": "外資連續買超為台股下檔提供支撐，而群創等個股受青睞，顯示資金正尋找基期較低且有轉型題材的標的。投資人此時不宜盲目追高，可留意法人資金流向。", "question": "你的投資組合中，是否有跟隨法人資金布局的低基期潛力股？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609090310.aspx", "name": "中央社"}]}, {"title": "金融三業對中曝險持續下降 國銀占淨值比創歷史新低", "teaser": "國銀對中曝險創歷史新低", "full": "根據最新統計，台灣金融三業截至6月底對中國大陸的曝險額度降至7879億元，其中本國銀行對中曝險占淨值比重更是創下歷史新低。這反映出台灣金融業在面對中國經濟放緩及地緣政治風險時，正積極進行風險控管與資產轉移。", "think": "金融業降低對中曝險，有助於提升整體金融體系的抗風險能力，這對存股族來說是一劑強心針。選擇金融股時，海外風險管理能力已成為不可忽視的評估指標。", "question": "面對地緣政治與全球景氣波動，你如何評估手存金融股的抗風險能力？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609090307.aspx", "name": "中央社"}]}, {"title": "貨櫃三雄8月營收亮眼 提前備貨需求挹注9月表現", "teaser": "航運旺季提前備貨潮湧現", "full": "貨櫃三雄陸續公布8月營收，受惠於旺季效應與客戶提前備貨，營收年增率達到驚人的5至6成。這股提前出貨的熱潮，預計將繼續為9月的貨運需求提供支撐，顯示全球供應鏈在不確定性下仍維持高度運轉。", "think": "航運股營收大增反映出終端需求依然存在，且商家為了因應年底節慶提早拉貨。這對投資人來說，是觀察全球消費市場熱度與供應鏈健康狀況的重要窗口。", "question": "面對航運股景氣波動劇烈的特性，你如何拿捏短期操作與長期持有的分寸？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609090302.aspx", "name": "中央社"}]}, {"title": "數發部推出AI風險檢核系統 協助各部會法規調適", "teaser": "AI法規調適邁出關鍵一步", "full": "數位發展部開發出AI風險檢核系統，旨在協助政府各部會盤點並調適相關法規。隨著人工智慧技術快速滲透到各行各業，政府建立這套系統有助於在推動技術創新的同時，防範潛在的倫理與安全風險，確保AI發展符合法規框架。", "think": "AI法規的完善是產業發展的基石，過度限制會阻礙創新，缺乏規範則帶來風險。投資人應關注未來法規走向，這將直接影響AI相關企業的合規成本與競爭優勢。", "question": "隨著AI監管逐漸步入正軌，你認為哪些科技產業會面臨最大的合規挑戰？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609090314.aspx", "name": "中央社"}]}, {"title": "經濟部將討論提前拆除中火燃煤機組 盼中市府支持", "teaser": "綠能轉型與中火拆機討論", "full": "經濟部計畫於10日召開會議，討論是否提前拆除台中火力發電廠的2部燃煤機組，並積極爭取台中市政府的同意。此舉旨在加速台灣的減碳步伐，平衡地方環保訴求與全國電力的穩定供應，是能源轉型過程中的關鍵一步。", "think": "能源政策與民生、產業發展息息相關。中火機組的去留不僅影響區域空氣品質，更牽動著台灣整體的電力調配與綠能轉型進度，這對高耗能的科技產業尤其重要。", "question": "在追求減碳與確保產業穩定供電之間，你認為政府該如何取得最佳平衡？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609090304.aspx", "name": "中央社"}]}], "robotics": [{"title": "和椿8月營收創歷史新高 半導體與機器人出貨暢旺", "teaser": "雙引擎驅動和椿營收創高", "full": "和椿公布8月營收達4.07億元，再度創下單月歷史新高。這主要得益於半導體次系統與機器人相關產品的強勁出貨需求，顯示在半導體擴產與自動化趨勢下，相關供應鏈廠商正迎來實質的業績成長期。", "think": "機器人與半導體概念股不再只是題材，營收的實質成長證明了市場需求的落地。這提醒我們在布局自動化概念股時，應優先選擇已有實際出貨與營收貢獻的績優股。", "question": "在評估機器人概念股時，你會如何區分「題材炒作」與「實質營收貢獻」？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTE44MWJ5dnA3VG50Y3lLM0JTM3RxbmMzMEhmZVhWamt6RWlCWXg0S3lCeWFBdGExT0pvbFpjR2hJTC1lZS1STFk5OXJqV09pSUk2?oc=5", "name": "UDN"}]}, {"title": "國際新創來台尋求供應鏈合作 鎖定半導體、機器人與AI", "teaser": "台灣供應鏈吸引國際新創", "full": "多家國際新創公司近期積極來台，尋求與台灣供應鏈在半導體、機器人以及AI算力等領域的深度合作。台灣憑藉著完善的硬體製造與研發實力，已成為全球新創將創新概念轉化為具體產品不可或缺的關鍵夥伴。", "think": "台灣在硬體製造的優勢，讓世界無法忽視。從半導體到機器人，國際新創的加入將為台灣本土供應鏈注入新的創新活力與長期訂單機會，值得投資人持續關注。", "question": "台灣供應鏈在AI與機器人浪潮中，該如何提升附加價值，避免淪為毛利競爭？", "sources": [{"url": "https://news.google.com/rss/articles/CBMibkFVX3lxTE8yQUprWER5ZHQxOWRlZ0pLYlY2aTNObGdWTmFuWHoxSlRfVlRZRlR6Z1RYQUZLMkl6U29Xc1FvVFhORk9WWXVCc3VSak9yTDBMRHpUMWpybmlIUkpvdFNBQXk2dkFaRFM1S2FoTEVB?oc=5", "name": "中時新聞網"}]}, {"title": "上緯智聯攜手15家夥伴 搶先布局台灣AI機器人生態系", "teaser": "結盟組建AI機器人生態系", "full": "上緯智聯宣布與15家產業夥伴展開深度合作，共同搶進台灣的AI機器人生態系。透過結盟方式，整合軟硬體資源與技術，旨在加速AI機器人在不同場景的應用落地，提升台灣在智慧製造與機器人領域的國際競爭力。", "think": "單打獨鬥的時代已經過去，生態系的建立是科技競爭的關鍵。企業透過強強聯手，能更快速地克服技術瓶頸並擴大市場版圖，這對相關合作企業的長期發展是極大正面因素。", "question": "面對AI機器人的生態系競爭，你認為軟體整合還是硬體製造才是台灣的致勝關鍵？", "sources": [{"url": "https://news.google.com/rss/articles/CBMifEFVX3lxTE0yd3JXZmVZTjNWTFZFR0tFdnJCUGNqVnhKZG5Ed2JfcGQ1WFhaMHMzNXdxdVpqSllzN0VEVFBPN0RIbXYwMFlrZENFcUZ0S0J2YWkxRVJXSHhTV2cwang3VG1lVnNqbm8zOGZBeXc4cUliRE5GcVk0VU1qaEM?oc=5", "name": "台視全球資訊網"}]}, {"title": "共軍力推人形機器人上戰場？央視畫面引發高度關注", "teaser": "軍事領域的人形機器人應用", "full": "央視近期快閃播放了疑似共軍人形機器人的畫面，引發市場對於人形機器人投入軍事用途的熱烈討論。這預示著未來的衝突可能不再僅限於人類與無人機，具備高度自主性與適應力的人形機器人，正成為大國軍事科技競賽的新焦點。", "think": "科技的發展往往最先應用於軍事領域，人形機器人的軍用化雖然伴隨倫理爭議，但也將加速相關技術的成熟與成本下降。投資人可從中窺見科技巨頭與各國政府在尖端技術上的角力。", "question": "面對人形機器人可能走向軍事化，你認為科技倫理與技術發展之間該如何界定界線？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTE45YkQyaTdja3dBc3lmZ01PeS02emxDaXE5ZHhUeHJERWp3d0FRUEtKdHBlNEVyN3JYWDVGZThDZEJOVkRjUGd3SEtlRjRSQQ?oc=5", "name": "風傳媒"}]}, {"title": "Agility生存賬本曝光：3億美元訂單與百萬營收的商業化困境", "teaser": "人形機器人商業化路漫漫", "full": "人形機器人新創公司Agility的財務數據顯示，儘管擁有高達3億美元的潛在訂單，但實際營收僅有178萬美元。這巨大的落差揭示了人形機器人在從實驗室走向大規模量產與商業化落地時，所面臨的技術瓶頸、高昂成本與供應鏈挑戰。", "think": "夢想很豐滿，現實很骨感。這則新聞給投資人敲響了警鐘，人形機器人雖然前景看好，但要實現真正的商業化盈利仍需時間，在投資相關初創企業時，必須做好長期抗戰的心理準備。", "question": "面對「高訂單、低營收」的科技新創，你該如何評估其真正的投資價值與風險？", "sources": [{"url": "https://news.google.com/rss/articles/CBMihgFBVV95cUxPeTNwdTltWU14ci1za0k2bEdFNGF2UGItX1RZME9zZ1Rubkd2Y0xvdWFfOXBIR09rNmFLR0FlRC1SaVRVb1hpV1M5TlR3ZGg3ZVNRcmlJMnRaOFBSeDFEbFdpQWtERElocVFuN0poUi1fVWhVbWo1eTRmQWZWM1NGRmppX2VSdw?oc=5", "name": "panewslab.com"}]}], "tech": [{"title": "緯創8月營收創單月歷史新高 擴大布局美越製造基地", "teaser": "緯創營收創高與全球布局", "full": "緯創公布8月營收達到驚人的4,600億元，創下單月歷史新高。為了因應全球客戶需求與地緣政治風險，緯創正積極擴大在美國與越南的製造基地布局，顯示其在全球伺服器與代工市場的強勁競爭力與靈活彈性。", "think": "營收創高證明了AI伺服器等產品的強勁需求，而美越布局則展現了企業分散風險的決心。對於投資人而言，具備全球化製造能力的代工大廠，在多變的政經環境中更具抗震力。", "question": "隨著供應鏈向美越轉移，你認為台灣科技代工廠的毛利率將會如何變化？", "sources": [{"url": "https://finance.technews.tw/2026/09/09/wistron-fr-2608/", "name": "科技新報"}]}, {"title": "日月光投控8月營收續創新高 AI先進封測扮演成長要角", "teaser": "先進封測助攻日月光營收", "full": "半導體封測龍頭日月光投控8月營收再度創下歷史新高。隨著AI晶片需求爆發，對於先進封裝技術的要求也水漲船高，日月光憑藉在先進封測領域的領先地位，成功分食AI紅利，成為推動營收持續成長的核心引擎。", "think": "AI的發展不只利好IC設計與晶圓代工，後段的先進封測同樣是關鍵瓶頸。日月光的營收創高，證實了封測產能供不應求的現狀，這是半導體板塊中值得長期追蹤的優質標的。", "question": "在AI晶片供應鏈中，你認為先進封裝技術的護城河有多深？", "sources": [{"url": "https://finance.technews.tw/2026/09/09/ase-fr-2608/", "name": "科技新報"}]}, {"title": "傳蘋果首款摺疊手機eSIM卡關 中國上市時程恐面臨延後", "teaser": "蘋果摺疊機傳eSIM卡關", "full": "市場傳出蘋果首款摺疊手機在eSIM技術上遭遇瓶頸，這可能導致該款備受期待的新機在中國市場的上市時間被迫延後。由於中國市場對摺疊機需求龐大，此一卡關消息引發市場對蘋果未來在摺疊機領域布局的疑慮。", "think": "蘋果在推出新技術時一向謹慎，eSIM與摺疊技術的整合難度不容小覷。這對相關摺疊機供應鏈而言，可能面臨出貨時程遞延的風險，投資人需密切留意。", "question": "面對摺疊手機市場的快速成長，蘋果的延遲推出會給對手帶來多大的超車機會？", "sources": [{"url": "https://technews.tw/2026/09/09/apple-first-foldable-phone-esim-issues-china-launch-delayed/", "name": "科技新報"}]}, {"title": "Google DeepMind推出DNA版搜尋平台 秒搜90億種基因變異", "teaser": "DeepMind秒搜百億基因變異", "full": "Google旗下的AI實驗室DeepMind推出全新的「DNA版Google搜尋」平台，能夠在極短時間內搜尋並分析高達90億種基因變異的影響。這項突破性技術將大幅加速基因學研究與精準醫療的發展，展現AI在生醫領域的巨大潛力。", "think": "AI與生物科技的結合正在顛覆傳統醫療。從藥物研發到基因診斷，AI帶來的效率提升將開啟精準醫療的新時代，這也是未來幾年最具爆發力的投資新藍海之一。", "question": "當AI能夠秒搜百億基因變異，這對未來的個人化醫療與商業保險會帶來什麼改變？", "sources": [{"url": "https://technews.tw/2026/09/09/google-deepmind-introduces-alphagenome-atlas/", "name": "科技新報"}]}, {"title": "軸承大廠新日興8月營收月增2.3% 營運維持穩健成長", "teaser": "新日興營收穩健月增", "full": "軸承大廠新日興公布8月營收，較上月小幅增長2.3%。雖然面臨市場對摺疊機出貨時程的種種傳言，新日興憑藉在筆電與穿戴裝置軸承的穩定基本盤，依然維持穩健的營運表現，展現出良好的抗壓韌性。", "think": "新日興的營收月增，顯示雖然摺疊手機題材可能有所遞延，但傳統消費性電子的復甦仍提供了基本支撐。投資人在看待概念股時，應同時兼顧其既有業務的穩健度。", "question": "在等待新技術與新產品放量的過程中，企業的傳統核心業務扮演了什麼樣的角色？", "sources": [{"url": "https://finance.technews.tw/2026/09/09/szs-3376-202608-financial-report/", "name": "科技新報"}]}]}}</script>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
