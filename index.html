  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

隱形炸彈。高利率環境若維持更久，將壓抑企業獲利並增加借貸成本，上班族在規劃個人理財與房貸等長期財務時，需將高利率常態化納入考量。", "question": "如果高利率環境持續比預期更久，你的個人理財計畫需要做哪些調整？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202610050321.aspx", "name": "中央社"}]}, {"title": "中東地區出口量回升 國際油價下挫", "teaser": "中東出口回升國際油價回軟", "full": "隨著中東地區原油出口量逐步回升，市場對供應中斷的擔憂有所緩解，導致國際油價隨之下挫。供應增加的預期抵消了部分地緣政治風險，也為全球通膨壓力帶來短暫的舒緩契機。", "think": "油價回落有助於降低航運與製造業的營運成本，對通膨降溫也是好消息。對於通勤族而言，這意味著未來的加油成本與物價壓力可能稍微減輕，也有利於消費性產業的復甦。", "question": "油價下跌對你日常生活的開銷與消費意願有實質影響嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610060009.aspx", "name": "中央社"}]}], "robotics": [{"title": "研調：2035年人型機器人年出貨量增至260萬台", "teaser": "人型機器人十年內迎來爆發", "full": "根據最新研究調查報告，隨著技術突破與成本降低，人型機器人市場將迎來爆發性成長，預估到2035年全球年出貨量將達到260萬台。這項預測顯示出人型機器人正逐步從實驗室走向商業化應用。", "think": "機器人產業正處於爆發前夜，這將在未來十年內顛覆製造與服務業。投資人可以提早布局相關的關鍵零組件與感測器概念股，把握長期的成長紅利。", "question": "十年後人型機器人普及時，你認為它最能幫你解決生活中的什麼問題？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiigFBVV95cUxQWVR5VEU2Q3E3QjlLTHQ3aTV5RUVmdk5lTHp2X0h1MmE4RWNoZUh4QXZzY1RLQ3JvZVNpT2M4TWU1Ti1JUEVjWkp2X0NNa1JSVTZUdXgwTG0tTFZvRmxCajF5ZktzSkZybHpkbDN2VGhwemY2bFZKd2VQbVZiVkZhd0IyNUI5TE1qZUE?oc=5", "name": "TechNews 科技新報"}]}, {"title": "川崎重工傳研發自主人型機器人 採用Noetra實體AI", "teaser": "日廠川崎重工強攻實體人工智慧", "full": "日本重工業巨頭川崎重工傳出正積極研發新一代自主人型機器人，並計畫採用先進的Noetra實體AI技術。這項合作旨在提升機器人在複雜實體環境中的決策與適應能力，加速工業與服務業的自動化進程。", "think": "實體AI是目前機器人發展的最前線，讓機器人擁有像人類一樣的物理互動能力。這代表傳統製造業與AI技術的結合正在加深，相關的軟硬體整合廠商將迎來巨大商機。", "question": "實體AI的突破會如何改變你對傳統重工業和機器人的刻板印象？", "sources": [{"url": "https://news.google.com/rss/articles/CBMickFVX3lxTE8xM1NBSGtMQS12MmgwbDlndTc2TnBqWUZVc0NmVlpQaUwzR2ZVb0NUVThPYzJNWDZ4SkxXbzh0bjVkLWxaS3hOY2FYSklkeDcwMzNjYkF3VVBsd3hCWC1oWDE3RXBYRG9wX2c4VXliSnNBUQ?oc=5", "name": "TechNews 科技新報"}]}, {"title": "現代攜手波士頓動力強攻實體AI 挑戰特斯拉", "teaser": "現代聯手波士頓動力挑戰特斯拉", "full": "現代汽車與旗下波士頓動力宣布將深化合作，全力強攻實體AI領域，目標是在2028年達成年產3萬台機器人的規模，直接向特斯拉的Optimus機器人發起挑戰。這場兩大陣營的對決將大幅加速機器人的商用化腳步。", "think": "汽車巨頭與頂尖機器人公司的結盟，顯示出「汽車製造經驗」與「機器人技術」融合的趨勢。這場商用化競賽將帶動整個供應鏈的技術升級，是投資人不可忽視的戰場。", "question": "你認為傳統車廠與特斯拉相比，誰在機器人量產上更有優勢？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiZ0FVX3lxTE1uZlVYYUdhQ29RcllSWmFmUWZsdWZwaVdQTHVDUHRqa0tLdFlnRGJxMEVmbWF6VTdoOEJ2UUFWeC1vaV82TEFnblkwLVg2eEw0eURodzFoUHZscTcxYVoxaUdQeUFVdG8?oc=5", "name": "TechNews 科技新報"}]}, {"title": "日本拚2040年千萬機器人上線 應對缺工新布局", "teaser": "日本千萬機器人大軍應對缺工", "full": "面對日益嚴重的少子化與高齡化問題，日本政府與產業正積極規劃，目標在2040年讓千萬台機器人上線投入工作。這項宏大的計畫旨在填補勞動力缺口，並透過產業新布局維持國家的生產力與經濟競爭力。", "think": "日本的勞動力危機也是台灣未來必須面對的課題。機器人不再只是科技噱頭，而是維持社會運作的剛性需求，這將催生出巨大的長期投資機會與社會轉型期盼。", "question": "當機器人成為工作場所的常態，你該如何提升自己不可被替代的價值？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiogFBVV95cUxPODd1UFh0bV85a1pqTnRnOUZGdENOcVpfWXFldTAwcVF2MlZlNFRHUWtZRC11OVFuR081OVlraDVqMkRwcDk0SlhQeE5RWTUyMm1VUVNiZUFOTkowSmZiYU9OblhnWC1OMzk0Ym94aEo0VElUWElQVzA0ZjFncFM0ZTNDN24zYllvNURjVUtqaVVZNERQNDdVcVNRRnpwUmFqTVE?oc=5", "name": "TechNews 科技新報"}]}, {"title": "中國人形機器人崛起背後的華為軍團", "teaser": "華為軍團助攻中國機器人崛起", "full": "中國人形機器人產業近期蓬勃發展，背後有著實力雄厚的「華為軍團」在技術與供應鏈上提供關鍵支持。透過強大的研發實力與生態系整合，華為正試圖在機器人核心算法與硬體控制上取得主導地位。", "think": "中美科技戰的戰火已延伸至機器人領域。華為的加入代表中國正傾全國之力加速技術自主化，全球供應鏈可能面臨重新洗牌，投資人需密切關注地緣政治對科技股的影響。", "question": "面對中美在機器人領域的競爭，這對台灣的供應鏈會帶來機會還是挑戰？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiekFVX3lxTE1OZkdyTzZUTDF0Z0N0aTB4ZWo2aGkyU2JFejJ6TzE0Q3h3M0F0RGVwOHNsU29FSE5BWHY0VThPZGVjUWd0TkQtd1ZpT0xEZm9DLUlWaHlEa2txaVdUMmtVNHRneHg5RXUzVnhMUERvaVowS292Q2xVdUtB?oc=5", "name": "日經中文網"}]}], "tech": [{"title": "微軟與Meta內部AI改用自家工具 捨棄Claude省預算", "teaser": "微軟Meta改用自家AI省預算", "full": "為了更有效控制預算並發揮自家研發實力，微軟與Meta正逐步在內部業務中捨棄第三方AI工具Claude，轉而全面採用自家開發的AI模型。這項「換血」舉動顯示出科技巨頭正致力於降低對外部技術的依賴與營運成本。", "think": "科技巨頭開始注重AI的投資報酬率與成本控制，這意味著AI市場正從盲目擴張走向務實的商業化階段。這對提供高性價比AI解決方案的廠商將是利多。", "question": "當科技巨頭都開始精打細算，這會如何影響未來AI應用的定價與普及？", "sources": [{"url": "https://technews.tw/2026/10/06/microsoft-meta-cut-claude-usage/", "name": "科技新報"}]}, {"title": "日企組實體AI跨業聯盟 政府助攻逾3800億日圓", "teaser": "日本政府砸千億助攻實體AI", "full": "日本多家企業宣布成立實體AI跨產業聯盟，並獲得日本政府高達3800億日圓的資金助攻。這項政策大力支持旨在結合日本在硬體製造與AI軟體的優勢，加速推動智慧製造與服務業的升級。", "think": "日本政府的大手筆補貼，顯示出國家級的科技競爭已經白熱化。這不僅能加速日本國內的產業轉型，也為台灣相關的半導體與關鍵零組件供應商帶來了龐大的跨國合作商機。", "question": "國家級的資金挹注，是否能讓日本在實體AI領域重新奪回科技霸權？", "sources": [{"url": "https://technews.tw/2026/10/06/japanese-firms-cross-industry-alliance-physical-ai-government-support-380-billion-jpy/", "name": "科技新報"}]}, {"title": "高通平台占優勢 英特爾版Chromebook跑Android恐較慢", "teaser": "高通英特爾晶片大戰延伸筆電", "full": "根據最新測試，高通平台在執行Android應用程式時展現出顯著優勢，而英特爾版本的Google Chromebook在運行同類軟體時速度恐相對較慢。這項差異主要源於高通晶片與Android系統原生架構有著更好的相容性。", "think": "晶片架構的相容性直接影響用戶體驗，高通在行動裝置生態系的優勢正逐步侵蝕英特爾在PC市場的版圖。這提醒我們在評估科技股時，生態系的完整度往往比單純的硬體規格更重要。", "question": "在挑選工作用筆電時，你會更看重晶片效能還是與手機應用程式的相容性？", "sources": [{"url": "https://technews.tw/2026/10/06/google-says-some-googlebooks-offer-better-android-app-support-than-others/", "name": "科技新報"}]}, {"title": "Google創辦人布林捐款 避加州富豪稅", "teaser": "谷哥創辦人捐款避富豪稅", "full": "Google共同創辦人謝爾蓋·布林近期捐贈價值1.02億美元的股份，此舉被市場解讀為是為了規避加州即將面臨的130億美元高額財富稅。加州政府對富豪課稅的政策，正促使許多科技巨頭與富豪尋求合法的財務規劃。", "think": "稅務政策往往會影響科技新貴與資金的流向。高額的富豪稅可能促使人才與企業總部遷往稅率更友善的地區，進而改變科技產業聚落的分布，這是投資人評估區域經濟時需注意的。", "question": "你認為對富豪課徵高額財富稅，對科技創新與社會公平是利大於弊嗎？", "sources": [{"url": "https://finance.technews.tw/2026/10/06/googles-sergey-brin-has-now-donated-more-than-100-million-to-oppose-californias-billionaire-tax/", "name": "科技新報"}]}, {"title": "砸7千萬美元造130奈米曝光機 俄羅斯半導體面臨量產考驗", "teaser": "俄羅斯自主曝光機迎量產考驗", "full": "俄羅斯投入高達7,000萬美元研發出130奈米曝光機，試圖達成半導體自主化，然而目前仍面臨嚴峻的量產考驗。在國際制裁下，俄羅斯雖努力擺脫對外依賴，但在成熟製程的規模化生產上依然困難重重。", "think": "半導體供應鏈是高度全球化的產物，單一國家想要完全自主化需要付出極高的成本且成效有限。這再次證明了台灣半導體產業在全球供應鏈中不可替代的獨特與關鍵地位。", "question": "俄羅斯的案例是否證明了，在全球化受阻的時代，半導體自主化是一條艱難的路？", "sources": [{"url": "https://technews.tw/2026/10/06/russia-unveils-first-130nm-lithography-machine/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-1300">{"date": "10月7日．週三", "tldr": "今天台股在高檔震盪，AI供應鏈與邊緣運算營收報喜，雖然美股與台積電ADR微幅拉回，但科技長線動能依然強勁。", "indicators": {"note": "美股微幅收紅，台股在五萬點前高檔盤整，台積電ADR小跌顯示市場在午盤呈現觀望與震盪格局。", "tiles": [{"label": "台股加權指數", "value": "49,806.37", "valueClass": "rise", "delta": "+0.19%", "deltaClass": "rise"}, {"label": "那斯達克", "value": "27,599.89", "valueClass": "rise", "delta": "+0.45%", "deltaClass": "rise"}, {"label": "費半指數", "value": "13,217.82", "valueClass": "rise", "delta": "+0.34%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "482.30", "valueClass": "fall", "delta": "-0.72%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "倚天酷碁9月營收6.75億創新高 核心業務動能強勁", "teaser": "核心業務發威營收創高", "full": "宏碁旗下子公司倚天酷碁公布9月營收達6.75億元，寫下歷史新高紀錄。這項亮眼成績主要受惠於其核心業務的持續成長，展現出集團小金雞在市場上的強勁競爭力與營運彈性。", "think": "母集團孵化小金雞的策略持續奏效，這類具備利基市場的子公司在景氣復甦時往往能展現極大爆發力。投資人可多留意集團股內部的潛力新星。", "question": "你在挑選中小型股時，會優先考慮有大集團撐腰的子公司嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610070319.aspx", "name": "中央社"}]}, {"title": "邊緣實體AI需求強 研華、樺漢第3季營收創歷史新高", "teaser": "邊緣運算發威營收創高", "full": "工業電腦大廠研華與樺漢受惠於邊緣實體AI的強勁需求，第3季營收雙雙創下歷史新高。隨著工業自動化與智慧化轉型加速，邊緣運算設備的拉貨動能將持續扮演營運成長的關鍵引擎。", "think": "AI不只在雲端，實體工業與邊緣端的落地應用正在加速變現。工業電腦族群的營收創高，代表產業轉型是玩真的，相關個股值得長期追蹤。", "question": "當AI開始進入工廠與日常設備，哪些生活場景會最先改變？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610070312.aspx", "name": "中央社"}]}, {"title": "記憶體漲價效應顯現 9月電腦相關用品漲幅創歷史新高", "teaser": "記憶體漲價帶動終端走揚", "full": "隨著記憶體現貨與合約價持續走揚，其漲價效應已正式傳導至終端消費市場，導致9月電腦相關用品的物價漲幅創下新高。這反映出上游零組件成本壓力正逐步由消費者與品牌廠共同承擔。", "think": "物價上漲雖然對消費者荷包不利，但對記憶體與通路概念股而言，卻是利差擴大、營收增長的訊號。這提醒我們在通膨中尋找受益產業的投資機會。", "question": "面對電腦硬體漲價，你會選擇延後升級還是提前購買以防繼續漲？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610070301.aspx", "name": "中央社"}]}, {"title": "旺宏9月營收創歷史新高 十銓攀歷年同期新高", "teaser": "記憶體雙雄營收傳捷報", "full": "記憶體大廠旺宏9月營收表現亮眼，成功刷新歷史新高紀錄；同時，記憶體模組廠十銓也繳出歷年同期新高的好成績。兩家公司的強勁表現，再次印證了半導體與記憶體市場正處於穩健復甦的軌道上。", "think": "記憶體產業的景氣循環非常明顯，當龍頭廠與模組廠營收同步創高，通常代表下游客戶拉貨積極，整體產業鏈的評價有機會獲得重新定位。", "question": "景氣循環股在營收創高時，你認為是該順勢加碼還是逢高調節？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610070290.aspx", "name": "中央社"}]}, {"title": "廣達9月及第3季營收攀峰 AI新產品第4季蓄勢小量出貨", "teaser": "AI伺服器拉貨營收登頂", "full": "代工大廠廣達在AI伺服器強勁需求帶動下，9月與第3季營收雙雙攀上歷史巔峰。公司表示，新一代AI產品預計將於第4季開始小量出貨，這將為年底及明年的營運動能注入強心針。", "think": "廣達的營收創高證實了AI伺服器的出貨動能並非空穴來風。雖然第四季只是小量出貨，但這代表技術瓶頸已克服，明年放量成長的能見度極高。", "question": "在AI硬體供應鏈中，你更看好晶圓代工還是下游的組裝大廠？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610070289.aspx", "name": "中央社"}]}], "robotics": [{"title": "川崎重工開發居家照護狗型機器人 守護高齡族群安全", "teaser": "機器狗化身居家守護者", "full": "川崎重工推出專為居家照護設計的狗型機器人「Home Leo」，主打健康監測、居家安全及防範詐騙等功能。這款機器人旨在全方位照護高齡族群，解決高齡化社會面臨的照護人力短缺問題。", "think": "隨著高齡化社會來臨，居家照護的需求將呈爆發式成長。機器人不再只是工廠裡的機械手臂，而是能走入家庭、提供溫暖與安全的智慧伴侶，潛在商機無限。", "question": "如果家中有長輩，你會願意嘗試讓機器狗來協助日常照護嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTE1BbksyRHotaXFSY1ZRelY5NDBxWVBOT2gxQWtFXzdPNWdpZ0hHWldPNWpQQ080SmQ1TW5ZU1RqalZWWWJTOVRQMFE0akdMdw?oc=5", "name": "Cool3c"}]}, {"title": "2026財訊產業趨勢論壇：從6G到AI機器人 勾勒未來智慧新局", "teaser": "前瞻科技勾勒未來藍圖", "full": "在最新的產業趨勢論壇中，專家學者共同探討了從6G通訊、低軌衛星到AI機器人的最新發展。這些前沿技術將在未來幾年內加速融合，共同勾勒出2030年智慧產業的全新格局與應用場景。", "think": "科技的發展是環環相扣的，強大的通訊技術是AI與機器人普及的基石。上班族在規劃個人職涯或投資布局時，應將這些中長期趨勢納入考量。", "question": "面對2030年的智慧產業新局，你覺得自己需要培養什麼新技能？", "sources": [{"url": "https://news.google.com/rss/articles/CBMie0FVX3lxTE1xYm5USlNKUnpvNmo3LUhJc1AzZ2dVUGZRcWlDeGx3N0FhWmk1SFRYa0hQd0cyc1Jreml2UUNnX3BzWWVGMTNvZGRSamlYS0xVMHNCY1NWVUtaVGhMLXJ5THlidWZCV2xYdkZTNzFzWkowZ25ZbU9haG9ibw?oc=5", "name": "財訊"}]}, {"title": "波士頓動力挖角亞馬遜AI大將 力攻物理AI新戰場", "teaser": "強強聯手進軍物理AI", "full": "機器人先驅波士頓動力近日成功延攬亞馬遜的AI高階主管，旨在強化其在「物理AI」領域的研發實力。此舉顯示出公司正積極將先進的生成式AI技術與硬體控制結合，讓機器人具備更自然的物理互動能力。", "think": "物理AI是機器人走向實用化的關鍵。當機器人不僅能思考，還能精準理解並適應物理世界的規則，這將徹底改變物流、製造甚至是服務業的遊戲規則。", "question": "當機器人具備更強的物理適應力，哪些工作可能會最快被取代？", "sources": [{"url": "https://news.google.com/rss/articles/CBMimwFBVV95cUxQdTZvVExZN1ota0NyLWp2TmNXTjdrZk1Rb3lXWV82Rmh2aFZNa1hyR09HOGhFUmEwdVZGeU5meVV1UkFhLWZ5RUlEQkVseHFqaFRrZWhUVFdYZGhwazNJLWE2MWVuLU16dk8zU1V3RWJhaGJ5RlFQTjZiczhhaEtvNUpmRHZWMldFQjZnS3BWVTZBN3F2SWhhOXp5TQ?oc=5", "name": "TechNews 科技新報"}]}, {"title": "首爾智慧生活週盛大開幕 聚焦實體AI融入市民日常", "teaser": "實體AI走入市民生活", "full": "首爾智慧生活週正式揭開序幕，展覽核心聚焦於如何將實體AI技術導入市民的日常生活。透過各種智慧化公共服務與生活科技展示，向大眾呈現未來智慧城市在提升生活便利與效率上的無限可能。", "think": "智慧城市的建設是國家與企業展現實力的舞台。當實體AI在公共領域得到驗證，將會加速民間市場的採用，並為相關硬體與系統整合商帶來龐大商機。", "question": "你最希望未來的智慧城市能幫你解決生活中的什麼痛點？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiYkFVX3lxTFA0cFJ2YmR1MFV6bEh4clBUYmc1Rk1RbTFfZFpRNElWLVVNMk5ndlFSb19MQk10UUstNVh2NHdDNFRwVWFFLWlIQ2t3VHpzeENCMXVfeGZSZzFtRU1QZWtsY3B3?oc=5", "name": "TechNews 科技新報"}]}, {"title": "人形機器人「愛寶」進駐賣場導購 助攻門市業績大增", "teaser": "機器人導購成吸金利器", "full": "人形機器人「愛寶」在實體賣場擔任導購角色，成效顯著。根據統計，引進愛寶的門市平均業績提升了近四成，顯示出具備親和力與互動功能的機器人，在零售通路中具有極佳的吸睛與導購效果。", "think": "這證明了機器人不僅能節省人力成本，更能主動創造價值、提升營收。未來在服務業中，人機協作的場景將會越來越普及，改變傳統的銷售模式。", "question": "在逛街時，比起人類店員，你會更傾向跟機器人導購互動嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTE92UHBTaDZaQ2VyMmg5UG9XelVDRGJQR2ZueFk3SkFDbkF1Yi04bVFYOGdLN2pTNmtfckRVQm1VRkI3SmxreVpoZUs3c0R5UFls?oc=5", "name": "UDN"}]}], "tech": [{"title": "運轉36年走入歷史 台中燃煤1、2號機退場由燃氣機組接棒", "teaser": "燃煤退場迎綠色轉型", "full": "運轉長達36年的台中燃煤1、2號機組正式宣告退場，未來將由更環保的燃氣機組接手發電。這一轉變標誌著台灣在減少碳排放與推動能源轉型上邁出重要一步，有助於改善中部地區的空氣品質。", "think": "能源轉型是不可逆的趨勢，綠能與低碳發電將成為政策與資金追逐的焦點。這不僅關乎環保，更會牽動相關重電與綠能產業的長期投資價值。", "question": "在能源轉型的過程中，你認為台灣該如何平衡環保與穩定供電？", "sources": [{"url": "https://technews.tw/2026/10/07/taichung-coal-fired-units-1-2-decommissioned-36-years-gas-fired-units-take-over/", "name": "科技新報"}]}, {"title": "馬斯克否認台積電參與Terafab 澄清將採自建自營模式", "teaser": "馬斯克澄清Terafab自建", "full": "針對外界傳聞台積電將參與Terafab建設的消息，特斯拉執行長馬斯克予以否認，並明確表示該項目將由其公司自建自營。這項澄清釐清了市場對於兩大科技巨頭在該項目上合作的過度猜測。", "think": "馬斯克強調自建自營，反映出科技巨頭對於關鍵基礎設施自主權的重視。雖然台積電未直接參與，但其作為全球晶圓代工龍頭的地位依然穩固，投資人無須過度解讀。", "question": "科技巨頭紛紛走向硬體自主化，這對既有的供應鏈會帶來什麼衝擊？", "sources": [{"url": "https://technews.tw/2026/10/07/musk-denies-tsmc-terafab-self-build-operate/", "name": "科技新報"}]}, {"title": "全球避險基金龍頭示警 AI泡沫可能已接近破裂邊緣", "teaser": "避險基金大老示警AI泡沫", "full": "全球知名避險基金創辦人近日發出警告，指出當前AI概念股的估值可能過高，泡沫面臨破裂風險。他提醒投資人應審慎評估AI技術實際變現的速度，避免在市場過熱時盲目追高，承受不必要的風險。", "think": "在市場一片樂觀時，適度的警示聲音有助於投資人保持冷靜。我們應該關注企業是否有實質的營收與獲利支撐，而非僅憑題材與想像空間來投資。", "question": "你認為目前的AI熱潮是實質的產業革命，還是資金堆砌的泡沫？", "sources": [{"url": "https://finance.technews.tw/2026/10/07/global-hedge-fund-founder-warns-ai-bubble-bursting/", "name": "科技新報"}]}, {"title": "第三代半導體需求旺 漢磊明年AI營收占比上看兩成", "teaser": "漢磊受惠第三代半導體", "full": "半導體廠漢磊受惠於GaN產能滿載及SiC迎來V型反彈，營運前景看好。公司預估，在高效能運算與車用需求帶動下，明年AI相關業務的營收占比有機會挑戰兩成，展現第三代半導體的強勁成長力道。", "think": "隨著AI與電動車對高功率、高freqency元件需求大增，第三代半導體的戰略地位日益重要。漢磊營收結構的轉變，顯示出其已成功卡位這波高成長浪潮。", "question": "在半導體投資中，你會配置部分資金在第三代半導體這類利基市場嗎？", "sources": [{"url": "https://technews.tw/2026/10/07/episil-targets-10-20-ai-revenue-share-2027-gan-sic-dual-growth-engines/", "name": "科技新報"}]}, {"title": "美資料中心建設支出飆升73% 年化金額達850億美元", "teaser": "資料中心建設支出大暴增", "full": "美國在資料中心建設的支出呈現爆發式成長，年增幅高達73%，年化金額已達到850億美元，且近幾個月來增速有加快趨勢。這波熱潮主要由各大科技巨頭積極擴建AI基礎設施所驅動。", "think": "資料中心的軍備競賽還在持續，這對台灣的伺服器代工、散熱、電源管理等供應鏈是長期的利多。只要美方支出不減，台廠相關供應鏈的營運動能就值得期待。", "question": "資料中心支出大增，你認為最直接受益的台灣產業鏈是哪一個環節？", "sources": [{"url": "https://technews.tw/2026/10/07/us-spending-on-data-center-buildings/", "name": "科技新報"}]}]}}</script>

  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
