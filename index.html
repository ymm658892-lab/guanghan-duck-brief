  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

 "think": "能源成本上漲可能再度推升通膨壓力，進而打亂主要央行的降息步調。對通勤族而言，除了荷包感受油價變動，更需留意高利率環境可能延續對股市的壓抑。", "question": "面對地緣政治帶來的油價波動，你的開銷預算與投資部位是否具備抗通膨彈性？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610310006.aspx", "name": "中央社"}]}, {"title": "調降台灣App Store佣金，蘋果致力打造蓬勃生態系", "teaser": "蘋果降佣金活絡在地開發者", "full": "蘋果宣布調降台灣地區App Store的抽成佣金費率，展現對在地數位內容與軟體開發者的支持。此舉有助於減輕中小型開發團隊的營運負擔，提升利潤空間，進一步激勵台灣軟體創新與應用生態圈的長期發展。", "think": "平台巨頭適度讓利，將給予在地數位內容創作者更大的成長動能與變現空間。對於軟體從業人員來說，這是一波利用更低成本推出原創產品的契機。", "question": "平台抽成調降後，你認為台灣能否出現更多具國際競爭力的原創App應用？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610300333.aspx", "name": "中央社"}]}], "robotics": [{"title": "台美新創機械手臂獲創投青睞，實體AI掀矽谷新浪潮", "teaser": "台美技術聯手落地實體AI", "full": "結合台灣硬體供應鏈與矽谷演算法的台美新創團隊，成功研發具備高度自主操作能力的機械手臂，驚豔矽谷創投圈。這項突破將人工智慧從虛擬軟體推進至實體世界，顯示軟硬體深度整合已成為機器人商業化的核心競爭力。", "think": "實體AI是台灣硬體製造業千載難逢的升級機會，不再只賺代工毛利，而是掌握關鍵模組。投資人應多關注具備軟硬整合能力的隱形冠軍。", "question": "當AI真正跨入物理世界，你認為哪些傳統製造業環節將最快被顛覆？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiT0FVX3lxTFBROFdPYnlpOFlDX1Vsb00wbHZxSWlsXzZaa3lsS0RmWEUxMEhBWGlPczJvOGVYS3kxMkJjWmNYcGxOR1FZLTlENUIyYWx3VUU?oc=5", "name": "TVBS新聞網"}]}, {"title": "意法半導體：人形機器人關鍵在系統整合而非單純大腦", "teaser": "機器人競局看重系統整合力", "full": "晶片大廠意法半導體指出，每台人形機器人約搭載價值600美元的半導體零組件，但未來勝負關鍵在於整體機電系統的整合效率，而非僅依賴強大的AI運算大腦。穩定的傳感、驅動與電源管理才是機器人流暢運作的基石。", "think": "市場往往過度神化AI晶片的大腦功能，卻忽視了神經、肌肉與感知等周邊硬體的重要性。分散投資於感測與動力系統廠商，能捕捉更全面的供應鏈商機。", "question": "在評估人形機器人商機時，你是否忽略了感測與動力控制等基礎零組件的價值？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiekFVX3lxTE4xeUNKcjJhTk1IZ25yV0dFcFRrdjdRQVJyOG4wVEdnMUw2VHRhd2ZSY1lXR1hzOFA1R1k2dUxxOGxZYkNjaHRYc2cxRHFrS1RhWHNCTmgtNWlSRGR3NlFWaGxFZ09BS2VSZE1wNGRzR1FqWXJ3aU5KRTVB?oc=5", "name": "BigGo 財經"}]}, {"title": "川普認定進口機器人恐危及國安，暫緩關稅給予半年談判期", "teaser": "工業機器人捲入國安貿易戰", "full": "美國政壇傳出將進口機器人與工業機械列為潛在國安風險，目前暫緩加徵關稅並給予180天談判期限。此舉凸顯自動化設備與智慧製造已被視為戰略物資，未來跨國機器人供應鏈可能面臨更嚴苛的地緣政治審查與重組。", "think": "自動化不再只是企業降低成本的工具，更上升為國家戰略競爭力的一部分。跨國布局的製造業與投資人必須及早因應供應鏈碎片化帶來的成本上升。", "question": "如果各國對工業機器人築起貿易壁壘，自動化設備的採購成本將如何衝擊企業獲利？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE1FcDVqRV9iX0JPSlFqZTNWSjZUem5WRE9yT2JnRnFEbzZCMG1ZUWI2d3B1a2tnRFZXYkM5dm1aZzZOcG5FOG8xOGpPY3lKVzdUOFVxV0JfTnhOVXNKMkJn?oc=5", "name": "非凡新聞台"}]}, {"title": "家事機器人時代來臨，每小時收費千元能刷馬桶會關燈", "teaser": "機器管家進駐日常家庭服務", "full": "新一代智慧機器人管家正式亮相，不僅能精準清潔馬桶內緣等死角，完成工作離開時還會自主關燈，服務每小時定價約新台幣1,600元。這標誌著服務型機器人已具備精細動作能力，逐步邁入家庭消費級市場。", "think": "高齡化與少子化促使家庭照護與清潔成本居高不下，服務型機器人正從科幻走向剛性需求。高單價初期雖鎖定高資產族群，但量產後將迅速改變一般家庭的生活模式。", "question": "當家事機器人每小時收費降至合理區間，你願意將繁瑣家務完全交給它嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiekFVX3lxTE9VY0ViRWlUbEdrMnc3Qzhmemg1elpyNXgtR1AxN0pEcXl1SFNhMmZyWmRkS3dRWHNnQ3VoNWNlNkNFZmtXc0FpYXpvVDJ4eV9xajl4dDRIX0pxQzJ5TDNCbWtzajh4Q1F0bXlhZFlULWkxUTAySjlNQlJB?oc=5", "name": "BigGo 財經"}]}, {"title": "查選舉資訊AI機器人抄假答案，假訊息風險引發高度關注", "teaser": "AI查訊失真凸顯資訊驗證挑戰", "full": "最新研究指出，多款查詢選舉資訊的AI聊天機器人出現引用錯誤或虛假資訊的現象，宛如公然抄襲假答案。這項漏洞引發外界對公眾決策受誤導的深切擔憂，也促使監管單位加強對生成式AI資訊準確度與演算法透明度的審查力道。", "think": "生成式AI雖然是便利的生產力助手，但在缺乏事實核查下極易產生幻覺。在日常工作或做重大決策時，絕不能盲目將AI輸出視為唯一事實依據。", "question": "在高度依賴AI獲取資訊的時代，你建立了一套可靠的多方查證機制嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiYEFVX3lxTFA2Z0lrYTEtYlVCZTFadV9TZFNwWHJxbERzVUk2N0ZKQ0lUbkNBQ2thb1RhS1pMMFNnNXFrek1JSG1MZlJ1WjJrV0g4MENaMXBzZ2J0eGNqYTZ4NHlGMHdoTNIBZkFVX3lxTE15Rk1ldmZ6dVFJdVU0dzA4OE1XMVVtS1JoY19oc3IyYnVjNXlMVTVfYmpSeEhrWldOQVptS2NXVFY0U1lRempQNVA3WHBxdkVuOV9mMFRMb2lobzM5ckRaM0pmbjhJdw?oc=5", "name": "新唐人電視台"}]}], "tech": [{"title": "SpaceX傳與特斯拉整合？馬斯克世紀交易面臨法規高牆", "teaser": "馬斯克王國整併面臨雙重考驗", "full": "市場傳出馬斯克有意推動SpaceX與特斯拉整併的世紀狂想，但這項潛在交易被外界形容為在地雷區跳舞，除了必須跨越跨產業整合的技術壁壘，更得面對上市公司與私人企業股權交換的嚴格監管審查與反壟斷挑戰。", "think": "強人企業家的資源整合往往能帶來極具野心的綜效，但治理風險與法規障礙同樣巨大。身為投資人，應客觀評估題材炒作與實質落地可行性之間的落差。", "question": "當明星企業家提出跨界大併購時，你更看重其戰略綜效還是治理風險？", "sources": [{"url": "https://finance.technews.tw/2026/10/31/spacex-tesla-merger-largest-earth-who-benefits-who-pays/", "name": "科技新報"}]}, {"title": "奧特曼批PC配太多DRAM，呼籲優先配置AI資料中心", "teaser": "記憶體分配引發算力資源爭奪", "full": "OpenAI執行長奧特曼直言個人電腦配置大量DRAM是資源浪費，主張高階記憶體應優先支援AI資料中心建設。此番言論凸顯全球AI模型訓練正面臨嚴峻的硬體頻寬瓶頸，也讓消費端與雲端資料中心之間的資源競奪浮上檯面。", "think": "高頻寬記憶體已成為AI發展最卡脖子的瓶頸之一。這意味著記憶體大廠的產品結構正加速向高毛利的AI伺服器傾斜，可能間接延緩消費型電子降價的節奏。", "question": "當全球運算資源高度向AI中心傾斜，消費級PC市場的升級動能是否會受壓抑？", "sources": [{"url": "https://technews.tw/2026/10/31/openai-ceo-sam-altman-talk-about-dram/", "name": "科技新報"}]}, {"title": "幣安遭駭巨損緊急暫停提款，比特幣跌破7.7萬美元關卡", "teaser": "資安風暴重創加密貨幣市場", "full": "全球龍頭加密交易所幣安驚傳遭駭客入侵，損失高達數十億美元，官方緊急宣布暫停提款並承諾全額承擔損失。此事件引發市場恐慌性拋售，比特幣應聲跌破7.7萬美元大關，再次敲響數位資產基礎設施的資安警鐘。", "think": "即便規模最龐大的中心化交易所，也無法完全免除資安漏洞風險。持有高風險數位資產時，分散存放於冷錢包與妥善做好避險，是每個投資人必須遵守的鐵律。", "question": "面對中心化平台的突發資安風險，你是否做好了極端情況下的資產隔離措施？", "sources": [{"url": "https://technews.tw/2026/10/31/binance-6-3bn-hack/", "name": "科技新報"}]}, {"title": "不沾鍋鐵氟龍成輝達新歡，兩岸PCB供應鏈版圖恐洗牌", "teaser": "材料革命引爆PCB供應鏈變革", "full": "為了解決高階AI運算帶來的極端散熱與高頻訊號傳輸損耗，輝達在新一代伺服器機櫃中大膽採用具備優異介電特性的鐵氟龍材料。這項材料變革預期將打破既有規格，可能引發兩岸PCB與銅箔基板供應鏈的重新洗牌。", "think": "AI規格的快速迭代，隨時可能由底層材料的替換顛覆既有供應鏈版圖。投資電子零組件族群，不能只看既有份額，更要緊盯是否通過下一代新材料的認證。", "question": "當AI伺服器散熱與高頻材料升級，你追蹤的零組件廠商具備技術轉型的護城河嗎？", "sources": [{"url": "https://technews.tw/2026/10/31/nvidia-love-ptfe/", "name": "科技新報"}]}, {"title": "醫療AI大突破，提前15個月預警癌王胰臟癌", "teaser": "AI早期偵測改寫重症篩檢", "full": "最新醫療研究指出，新型AI模型能在臨床診斷前15個月提前預警有「癌王」之稱的胰臟癌，敏感度高達73%，表現遠優於傳統影像判讀。這項技術若順利普及，將大幅提升極難早期發現的致命癌症存活率，為預防醫學立下里程碑。", "think": "醫療AI是少數能跨越經濟景氣循環、真正改善人類生活品質的剛需領域。這類實質解決痛點的落地應用，往往比單純的聊天機器人更具長期社會與商業價值。", "question": "隨著AI大幅提升重大疾病的預後機率，你如何看待精準醫療相關產業的長期潛力？", "sources": [{"url": "https://technews.tw/2026/10/31/ai-early-detection-pancreatic-cancer/", "name": "科技新報"}]}]}}</script>

chnews.tw/2026/10/30/tw-ict-export-3rd-2025/", "name": "科技新報"}]}]}}</script>

<script type="application/json" id="mascot-today">{"outfit": ["umbrella"], "action": "salute", "message": "行情起伏是常態，吃飽飯喝杯咖啡，充飽電力再出發！"}</script>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
