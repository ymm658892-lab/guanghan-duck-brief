  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

業降低營運不確定性。對通勤族而言，總體經濟環境的穩定是長期投資建立信心的重要基石。", "question": "美中關係的陰晴圓缺，是否會改變你對跨國大型企業長期持股的信心？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609220002.aspx", "name": "中央社"}]}, {"title": "聯茂爆違約交割3.19億元　今年單次違約最高金額", "teaser": "台股出現今年最大違約", "full": "市場傳出聯茂相關個股發生高額違約交割事件，金額高達3.19億元，創下今年單次違約最高紀錄。這項突發的資金事件引起市場高度關注，也提醒投資人在高檔震盪時必須嚴控槓桿。", "think": "即使大盤氣氛再好，個股的流動性與信用風險仍是投資人不能忽視的隱形地雷。這起事件再次敲響警鐘，提醒我們資金控管與風險意識永遠大過於追價獲利。", "question": "在台股熱絡上攻之際，你是否有做好資金槓桿與風險承受度的安全防護？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609210323.aspx", "name": "中央社"}]}], "robotics": [{"title": "特斯拉機器人 多家陸供應鏈獲單", "teaser": "特斯拉機器人供應鏈傳捷報", "full": "市場傳出特斯拉的人形機器人專案進展順利，多家具備量產能力的中國大陸供應鏈廠商已成功獲得訂單。這顯示機器人商業化進程正在加速，關鍵零組件廠成為市場追逐焦點。", "think": "人形機器人被視為下一個兆元級的大型硬體賽道，供應鏈的切入往往代表長期的營收動能。台灣相關精密機械與電子零組件廠能否分一杯羹，是值得持續追蹤的題材。", "question": "你認為人形機器人供應鏈會不會複製當年電動車供應鏈的爆發性成長？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxPU3JfRmRjbm4za09CLU42aHVVQjBISzZIbzJLeUpXa3hjdFhHSlpMRlZDbGk5MEkzbkE4Vjl0SXBNczgzRTNENWtBemZDVXV5cF9JNjk2UDBIb2NiaUxRNTJQZk1FOHg1U1lfNlFndFM3dzY2emthRWx1REd1RXFpa3R2YnlDWUlM?oc=5", "name": "富聯網"}]}, {"title": "太古可口可樂鄭州廠以機器人揀貨", "teaser": "傳統大廠加速導入揀貨機器人", "full": "為了因應日益繁重的物流與倉儲需求，太古可口可樂鄭州廠正式導入自動化機器人進行揀貨作業。這項應用大幅提升了倉儲作業的效率與正確率，展現工業自動化的實際落地效益。", "think": "機器人的價值不僅在於科幻感，更在於解決傳統勞力短缺與效率瓶頸的痛點。當越來越多傳統產業導入自動化，相關軟硬體整合商將迎來穩健的B端商機。", "question": "你身邊的工作環境或日常消費領域，是否也感受到自動化機器人帶來的改變？", "sources": [{"url": "https://news.google.com/rss/articles/CBMipAFBVV95cUxQVHRaclFZVWN0dG5Dck9WWFRLT3NnM1hBdzNxV3BIV21SMVk0YUY0N1lzM0VpSDVERXNDMkhnRE5ickp6SFBTaEoyVVZVcW9hdGd0anJQQ2pMeEo0Wm5PVE5qc2dqSXRaLUZZN1J0ang5YTdtQU5OaWVvVFBPUTJxd1V3OE53Y09hVm9sVUNoRFBZcUJSR1B3Q25INndZNEhyemVGVQ?oc=5", "name": "IndexBox"}]}, {"title": "再談「默會知識」：當AI有了大腦，機器人何時才算學會騎腳踏車？", "teaser": "探討機器人學習實體技能瓶頸", "full": "雖然AI大腦的運算能力日益強大，但要讓機器人掌握如騎腳踏車般需要大量直覺與經驗的「默會知識」仍是一大挑戰。專家與研究人員正持續突破實體世界物理互動的學習瓶頸。", "think": "這說明了機器人要真正走入家庭與複雜場景，軟體演算法與物理世界的結合比想像中困難。投資科技股時，我們需要區分哪些是行銷噱頭，哪些是具備實質技術壁壘的創新。", "question": "你覺得AI要完全像人類一樣靈活地在實體世界工作，還需要幾年的時間？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVEFVX3lxTE1yQktvOG9Menl0Rl9ZYWg4dzd2clJQRVdnTGw4ZkJXVkdrRmRzT0pmekI3WWk0bWRURnRlUlVFcHg2UTdKTzFCcHY5NmFaMkRTVGFjWQ?oc=5", "name": "TNL The News Lens 關鍵評論網"}]}, {"title": "中國機器人從“能用”走向“好用”", "teaser": "產品質量提升帶動市場普及", "full": "隨著製造工藝與核心零組件國產化程度加深，中國大陸的機器人產業正逐步從過去的「勉強能用」轉向高性價比的「好用」階段。這波升級有助於加速各行各業的自動化滲透率。", "think": "產品從有到好、從貴到普及，往往是產業爆發前夕的典型特徵。對投資人而言，這代表市場正在淘汰純題材炒作的公司，轉而檢視真正具備性價比優勢的實力派企業。", "question": "當自動化設備變得既便宜又好用，會不會對一般上班族的就業市場帶來壓力？", "sources": [{"url": "https://news.google.com/rss/articles/CBMidEFVX3lxTFBzNUNZZWdzeG4zeHRVM1h6QXJOQW5FbTBxSnBCa1poc2hBSWNyMGNfRW9Qb3RfM2hnMmpoNzQ3Mi1qUFBDcTIxNEpyamxBR2I0bDV2bnNWVTY2SDF4ZXNGM1ZmOFpmRkR4VzhNanpGcHZaeHJR?oc=5", "name": "人民网"}]}, {"title": "川習會前美中研議 AI 對話、川普將組「AI 部隊」", "teaser": "美中聚焦AI對話與政策部署", "full": "在重要政治峰會登場前夕，傳出美中雙方正研議建立官方性質的AI對話機制，而美國政壇也傳出將組建專屬的政策推進團隊。科技治理與地緣政治的交織，正形塑全新的AI發展格局。", "think": "AI已經從單純的商業技術，上升為國家級的戰略資源與外交籌碼。這類政策走向將直接牽動全球半導體與科技巨頭的佈局策略，投資人不可不慎。", "question": "你認為美中在AI領域的競合關係，會如何影響台灣科技供應鏈未來的生存空間？", "sources": [{"url": "https://news.google.com/rss/articles/CBMickFVX3lxTE0zdWQyUzA0NWNDVF9wcEZxb3ZfWWxWa1JIdmptYXBJU2dPMDFCMnRrZU5WR0FqdmhyM0RMQjFuTGozbk9ZTnhwdHhkazFUOFg1aF9WQ2V6SGtHREZSaDZWOXJSbWhPdTJHVkxxSVhKN2p2Zw?oc=5", "name": "TechOrange 科技報橘"}]}], "tech": [{"title": "凱基挺群聯三大優勢領先同業，維持增加持股評等目標價 2,900 元", "teaser": "外資高度看好群聯競爭優勢", "full": "法人機構最新報告指出，群聯憑藉著技術領先與多元佈局等三大優勢，在同業中脫穎而出。研究團隊給予正向評價並維持「增加持股」評等，目標價上看2,900元，激勵市場信心。", "think": "本土與外資法人對優質權值股的目標價調整，往往能為盤面提供明確的資金對焦方向。對於看好記憶體與控制晶片長線發展的投資人來說，這是基本面扎實的背書。", "question": "面對法人給出的高額目標價，你在進場布局時會採取什麼樣的風險控管策略？", "sources": [{"url": "https://finance.technews.tw/2026/09/22/kgi-groups-three-major-advantages-give-it-a-leading-edge-over-its-competitors/", "name": "科技新報"}]}, {"title": "全球柴油荒看不到盡頭　高價恐一路燒到 2027 年", "teaser": "柴油供應緊俏高價將成常態", "full": "受限於煉油產能結構性調整與地緣政治衝擊，全球柴油短缺的情況短期內難以緩解。市場預期高昂的油價與燃料成本將一路延續至2027年，對全球物流與運輸成本帶來長期壓力。", "think": "能源結構的轉型期往往伴隨著陣痛期，傳統化石燃料的供給不穩可能成為常態。這對依賴運輸成本的零售與物流業是一大 <script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
