  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

通膨政策直接鎖定民生物資，反映出民生消費物價對政經局勢的敏感影響。民生消費力的維持對於整體消費類股與總體經濟信心有顯著的底線支撐作用。", "question": "關稅調整對民生物價的短期平抑，能否真正解決長期結構性通膨？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202608210329.aspx", "name": "中央社"}]}, {"title": "中東局勢及亞洲需求推動 油價上漲", "teaser": "地緣政治與需求帶動油價上漲", "full": "受中東地緣政治緊張局勢加劇，以及亞洲市場需求回溫等多重因素影響，國際油價呈現走升態勢。市場持續關注能源供應鏈是否受到實質干擾，以及後續石油輸出國組織的產量策略變動。", "think": "油價上揚往往是通膨預期與運輸成本的風向標，對全球航空、物流與石化產業影響巨大。上班族與投資人需密切留意能源價格波動對日常生活開銷與企業獲利的連帶效應。", "question": "能源價格震盪加劇，你在投資組合中是否有配置抗通膨或避險標的？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608220007.aspx", "name": "中央社"}]}], "robotics": [{"title": "中國人型機器人迎量產！今年市場規模達150億人民幣，估2027年至少成長60%", "teaser": "人型機器人量產商機全面爆發", "full": "中國人型機器人產業邁入商業化量產新階段，今年市場規模預計達150億人民幣，行業評估至2027年成長率將超過60%。隨著供應鏈成熟與成本降低，人型機器人正在快速從實驗室走向工業製造與服務場景。", "think": "機器人產業加速量產意味著關鍵零組件如減速器、伺服馬達等需求的爆發。投資人可關注在機器人供應鏈中佔據關鍵技術與成本優勢的台廠供應鏈鏈結。", "question": "當人型機器人進入大規模量產，哪些傳統人力崗位最可能被加速替代？", "sources": [{"url": "https://technews.tw/2026/08/21/trendforce-counterpoint-see-2026-ai-human-robot/", "name": "科技新報"}]}, {"title": "MQ-9戰損慘重，通用原子推出「野火」無人機計畫準備取代死神", "teaser": "軍用無人機技術面臨世代交替", "full": "面對MQ-9死神無人機在現代戰場上的高損耗率，通用原子公司正式啟動「野火」無人機開發計畫，旨在打造成本更低、生存能力更高的新一代無人機平台。這標誌著軍用無人機向低成本群攻與高生存力轉型的趨勢。", "think": "國防軍工領域正加速向低成本、高自主性的無人系統轉型，驅動相關感測器與AI邊緣運算技術的突破。這展現了科技在非民用領域的快速迭代，亦是整體航太供應鏈的新動能。", "question": "國防無人機朝向低成本化發展，將對傳統高單價軍工產業帶來何種衝擊？", "sources": [{"url": "https://technews.tw/2026/08/21/ga-asi-unveiled-new-wildfire-male-drone-program-as-the-successor-of-the-reapers/", "name": "科技新報"}]}, {"title": "賭城變身自駕戰場！特斯拉、Uber、Waymo獲准一年內部署8千輛自駕計程車", "teaser": "賭城迎來大規模自駕車營運", "full": "拉斯維加斯核准特斯拉、Uber與Waymo等巨頭，於未來一年內部署多達8000輛自駕計程車，賭城正式成為自動駕駛技術的最大落地試驗場。這項大規模部署將實測自駕車在複雜城市交通中的安全性與商業營運模式。", "think": "自駕計程車的大規模落地代表無人駕駛營運商業化進入實質戰場。這不僅改變了交通出行體驗，也將帶動車用晶片、光達感測器與車聯網數據服務的龐大需求。", "question": "如果自駕計程車普及率大幅提升，你認為未來的私家車持有意願會如何改變？", "sources": [{"url": "https://technews.tw/2026/08/21/tesla-uber-and-waymo-all-get-the-ok-to-operate-thousands-of-robotaxis-in-nevada/", "name": "科技新報"}]}, {"title": "從自動化走向自主化，Nvidia Physical AI成自動化大展焦點，台達、所羅門大秀機器人新應用", "teaser": "物理AI驅動機器人自主化轉型", "full": "自動化工業大展上，Nvidia推動的Physical AI成為核心焦點，宣告機器人從傳統硬編程自動化進入自主思考新時代。台達電與所羅門等台廠也展出最新結合視覺與AI的智慧機器人應用，展現強大軟硬整合力。", "think": "AI與實體機器人的結合正打破工業製造的效率天花板，提升製造業彈性與客製化能力。上班族需了解AI自動化非遠不可及，而是已經深植於智慧工廠與物流營運中。", "question": "當機器人學會自主思考與調整，未來的製造業工程師該著重培養哪些不可替代的能力？", "sources": [{"url": "https://www.ithome.com.tw/news/178346", "name": "iThome"}]}], "tech": [{"title": "企業 AI 導入為何卡關？主管親自示範與打造「容錯文化」是落地關鍵", "teaser": "打造容錯文化推動AI企業落地", "full": "許多企業在引進AI技術時遭遇瓶頸，專家指出技術並非唯一的障礙，企業文化與主管態度才是成功關鍵。主管若能親自示範使用並營造允許試錯的環境，員工才能真正將AI工具融入日常工作流程中。", "think": "AI轉型不只是採購軟體，更是一場組織文化的改革。身為職場上班族，主動擁抱AI工具並具備實驗精神，將是數位時代提升個人競爭力的關鍵心法。", "question": "在你目前的日常工作中，阻礙你全面使用AI工具的最大因素是什麼？", "sources": [{"url": "https://technews.tw/2026/08/22/workforce-development-in-the-age-of-ai/", "name": "科技新報"}]}, {"title": "先進封裝推升檢量測需求，法人看好倍利科與大廠合作已築護城河", "teaser": "先進封裝帶動檢量測設備需求", "full": "隨著半導體邁向先進封裝時代，晶片結構日益複雜，對精密檢測與量測設備的需求呈爆發式成長。法人指出，本土設備廠如倍利科透過與國際半導體大廠深度合作，已成功構築極高的技術與商業護城河。", "think": "半導體演進不單靠製造技術，後段先進封裝與品質檢測同樣關鍵。投資人布局半導體產業時，除了晶圓代工巨頭，亦可延伸關注關鍵設備與檢測護城河企業。", "question": "在半導體繁榮期，你偏好投資終端晶片巨頭還是提供關鍵檢測設備的隱形冠軍？", "sources": [{"url": "https://technews.tw/2026/08/21/taiwan-investors-see-v5-technologies/", "name": "科技新報"}]}, {"title": "晶技打進前十大光通供應鏈，AI、車用成明年成長雙引擎", "teaser": "光通訊與車用加持迎成長引擎", "full": "石英元件大廠晶技成功打入全球前十大光通訊廠供應鏈，搭配AI伺服器與車用電子需求持續強勁，為明年營運注入雙重成長引擎。公司透過高階頻率元件產品線高毛利化，展現強勁的營運轉型成果。", "think": "傳統零組件廠若能成功搭上AI高速傳輸與車用電子列車，就能獲得高毛利與新成長曲線。這驗證了技術升級與對準新應用趨勢對電子零組件產業的重要性。", "question": "面對傳統電子零組件轉型，你如何觀察其切入高毛利AI供應鏈的實質成效？", "sources": [{"url": "https://technews.tw/2026/08/21/taiwan-investors-see-txc-2026-q2-financial-report/", "name": "科技新報"}]}, {"title": "日月光：攜手在地半導體材料供應鏈，為台灣築起20年防禦高牆", "teaser": "深耕在地供應鏈築起競爭防線", "full": "封測龍頭日月光表示，透過全力扶植在地半導體材料供應鏈，不僅能降低對進口的依賴，更為台灣半導體產業築起未來20年的競爭防禦高牆。這種在地生態系的凝聚力，是維持台灣全球半導體樞紐地位的核心。", "think": "地緣政治下「在地供應鏈韌性」成為關鍵議題。封測大廠帶頭扶植本土材料商，不僅穩定產能，也為台灣許多隱形冠軍材料廠帶來長期的訂單保障與升級契機。", "question": "台灣半導體在地供應鏈更加完善後，對全球半導體板塊會產生什麼樣的重塑？", "sources": [{"url": "https://finance.technews.tw/2026/08/21/by-joining-hands-with-the-local-semiconductor-materials-supply-chain-a-20-year-defensive-wall-has-been-built-for-taiwan/", "name": "科技新報"}]}, {"title": "半導體材料邁向新紀元！徐秀蘭：台灣隱形冠軍要走向世界定義材料新標準", "teaser": "台灣材料隱形冠軍邁向國際化", "full": "中美晶董事長徐秀蘭指出，台灣半導體材料產業擁有卓越的研發與製造實力，未來的關鍵在於從在地隱形冠軍轉型為國際標準制定者。透過自主技術研發與國際市場拓展，台灣材料廠有能力在全球供應鏈中掌握更大話語權。", "think": "台灣半導體實力已從製造代工延伸至上游材料與化學品領域。產業領袖倡議定義國際標準，意味著台廠正嘗試從技術跟隨者轉型為產業規格的塑造者。", "question": "台灣企業若要從「隱形冠軍」轉型為「規格制定者」，最需要突破的瓶頸是什麼？", "sources": [{"url": "https://finance.technews.tw/2026/08/21/taiwans-hidden-champion-aims-to-define-new-standards-for-materials-on-the-world-stage/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-1300">{"date": "8月21日．週五", "tldr": "台股今日盤中大漲重返四萬五千點，由航運與AI權值股領軍上攻；但機器人概念股利多出盡重挫，市場樂觀中仍帶有警覺。", "indicators": {"note": "美股那指回檔，但台積電ADR與費半撐盤，帶動台股盤中大漲近1%，顯示本土資金與電子權值股信心強勁。", "tiles": [{"label": "台股加權指數", "value": "45,125.34", "valueClass": "rise", "delta": "+0.91%", "deltaClass": "rise"}, {"label": "那斯達克", "value": "26,067.17", "valueClass": "fall", "delta": "-1.00%", "deltaClass": "fall"}, {"label": "費半指數", "value": "11,800.02", "valueClass": "rise", "delta": "+0.53%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "416.00", "valueClass": "rise", "delta": "+0.95%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "台股漲逾300點重返45000點 貨櫃三雄勁揚", "teaser": "台股大漲重返四萬五", "full": "今日台股盤中表現強勁，大漲逾300點，成功站回45000點大關。其中，受惠於運價與市場需求支撐，貨櫃三雄等航運股表現亮眼，成為今日盤面上的吸金焦點，帶動整體多頭氣勢。", "think": "雖然大盤指數創下新高，但資金輪動快速。投資人此時不宜盲目追高，應多留意基本面佳且位階相對較低的標的。", "question": "在大盤重返高點之際，你的資產配置是否做好了防禦準備？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608210082.aspx", "name": "中央社"}]}, {"title": "AI熱潮擴散 凱基投顧上修台股企業未來2年盈餘預估", "teaser": "AI外溢效應看好後市", "full": "隨著人工智慧應用持續向外擴散，凱基投顧看好台股企業的獲利前景，正式上修未來兩年的盈餘預估。這顯示在AI硬體與軟體雙重拉動下，台灣供應鏈的實質獲利能力正在逐步兌現。", "think": "機構上調獲利預估代表市場信心回溫，這對長期投資人來說是一劑強心針。我們可多關注AI供應鏈中，實質受惠且獲利能見度高的企業。", "question": "當市場普遍樂觀時，你如何評估手中持股的合理評價？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608210084.aspx", "name": "中央社"}]}, {"title": "新台幣午盤升3.5分 暫收31.89元", "teaser": "新台幣午盤偏升震盪", "full": "受到國際美元走勢與台股大漲影響，新台幣兌美元匯率今日午盤呈現偏升格局，升值3.5分，暫收在31.89元。這反映出外資匯入意願明顯回升，對台股資金面與多頭信心形成強烈支撐。", "think": "匯率是外資動向的風向球。新台幣升值通常有利於吸引資金續留台股，但出口導向的科技業也需注意匯損對毛利率的潛在影響。", "question": "面對匯率波動，你所投資的企業是否有足夠的匯率避險能力？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608210091.aspx", "name": "中央社"}]}, {"title": "美超微內部調查出爐 全面強化出口合規機制", "teaser": "美超微強化出口合規", "full": "美超微（Supermicro）公布最新內部調查結果，宣布將全面強化其出口合規機制。此舉旨在回應市場與監管機構對於其先前供應鏈管理與合規性的疑慮，力求在近期風波後重建全球投資人的信心。", "think": "科技巨頭的合規問題直接影響其出貨與營收。美超微積極整頓合規機制，短期內雖可能增加營運成本，但長期有助於消除市場不確定性。", "question": "企業在追求高速成長的同時，你是否也會評估其公司治理與法規風險？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608210090.aspx", "name": "中央社"}]}, {"title": "AI獲利創高難安撫投資人 傳股東回饋規模逾700億美元", "teaser": "巨額回饋能救股價嗎", "full": "儘管AI業務帶來的獲利創下歷史新高，但市場對未來成長增速的擔憂仍難以完全平息。傳出大廠擬祭出超過700億美元的股東回饋計劃，試圖透過大規模買回庫藏股或配息來安撫並留住投資人。", "think": "這顯示市場對AI的期待標準已被拉得極高。當高獲利已成常態，企業必須展現更強勁的下一步成長動能，或透過大筆配息來維持吸引力。", "question": "當科技巨頭開始大手筆回饋股東，這代表產業進入成熟期還是成長放緩？", "sources": [{"url": "https://www.cna.com.tw/news/ait/202608210106.aspx", "name": "中央社"}]}], "robotics": [{"title": "輝達點名16台廠攻實體AI！機器人概念股「盤中綠油油」 上銀、所羅門重摔近5%", "teaser": "概念股利多出盡重挫", "full": "雖然輝達（NVIDIA）公開點名16家台灣廠商共同合作實體AI，但今日機器人概念股卻出現利多出盡的走勢。上銀、所羅門等指標股盤中大跌近5%，呈現「綠油油」的修正態勢。", "think": "被大廠點名是長期肯定，但短期內股價往往已提前反應。這提醒上班族投資人，切忌在利多消息滿天飛時盲目追高，以免套牢在高點。", "question": "當熱門題材出現「利多實現反而大跌」時，你該如何調整交易策略？", "sources": [{"url": "https://news.google.com/rss/articles/CBMitwNBVV95cUxNQnROOTZUaGZrOTBfa3NtcjlXOHQxZE1MUzZCaXdxNm1RYl9BWGVrZ3J6Sjg2aU9jV3FrWkNlal9HVC1QUTgtWkpVeXZQa2IyYWQ5cjhNWjhlbkNvYUtSNWkzR1ROTzZiTkxraUR5NEtNRE1FTWw1MzJVb0FOdVVoR3ZhVUgtS1hYa1FMakgwZHlENU5iZmJmSW1GUHNIejRPTXo2SHB5TkdPX184aXV4NXdnQ3pXYUFJaVhQT29YTlU2ZnFtbFN4aFdIMGRJVUxORFktRTBJMGtUYW93Z3dmWnNTQ1E3a1N6ODJwY0NzLUZuMVhNZVh5UFVzbTBmQVFIdWtZTFF1bkVlR0poTTBlOTQ0ZWdtUEN0VkIwWDk5MG5aWFpaQ2JVcTV4R2xLS3ZKX2ZXeUFhMHpWZ3gtTTcxR19NSDA0elNXVzYtQUZ5STZzc0VoQzdyZDFMZlMtcjRMeFdnbTJnQldQZnR2VUQzYnVFclVUR0hmWVN1TzhJbTlUdzdjUXA2bFh0VU1DeGdnYkg3WjNxQk96VUxzXzVvYTJWbHdwNV9jNGxUV1kwSHhrYUdzQVpR?oc=5", "name": "Yahoo股市"}]}, {"title": "達明攜手 NVIDIA 匯聚台灣頂尖人形機器人學研能量", "teaser": "產學攜手攻人形機器人", "full": "台灣機器人廠商達明宣布與輝達（NVIDIA）深度合作，共同匯聚國內頂尖學術與研究機構的能量，加速人形機器人的開發。此合作旨在將前沿AI技術導入實體機器人，提升台灣在全球供應鏈的地位。", "think": "產學研合作是推動新興科技落地的關鍵。台灣具備硬體製造優勢，若能結合輝達的軟體與AI實力，將有機會在未來人形機器人市場占有一席之地。", "question": "你認為台灣在人形機器人時代最大的競爭優勢在哪裡？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTFAtdF9oZkplU3B5X2gwdlVFLTIzZl9odE0tX3gwQ2tEcUcxdmVsZkZUd2o1Rnotc0Y3VHNXRDN2WDdJOTlSQlVxR2FVekttZ2It0gFWQVVfeXFMT0R3akp2VnNvdmtSV2Ftb3ZQa3FNd2h6SUpSb1pJYzQ2bkgtVnZzenRrQzZJU0tVQ2MyYThDNXFfbEstZjdUbVRXa0ZYWWR4YnhxZFVMZHc?oc=5", "name": "UDN"}]}, {"title": "他的機器人公司本週上市 仍認為人形機器人突破還要數年", "teaser": "創辦人冷靜看產業突破", "full": "儘管旗下機器人公司於本週順利上市，但該公司創辦人受訪時坦言，人形機器人要在技術與商用上取得真正的突破，恐怕還需要數年的時間。這番言論為當前過熱的機器人炒作澆了一盆冷水。", "think": "業內人士的務實看法值得深思。這提醒我們，機器人雖然前景看好，但從實驗室走到大規模商業化落地，中間仍有巨大的技術與成本鴻溝需要跨越。", "question": "面對長線趨勢，你願意給予新創科技多少耐心與等待時間？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE9IWmU4MWZWVER5SjhmT1NtTzkzdVhIQTlLeEppRTVkM2VjVmZrN2NyejVMczJvc2g3Z0dzSEJRZ2U0Ui1hLTFDaVVtR0VsMXlKeldjeUtR?oc=5", "name": "Business Insider Taiwan"}]}, {"title": "裏三層外三層！宇樹機器人亮相世界機器人大會 全場目光被牢牢鎖定", "teaser": "宇樹機器人驚豔大會", "full": "在世界機器人大會上，宇樹科技展示的最新機器人吸引了無數目光，展位被參觀者圍得水洩不通。其靈活的動作與高度整合的AI展示，展現了當前非美系廠商在機器人領域的強大競爭力。", "think": "機器人產業的競爭已是全球化戰場。除了美系與台系供應鏈，陸系廠商在成本控制與快速迭代上的實力同樣不容小覷，這將加速整體產業的普及。", "question": "全球群雄並起的機器人競賽中，你認為誰能最快實現商業化普及？", "sources": [{"url": "https://news.google.com/rss/articles/CBMid0FVX3lxTE54V3BudjVUQzVlN1NXeENzcEFLaHdrQzEtaWdsSGpGcWhsRXpVM2Fia1NJb3RrUkdJM3lHX3VzQTk4ek15dHNTWFZHLVRlSkhGQWRmOEw0c2lsNHU5UndLeFd6TU1XNEt5RDlUd2NVcWlWOVBkTkdB?oc=5", "name": "香港文匯報"}]}, {"title": "機器人跑贏Bolt？人形機器人時速45.6公里創新紀錄影片讓網友笑瘋", "teaser": "人形機器人飆速創紀錄", "full": "網路上流傳一段人形機器人以時速45.6公里奔跑、打破新紀錄的影片，引發網友熱烈討論。雖然奔跑姿勢有些滑稽讓網友笑翻，但其展現的極限運動性能，確實證實了硬體控制技術的飛躍進步。", "think": "科技的進步往往伴隨著趣味性。雖然滑稽的姿勢讓人發笑，但背後代表的是關節馬達與平衡演算法的極致表現，未來在救援或特殊任務中將大有可為。", "question": "當機器人的體能超越人類極限，這會為人類社會帶來哪些便利與隱憂？", "sources": [{"url": "https://news.google.com/rss/articles/CBMia0FVX3lxTE1qaHdEb1g2NmpzU1dKaXllY1owaWlrZnBpV2FZS1RkekVPQVoyZTNGaUhwcFpUNWhvQllLTVpoQVNHYkR2cDhueTdQMmI3em9SSVdKeG9LcXJ6cnR5dnZGVm02QkI4NWFVdEdV?oc=5", "name": "運動筆記"}]}], "tech": [{"title": "經濟部補助表後儲能，台泥、格斯、興能高迎商機", "teaser": "政府補助儲能引爆商機", "full": "經濟部為了穩定電網，推出表後儲能系統的補助計畫，吸引台泥、格斯、興能高科技等國內大廠積極布局。此政策預期將帶動儲能設備的需求，為相關供應鏈注入強勁的營運成長動能。", "think": "能源轉型與電網穩定是台灣科技業發展的基石。政府政策利多明確，儲能板塊除了政策紅利，更是未來綠能趨勢下不可或缺的長期投資題材。", "question": "在缺電與綠能轉型的雙重趨勢下，你是否留意到儲能產業的潛力？", "sources": [{"url": "https://technews.tw/2026/08/21/moea-subsidizes-behind-meter-energy-storage-tcc-gss-enebest-seize-business-opportunities/", "name": "科技新報"}]}, {"title": "日本 7 月通膨加速，市場預期日銀 10 月升息", "teaser": "日本通膨升溫升息在即", "full": "日本公布7月份通膨數據呈現加速趨勢，這強化了市場對於日本銀行（日銀）可能在10月份再度升息的預期。日圓利差交易的變動，將持續對全球金融市場的資金流動產生重大影響。", "think": "日本的貨幣政策轉向是今年全球市場的最大變數之一。升息可能導致日圓升值，進而引發全球資金重新配置，台灣投資人需密切留意日圓走勢對台股的間接衝擊。", "question": "日本若在10月如期升息，你認為對你的海外資產配置會有何影響？", "sources": [{"url": "https://finance.technews.tw/2026/08/21/japan-july-inflation-accelerates-market-expects-boj-october-rate-hike/", "name": "科技新報"}]}, {"title": "韓媒：SK 海力士擬砸「數十兆」在日本蓋記憶體工廠", "teaser": "海力士擬赴日鉅額建廠", "full": "根據韓國媒體報導，半導體巨頭SK海力士正計劃投入高達數十兆韓元的資金，在日本建立全新的記憶體晶片工廠。此舉旨在深化與日本半導體材料、設備供應鏈的合作，並分散地緣政治風險。", "think": "半導體產業的本土化與多國布局已成不可逆的趨勢。日韓在半導體領域的合作加深，一方面能強化供應鏈韌性，另一方面也可能對台灣半導體產業帶來潛在的競爭壓力。", "question": "面對日韓半導體聯盟的成形，台灣供應鏈該如何維持領先優勢？", "sources": [{"url": "https://technews.tw/2026/08/21/sk-hynix-may-build-new-memory-fab-in-japan/", "name": "科技新報"}]}, {"title": "AI 衛星商機背後隱性危機，可能外流地球珍貴金屬資源且無法回收", "teaser": "AI衛星商機的環保隱憂", "full": "隨著AI衛星部署熱潮興起，研究指出這背後隱藏著環境危機。大量衛星發射可能導致地球珍貴的金屬資源流失至太空中，且在現有技術下幾乎無法回收，引發科學界對資源永續的擔憂。", "think": "科技進步不應以犧牲地球資源為代價。在追逐太空科技與AI衛星概念股的同時，ESG（環境、社會與治理）指標將成為評估企業長期價值時，不容忽視的重要環節。", "question": "當科技發展與地球資源永續產生衝突時，你該如何權衡投資選擇？", "sources": [{"url": "https://technews.tw/2026/08/21/ai-data-center-satellite-metals/", "name": "科技新報"}]}, {"title": "莫德納癌症療法突破引爆軋空，股價兩日大洗三溫暖", "teaser": "莫德納新療法引爆軋空", "full": "生技巨頭莫德納（Moderna）宣布在癌症療法上取得重大突破，此利多消息瞬間引爆市場軋空行情。然而，隨後股價卻出現劇烈波動，在短短兩天內大洗三溫暖，展現生技股高波動的特性。", "think": "生技醫療研發是一條高風險、高回報的道路。突破性進展能讓股價一飛沖天，但隨之而來的獲利了結與市場分歧也極易造成劇烈震盪，投資時需做好風險控管。", "question": "面對波動劇烈的生技新藥題材，你敢將其納入資產配置中嗎？", "sources": [{"url": "https://finance.technews.tw/2026/08/21/moderna-cancer-therapy-breakthrough-short-squeeze-stock-two-day-swings/", "name": "科技新報"}]}]}}</script>

}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
