  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

": "標準化介面如何釋放人型機器人商業潛力？", "teaser": "標準介面加速機器人商業化", "full": "人形機器人產業正在經歷從零組件客製化走向模組標準化的重要轉折。產業專家指出，統一的硬體與軟體介面能顯著降低開發與維護成本，讓零組件廠商更容易切入供應鏈，進而加速人形機器人的商業化規模。", "think": "任何科技產品的大規模普及，都離不開標準化介面的建立。了解標準化進程，有助於精準預測機器人產業爆發的時間點。", "question": "你覺得人形機器人要走入一般家庭生活，最大的關鍵瓶頸是價格還是安全性？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiuAFBVV95cUxPbzhmU0YydHh6bEk4cC1JWWdKeVNfNDJNOUFSN2RSQlVxeWpjZFNsN3J6b3hZaTE3V2lTSUNmU1l0Tmc3YzRwRXE5Z2VfWXhoM3BuZEZrME1IdjZYelhwZzA5X2tvUVNFSXlYbHV1a2lrb0VkeklVZjNPS0pQOFlNV1p6UHJfQS1PalpHWk9kdHJDc09Vc05EeTlRZDlCQ2cyZTd5Z0JycHNURmRMcUlBbTJ6aTcwTkxN?oc=5", "name": "電子工程專輯"}]}, {"title": "現代汽車執行長：當地車商可能賣你人形機器人", "teaser": "傳統車廠跨足機器人銷售", "full": "現代汽車執行長受訪表示，隨著車廠自動化經驗日益成熟，汽車經銷商未來很有可能成為人形機器人的銷售通路。車廠擁有強大的製造經驗與通路網路，跨足機器人製造與銷售將為傳統車廠帶來全新商業模式。", "think": "跨領域的產業融合正打破傳統商業邊界。車廠發揮既有的後勤與展售優勢銷售機器人，展現出自動化科技龐大的商業想像空間。", "question": "如果未來車商展間同時販售汽車與居家機器人，你會考慮進店體驗購買嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1Ick9xX2dZRnc1bjQzTXJXOTd4X19QcTRMNjc4amx4czFsZFlRUERrU0VwVWpHUC1SVF9PS3VfSFRBdkVVcml0T1VlWURnZEsxRUVXRWFn?oc=5", "name": "Business Insider Taiwan"}]}, {"title": "直擊2026世界機器人大會——機器人不再耍寶，開始拚KPI了？", "teaser": "機器人走向實用價值展現", "full": "在最新的世界機器人大會中，展出焦點已從過去示範特技與耍寶轉向強調工作效率與實用價值。參展廠商紛紛展示機器人執行工廠組裝、物流分揀與精細作業的數據，顯示人形機器人正正式邁入拚KPI的實用階段。", "think": "科技產品發展成熟的指標就是從概念展示轉變為解決問題的能力。這意味著機器人離真正進入工廠與職場替人類分擔勞務的距離越來越近。", "question": "如果單位引進具備高KPI的機器人同事，你認為自己不可被取代的核心優勢是什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMia0FVX3lxTE5vNHRXSXJWckVfTWs4ZFg2b2xSZk1OZTVFcy1qSUJlNThDWm1UVjJDT3p6Uk9Ic2plN2hzV1lobFpfMWM2MWlqTHIxTTh5TlJIZHh1bGFUUkVsR1E2QVV2ZnpZNmI0VnJQUlV3?oc=5", "name": "DIGITIMES"}]}], "tech": [{"title": "美 FDA 批准突破性藥物上市，胰臟癌晚期患者存活期倍增", "teaser": "胰臟癌突破性新藥獲批上市", "full": "美國FDA最新批准一款針對晚期胰臟癌的突破性新藥上市。臨床實驗顯示該藥物能大幅延緩病況惡化，使晚期患者的中位存活期翻倍，為長期缺乏有效療法的癌王治療帶來重大醫療曙光與全新希望。", "think": "醫療科技的進步直接造福人類健康與福祉，突破性藥物的上市除了帶動生技醫療板塊關注度，更讓許多家庭看到了對抗艱難疾病的曙光。", "question": "這項生技領域的重大突破，是否會讓你重新審視個人與家庭的醫療保障與保險規劃？", "sources": [{"url": "https://technews.tw/2026/08/27/fda-approves-pancreatic-cancer-drug-rasonque-for-market/", "name": "科技新報"}]}, {"title": "傳輝達同意 129 億美元購併 Hugging Face", "teaser": "輝達傳出天價收購開源平台", "full": "市場傳出輝達已同意以129億美元的天價收購知名開源AI模型平台Hugging Face。若消息屬實，這將是輝達有史以來規模最大的併購案，顯示輝達正積極從硬體晶片霸主向軟體與開發者生態系擴展領土。", "think": "輝達不僅做硬體，更深耕開發者生態圈，這種「軟硬整合」的護城河策略能進一步鞏固其在AI領域的不可替代性，並提高競爭對手切入的門檻。", "question": "面對輝達在AI生態系的不斷擴張，你認為其他科技巨頭該如何應對這股壟斷優勢？", "sources": [{"url": "https://technews.tw/2026/08/27/nvidia-agrees-to-buy-open-source-platform-hugging-face-for-12-9-billion/", "name": "科技新報"}]}, {"title": "遭控社群媒體使青少年成癮，Meta 以 180 億美元與美國多州和解", "teaser": "Meta天價和解青少年成癮案", "full": "社群巨頭Meta因旗下平台演算法遭控造成青少年心理健康危害與成癮，最終同意支付180億美元巨額和解金與美國多州達成和解。此案件創下科技巨頭監管和解的新紀錄，也凸顯各國對網路平台安全合規的嚴格要求。", "think": "監管風險一直是大型科技股不可忽視的成本。巨額和解金雖然短期衝擊獲利，但也促使科技公司更加注重演算法倫理與數位社會責任。", "question": "在享受社群平台便利的同時，你平時會採取哪些方式來控管自己與家人的螢幕使用時間？", "sources": [{"url": "https://technews.tw/2026/08/27/meta-settles-us-child-social-media-addiction-lawsuits-for-18-billion/", "name": "科技新報"}]}, {"title": "AI 資安成新戰場  CrowdStrike 財報報喜盤後噴近 9%", "teaser": "資安巨頭財報優預期盤後暴漲", "full": "資安大廠CrowdStrike公布最新財報，營收與獲利均優於市場預期，激勵盤後股價大漲近9%。公司表示在AI時代企業面臨的資安威脅劇增，帶動相關防護平台需求強勁成長，展現AI資安市場的龐大商機。", "think": "AI技術蓬勃發展的同時，也衍生出新型態的網路安全隱憂，使得資安成為企業不可或缺的剛性需求。投資人可將目光延伸至AI防禦相關板塊。", "question": "隨著AI資安威脅升級，你的工作環境中是否也開始落實更嚴格的資安規範了呢？", "sources": [{"url": "https://finance.technews.tw/2026/08/27/crowdstrike-beats-earnings-raises-guidance-shares-jump-nearly-9-percent/", "name": "科技新報"}]}, {"title": "OpenAI 宣布 ChatGPT 迎來重大升級，無須碰觸帳密也能幫你完成網站代辦任務", "teaser": "ChatGPT升級自動執行網頁任務", "full": "OpenAI發布ChatGPT重大升級，推出全新的自動化操作功能。使用者無須手動輸入帳號密碼或複雜指令，ChatGPT即可直接跨網站幫忙完成預訂、搜尋與資料處理等複雜代辦任務，大幅提升個人生產力。", "think": "生成式AI正從單純的「問答對話」演進為能夠「執行任務」的AI Agent。掌握這些新型態AI工具，將是未來職場上班族拉開生產力差距的關鍵。", "question": "如果AI能幫你自動完成日常重複性的網頁操作，你最希望它幫你處理哪項繁瑣工作？", "sources": [{"url": "https://infosecu.technews.tw/2026/08/27/openai-chatgpt-upgrade-without-password/", "name": "科技新報"}]}]}}</script>

融業者如何因應轉型挑戰。", "question": "你願意嘗試購買完全無業務員參與、全線上流程的純數位保險商品嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608270339.aspx", "name": "中央社"}]}, {"title": "券商授信倍數不放寬 金管會：市場距離上限仍有空間", "teaser": "券商授信倍數維持原標準", "full": "金管會澄清暫不打算放寬券商授信倍數，強調目前市場整體使用狀況距離上限仍有極大空間，風險在可控範圍內。金融監理機關期盼在維持市場流動性的同時，維持金融結構的總體穩定。", "think": "金融管制的穩定性有助於防止過度槓桿與市場泡沫。一般投資人在參與股市行情時，也應控制好個人的財務槓桿，維持安全的資產配置。", "question": "在股市熱絡時，你是否曾因過度融資或放大槓桿而感到心理壓力？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608270335.aspx", "name": "中央社"}]}], "robotics": [{"title": "Hugging Face推出售價399美元Microduck機器人", "teaser": "平價AI機器人搶攻普及市場", "full": "知名AI開源平台Hugging Face推出了售價僅399美元的Microduck機器人，主打搭載人工智慧功能與平價體驗。該產品大幅降低了開發者與消費者體驗AI硬體的門檻，帶動微型機器人普及浪潮。", "think": "幾百美元就能買到具備AI能力的機器人，說明AI硬體普及化正在加速發生。這不僅是技術落地，也預示著AI硬體進入消費級應用的趨勢已近在眼前。", "question": "如果居家生活或工作環境中出現平價AI機器人，你最希望它幫你解決什麼瑣事？", "sources": [{"url": "https://news.google.com/rss/articles/CBMid0FVX3lxTFBDNDNRdkNiUThiOGNpZFNzclI4TjlBcUs2Q1o3a1Jud1NsM2FBREdNREZ4NjNOZ05TWUdDOTZNcW80XzVuMVRSUTBEbmFPTDVlMGpkTjlXOG1VakJkeHJvaW04REJ3WjI4aWFpeUVYZVhRX1dkMHNB?oc=5", "name": "Investing.com 香港 - 股市報價& 財經新聞"}]}, {"title": "Generalist估值衝上30億美元 機器人AI商用化受矚目", "teaser": "機器人新星估值衝破百億", "full": "新創公司Generalist估值達到30億美元，引發業界對於機器人AI能否順利從展示階段跨入商業應用的熱烈討論。市場正密切觀察通用機器人在工業與服務場景的真實落地速度與獲利能力。", "think": "天價估值代表資本市場對通用機器人前景的高度期待。但從技術展示到大規模商業落地仍面臨成本與穩定性考驗，投資時需關注其軟硬體整合能力。", "question": "你認為具備AI的大型機器人，最快會在幾年內普及於我們日常生活場景中？", "sources": [{"url": "https://news.google.com/rss/articles/CBMihgFBVV95cUxNSV9OTDdqT19fMDgxUmZBQkxWVmZpUGtsWnVaTGlueXRHdWlEeVZVenFNcWV4Z19sbmFFNVA4QVIxUy0wYjR6NENuZHAzYU9zSWFMcmNzVFF2Y1BuTnl3SmhidDZQLWdEc1NXM0t6dVA1QVg3elA2OXBZSTdxbzJtaWRXQVZOdw?oc=5", "name": "CMoney投資網誌"}]}, {"title": "德語媒體看中國機器人發展 呼籲留意熱潮下的實質進展", "teaser": "留意機器人秀場外的真實力", "full": "德語媒體撰文分析中國人形機器人產業現況，提醒市場注意技術展示背後的真實力。產業更應審慎檢視核心零組件自主性與實際生產價值，避免過度沉迷於行銷宣傳所打造的光環。", "think": "面對各國科技巨頭陸續展示機器人成果，我們應培養獨立思考能力。看清技術突破與宣傳噱頭的界線，才能在投資科技股時做出更明智的判斷。", "question": "在評估一家科技新創時，你會看重其宣傳演示影片還是實際客戶訂單與營收？", "sources": [{"url" <script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {

  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +

    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
