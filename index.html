  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

<script type="application/json" id="slot-1300">{"date": "11月27日．週五", "tldr": "台股午盤表現強勁，加權指數隨美股科技股持續衝高。主計總處看好AI動能帶動明年出口創新高，第一金與中鋼等大廠亦釋出營運利多，整體市場樂觀情緒充沛。", "indicators": {"note": "這組午盤指標展現台股與美股科技板塊強烈共振，加權指數跟隨美股氣勢大幅上揚，呈現強勢多頭格局。", "tiles": [{"label": "台股加權指數", "value": "39,308.08", "valueClass": "rise", "delta": "+2.91%", "deltaClass": "rise"}, {"label": "那斯達克", "value": "23,802.30", "valueClass": "rise", "delta": "+0.92%", "deltaClass": "rise"}, {"label": "費半指數", "value": "8,874.37", "valueClass": "rise", "delta": "+1.13%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "347.13", "valueClass": "rise", "delta": "+1.45%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "第一金目標股利配發率超六成 評估證券壽險子公司增資", "teaser": "第一金股利配發率上看六成", "full": "金融股投資人迎來好消息！第一金控表示未來股利配發率目標將維持在六成以上，並將積極評估旗下證券與壽險子公司的增資需求。此舉旨在提升金控整體的資本結構與業務競爭力，為長期獲利提供穩健支撐。", "think": "金融股向來是上班族存股的首選標的。第一金明確點出高配發率政策，能提供極佳的收益預期，適合追求穩健現金流的投資人做長期資產配置參考。", "question": "在挑選存股標的時，你更看重高殖利率還是公司的增資擴張潛力？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611270255.aspx", "name": "中央社"}]}, {"title": "中鋼自結前10月稅前淨利49.13億元 較去年同期轉虧為盈", "teaser": "鋼鐵龍頭中鋼前十月轉虧為盈", "full": "傳統產業迎來營運曙光，中鋼公布最新自結財務數據，前10月稅前淨利達到49.13億元，與去年同期相比成功扭轉虧損狀態。主要受益於全球鋼鐵市場秩序逐步改善及成本優化效益顯現，展現極佳的營運韌性。", "think": "中鋼轉盈代表傳統製造業週期性谷底已過。對於關注景氣循環股的投資人來說，傳產基礎建設與鋼鐵需求的回升，是盤勢結構轉趨健康的重要指標。", "question": "景氣循環股谷底翻揚時，你會選擇右側交易佈局還是觀望？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611270245.aspx", "name": "中央社"}]}, {"title": "星宇航空決議辦理現增發行3億股 主要用於償還銀行借款", "teaser": "星宇現增三億股償還銀行借款", "full": "星宇航空董事會決議辦理現金增資發行3億股，籌措資金主要用於償還銀行借款以優化財務結構。隨著航網擴充與客運需求熱絡，公司希望透過充實資本減輕利息負擔，為未來營運擴張提供更充裕的財務空間。", "think": "企業辦理現增雖可能短期稀釋每股盈餘，但用於還債能有效降低槓桿風險。投資航空股時，除了看好復甦商機，也要持續追蹤營運資金的流動性表現。", "question": "面對企業現增籌資，你會關注短期股價波動還是長期財務健康？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611270243.aspx", "name": "中央社"}]}, {"title": "路透：川普關稅政策施壓各國 意圖重塑全球貿易秩序", "teaser": "川普新關稅政策引發全球關注", "full": "外媒報導指出，川普團隊研擬的新一波關稅政策將圍繞全球供應鏈展開，意圖藉由高關稅施壓國際夥伴並針對特定競爭國家。此舉預計將對跨國供應鏈與電子出口重鎮造成影響，重塑 global 貿易遊戲規則。", "think": "地緣政治與貿易壁壘是當前投資的最大變數。對台灣出口導向的電子科技業而言，產地佈局與供應鏈彈性將決定未來能否在關稅戰中保持競爭力。", "question": "全球供應鏈重組下，你持有的標的具備足夠的海外產能彈性嗎？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202611270242.aspx", "name": "中央社"}]}, {"title": "主計總處預估明年經濟成長6.51% 稱AI發展腳步不停歇", "teaser": "明年經濟成長看好達六點五一", "full": "政府官方釋出極度樂觀的宏觀經濟預測！主計總處估計明年台灣經濟成長率將達6.51%，關鍵動能來自全球對AI相關硬體與半導體強勁且持續的訂單需求。官方強調AI浪潮並非一時榮景，成長腳步仍將無虞延伸。", "think": "官方上修經濟展望給予台股有力的基本面支撐。對上班族而言，整體經濟景氣向上代表就業與投資環境相對安全，科技與AI產業依然是主要領頭羊。", "question": "當總體經濟數據亮眼時，你的投資策略會趨向積極還是謹慎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611270234.aspx", "name": "中央社"}]}], "robotics": [{"title": "警惕！「我不是機器人」驗證竟遭資安詐騙利用", "teaser": "防範機器人驗證的新型資安詐騙", "full": "資安專家警告，常出現在網頁上的「我不是機器人」CAPTCHA驗證框，已成為詐騙集團的新型防線漏洞。駭客誘導用戶按下特定鍵盤快捷鍵，進而下戴惡意木馬程式，導致個資與個人帳號面臨極高資安風險。", "think": "日常生活中看似安全的驗證機制也可能被駭客利用。這提醒上班族在瀏覽網站時要保持警覺，切勿隨意依照提示輸入不熟悉的命令或下載檔案。", "question": "上網遇到要求輸入鍵盤快捷鍵的驗證時，你有足夠的警覺心嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1MeDI1NFNCdDJNbkxnZ0NGZFFxVTNEenlJMHVNdHhIbXNXZ0xmWkcwMjhhT3NhS3Nnc25kR2NWQXhWUS1KOGc2ckRucEc0RFMwcTdPZjFR?oc=5", "name": "Mombaby 媽媽寶寶懷孕生活網"}]}, {"title": "特斯拉傳擬收購德國機牀廠EMAG 納入Optimus供應鏈", "teaser": "特斯拉傳收購機牀廠布局機器人", "full": "外媒報導特斯拉正計劃併購德國精密機牀大廠EMAG，主要意圖在於強化其人形機器人Optimus的關鍵零件製造能力。透過垂直整合高精度加工設備，特斯拉希望進一步降低Optimus的生產成本並加速量產時程。", "think": "電動車龍頭強勢佈局機器人供應鏈，意味著量產階段正逐步逼近。機器人從概念邁向大規模製造，將大幅帶動精密機械與自動化零組件廠的長期商機。", "question": "你認為機器人供應鏈的關鍵壁壘是在硬體製造還是軟體演算法？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTE1NSkxpMW50MEQwaGdaOWpkR09VdFdUeEhRNEk2aTh3YUJxTWgwa2FWa1dqUjMwR3I2czBaY1dOUTd6Ym93WWc1YWYtcjVTMzhiWHpsajM4MG1Mb1BXZ1hoZ0hOVEVBOEUwTXc?oc=5", "name": "TradingView"}]}, {"title": "和勝股份表態機器人領域為公司持續關注與拓展方向", "teaser": "和勝股份聚焦機器人領域發展", "full": "上市公司和勝股份在投資者互動平台表示，機器人與自動化應用是公司重點聚焦的戰略方向之一。公司積極投入相關輕量化材料與結構件的研發，希望搶攻未來工業與服務型機器人設備大規模普及的市場紅利。", "think": "越來越多傳統零組件廠商轉型搶進機器人概念，展現出強烈的跨領域野心。投資人可觀察企業是否真正具有訂單轉化能力，避免流於題材炒作。", "question": "挑選轉型機器人概念的企業時，你如何評估其真正落地接單的能力？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTE9qMUlKZzc4WlNyd0FJSWNwTGNCU2RNZDVFLXA5QUg2MUxrbkUtUDkzV29VSzFSTG1NTjU3MlY4alNheHFuYmJzb1NTQmlSb2o3ZnYza3dFekhLRlJnVVJWS0VqWkZSMjFabWc?oc=5", "name": "TradingView"}]}, {"title": "DEEP Robotics在牛場部署輪腿機器人進行自動化監測", "teaser": "輪腿機器人進入農牧業自動監測", "full": "DEEP Robotics 旗下新一代輪腿機器人 LYNX M20 成功部署於大型牛場，實現巡檢與環境監測自動化。該機器人具備優異的越野動態平衡與強大地貌適應力，能克服複雜環境順利完成日常農畜管理任務。", "think": "機器人的應用場景已從無塵室與工廠擴展至農牧等非標準化環境。這證明具備高移動能力與環境感知能力的機器人，正實質落地解決特殊產業勞動力不足的問題。", "question": "除了製造業與農牧業，你覺得還有哪些場景迫切需要機器人替代？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiWEFVX3lxTE12Ry05Q3R1bDR6TlRaQXpnNVRLeXc5UjJVX1RfUlpOSkN6eEhENzRDXzJveXUwU21Bdl9HMFZZZ3MtelR4Mnk0dWgyVzVNOEdqdTFkLWprQXQ?oc=5", "name": "Techritual"}]}, {"title": "馬斯克預測Optimus機器人18個月內能處理日常家務", "teaser": "馬斯克指Optimus將進入家庭", "full": "馬斯克再次對人形機器人發出前瞻預測，宣稱Optimus能在18個月內實現洗碗與倒垃圾等複雜家用家務。他甚至樂觀預期未來每個家庭可能擁有兩台機器人，市場總規模將遠遠超越現有的汽車產業市場。", "think": "雖然馬斯克的時程預測往往相當激進，但這畫出了家用機器人的巨大願景。如果機器人真的打入家庭消費市場，將帶來數兆美元級別的全新生態系。", "question": "如果一台能處理全套家務的機器人上市，你願意花多少預算購買？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiekFVX3lxTFBrYXdSMWxKc0txOE4yems5MjhfMk5vejczY3dFeXpUdmdSZ2tyejZ3aEJPazROV2FnS21SWUdkNWl3MkJrMGlXRWZfV19qeXBKVEtNSWZaend4MlFjS0hjbl9DSEFjYXpoY3pwb3FGQmwxc19wbnJVVDhB?oc=5", "name": "BigGo 財經"}]}], "tech": [{"title": "AI需求強勁 估明年台灣出口突破1兆美元創新高", "teaser": "AI推升明年出口突破一兆美元", "full": "全球AI算力基礎建設爆發，主計總處預估明年台灣出口總額將歷史性突破1兆美元大關。受惠於高階晶片與伺服器伺候封裝需求供不應求，台灣電子零組件出口表現將持續獨步全球，寫下全新歷史紀錄。", "think": "出口金額破兆代表台灣在全球AI產業鏈佔據不可或缺的頂點。這對科技股獲利提供扎實支撐，長線持有台灣核心科技龍頭股的邏輯依然極為穩固。", "question": "面對 AI 帶動的兆元出口榮景，你的投資組合中科技股佔比是多少？", "sources": [{"url": "https://finance.technews.tw/2026/11/27/ai-supply-shortage-dgbass-forecasts-next-year-exports-1-trillion-record-high/", "name": "科技新報"}]}, {"title": "矽品接手友達華亞廠 197億元大交易案正式拍板", "teaser": "矽品百億接手友達廠房擴產", "full": "面板大廠友達光電出售華亞廠區案塵埃落定，最終由封測大廠矽品以197億元接手。廣達退出後矽品迅速出價拍板，顯現出封測龍頭為滿足後段先進封裝與高階晶片產能，展現出極強烈的擴廠擴產決心。", "think": "晶圓代工與先進封裝產能極度緊繃，封測廠大手筆買廠房代表下游需求極為強勁。面板廠資產活化取得現金，封測廠獲得產能，達成產業結構優化的雙贏局勢。", "     '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
