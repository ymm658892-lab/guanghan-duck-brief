  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

出外資在國際利空下的無差別調節，雖然心理衝擊極大，但對於長期投資人而言，這是檢視優質企業基本面是否改變的關鍵時刻。", "question": "當核心權值股遭遇極端賣壓時，你認為這是危機入市的機會還是風險擴大的訊號？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611060037.aspx", "name": "中央社"}]}, {"title": "日股日經指數重挫逾5%　美股科技股暴跌引發市場震盪", "teaser": "美股科技崩跌連動亞股災情", "full": "受美國科技股前一日全面暴跌的悲觀情緒牽連，日本日經指數在今日早盤也重挫超過5%。美股的劇烈震盪透過全球化供應鏈與資金管道，迅速傳導至亞洲各大主要資本市場。", "think": "全球化時代讓金融市場的連動性達到前所未見的高度，美國科技股稍有風吹草動，亞股就首當其衝。這提醒我們資產配置不能只侷限於單一國家或單一產業。", "question": "這次的跨國骨牌效應，是否讓你重新思考資產配置的地域分散性？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611060033.aspx", "name": "中央社"}]}], "robotics": [{"title": "全球首創 中國仿生機器人「新言、新語」報新聞 張藝謀參與設計", "teaser": "名人跨界打造仿生機器人主播", "full": "中國近期推出號稱全球首創的仿生機器人主播「新言」與「新語」，負責進行新聞播報工作。此項產品特別邀請了知名導演張藝謀參與外觀與視覺呈現的設計，展現出高度逼真的外表與跨界合作的創新嘗試。", "think": "當機器人開始具備幾可亂真的外表並涉足媒體播報，傳統內容產業的邊界正在模糊。這不僅是技術的突破，也是大眾對AI接受度的一大考驗。", "question": "如果有一天新聞主播完全由幾可亂真的機器人取代，你還會信任新聞內容嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiYkFVX3lxTE9VOHpCQTY5RUREV25uT3JDV3ptemxScEdFcHdvczlKMU5Ea0ZsT29NVzg0VHlpYUF2ZkY2cVVxelRRTW9DTUZPM0Z0bUZWV0RaaEVTSlBtbG44Q0lTY0tWQTNB0gFnQVVfeXFMUFI4VWszX19XcGZoaUlpX21LVWJVMnpuY05udzNoWmxRTldZTGZHNjJJeldNV1RGS0VyYW5TVFZ1ZzJlNEg1WVpqZEFGajdaeXU0OHQzUXB3NzJ5ekNsLUQ2bklDRGxLTQ?oc=5", "name": "世界新聞網"}]}, {"title": "【不做機器人的機器人公司】新創 Destro 用 AI 智慧層協調人機作業，解決倉儲轉運自動化難題", "teaser": "以AI軟體層優化倉儲物流", "full": "新創公司 Destro 採取不親自製造硬體機器人的獨特策略，轉而開發專屬的 AI 智慧協調層軟體。此技術主要用來優化人工作業與自動化設備之間的協作流程，有效解決目前倉儲與物流轉運中心面臨的自動化瓶頸。", "think": "在硬體競爭激烈的機器人紅海中，提供軟體大腦與系統整合往往能切中客戶痛點。對於軟體開發者或企業來說，提升人機協作效率比單純追求硬體更具商業價值。", "question": "你認為在未來的自動化浪潮中，『軟體大腦』的價值是否會高於『硬體軀殼』？", "sources": [{"url": "https://news.google.com/rss/articles/CBMieEFVX3lxTFBsRzRQcXdVbnR4SFZvRmJzZXJrUndTY1RRZUVjTm9zUTBVa0JHQm9ueGhKSWVpODZLaW9JbThOOGE5NmpnRnJ6MlZRdXZwdERDZWtrQUZiOURNVnNpRk15dDFEemNmTXZtZ1dhYWMxczQtMU1mV0s2Tg?oc=5", "name": "TechOrange 科技報橘"}]}, {"title": "鴻海、輝達力挺！美首檔人形機器人股 Agility Robotics 登陸那斯達克", "teaser": "人形機器人新星正式登陸美股", "full": "獲得科技巨頭鴻海與輝達等重量級企業大力支持的美商人形機器人公司 Agility Robotics，近期正式宣佈登陸那 r-workload-but-they-dont-come-cheap/", "name": "科技新報"}]}, {"title": "METR 報告：Anthropic 模型進化速度翻倍，寫程式已非人類瓶頸", "teaser": "AI寫程式能力進化速度翻倍", "full": "根據評估機構 METR 的最新報告指出，AI模型巨頭 Anthropic 旗下模型的整體進化速度呈現翻倍成長趨勢。在軟體編碼與基礎寫程式的任務上，AI展現的效率與能力已逐漸不再是人類開發者的主要瓶頸。", "think": "程式撰寫門檻的降低意味著軟體開發的民主化，但也對初階工程師帶來轉型壓力。未來職場的核心競爭力將從『寫得出程式』轉為『知道該解決什麼問題』。", "question": "當AI寫程式不再是瓶頸，你覺得軟體工程師的核心價值未來會轉移到哪裡？", "sources": [{"url": "https://technews.tw/2026/11/06/independent-assessment-of-ai-rd-acceleration-at-anthropic-in-october-2026/", "name": "科技新報"}]}, {"title": "蘋果拿下全球手機市場一半營收，第三季市占創新高", "teaser": "蘋果囊括全球智慧機半數營收", "full": "市場研究數據顯示，蘋果公司在今年第三季再度展現強大的獲利統治力，單季市占率創下新高，並成功囊括了全球智慧型手機市場高達一半的總營收，凸顯其在高端市場的定價權與消費者黏著度。", "think": "在整體消費電子市場成長趨緩的環境下，蘋果依然能奪走大半利潤，證明了品牌溢價與生態系的重要性。這對其他競品而言是難以跨越的高牆。", "question": "是什麼原因讓你願意持續購買單價較高的蘋果產品？", "sources": [{"url": "https://finance.technews.tw/2026/11/06/apple-captures-50-of-global-smartphone-revenue-in-q3/", "name": "科技新報"}]}, {"title": "輝達釋出多款免費 AI 模型與工具，助攻企業與科學研究", "teaser": "輝達釋出免費模型擴大生態系", "full": "晶片大廠輝達近期宣佈向市場釋出多款免費的人工智慧模型與開發工具，旨在降低企業客戶與學術科學研究機構導入AI的門檻。此舉有助於加速各領域的技術應用落地，並進一步鞏固其龐大的硬體與軟體生態系護城河。", "think": "免費釋出軟體工具看似犧牲授權收入，實則是為了讓更多開發者黏著在自家硬體生態上。這種『賣鏟子順便送地圖』的策略是科技巨頭鞏固霸權的高招。", "question": "科技大廠免費提供AI模型背後，你認為他們最大的獲利算盤是什麼？", "sources": [{"url": "https://technews.tw/2026/11/06/nvidia-open-models-help-developers-accelerate-science-and-engineering/", "name": "科技新報"}]}, {"title": "資安需求旺  Cloudflare 財報優+上修財測  盤後飆", "teaser": "資安需求強勁推動財報亮眼", "full": "受惠於全球企業對網路安全與雲端防護的需求持續暢旺，雲端服務與資安大廠 Cloudflare 公布了優於市場預期的財務報告，同時向上修正未來全年的營運財測，消息一出帶動其盤後股價強勢飆漲。", "think": "在數位化與AI攻擊手法日益猖獗的時代，企業對於資安的預算往往是『不得不花』的剛需。這類防禦型科技股在整體市場動盪時，常展現出較佳的抗震能力。", "question": "面對日益複雜的網路威脅，你任職的企業是否有足夠的資安防護意識？", "sources": [{"url": "https://finance.technews.tw/2026/11/06/cloudflare-beats-earnings-and-raises-guidance-shares-surge-after-hours/", "name": "科技新報"}]}]}}</script>

    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
