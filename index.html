  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

耗材廠的長線受惠趨勢。投資人選股視野可從晶圓代工擴及周邊封測供應鏈。", "question": "在台積電產能滿載的背景下，封測外包鏈是否有機會迎來更高的估值修復？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611260085.aspx", "name": "中央社"}]}, {"title": "美國301關稅利空淡化 台股盤中勁揚逾1200點", "teaser": "關稅利空出盡台股大反彈", "full": "受美方關稅政策未進一步惡化激勵，壓抑多時的市場情緒迎來報復性買盤，台股盤中一度強彈逾千點。權值股全面回穩，顯示法人資金在利空鈍化後迅速回補基本面穩健的科技與權值標的。", "think": "股市最怕未知，一旦壞消息塵埃落定，市場常以利空出盡反彈反應。通勤族面對劇烈震盪切忌追高殺低，應以營收能見度高的產業為依歸。", "question": "面對千點等級的單日巨幅震盪，你的持股配置是否具備足夠的抗震韌性？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611260058.aspx", "name": "中央社"}]}], "robotics": [{"title": "AI 算力走向邊緣端！法人看好2027工業電腦、機器人商機", "teaser": "邊緣AI引爆機器人長線商機", "full": "隨著運算晶片功耗優化，AI技術正從雲端快速下沉至終端設備。法人看好邊緣運算賦能工業電腦與自主移動機器人，預期在智慧製造升級潮驅動下，相關產業將在2027年迎來爆發性成長期。", "think": "機器人若缺乏強大邊緣算力，就無法實現低延遲現場決策。工業電腦廠商憑藉硬體客製與散熱整合優勢，正轉型為機器人核心大腦供應商。", "question": "隨著算力走入邊緣，傳統製造業產線轉型會為哪些硬體台廠帶來最大爆發力？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiTEFVX3lxTE9TZUhnNzlMcmZ5OVYxMHRrN3FEd1g0STEwRUZ4TDhxVmlicGZyZ2hLZlp2YThRbVFTV1B1RG52OEF6eEk2OEc1MWV4bWw?oc=5", "name": "聚財網"}]}, {"title": "台南工廠大火燒逾17小時 消防出動救災機器人馳援", "teaser": "救災機器人挺進火場立功", "full": "台南後壁橡塑膠廠發生大規模火警，消防單位調派救災機器人深入高溫且濃煙密布的危險火場核心進行滅火降溫，成功防範化學物質二次爆炸，不僅保障一線打火弟兄安全，也展示特種機器人的實戰價值。", "think": "特種救災機器人已跨越概念驗證，實質取代人類進入高危險環境。這類剛性需求不受景氣波動影響，將驅動政府與公用事業加速採購智慧裝備。", "question": "除了工廠巡檢與救災，高危險工種全面機器人化還會在哪些場景率先普及？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiTEFVX3lxTE9tVWpOcXRsV3lCVXZMZDZBWWFjb214M250NWZoTGI1ZHBheUUzajBUSENNOUo0UmZBX1dKc0VfVmNSdlQ2cWF5M3JaY2s?oc=5", "name": "樂上新聞網"}]}, {"title": "繼峯股份子公司機器人走進真實車間 兩場景試運行成功率100%", "teaser": "車間機器人運行成功率滿分", "full": "汽車零組件大廠繼峯股份旗下機器人產品正式進入實際生產車間，在兩項高難度製程場景中達成試運行成功率100%的亮眼成績。這驗證了機器人在高速且高精度的現代化工廠中，已具備商業化落地可行性。", "think": "機器人最難的門檻是從實驗室進入良率至上的製造現場。滿分試運行代表軟硬體調校已達工業級標準，智慧工廠全面自動化進程正超預期加速。", "question": "當產線機器人達到百分之百可靠度，製造業人均產值與人事成本將面臨怎樣的重構？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTFB4bUE2c2pqZDI0UENvT3pzS0pHRmpxaTRxbTlJVDVvWFRTNmhEUENGRDYwaTRoNGRNQlVHUkU2Y2k3eUhIbEZWOWQzWnM5U2x4aTBRNzlUOVkwaUFDcnlzY1plWkllcXpGdXc?oc=5", "name": "TradingView"}]}, {"title": "近30家機器人公司倒下：千億融資，救不了不會賺錢的企業", "teaser": "燒錢退潮機器人爆淘汰賽", "full": "近期統計顯示近30家機器人新創相繼停業或破產，儘管先前吸納大量創投資金，但因缺乏清晰的商業變現模式與量產毛利支撐，最終在資本寒冬中退場，突顯產業正從狂熱投機步入殘酷洗牌階段。", "think": "科技創新終究要回歸商業本質，能解決客戶痛點並賺取自由現金流的公司才能活下來。投資機器人概念股務必檢視訂單真實度與營收兌現能力。", "question": "在機器人產業淘汰賽中，你挑選標的是看重炫目的技術發布，還是實質毛利？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiSEFVX3lxTE4teXF2NnEwcWlkNmo4YW81VTBIYm5ia0wzZ21aUTFPdG1TM2dzb2JYS2JYOHVJYV9lVFFEQnd2QlhFaEs4NDdsVA?oc=5", "name": "鉅亨號"}]}, {"title": "AI機器人需求升溫 工業電腦業者由AI運算向軟硬體整合布局", "teaser": "IPC廠搶攻機器人軟硬整合", "full": "面對具身智能商機，台灣工業電腦（IPC）業者紛紛突破純硬體製造思維，向上延伸布局運動控制演算法與邊緣視覺感知軟體，透過提供高毛利的軟硬一體解決方案，全力爭取全球自動化系統整合訂單。", "think": "純硬體代工毛利容易受壓，軟硬整合是台廠跳脫價格戰的唯一路徑。能夠提供開箱即用方案的系統供應商，在機器人供應鏈中將享有更高話語權。", "question": "台灣IPC業者轉向軟硬體整合，能否在跨國自動化巨頭夾擊下建立獨特優勢？", "sources": [{"url": "https://news.google.com/rss/articles/CBMijgFBVV95cUxOVzdfeDZVeklQcU4tNGhaS051bU4wUFVNUDFyMElsYTcxYUQ5cmJLdW5CcFJSTFdITHk0TjhvNFBIWVNuaU0waC1wWU1xWEhYYUY1R3FHQjlWbTJGU0xSOW9JZGZqWjkxQU5NRGRNdlRDMUpDeHdJanpZTGZfT2x4RU5NYlVzWTdHRmRuNnJB?oc=5", "name": "DIGITIMES"}]}], "tech": [{"title": "突破美國封鎖！華為開發「韜 EDA」，中國產設計工具鏈首度整合", "teaser": "華為整合國產EDA突圍", "full": "華為發表自主研發的「韜 EDA」工具鏈，首度完成晶片設計全流程的國產軟體整合，試圖突破美方在先進EDA軟體上的出口管制。此進展顯示中國半導體產業正加速構建去美化的本土工具生態系。", "think": "EDA是晶片之母，也是美方封鎖關鍵樞紐。華為工具鏈整合雖具象徵意義，但實際良率與先進製程支援仍待驗證，全球半導體陣營分化將更形明顯。", "question": "當中國建立自有EDA工具鏈，全球半導體供應鏈的割裂會如何影響跨國晶片巨頭？", "sources": [{"url": "https://technews.tw/2026/11/26/huawei-phlexing-technology-tau-eda-tools/", "name": "科技新報"}]}, {"title": "確診前大腦就有跡象！史丹佛醫學院用 AI 找出 ADHD 與焦慮症三種腦型", "teaser": "AI辨識腦型早期揪心理病", "full": "史丹佛大學醫學院利用深度學習分析腦影像，成功在臨床症狀確診前辨識出ADHD與焦慮症的三種客觀腦型。這項突破有助於精神醫學擺脫主觀量表診斷，推動個人化精準早期醫療介入。", "think": "AI與神經科學結合正重塑預防醫學。客觀的生理標記不僅能降低誤診率，也能催生龐大的心理健康數位療法與早期篩檢商機，造福高壓現代人。", "question": "若客觀腦造影AI診斷普及，會如何改變現代職場對員工心理健康的評估與支持？", "sources": [{"url": "https://technews.tw/2026/11/26/httpsmed-stanford-edunewsall-news202611adhd-biotypes-html/", "name": "科技新報"}]}, {"title": "陶哲軒疾呼轉向「數學 2.0」：人類應改為詮釋 AI 證明而非盲目解題", "teaser": "陶哲軒倡導數學2.0新典範", "full": "當代數學大師陶哲軒公開呼籲學界邁向「數學 2.0」時代，直言盲目追求純手工解題已不合時宜。他認為未來數學家的核心職責應轉向指導AI生成形式化證明，並由人類專注於詮釋邏輯架構與發掘新概念。", "think": "頂尖智力領域正重新定義人機協作。當AI成為頂尖的運算與證明執行者，人類的價值將聚焦於「問出好問題」與「洞察背後哲理」，職場亦是如此。", "question": "當AI的解題能力超越人類，你在工作中最重要的核心競爭力會是什麼？", "sources": [{"url": "https://technews.tw/2026/11/26/terence-tao-on-ais-impact-on-mathematics/", "name": "科技新報"}]}, {"title": "Nothing 新款 AI 耳機 Ear (note) 亮相，整合錄音、轉錄與生成摘要", "teaser": "AI耳機實現錄音即摘要", "full": "新創科技品牌Nothing推出新款智慧耳機Ear (note)，主打深度整合邊緣語音模型，可在通話或會議時同步進行即時錄音、多語言轉錄與重點摘要生成，展現生成式AI走入穿戴裝置的實用落地範例。", "think": "消費電子產品正掀起AI化換機潮。耳機不再只是發聲配件，更化身隨身數位助理，實用且高頻的生活應用將是推動大眾為AI硬體買單的關鍵催化劑。", "question": "隨身穿戴裝置整合生成摘要功能，會徹底改變上班族的會議與筆記習慣嗎？", "sources": [{"url": "https://ccc.technews.tw/2026/11/26/nothing-offers-a-full-look-at-its-ai-earbuds-and-charging-case/", "name": "科技新報"}]}, {"title": "華為成立半導體與 AI 專利團隊，劍指輝達全球霸主地位", "teaser": "華為布局AI專利叫板輝達", "full": "華為近期大動作擴編半導體架構與AI演算法專利團隊，旨在鞏固昇騰系列運算晶片的智財權壁壘，全面對標輝達在加速運算領域的技術版圖，顯示其在算力晶片領域爭奪市場話語權的強烈企圖心。", "think": "算力爭霸已從單純製程競爭擴大到專利防禦與軟體生態圍樁。華為強化智財布局意在封阻外來訴訟，並加速在封閉本土市場中取代輝達算力方案。", "question": "專利戰成為算力競爭新常態下，輝達的CUDA軟體護城河是否面臨實質威脅？", "sources": [{"url": "https://technews.tw/2026/11/26/huawei-forms-patent-teams-for-chips-and-ai-eyeing-ecosystem-to-rival-nvidia/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-1300">{"date": "11月26日．週四", "tldr": "台股今日震盪走弱，受壽險業虧損與地緣關稅風險夾擊，市場避險情緒升溫，建議投資人盤中保持冷靜，謹慎檢視持股部位並留意科技產業鏈的潛在變動。", "indicators": {"note": "今日台股領跌，主要指數與美股科技板塊同步走軟，反映全球半導體供應鏈受關稅與管制不確定性影響，市場正處於獲利了結與風險趨避的修正階段。", "tiles": [{"label": "台股加權指數", "value": "39,151.81", "valueClass": "fall", "delta": "-2.42%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "23,585.80", "valueClass": "fall", "delta": "-0.62%", "deltaClass": "fall"}, {"label": "費半指數", "value": "8,774.86", "valueClass": "fall", "delta": "-0.65%", "deltaClass": "fall"}, {"label": "台積電ADR", "value": "342.34", "valueClass": "fall", "delta": "-1.96%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "台股單月跌逾5%拖累，壽險業10月稅前虧損112億", "teaser": "台股震盪劇烈，壽險業單月慘虧百億", "full": "受到10月份台股顯著回檔超過5%的影響，壽險業獲利表現承壓，單月稅前虧損達到112億元。這顯示金融業的獲利與台股大盤連動性極高，當市場波動加劇時，壽險公司的投資收益容易受到直接衝擊。", "think": "壽險業是台股的大型機構投資人，他們的虧損往往反映了市場整體的修正壓力。這提醒我們，當金融股受到大盤波動干擾時，投資人應重新評估資產組合的防禦力。", "question": "在台股高檔震盪時，你的投資組合是否具備足夠的抗跌配置？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611260300.aspx", "name": "中央社"}]}, {"title": "美擬對馬來西亞課最高18%關稅，學者估半導體投資影響有限", "teaser": "美關稅大棒揮向大馬，半導體影響評估", "full": "針對美國計畫對馬來西亞出口產品課徵最高18%關稅的消息，市場高度關注對半導體封測重鎮的影響。目前學者初步評估，由於全球供應鏈結構複雜，對於半導體產業的實際投資與生產成本衝擊應在可控範圍內。", "think": "地緣政治風險已成為半導體產業的日常，關稅變動雖是短期雜音，但長期仍考驗企業分散生產基地的能力，投資人需關注企業供應鏈多元化的進度。", "question": "面對頻繁的關稅政策，你對科技股的長期持有信心是否動搖？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202611260290.aspx", "name": "中央社"}]}, {"title": "主動統一台股增長ETF爆1.03億元違約交割", "teaser": "台股ETF驚傳違約，投機氣氛敲警鐘", "full": "近期傳出有投資人透過主動式台股ETF操作失利，導致高達1.03億元的違約交割事件。這凸顯了在台股震盪加劇的環境下，槓桿操作或過度投機的風險正快速攀升，市場違約風險值得警惕。", "think": "違約交割往往是市場過熱後的冷卻訊號，提醒散戶在震盪行情中應量力而為，切勿過度使用槓桿，以免在市場修正時面臨巨大的流動性危機。", "question": "在震盪行情中，你是否設定了明確的風險停損機制？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611260276.aspx", "name": "中央社"}]}, {"title": "越南印度被美課高關稅恐衝擊蘋果鏈，分析師：台廠隱形成本更難扛", "teaser": "美關稅延燒東南亞，台廠隱形成本高", "full": "美國對越南與印度等地的關稅政策調整，可能間接衝擊蘋果供應鏈的成本結構。分析師指出，除了顯性的關稅增加，台廠在海外生產的隱形成本，如物流與營運效率調整，將成為未來獲利的一大挑戰。", "think": "供應鏈遷移並非萬靈丹，地緣政治成本是台廠必須面對的長期課題。投資人應關注那些具備強大議價能力與供應鏈彈性的龍頭企業，而非僅看重生產基地的分散。", "question": "你持有的電子股，是否具備應對國際貿易壁壘的轉嫁能力？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611260275.aspx", "name": "中央社"}]}, {"title": "美時簽口服學名藥供貨協議，於美韓市場獲獨家授權", "teaser": "美時獲獨家權利，深耕美韓學名藥市場", "full": "美時藥廠正式簽署口服學名藥供貨協議，成功取得美國與韓國市場的獨家授權。這項合作將有助於美時擴大國際市佔率，並穩定未來的營收成長來源，強化其在學名藥領域的市場競爭地位。", "think": "生技醫療產業表現通常與總體經濟相關度較低，在台股大盤震盪時，這類具備獨家授權題材的個股，反而可能成為投資人尋求資金避風港的選擇。", "question": "在波動市中，你是否會考慮增加醫療保健類股的配置？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611260273.aspx", "name": "中央社"}]}], "robotics": [{"title": "宇樹科技王興興：中國機器人5至10年內，產量有望超越汽車", "teaser": "機器人產業爆發，未來產量將超越汽車", "full": "宇樹科技執行長王興興預測，未來5至10年內，機器人產業的產量規模有望超越汽車業。隨著具身智能技術的突破，機器人將從工業應用走向更廣泛的商業與消費場景，重塑製造業的未來格局。", "think": "機器人產業正處於從「製造」到「量產」的關鍵轉折點。對於上班族而言，這不僅是投資機會，也預示著未來職場自動化程度將大幅提高，需提前布局相關職能。", "question": "面對機器人即將普及的時代，你的職場技能是否足夠具有不可取代性？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTE9YVnhnU0FkTFlJQU9vdHZ5ZHQ1ZnNROTV0bnFFdVFoVXFKdUdTUXYyNFg0eG5TclNjM3ByUTFyMFNhZHBzMDNUUjlaWEtFdw?oc=5", "name": "風傳媒"}]}, {"title": "可租賃、可報銷，北京打造全場景手術機器人產品矩陣", "teaser": "醫療機器人新模式，租賃報銷更普及", "full": "北京積極推動手術機器人應用，透過租賃與報銷機制，降低醫療院所的導入門檻。這一產品矩陣的建立，不僅提升了醫療服務的精準度，也讓高科技醫療設備更易於普及至不同等級的醫療機構。", "think": "醫療機器人的商業模式創新，將成為推動產業成長的關鍵。當硬體成本不再是最大阻礙，醫療自動化的滲透率將呈指數級增長，值得關注相關設備供應鏈的長期需求。", "question": "若醫療技術全面自動化，你對手術安全性的信任度會提升嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMid0FVX3lxTE9KbkdwV0ZIdF9CQnRXcmltMk9TdEQzY3dJNlNrUGN1Nk9WNmNCd2NXRmY2WlMxeHN0MDNET2NtN0dyUGZYemZiX0lGUGVxMTBINzJ4bTZING1MdnQ5VGdVcVRmanJyT0I0QzJkSE9PVlFqaWpXXzh3?oc=5", "name": "香港文匯報"}]}, {"title": "飛亞達：已具備人形機器人用平行軸、行星等精密減速器的批量生產能力", "teaser": "飛亞達攻機器人，精密減速器量產到位", "full": "飛亞達宣布已具備人形機器人核心零件——精密減速器的批量生產能力。這不僅涵蓋平行軸與行星減速器等關鍵技術，更顯示該公司已成功切入機器人硬體供應鏈，為未來營收注入新動能。", "think": "減速器是機器人關節的核心，具備量產能力代表企業在供應鏈中佔據關鍵地位。投資人可留意這些掌握硬體核心技術的企業，其市場價值往往隨機器人普及而水漲船高。", "question": "你認為機器人的核心零件供應商，是否比組裝廠更有投資價值？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTE1OREdJTDBueEJNRXFlalVOQnFlaVVDVFVXNUNUcjNjVGVLUC1kWVV4dVhCZDJ4SnlXLVJOUUxwel9kUWlFMHd0NHl3UXY2MWZZQ0dkcWV2UmJxNmVPSVlvQlFsNHRDUEJmRGc?oc=5", "name": "TradingView"}]}, {"title": "三星半導體廠拚無人化，機器人團隊成軍、2028年上線補足自動化缺口", "teaser": "三星衝刺無人化，2028年機器人上線", "full": "三星半導體部門宣布成立專屬機器人團隊，目標在2028年實現生產線的高度無人化。此舉旨在解決勞動力短缺問題，並透過自動化技術提升晶圓製造的效率與良率，以維持在半導體產業的領先地位。", "think": "科技大廠的自動化升級是不可逆的趨勢，這將倒逼整個半導體設備與周邊產業同步升級。這對於相關自動化設備供應商來說，是一個長達數年的成長紅利期。", "question": "當全球大廠紛紛追求無人化，你認為對未來的就業市場有何影響？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiekFVX3lxTE1IMThRdHJhMmJubndLb1YwTVpQQmtOMnVJZU9vNW9WX3c5THdXR1MwTUVaekdha3N5V3pvYk5vOVBQQ1k0aTlOMUNMUnpoc2xwY1lobkxMZmowYWlEdUtWMkhiTEJBakhHSEp2Tnh0VERLQU5INTllVGJn?oc=5", "name": "BigGo 財經"}]}, {"title": "今天國際：智能機器人研發及產業化項目目前已開工建設", "teaser": "今天國際機器人項目開工，佈局智能製造", "full": "今天國際宣布其智能機器人研發及產業化項目已正式開工建設。該項目致力於提升公司在自動化物流與生產線機器人的研發實力，旨在透過技術升級，滿足工業4.0時代對於高度智慧化生產的需求。", "think": "工廠自動化已是製造業的標配，投資這類深耕智能製造的企業，等於是參與了全球製造業升級的過程，長期成長性與企業轉型進度密切相關。", "question": "如果你是工廠老闆，你會優先投資自動化設備還是員工培訓？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTE8zdi1aRTdCVmV4Z0dDNTd4UkRrRWJiOWRaRnFJYkNldzR0S1N3SXFWQUdnSWxibTJOaEZwMDJ2TGo0LWJWeGViaXhhS0F2NU94NGYwbmRaUVJIODFobFl6aXB5WGRqRngwcFE?oc=5", "name": "TradingView"}]}], "tech": [{"title": "三年砸3億元攻智慧醫療，鴻海攜北榮秀AI機器人成果", "teaser": "鴻海深耕智慧醫療，AI機器人成果顯著", "full": "鴻海集團投入3億元資源，與台北榮總攜手展示在智慧醫療與AI機器人領域的開發成果。雙方的合作聚焦於提升臨床照護效率，利用AI技術協助醫療決策，展現了鴻海從硬體製造跨足智慧醫療解決方案的決心。", "think": "鴻海的轉型之路反映了大型代工廠如何透過AI與機器人技術尋找新藍海。對於投資人來說，這類跨領域合作的成果，是觀察企業能否擺脫毛利競爭的關鍵指標。", "question": "你覺得AI在醫療診斷的角色，未來能完全取代人類醫師嗎？", "sources": [{"url": "https://finance.technews.tw/2026/11/26/foxconn-smart-medicine/", "name": "科技新報"}]}, {"title": "美國301關稅調查，電源供應器呢？台達、光寶這樣看", "teaser": "美關稅調查再起，台廠供應鏈嚴陣以待", "full": "美國啟動301關稅調查，市場緊盯電源供應器產業是否受到波及。台達電與光寶科等龍頭企業表示，已透過全球佈局與多元化生產基地降低風險，將密切關注政策走向並彈性調整供應鏈配置以應對挑戰。", "think": "電源供應器是所有電子產品的心臟，即便遭遇關稅壁壘，其需求仍具備剛性。重點在於企業是否有能力將成本轉嫁給客戶，以及其全球生產的韌性。", "question": "面對地緣政治風險，你認為企業的「生產彈性」比「技術領先」更重要嗎？", "sources": [{"url": "https://technews.tw/2026/11/26/us-section-301-investigation-delta-lite-on-power-supplies/", "name": "科技新報"}]}, {"title": "AI看指紋就能判斷血型？逾10篇論文遭質疑，資料集根本沒有血型資訊", "teaser": "AI論文造假風波，科學界嚴格審視指標", "full": "近期多篇聲稱利用AI分析指紋即可判斷血型的論文遭到學界質疑，原因在於這些AI模型所使用的資料集，根本缺乏血型相關資訊。此事件引發了科技界對於AI訓練資料品質與學術誠信的強烈反思。", "think": "AI熱潮下，各類誇大其詞的應用層出不窮。投資人與大眾在面對AI相關利多時，應保持批判性思維，不要被過度包裝的技術名詞所誤導。", "question": "你如何區分真實的AI技術突破與行銷包裝的噱頭？", "sources": [{"url": "https://technews.tw/2026/11/26/over-a-dozen-studies-said-ai-can-read-your-blood-type-from-a-fingerprint/", "name": "科技新報"}]}, {"title": "美祭先進AI晶片新管制，亞洲資料中心融資市場急踩煞車", "teaser": "美晶片禁令衝擊，亞洲融資市場降溫", "full": "隨著美國對先進AI晶片祭出更嚴格的出口管制，亞洲地區的資料中心融資市場出現觀望氣氛，融資計畫紛紛暫緩。這顯示晶片供應的不確定性，已直接影響到下游基礎設施的擴建進度與資金流動。", "think": "AI基礎設施的擴建與晶片供應密不可分，當源頭供應受限，相關產業鏈的擴張速度勢必放緩。這對於高度依賴AI伺服器成長的企業來說，是需要留意的營收風險。", "question": "如果AI晶片供應持續緊張，你認為哪種科技產業會最先受到拖累？", "sources": [{"url": "https://finance.technews.tw/2026/11/26/us-chip-controls-impact-asian-financing/", "name": "科技新報"}]}, {"title": "盧超群獲陽明交大名譽博士，憶張忠謀兩根青江菜勉青年共創AI半導體新局", "teaser": "產業領袖勉勵青年，共創AI半導體新局", "full": "鈺創科技董事長盧超群獲頒陽明交大名譽博士，在演講中回憶張忠謀以「兩根青江菜」的生動比喻，勉勵青年學子在AI半導體領域勇於創新。他強調，台灣在AI時代擁有獨特優勢，應繼續深耕技術核心以引領全球。", "think": "半導體產業的成功不僅靠技術，更靠堅韌的意志與長遠的眼光。前輩的經驗分享不僅是傳承，更提醒了在AI狂潮下，台灣應繼續保持技術底氣，而非僅隨波逐流。", "question": "你認為台灣半導體產業在AI時代，還有哪些尚未被發掘的潛力？", "sources": [{"url": "https://finance.technews.tw/2026/11/26/nicky-lu-receives-honorary-doctorate-from-nycu/", "name": "科技新報"}]}]}}</script>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
