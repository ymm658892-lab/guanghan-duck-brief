  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

<script type="application/json" id="slot-1300">{"date": "11月23日．週一", "tldr": "黃仁勳戲劇性回歸輝達，引發全球科技股報復性反彈，台股盤中大漲逾2%，台積電與AI族群領軍衝鋒。", "indicators": {"note": "目前指標反映出市場在黃仁勳回歸後呈現極度樂觀，由輝達與台積電領頭帶動全球科技股強勁噴出。", "tiles": [{"label": "台股加權指數", "value": "36,811.89", "valueClass": "rise", "delta": "+2.16%", "deltaClass": "rise"}, {"label": "那斯達克", "value": "24,182.07", "valueClass": "rise", "delta": "+6.92%", "deltaClass": "rise"}, {"label": "費半指數", "value": "9,597.90", "valueClass": "rise", "delta": "+14.14%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "368.29", "valueClass": "rise", "delta": "+15.56%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "黃仁勳戲劇性回鍋，台指期夜盤報復性反彈站回4萬點", "teaser": "黃仁勳回歸引爆台指期大漲", "full": "輝達董事會宣布黃仁勳回歸執行長職位，掃平市場對領導層變動的疑慮。台指期夜盤隨即出現報復性反彈，一度站回四萬點大關，顯示市場對於 AI 龍頭回歸抱持極大信心，台股今日盤中也受到強烈激勵，展現強勁多頭氣勢。", "think": "領導者的穩定性對科技巨頭至關重要，黃仁勳的回歸不僅是人事的塵埃落定，更是對 AI 長期展望的再次肯定。這顯示出市場信心在利空出盡後的強勁反彈力道。", "question": "在企業面臨突發人事變動時，您會選擇先觀望還是趁勢布局？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611230298.aspx", "name": "中央社"}]}, {"title": "黃仁勳復職，美股開盤大漲那指漲逾7%、輝達飆漲26%", "teaser": "輝達飆漲帶動美股科技股噴出", "full": "受黃仁勳復職消息激勵，美股開盤展現強勁攻勢，那斯達克指數漲幅超過 7%，輝達股價更一度飆升 26%。這股熱潮迅速蔓延至全球科技股，為近期震盪的市場注入一劑強心針，也確立了 AI 族群在目前盤勢中的領先地位。", "think": "美股的表現往往是台股的先行指標，輝達的噴出式上漲直接帶動了台灣電子權值股的表現。上班族投資者應關注美股大型科技股的連動效應，這對手中持有的科技型 ETF 有直接影響。", "question": "面對單日暴漲行情，您認為這是長期起漲點還是短線超漲？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611230295.aspx", "name": "中央社"}]}, {"title": "黃仁勳即日起復職，輝達：不構成國安風險", "teaser": "輝達強調黃仁勳復職無國安風險", "full": "輝達官方正式聲明黃仁勳即日起恢復職務，並特別澄清其復職不構成任何國安風險，試圖化解先前市場對於調查或地緣政治因素的擔憂。此舉旨在穩定投資人與政府關係，確保輝達在全球市場的營運不受干擾，維持長期競爭力。", "think": "消除不確定性是股市大漲的主因，當法律或政治風險被排除，估值就能回歸基本面。這提醒我們，除了財報數據，企業如何處理公關危機與合規議題同樣是影響股價的關鍵變數。", "question": "您認為企業領導人的個人操守與公司股價的連動性有多高？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202611230292.aspx", "name": "中央社"}]}, {"title": "輝達董事會通過，恢復黃仁勳總裁及執行長職務", "teaser": "輝達董事會全票通過黃仁勳復職", "full": "輝達董事會決議恢復黃仁勳的總裁、執行長及董事職務，象徵內部權力結構重新穩固。這項決策迅速獲得華爾街與全球市場的正面回應，被視為市場信心的最大利多，也讓輝達能重新聚焦於 AI 晶片的產能與研發進度。", "think": "董事會的快速決策展現了企業應對危機的效率，這對於處於快速競爭環境的科技業尤為重要。投資人在觀察公司時，除了產品力，也要留意董事會的決策效率與透明度。", "question": "什麼樣的企業領導特質最能讓您放心長期持有其股票？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202611230288.aspx", "name": "中央社"}]}, {"title": "歐元區11月綜合PMI為51.7，德國擴張抵銷法國萎縮", "teaser": "歐元區經濟表現呈現德強法弱", "full": "11月歐元區綜合PMI數據為51.7，其中德國經濟加速擴張，有效抵銷了法國經濟持續萎縮的負面影響。雖然整體數據維持在擴張區間，但歐洲內部的經濟成長不均，仍是全球宏觀經濟需要關注的隱憂之一，影響投資人對歐元資產的看法。", "think": "雖然目前台股焦點在 AI，但歐洲經濟動能會影響全球終端消費需求。身為投資者，了解德法兩國的經濟消長，有助於評估台灣外銷歐洲相關產業的未來展望。", "question": "您認為歐洲經濟復甦緩慢，會對台灣的出口產業造成顯著衝擊嗎？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202611230280.aspx", "name": "中央社"}]}], "robotics": [{"title": "景旺電子：持續關注並跟進人形機器人等新興賽道", "teaser": "景旺電子深耕人形機器人賽道", "full": "景旺電子表示正持續關注並跟進人形機器人與低空飛行器等新興領域，致力於在供應鏈中佔得先機。隨著 AI 技術成熟，人形機器人的硬體需求預計將大幅成長，相關電子零組件廠商正積極調整產線以應對新商機，展現轉型決心。", "think": "機器人不再只是科幻，供應鏈的轉型已經開始，這類上游供應商的動向反映了產業的真實熱度。投資人可以留意這些從傳統電子零件跨足機器人領域的廠商，往往隱藏轉型商機。", "question": "您認為人形機器人最快會在幾年內進入我們的日常生活？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTE5QS2NqclhrZ3QxX2U1cGFpS0cxNDB3VVhuUTd1MEdTa1g2R3IzSGR1TElHNFlTZWJGYk9SS3ZmYTE1YnBuYUhoX0cxUEl4MjdKcTJNcnd6elhMaEp4d3hybTQtc1RRX0pSU1E?oc=5", "name": "TradingView"}]}, {"title": "臺南推動一校一科技，AI機器人親子營5梯次全額滿", "teaser": "臺南推動 AI 機器人親子共學熱潮", "full": "臺南市積極推動「一校一科技」計畫，舉辦 AI 機器人親子營隊，五個梯次名額迅速額滿，展現家長對未來科技的濃厚興趣。透過親子共學，機器人教育正向下扎根，為未來的科技人才培養奠定基礎，也反映出社會對自動化技術的重視。", "think": "科技教育的普及預示了未來職場的技能需求，AI 與機器人將成為下一代的必備知識。對上班族家長來說，這也是一個重新檢視自身技能儲備，並與孩子共同成長的好機會。", "question": "假如您的工作未來與機器人協作，您最想學習哪方面的操作技能？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTE03bWRaeENDazFHT09jLWFVcVJjMkJ5Wm95Q20tZ2h2ekY1SGxGWHk2R0kwdnNUdHlnazdvZ0RVSUduTTFyS3ZmZm9DVjJuNkhDVXc?oc=5", "name": "蕃新聞"}]}, {"title": "人形機械人於舊金山舉行格鬥賽事展現戰鬥能力", "teaser": "舊金山舉行人形機器人格鬥賽", "full": "舊金山舉辦了一場人形機器人格鬥賽事，展示了機器人在平衡、反應速度與戰鬥動作上的卓越能力。這類賽事不只是娛樂，更是各家廠商研發成果的競技場，展現了目前機器人硬體與控制演算法的最高水準，吸引全球技術愛好者目光。", "think": "格鬥賽是測試機器人耐用度與敏捷性的極端環境，這些技術未來都能轉化為工業或服務業的應用。這讓我們看到機器人正從穩定的室內環境走向更複雜、動態 <script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
