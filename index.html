  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

<script type="application/json" id="slot-1300">{"date": "11月18日．週三", "tldr": "台股今日面臨外資大舉賣超壓力，加權指數重挫逾2%，市場違約交割風險升溫，投資人午休時刻務必保持冷靜，審慎檢視手中持股的財務體質。", "indicators": {"note": "盤中數據顯示台股受外資賣壓衝擊顯著，台積電ADR走弱加劇大盤壓力，儘管費半指數微幅回升，但整體市場信心仍處於動盪調整階段。", "tiles": [{"label": "台股加權指數", "value": "40,194.91", "valueClass": "fall", "delta": "-2.06%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "24,328.38", "valueClass": "fall", "delta": "-0.74%", "deltaClass": "fall"}, {"label": "費半指數", "value": "9,642.88", "valueClass": "rise", "delta": "+0.34%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "359.69", "valueClass": "fall", "delta": "-3.68%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "外資狂賣台股逾765億，調節台積電成重災區", "teaser": "外資大舉撤出，台積電遭調節賣壓沈重。", "full": "外資今日展現強烈賣超動作，合計賣超金額超過765億元，其中權值股台積電成為主要的調節標的，單日賣超超過1.5萬張。此舉直接拖累台股大盤表現，顯見外資在國際局勢與匯率壓力下，正加速調整投資組合。", "think": "外資的流向往往是台股趨勢的風向球，當大咖開始撤退，散戶更需評估持股的防禦性。短線波動加劇時，切勿因恐慌而盲目追殺，應檢視資產配置是否過度集中。", "question": "面對外資的大規模提款，你是否已準備好調整手中的長線佈局策略？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611180304.aspx", "name": "中央社"}]}, {"title": "新台幣貶值壓力難解，創逾19個月新低", "teaser": "台幣匯率走貶，資金外流壓力持續升高。", "full": "受到國際美元走強與外資持續砍殺台股的雙重影響，新台幣匯率今日持續承壓，貶值幅度明顯，匯價創下逾19個月以來的新低紀錄。這反映了市場對於資金流出台股的擔憂，以及整體亞幣競貶的環境背景。", "think": "匯率貶值雖有利於出口導向的科技公司，但對國內物價與外資信心卻是負面訊號。對於投資人而言，匯市波動會直接牽動股市資金動能，需密切觀察央行的後續動作。", "question": "匯率持續走貶的環境下，你目前的資產配置是否具備足夠的抗風險能力？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611180307.aspx", "name": "中央社"}]}, {"title": "創意、欣興等4檔個股違約交割，金額達2.66億", "teaser": "股市波動加劇，違約交割風險不容忽視。", "full": "證交所最新統計顯示，創意、欣興、金像電、華通等四檔個股發生違約交割情形，合計金額高達2.66億元。在市場震盪走跌的過程中，這類風險事件容易引發市場恐慌，提醒投資人應量力而為，避免過度槓桿操作。", "think": "違約交割是股市的警訊，當熱門股出現這類狀況，通常代表部分投資人資金調度出現困難。建議在行情波動劇烈時，務必嚴控自身的交易額度與槓桿比例。", "question": "在追求高報酬的同時，你是否已為市場反轉時的現金流預留了足夠的安全空間？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611180316.aspx", "name": "中央社"}]}, {"title": "元太證實遭駭客攻擊，初估營運影響有限", "teaser": "電子紙大廠傳資安事件，營運影響待觀察。", "full": "電子紙龍頭元太科技發布公告，證實公司資訊系統遭受駭客攻擊。公司已啟動相關防禦機制與復原程序，初步評估對整體營運並無重大影響，目前正積極釐清受影響範圍並進行系統修復。", "think": "資安事件已成為現代科技製造業的隱形成本，即便短期營運影響不大，但對公司聲譽與客戶信任度仍有隱憂。投資人在關注財報之餘，也應留意企業在資安治理上的投入。", "question": "除了基本面，你會將「資安風險管理」納入選股的考量指標嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611180336.aspx", "name": "中央社"}]}, {"title": "美媒指輝達曾牽線阿里巴巴，涉規避晶片管制", "teaser": "輝達捲入晶片管制爭議，市場關注後續發展。", "full": "根據美媒報導，輝達在2022年期間疑似牽線阿里巴巴與特定人士黃樂，涉嫌協助規避美國對華的高階晶片出口管制。此消息引起市場高度關注，若後續調查屬實，可能對輝達的合規性與供應鏈佈局帶來潛在的監管壓力。", "think": "地緣政治對科技業的影響已深入骨髓，任何涉及管制邊緣的操作都可能引發股價震盪。對於持有相關供應鏈個股的投資人，政策風險是必須時刻盯緊的變數。", "question": "在美中科技競逐的背景下，投資策略該如何應對突如其來的政策地雷？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202611180324.aspx", "name": "中央社"}]}], "robotics": [{"title": "老牌工業電腦廠攜手巨頭，搶攻機器人商機", "teaser": "結盟輝達與高通，工業電腦廠卡位AI大腦。", "full": "國內老牌工業電腦廠近期動作頻頻，透過與輝達、高通及英特爾等國際科技巨頭結盟，成功切入AI機器人的大腦核心技術。目前訂單需求暢旺，顯示在自動化轉型趨勢下，硬體與AI軟體整合已成獲利關鍵。", "think": "工業電腦轉型AI機器人是台廠升級的重要路徑，不僅能擺脫傳統毛利競爭，更能提升技術護城河。這類企業在產業升級浪潮中，具備較佳的長期成長潛力。", "question": "你認為AI機器人的硬體整合能力，是否為台廠未來十年的競爭核心？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiS0FVX3lxTE1iMmwyblI4VjljSk84amR1aWNwUWp1VV9DeHlNazJ0Nnh6TnFRTjMydXdTQlNPT2VHYUtmNEtUcEViQXMzX2VvVjlHSQ?oc=5", "name": "FTNN"}]}, {"title": "商絡電子切入人形機器人，提供技術服務", "teaser": "供應鏈再添新兵，電子元件廠打入機器人市場。", "full": "商絡電子日前表示，已成功向多家人形機器人客戶提供關鍵電子元器件及相關技術服務。隨著人形機器人產業逐漸從實驗室走向商業應用，這類電子零組件供應商正積極布局，意圖在未來龐大的機器人市場中佔有一席之地。", "think": "人形機器人的普及需要龐大的零件供應鏈支持，與其猜測哪家機器人公司會成功，不如關注那些「賣鏟子」的零組件供應商，風險相對分散。", "question": "若機器人產業爆發，你認為關鍵零組件廠是否比整機廠更具投資價值？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTFAzS09CMklDM2tNNWlhOE5ibEhNRmpSQ1pGNjFpTlFyMXpQWTA3dzNqS3hoUkhUREFBVzEtY3M1Tk9NRk5MZHBRT1JWZGJNQ2NRU2EzNUhIaFlIR0pzdEpsVy16VXJmd1MzbHc?oc=5", "name": "TradingView"}]}, {"title": "金力永磁產能利用率高，在手訂單充足", "teaser": "磁材需求不減，產能利用率維持高水準。", "full": "金力永磁對外表示，目前公司在手訂單狀況極為充足，產能利用率持續保持在高水平。作為機器人動力系統與高效馬達的關鍵材料供應商，市場需求強勁，顯示其在自動化產業鏈中的關鍵地位。", "think": "馬達是機器人的動力心臟，而磁材則是馬達的靈魂。這類上游材料廠的產能狀況，往往比終端產品更能看出產業真實的景氣溫度。", "question": "關注機器人產業時，你是否忽略了背後龐大的磁材與動力系統供應鏈？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTE4zeURYQURrWENkbk5NRnY3ZTR4WUVUbjJxbkxsVlRPblhxWUpwS19YbDJrZDNvZTZwSkJ0RElTeTRnTTJlOTl1WG1xcnJ6UWo0NTIzQWtSSzBMSjQ0OFFfZkFodTdCRjVKMVE?oc=5", "name": "TradingView"}]}, {"title": "三德科技整合AI與物聯網，推進無人化裝備", "teaser": "結合數據雲與機器人，力推工業無人化。", "full": "三德科技積極發展無人化智能裝備，整合了工業物聯網、AI數據雲以及智能機器人等技術。透過軟硬結合的方式，旨在解決工業生產中的數據監控與自動化操作需求，提升工廠運作效率。", "think": "工業自動化的下一步是「智慧化」，單純的機器手臂已不足夠，能處理數據並自我優化的無人化系統才是未來的成長點。", "question": "你會如何判斷一家工業科技公司是否具備真正的AI整合能力？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTE1SUElVbTMwNVVyR1dzUGRlUDNqaUZxRHNvd251VTJ2ZGk5aDVpUm00aTlvRnB5V1YyUF9LT0JWZFMwbWNnZEc1aUl3VDFkVFNTLUN2X3gtaDN4S0I4eE0yZzVjV2Z5SHNwWHc?oc=5", "name": "TradingView"}]}, {"title": "宜安科技機器人業務進展，目前處於打樣階段", "teaser": "業務尚在打樣，規模化生產仍需等待。", "full": "宜安科技針對機器人業務進展說明，目前相關產品仍處於打樣與送樣階段，尚未獲得大規模生產的定點合約。公司正持續爭取客戶認證，期望未來能順利進入量產供應鏈，擴大機器人領域的布局。", "think": "機器人產業不僅看技術，更看客戶認證速度。對於仍在送樣期的企業，投資人需有耐心，並持續追蹤其獲得大客戶定點的進展與時程。", "question": "面對處於發展初期的科技業務，你傾向於趁早佈局還是等待量產訊號？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTFBfTXViWWN0V3Mzb3dhVE9hM2c5LXpQTldjS2VSWUt1Q3BmNldfbUh1UTE5RzVWeXRoWDdhdUc4eWlWMmJRc08yNVNfUnRFMngyT1p6TkdsSHprM25Cbm9uRmFuNGRjcnFwS1E?oc=5", "name": "TradingView"}]}], "tech": [{"title": "雙鴻看好明年營收，ASIC業務將超車GPU", "teaser": "散熱大廠動能強，ASIC業務成長可期。", "full": "散熱模組大廠雙鴻對明年展望樂觀，預期營收成長將高於今年。特別是隨著客製化晶片（ASIC）需求激增，雙鴻預估其ASIC相關散熱業務的規模將在明年超越傳統GPU，成為公司成長的主要引擎。", "think": "雲端巨頭紛紛投入自研晶片，散熱需求也隨之改變。雙鴻的轉型顯示了產業風向的轉變，投資人應留意這種從單一產品轉向多元應用的趨勢。", "question": "在AI硬體軍備競賽中，你是否關注過散熱技術背後的產業結構變化？", "sources": [{"url": "https://finance.technews.tw/2026/11/18/auras-earnings-call-26q3/", "name": "科技新報"}]}, {"title": "波士頓動力機器人Atlas，將進駐晶圓廠", "teaser": "人型機器人跨界，2027年進駐晶圓廠。", "full": "波士頓動力公司宣布，其知名人型機器人Atlas將在2027年正式進駐格羅方德晶圓廠。此舉標誌著人型機器人開始從實驗室與展示舞台，邁向高精密的半導體製造實務應用，展現其在複雜工業環境中的作業能力。", "think": "機器人進駐晶圓廠具有指標性意義，代表機器人的精度與適應力已達產業要求。這不僅能解決晶圓廠人力不足問題，也為未來自動化製造開創了新篇章。", "question": "如果機器人能勝任精密晶圓製造，未來還有哪些產業會面臨大規模自動化轉型？", "sources": [{"url": "https://technews.tw/2026/11/18/boston-dynamics-enters-semiconductor-industry/", "name": "科技新報"}]}, {"title": "LINE推通行金鑰，無密碼登入更安全", "teaser": "資安升級，LINE導入通行金鑰功能。", "full": "LINE近期推動「通行金鑰」登入機制，用戶可透過裝置生物辨識快速完成登入，無須輸入密碼。此舉旨在提升帳號安全性，降低密碼外洩帶來的風險，是目前科技界推廣無密碼登入趨勢的重要一環。", "think": "數位資產安全是每個人都需面對的課題，使用生物辨識取代密碼不僅方便，更是防範釣魚詐騙的有效手段。這類科技細節的改善，往往能大幅提升用戶體驗。", "question": "你是否已經將所有常用APP都更新為生物辨識登入，以保護帳號安全？", "sources": [{"url": "https://infosecu.technews.tw/2026/11/18/how-to-register-a-passkey-in-the-line-app/", "name": "科技新報"}]}, {"title": "資策會：新創不能只靠技術，需串聯產業需求", "teaser": "技術非唯一，串聯產業鏈才是生存關鍵。", "full": "資策會董事長指出，台灣新創企業若想成功，不能僅僅依賴技術研發，必須主動串聯產業端的需求。只有將技術落地應用於具體的市場場景，才能幫助新創公司走向國際，實現商業價值的規模化。", "think": "技術創新只是第一步，商業模式與市場連結才是新創的生命線。對於投資人來說，評估一家新創公司時，應更看重其解決產業痛點的能力，而非單純的技術規格。", "question": "你認為目前台灣的新創環境，是否已成功跨越「技術導向」轉向「市場導向」？", "sources": [{"url": "https://technews.tw/2026/11/18/ai-living-lab-g-camp-dekra/", "name": "科技新報"}]}, {"title": "希格諾展示Physical AI，機器手臂精準揮桿", "teaser": "物理AI大躍進，機器人展演高爾夫球技。", "full": "希格諾與茂綸共同展示了Physical AI技術的應用，透過機器手臂精準揮桿打高爾夫球，完美詮釋了AI對實體物理世界的精確掌控。此項技術展示了未來機器人在需要高度協調與物理判斷的作業環境中，所具備的發展潛力。", "think": "Physical AI將AI從虛擬數據帶入現實世界，這是機器人技術的重大突破。當AI能理解物理規律，自動化生產的彈性將大幅提升，這是值得長期關注的前沿科技。", "question": "物理AI的突破，是否會讓你對未來機器人的應用場景有新的想像？", "sources": [{"url": "https://technews.tw/2026/11/18/epson-physical-ai-nvidia/", "name": "科技新報"}]}]}}</script>

  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
