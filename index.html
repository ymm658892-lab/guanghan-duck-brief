  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

立上市將重新激發市場對該領域的估值討論，值得半導體投資人密切追蹤。", "question": "當知名科技子公司獨立上市，你會傾向買母公司股票還是直接投資新上市公司？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202609150361.aspx", "name": "中央社"}]}, {"title": "市場權衡沙烏地與利比亞石油供應 國際油價收盤大漲", "teaser": "供應吃緊推升油價", "full": "國際油價近日再度大漲，主因是沙烏地阿拉伯持續限制出口，加上利比亞政局動盪導致供應受阻。市場在衡量供需缺口後，擔憂短期內原油庫存將加速去化，推升油價攀升至近期高點。", "think": "油價上漲會直接反映在通勤族的加油成本上，更會間接拉高各行各業的運輸與生產成本。在高油價時代，節能與綠能相關題材或許是抗通膨的避風港。", "question": "面對油價與物價雙漲的壓力，你是否調整了日常消費與投資的配置？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609160006.aspx", "name": "中央社"}]}], "robotics": [{"title": "人形機器人全球競速 醫療長照成兆元級新戰場", "teaser": "醫療長照迎來機器人", "full": "隨著全球高齡化問題加劇，人形機器人的應用場景正加速從工業製造拓展至醫療與長期照護。各大科技巨頭紛紛投入研發，期望以AI驅動的機器人緩解醫護人力短缺，這也讓長照成為下一個兆元級的關鍵戰場。", "think": "科技不只解決便利性，更能解決社會結構性問題。醫療機器人的普及將徹底改變未來的照護模式，相關感測器與精密馬達供應鏈將是長期投資的沃土。", "question": "如果未來家中有機器人看護，你最希望它幫忙分擔哪一項照護工作？", "sources": [{"url": "https://news.google.com/rss/articles/CBMi0AJBVV95cUxPWEVkZTQ0aXRwOGJ0c3pTQ3hCVHFERmthVEc5RUpZaVZrN05iamZBM3E1alZIR0JGajhjNVA5LW1COVpoeERXODhtem5BVnlCNGRsZU1wZFhWRVFGc3NuZ2tIVFlGRkRUeTRLWTVzbTNCb3BWN1Nyc1ZUZ19kYUZrWFdtd0ZNbElvRWZ3WTNXeGZVYUJvVnEwZ0V0NEo0bnFEbjZURnlDcTR5a1E5T1gzcFpXdThPb2ZheENNZVVsa19TTjhGalNOQ0dURWJzSVBMLVVQVWhKS2ludUxBMjJtTnlWMjJpdWtwMlhGOE1lNmVxREZhWEUtNDdjYmtnbmxmMTFsMzJqVUxUVHZBZ2U5RmFSYUZYSU9BS2txVXhkNElTNXdwU2pDS3lEY2M4bWxzZW9CaWlzcUJiUGwtdE0ycmdnYVk4NHA5bnpiVTY3SWM?oc=5", "name": "報新聞"}]}, {"title": "三星放話 CES 2027 亮相人型機器人，投資 19 兆韓圜龜尾基地曝光", "teaser": "三星重金布局機器人", "full": "南韓科技巨頭三星電子展現強大野心，宣布計畫在2027年的CES大展上正式亮相其研發的人形機器人。為此，三星大手筆投資高達19兆韓圜，並首度曝光其位於龜尾的關鍵生產基地，力圖在硬體製造上取得領先。", "think": "三星的參戰意味著人形機器人賽道已進入軍備競賽階段。當科技巨頭開始砸重金建置實體基地，代表這項技術已從實驗室走向商業化落地，供應鏈商機即將爆發。", "question": "面對美、中、韓等國的機器人競賽，你認為台灣廠商在其中最大的競爭優勢是什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMikAFBVV95cUxOSldvVUp2ajRkdXEzSzRVdmk4ajRWNWtCQ2dyS0ZtX1ROUzVINjFCSWxWYlBkQndjNVh6a0lUVHZ2Wjdzekx6OTlnNjBqSy1kM1NJTGFRc0lHT0lrQ3ZRZVBTN1FHLWdSenVoUWNPUUtxSjc3TWRheFc4cHdEOTNkMDZQYVdFRGdITHhCVWptelg?oc=5", "name": "TechNews 科技新報"}]}, {"title": "智慧機器人產品2027年首批量產！模組廠外資回頭股價連紅", "teaser": "機器人量產引爆資金潮", "full": "隨著智慧機器人預計於2027年迎來首批大規模量產，相關供應鏈的模組廠成為市場焦點。原本連續賣超的外資態度轉為積極回頭補貨，推動相關個股股價連續多日收紅，正式晉升為台股盤面上的強勢指標。", "think": "投資往往領先基本面。雖然距離2027年量產還有一段時間，但資金已經開始卡位。追逐這類題材時，應注意外資籌碼的延續性，避免追高在過度樂觀的頂點。", "question": "面對這類「遠景看好、但離量產還有時間」的題材，你的投資策略是分批佈局還是短線操作？", "sources": [{"url": "https://news.google.com/rss/articles/CBMi8wNBVV95cUxNY3Vib0xNN3QteWxaaERrTkw2UkVINGdrd2RCdHk5Q0xBZVMwTDVlak9DLUxWTjUyNkFHaGd6eV9scjVBQy1CRnl1bm5vNUI0emo5X3U1MzVOMUkxeFI0TUpNOGl4VEdVMzlBQTlXSS16OFd2dXZIUDN5UXhSUXIyVmFVNE43bFFXVy1qUlkxS3phZjlRN2VkUlBtZFRDQnRuVXZBckstMzZFTlpoel9vSWhCUDlDeENBckQzcldCb2ZwS2FfTHltRDJOcGJOSEtkTWJ3MURYc2tpSzktMlJZQUdsVk50R1h1S1RwdkhHWUlOZ2hnZGdHeXJRS0ExNWFtNkZCT3BYcVlRVS1qT1VmZXJ2VHZJVXU2R3lSX1BBaGtpcEdzamYydFJWMm9oNnc5b1h5OHU0TUdWdUU1NUFtQUU4blFRaDlJaXlaek1mZUtfcEpySzZKLWh4V28tOU1mSGhZS1JKMmNNSURmRnUyZ3N0SGZNVG02ajQ4bFBubGZMTEZnTmJfTnVfSnZlR1M2azRrVExzcWZpOTIzb2F2UDBjOUVYUmF4V2xUTFRaZUhIT1ZlTkxrTGQxR3V5ekI1c01KeS1zekZGckRoRDVnTnlhYURpXzJ1LXZGUGpJbE1sbVpXcmNuaWNwTnVtUGVNZm4w?oc=5", "name": "Yahoo股市"}]}, {"title": "機器人業務暴增250％！蔡明翰點名這檔龍頭默默賺", "teaser": "隱形冠軍默默賺大錢", "full": "知名分析師蔡明翰指出，除了台積電外，某檔傳統產業龍頭的機器人相關業務正出現爆發性成長，年增幅高達250%。該公司雖然股價不常出現狂飆行情，但憑藉穩健的獲利與高市佔率，成為存股族默默累積財富的首選。", "think": "在市場瘋狂追逐高波動的科技股時，穩健成長且有實質業績支撐的「隱形冠軍」反而能提供更好的防守性。這種低調賺錢的龍頭股，非常適合上班族長期定額投資。", "question": "在你的投資清單中，是否也有這種「不愛飆、但每年默默穩健配息」的龍頭股？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTFBSb0RPQTZ5SnVqWEd6VVZhOUdhUzlOYkJmZmRDbi1tcUVlUG9GdU9ha2V6bmk2b1F3LVVjRmJnTWZFQ3MwaUJ2TzdmaDN1SVVicU5LVUhwNllid1ZUT2xQaXlfY05EYlNQWkE?oc=5", "name": "旺得富理財網"}]}, {"title": "雷軍現身宇樹腳踹機器人 網笑：不講武德", "teaser": "雷軍實測機器人抗打能力", "full": "小米創辦人雷軍近日親自造訪知名機器人公司「宇樹科技」，並在現場實測時，開玩笑地用腳踹了機器人幾下，以測試其平衡與抗干擾能力。這段有趣的互動影片在網路上瘋傳，引發網友熱烈討論與會心一笑。", "think": "雖然「腳踹」看似好笑，但這其實是測試機器人動態平衡算法的標準動作。這則新聞拉近了科技與大眾的距離，也反映出大老們對機器人產業的極高關注度。", "question": "當科技大佬親自站在第一線為新技術造勢，是否會增加你對該產業的投資信心？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiYkFVX3lxTFBUVGtQMUxBNUYxLTdFTGs3OGJsMTRaajhwYmZ1N2NCQkpLbDdwNXB4Wk9SMS05a3FodzZ3RHctbnVzUWRzdURYZnFGRDBDakM0QmJaOEVCem5fOHl4dEhlX0dB0gFnQVVfeXFMUHBWSGtHTVpmR3prX2pENUg4emQ0NTZZTXRvLWJBMExGZjkzY1h0TU9TYmVLazJWWDYwRUFBSkx2dVVQMm1FX0djTmM4Z2NLbHh6bWE2YkZFTjVQal9tMnV0WF93c0ZyQQ?oc=5", "name": "世界新聞網"}]}], "tech": [{"title": "MLCC 滲透 AI 伺服器仍處早期！大摩點名國巨等成最大贏家", "teaser": "被動元件迎AI新商機", "full": "摩根士丹利（大摩）最新報告指出，積層陶瓷電容（MLCC）在AI伺服器中的滲透率目前仍處於早期階段，未來成長空間巨大。報告特別點名村田製作所、三星電機以及台灣的國巨，將是這波AI硬體升級趨勢下的最大贏家。", "think": "AI的發展不只帶旺台積電與晶片廠，底層的被動元件同樣不可或缺。當晶片效能越強，對穩定電流的MLCC需求就越高，這為傳統電子元件廠帶來長線轉機。", "question": "你在關注AI伺服器晶片的同時，是否也有留意到周邊零組件如被動元件、散熱的投資機會？", "sources": [{"url": "https://finance.technews.tw/2026/09/16/overweight-mlcc/", "name": "科技新報"}]}, {"title": "英勞工每 6 人就有 1 人自費買 AI 工具，每年支出驚人", "teaser": "上班族自掏腰包買AI", "full": "根據最新調查，英國每六名勞工中就有一人選擇自費購買AI生產力工具來協助工作，每年總支出相當驚人。這反映出在企業尚未全面補助的情況下，基層員工為了提升工作效率、減輕日常負擔，寧可自己花錢買單。", "think": "這顯示AI已經從「話題」實質轉化為「生產力工具」。對於上班族來說，掌握AI工具的使用方法已不再是加分項，而是保持職場競爭力的必備基本功。", "question": "你目前在工作中有使用付費或免費的AI工具嗎？它幫你省下了多少時間？", "sources": [{"url": "https://technews.tw/2026/09/16/1-in-6-british-workers-self-fund-ai-tools-42-8-billion-gbp-annual-spend/", "name": "科技新報"}]}, {"title": "馬來西亞 AI 資料中心用電爆增，2035 年恐占總電力需求 31%", "teaser": "AI發展帶來電力大考驗", "full": "隨著科技巨頭紛紛在馬來西亞建置AI資料中心，當地的用電量出現爆發性成長。最新研究預估，到了2035年，這些資料中心的用電量恐將占馬來西亞全國總電力需求的近三分之一，引發各界對能源供應與碳排的擔憂。", "think": "「算力的盡頭是電力」。AI發展不只是科技競賽，更是能源爭奪戰。這也是為什麼潔淨能源、儲能設備與電網基礎建設，會成為近年最火熱的長線投資題材。", "question": "面對AI帶來的龐大電力需求，你認為哪些綠能或節能技術最具有投資潛力？", "sources": [{"url": "https://technews.tw/2026/09/16/malaysias-data-centres-guzzling-more-power-as-temperatures-soar/", "name": "科技新報"}]}, {"title": "彭步：美中討論削減部分商品關稅，貿易休兵有望延長", "teaser": "美中貿易休兵現曙光", "full": "據彭博社報導，美國與中國官員正積極討論削減部分特定商品的關稅，這項舉動有望讓兩國緊繃的貿易關係迎來喘息空間。若雙方達成共識，目前的貿易休兵狀態將得以延長，有助於穩定全球供應鏈與降低企業成本。", "think": "關稅壁壘的降低對全球貿易是重大利多。對於高度依賴出口的台灣電子與傳統產業來說，這能減少地緣政治帶來的不確定性，有助於提升企業的獲利預期。", "question": "如果美中關稅真的降低，你認為哪些對美出口比重高的台股企業會最先受惠？", "sources": [{"url": "https://technews.tw/2026/09/16/china-and-us-discuss-cutting-tariffs-on-agriculture-and-energy/", "name": "科技新報"}]}, {"title": "最幸福城市不是因為有錢，調查：日常壓力低促成幸福要件", "teaser": "幸福關鍵在於低壓力", "full": "一項針對全球城市的最新調查指出，最幸福的城市往往不是因為居民最富有，而是因為日常生活的壓力水平較低。完善的公共設施、良好的工作與生活平衡，以及便利的通勤環境，才是決定居民幸福感的最關鍵要素。", "think": "身為通勤族，每天的塞車與高壓工作常讓我們喘不過氣。這份調查提醒我們，在追求財富累積的同時，適度減壓、維持身心健康，才是提升人生實質報酬率的關鍵。", "question": "在今天忙碌的通勤路上，你可以做些什麼小改變來降低自己的日常壓力呢？", "sources": [{"url": "https://technews.tw/2026/09/16/a-citys-status-as-the-happiest-isnt-due-to-wealth-survey-finds-low-daily-stress-is-a-key-factor-in-happiness/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-1300">{"date": "9月16日．週三", "tldr": "台股午盤於四萬五千點附近狹幅震盪，雖然三大法人呈現賣超，但外資券商看好AI算力需求熱潮延續，樂觀看待台股長線獲利表現。", "indicators": {"note": "此時段顯示台股與美股主要指數處於高檔震盪整理，微幅波動反映市場在午盤時段觀望氣氛濃厚。", "tiles": [{"label": "台股加權指數", "value": "45,848.90", "valueClass": "fall", "delta": "-0.03%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "25,981.57", "valueClass": "fall", "delta": "-0.78%", "deltaClass": "fall"}, {"label": "費半指數", "value": "11,175.55", "valueClass": "rise", "delta": "+0.40%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "413.75", "valueClass": "fall", "delta": "-1.02%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "瑞銀：AI算力仍短缺 硬體供應鏈旺到2027年", "teaser": "AI算力缺口支撐硬體供應鏈", "full": "瑞銀發布最新報告指出，全球對AI算力的需求遠大於供應，算力短缺情況短時間內難以緩解。這將推動台廠相關硬體供應鏈迎來長達數年的出貨榮景，榮景有機會一路延續至2027年。", "think": "對於長期投資人而言，這項預測代表AI產業並非短期泡沬，而是具備實質基本面支持的長期趨勢。上班族在布局台股時，可持續關注具有技術優勢的伺服器與半導體供應鏈。", "question": "你的投資組合中是否已經具備能承接長遠AI算力商機的核心持股？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609160216.aspx", "name": "中央社"}]}, {"title": "瑞銀正向看待台股 估2027年企業獲利成長31%", "teaser": "外資看好台股企業長期獲利", "full": "外資券商瑞銀對台股後市抱持正面態度，預估在科技業與先進製造業帶動下，台灣整體企業獲利將保持穩定強勁的增長力道。預測至2027年，台股企業獲利成長率可望達到31%。", "think": "外資的樂觀預估為市場注入長期信心，意味著拉回整理時往往是尋求優質標的的好時機。上班族不必因短期盤勢波動而恐慌，宜以基本面為依歸進行資產配置。", "question": "當外資看好台股長遠獲利時，你是否做好了拉回分批布局的準備？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609160206.aspx", "name": "中央社"}]}, {"title": "三大法人賣超台股213.8億元", "teaser": "法人調節籌碼台股高檔震盪", "full": "今日盤中三大法人合計賣超台股達213.8億元，導致加權指數在高檔承壓並呈現狹幅震盪。市場觀望氣氛較濃，多空雙方在平盤附近持續展開拉鋸戰。", "think": "法人賣超反映出高檔獲利結算的資金調節動作，但只要整體產業趨勢未變，適度拉回有助於籌碼面沉澱。投資人應密切觀察外資動向與支撐價位，切忌追高殺低。", "question": "面對法人的籌碼調節，你會選擇觀望還是尋求高殖利率標的逢低布局？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609160181.aspx", "name": "中央社"}]}, {"title": "鴻騰科技日登場 盧松青：AI推動光通訊新發展", "teaser": "光通訊崛起成為AI下一波焦點", "full": "鴻騰精密於科技日展示最新技術，董事長盧松青指出，隨著AI算力爆發帶動大量資料傳輸需求，光通訊技術將迎來全新發展契機。公司正加速布局高效能連結器與光電模組領域。", "think": "高速傳輸是AI發展不可或缺的基石，光通訊技術逐漸成為科技大廠競逐的焦點。上班族投資人可多留意光通訊與高速傳輸   document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
