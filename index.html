  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

<script type="application/json" id="slot-1300">{"date": "9月6日．週日", "tldr": "台股季線震盪，AI硬體與儲能商機持續發售。科技普及雖帶來效率，但也引發焦慮，提醒您適度放鬆、提升自我。", "indicators": {"note": "台股與費半表現強勁，台積電ADR同步上揚，顯示半導體與科技股在盤中仍具備強大的撐盤動能。", "tiles": [{"label": "台股加權指數", "value": "46,551.13", "valueClass": "rise", "delta": "+1.51%", "deltaClass": "rise"}, {"label": "那斯達克", "value": "26,506.99", "valueClass": "fall", "delta": "-0.29%", "deltaClass": "fall"}, {"label": "費半指數", "value": "11,735.26", "valueClass": "rise", "delta": "+3.38%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "428.91", "valueClass": "rise", "delta": "+2.85%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "美購債計畫及蘋果發表會將登場 法人：台股季線區間震盪", "teaser": "蘋果發表會與購債計畫雙重夾擊", "full": "隨著美國即將公布新的購債計畫，加上萬眾矚目的蘋果秋季發表會即將登場，市場觀望氣氛濃厚。法人分析，台股短期內預期將在季線附近呈現區間震盪走勢，投資人需密切關注美股動向與新品供應鏈的後續拉貨效應。", "think": "面對大盤區間震盪，上班族投資不宜過度追高。此時正是檢視手中持股體質的好時機，特別是與蘋果供應鏈相關的個股，可趁回檔時分批布局。", "question": "你的投資組合中，是否有足夠的抗震資產來因應接下來的市場波動？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609060030.aspx", "name": "中央社"}]}, {"title": "宏碁深化輝達微軟Google合作 陳俊聖：AI落地端是優勢主場", "teaser": "宏碁攜手三巨頭搶攻AI終端", "full": "宏碁董事長陳俊聖指出，宏碁正持續深化與輝達、微軟及Google等科技巨頭的合作。他強調，AI技術在落地端（如AI PC等終端裝置）的應用是台灣硬體廠商的優勢主場，未來將持續推動硬體與AI應用的深度整合。", "think": "台灣在硬體製造的優勢正轉化為AI時代的門票。這提醒我們，AI不只是雲端運算，終端裝置的普及將帶來新一波換機潮，相關台廠供應鏈值得長期關注。", "question": "在挑選下一部工作電腦時，你會將AI功能納入首要考量嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609060022.aspx", "name": "中央社"}]}, {"title": "電價會前會沙盤推演 民生產業用電凍漲機率高", "teaser": "民生與產業用電凍漲機率高", "full": "經濟部即將召開電價費率審議會，在會前會的沙盤推演中，考量到物價穩定與民生負擔，民生用電及部分產業用電在本次審議中獲得凍漲的機率極高。這項決策有助於減緩國內通膨壓力，維持民生物價的穩定。", "think": "電價凍漲對上班族來說無疑是個好消息，能暫時舒緩荷包壓力。不過，長期來看能源轉型與電價合理化的趨勢不變，平時仍應建立節能省電的習慣。", "question": "面對未來可能波動的能源成本，你有哪些日常的省電妙招？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609060014.aspx", "name": "中央社"}]}, {"title": "能源管理法修法催生發電儲能需求 業者接獲諮詢商機浮現", "teaser": "能源法修法引爆儲能新商機", "full": "隨著能源管理法即將面臨修法，預期將強制要求特定用電大戶提升綠能與儲能設備比例。這項政策轉變已催生出龐大的發電與儲能需求，相關系統整合業者近期接獲大量諮詢，產業綠色商機正加速浮現。", "think": "綠能與儲能已從環保議題轉變為企業的生存剛需。這不僅是政策導向，更是未來幾年台股中極具成長潛力的板塊，投資人可多留意儲能概念股。", "question": "你所處的產業或公司，是否已經開始規劃因應綠能法規的對策？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609060020.aspx", "name": "中央社"}]}, {"title": "關稅牽動成衣版圖 台灣牡蠣殼將穿越馬達加斯加進歐洲", "teaser": "台灣牡蠣殼變身環保成衣闖歐洲", "full": "面對國際關稅變局，台灣成衣業者展現高度韌性。透過將廢棄牡蠣殼回收製成環保紗線，並巧妙利用馬達加斯加等地的關稅優勢進行加工，成功將高附加價值的環保服飾銷往歐洲市場，開創出獨特的綠色循環經濟模式。", "think": "傳統產業結合綠色科技，也能在國際關稅壁壘中找到新出路。這啟發我們，在面臨大環境轉變時，創新思維與靈活的供應鏈佈局才是企業永續的關鍵。", "question": "這則新聞是否讓你對台灣傳統產業的科技轉型與創意有了全新認識？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609050175.aspx", "name": "中央社"}]}], "robotics": [{"title": "香港首間機器人便利商店亮相 店員中粵英三聲道超吸睛", "teaser": "三聲道機器人店員香港吸睛亮相", "full": "香港首家引進機器人服務的便利商店正式開幕，其機器人店員不僅能流暢處理日常收銀與商品整理，更具備中文、粵語、英文三種語言的即時溝通能力。這種創新的零售模式吸引了大量市民目光，也展示了AI與服務業結合的無限可能。", "think": "無人零售與機器人服務正在從想像走入日常。身為消費者，我們即將迎來更便利的科技生活；但對服務業從業者而言，提升溝通深度與情感價值將是不可替代的關鍵。", "question": "如果家附近的超商都換成機器人店員，你會更喜歡還是覺得少了點人情味？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiYEFVX3lxTE9EOGlXY21TYnJ2TUtPY1YwUHN3RTgxamVWSFJfYVRhNm4zS0o5NEh0ZUYwRzE3ZWJqRzVJUTNyOWd3NVU2M25FYThmMVlhaGFsbXJVdGtZbVlOUmtyS2FMSQ?oc=5", "name": "民視新聞網"}]}, {"title": "再讀高盛研報，人形機器人上調到650 萬台、1383 億美元，物流倉庫正在成為第一個 \"戰場\"", "teaser": "高盛上調人形機器人市場預估", "full": "根據高盛最新研究報告，人形機器人的市場預估出貨量已上調至650萬台，市場規模上看1383億美元。報告指出，物流倉庫由於環境相對標準化且勞動力需求高，正成為人形機器人率先落地應用的第一個關鍵戰場。", "think": "機器人走入工廠與倉庫的速度比想像中更快。這代表自動化浪潮將大幅提升物流效率，而相關的感測器、馬達與演算法供應鏈，將是未來十年黃金成長期。", "question": "面對物流業的全面自動化，你認為這會如何改變我們日常的網購體驗？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiSEFVX3lxTE5ybUdhOXV6QndyRVZhTEg3bFVfb1k4eC02OENlc1lHX1U2VW9VWkpocEN2S0JYdG45OEt0QmRCZklacGhVemhQXw?oc=5", "name": "鉅亨號"}]}, {"title": "瑞士企業機器人普及率調查：採用率仍偏低", "teaser": "瑞士調查示機器人普及率偏低", "full": "一項針對瑞士企業的調查顯示，儘管自動化技術日新月異，但目前當地企業實際採用機器人的普及率依然偏低。許多中小企業仍受限於高昂的初期導入成本、技術門檻以及對既有工作流程調整的疑慮，對機器人技術持觀望態度。", "think": "科技進步與實際產業落地之間往往存在時間差。這提醒投資人，在追逐機器人概念股的熱潮時，也必須理性評估企業實際的接單與營收貢獻，避免過度泡沫化的期待。", "question": "阻礙你目前所在公司導入自動化設備的最大絆腳石是什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTFBQb0F4cjVQbEtVQjJXNUlCMDM3MVQ4cjhOWm5xRzRYQUxwR1RJeFlSRXJTeEZyY1M0MWZVSTVsVUtxTDVJNlBkWFZrSWpRLVVXOEw4UGhHdFloSl80SmY0d2h5ZlNmMDYzSmc?oc=5", "name": "Investing.com 香港 - 股市報價& 財經新聞"}]}, {"title": "華沿機器人發佈新一代HRC平臺：爲具身智能打造通用“小腦”，構築AI執行層新基建", "teaser": "華沿發佈新平台打造機器人小腦", "full": "華沿機器人正式發佈了新一代HRC平台，旨在為具身智能（Embodied AI）打造通用的「小腦」控制系統。該平台專注於提升機器人在複雜環境中的動作協調與物理執行能力，為人工智慧從虛擬走向實體構築了關鍵的執行層基礎建設。", "think": "如果大語言模型是機器人的「大腦」，那麼控制動作的「小腦」就是讓它能真正幹活的關鍵。這項技術的突破，將加速機器人從單一動作走向複雜靈巧的操作。", "question": "當機器人擁有更靈巧的動手能力，你最希望它幫你做哪一件繁瑣的家事？", "sources": [{"url": "https://news.google.com/rss/articles/CBMicEFVX3lxTFBiWmlZMmpDVUN4UUdVM0otd0c1MkpqRWxkOGJPSDlsZVd4Y3kzNHAxdzZDUmZHN2plZVN5VW5Ndk5xdE9MaEtSZ3Z5SUhTTWpNQUZ3SEh6dllZN21Rb0ZmaHpPQVBzMTZqQy1DRlBuU0Y?oc=5", "name": "Investing.com 香港 - 股市報價& 財經新聞"}]}, {"title": "D-Robotics亮相IFA 2026：驅動下一代家用機器人的計算平台", "teaser": "家用機器人全新計算平台亮相", "full": "在IFA 2026大展上，D-Robotics展示了其專為下一代家用機器人量身打造的先進計算平台。該平台具備強大的邊緣運算能力，能即時處理多重感測器數據，旨在驅動更聰明、更安全的家用輔助機器人，加速智慧家庭的普及。", "think": "家用機器人正從簡單的掃地機，演變成能理解環境、協助家務的智慧伴侶。邊緣運算晶片的進步，將使這些裝置不需依賴雲端，保障隱私的同時也更即時。", "question": "你願意讓一個具備高度運算與監控能力的機器人進入你的私密居家空間嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMimgFBVV95cUxPVDFLVHVOLU90dVR2R05tcjIyUVFyM0RHQUdyOGdBcWZ2SU9wYlhmeDNOcmdKZzMwRXBHLXR3Q1VCajAwVm9TZjRMTWc1X3dRbjAteEVTZS03UERJNmhFQVBBd09jM3VvT0NCY1JkWGQ3M2t6ZVlUdi1NN2I2NUhHUEZtd2Q1TngzaWIxNjEzVGtocHp0Y1BJZmNB?oc=5", "name": "富途牛牛"}]}], "tech": [{"title": "打破 AI 泡沫傳言，穎崴：真正難關在產能供不應求", "teaser": "AI晶片測試產能嚴重供不應求", "full": "面對市場上對於AI泡沫化的質疑，半導體測試介面大廠穎崴明確指出，當前真正的挑戰在於高階AI晶片測試產能嚴重供不應求。隨著AI晶片設計日趨複雜，測試時間與難度倍增，帶動相關半導體設備與耗材需求持續暢旺。", "think": "實體供應鏈的熱絡直接打破了「AI只是泡沫」的傳言。這代表AI基礎建設的硬體需求依然穩健，台灣半導體封測與測試介面等利基型廠商，在未來幾季的營收動能依舊強勁。", "question": "在市場雜音紛擾時，你是否能透過供應鏈的實際產能狀況來做出理性的投資判斷？", "sources": [{"url": "https://finance.technews.tw/2026/09/06/is-ai-bubble-bursting-winway-answered/", "name": "科技新報"}]}, {"title": "越懂 AI 越焦慮，研究指 43% 高認知勞工擔憂工作遭取代", "teaser": "高認知勞工對AI取代感到焦慮", "full": "根據最新研究調查，有高達43%的高認知勞工（如工程師、分析師等專業人員）對AI可能取代其工作感到焦慮，且呈現「越了解AI、焦慮感越重」的趨勢。這反映出AI在處理複雜邏輯與創造性任務上的進步，已對高階白領造成實質心理壓力。", "think": "焦慮源於對未來的未知。與其擔心被AI取代，不如主動將AI納入自己的工作流，成為「會用AI的人」，這才是上班族在數位轉型時代中保持不敗的最佳策略。", "question": "面對AI的快速演進，你目前採取了哪些具體行動來提升自己的「AI協作力」？", "sources": [{"url": "https://technews.tw/2026/09/06/ai-knowledge-deepens-replacement-concerns/", "name": "科技新報"}]}, {"title": "11 年大數據揭密，每天滑社群超過 2.5 小時成為憂鬱症預測指標", "teaser": "每天滑社群逾2.5小時易憂鬱", "full": "一項長達11年的大數據追蹤研究指出，每天使用社交媒體超過2.5小時的族群，罹患憂鬱症的風險顯著增加，成為重要的心理健康預測指標。過度的資訊碎片化與線上比較效應，容易在無形中加重現代人的精神負擔。", "think": "這對每天黏在手機上的通勤族與上班族是個警訊。我們在吸收理財與科技新知的同時，也需要適時進行「數位排毒」，保留時間給真實世界與內心的平靜。", "question": "檢查一下你的手機螢幕使用時間，你今天滑社群軟體超過2.5小時了嗎？", "sources": [{"url": "https://technews.tw/2026/09/06/social-media-depression/", "name": "科技新報"}]}, {"title": "AI 代寫程式碼時代來臨，但工程師的資安培訓跟上了嗎？", "teaser": "AI代寫程式普及引發資安隱憂", "full": "隨著AI輔助寫程式工具的普及，工程師的開發效率大幅提升，但同時也帶來了新型態的資安風險。研究指出，AI生成的程式碼可能潛藏安全漏洞，若工程師缺乏足夠的資安培訓與代碼審查能力，盲目採用恐將企業系統暴露於高風險之中。", "think": "科技是雙面刃，效率提升的背後往往伴隨著安全代價。在追求快速產出的時代，專業人員的「把關能力」與資安意識，反而成為企業最核心且無可取代的資產。", "question": "當工具讓工作變得更簡單時，你是否具備足夠的專業知識去驗證工具產出的正確性與安全性？", "sources": [{"url": "https://infosecu.technews.tw/2026/09/06/ai-code-engineers-cybersecurity/", "name": "科技新報"}]}, {"title": "迎戰淨零與缺工雙重挑戰，樺康智雲新品亮相 2026 Build for NextGen", "teaser": "樺康智雲推新品應對缺工與淨零", "full": "在2026 Build for NextGen大會上，樺康智雲發表了最新智慧建築與節能管理系統。該新品旨在透過AI自動化技術，協助企業在面臨嚴重缺工的困境下，依然能高效達成碳盤查與能源管理，同時解決營運人力不足與淨零碳排的雙重考挑戰。", "think": "綠色轉型與勞動力短缺是全球企業共同的痛點。能同時解決這兩個問題的智慧化方案，將是未來的剛性需求，也為軟體與系統整合廠商開闢了全新的藍海市場。", "question": "你的企業在面對淨零碳排的壓力時，是否已經開始評估使用智慧軟體來取代人力管理？", "sources": [{"url": "https://technews.tw/2026/09/06/huakang-smart-cloud-new-products-2026-build-nextgen-tackling-net-zero-labor-shortage-challenges/", "name": "科技新報"}]}]}}</script>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
