  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

<script type="application/json" id="slot-1300">{"date": "11月17日．週二", "tldr": "台股近期劇烈震盪引發市場關注，證交所信心喊話強調融資維持率無虞，建議投資人盤中保持冷靜，謹慎檢視手中持股，留意各產業在AI供應鏈中的實質影響與長期基本面變化。", "indicators": {"note": "今日四大指標全數重挫，反映美股科技股賣壓沈重，台積電ADR與費半指數同步領跌，顯示半導體與AI相關板塊正經歷劇烈且全面的市場修正。", "tiles": [{"label": "台股加權指數", "value": "40,092.11", "valueClass": "fall", "delta": "-8.20%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "24,509.76", "valueClass": "fall", "delta": "-2.49%", "deltaClass": "fall"}, {"label": "費半指數", "value": "9,610.65", "valueClass": "fall", "delta": "-5.28%", "deltaClass": "fall"}, {"label": "台積電ADR", "value": "373.45", "valueClass": "fall", "delta": "-6.34%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "台股2天跌3583點　證交所：信用交易擔保維持率充足", "teaser": "證交所信心喊話，市場融資無虞", "full": "近期台股面臨巨大賣壓，兩日內跌幅驚人。證交所公開表示，目前市場信用交易擔保維持率仍處於充足水準，呼籲投資人冷靜面對波動，勿過度恐慌。", "think": "大跌時投資人最怕斷頭風險，官方出面數據背書有助於緩解短期拋售壓力。但數據僅供參考，關鍵仍在於個股基本面是否惡化。", "question": "面對市場非理性下跌，你手上持有的資產是基本面支撐的價值股，還是投機性質的籌碼股？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611170291.aspx", "name": "中央社"}]}, {"title": "旺矽、倉和爆鉅額違約交割　合計金額6502萬元", "teaser": "盤中警訊，注意個股違約風險", "full": "市場震盪之際，傳出旺矽與倉和出現違約交割情況，兩者合計金額達6502萬元。此類事件通常反映部分槓桿操作過大的投資人資金周轉不及，需持續關注後續影響。", "think": "違約交割是市場進入恐慌期的訊號之一，容易引發個股短線籌碼混亂。對於這類公司，建議投資人先觀察股價在爆量後的穩定性，切勿急於接刀。", "question": "在槓桿交易盛行的環境下，你是否清楚自己承受風險的極限在哪裡？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611170281.aspx", "name": "中央社"}]}, {"title": "美國商會：台灣AI硬體實力突出　籲精準政策倡議不可少", "teaser": "AI硬體實力獲肯定，政策需跟上", "full": "美國商會指出，台灣在AI硬體供應鏈中扮演不可或缺的角色。面對全球技術競賽，商會建議台灣政府應持續推動精準的政策倡議，以鞏固並擴大這項競爭優勢。", "think": "硬體實力是台灣的護城河，但單靠硬體難以長期維持高溢價。未來政策若能引導軟硬整合，將是台股AI供應鏈轉型的關鍵。", "question": "當全球AI戰場從硬體轉向應用，你認為台灣產業還有哪些軟實力能發揮？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611170286.aspx", "name": "中央社"}]}, {"title": "玉山金前10月賺贏去年　黃男州：適度提高現金股利", "teaser": "玉山金獲利穩，預告提高配息", "full": "玉山金控今年獲利表現亮眼，前10月累計獲利已超過去年總和。董事長黃男州表示，基於穩健的財務體質，規劃將適度提高現金股利，回饋股東支持。", "think": "在市場動盪時，高殖利率與獲利穩定的金融股常成為避風港。提高配息對於長期存股族而言，是增強持股信心的一大誘因。", "question": "當市場波動加劇，你會選擇增加防禦性高股息股的配置嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611170294.aspx", "name": "中央社"}]}, {"title": "玉山金：台灣央行年底有升息條件　估升息半碼", "teaser": "金融機構預測，年底恐升息半碼", "full": "玉山金控預估，考量通膨壓力與經濟環境，台灣央行在年底前仍具備升息條件，幅度約為半碼。升息預期將影響銀行存放款利差，對金融股營運產生直接影響。", "think": "升息通常有利於銀行利差收入，但對房貸族與企業借貸成本則是負擔。投資人需衡量升息帶來的利多與經濟放緩的潛在風險。", "question": "如果央行確認升息，你認為這對你的資產配置會產生什麼樣的結構性影響？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611170282.aspx", "name": "中央社"}]}], "robotics": [{"title": "聰泰訂單看到明年第1季 衝刺機器人無人載具與智慧醫療等新品", "teaser": "訂單能見度佳，佈局醫療機器人", "full": "聰泰表示目前訂單能見度已達明年首季，公司正積極衝刺機器人、無人載具及智慧醫療等新產品線。透過多元化佈局，期望在工業與醫療自動化市場搶佔先機。", "think": "機器人應用已從單純的工業製造擴展到醫療與特殊場域。聰泰的轉型策略顯示，軟硬整合的垂直應用領域將是未來成長重點。", "question": "你認為機器人技術在智慧醫療領域，最先被普及的應用會是什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTE9NVnlDM2hDcGRRdXlRa3dSa2cwZ3ZSNXF3cFJDQTR4dkZ6aGFNNzNqUWlMU2lFZF9Ea01PZ2s0Rkp6SFdEOE1CLWJfR2g2VWNh0gFWQVVfeXFMTmZueUMzdXh2dTVJMENhcnAybWVpdEtxME9jU2M3X08tWFlCNmVKRVlidEVMSHBsdnlKS2JGMWMwWS0zdlF3WHdpRldETUowTXFvMUtTWUE?oc=5", "name": "UDN"}]}, {"title": "美國勞工成本增加 GM擬擴大自動化，供應商也要跟進", "teaser": "人力成本高漲，自動化需求爆發", "full": "美國勞工薪資成本持續攀升，促使通用汽車（GM）加速擴大自動化生產規模。這不僅是車廠的策略，更要求上游供應商同步跟進自動化，以維持成本競爭力。", "think": "當人力成本成為企業不可逆的負擔，自動化就從「選項」變成「生存條件」。這對機器人設備供應商而言，是長期且穩定的利多。", "question": "若自動化成為企業生存標配，哪些產業鏈會是這波轉型的最大受惠者？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFBLRTVkRWJ6X3kzb3JwTDJNdzRmNHZBMFREbmZ3UnAxWjlpa2xLYlZJaVM5QkdoeTlReDVBSHNDNDFkbklrUXBtSHdkb1IxbEY0bWdQTDV3?oc=5", "name": "優分析UAnalyze"}]}, {"title": "義彈琴機器人以53指精準演奏 人類詮釋樂章流露情感仍難取代", "teaser": "技術精準度提升，情感仍是關鍵", "full": "義大利最新研發的彈琴機器人具備53根手指，能極其精準地完成複雜樂章。然而，音樂界認為機器人雖能達到技術巔峰，但人類演奏時流露的情感深度，目前仍難以被機器取代。", "think": "這展現了科技的進步與極限，機器人擅長「執行」，而人類擅長「表達」。未來的機器人產業，重點或許在於如何賦予機器更多人性化的互動。", "question": "如果機器人能完美重現所有技術，你還會願意花錢聽人類現場演奏嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiS0FVX3lxTE8wX0Q1YnZqQURQQ3REbUdsUGV3NXdYNlQ3eWdmZmI2UDFBRmZoZGNZcm9ickNTWVFEV2xvcmUyZUtrdThRRTFHeUpKVQ?oc=5", "name": "公視新聞"}]}, {"title": "場景覆蓋最廣、部署數量最多 深圳智平方通用智能機器人服務「APEC 2026」", "teaser": "通用機器人落地，服務場景擴大", "full": "深圳智平方研發的通用智能機器人，此次在APEC 2026會議中負責多項服務工作。其不僅具備場景覆蓋廣的特性，更實現了大規模部署，象徵通用型機器人正走向實用化。", "think": "通用機器人意味著能適應多種環境，而非單一任務。這類產品的成熟是機器人產業普及化的關鍵里程碑。", "question": "若未來居家也有這種通用機器人，你最希望它幫你解決什麼瑣事？", "sources": [{"url": "https://news.google.com/rss/articles/CBMie0FVX3lxTE9aMlhYcjdrQUJaMHIwa1FseEdRVHlTUE1oaE1CU2JoTWdVaEJYMnNyaTU5ZGRpWVNnLW1OU0FXTjhtWHdUQWpDdVdaQTF5ei0wU0VNcW0zMWx1NzFpUGU0VjhmclRWVzhiOW10VTVCZERuOFZrTHdrVTdOcw?oc=5", "name": "香港商报"}]}, {"title": "盈趣科技：公司長期佈局工業測試機器人賽道，後續計劃依託系列工業具身機器人", "teaser": "深耕工業機器人，佈局具身智能", "full": "盈趣科技表示，公司長期深耕工業測試機器人領域，未來將持續依託具身機器人技術，推動工業自動化升級。透過結合感知與執行能力，提升產品在複雜產線的應用價值。", "think": "「具身智能」是目前機器人最熱門的發展方向，讓機器人像人一樣感知與行動。盈趣科技的佈局顯示，工業場景將是這類技術最先落地的戰場。", "question": "工業機器人從「自動化」進化到「具身智能」，對企業效率的提升幅度會有多大？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTE85d3IzWUpBYXRsTlFOTDV4TGpTT2VkaEQzdWJQYUh3VDRwdEM5OVhuUjJhMWxJSWI4YjN6ZnF1eWljTWVPM3hYWWNabTFjOUh1WUpQVTN2MVF4aXZ0REFvRGVmM2RidUZUZWc?oc=5", "name": "TradingView"}]}], "tech": [{"title": "美嚴控先進 AI 晶片出口，集邦：部分訂單可能遞延", "teaser": "出口管制影響，供應鏈調整中", "full": "美國針對先進AI晶片出口祭出更嚴格的限制措施。集邦科技指出，此舉將導致部分訂單被迫遞延或尋求替代方案，短期內將增加供應鏈運作的複雜度與成本。", "think": "地緣政治已成為科技業最大的變數。晶片出口限制不僅影響硬體銷售，更會改變全球科技研發的進程，投資人需密切留意相關廠商的客戶結構。", "question": "面對全球科技脫鉤風險，你認為哪種科技公司最能展現韌性？", "sources": [{"url": "https://finance.technews.tw/2026/11/17/us-tightens-control-advanced-ai-chip-exports-orders-delayed/", "name": "科技新報"}]}, {"title": "東元瞄準歐洲 AI 基建需求，模組化資料中心最快 9 個月交付", "teaser": "搶攻歐洲AI基建，加速交付", "full": "東元電機積極瞄準歐洲AI資料中心基礎建設需求，推出模組化解決方案。透過標準化設計與模組化組裝，最快可在9個月內完成交付，滿足市場對AI算力快速擴張的迫切需求。", "think": "AI不僅是晶片，更需要龐大的機房與電力基礎設施。東元的模組化策略能有效縮短建置期，這在講求速度的AI時代是極大競爭優勢。", "question": "除了晶片廠，你是否注意到伺服器與能源基礎設施也是AI賽道的要角？", "sources": [{"url": "https://technews.tw/2026/11/17/teco-targets-european-ai-data-center-market-hulk-modular-solution-fastest-9-month-delivery/", "name": "科技新報"}]}, {"title": "馴服 AI 吞電怪獸！雲鑠攜緯創導入 WATS 架構開拓 AIDC 商機", "teaser": "解決耗電挑戰，開拓算力商機", "full": "針對AI運算帶來的巨大電力消耗，雲鑠攜手緯創導入WATS架構，旨在優化能源效率。此合作不僅回應了AI對能源的需求，也積極開拓AI資料中心（AIDC）的市場商機。", "think": "AI的盡頭是能源，這句話一點也不假。能協助資料中心「節能」的公司，價值將與提供「算力」的公司同等重要。", "question": "在AI能源需求暴增的未來，綠能與節能科技是否已成為你的投資組合標的？", "sources": [{"url": "https://finance.technews.tw/2026/11/17/yunova/", "name": "科技新報"}]}, {"title": "晶片散熱迎接新解方：科學家將玻璃拉至「單原子寬」，意外解鎖極限熱傳導", "teaser": "散熱新突破，玻璃材料潛力大", "full": "科學家在實驗中將玻璃拉伸至單原子寬度，意外發現其具備極佳的熱傳導性能。這項發現為晶片散熱技術提供了全新解方，有望解決未來高功耗晶片的散熱瓶頸。", "think": "科技創新往往來自意外的發現。若此技術能商用化，將大幅改變現有散熱模組的設計，對散熱產業產生顛覆性影響。", "question": "如果玻璃能取代部分金屬散熱，你認為哪些現有的散熱大廠會面臨轉型壓力？", "sources": [{"url": "https://technews.tw/2026/11/17/single-atom-glass-revolutionizes-chip-cooling/", "name": "科技新報"}]}, {"title": "55 吋 E Ink Marquee 彩色資訊看板進駐國資圖，結合生成式 AI 互動", "teaser": "電子紙結合AI，智慧顯示應用", "full": "國資圖引進55吋E Ink彩色電子紙資訊看板，並結合生成式AI技術。此應用不僅具備電子紙低耗電特性，更透過AI即時互動，提升了公共資訊看板的應用層次與效率。", "think": "電子紙技術正從閱讀器走向智慧顯示看板。結合AI後，電子紙能根據環境變化動態調整內容，是智慧城市發展中的重要一環。", "question": "你認為電子紙技術在未來的智慧城市中，還有哪些場景可以發揮潛力？", "sources": [{"url": "https://technews.tw/2026/11/17/55-inch-color-epaper-signage-rolled-out-at-nlpi/", "name": "科技新報"}]}]}}</script>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
