  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

線。", "think": "當AI能力越來越強，如何確保它受人類控制成為全球共識。這不僅是技術問題，更是企業治理與社會責任的重要課題。", "question": "在追求AI高效能的同時，你覺得底線應該畫在哪裡？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202610110193.aspx", "name": "中央社"}]}, {"title": "美債殖利率高檔震盪　銀行業前8月累計加碼債券6890億元", "teaser": "國銀前8月加碼美債", "full": "在美國公債殖利率維持於高檔震盪之際，國內銀行業看準收益率機會，前八個月累計加碼債券金額逼近7,000億元大關。金融機構透過拉高固定收益資產配置，來穩定中長期的利息收入。", "think": "金融業大舉加碼債券，反映出法人機構對高利率環境的資金配置策略。對一般人來說，債券在資產配置中扮演著平衡風險與賺取穩定收益的關鍵角色。", "question": "你會考慮在目前的高利率環境下，調整自己的現金與債券配置嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610110165.aspx", "name": "中央社"}]}], "robotics": [{"title": "人形機器人供應鏈啟動！輝達傳砸 10 億美元，台廠視覺與記憶體商機爆發", "teaser": "人形機器人台廠商機熱", "full": "市場傳出輝達計畫砸下重金佈局人形機器人領域，帶動相關供應鏈熱度全面點火。其中，台灣在感測視覺、記憶體等關鍵零組件的優勢再度被點名，有望迎來新一波爆發性的訂單商機。", "think": "AI從虛擬世界走向實體機器人（具身智能），硬體需求將全面升級。台廠在精密製造與電子零組件的底子，將是這波浪潮中不可或缺的軍火商。", "question": "你期待家裡或辦公室出現的第一個具身智能機器人會是什麼功能？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiggFBVV95cUxPUFNKVURaNUIxYnhaaGJ6SnlFbFVWdTdmWUktajBMQ0lUSkdsTHdrY3JTUFhoNk5rWGZlQ0QwVHZjemZ0X3VadWNoTzlURnNzTDFHNGlVbmhSd2doWGlHcGRxU0tRbGZMUUd6Y29fWVpGS1p1Y0Z4QlZoTnhucWwyekRn?oc=5", "name": "CMoney投資網誌"}]}, {"title": "AI加持機器人廠安川電機訂單破紀錄上修純益預估", "teaser": "安川電機訂單創紀錄", "full": "受到人工智慧與自動化需求的強勁加持，知名機器人與自動化大廠安川電機近期接單金額打破歷史紀錄，並同步向上修正全年的純益預估。這顯示全球製造業對智慧自動化的投資力道不僅沒有減弱，反而持續加速。", "think": "傳統工業大廠結合AI後展現出強勁的獲利爆發力，證明自動化不只是題材，更是企業因應缺工與效率提升的剛性需求。", "question": "當各行各業都在拼自動化，你的職位會受到什麼樣的影響？", "sources": [{"url": "https://news.google.com/rss/articles/CBMikgFBVV95cUxPMWh2b2NCa2pSRk0xNC1idnNXRnNSQ3dfbW1sUlljRXlXdUtKQUpicDJaM3lDQ0M5WENKSGlCOG1jRWV4c1JBNjJVOG1ZZzNCOTJGcVFKc0RQOUo5MGhLSXlPWng5cHl3SkNhNW1HSXlyaDlxUFZ2b3VPeW9kM21paGxQdEM4bjA2eFlxVVE2THRzZw?oc=5", "name": "MoneyDJ"}]}, {"title": "【Atlas 頭部設計邏輯】拿掉人臉改用燈環，讓人類同事秒懂機器人在看哪裡、做什麼", "teaser": "人形機器人溝通設計", "full": "針對新一代人形機器人Atlas的頭部設計，開發團隊捨棄了擬人化的五官，改以直覺的燈環來向人類同事傳達機器人的視線與運作狀態。這種設計不僅降低人類的詭異感，也大幅提升人機協作時的安全與效率。", "think": "機器人不一定要長得像人才能與人合作，如何讓人機互動更自然、更直覺，是工業設計的新顯學。科技必須遷就人類的心理舒適圈。", "question": "你覺得未來機器人同事需要長得像人類，還是像工具一樣就好？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFBNQnM3SXBjVWtlUFdDcjY5YVdheWZ5ZTNXNmtvZnAzNGFVVTd6b1A4aU1YbkpfTEhHRTlURjBIQ0RzWndILWZnc3NCanpKal9KUHlnMkZn?oc=5", "name": "LINE TODAY"}]}, {"title": "AI真的會叛變？專家揭露「末日真相」：不是機器人覺醒，問題出在資安沒做好！", "teaser": "專家揭AI末日真相", "full": "針對大眾擔心的AI叛變與科幻電影情節，資安專家指出真正的末日危機其實不是機器人自我覺醒，而是底層系統的資安防護沒做好遭到駭客利用。人類對於系統漏洞的忽視，才是目前最具威脅性的隱憂。", "think": "我們常常把焦點放在AI有多聰明，卻忽略了它背後的資安漏洞有多脆弱。隨著萬物聯網，資安就是國安，也是企業營運的生命線。", "question": "你認為目前企業對AI系統的資安防護措施足夠嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMie0FVX3lxTE8zX1I3TFl0Y19tMWxZZTVHclR5bU9td0xmeVM5Rm1ITnpQc0M5aXJ1bUhBUi10emU1OXM1dHMzcjNSUVliRHpmVXVva3JnT0o2T1RsX0NJSElIYjRqTmt5YmhoSWc4UnJDNjRZVm5TUXVpVE8tajRwZFN2RQ?oc=5", "name": "T客邦"}]}, {"title": "迎戰「具身智能」革命 清華攜手 TVBS 10/17 探討機器人突圍關鍵", "teaser": "產學攜手探討機器人", "full": "為了迎戰即將到來的「具身智能」產業革命，學術界與媒體將共同舉辦大型論壇，深入探討台灣在機器人浪潮中的突圍關鍵與機會。產官學界齊聚一堂，希望為台灣找出最具優勢的切入點。", "think": "具身智能被視為下一個兆元級產業，台灣不能缺席。產學合作加速人才培育與技術落地，是台灣產業轉型的重要推動力。", "question": "台灣除了半導體外，你覺得還有什麼優勢能在機器人時代勝出？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTE03T0VpX09zZ0NMYm5wT2ktdzFmZDJnQzFHazR5aDFvaUZtRGtzeWFkSzQ4eGpmdk8xM2xRNFVSNC1UTzZ3ZmJhdjVscV9Zdw?oc=5", "name": "TVBS新聞網"}]}], "tech": [{"title": "三星晶圓代工越來越看不到台積電車尾燈，第三季市占率將進一步擴大", "teaser": "台積電第三季市占續擴", "full": "根據最新產業觀察，在先進製程與客戶信任度的高牆下，三星晶圓代工與台積電的差距持續拉大，預期第三季台積電的全球市佔率將再度顯著擴大。台積電憑藉穩定的良率與客戶群，穩坐晶圓代工龍頭寶座。", "think": "護國神山的競爭優勢來自長年累積的製程良率與客戶夥伴關係。這告訴我們，在任何領域建立難以被取代的壁壘，才是企業生存的王道。", "question": "你認為台積電能在晶圓代工維持領先地位的最核心關鍵是什麼？", "sources": [{"url": "https://technews.tw/2026/10/12/samsungs-foundry-business-cant-catch-up-with-tsmc/", "name": "科技新報"}]}, {"title": "LGD 發表次世代 OLED 技術「FLiPP」，亮度、壽命大升將優先導入 IT 產品", "teaser": "LGD發表次世代OLED", "full": "南韓面板大廠LGD正式發表次世代OLED顯示技術「FLiPP」，在面板亮度與使用壽命上都有大幅度的升級突破，未來將優先導入高階IT產品線中。面板技術的革新正持續改變消費者的視覺體驗。", "think": "螢幕顯示技術的不斷精進，背後是龐大的研發競賽。對於喜歡追求最新3C產品的消費者來說，更高亮度與更長壽命的面板將帶來更優質的辦公體驗。", "question": "你在選購筆電或平板時，螢幕顯示技術會是你最在意的選項嗎？", "sources": [{"url": "https://technews.tw/2026/10/12/lg-display-to-prioritize-flipp-oleds-for-laptops-monitors/", "name": "科技新報"}]}, {"title": "AI重寫半導體競爭規則，從晶片競賽走向「學習速度」之戰", "teaser": "AI改寫半導體競爭規則", "full": "科技評論指出，人工智慧的崛起正在徹底重寫半導體產業的競爭規則，未來的勝負關鍵不再只是單純的晶片效能競賽，而是演變為企業組織與系統的「學習速度」之戰。誰能更快將AI導入研發與製造，誰就能贏得先機。", "think": "速度決定一切，這不僅適用於晶片設計，也適用於我們每個人的職場競爭力。停止學習，就等於被時代淘汰。", "question": "面對AI時代，你覺得自己的「學習速度」有跟上腳步嗎？", "sources": [{"url": "https://technews.tw/2026/10/12/kla-semicon-taiwan-2026-keynote/", "name": "科技新報"}]}, {"title": "美專家：沒有台灣就沒 Google 微軟輝達，台企應多訪美建立品牌形象", "teaser": "美專家肯定台灣關鍵地位", "full": "美國科技專家公開表示，當今全球科技巨頭如Google、微軟與輝達等，背後都少不了台灣供應鏈的支持，台灣的角色至關重要。專家建議台企未來應更積極赴美交流，建立自主的國際品牌形象。", "think": "台灣過去多以代工隱身幕後，但在地緣政治與AI浪潮下，走向幕前建立品牌影響力是必經之路。這也是台灣軟實力升級的好機會。", "question": "你覺得台灣企業該如何向世界展現我們不只是「代工廠」的價值？", "sources": [{"url": "https://technews.tw/2026/10/12/us-expert-no-taiwan-no-google-microsoft-nvidia-taiwanese-firms-visit-us-build-brand-image/", "name": "科技新報"}]}, {"title": "費半收黑逢台積法說前夕，短線多空籌碼激烈交戰，緊盯南亞科買盤與欣興合規風暴", "teaser": "費半收黑多空交戰", "full": "在費城半導體指數收黑以及台積電法說會即將登場的雙重背景下，台股短線多空籌碼交戰異常激烈。市場資金除了盯緊權值股外，也同步關注記憶體大廠南亞科的買盤動向以及載板廠欣興的相關風暴。", "think": "短線盤勢震盪難免，投資人情緒容易隨消息面起伏。在多空交戰之際，保持資金彈性與檢視手中持股的基本面，比盲目追高殺低更重要。", "question": "麵對短線多空激戰，你的應對策略是保持觀望還是逢低佈局？", "sources": [{"url": "https://finance.technews.tw/2026/10/12/sox-falls-tsmc-earnings-call-short-term-bull-bear-battle-intensifies-nanya-tech-buying-unimicron-compliance-storm/", "name": "科技新報"}]}]}}</script>

<script type="application/json" id="slot-2000">{"date": "10月11日．週日", "tldr": "台股面臨美科技股拉回與專利調查雙重考驗，市場靜待台積電法說會指引；AI與機器人實體應用則持續加速落地。", "indicators": {"note": "美股科技股分歧拖累台股短線承壓，費半與台積電ADR微跌顯示市場在重磅法說前態度轉趨觀望。", "tiles": [{"label": "台股加權指數", "value": "49,313.44", "valueClass": "fall", "delta": "-0.99%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "27,366.17", "valueClass": "rise", "delta": "+0.64%", "deltaClass": "rise"}, {"label": "費半指數", "value": "12,572.42", "valueClass": "fall", "delta": "-0.41%", "deltaClass": "fall"}, {"label": "台積電ADR", "value": "453.31", "valueClass": "fall", "delta": "-1.02%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "美科技股壓回　投顧：台股本週聚焦台積電法說會", "teaser": "本週台股聚焦台積電法說會", "full": "隨著美股科技族群短線回檔整理，市場風險偏好轉趨保守，法人普遍認為台股本週走勢將由權值龍頭台積電法說會定調。投資人高度關注晶圓代工先進製程稼動率及未來營運展望，這將是台股能否止跌回穩並挑戰新高的關鍵風向球。", "think": "當大盤處於震盪區間時，盲目追高容易承擔過多短線波動。看懂權值股法說會釋出的產業訊號，有助於釐清半導體景氣真實循環，做出更客觀的部位調整。", "question": "面對重量級法說會引發的市場波動，你的持股配置是否保留足夠的風險緩衝空間？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610110117.aspx", "name": "中央社"}]}, {"title": "美國啟動337調查鴻海台達電廣達入列　業者：依程序積極應對", "teaser": "美啟動調查台系代工積極應對", "full": "美國國際貿易委員會針對特定電子元件啟動專利侵權相關的337調查，鴻海、台達電與廣達等台灣代工大廠皆列入名單中。相關業者迅速回應將依正常法定程序積極應對，目前並未對日常營運造成實質干擾，供應鏈合作關係維持穩健。", "think": "台灣電子廠身處全球供應鏈核心，遭遇專利爭端已是跨國競爭常態。投資人毋須對單一調查過度恐慌，應持續觀察廠商法律應對能力與專利護城河。", "question": "供應鏈專利訴訟頻傳的時代，你評估一家科技代工廠時會特別留意其智財實力嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610110175.aspx", "name": "中央社"}]}, {"title": "美債殖利率高檔震盪　銀行業前8月累計加碼債券6890億元", "teaser": "銀行業前八月大舉買進美債", "full": "美國公債殖利率持續在高檔區間震盪，吸引國內銀行業把握鎖定優質利差的機會，前八個月累計加碼債券規模逼近七千億元大關。金融機構藉由配置高殖利率固定收益資產，不僅能穩定利息收益，也為未來降息循環儲備可觀的資本利得潛力。", "think": "機構法人大筆資金逢高建倉債券，顯示高息環境下的資產配置具備極高性價比。一般投資人亦可借鏡此思維，在資產組合中適度納入債券部位以平衡股價波動。", "question": "在利率高檔盤整之際，你的投資組合是否也開始規劃固定收益資產的配置？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610110165.aspx", "name": "中央社"}]}, {"title": "金融時報：輝達討論加強投資或收購Reflection AI", "teaser": "輝達傳研擬入股新創擴張版圖", "full": "外媒報導晶片巨頭輝達正積極評估深化投資或直接收購新創公司Reflection AI，顯示其在AI軟 <script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
