  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

膨壓力。對於通勤族和一般消費者而言，這意味著未來的物價與加油成本有望稍微減輕。", "question": "政府與國際組織干預自由市場價格，長期來看會帶來哪些潛在的副作用？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202610020338.aspx", "name": "中央社"}]}, {"title": "東元大舉投資擴建新加坡與印尼據點，深化東南亞佈局", "teaser": "東元砸重金深耕東南亞", "full": "台灣重電大廠東元宣布，將投資不超過十二點七一億元台幣，用於擴建其在新加坡和印尼的業務據點。此舉旨在積極搶占東南亞快速成長的綠能與工業自動化市場商機。", "think": "隨著地緣政治風險上升，台廠「去風險化」與分散佈局已成常態。東元深耕東南亞，不僅能分散單一市場風險，更能搭上東協國家製造業轉型與綠能基礎建設的順風車。", "question": "身為上班族，你是否有感受到身邊企業往東南亞發展或外派機會增加的趨勢？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610020335.aspx", "name": "中央社"}]}], "robotics": [{"title": "美光瞄準人形機器人與自駕車，實體AI成下一波動能", "teaser": "美光看好實體AI新商機", "full": "記憶體巨頭美光表示，未來將大力布局人形機器人與自動駕駛車輛領域。美光認為，隨著「實體AI」的快速興起，這些需要強大運算與儲存能力的硬體裝置，將成為記憶體產業的下一個重大成長引擎。", "think": "機器人不只需要聰明的大腦（軟體），還需要強大的感官與記憶能力。美光的表態證實了硬體零組件升級的商機才剛開始，台灣相關的記憶體與半導體供應鏈將能持續受惠。", "question": "當AI從虛擬螢幕走入實體世界（如機器人），你認為最先被改變的會是哪個行業？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiT0FVX3lxTE9PR0g1N0F6aUlkQ1VQU09rV05HMmNKQVEyQ2pfejRqM3dIaktISFQtOVcxQlpkOVB6M1JrYlFVV0FzdWRTTENfeUh0NGtWUm8?oc=5", "name": "news.cnyes.com"}]}, {"title": "輝達前員工掀起出走創業潮，引領機器人與實體AI新創", "teaser": "輝達前員工引領創業潮", "full": "隨著AI技術爆發，許多輝達的前員工紛紛選擇離職創業。這股出走潮將頂尖的晶片與演算法技術帶入市場，並聚焦於機器人與實體AI領域，正掀起一波全新的科技新創浪潮。", "think": "頂尖人才的流動往往是產業爆發的前兆。就像當年矽谷半導體人才開枝散葉一樣，輝達人才外溢到機器人新創，將加速實體AI產品的商用化進程，值得投資人密切追蹤這些新興公司。", "question": "如果你有機會加入一家由頂尖科技巨頭員工創立的新創公司，你會最看重什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMinAFBVV95cUxPaDgzQ3Rsb1h4LWFHVjRGQl9nWUtDVjNtZTE2QUJJYjRXdFNwSUg3LXNLWW1tQjU1eC1DQUl4TjRqVmRpQTRKUEtjeWhldVNpbkwzazdQTWxtV0tFeHFxc2pEUGRub3pBUXgyVkdGbFVReWtrRUpRUU94R3ZpSHVsMU5UcG9oRzhjN2Q2WEdOOFZnMlpFWThGZGNoSTg?oc=5", "name": "TechNews 科技新報"}]}, {"title": "阿特拉斯人形機器人新機械手亮相，展現精細操作能力", "teaser": "阿特拉斯新機械手超靈活", "full": "知名人形機器人「阿特拉斯」最新展示了其全新設計的機械手。在展示中，該機械手能夠精準地執行指尖旋轉小螺母並進行緊固等高難度動作，展現了極為細緻的手部操作與控制能力。", "think": "機器人要走入工廠或家庭，最難克服的就是「手部細微動作」。阿特拉斯展現的精細操作，意味著機器人離替代人類進行複雜組裝、維修等精細工作的日子又更近了一步。", "question": "當機器人連旋轉螺絲這種細微動作都能做得比人類更精準時，人類工匠的價值該如何重新定義？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiZkFVX3lxTE43dmJqZ0FpVUNwMldKYml3LUpidkgxc1FVQ2JkRnFzdzNsUjVtN3I3ajd3WjFFMTJ4OGxGaW5YVk9HZ2RiWVBHdEUwQzVTUzJqT2E4NUl2cF9WWkM0dmRfYUxGR0NwUQ?oc=5", "name": "동아일보"}]}, {"title": "人形機器人產業加速，台灣供應鏈積極爭取卡位", "teaser": "人形機器人台廠卡位戰", "full": "隨著宇樹科技計劃上市、特斯拉Optimus積極擴產，人形機器人產業在2026年前景看好。台灣憑藉著強大的精密機械與電子代工實力，相關供應鏈廠商正積極卡位，爭取關鍵零組件的訂單。", "think": "人形機器人本質上是精密機械與AI的結合體。台灣在伺服馬達、減速器、感測器等領域有深厚基礎，這波機器人熱潮有望為台灣傳統精密機械業帶來轉型升級的巨大契機。", "question": "你認為台灣在機器人供應鏈中，最具有競爭優勢的是硬體製造還是軟體整合？", "sources": [{"url": "https://news.google.com/rss/articles/CBMitgRBVV95cUxOc3d6QjYxeGR3b1ZnTWRCNDRSVVdTUGtZSE1SaXpjdDRCcnhFN01PcjFmSHNlRDA3UW5KZFhlQzI1NzhyOS1PM29ZNFZJMGtHYms4WXllRFRyT0t5TnpfQWJHR0NNXzNFd2lnbFlOeVFMb2VKS0poSmhaSmJoZnQ2ekFpRlNVZHpQYTUxZXZuUFV5cS1rbXhaZm9XSzR3Tk9LWmhlY3UxT19DbE5hZER1d2JraG5jNmx0VFJjazBGTjR2T2N5RkJXX0NjSm1XWVRvaDY1cGQzMUt5VjkyVm91aGNfUjg2SERQMllNbkRFVjFVcVZaWUdMUlhMelMta3ZtbmxrbTRoT2RHdWNKTWtCb2Z4SDFRR3J2TXpydG8waXN3STdJaDgyalE5MWdOb0hyWGR1OWpfOGhyc1JyYnZKQmcxeFowNzJHVlFsNzJsMDNONkhPVWVQOElOakgxbzlEajBjQXlETjN6V3hUT21pVERmbkFhVDUyRkg0Z1Iwb2dNd1VGVUFhcUdBRHdQSDJNSG1MM1h5OGpKeDBxSy04TzlMWGUwemVlTGNWUkk0dzhrS29oV3lLSUpibWRwX2F0eXZqMlZ6Z1hKcGNuMjluUG45Z011RENScWgwRUs3ZzIzRDJkd2ZHel91NW5NZEVmZURydW5HQ2lvekJ6b1NMaHFJQlc1aFVlelpTWkVEX0N2d2t5WnF3QW9KbFA5V2c1alN0WnpXMkVaa1JxWll5T3czem14UQ?oc=5", "name": "sinotrade.com.tw"}]}, {"title": "杭州成立首家機器人學校，培養首批持證上崗專業人才", "teaser": "機器人專門學校正式開課", "full": "杭州正式開設了機器人學校，首批三十名新生將接受專業的分科受訓。學員在完成學業並通過考核後，將獲得專業證照，正式持證上崗，為產業提供急需的機器人操作與維護人才。", "think": "機器人產業的普及，催生了全新的職業需求。未來不只是研發機器人的人才吃香，懂得操作、維修、設定機器人的「藍領技術員」也將成為就業市場的新藍海。", "question": "面對自動化時代，我們該如何培養自己與機器人協同工作（人機協作）的能力？", "sources": [{"url": "https://news.google.com/rss/articles/CBMibkFVX3lxTE1WRlJabGhndGd5azlSLV9ZQmxxYnJDU0hoWjRzeDV2YUxMZU1idEFzSi1VOEV3YWlyWkI3a3pQRHZZdGxaZFZ5Rlg2WDNPRFkydkZKNzFIUUVYT1VRSnN3b2FOLS1rUEw3N3JldlN3?oc=5", "name": "中時新聞網"}]}], "tech": [{"title": "記憶體太貴！輝達改推64GB版本DGX Spark搶攻市場", "teaser": "輝達因記憶體貴推平價版", "full": "由於高頻寬記憶體價格居高不下，導致輝達128GB版本的DGX Spark價格飆破六千美元。為了降低客戶採購門檻並快速搶占市場，輝達決定改變策略，推出規格減半的64GB版本。", "think": "這顯示出AI硬體供應鏈中，記憶體成本已成為不可忽視的瓶頸。輝達向下修正規格以求銷量，暗示著市場對於高性價比AI設備的需求正在上升，這也考驗著記憶體大廠的定價策略。", "question": "面對昂貴的硬體成本，企業在導入AI技術時，應該追求頂級效能還是實用性？", "sources": [{"url": "https://technews.tw/2026/10/03/nvidia-64-gb-dgx-spark/", "name": "科技新報"}]}, {"title": "當AI開始自主開發AI，安全機制的「一鍵關機」恐成幻想", "teaser": "自主AI讓安全控制面臨挑戰", "full": "科技研究指出，隨著AI開始具備自主開發與優化AI的能力，現有的安全防護機制恐遭破解。過去人們寄望的「一鍵關機」等物理防線，在高度複雜且分散式的AI系統面前，可能將淪為不切實際的幻想。", "think": "這不僅是科幻小說的情節，而是當前科技界必須面對的真實安全風險。當AI演算法的演進速度超越人類理解時，如何建立有效的監管與安全框架，已是刻不容緩的課題。", "question": "如果未來的AI真的無法被人類完全控制，我們是否應該限制其自主演化的深度？", "sources": [{"url": "https://infosecu.technews.tw/2026/10/03/what-is-an-ai-kill-switch-and-does-it-work/", "name": "科技新報"}]}, {"title": "ChatGPT推出AI虛擬試穿功能，上傳照片即可模擬穿搭", "teaser": "ChatGPT推虛擬試穿功能", "full": "ChatGPT最新推出虛擬試穿功能，用戶只需上傳自己的個人照片，系統便能透過AI技術精準模擬出各種服裝的穿搭效果。這項技術有望徹底顛覆傳統的線上購物體驗。", "think": "這是生成式AI落地應用的極佳範例。將AI融入電商與零售，不僅能提升消費者的購物樂趣、降低退貨率，也為品牌電商開創了全新的行銷與互動模式。", "question": "這種AI虛擬試穿功能，會讓你更願意嘗試在網路上購買平常不敢穿的衣服風格嗎？", "sources": [{"url": "https://technews.tw/2026/10/03/chatgpt-adds-virtual-try-on-for-clothes/", "name": "科技新報"}]}, {"title": "台積電2奈米全數拿下高通訂單，三星重返供應鏈夢碎", "teaser": "台積電2奈米完勝三星", "full": "晶圓代工龍頭台積電憑藉技術優勢，成功一單不漏地全數拿下高通下一代2奈米晶片訂單。原本寄望藉此重返高通供應鏈的三星電子，最終再度落空，凸顯台積電在先進製程的霸主地位。", "think": "台積電在先進製程的良率與技術領先，讓對手難以望其項背。這不僅鞏固了台積電的獲利，也顯示出全球頂尖IC設計大廠在最關鍵的產品上，依然高度依賴台灣的製造實力。", "question": "面對台積電在先進製程的絕對壟斷，你認為這對全球半導體產業的健康發展是利大於弊嗎？", "sources": [{"url": "https://finance.technews.tw/2026/10/02/samsung-hopes-to-rejoin-qualcomms-supply-chain-by-leveraging-its-2nm-technology/", "name": "科技新報"}]}, {"title": "顛覆20年「零工廠」模式，Nike布廠竣邦砸10億赴越建廠", "teaser": "竣邦砸10億越建廠改寫模式", "full": "作為Nike重要布料供應商的竣邦，宣布將打破過去長達二十年的「零工廠」輕資產獲利方程式，決定砸下十億元台幣重金前往越南建立自有工廠。此舉旨在提升供應鏈自主性與應對地緣政治變化。", "think": "從「輕資產」轉向「重資產」建廠，反映出在全球供應鏈重組下，擁有實體製造產能的掌控力，已變得比單純的設計與貿易更為重要。這也是台廠在地緣政治下不得不做的彈性調整。", "question": "在地緣政治不確定性高的時代，你認為企業應該追求「輕資產靈活性」還是「重資產掌控力」？", "sources": [{"url": "https://finance.technews.tw/2026/10/03/jb-international-inc/", "name": "科技新報"}]}]}}</script>

第一線救災人員的傷亡風險。", "think": "AI與機器人最溫暖的應用，莫過於保障人類的生命安全。隨著感知晶片與演算法的進步，特種機器人在防災、救難領域的商用市場正悄然興起，值得投資人長期關注。", "question": "除了消防救災，你認為還有哪些高風險行業最需要這種AI感知機器人的協助？", "sources": [{"url": "https://news.google.com/rss/articles/CBMi3gJBVV95cUxQU3g5U3ZfamR4SlVXMGFTdFRqTXhkSndaa083TkNrZFlydDB5OXZ5MEduN1AwMGctenVmcFVsRXdJVi1SZTk4aG9hdjRUTEZpYlBfMHp3aXE2TnZNekJmYmJEUXN3TkxMUnpMbXlUX2o4RmhFMWsyYkdUNUZNTjNsZGQyV1dMaWNWZzdBNC1MdVc1QTR5cmtEbzdSY29yeVZDMmptTFVlT0dja2xLUF9LSUx6YXVHd1N0b2E0V2RYMXhhemRkeldSUWhwSWdFWlIwcGpVUzZIVDhrSk9UM05WeHZCWFNDZzZMYmdKZDQ1YmR1NXR4N2dCWURyR2dELVBnMHJzVzBVTG1mLWxMdm91eExBZ1d4Q0NqcHVWQVE0OGR1NHQ5MUtTUXRXMUZNZlVsbHo2RnpnTTk5aHlzYy1MZDl0WHJoY1hZakRBaXlVNFhDZVN4R0pWVWtCX0lXQQ?oc=5", "name": "Yahoo新聞"}]}, {"title": "製造業導入機器人卡關？「蜘蛛構型」反成船體作業最適解答", "teaser": "蜘蛛機器人破製造難題", "full": "許多製造業在導入傳統機器手臂時，常面臨裝設困難、動作遲鈍等瓶頸。然而，最新研究發現，採用「蜘蛛構型」的多足機器人，因為具備極佳的靈活性與多角度適應力，反而成為在複雜船體內部進行焊接與檢測作業的完美解決方案，成功破解產業痛點。", "think": "這證明了在工業自動化的過程中，沒有最好的機器人，只有最適合特定場景的設計。這也提醒我們在投資自動化設備類股時，應深入了解其產品是否真正切中客戶的應用痛點。", "question": "在尋找投資標的時，我們該如何評估一家機器人公司解決特定產業痛點的能力？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVEFVX3lxTE9SUzJoRTZNd01vUDBUU2pyOVZzbWg5cU5XRC1yWDZ5ZUFWd2NPYnhDZjZSQS1qc3hLbkQ5bjFWTjZCYWQzcS1IQ0xlekd4QVNyaWVRZA?oc=5", "name": "未來商務"}]}, {"title": "機器人利空襲來？馬斯克坦言 Optimus 人形機器人面臨量產難關", "teaser": "馬斯克坦言量產卡關", "full": "特斯拉執行長馬斯克近期透露，儘管 Optimus 人形機器人技術持續進步，但在進入大規模量產的階段時，依然面臨極大的供應鏈與製造成本挑戰。這項坦言引發市場對於人形機器人商用化時程是否會延後的疑慮，也讓相關概念股增添了些許不確定性。", "think": "從實驗室走向工廠流水線，量產與成本控制永遠是科技落地最難的一關。這提醒投資人對於熱門的機器人題材應保持理性，避免過度追高，並耐心等待供應鏈成熟。", "question": "面對馬斯克坦言的量產難關，這會是相關供應鏈概念股的買點還是警訊？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiXEFVX3lxTE41N0dpXzBGVS1jNDIyUTVSaDZBTWhKenF5bVdaVlJObUdya3hTQkstaEhuUEx6eElzSXMweUpqcUJiVnRBOFZzZE9LUDBURUI2QTRMWGt0UDhHQXZk?oc=5", "name": "非凡新聞台"}]}], "tech": [{"title": "近九成開發者已用 AI 寫程式！學界報告指出：信任與驗證是下道關卡", "teaser": "AI寫程式成開發主流", "full": "美國學界最新報告顯示，已有將近九成的軟體開發者在日常工作中使用 AI 輔助寫程式。然而，報告也警告，如何驗證 AI 產出程式碼的安全性與正確性，並建立合理的信任機制，將是軟體產業接下來必須面對與解決的最大挑戰。", "think": <script type="application/json" id="slot-2000">{"date": "10月2日．週五", "tldr": "今晚美股因就業數據疲軟、升息預期降溫而開高，台積電與 AI 供應鏈強勢表態，為週末假期捎來市場好消息。", "indicators": {"note": "台美股市與半導體板塊全面收紅，反映市場對資金面寬鬆的樂觀預期，有利於台股下週多頭續攻。", "tiles": [{"label": "台股加權指數", "value": "48,475.74", "valueClass": "rise", "delta": "+1.12%", "deltaClass": "rise"}, {"label": "那斯達克", "value": "27,167.88", "valueClass": "rise", "delta": "+1.10%", "deltaClass": "rise"}, {"label": "費半指數", "value": "13,128.92", "valueClass": "rise", "delta": "+2.34%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "469.93", "valueClass": "rise", "delta": "+2.34%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "油價拉回和升息預期降低　歐股收紅", "teaser": "通膨壓力減輕歐股全面開紅盤", "full": "由於國際油價出現拉回跡象，加上市場對於央行持續升息的預期有所降低，歐洲主要股市在買盤湧入下紛紛收紅。這顯示通膨壓力暫時得到舒緩，投資人對經濟前景的擔憂有所減輕，帶動整體市場投資氣氛回溫。", "think": "歐洲市場的走勢往往是美股與台股的先行指標。當通膨與升息這兩大緊箍咒鬆綁，全球資金派對就有望延續，對台股電子股也是一大利多。", "question": "在升息循環可能步入尾聲的當下，你的資產配置是否已經開始往成長型股票傾斜了呢？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610030003.aspx", "name": "中央社"}]}, {"title": "美就業數據疲軟壓抑升息預期　華爾街股市開高", "teaser": "壞消息就是好消息美股開高", "full": "最新公布的美國就業數據表現疲軟，雖然反映出經濟擴張力道放緩，但卻有效壓抑了市場對聯準會激進升息的預期。在資金面可望維持寬鬆的預期下，華爾街股市今日開盤表現強勁，主要指數紛紛走高。", "think": "這就是典型的「壞消息就是好消息」。就業市場降溫反而降低了資金收緊的風險，對於風險資產是一劑強心針，投資人短期內可持偏多態度。", "question": "當經濟數據與市場走勢出現這種反直覺的連動時，我們該如何調整自己的投資策略？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610020341.aspx", "name": "中央社"}]}, {"title": "G7會商壓低燃料價格　美國油價重挫5%", "teaser": "國際油價重挫五％通膨降溫", "full": "七大工業國組織（G7）近期積極會商討論如何壓低燃料價格，加上市場供需結構改變，導致美國原油價格單日重挫達5%。油價的大幅下跌預期將有效緩解全球通膨壓力，也為各國央行的貨幣政策提供更多彈性空間。", "think": "油價是通膨的火車頭，油價大跌意味著我們距離物價飛漲的痛苦日子又遠了一步。對於運輸業、製造業等成本敏感型產業，這是一大營運利多。", "question": "油價下跌除了省下你的加油錢，你覺得還有哪些生活消費品會跟著降價？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202610020338.aspx", "name": "中央社"}]}, {"title": "美國9月非農就業新增2.9萬人遠遜預期　失業率微升", "teaser": "非農數據慘淡失業率微幅上升", "full": "美國最新公布的9月份非農就業人口僅增加2.9萬人，表現遠低於市場預期，同時失業率也出現微幅上升。這份低迷的就業報告證實了美國勞動市場正在顯著降溫，也讓市場更加確信後續的升息步伐將會放緩。", "think": "雖然就業數據不好看，但這正是聯準會希望看 <script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
