  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

產的多樣性。", "question": "當傳統股債配置失效時，你會考慮配置哪些另類資產？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609250003.aspx", "name": "中央社"}]}, {"title": "美光桃園廠工會9/29辦說明會 10/1起罷工投票", "teaser": "台灣美光工會醞釀罷工投票", "full": "台灣美光桃園廠工會宣布將於9月29日舉辦說明會，並自10月1日起進行罷工投票。工會此舉旨在爭取更好的勞動條件，若投票通過並發動罷工，恐將對半導體記憶體供應鏈的生產時程造成一定程度的衝擊。", "think": "記憶體大廠若發生罷工，可能影響短期產能與報價，進而波及台股相關供應鏈。投資人應密切關注投票結果，並留意記憶體族群的股價波動。", "question": "當科技大廠面臨勞資爭議時，身為投資人的你會如何評估其營運風險？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609240377.aspx", "name": "中央社"}]}], "robotics": [{"title": "大摩：AI與機器人啟動中國工業5.0 未來10年資本支出看增", "teaser": "工業五點零啟動萬億商機", "full": "摩根士丹利報告指出，AI與機器人技術將推動中國邁向工業5.0時代，預估未來十年相關資本支出將大幅增加。這波自動化升級浪潮將深度重塑製造業生態，並為智慧製造與工業軟硬體供應商帶來龐大的市場機遇。", "think": "工業5.0的核心在於人機協作與高度智能化。這意味著傳統製造業的從業人員必須加速轉型，學習如何與AI and 機器人協同工作，才能在未來職場保持競爭力。", "question": "面對工業自動化的大趨勢，你覺得自己的工作有哪些部分最不容易被機器人取代？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiT0FVX3lxTFBBRmp1TUJ6REVMVjlkWndZS0U1UE1lVG5ZcUliNmo0blY5WXRzWmExV29tbUVsWm1DTVB3NGRDcFl2OXF2U09nUkY2VG0xdVk?oc=5", "name": "news.cnyes.com"}]}, {"title": "自動化設備大廠獲利拚連兩年暴增 獲外資喊出超高目標價", "teaser": "自動化大廠獲利爆發受矚目", "full": "國內某自動化設備大廠因接單暢旺，獲利有望連續兩年暴增超過七成，吸引外資券商大幅調高其目標價，且大訂單能見度已一路看好至2029年。這顯示全球製造業對高階自動化與機器人設備的需求依舊極為強勁。", "think": "設備廠的訂單能見度長達數年，反映出製造業轉型是長期且不可逆的趨勢。投資人在尋找潛力股時，不妨多留意切入全球一線大廠供應鏈的自動化設備股。", "question": "當一家公司的訂單能見度看好到2029年，你會如何評估其長期投資價值？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiS0FVX3lxTFB5ekhZdkNSSF9uUDItNDZFLTVadVhKRUp5N3FPVG5HVGJ3MnV4eEdUci1vQXZnbDBZVFhjWUVUN19YN3V4U0Z0QV96RQ?oc=5", "name": "ftnn.com.tw"}]}, {"title": "亞馬遜擴大美國機器人製造投資 因應供應鏈重組趨勢", "teaser": "亞馬遜加碼機器人製造投資", "full": "為了因應全球供應鏈重組與物流自動化的趨勢，電商巨擘亞馬遜宣布將擴大在美國本土的機器人製造與研發投資。此舉旨在透過高度自動化提升倉儲營運效率，並降低對外部勞動力與複雜跨國供應鏈的依賴。", "think": "亞馬遜加碼自動化，代表物流與零售業的無人化趨勢正在加速。對於投資人而言，這不僅是電商龍頭的降本增效，更是機器人軟硬體供應商的巨大商機。", "question": "零售巨頭加速自動化，這對未來的就業市場和物流產業會帶來什麼衝擊？", "sources": [{"url": "https://news.google.com/rss/articles/CBMipwNBVV95cUxOc3d2X3MzazZsU3lwdWRSc3I0YmdHVmc5M3JmLVQwcm13Yk1zLVpGZXJQbERXLU5MNnZTX sses-series-over-100-models-year-end/", "name": "科技新報"}]}, {"title": "記憶體漲價明顯 高通曝AI PC下一步擴展方向", "teaser": "記憶體看漲高通布局AI桌機", "full": "面對記憶體價格明顯上漲的趨勢，IC設計大廠高通正積極推出不同產品線，力拼擴大市場版圖。高通同時透露了AI PC的下一步擴展方向，將著重於更高效能的邊緣運算與更豐富的在地端AI應用場景。", "think": "AI PC需要更高規格且容量更大的記憶體，這直接推升了記憶體的市場需求與報價。這對台灣的記憶體台廠來說是長線利多，投資人可留意相關族群的營收表現。", "question": "面對AI PC時代的來臨，你是否會考慮在下一次換電腦時多花預算升級AI功能？", "sources": [{"url": "https://technews.tw/2026/09/25/qualcomm-kedar-kondap-interview/", "name": "科技新報"}]}, {"title": "國際太空站迎退役倒數 藥廠搶攻無重力製藥商機", "teaser": "太空站退役引爆無重力製藥", "full": "隨著國際太空站即將迎來退役倒數，各大藥廠紛紛與商業太空平台結盟，提前搶攻「無重力製藥」的全新商機。在微重力環境下，蛋白質結晶與細胞生長更為均勻，有助於開發出傳統地球環境無法製造的突破性新藥。", "think": "太空科技不再只是政府的太空競賽，而是已經深入到生技製藥等高度商業化領域。雖然這屬於極長線的投資，但跨領域的科技融合往往能誕生出下一個破壞式創新的產業。", "question": "當製藥戰場延伸到外太空，你認為這會如何改寫未來生技醫療產業的競爭規則？", "sources": [{"url": "https://technews.tw/2026/09/25/space-pharmaceuticals/", "name": "科技新報"}]}, {"title": "AI熱潮並非雨露均霑 科技大廠呈現兩極化發展", "teaser": "科技業AI熱潮呈現兩極化", "full": "儘管AI浪潮席捲全球，但市場資金與資源並非雨露均霑，科技大廠之間正呈現兩極化發展。只有真正能將AI技術轉化為實際營收與獲利的企業能持續獲得市場青睞，而缺乏核心競爭力的廠商則面臨邊緣化的危機。", "think": "這提醒投資人「盲目跟風AI」的時代已經過去，現在市場看重的是實質的獲利與商業模式。在挑選科技股時，必須嚴格檢視其AI業務是否真的能為公司賺錢。", "question": "在科技股兩極化的趨勢下，你該如何調整策略以避開只有「AI題材」卻無獲利的泡沫股？", "sources": [{"url": "https://technews.tw/2026/09/25/ai-boom-not-evenly-distributed-polarized-development-tech-firms/", "name": "科技新報"}]}, {"title": "AI需求帶旺 台灣PCB產值全年有望首度破兆元", "teaser": "台PCB產值今年挑戰破兆", "full": "在AI伺服器與高效能運算需求的強力帶動下，台灣印刷電路板（PCB）產業迎來爆發性成長，全年產值有望首度突破新台幣一兆元大關。這項里程碑再次確立了台灣在全世界電子零組件供應鏈中的關鍵與領先地位。", "think": "PCB被譽為「電子工業之母」，其產值破兆代表整體電子產業景氣復甦且結構升級。這對於台股電子權值股與中游零組件廠商來說，是極為扎實的營收基本面支撐。", "question": "台灣PCB產值首度挑戰破兆，這對你評估下半年的台股科技版塊有何啟示？", "sources": [{"url": "https://technews.tw/2026/09/25/ai-drives-taiwan-full-year-pcb-output-value-surpass-trillion-first-time/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-1300">{"date": "9月25日．週五", "tldr": "週五午間台股盤中隨美股震盪微跌，但半導體與AI供應鏈依舊是市場焦點，投資人宜關注國際地緣政治與原物料波動對盤勢的影響。", "indicators": {"note": "美股四大指數與台積電ADR互有漲跌，顯示國際科技股在盤整中尋找方向，台股午盤則隨亞股震盪整理。", "tiles": [{"label": "台股加權指數", "value": "48,024.60", "valueClass": "fall", "delta": "-0.28%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "26,939.37", "valueClass": "rise", "delta": "+0.01%", "deltaClass": "rise"}, {"label": "費半指數", "value": "12,492.54", "valueClass": "fall", "delta": "-0.33%", "deltaClass": "fall"}, {"label": "台積電ADR", "value": "451.15", "valueClass": "rise", "delta": "+1.03%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "多元產能需求驅動 台灣半導體廠擴大新加坡布局", "teaser": "分散風險，台廠南向新加坡", "full": "面對全球供應鏈重組與多元產能的需求，台灣半導體大廠近期紛紛擴大在新加坡的投資與布局。這項舉動不僅有助於就近服務東南亞與全球客戶，也能有效分散地緣政治帶來的營運風險。", "think": "台灣半導體實力持續向外延伸，顯示全球化布局已是晶圓代工與相關供應鏈的必經之路。對投資人而言，這代表護國神山的眼光放得更遠，但也需要留意海外擴廠初期可能帶來的資本支出壓力。", "question": "當半導體大廠積極全球化佈局時，台灣本土的競爭優勢該如何維持？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609250084.aspx", "name": "中央社"}]}, {"title": "台積電赴美投資核准達440億美元 經部：預期持續送件審查", "teaser": "赴美投資規模擴大審查中", "full": "經濟部表示，目前核准台積電赴美投資金額已達到相當規模，且預期未來仍會有相關投資案持續送件審查。這反映出台灣半導體產業在全球半導體版圖中的關鍵地位，以及因應客戶需求進行的必要海外資本配置。", "think": "赴美設廠雖然成本較高，卻是鞏固全球客戶信任的重要敲門磚。身為股東或關注台股的上班族，我們看到的不只是成本增加，更是台積電鞏固全球市佔率的強大企圖心。", "question": "面對龐大的海外投資金額，你認為對台積電的長期毛利率會造成什麼影響？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609250036.aspx", "name": "中央社"}]}, {"title": "AI熱潮不是雨露均霑 記憶體水漲船高、科技廠發展兩極", "teaser": "AI熱潮下的產業兩極化", "full": "雖然人工智慧話題持續火熱，但市場資金並未平均分配到所有科技廠。隨著需求轉變，部分零組件如記憶體等開始水漲船高，導致不同科技廠的營運表現出現明顯的兩極化現象。", "think": "這提醒我們在追逐AI題材時不能盲目買進，必須看懂供應鏈中誰才是真正擁有定價權的贏家。記憶體等次產業的翻身，說明科技圈永遠是「缺什麼賺什麼」。", "question": "在AI供應鏈中，除了晶片大廠外，你覺得下一個受惠的關鍵零組件會是什麼？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609250029.aspx", "name": "中央社"}]}, {"title": "投資人聚焦美伊戰爭 美股多收黑", "teaser": "地緣政治升溫牽動美股", "full": "受到中東地緣政治緊張局勢加劇影響，投資人目光高度聚焦於美伊相關動態，導致美股主要指數在日前多數收黑。市場對於衝突擴大可能引發的經濟衝擊保持高度警戒。", "think": "國際局勢的風吹草動往往是台股隔日開盤的最大變數，身為上班族投資人，學會看懂國際新聞背後的風險意識比盲目追高更重要。危機往往也是檢視自己資產配置抗震能力的時刻。", "question": "面對突發的地緣政治利空，你的投資組合通常會採取什麼防禦策略？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609250013.aspx", "name": "中央社"}]}, {"title": "葉門叛軍射彈攻擊沙烏地 國際油價上漲約3%", "teaser": "油價受地緣衝突激勵走高", "full": "中東地區衝突再添變數，葉門叛軍對沙烏地阿拉伯發動飛彈攻擊，引發市場對產油設施受損的擔憂。受此消息激勵，國際油價單日應聲上漲約3%左右。", "think": "油價上揚直接牽動全球通膨敏感神經，對於仰賴能源進口的台灣經濟與運輸成本來說是個潛在壓力。投資人在看科技股之餘，也需留意原物料價格對整體消費力的排擠效應。", "question": "油價若持續攀升，你覺得哪些產業受到的負面衝擊會最大？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609250011.aspx", "name": "中央社"}]}], "robotics": [{"title": "陸機器人掀淘汰潮？具身智慧「冰火兩重天」 明星公司接連爆雷", "teaser": "中國機器人面臨洗牌期", "full": "中國大陸的機器人產業近期傳出雜音，具身智慧領域呈現「冰火兩重天」的局面，甚至有明星新創公司接連爆發財務與營運危機，引發市場對於機器人熱潮是否過熱的討論。", "think": "任何一項新科技在爆發前夕往往會經歷泡沫與洗牌，這正是技術走向成熟的必經過程。對投資人而言，這提醒我們追逐題材時要分清「炒作」與「真正具備商業化落地能力」的企業差別。", "question": "當市場熱潮冷卻、明星公司爆雷時，我們該如何挑選真正有價值的產業標的？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiT0FVX3lxTFBtV1J6UnBqZEs1M2kwVEd2WmlnZVlpUzRPTlRKdDJMTm51TEtORnRCVnpXSTVPd0hFZi1oM1ZXSkYxUmZfRGF6eG9wNnRtREU?oc=5", "name": "TVBS新聞網"}]}, {"title": "亞馬遜狂砸重金布局！在美興建第四座機器人廠、搶吃印度購物配送大餅", "teaser": "亞馬遜擴大機器人產能", "full": "電子商務巨頭亞馬遜持續加碼自動化，不僅在美國興建第四座機器人製造廠，更積極將技術應用於印度等新興市場的購物配送業務，企圖以高度自動化降低物流成本並提升效率。", "think": "電商巨頭的資本支出方向，就是未來自動化供應鏈的最佳明燈。當物流自動化成為標配，相關的零組件與系統整合商將迎來長線的剛性需求。", "question": "物流全面機器人化後，未來的消費體驗與人力結構會發生什麼改變？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTE40TlZfaVRTVDhCOEphUWJnZ29fX1c0OFIwVndpaGV4S3ByU1FPRDBQOHJHMVViN2VnTV9uSFN3VDA3TWFDV2NsQTJ5WGlIUTlG?oc=5", "name": "UDN"}]}, {"title": "人形機器人2026迎轉折 台廠供應鏈誰最有戲？", "teaser": "2026人形機器人關鍵年", "full": "市場預期人形機器人產業將在2026年迎來重要的技術與商業化轉折點，國內外的法人與研調機構紛紛開始點名台灣的相關供應鏈，看好台廠在精密零組件與電機控制上的實力。", "think": "從電動車到人形機器人，台灣供應鏈總能在關鍵時刻切入高附加價值的硬體製造。上班族若想提前佈局下一個十年大趨勢，機器人概念股絕對是值得放進觀察名單的領域。", "question": "你認為台灣供應鏈在人形機器人的浪潮中，最不容易被取代的核心優勢是什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiTEFVX3lxTFBaZVdVXzIzMjJqYWZCbjRvTi1TZ2ZGeUpvZHhKd04xb19wNUxWdTY0MlkwWmx2elZGYUREVWZIOHFTZ3BaMEFFbi1Gd3o?oc=5", "name": "聚財網"}]}, {"title": "梅卡曼德機器人首份中報：收入與毛利齊升，機器人「大腦」的產業時代啟幕", "teaser": "軟體大腦帶動營收成長", "full": "被視為機器人「大腦」的智慧機器人軟體與視覺方案商梅卡曼德，公布上市後首份財報展現亮眼成績，收入與毛利率同步走高，宣告機器人軟體與AI演算法的時代正式啟幕。", "think": "硬體會貶值，但賦予機器人靈魂的軟體與AI大腦才是高毛利的關鍵所在。這也呼應了現代科技投資「重軟輕硬」的趨勢，軟體實力強的企業才能享有更好的評價。", "question": "當機器人有了聰明的大腦，你覺得哪一個傳統行業會最快被徹底顛覆？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiiwRBVV95cUxNek42Z1EtRlg1eXZWZ2IwSHB1ZlhZekNLRm1pU0dzMklrNG55TG41VVVQcW1xOHczS0Y2dTYzb25kSzEzY3JGX0tuYjlDb2h1YnVHeGtxM3Noc2p3dWMtdG1rTnRPb3JBZjF1NE9XbEF4Tl9pb0hqTmhXeHFoVFlhTGhPMWxueWVVMXFLdnVuZ3dzbWM4Ynlwc0k1MUFfcFlCdW9qVGZmTVhDRWd1LVREcmlLbm9FWElZQVRLRVZzOVhYa3JHZDJRQ2hNdDZMWmg3WEpic0IzZTk5RkRHMmlYdXVmanVmUktnTHh6eW9WbkxXZE1ZV29lVHZfVnkzeGhvRVdiRTBtdTBDM2U0YUxLYlNBTlgyLURUeFF3Y3FJeDJmNG9idUdaYTVOZlZuSjNOWHBZb0hGMHNBcjFvOS1LNF8zamtZLUl0Uk82bXZ4a0VJeGY4N3IxLWRwRmkya1doX3JQYmJpOHRBVG5iaS10UnlYNDFIU2VkYXp4WTdURl9tVjVNbkVISjV2RXVxUTRXNWh4ajc3b0pyQV9rU0lhQjI2cTZzTWhGVzdpeldGNF91ZTZXS1dVenVUNklkMjdjbnpXNlNFajMtOTJvUms2WmpldG4ySWFBcXdpV1czbzhINWwxNUJDV0VTWkd2LTNUbzRwRUN2NFd0aml4WVRCREhLVWNmUFNHcVdv?oc=5", "name": "香港經濟日報HKET"}]}, {"title": "Nexterity以機器人自動化處理高危險勞動場景", "teaser": "機器人深入高風險職場", "full": "Nexterity等新創與科技團隊正積極推動機器人自動化，專門用於處理高危險性的勞動場景，透過科技來減少人類暴露於工安意外的風險，提升整體作業安全。", "think": "科技始於人性，機器人取代人類不只是為了解決缺工問題，更是為了守護寶貴的生命安全。這種具備社會價值的科技應用，往往能獲得更長遠的政策支持與社會認同。", "question": "如果高風險工作全面由機器人接管，人類的勞動價值該如何重新定義？", "sources": [{"url": "https://news.google.com/rss/articles/CBMibkFVX3lxTE15SXJYb1ZjSFVVVEhFdVNwQ0ZuWkM3WTFvQUtRZnJMcDR1MUQtV0VMYTh4NTdrdUVOM0R0ZHg3SXJSR3FrU2doSmZFVExaV2VtMm5hOTF3YzRJM1NTUFdQY1ItU3MzVDBNc3lKeG1n?oc=5", "name": "cyberq.tw"}]}], "tech": [{"title": "Airbnb 執行長靠 AI 打造「企業大腦」，會議砍半更帶動 17% 營收成長", "teaser": "AI打造企業大腦奏效", "full": "知名訂房平台 Airbnb 執行長近期分享，公司透過導入 AI 工具打造內部的「企業大腦」，不僅將冗長的會議砍半，更意外帶動了高達 17% 的營收成長，展現極佳的營運效率。", "think": "這是一個非常有說服力的企業數位轉型範例，證明 AI 不只是話題，還能真正幫公司開源節流。對上班族來說，學會善用 AI 工具提高工作效率，已是職場生存的必修課。", "question": "如果你的公司也把開會時間砍半並導入AI，你覺得你的工作型態會有哪些轉變？", "sources": [{"url": "https://finance.technews.tw/2026/09/25/airbnb-ceo-halves-meeting-time-ai/", "name": "科技新報"}]}, {"title": "馬斯克：Colossus 2 年底前輝達晶片數量將翻倍，上看 120 萬顆", "teaser": "馬斯克擴大算力拼AI", "full": "特斯拉執行長馬斯克旗下的 xAI 積極擴充超級電腦算力，他預告名為 Colossus 的超級電腦在年底前，內含的輝達（NVIDIA）晶片數量將會翻倍成長，總數上看 120 萬顆。", "think": "算力就是AI時代的石油，馬斯克毫不手軟的大規模軍備競賽，直接為輝達等晶片供應商提供了最穩固的營收保證。這場算力大戰短期內完全沒有看到停歇的跡象。", "question": "當科技巨頭的算力軍備競賽沒有極限，台灣的半導體供應鏈還能吃香多久？", "sources": [{"url": "https://technews.tw/2026/09/25/elon-musk-aims-to-double-colossus-2s-nvidia-chips-by-year-end/", "name": "科技新報"}]}, {"title": "開源、開放權重、專有模型差在哪？企業導入 AI 前要弄懂的三種授權", "teaser": "企業導入AI必懂授權", "full": "隨著生成式 AI 普及，企業在導入相關技術時面臨不同的授權選擇。市場分析指出，企業主在決定使用開源、開放權重還是專有模型之前，必須先釐清各自的成本、安全與客製化差異。", "think": "技術選擇往往決定了企業未來的數位護城河，懂技術的經理人在這波浪潮中特別搶手。投資人也可以從企業選擇哪種AI模式，看出其在資安與研發成本上的企圖心。", "question": "如果你是企業決策者，你會優先選擇成本較低的開源模型，還是安全受保障的專有模型？", "sources": [{"url": "https://infosecu.technews.tw/2026/09/25/open-source-open-weight-proprietary-models/", "name": "科技新報"}]}, {"title": "AI 破解人體老化時鐘：揭開三大「爆發性」衰老軌跡，兩個年齡是斷崖關鍵", "teaser": "AI破解人體衰老密碼", "full": "科學家利用人工智慧技術分析龐大的生物數據，成功破解了人體老化的時鐘，並揭開了三大「爆發性」的衰老軌跡，指出特定的兩個年齡段是身體機能變化的斷崖式關鍵期。", "think": "AI的應用早已跨出科技圈，深入生醫與健康長壽的領域。這類研究不僅改變未來醫療產業的走向，也提醒現代人更需要注重健康管理與預防醫學的重要性。", "question": "如果AI能精準預測你的身體衰老斷崖期，你會改變你現在的生活與理財規劃嗎？", "sources": [{"url": "https://technews.tw/2026/09/25/human-organ-aging-watershed/", "name": "科技新報"}]}, {"title": "庫克時代最成功代表作，AirPods 如何從網路迷因變身蘋果最強印鈔機？", "teaser": "AirPods變身最強印鈔機", "full": "回顧庫克接掌蘋果以來的發展，無線耳機 AirPods 從最初上市時被網友惡搞的迷因，一路逆勢成長，如今已成為蘋果生態系中營收貢獻極大的最強印鈔機之一。", "think": "市場一開始不看好的產品，往往蘊含最大的市場潛力與驚喜。這也告訴我們，創新的價值常常需要時間來證明，耐心等待市場接受是科技投資的重要哲學。", "question": "你身邊有哪些一開始被嘲笑、現在卻變成生活必需品的科技產品？", "sources": [{"url": "https://ccc.technews.tw/2026/09/25/airpods-comeback/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-2000">{"date": "9月25日．週五", "tldr": "週五盤後總結，美股多空交織但科技與半導體展現韌性，國際地緣政治與AI算力擴張成為市場焦點，投資人宜審慎看待風險。", "indicators": {"note": "台股微幅拉回整理，但美股那斯達克與費半走揚，顯示國際科技與半導體動能依舊強勁，為下週台股提供支撐。", "tiles": [{"label": "台股加權指數", "value": "48,024.60", "valueClass": "fall", "delta": "-0.28%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "27,086.74", "valueClass": "rise", "delta": "+0.55%", "deltaClass": "rise"}, {"label": "費半指數", "value": "12,713.12", "valueClass": "rise", "delta": "+1.77%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "452.06", "valueClass": "rise", "delta": "+0.20%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "台積電赴美投資核准達440億美元 經部：預期持續送件審查", "teaser": "台積電赴美投資持續推進", "full": "經濟部證實台積電對美投資核准金額已達相當規模，並預期未來仍會有相關投資案持續送件審查。這反映出台灣半導體龍頭在全球產能佈局上的長遠考量，持續深化國際供應鏈的連結。在全球地緣政治與客戶需求交織下，台廠的海外動向備受產業界與投資人高度關注。", "think": "護國神山的大規模海外布局，不僅是企業營運策略的延伸，也牽動著台灣本土產業聚落的轉型。對投資人而言，關注供應鏈的全球化移動，有助於精準掌握長線的產業趨勢與機會。", "question": "當半導體大廠加速全球在地化生產，台灣本土的供應鏈優勢該如何維持與升級？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609250036.aspx", "name": "中央社"}]}, {"title": "AI熱潮不是雨露均霑 記憶體水漲船高、科技廠發展兩極", "teaser": "AI狂潮下的產業分化", "full": "市場觀察指出，雖然人工智慧熱潮持續延燒，但並非所有科技廠都能雨露均霑。隨著需求結構改變，記憶體等特定領域因需求暢旺而水漲船高，部分科技廠則面臨發展兩極化的挑戰。這顯示出科技產業正經歷結構性調整，基本面表現將更加分歧。", "think": "這提醒我們在追逐熱門題材時，不能只看單一的光環，更要深入檢視個別企業在供應鏈中的實際定位與獲利能力。產業的分化往往是幾家歡樂幾家愁，選股邏輯必須更加細緻。", "question": "在產業發展兩極化的趨勢下，您的投資組合是否具備足夠的抗震與利基能力？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609250029.aspx", "name": "中央社"}]}, {"title": "美國30年期房貸利率突破7% 創川普重返白宮以來新高", "teaser": "美房貸利率升破七趴", "full": "美國房貸利率近期再度走高，30年期房貸利率突破百分之七大關，創下特定政治變局後的新高紀錄。借貸成本的攀升直接衝擊當地房市的買氣與流動性，也反映出總體經濟環境中的通膨與利率壓力依然存在。市場正密切評估高利率環境對整體消費動能的實質影響。", "think": "房貸利率是觀察美國內需與消費強弱的重要風向球，當融資成本居高不下，消費者的荷包縮水可能進一步外溢到其他零售與經濟領域，影響層面值得持續追蹤。", "question": "面對美國居高不下的房貸與利率水準，您認為會對全球金融市場帶來哪些連鎖反應？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202609250018.aspx", "name": "中央社"}]}, {"title": "投資人聚焦美伊戰爭 美股多收黑", "teaser": "地緣政治牽動美股表現", "full": "受到中東地緣政 <script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
