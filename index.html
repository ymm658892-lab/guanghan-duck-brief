  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

<script type="application/json" id="slot-1300">{"date": "10月9日．週五", "tldr": "今日台股受美股科技股拖累盤中走跌，市場目光聚焦下週台積電法說會；同時AI與機器人技術持續突破，長線題材依舊亮眼。", "indicators": {"note": "美股費半與台積電ADR重挫，拖累今日台股盤中回檔，市場正靜待下週法說會釋出明朗訊號。", "tiles": [{"label": "台股加權指數", "value": "49,313.44", "valueClass": "fall", "delta": "-0.99%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "27,193.34", "valueClass": "fall", "delta": "-1.25%", "deltaClass": "fall"}, {"label": "費半指數", "value": "12,623.72", "valueClass": "fall", "delta": "-3.39%", "deltaClass": "fall"}, {"label": "台積電ADR", "value": "457.99", "valueClass": "fall", "delta": "-3.01%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "台積電法說會15日登場 法人看好有助支撐台股高檔整理", "teaser": "護國神山法說牽動台股後市", "full": "萬眾矚目的台積電法說會即將在15日登場，法人認為這將是台股能否維持在高檔整理的關鍵指標。市場目前對於台積電的先進製程與封裝需求依舊看好，法說會上的釋出的展望將為第四季台股行情定調。", "think": "台積電是台股的權重龍頭，其法說會釋出的訊息形同半導體產業的風向球。對一般投資人而言，此時不宜過度追高，可靜待法說會釋出的官方展望，作為調整台股部位與電子股配置的重要依據。", "question": "面對台積電即將到來的法說會，你的投資組合做好應對震盪的準備了嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610090133.aspx", "name": "中央社"}]}, {"title": "赴德州設廠、結盟馬斯克？台積電15日法說聚焦營運與海外擴產", "teaser": "海外擴產與大咖結盟成焦點", "full": "隨著台積電法說會臨近，市場傳出其可能赴美國德州設廠，甚至與馬斯克展開進一步合作的傳聞。本次法說會除了關注產能與資本支出外，海外布局的最新進展與客戶合作關係，將是法人追問的焦點。", "think": "護國神山走向世界已是不可逆的趨勢，與國際科技巨頭的深度結盟能確保未來數年的訂單無虞。身為通勤族，我們不僅要看股價波動，更要觀察台灣科技鏈在全球地緣政治下的戰略定位。", "question": "如果台積電真的與馬斯克加深合作，哪些供應鏈概念股最值得你提早布局？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610090086.aspx", "name": "中央社"}]}, {"title": "日經亞洲爆料：因需求疲軟，蘋果已削減iPhone 18 Pro訂單", "teaser": "蘋果供應鏈面臨需求考驗", "full": "根據日經亞洲報導，由於市場需求不如預期，蘋果已經開始削減未來iPhone 18 Pro的相關訂單。這項消息引發市場對蘋果供應鏈後續拉貨動能的疑慮，也可能對台灣相關蘋概股的營收造成衝擊。", "think": "消費型電子的復甦力道似乎不如預期，連指標性的蘋果都傳出砍單，代表高階機種的買氣正面臨考驗。投資人在選擇蘋概股時，應更著重在有AI題材或規格升級受益較深的個股，避免踩雷。", "question": "當智慧型手機需求放緩，你認為下一個能支撐科技股成長的消費硬體是什麼？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202610090154.aspx", "name": "中央社"}]}, {"title": "川普排除選前攻擊伊朗 亞股多數收紅、國際油價應聲回落", "teaser": "地緣政治降溫助亞股回穩", "full": "美國前總統川普在言論中排除了在選前對伊朗進行軍事攻擊的可能性，地緣政治緊張局勢隨之稍微降溫。此舉促使國際油價從高點回落，也讓亞洲股市獲得喘息空間，多數呈現收紅態勢。", "think": "國際地緣政治與油價波動是影響通膨與股市的關鍵變數。政治人物的言論在選前經常引發市場劇烈震盪，投資人此時更應保持冷靜，不要因為短期的政治風向球而頻繁進出市場。", "question": "面對美選前的地緣政治風擾，你的資產配置中是否有足夠的抗通膨或避險部位？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610090172.aspx", "name": "中央社"}]}, {"title": "爆發網路資安事件 緯致：已啟動防禦機制且營運維持正常", "teaser": "科技廠資安警報考驗應變力", "full": "緯致近日傳出遭遇網路資安事件，公司第一時間啟動了防禦機制，並表示目前評估對整體營運沒有重大影響，各項系統正逐步恢復正常。這起事件再次凸顯了上市櫃企業在資訊安全防護上的重要性。", "think": "隨著數位轉型加速，資安漏洞已成為企業營運的最大隱形炸彈。投資人在評估一家公司的長期價值時，除了看營收與獲利，企業應對資安危機的韌性與防護投入，也是不可忽視的ESG指標。", "question": "當你投資的企業面臨駭客攻擊時，你會選擇逢低布局還是先離場觀望？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610090092.aspx", "name": "中央社"}]}], "robotics": [{"title": "履帶式救災機器人顯神威 台東消防局實兵演練達16場次", "teaser": "救災機器人成第一線新戰力", "full": "台東縣消防局積極推廣履帶式救災機器人的應用，至今已完成高達16場次的實兵演練。這種機器人能在危險的火場或坍塌現場代替消防員深入險境，有效降低救災人員的傷亡風險。", "think": "機器人的應用已從工廠生產線延伸到攸關人命的救災現場，展現極高的實用價值。這代表特種機器人的市場需求正在悄悄興起，相關的感測器、履帶傳動等硬體供應商未來商機無限。", "question": "除了消防救災，你覺得還有哪些高風險工作最應該優先由機器人來取代？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTE9TeWxyWkUtX1ZLeVdkalFEVDdkQzJfTUhXd1F6Rk1IQ3pBZ211a3pfSmRkSDc4emdiSEx3Sm1yVTdkNTc4VzJXZlc1cDd3U3BaMmc?oc=5", "name": "蕃新聞"}]}, {"title": "AI也會痛？「酷刑室專案」逼機器人陷入困境 引發網友熱烈論戰", "teaser": "虛擬酷刑引爆機器人倫理爭議", "full": "一項名為「酷刑室專案」的研究，透過殘酷的設定讓AI與機器人在模擬環境中感受並應對「痛苦」，試圖研究其適應能力。然而，這種逼迫機器人陷入困境的設定，意外在網路上引發了關於AI人權與倫理的激烈爭議。", "think": "當AI與機器人表現得越來越像人類，我們對待它們的方式也開始受到道德檢視。雖然這只是模擬，但這提醒了我們，在開發機器人的過程中，倫理規範的建立速度必須跟上技術的腳步。", "question": "如果未來機器人真的具備了感知痛苦的能力，我們是否應該賦予它們法律上的保護？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE9XWkVkN0kwY0w4RTBEOHZTbnN0MW9nWUlncUd2cnBSSGw3QkY2WDRFUHVXYWhWS0dBOW9qcjVhNDF5WUFHdlplM1FXdzdPWnhfbEhXdDdzQWF2bmtuTXdz?oc=5", "name": "TechNews 科技新報"}]}, {"title": "人形機器人與傳統機器人 兩者最大區別究竟在哪裡？", "teaser": "一窺人形與工業機器人的差異", "full": "探討人形機器人與傳統工業機器人的最大區別，關鍵在於適應人類生活環境的能力與多功能性。傳統機器人多用於特定產線，而人形機器人則具備雙足行走與雙手操作能力，能直接融入現有的社會基礎設施中。", "think": "人形機器人的終極目標是走入家庭與服務業，這需要極高的AI視覺與運動控制技術。對上班族而言，理解這個技術分水嶺，有助於我們在投資機器人概念股時，精準區分誰才是真正掌握未來核心技術的贏家。", "question": "你認為人形機器人要達到多低的成本，才能真正普及到一般家庭中？", "sources": [{"url": "https://news.google.com/rss/articles/CBMikAFBVV95cUxNeHdBRmxrWE5TVWhFemNUcUhSaXZVc0JqYjFnNkJpUDJOUFI4Nk9fQTNzX2VKS2pDQVN2ZmthSWhuUzc0MWswQWsxdVRxX2JFUEVTMzFpOU5jRGQyWE1abnlZUV9FRU1DY01BalZpQ3k1MUwwWVlJN2NjalJkQjN6YThwN3BjNktONXBhNnBYaUE?oc=5", "name": "紫荊網"}]}, {"title": "港股異動：華沿機器人午後漲近6% 宣布不超過2億元回購計劃", "teaser": "企業展現信心回購自家股票", "full": "港股華沿機器人在午後盤中股價上漲近6%，主因是公司宣布了H股股份回購計劃，預計總金額將不超過2億港元。此舉向市場傳遞了管理階層對公司未來發展與估值的強烈信心，吸引資金流入。", "think": "企業在市場波動時祭出大額回購，通常被視為股價底部的強力支撐信號。特別是在競爭激烈的機器人產業中，公司有足夠現金進行回購，代表其財務體質健全，值得投資人列入追蹤清單。", "question": "當你關注的科技股宣布實施股份回購，你會將其視為買進的訊號嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMicEFVX3lxTE1Bb29iRFdpUjhOeWZlRXpGUXpFSm9NQ1pZaWFWdFg1MktabjlrOV9valVJWl80ZmhfWU9OR3M5LVM4MVNSVmFxWEpHNTNDWWtPcjRMY1dSLWRybXNZd3lLbGVmekZXR0YxQ1BxZlp0cWI?oc=5", "name": "Investing.com 香港 - 股市報價& 財經新聞"}]}, {"title": "中國人形機器人「舞」進韓國國會 罕見現身引發各界高度關注", "teaser": "人形機器人跨國外交新舞台", "full": "中國開發的人形機器人日前罕見出現在韓國國會，並現場展示了靈活的舞蹈動作，引發在場議員與媒體的高度關注。這場展示不僅展現了人形機器人在關節控制上的技術突破，也反映出各國對AI與機器人產業的高度重視。", "think": "機器人已經從單純的工業工具，變成展示國家科技實力的外交名片。在美中科技戰的背景下，亞洲各國在機器人領域的角力與合作正悄悄展開，這將加速整體產業的技術迭代與商用化進程。", "question": "當看到外國機器人技術迅速進步，你認為台灣在機器人供應鏈中該如何保持優勢？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiekFVX3lxTE83aXJOcnhKRUZGNWgtaGxJS3pfWjRTQUFQOFJ4dkRzVFMyTUR3dWdKUk94LXRqQTZsOU9yc2ZHbG5SbWNnbzVQMk9La0ZpYlhLZnBGaFZYWEZpaEotMG1OdWZrYjJEcFRqeUxYd2txaFdqWTJnaC01Nm93?oc=5", "name": "dotdotnews"}]}], "tech": [{"title": "天然氣管線延宕 甲骨文擬動用卡車供氣搶救AI資料中心進度", "teaser": "為了AI資料中心甲骨文拼了", "full": "由於天然氣管線建設延宕，甲骨文為了不讓興建中的AI資料中心進度落後，正計劃動用大量卡車直接運送天然氣來供電。這項權宜之計顯示出科技巨頭們在AI算力競賽中，面臨著極其嚴峻的能源與時間壓力。", "think": "AI發展的盡頭是能源，這句話真的一點都不假。甲骨文寧可花高成本用卡車運氣，也要確保資料中心如期上線，這暗示了電力與能源相關概念股，將是AI浪潮下最穩健的長線受益者。", "question": "當科技巨頭為電力搶破頭，你是否已經在投資組合中配置了綠能或電力建設股？", "sources": [{"url": "https://technews.tw/2026/10/09/oracle-trucks-gas-ai-data-center-progress-natural-gas-pipeline-delays/", "name": "科技新報"}]}, {"title": "讓AI當司機開車買漢堡 GPT-6 Astra勇闖路考成唯一通關模型", "teaser": "AI司機路考通關展現新實力", "full": "在一項創新的測試中，研究人員讓搭載GPT-6 Astra的AI系統充當司機，開著Toyota汽車去買漢堡。該系統展現了優異的即時決策與環境感知能力，成為唯一順利通過這項複雜路考的大語言模型。", "think": "大語言模型不再只是網頁上的聊天機器人，而是開始具備實體世界的物理控制能力。這項突破預示著未來的自駕技術將迎來革命性的進化，AI與硬體的結合將比我們想像的更早融入日常生活。", "question": "如果未來AI駕駛的安全性遠超人類，你願意完全放棄開車、把生命交給AI嗎？", "sources": [{"url": "https://technews.tw/2026/10/09/ai-driven-corolla/", "name": "科技新報"}]}, {"title": "光寶科第三季營收季增9% 康舒單季營收首度突破百億元大關", "teaser": "電源雙雄第三季交出亮眼成績", "full": "台灣電源供應器大廠光寶科第三季營收季增達9%，而康舒單季營收更首度突破百億元大關，表現亮眼。這兩家公司的強勁成長，主要得益於伺服器、AI電源以及車用電子等高加值產品的出貨暢旺。", "think": "伺服器與AI硬體的需求，正實實在在地轉化為台灣供應鏈的營收數字。電源供應器作為硬體運作的心臟，其營收爆發代表產業景氣依然健康，這給了投資人對於科技股基本面極大的信心。", "question": "隨著AI伺服器功耗暴增，你認為高階電源技術會是台廠持續領先的護城河嗎？", "sources": [{"url": "https://finance.technews.tw/2026/10/09/ai-power-demand-remains-strong-liteon-q3-revenue-up-9-percent-acbel-hits-new-high/", "name": "科技新報"}]}, {"title": "美國海軍雷射武器部署軍艦 採用類Xbox手把操作降低訓練門檻", "teaser": "搖桿控制雷射武器成真", "full": "美國海軍已在軍艦上部署新型雷射武器，有趣的是，該系統採用了類似Xbox遊戲主機的手把來進行操作。這種設計大幅降低了士兵的訓練門檻與時間，讓操作高科技武器變得像玩遊戲一樣直覺。", "think": "科技的進步不僅在於技術本身，更在於使用者體驗的優化。將消費級電子產品的直覺操作引入軍事領域，是極具創意的跨界融合，也提醒我們在產品設計上，「簡單好上手」往往是成功的關鍵。", "question": "你認為還有哪些複雜的專業工作，可以透過遊戲化的介面來降低學習門檻？", "sources": [{"url": "https://technews.tw/2026/10/09/us-navy-uses-xbox-style-controllers-to-fire-anti-drone-lasers-deployed-on-ships/", "name": "科技新報"}]}, {"title": "黃仁勳、蘇姿丰與馬斯克同獲殊榮 川普頒發美國國家科學獎章", "teaser": "科技三巨頭同台榮獲國家級殊榮", "full": "輝達執行長黃仁勳、超微半導體執行長蘇姿丰以及特斯拉創辦人馬斯克，共同榮獲了美國國家科學獎章。這項殊榮表彰了他們在半導體、人工智慧與太空探索等領域對人類科技發展所做出的卓越貢獻。", "think": "這三位科技巨頭不僅改變了科技界，也深刻影響了全球經濟與股市。他們同台獲獎，象徵著AI、晶片與新創科技已成為國家戰略的核心，跟著這些巨頭的步伐走，就是抓住了未來十年的財富趨勢。", "question": "在這三位科技巨頭所領導的領域中，你最看好哪一個行業未來的成長潛力？", "sources": [{"url": "https://technews.tw/2026/10/09/jensen-huang-lisa-su-elon-musk-national-medal-science-trump/", "name": "科技新報"}]}]}}</script>

  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
