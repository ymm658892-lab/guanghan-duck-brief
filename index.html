  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

布的企業財報，那才是決定第四季走勢的關鍵。", "question": "通膨降溫後，您認為接下來最值得關注的總體經濟指標是什麼？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610010011.aspx", "name": "中央社"}]}, {"title": "美國第2季GDP成長上修至2.2% 消費支出強勁推動經濟", "teaser": "美經濟強韌消費動能足", "full": "美國商務部將第二季國內生產毛額成長率上修至百分之二點二，主要受到強勁的個人消費支出帶動。這項數據化解了市場對於經濟衰退的疑慮，顯示美國經濟基本面依然相當穩健。", "think": "美國強勁的消費力是台灣出口科技產品的終端保證。只要美國不衰退，台股的電子外銷產業就能維持成長動能，這對台股下半年的營收表現是一劑強心針。", "question": "在美國經濟展現韌性的背景下，您會如何調整您的台美股資產配置比例？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202610010005.aspx", "name": "中央社"}]}], "robotics": [{"title": "Intel說明Core Ultra搭配OpenVINO實體AI自主機器人優勢", "teaser": "英特爾邊緣運算新突破", "full": "英特爾詳細說明了其最新處理器搭配OpenVINO實體AI框架的優勢，強調這套組合能大幅提升自主機器人的邊緣運算能力。這項技術能讓機器人在不依賴雲端的情況下，更快速地做出即時反應與決策。", "think": "邊緣運算（Edge AI）是機器人走入日常生活的關鍵。當晶片能在本地端處理複雜視覺與感測數據，機器人才能真正實現自主化，這將帶動下一波邊緣晶片的商機。", "question": "隨著邊緣AI晶片效能提升，您認為最快會被機器人取代的日常工作是什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiYkFVX3lxTE0tTkkwN0JlajFXTDlxdnN3RFctU2F2VzJKX3BmbE9CRDdOSDdSQ3hNUzMyOFFEaTRtazNHRmNQcE81Y0M3NG44VTJjSE96b3h5M2tGd0JPRklORXNoMnFXWFZB?oc=5", "name": "T客邦"}]}, {"title": "美軍相隔7年再設新司令部 統籌AI、無人機與機器人作戰", "teaser": "軍事科技化迎向新戰場", "full": "美國國防部宣布相隔七年首度成立全新司令部，專責統籌人工智慧、無人機與機器人等先進科技的作戰應用。此舉顯示美軍正加速將自動化與智能化技術導入現代化國防，以確保科技領先優勢。", "think": "國防軍工一直是頂尖科技的搖籃，軍事需求的爆發將加速機器人與AI技術的成熟，並逐漸外溢到民用市場。相關軍工科技與無人機概念股值得長期追蹤。", "question": "軍用機器人技術的快速發展，是否會加速民用服務型機器人的普及？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiZkFVX3lxTE5LUmwzUEJCdVdGT3lhYXRtYUh6alNVTUo3ejBEOFBmZ0FRZnd1Ry0zOGxDZ1J3OWV3WUZ2cWxhejhsMU9XSE9ncTRxMmYzcGRYTW05aU9jQngtTWM2VDFjcWE0c0w3Z9IBa0FVX3lxTE5Pa1kxaFNnMDNBMnFFbHhGSmxuVWd1cmVWYzA4c2NqMFQ0QzM3bl9ldVJBUnN3QVFtdnIwcXp3TFRvU1FVTTZ5ZlpyeTZrd2JfRFV6QkwyY3hXc2t0dV95Z1ZMd1ZuN0N2Nkhz?oc=5", "name": "自由時報"}]}, {"title": "AI下一棒浮現 創投專家看好推論與機器人躍新戰場", "teaser": "創投看好機器人新戰場", "full": "創投專家指出，隨著生成式AI的基礎建設逐漸完備，市場焦點將轉移到「推論」應用與「實體機器人」上。這些領域被視為AI產業的下一波爆發點，吸引了大量資金與頂尖人才投入研發。", "think": "過去兩年是AI基礎建設（算力）的天下，接下來則是應用的時代。機器人作為AI的最佳實體載體，其軟硬體整合能力將是未來新創企業勝出的關鍵。", "question": "當AI發展從「算力競賽」轉向「實體應用」，您會調整您的科技股投資策略嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiTEFVX3lxTE5Lb0xDeTJOY3FTaUVmU3I5Um9XNEN1N3ZMbWxablh5eEViSkVwbHI4ek5HT3R1SjcxdUhfNm9ScWJ6TWpZdWlqVk02T3c?oc=5", "name": "聚財網"}]}, {"title": "大陸人形機器人出貨占全球逾9成 智元出貨量超越宇樹", "teaser": "中國人形機器人出貨爆發", "full": "根據最新產業報告，中國在人形機器人出貨量上已佔全球九成以上，其中新創公司智元上半年的出貨表現更超越了傳統強手宇樹。這顯示中國在供應鏈完整度與量產成本上，已取得極大的競爭優勢。", "think": "雖然高階晶片受限，但中國憑藉強大的製造供應鏈，在機器人硬體量產上展現驚人速度。這提醒投資人，機器人硬體降本的速度可能比想像中更快，有利於商業化普及。", "question": "面對中國在機器人硬體製造的低成本優勢，台廠該如何發揮系統整合的價值？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTFBOMDgyNVN6MU03QXFMdW1yMVg3TDVfbVJtcVlHcU5PUEJ0LXRuMElHa1Q2a2M2NTdQVzNwb3RaNWxIdV9XTUhzQ3ZwUm85T2RQTVE?oc=5", "name": "n.yam.com"}]}, {"title": "美防長啟動子午線計畫！鎖定AI與機器人技術", "teaser": "子午線計畫引爆軍工科技", "full": "美國國防部長正式啟動「子午線計畫」，旨在加速將人工智慧與機器人技術整合至國家安全體系中。此計畫預期將帶動大量政府採購合約，為相關軍工科技與自動化設備業者注入強勁成長動能。", "think": "政府政策與國防預算的直接挹注，是科技產業最穩固的護城河。這類國家級計畫通常合約期長、利潤穩定，相關受惠的供應鏈廠商將迎來長線利多。", "question": "在政策紅利推動下，您是否會考慮將軍工科技或政府標案概念股納入配置？", "sources": [{"url": "https://news.google.com/rss/articles/CBMikAFBVV95cUxPRWhsZFhoaUdFZUFENE1Xc01IN3Rkd3dOMVB5djNpWlNJUDllSHBPM29XUXJ3M0Y1NWxkLXI0UXdzUTBYLVlwbUh0SW0tODByMldHSmU0aTM3YkNGWlh4TG9scVI4UnRUdGdQNkpVSXA5T3dzS2dLQ3lVYWI1cGFWVDY4MU9lSDBxSmIxUHEwLWw?oc=5", "name": "CMoney投資網誌"}]}], "tech": [{"title": "台積 2 奈米良率甩三星／Intel？先進製程滿到 2028", "teaser": "台積先進製程訂單爆滿", "full": "市場消息指出，台積電在二奈米先進製程的良率上持續領先競爭對手三星與英特爾，訂單能見度已一路看好排到二零二八年。這項領先優勢確保了台積電在未來數年內，仍將獨佔全球高階晶片代工市場。", "think": "技術領先就是硬實力，台積電在先進製程的絕對壟斷地位，讓其具備強大的定價權。對於長期投資人而言，這無疑是最令人安心的資產。", "question": "面對台積電無人能及的製程領先，您認為競爭對手還有翻盤的機會嗎？", "sources": [{"url": "https://technews.tw/2026/10/01/piper-says-tsmc-capacity-sold-out-through-2028-on-strong-ai-demand/", "name": "科技新報"}]}, {"title": "三星 Galaxy S27 系列傳迎來有感漲價，大容量版本價差恐再拉大", "teaser": "旗艦手機恐迎來漲價潮", "full": "供應鏈傳出三星下一代旗艦手機Galaxy S27系列將因關鍵零組件成本上升而面臨有感漲價，特別是大容量版本的價差可能會進一步拉大。這反映出高階晶片與記憶體價格居高不下對消費電子的衝擊。", "think": "科技新品漲價已成趨勢，這也考驗消費者的荷包。對投資人來說，這代表上游零組件廠商（如台積電、記憶體大廠）成功轉嫁成本，其獲利能力依然穩健。", "question": "面對不斷上漲的旗艦手機價格，您會選擇延長手機使用壽命還是照樣買單？", "sources": [{"url": "https://technews.tw/2026/10/01/samsung-s27-series-price-increase/", "name": "科技新報"}]}, {"title": "「HomePad」傳 10/13 亮相，將復刻 iMac G4 經典設計", "teaser": "蘋果復古風新品將登場", "full": "蘋果傳出將於十月中旬發表全新智慧家居裝置「HomePad」，外觀設計將向經典的iMac G4致敬，採用復古的半球形底座與可調角度螢幕。這款產品被視為蘋果搶攻智慧家庭生態系的重要武器。", "think": "蘋果將經典設計與現代智慧家居結合，展現出其獨特的工業設計美學。這不僅能吸引老果粉的懷舊情懷，也為沉寂已久的智慧家居市場注入新活力。", "question": "蘋果的復古風智慧家居新品，會激起您將家中設備全面智慧化的慾望嗎？", "sources": [{"url": "https://technews.tw/2026/10/01/homepad-apple-event/", "name": "科技新報"}]}, {"title": "路透：麥當勞推 AI 定價工具，曾建議大麥克套餐賣 570 元", "teaser": "AI定價考驗消費者荷包", "full": "根據外媒報導，連鎖速食龍頭麥當勞正嘗試導入人工智慧定價工具，該系統曾根據市場供需與成本大膽建議將大麥克套餐定價調升至台幣五百七十元。這項嘗試引發了市場對於AI動態定價是否合理的討論。", "think": "AI動態定價雖然能幫企業追求利潤最大化，但若過度偏離消費者認知，可能會引發公關危機。這顯示AI在應用於民生消費時，仍需考量人性與社會觀感。", "question": "如果速食店全面採用AI動態定價，您會因為離峰時段便宜而改變用餐習慣嗎？", "sources": [{"url": "https://technews.tw/2026/10/01/inside-mcdonalds-push-to-have-ai-price-your-big-mac/", "name": "科技新報"}]}, {"title": "牧德訂單能見度達 1 年，2027 年 AI 營收占比上看 9 成", "teaser": "牧德受惠AI設備需求旺", "full": "光學檢測設備大廠牧德科技表示，受惠於半導體客戶對AI相關設備的強勁需求，目前訂單能見度已長達一年。公司更樂觀預估，到了二零二七年，AI相關業務的營收占比有機會一舉衝上九成。", "think": "AI浪潮不僅利多晶片廠，周邊的檢測、封裝設備廠也同樣吃香。牧德的亮眼展望，印證了AI資本支出正實質轉化為設備台廠的營收，是具體的業績支撐。", "question": "在尋找AI投資標的時，您是否會將目光從晶片大廠移向這些默默賺錢的設備供應商？", "sources": [{"url": "https://technews.tw/2026/10/01/motech-order-visibility-1-year-ai-revenue-90-percent-2027/", "name": "科技新報"}]}]}}</script>

kySzhLU0tpUEpYUkVmVWhCWVFpeDdhVEVialNwNFVWQzByNU13?oc=5", "name": "BigGo 財經"}]}, {"title": "正淩機器人元件明年放量，AI光通訊鎖定高階規格", "teaser": "機器人元件與光通訊放量", "full": "連接器廠正淩在機器人元件領域佈局有成，預計明年將迎來出貨放量。同時，公司在AI光通訊領域也積極鎖定高階傳輸規格，展現多角化經營與高技術門檻的競爭優勢。", "think": "光通訊與機器人是當前科技業的兩大顯學，兩者都需要極高精度的連接技術。掌握核心技術的台廠，在多元應用的趨勢下具有極高的成長潛力。", "question": "面對同時跨足光通訊與機器人的台廠，你會如何評估其長期的成長潛力？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiZEFVX3lxTE1HNW1nRGNKXzNKYVZMTkIwQkE2UC1Ydk1OcEt6dFJ2RHhnd0VpN2poSk50dlJ3dFNPcHpLZlY2MTVTYmRxR05Db3gtSUwxSzNEV2k0Tm9NR0JNQnJXQ3N4MFZLVjDSAWRBVV95cUxNRzVtZ0RjSl8zSmFWTE5CMEJBNlAtWHZNTnBLenRSdkR4Z3dFaTdqaEpOdHZSd3RTT3B6S2ZWNjE1U2JkcUdOQ294LUlMMUszRFdpNE5vTUdCTUJyV0NzeDBWS1Yw?oc=5", "name": "自由財經"}]}, {"title": "招商證券：人形機器人邁向規模交付，供應鏈朝平台化發展", "teaser": "人形機器人邁向規模交付", "full": "招商證券報告指出，人形機器人正加速進入規模化交付階段，整體供應鏈正朝向平台化與模組化發展。這將有助於降低生產成本，並加速機器人在各行各業的普及與應用。", "think": "供應鏈的模組化是任何新科技走向大眾化的必經之路，就像當年的智慧型手機一樣。這意味著未來機器人零組件的標準化程度會提高，台廠在其中的代工優勢將更形重要。", "question": "當人形機器人供應鏈走向模組化，你認為台灣零組件廠商最大的優勢與挑戰分別是什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMicEFVX3lxTFBFNlVOcXlRMTRKQkZLTnc2eWh1aDVjVXFWT25xbzNvRWlNSlIwWVAxR1ZhaE9wTTVnSzB2c0p3RGx3Q0Y5YnhFOHJRSTRMT2FzNi00ZHlCYjNLLTFTWjhyRHRnRU9yTEFYbWFyVUlJWEY?oc=5", "name": "Investing.com 香港 - 股市報價& 財經新聞"}]}], "tech": [{"title": "AI攻擊僅需12分鐘展開，企業平均修補時間卻需3天", "teaser": "AI網路攻擊速度大幅提升", "full": "研究指出，利用AI技術進行的網路攻擊，最快可在12分鐘內展開，然而企業平均需要花費3天時間才能完成系統修補。這種不對稱的速度差，正對企業的資安防護帶來嚴峻挑戰。", "think": "這項數據提醒所有上班族，資安不再只是IT部門的事。在AI時代，個人的密碼管理與防範釣魚意識，是保護公司資產的第一道防線。", "question": "面對AI時代快速且精準的網路攻擊，你的工作環境是否有足夠的防範意識？", "sources": [{"url": "https://infosecu.technews.tw/2026/09/30/palo-alto-networks-nikesh-arora-is-building-a-defense-against-the-dark-side-of-ai/", "name": "科技新報"}]}, {"title": "Meta跨足企業AI市場，前MongoDB執行長領軍拓新戰線", "teaser": "Meta延攬強將開拓企業AI", "full": "社群巨頭Meta正積極跨足企業級AI市場，並延攬了前MongoDB執行長來領軍這條新戰線。此舉顯示Meta不甘只做消費端應用，更意圖在商用AI領域與微軟、Google一決高下。", "think": "科技巨頭爭相搶食企業AI市場，預示著未來辦公工具將迎來更深度的AI整合。上班族可以提早熟悉各家AI工具，提升未來的職場競爭力。", "question": "如果Meta推出企業專用的AI協作工具，你會願意在工作中使用它嗎？", "sources": [{"url": "https://technews.tw/2026/09/30/meta-enterprise-platform-and-muse-for-small-business/", "name": "科技新報"}]}, {"title": "三星等6家企業聯手投資Helix，砸10億美元擴大AI布局", "teaser": "三星聯手投資擴大AI布局", "full": "韓國三星電子與其他五家企業聯手，共同向AI領域的新創公司Helix投資高達10億美元。這筆龐大資金將用於加速AI技術的研發與落地應用，顯示產業界對AI前景依舊高度看好。", "think": "巨額資金持續湧入AI基礎建設與應用，代表AI浪潮在未來幾年仍是科技業的絕對主旋律。跟著大廠的資金流向走，是尋找長期投資標的的不二法門。", "question": "看到科技巨頭持續砸重金投資AI，這是否會加深你長期持有AI供應鏈股票的信心？", "sources": [{"url": "https://technews.tw/2026/09/30/samsung-6-companies-invest-1-billion-helix-ai-expansion/", "name": "科技新報"}]}, {"title": "Volvo EX90終於在台上市，快充300 kW世代正式到來", "teaser": "瑞典豪華旗艦電動車登台", "full": "豪華車廠Volvo的旗艦電動SUV EX90正式在台灣市場上市，並支援高達300 kW的極速充電技術。這款新車的導入，標示著台灣電動車市場正加速邁入超高速充電的全新世代。", "think": "充電速度是消費者購買電動車的關鍵考量之一。隨著300 kW快充車款的普及，台灣的充電樁基礎建設與相關供應鏈，也將迎來新一波的建置商機。", "question": "隨著超高速充電車款陸續登台，這會提高你將燃油車汰換為電動車的意願嗎？", "sources": [{"url": "https://technews.tw/2026/09/30/volvo-ex90-taiwan-debute/", "name": "科技新報"}]}, {"title": "特斯拉備妥300億美元銀彈，馬斯克攜SpaceX衝刺太陽能", "teaser": "馬斯克備巨資衝刺太陽能", "full": "特斯拉執行長馬斯克透露，公司已準備好300億美元的龐大資金，並計畫攜手SpaceX共同衝刺太陽能與綠能業務。此舉旨在將清潔能源與太空、電動車生態系做更深度的整合。", "think": "馬斯克的眼光不只侷限在地面上的電動車，綠能與太空的結合是他的下一個宏大願景。雖然短期內對營收貢獻有限，但其長遠的戰略布局依然極具想像空間。", "question": "你認為太陽能與太空科技的結合，會在未來十年內改變我們的能源使用習慣嗎？", "sources": [{"url": "https://finance.technews.tw/2026/09/30/spacex-and-tesla-team-up-for-200-gw-of-annual-solar-capacity/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-2000">{"date": "9月30日．週三", "tldr": "今日台股在外資回流下止跌回穩，亞股多數收紅，科技與機器人題材持續發酵，晚間美股期貨震盪待關鍵通膨數據出爐。", "indicators": {"note": "台股加權指數小幅回檔但外資轉買超，那斯達克與台積電ADR走揚，顯示國際科技資金信心回溫。", "tiles": [{"label": "台股加權指數", "value": "47,940.13", "valueClass": "fall", "delta": "-0.18%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "27,042.18", "valueClass": "rise", "delta": "+0.91%", "deltaClass": "rise"}, {"label": "費半指數", "value": "12,608.31", "valueClass": "fall", "delta": "-0.17%", "deltaClass": "fall"}, {"label": "台積電ADR", "value": "457.80", "valueClass": "rise", "delta": "+0.19%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "台股衝高外資回流　新台幣升2.4分、月季線收黑", "teaser": "外資回頭力挺，台股月季線收黑。", "full": "隨著國際市場氣氛轉趨穩定，外資在台股終止連日賣超並轉為買超，帶動大盤指數一度衝高，同時新台幣匯率也呈現升值走勢。不過從月線與季線的角度來看，近期盤勢仍歷經一番震盪整理，整體技術面尚未完全脫離修正壓力。", "think": "外資回流與匯率升值通常是資金面轉多的訊號，對一般投資人來說，這暗示恐慌情緒正在消退，但面對月季線收黑，操作上不宜過度追高，應關注具基本面支撐的權值與產業龍頭。", "question": "當外資重新回頭敲進台股時，你的投資組合準備好迎接下一波主流了嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609300273.aspx", "name": "中央社"}]}, {"title": "牧德：訂單能見度1年以上　明年AI營收占比拚9成", "teaser": "訂單能見度高，AI營收拚九成。", "full": "檢測設備廠牧德釋出樂觀展望，強調目前的訂單能見度已拉長至一年以上，顯示下游需求維持穩健。公司更積極轉型，目標在明年將AI相關應用的營收占比推升至九成，展現深耕人工智慧領域的企圖心。", "think": "這類具備長訂單與高AI比重的個股，往往是市場資金追捧的焦點。對上班族投資人而言，觀察供應鏈實際切入AI的程度，比單純聽題材炒作更有參考價值。", "question": "你關注的供應鏈個股，是否也有實質的AI營收占比來支撐股價？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609300264.aspx", "name": "中央社"}]}, {"title": "9月房市交易量月減年增　房仲：央行鬆綁後買氣回升", "teaser": "房市交易月減年增，買氣逐漸回升。", "full": "最新統計顯示，九月份房市交易量雖然與上月相比略有減少，但若與去年同期相比仍呈現增加趨勢。房仲業者分析，在央行相關政策鬆綁後，市場觀望氣氛減緩，自住與換屋族的買氣有逐步回溫的跡象。", "think": "房市作為經濟的領先指標之一，交易量的變化反映了民間資金流向與信心。對於一般上班族來說，房市的冷熱不僅影響購屋規劃，也是評估內需消費動能的重要風向球。", "question": "在房市政策調整與買氣回溫之際，你覺得現在是進場看房的好時機嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609300228.aspx", "name": "中央社"}]}, {"title": "外資買超296億元終止連2賣　敲進面板雙虎", "teaser": "外資大買近三百億，重押面板雙虎。", "full": "台股迎來強勁的外資回補潮，單日買超金額擴大至近三百億元，順利終止先前連續兩個交易日的賣超態勢。在類股點名上，外資除了青睞權值股外，更明顯點名敲進面板雙虎，帶動相關個股成為盤面焦點。", "think": "外資單日大幅買超往往能扭轉短線短多格局，但特定族群如面板常受景氣循環影響。投資人不宜因單日大買就盲目追高，應理性評估產業庫存與報價是否真的落底。", "question": "面對外資突然的大舉買超，你通常會選擇順勢跟進還是保持觀望？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609300218.aspx", "name": "中央社"}]}, {"title": "富邦證推出美股盤前及盤後交易服務　10/1上線", "teaser": "美股延長交易上線，投資更具彈性。", "full": "為了滿足國內投資人參與海外市場的需求，券商宣布推出美股盤前與盤後交易服務，並預計在十月初正式上線。這項服務讓台灣投資人能在正規開盤時間之外，針對財報發布或突發重大消息第一時間做出交易反應。", "think": "隨著複委託功能越來越貼近美國本土水準，台灣投資人操作美股的便利性大增。這有助於上班族避開半夜看盤的辛勞，但也增加了隨時盯盤、頻繁交易的心理負擔。", "question": "有了美股盤前盤後服務後，你會改變自己參與美股投資的作息與策略嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609300204.aspx", "name": "中央社"}]}], "robotics": [{"title": "比爾・蓋茲表示，以機器人取代人力的企業應繳納同等的聯邦保險捐稅款", "teaser": "機器人取代人力，蓋茲倡議繳稅。", "full": "微軟創辦人比爾・蓋茲近期針對自動化趨勢提出建言，認為企業若使用機器人來取代原本的真人勞動力，政府應針對這些機器人課徵相當於人類員工的保險與相關稅捐。這項提議旨在減緩勞動市場因AI與自動化帶來的衝擊，並維持社會安全網的資金來源。", "think": "當AI與機器人普及壓縮人類就業空間時，稅制改革與社會福利分配將成為全球重大議題。對上班族而言，這提醒我們提升自身無可取代的專業價值，遠比擔心機器人搶飯碗更重要。", "question": "如果企業使用機器人也需要繳交勞健保稅，你認為會減緩企業自動化的速度嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE55WmFSc2hZYVFSV0prR1QwcUNhWWFRcEJkVFJMWjJCeFJDdjFvR3BxeXBaYVF6MFVMa1VMSjZpTTZ6dmVUNU9RWTZUa0wxYzRIaHpNU1l3?oc=5", "name": "Business Insider Taiwan"}]}, {"title": "正淩強攻機器人、光通訊", "teaser": "正淩積極卡位機器人與光通訊。", "full": "連接器廠正淩近年積極調整產品組合，將營運重心擴展至機器人與光通訊等高成長領域。隨著自動化設備與高速傳輸的需求不斷提升，相關佈局逐漸進入收割期，成為法人關注的潛力標的。", "think": "傳統零組件廠透過切入機器人供應鏈成功轉型，是台廠常見的生存之道。對投資人來說，尋找這類具有利基型產品、剛好搭上產業轉型順風車的中小型企業，往往能挖到潛在黑馬。", "question": "你如何在眾多轉型傳統廠中，挑選出真正具備機器人題材實力的公司？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiW0FVX3lxTE9EZjhzT0I3bGZrRzF2NUhjR2daYUtJQjJaWkxSVWhDNUR2TkhxWURHU2UyM0VPamowTk1DUFJwOEVVZHNOT0NmbUhEazV4cjBJQ2x3ejdoUG9peU3SAWBBVV95cUxPbkdpczh5cnQ5QnNYYUdDWFlQTGNYNUppamdsMFQzUEE0LUlHa2Q3VXBBaFZrV29mb19QUWNMSERWNDNjU0lCZnZvRGVzSkZYcWNGRW5KY3ZHRUFjbFpwalY?oc=5", "name": "經濟日報"}]}, {"title": "超預期增長！優地機器人上市後首份中報業績靚麗，清潔機器人暴漲184.2%", "teaser": "清潔機器人飆漲，優地財報亮眼。", "full": "優地機器人發布上市後的首份中期財報，交出優於市場預期的亮眼成績單。其中，清潔機器人業務呈現三位數的暴漲，而機器人即服務（RaaS）的商業模式也展現出強勁的成長動能，驗證了商用服務型機器人的市場需求。", "think": "清潔與服務型機器人不再只是噱頭，而是開始有扎實的財報數字支撐。這顯示B端商業自動化正加速落地，相關供應鏈的獲利能力正逐步受到資本市場檢驗。", "question": "從財報暴增的品項來看，你認為哪一種服務型機器人最快走入你的日常生活？", "sources": [{"url": "https://news.google.com/rss/articles/CBMicEFVX3lxTFB6RDJsNFp1ZXA5YlUya1QzRGFkcndtbllEYlNEeGljXzh2Y2lraUVoVXBBU1plb0h4MHdEVW52X3B6R09ockVCZ3EzNG1Yd25jMmFXdnQyOUE1aVRFRi1EazRfbEJvOWJNZkg3V2gwbzA?oc=5", "name": "Investing.com 香港 - 股市報價& 財經新聞"}]}, {"title": "SFA 推進 AI 自主機器人業務 2030 年目標營收 1.39 萬億韓元", "teaser": "SFA布局AI機器人，鎖定兆元營收。", "full": "韓國自動化大廠SFA正式宣布全力推進AI自主機器人業務，並訂下在2030年實現營收達到1.39萬億韓元的宏大目標。公司計畫透過結合人工智慧與精密機械，全面搶佔全球智慧工廠與物流自動化的龐大商機。", "think": "國際大廠紛紛為AI機器人設立長期營收目標，顯示這是一場長跑競賽。對資本市場而言，長線趨勢已經確立，投資人可以把眼光放遠，關注具有規模優勢的自動化龍頭。", "question": "面對各大企業紛紛喊出宏大的機器人營收目標，你認為幾年內能真正實現普及？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiWEFVX3lxTFBISWZtX19BeUZxRkhScnhlcjdHR3IzSzlNYWpRa0NZWi1nM2NDblNKVFJVWnlMLTEwd0FxMDhZaHBQZm5vZ2duZHdWVXZJMzJLTUptdEI2Tjc?oc=5", "name": "Techritual"}]}, {"title": "美國陸軍機器人競賽評選贏家 推進人形科技軍事探索", "teaser": "美國陸軍競賽出爐，推進人形軍事應用。", "full": "美國陸軍針對機器人技術舉辦的競賽近日選出最終贏家，未來將進一步推進人形機器人技術在軍事領域的實際探索與應用。這項計畫旨在利用先進機器人代替士兵執行高風險任務，降低人員傷亡並提升作戰效率。", "think": "國防預算往往是新科技研發最強大的推手，軍事應用的突破也經常在日後轉化為民生技術。這類消息證明了人形機器人在極端環境下的可靠性正持續被官方認可。", "question": "當人形機器人開始被導入軍事領域，你對這項技術的發展是感到期待還是有些擔憂？", "sources": [{"url": "https://news.google.com/rss/articles/CBMigANBVV95cUxOWEVlRVhYeWZBdWJxLTBnVERINzRPbndYZmpqYzlqd05RUWtxRDNaQ2JNWG5MREUzLXRmOTRhRDFKQ282TWl0ZVpMaXhtSDY1eHZrZVJoX2VBOGFUamg1VWdyanlFNVFjTzlrcFNkUlo3WHAzMVlaXzQ0RTdRYXJDSzNPSkx5OXhCT3lDY2FKQUdTeURJV0VDelkyVDYxMlhRR3JaZERZMUk1Qldvem0wd0swY3RRMzZWcW00Zko4S0NJbmlJOGd5eEhYN0JDa01SUnpra05PZmJJUlJLemN1b3NVejl3WXhiRHI0NkFrWkMwc2ZVazJ0QTEzYXB6SmNfSXA4c3k4RVBnYkVsbVZFdVdsSlZwbTBDNmxZYTNoRmY4NmJTTndOU2VfOTBLdTg0blZTTkZyYjJLUE9Hb3ZfVWhTb3JLY21tdnAzQmhkdUxMV3pGb3pmOXFtZmhVX0FLckFnVmo2NGpiU0RWdzU0VjVaQ1k1WHMxQWpOV0pfc0M?oc=5", "name": "商傳媒"}]}], "tech": [{"title": "韋伯望遠鏡顛覆認知！宇宙誕生僅 5 億年，早期星系已開始向外散布重元素", "teaser": "韋伯望遠鏡發現，早期星系超乎預期。", "full": "詹姆斯・韋伯太空望遠鏡再度帶給天文學界驚喜，最新觀測顯示，在宇宙誕生僅五億年的極早期階段，星系就已經開始向外散布重元素。這項發現顛覆了過去天文學界對早期宇宙演化速度與化學元素形成的傳統認知。", "think": "科學界對宇宙起源的認知不斷被刷新，這提醒我們任何看似固定的真理都可能隨新工具出現而改變。對上班族來說，保持對新知的好奇心，有助於在瞬息萬變的世界中維持敏銳的洞察力。", "question": "如果連宇宙演化的教科書都在被不斷改寫，你對身邊哪一項既定常識曾產生過懷疑？", "sources": [{"url": "https://technews.tw/2026/09/30/early-galaxies-had-already-spread-heavy-elements-across-the-universe/", "name": "科技新報"}]}, {"title": "狂燒逾 1 萬美元 Token，神人打造網頁版「台北 GTA」", "teaser": "神人燒萬元Token，打造網頁版台北GTA。", "full": "有技術狂熱者透過大量消耗AI模型的Token運算資源，成功打造出以台灣台北街景為背景的網頁版仿《俠盜獵車手》（GTA）遊戲。這項作品展現了生成式AI與網頁技術結合的驚人潛力，引發網路社群的高度關注與熱烈討論。", "think": "這類由個人開發者創造的驚豔專案，往往展現了新技術在娛樂與創意領域的無限可能。它告訴我們，AI時代的創新不再只是大企業的專利，個人創意結合強大工具也能擦出火花。", "question": "如果有無限的AI運算資源，你會想用它打造出哪一個充滿台灣味的小遊戲？", "sources": [{"url": "https://technews.tw/2026/09/30/taipei-gta/", "name": "科技新報"}]}, {"title": "AI 攻擊 12 分鐘就能展開，企業平均修補時間仍需 3 天", "teaser": "AI攻擊僅需12分鐘，企業修補需3天。", "full": "資安研究指出，駭客利用AI發動攻擊的速度極快，往往在短短十二分鐘內就能全面展開；然而相對地，企業在面對漏洞時，從發現到完成修補平均仍需耗費三天時間。這種攻防時間差為企業網路安全帶來極大的隱憂與挑戰。", "think": "速度就是資安的生命，當攻擊全面自動化與AI化，傳統依賴人工反應的防禦機制已經不敷使用。對企業與IT從業人員而言，升級自動化防禦系統已經是刻不容緩的生存課題。", "question": "在AI攻擊變得如此迅速的時代，你個人日常的手機與電腦資安習慣有跟著升級嗎？", "sources": [{"url": "https://infosecu.technews.tw/2026/09/30/palo-alto-networks-nikesh-arora-is-building-a-defense-against-the-dark-side-of-ai/", "name": "科技新報"}]}, {"title": "Meta 跨足企業 AI 市場，前 MongoDB 執行長領軍開拓新戰線", "teaser": "Meta進軍企業AI，前大廠CEO領軍。", "full": "社群巨頭 Meta 積極拓展商業版圖，正式宣佈跨足企業級人工智慧市場，並找來前 MongoDB 執行長親自領軍，開拓全新的營收戰線。此舉意味著 Meta 將從消費端應用與廣告，進一步與微軟、谷歌等大廠正面交鋒。", "think": "科技巨頭在AI領域的軍備競賽已經從C端打到B端，企業軟體市場將迎來新一波割喉戰。對投資人而言，這類巨頭的策略轉向往往會重新定義整個產業的競爭格局與資金流向。", "question": "當各大社群與科技巨頭紛紛搶進企業AI市場時，哪一家公司的策略最讓你具備信心？", "sources": [{"url": "https://technews.tw/2026/09/30/meta-enterprise-platform-and-muse-for-small-business/", "name": "科技新報"}]}, {"title": "三星 6 家企業聯手投資 Helix，砸 10 億美元擴大 AI", "teaser": "三星六企聯手投資，砸十億美元拚AI。", "full": "南韓三星集團展現對人工智慧的強烈企圖心，旗下六家企業罕見聯手進行大規模投資，砸下高達十億美元資金入股 Helix，全面擴大在AI生態系中的布局。這項策略合作將有助於三星串聯集團內部的軟硬體資源，強化其在全球AI浪潮中的競爭力。", "think": "集團式的大手筆投資顯示   });

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
