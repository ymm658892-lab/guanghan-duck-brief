  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

通膨政策直接鎖定民生物資，反映出民生消費物價對政經局勢的敏感影響。民生消費力的維持對於整體消費類股與總體經濟信心有顯著的底線支撐作用。", "question": "關稅調整對民生物價的短期平抑，能否真正解決長期結構性通膨？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202608210329.aspx", "name": "中央社"}]}, {"title": "中東局勢及亞洲需求推動 油價上漲", "teaser": "地緣政治與需求帶動油價上漲", "full": "受中東地緣政治緊張局勢加劇，以及亞洲市場需求回溫等多重因素影響，國際油價呈現走升態勢。市場持續關注能源供應鏈是否受到實質干擾，以及後續石油輸出國組織的產量策略變動。", "think": "油價上揚往往是通膨預期與運輸成本的風向標，對全球航空、物流與石化產業影響巨大。上班族與投資人需密切留意能源價格波動對日常生活開銷與企業獲利的連帶效應。", "question": "能源價格震盪加劇，你在投資組合中是否有配置抗通膨或避險標的？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608220007.aspx", "name": "中央社"}]}], "robotics": [{"title": "中國人型機器人迎量產！今年市場規模達150億人民幣，估2027年至少成長60%", "teaser": "人型機器人量產商機全面爆發", "full": "中國人型機器人產業邁入商業化量產新階段，今年市場規模預計達150億人民幣，行業評估至2027年成長率將超過60%。隨著供應鏈成熟與成本降低，人型機器人正在快速從實驗室走向工業製造與服務場景。", "think": "機器人產業加速量產意味著關鍵零組件如減速器、伺服馬達等需求的爆發。投資人可關注在機器人供應鏈中佔據關鍵技術與成本優勢的台廠供應鏈鏈結。", "question": "當人型機器人進入大規模量產，哪些傳統人力崗位最可能被加速替代？", "sources": [{"url": "https://technews.tw/2026/08/21/trendforce-counterpoint-see-2026-ai-human-robot/", "name": "科技新報"}]}, {"title": "MQ-9戰損慘重，通用原子推出「野火」無人機計畫準備取代死神", "teaser": "軍用無人機技術面臨世代交替", "full": "面對MQ-9死神無人機在現代戰場上的高損耗率，通用原子公司正式啟動「野火」無人機開發計畫，旨在打造成本更低、生存能力更高的新一代無人機平台。這標誌著軍用無人機向低成本群攻與高生存力轉型的趨勢。", "think": "國防軍工領域正加速向低成本、高自主性的無人系統轉型，驅動相關感測器與AI邊緣運算技術的突破。這展現了科技在非民用領域的快速迭代，亦是整體航太供應鏈的新動能。", "question": "國防無人機朝向低成本化發展，將對傳統高單價軍工產業帶來何種衝擊？", "sources": [{"url": "https://technews.tw/2026/08/21/ga-asi-unveiled-new-wildfire-male-drone-program-as-the-successor-of-the-reapers/", "name": "科技新報"}]}, {"title": "賭城變身自駕戰場！特斯拉、Uber、Waymo獲准一年內部署8千輛自駕計程車", "teaser": "賭城迎來大規模自駕車營運", "full": "拉斯維加斯核准特斯拉、Uber與Waymo等巨頭，於未來一年內部署多達8000輛自駕計程車，賭城正式成為自動駕駛技術的最大落地試驗場。這項大規模部署將實測自駕車在複雜城市交通中的安全性與商業營運模式。", "think": "自駕計程車的大規模落地代表無人駕駛營運商業化進入實質戰場。這不僅改變了交通出行體驗，也將帶動車用晶片、光達感測器與車聯網數據服務的龐大需求。", "question": "如果自駕計程車普及率大幅提升，你認為未來的私家車持有意願會如何改變？", "sources": [{"url": "https://technews.tw/2026/08/21/tesla-uber-and-waymo-all-get-the-ok-to-operate-thousands-of-robotaxis-in-nevada/", "name": "科技新報"}]}, {"title": "從自動化走向自主化，Nvidia Physical AI成自動化大展焦點，台達、所羅門大秀機器人新應用", "teaser": "物理AI驅動機器人自主化轉型", "full": "自動化工業大展上，Nvidia推動的Physical AI成為核心焦點，宣告機器人從傳統硬編程自動化進入自主思考新時代。台達電與所羅門等台廠也展出最新結合視覺與AI的智慧機器人應用，展現強大軟硬整合力。", "think": "AI與實體機器人的結合正打破工業製造的效率天花板，提升製造業彈性與客製化能力。上班族需了解AI自動化非遠不可及，而是已經深植於智慧工廠與物流營運中。", "question": "當機器人學會自主思考與調整，未來的製造業工程師該著重培養哪些不可替代的能力？", "sources": [{"url": "https://www.ithome.com.tw/news/178346", "name": "iThome"}]}], "tech": [{"title": "企業 AI 導入為何卡關？主管親自示範與打造「容錯文化」是落地關鍵", "teaser": "打造容錯文化推動AI企業落地", "full": "許多企業在引進AI技術時遭遇瓶頸，專家指出技術並非唯一的障礙，企業文化與主管態度才是成功關鍵。主管若能親自示範使用並營造允許試錯的環境，員工才能真正將AI工具融入日常工作流程中。", "think": "AI轉型不只是採購軟體，更是一場組織文化的改革。身為職場上班族，主動擁抱AI工具並具備實驗精神，將是數位時代提升個人競爭力的關鍵心法。", "question": "在你目前的日常工作中，阻礙你全面使用AI工具的最大因素是什麼？", "sources": [{"url": "https://technews.tw/2026/08/22/workforce-development-in-the-age-of-ai/", "name": "科技新報"}]}, {"title": "先進封裝推升檢量測需求，法人看好倍利科與大廠合作已築護城河", "teaser": "先進封裝帶動檢量測設備需求", "full": "隨著半導體邁向先進封裝時代，晶片結構日益複雜，對精密檢測與量測設備的需求呈爆發式成長。法人指出，本土設備廠如倍利科透過與國際半導體大廠深度合作，已成功構築極高的技術與商業護城河。", "think": "半導體演進不單靠製造技術，後段先進封裝與品質檢測同樣關鍵。投資人布局半導體產業時，除了晶圓代工巨頭，亦可延伸關注關鍵設備與檢測護城河企業。", "question": "在半導體繁榮期，你偏好投資終端晶片巨頭還是提供關鍵檢測設備的隱形冠軍？", "sources": [{"url": "https://technews.tw/2026/08/21/taiwan-investors-see-v5-technologies/", "name": "科技新報"}]}, {"title": "晶技打進前十大光通供應鏈，AI、車用成明年成長雙引擎", "teaser": "光通訊與車用加持迎成長引擎", "full": "石英元件大廠晶技成功打入全球前十大光通訊廠供應鏈，搭配AI伺服器與車用電子需求持續強勁，為明年營運注入雙重成長引擎。公司透過高階頻率元件產品線高毛利化，展現強勁的營運轉型成果。", "think": "傳統零組件廠若能成功搭上AI高速傳輸與車用電子列車，就能獲得高毛利與新成長曲線。這驗證了技術升級與對準新應用趨勢對電子零組件產業的重要性。", "question": "面對傳統電子零組件轉型，你如何觀察其切入高毛利AI供應鏈的實質成效？", "sources": [{"url": "https://technews.tw/2026/08/21/taiwan-investors-see-txc-2026-q2-financial-report/", "name": "科技新報"}]}, {"title": "日月光：攜手在地半導體材料供應鏈，為台灣築起20年防禦高牆", "teaser": "深耕在地供應鏈築起競爭防線", "full": "封測龍頭日月光表示，透過全力扶植在地半導體材料供應鏈，不僅能降低對進口的依賴，更為台灣半導體產業築起未來20年的競爭防禦高牆。這種在地生態系的凝聚力，是維持台灣全球半導體樞紐地位的核心。", "think": "地緣政治下「在地供應鏈韌性」成為關鍵議題。封測大廠帶頭扶植本土材料商，不僅穩定產能，也為台灣許多隱形冠軍材料廠帶來長期的訂單保障與升級契機。", "question": "台灣半導體在地供應鏈更加完善後，對全球半導體板塊會產生什麼樣的重塑？", "sources": [{"url": "https://finance.technews.tw/2026/08/21/by-joining-hands-with-the-local-semiconductor-materials-supply-chain-a-20-year-defensive-wall-has-been-built-for-taiwan/", "name": "科技新報"}]}, {"title": "半導體材料邁向新紀元！徐秀蘭：台灣隱形冠軍要走向世界定義材料新標準", "teaser": "台灣材料隱形冠軍邁向國際化", "full": "中美晶董事長徐秀蘭指出，台灣半導體材料產業擁有卓越的研發與製造實力，未來的關鍵在於從在地隱形冠軍轉型為國際標準制定者。透過自主技術研發與國際市場拓展，台灣材料廠有能力在全球供應鏈中掌握更大話語權。", "think": "台灣半導體實力已從製造代工延伸至上游材料與化學品領域。產業領袖倡議定義國際標準，意味著台廠正嘗試從技術跟隨者轉型為產業規格的塑造者。", "question": "台灣企業若要從「隱形冠軍」轉型為「規格制定者」，最需要突破的瓶頸是什麼？", "sources": [{"url": "https://finance.technews.tw/2026/08/21/taiwans-hidden-champion-aims-to-define-new-standards-for-materials-on-the-world-stage/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-1300">{"date": "8月22日．週六", "tldr": "週末午間全球市場與科技發展動態交織，美股走升、輝達財報與全球機器人大賽備受矚目；美光與富士軟片加碼半導體投資，顯示科技產業長線需求依然強勁穩固。", "indicators": {"note": "此指標反映週末前市場偏多整理，台股與科技大廠回溫，為下週觀望輝達財報提供情緒基礎。", "tiles": [{"label": "台股加權指數", "value": "45,224.29", "valueClass": "rise", "delta": "+0.65%", "deltaClass": "rise"}, {"label": "那斯達克", "value": "26,180.46", "valueClass": "rise", "delta": "+0.43%", "deltaClass": "rise"}, {"label": "費半指數", "value": "11,740.37", "valueClass": "fall", "delta": "-0.51%", "deltaClass": "fall"}, {"label": "台積電ADR", "value": "418.95", "valueClass": "rise", "delta": "+0.71%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "投資人聚焦美降借貸成本 美股多數收漲", "teaser": "美股多數走揚 市場關注降息動向", "full": "隨著投資人將焦點轉向美國政府與聯準會如何壓低長期借貸成本，美股主要指數大多收高。市場密切關注未來的利率走勢，期待資金成本下降帶動企業獲利成長與股市流動性。整體而言，市場情緒在經濟數據發布前保持樂觀且審慎，投資人持續調整資產配置。", "think": "借貸成本降低有利於企業資金週轉與擴產，對股市長期評價有正面提振作用。身為一般投資人，可關注受惠於資金鬆綁的板塊，適度配置抗通膨或成長型標的。", "question": "當降息預期升高時，你的投資組合是否有做好相應的調整？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608220006.aspx", "name": "中央社"}]}, {"title": "美時攜手Alvotech推生物相似藥 搶攻美亞市場", "teaser": "台廠生技布局全球 擴展美亞版圖", "full": "國內藥廠美時宣佈與國際生物製藥巨頭Alvotech擴大合作，共同推動兩款生物相似藥開發與商業化，全力進軍美國與亞洲關鍵市場。此項戰略合作不僅展現台廠在國際生技供應鏈中的高品質技術，也有助於提升美時產品線的多樣性與長期營收穩定度。", "think": "生物相似藥市場規模快速成長，生技產業的國際結盟能有效分散風險並打入主流市場。小資族在關注科技股之餘，也可留意具備國際競爭力的台股生技股長線價值。", "question": "你認為台股生技公司走國際合資模式，能否成為長線獲利的新引擎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608210325.aspx", "name": "中央社"}]}, {"title": "三星宣佈買回800億美元自家股票 創韓企紀錄", "teaser": "三星重磅買庫藏股 創韓企新高", "full": "韓國科技巨頭三星電子宣佈將實施高達800億美元的自家股票買回計畫，規模創下韓國歷史上企業最大紀錄。此舉旨在維護股東權益與提升股價價值，同時向市場傳遞公司對長期營運與先進製程技術實力的強烈信心，引發全球金融市場廣泛關注。", "think": "巨大規模的庫藏股買回通常能為股價提供強有力支撐，並展現管理層對財務狀況的自信。這提醒我們，企業如何運用手頭現金維護股東價值，是挑選優質個股的重要指標。", "question": "當大型科技股進行巨額庫藏股回購時，會如何改變你對該產業的投資意願？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202608210320.aspx", "name": "中央社"}]}, {"title": "創惟期許下半年營運升溫 擇機進行價格調整", "teaser": "IC設計廠看下半年 擇機調價", "full": "IC設計大廠創惟公開表示，期待下半年整體營運表現能夠優於上半年，並將視市場供需與成本變化，於適當時機調整產品價格。隨著電子產業供應鏈庫存逐漸消化至健康水位，終端消費需求回溫，帶動相關高速傳輸晶片出貨量成長。", "think": "半導體IC設計廠若能具備定價權與營收回升動能，通常代表終端需求實質改善。上班族投資人可關注傳輸介面與消費電子供應鏈的回溫節奏，作為擇時進場的參考。", "question": "你會如何觀察科技產業庫存去化完成後的價格調升訊號？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608210312.aspx", "name": "中央社"}]}, {"title": "地緣局勢與亞洲需求帶動 國際油價持續走揚", "teaser": "需求與地緣推升 激勵油價走高", "full": "受中東地緣政治緊張情勢持續，以及亞洲市場能源需求逐漸回溫等雙重因素推動，國際原油價格呈現上漲趨勢。原油作為全球基礎通膨的重要變數，其價格走高引發市場對能源成本與通膨壓力的關注，投資人持續盯緊產油國的後續產量政策。", "think": "油價上漲直接影響運輸成本與日常生活物價，也可能延緩央行降息的腳步。通勤族在規劃個人預算與投資時，應將能源通膨風險納入資產配置考量。", "question": "面對原油價格上漲帶來的通膨壓力，你的日常開支與投資策略會做出什麼改變？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608220007.aspx", "name": "中央社"}]}], "robotics": [{"title": "北京機器人嘉年華登場 輝達家族成員現身關注AI", "teaser": "機器人盛會登場 輝達家族現身", "full": "北京機器人嘉年華盛大舉行，吸引全球頂尖AI與機器人業者參展。值得注意的是，輝達執行長黃仁勳的女兒也親自現身走訪多家人工智慧企業，引發現場與市場強烈關注。這顯示出國際科技巨頭對於亞洲具身智慧與機器人生態系發展的高度重視。", "think": "AI與機器人的融合已成為全球科技巨頭競爭的下一波核心戰場。從科技高層的動向可以看出，軟硬體整合的機器人產業正迎來黃金發展期。", "question": "科技領袖對機器人產業的積極布局，是否會讓你增加對相關概念股的關注？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiT0FVX3lxTFAwd09EbUMzMnV6ckJDczJ2bHRDTmNRWEJTempvVWdLRmMyd2VaYU5Wem5KdG5NcUdnV3Yyajg3cXcxNFhwd3NDTmdFSHVrc00?oc=5", "name": "TVBS新聞網"}]}, {"title": "中國推動質量強鏈政策 具身智慧機器人獲重點列案", "teaser": "政策扶持機器人 具身智慧獲選", "full": "中國最新發布質量強鏈攻堅項目，將具身智慧機器人與固態電池等前沿技術列入十大重點扶持領域。政策面全力挹注資源，旨在打通供應鏈瓶頸並加速商業化應用，預計將帶動上下游零組件與演算法廠商的技術突破與產能擴張。", "think": "政策資本的引導往往是新興產業加速成熟的重要催化劑。對於關心科技趨勢的投資人來說，政策重點支持的領域往往孕育著供應鏈轉型的投資機會。", "question": "在政策資本大力支持下，你認為機器人產業多久能實現大規模商業落地？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTFBfcWdTbkx3clYxZmRVQnljZlowUk1QeGNfc3lQOVctM1ZHVTg2SnUzQWFDbUhTTjRfVnUxSnB3OTVVQlVlc2t0Zkx2X2VtazRLZ21kbS1WUlFDaGM5d3k4?oc=5", "name": "工商時報"}]}, {"title": "宇樹科技王興興預言 人形機器人將迎來GPT時刻", "teaser": "業界龍頭預言 機器人迎GPT", "full": "中國人形機器人領軍企業宇樹科技創辦人王興興表示，人形機器人技術發展迅速，普及的GPT時刻即將到來。隨著大語言模型與具身人工智慧技術突破，機器人在控制力、環境感知與自主決策上皆有飛躍進展，預示著應用場景的大爆發。", "think": "當機器人具備類似ChatGPT的生成與理解能力，將徹底改變勞動力結構與生產模式。一般上班族除了投資機會，也應思考如何提升不可替代 <script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
