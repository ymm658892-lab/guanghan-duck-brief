  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

產業龍頭，不宜盲目跟風追高。", "question": "在多空力道交織的市場環境下，你傾向採取積極加碼還是保守觀望？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611090012.aspx", "name": "中央社"}]}, {"title": "傳Anthropic斥資逾千億元採購發電機 供電AI資料中心", "teaser": "大廠重金解決AI電網需求", "full": "隨著人工智慧模型算力需求急劇成長，AI巨頭Anthropic傳出斥資逾千億元採購大型發電機設備，以確保旗下資料中心擁有穩定能源供電。此舉凸顯能源供給已成為當前發展高階AI基礎設施的最大挑戰之一。", "think": "AI算力的背後是極大的能源消耗，能源與電力設備相關概念股已成為AI供應鏈中的隱形贏家。投資人不防放寬眼界，關注電力與綠能設備發展。", "question": "你是否關注過除了晶片之外，支撐人工智慧發展的電力基礎設施商機？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202611080186.aspx", "name": "中央社"}]}], "robotics": [{"title": "汎瑋材料前三季EPS達4.22元創高！機器人新訂單出貨", "teaser": "機器人新單助攻前三季EPS", "full": "汎瑋材料公佈前三季每股純益達4.22元，創下歷史新高紀錄。公司表示主要受益於高毛利的機器人相關組件與新客戶訂單陸續開始量產出貨，帶動整體營運表現出色，未來將持續佈局智慧自動化供應鏈。", "think": "機器人零組件需求正從概念走向實質業績貢獻，這類具備基本面支撐的小巨人企業值得關注。上班族尋找個股時，可優先挑選有業績實力驗證的標的。", "question": "在選擇投資標的地，你更看重題材的想像空間還是眼前的獲利成績？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiggFBVV95cUxNZ0pqVno3WjM2eHF5NGhTYkdFako3QWZlMml1R0xIZTFfaG5mb3Z5THpjclp1RFlLQUQ0MWxGQy1Rd3RoM1ZfRnlKOENCd3Y5cUxyd3g5c00tdW0xbW1BWXVkNk03S2JSaWdzWVBnb3c5S3QxWjBDMVZJR0Fzdy1tV3Zn?oc=5", "name": "壹蘋新聞網"}]}, {"title": "A股量縮震盪不失韌性 機器人、AI漫劇、半導體設備三題材接棒輪動", "teaser": "三大熱門題材接力輪動", "full": "大陸股市近期維持量縮震盪格局，但盤面題材仍具活力。其中機器人產業、AI漫劇應用以及半導體本土設備三大主線呈現良好接棒輪動態勢，反映市場資金在不同創新科技板塊之間持續尋找獲利突破口。", "think": "題材輪動速度極快時，追高往往面臨風險。投資人應著眼於長期的技術演進趨勢，選擇具備核心競爭力的產業方向進行長期佈局。", "question": "面對類股快速輪動的盤勢，你習慣靈活換股還是堅守核心持股？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiekFVX3lxTE5rRlZGSEhJRzRtTjQ1NHV4V3dXalVWb1dMWHd6UVpmb3EwVTlYSy1ROGlrMUdSMUNBNFR5UkVrTlYwaUJSRkp4NHRBaHc1d1ZqblVUeEJWdkp6bTBZTG9PRkwyZmJYVlJIMlIxN0N4TF90dFpENjJOcllB?oc=5", "name": "BigGo 財經"}]}, {"title": "盟立(2464)攻上漲停，機器人與自動化題材獲關注", "teaser": "自動化龍頭強勢衝上漲停", "full": "自動化設備大廠盟立受惠於機器人及智慧製造題材持續發酵，今日盤中強勢攻上漲停板。市場資金高度關注其在半導體自動化搬運與智慧工廠領域的接單潛力，推升股價表現十分凌厲。", "think": "智慧製造與工廠自動化是減緩勞動力不足的必然趨勢。台廠在自動化整合領域具備優勢，相關標的在中長期自動化升級浪潮中將持續受惠。", "question": "你認為自動化技術的全面普及，會對未來的就業市場帶來哪些深遠影響？", "sources": [{"url": "https://news.google.com/rss/articles/CBMijgFBVV95cUxQUjJXYnNCLVhnaDVybE5pSkpMWjdDbDVZbTlwN29xc05vN2s5NUZ1d191QUxlMi1iQVlFRUR1dTNZQmRqbWMxUEY5c25lWXhacjlSdkVUeVJpRnRNSkhvUHA2X2dXUVRNc2VxZnRHZlRLU2dmbUhPZEJUeVR6RFQ1ZTlWMEV2OWMySXl2bm5n?oc=5", "name": "CMoney投資網誌"}]}, {"title": "致伸(4915)第三季毛利率降至13.4%！AIoT、機器人接棒，2027年才是成長關鍵", "teaser": "轉型AIoT與機器人佈局未來", "full": "致伸科技公布最新第三季毛利率滑落至13.4%，公司目前正加速轉型步伐，積極將研發資源投向AIoT與人形機器人零組件領域。經營團隊預期新業務的效益將逐步顯現，並將2027年視為下一波爆發成長的關鍵期。", "think": "企業轉型過程往往伴隨短期的營運陣痛，但長期藍圖若清晰則潛力無窮。投資人宜觀察其新業務實際落地進度，給予轉型企業適當的時間與耐性。", "question": "面對短期業績轉弱但長期積極轉型的公司，你會選擇耐心等待還是暫時觀望？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1ka21TamdBRVZsbmpkTHRVa1pwRVNvSjdDVHIwckxNTTNfcXV3NnZzOG9paVYtVGszeW81RjhJaGlsOGh5UXgybjNTeEF4QnBNN1JjUVlR?oc=5", "name": "LINE TODAY"}]}, {"title": "軟銀收購ABB機器人業務卡關 研議剝離中國部門求生路", "teaser": "軟銀收購案遭地緣政治卡關", "full": "孫正義旗下的軟銀集團在推動收購ABB機器人業務時遇到監管障礙，特別是來自中國部門的審查疑慮。為促成這筆重磅交易順利進行，軟銀正研議透過剝離中國業務的方式來符合法規，尋求挽救收購交易的解方。", "think": "地緣政治角力已延伸至機器人與先進製造領域，收購案屢受監管挑戰。這顯示核心技術的國家安全價值提高，企業在全球化布局上需具備更高彈性。", "question": "地緣政治正重塑科技產業鏈，你是否已調整投資策略以因應地緣風險？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiekFVX3lxTFBjS3FBOHNqNWl1T2NHdDBva2NsQUxnZjdJbHZCTGlOdl9oaXFYY05aeTRYci1LUW1qT1BwQjM3dW5LR2ZTV0V1a002bjg1Q3Q5aVp4QW1wbXZtUTlkZ0RFci1SLVJuVWVpb05VSzR3WlRrOEhQQUQySDBR?oc=5", "name": "BigGo 財經"}]}], "tech": [{"title": "AI 帶旺記憶體，三星現金資產衝破 200 兆韓圜創韓國企業紀錄", "teaser": "三星現金資產創歷史新高", "full": "受惠於AI技術蓬勃發展帶動的高頻寬記憶體（HBM）與伺服器需求，韓國半導體巨頭三星電子獲利顯著改善。其手握現金資產一舉突破200兆韓圜，寫下韓國企業歷史上的最高現金儲備紀錄。", "think": "充足的現金流是半導體巨頭進行高額研發與擴產的底氣。投資人在佈局科技股時，資本雄厚且技術領先的業界龍頭通常能提供較佳的抗風險能力。", "question": "你偏好將資金投入現金流充沛的科技龍頭，還是爆發力強的新創公司？", "sources": [{"url": "https://technews.tw/2026/11/09/samsungs-cash-pile-hits-record-214-8-trillion-won/", "name": "科技新報"}]}, {"title": "連洗澡做飯都成難題，印尼巴淡島居民抗議 AI 資料中心搶民生用水", "teaser": "AI資料中心耗水引發民怨", "full": "印尼巴淡島居民日前發起抗議，指控新建的AI資料中心消耗大量水資源用於冷卻伺服器，導致當地居民連日常洗澡與做飯的民生用水都出現嚴重短缺。人工智慧發展所帶來的環境與資源衝突問題逐漸浮上檯面。", "think": "AI算力擴張不僅需要龐大電力，冷卻系統對水資源的消耗同樣巨大。科技發展必須與當地民生平衡，綠色節能與水循環冷卻技術將會是下   grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
