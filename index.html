  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

<script type="application/json" id="slot-1300">{"date": "9月24日．週四", "tldr": "台股在美股走勢疲軟下逆勢撐紅，而輝達急催玻璃基板、馬斯克高喊機器人前景，顯示科技長線題材依然是盤面焦點。", "indicators": {"note": "美股與台積ADR走跌，台股加權指數卻逆勢撐紅，顯示內資信心強勁，抗跌力道不容小覷。", "tiles": [{"label": "台股加權指數", "value": "48,024.60", "valueClass": "rise", "delta": "+0.47%", "deltaClass": "rise"}, {"label": "那斯達克", "value": "26,936.04", "valueClass": "fall", "delta": "-1.13%", "deltaClass": "fall"}, {"label": "費半指數", "value": "12,534.27", "valueClass": "fall", "delta": "-1.23%", "deltaClass": "fall"}, {"label": "台積電ADR", "value": "446.57", "valueClass": "fall", "delta": "-1.20%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "三大法人大賣超，台股盤中承壓", "teaser": "外資與自營商調節籌碼", "full": "根據最新統計，三大法人在台股市場大舉賣超超過四百億元。儘管面臨法人的資金撤退壓力，台股盤中仍展現出一定的抗跌韌性，這反映出市場內資與散戶的接盤意願依然活躍。", "think": "法人籌碼移動往往是短期風向球。當法人大賣而指數未崩盤，代表內資撐盤力道強，但投資人仍需提防後續補跌風險，不宜過度追高。", "question": "在法人大舉調節時，你的持股配置是否做好了抗震準備？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609240178.aspx", "name": "中央社"}]}, {"title": "歷時26年！松湖變電所今日終於動工", "teaser": "港湖電網升級迎向關鍵一步", "full": "攸關台北東區供電穩定的松湖超高壓變電所，在歷經長達26年的溝通與推動後，終於在24日正式動工，台電預計將於2029年完工。這項關鍵電力建設將有效紓解內湖與南港科學園區的供電瓶頸。", "think": "穩定的電力是科技產業發展的命脈。松湖變電所動工，長期而言有利於內科與南科周邊科技廠房的擴張，對於相關基礎建設與重電類股也是一項長線利多。", "question": "基礎建設的牛步推進，是否會影響你對區域科技產業發展的信心？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609240176.aspx", "name": "中央社"}]}, {"title": "軟銀發行百億美債，全力投資OpenAI", "teaser": "孫正義再度展現AI野心", "full": "日本軟銀集團計畫發行高達111億美元的債券，市場預期這筆龐大資金將用於支持其對OpenAI等AI先驅企業的投資。軟銀此舉顯示出其重返積極投資模式，並將籌碼全力押注在人工智慧的未來發展。", "think": "軟銀的大手筆發債，代表全球頂尖創投對AI賽道的熱情依舊未減。這將持續帶動AI上游供應鏈的熱度，台股相關的硬體與伺服器代工廠也將間接受惠。", "question": "當科技巨頭持續舉債押注AI，你是否也重新評估了個人資產中AI板塊的比例？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202609240171.aspx", "name": "中央社"}]}, {"title": "日韓MLCC大廠強攻AI，陸廠緊追切入驗證", "teaser": "被動元件戰場因AI再度升溫", "full": "隨著AI伺服器與終端應用需求爆發，日韓MLCC被動元件大廠紛紛將產能轉向高階AI市場。與此同時，中國廠商也積極爭取國際品牌廠的驗證，試圖打破日韓壟斷，這讓全球被動元件市場的競爭更趨激烈。", "think": "AI不只帶旺晶片與代工，更帶動了高階被動元件等零組件的升級潮。台廠在MLCC領域亦占有一席之地，投資人可留意高階產品比重提升帶來的毛利改善契機。", "question": "當AI需求外溢到被動元件等周邊產業，你是否注意到了相關台廠的機會？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609240161.aspx", "name": "中央社"}]}, {"title": "房市降溫資金轉股市？北台灣推案量恐探9年新低", "teaser": "資金板塊移動影響房市動能", "full": "根據住展雜誌調查，受到房市政策收緊與股市吸金效應影響，北台灣全年推案量預估將難以突破兆元大關，可能創下近9年來的新低。這顯示在資金成本提高與投資環境轉變下，房市熱度正逐漸冷卻。", "think": "房市與股市常有資金排擠效應。當房市因政策降溫，部分置產資金可能流向股市尋求高殖利率標的。上班族在進行資產配置時，需更靈活因應這種資金板塊的移動。", "question": "房市冷、股市熱的資金轉移潮中，你打算如何調整你的資產配置比例？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609240160.aspx", "name": "中央社"}]}], "robotics": [{"title": "實戰派功能型機器人，才是市場新王道", "teaser": "和椿董座剖析機器人實用價值", "full": "和椿董事長張以昇指出，相較於展示華麗技巧的機器人，能真正解決產業痛點、具備實用價值的「功能型機器人」才是市場的核心需求。企業在導入自動化時，應更關注其在實際生產線上的實戰表現。", "think": "這提醒投資人，評估機器人產業時，不應只被酷炫的科技展示吸引，而要看其商用化與量產的進度。能為客戶帶來實質ROI的公司才具有長期投資價值。", "question": "在追逐科技新創時，你更看重的是炫目的技術展示，還是務實的商用落地能力？", "sources": [{"url": "https://news.google.com/rss/articles/CBMicEFVX3lxTE53U3FtYm9NME9UbUlHZmJDTXE3MFUxZkhlQjNZWVl4YktKSlBEYmRQN25nUjNoTWVySEdzXzZUbHVzSDVrRmFLaTk1eDI1Wkg5bGxUWWtKOTAtU3BTV1JYR2FFYnpYMGEtYTNLLVFPUE8?oc=5", "name": "數位時代"}]}, {"title": "馬斯克預言全球人形機器人將達10億台", "teaser": "科技巨擘狂想引爆板塊熱潮", "full": "特斯拉執行長馬斯克大膽預測，未來全球人形機器人的數量將達到10億台。此番言論再度點燃市場熱情，帶動相關機器人概念股逆勢走強，市場對於人形機器人的長期滲透率寄予厚望。", "think": "馬斯克的預言雖常帶有誇張成分，但確實指明了科技發展的長遠方向。機器人將成為未來勞動力短缺的終極解決方案，這是一條長達十年的黃金賽道。", "question": "面對「人手一台機器人」的未來預言，你是否已開始布局相關的長期成長股？", "sources": [{"url": "https://news.google.com/rss/articles/CBMicEFVX3lxTE5rT2I1aEMzdklyS2Nfb1doR0FNWFd6dFZOcTNmaE1oODRyaUo1YkxYQmM3elpVZWhzaEkyYWdvQ0YtZ2dPT3JIcjdfTDZfYmhQQVlDQW9iSWM2SUh1LVFOODdsV29FWFlJUGwzbUFDZmI?oc=5", "name": "Investing.com 香港 - 股市報價& 財經新聞"}]}, {"title": "東吳資科舉辦機器人競賽，激盪AI創意", "teaser": "產學合作培育AI應用新人才", "full": "東吳大學資訊科學系舉辦了凱比機器人創新應用競賽，旨在鼓勵學生將AI技術與機器人硬體結合，激盪出更多元的生活與商業應用。這項競賽展現了台灣在AI與機器人教育推廣上的積極作為。", "think": "機器人產業的繁榮離不開人才的培育。從校園競賽中可以看到未來AI應用的雛形，這也是台灣科技產業能持續保持創新與競爭力的關鍵基石。", "question": "你認為台灣的產學合作，能否成功將校園創意轉化為具備國際競爭力的商品？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE0xbVFrcUE2WHRDZjN 作為電網後盾的投資價值？", "sources": [{"url": "https://technews.tw/2026/09/24/shing-da-23-taiwan-behind-meter-energy-storage-17-australia-solar-storage-expansion/", "name": "科技新報"}]}, {"title": "輝達急催玻璃基板，台日韓供應鏈限期交卷", "teaser": "下一代晶片封裝技術戰開打", "full": "為了突破晶片效能瓶頸，輝達正全力推動「玻璃基板」封裝技術，並傳出要求台日韓相關供應鏈在兩年內拿出成果。這項技術被視為下一代半導體封裝的關鍵，各國大廠正加速研發以爭取主導權。", "think": "晶片封裝技術的革新將重新洗牌供應鏈。輝達的急迫感顯示出玻璃基板已是勢在必行，提早卡位並通過驗證的台廠，將在未來的AI晶片大戰中佔據極有利的位置。", "question": "面對半導體封裝技術的世代交替，你所關注的供應鏈廠商是否已搭上這波玻璃基板列車？", "sources": [{"url": "https://technews.tw/2026/09/24/nvidia-follows-glass-substrate-developments-in-taiwan-japan-and-south-korea/", "name": "科技新報"}]}, {"title": "iPhone 18 Pro驚傳Face ID故障重啟，蘋果緊急修補", "teaser": "軟體更新將於下週緊急上線", "full": "針對部分用戶反映iPhone 18 Pro在Face ID辨識失敗時會意外觸發系統重啟的災情，蘋果公司計畫於下週推出iOS更新進行修正。這次的軟體Bug雖然影響部分用戶體驗，但蘋果迅速的反應有助於穩定消費者信心。", "think": "智慧型手機功能日益複雜，新機上市初期出現軟體小瑕疵已非罕見。對於投資人而言，關鍵在於品牌廠能否迅速解決問題，避免商譽受損，這也是觀察企業危機處理能力的指標。", "question": "當科技新品出現初期瑕疵時，會影響你對該品牌的消費意願或投資信心嗎？", "sources": [{"url": "https://technews.tw/2026/09/24/iphone-18-pro-face-id/", "name": "科技新報"}]}, {"title": "蘋果光環失靈？ChatGPT整合功能採用率慘澹", "teaser": "用戶對AI新功能的熱情有待考驗", "full": "根據最新揭露的法院文件顯示，蘋果與OpenAI合作將ChatGPT整合至Apple Intelligence的早期採用率不如預期。這項數據引發市場對於蘋果AI策略能否成功帶動換機潮的疑慮，顯示消費者對AI功能的接受度仍需時間培養。", "think": "雖然市場對「AI手機」寄予厚望，但實際用戶體驗與實用性才是決定成敗的關鍵。如果AI功能無法切中用戶痛點，盲目的硬體升級可能難以維持長期的銷售動能。", "question": "你認為目前的AI手機功能，真的有解決你日常生活中的實質痛點嗎？", "sources": [{"url": "https://technews.tw/2026/09/24/openai-apple-ai-user-indifference/", "name": "科技新報"}]}, {"title": "中國旗艦手機大戰開打，小米新機年底登台", "teaser": "搶攻年底消費旺季與換機潮", "full": "中國各大智慧型手機品牌計畫在9月底展開新一輪旗艦機大混戰，其中備受矚目的小米18 Pro系列也預計將於年底前引進台灣。這波新機潮將主打高階影像與AI應用，力求在競爭飽和的市場中脫穎而出。", "think": "手機市場的激烈競爭將刺激零組件供應商的拉貨動能。台股中的手機IC設計、鏡頭與PCB等供應鏈，可望因這波年底新機拉貨潮而迎來營收增長，值得密切追蹤。", "question": "面對各大品牌紛紛推出AI旗艦機，你下一次換手機時會優先考慮AI功能嗎？", "sources": [{"url": "https://ccc.technews.tw/2026/09/24/xiaomi-18-pro-series/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-2000">{"date": "9月24日．週四", "tldr": "今日台股盤勢在金融與科技股支撐下維持穩健，外資雖有調節但台積電ADR表現抗跌，晚間國際科技與機器人產業則持續聚焦AI算力與應用落地。", "indicators": {"note": "今日台股與台積電ADR逆勢收紅展現韌性，但美股那斯達克與費半小幅回檔，反映國際科技股在盤整期觀望氣氛濃厚。", "tiles": [{"label": "台股加權指數", "value": "48,024.60", "valueClass": "rise", "delta": "+0.47%", "deltaClass": "rise"}, {"label": "那斯達克", "value": "26,912.29", "valueClass": "fall", "delta": "-0.09%", "deltaClass": "fall"}, {"label": "費半指數", "value": "12,459.94", "valueClass": "fall", "delta": "-0.59%", "deltaClass": "fall"}, {"label": "台積電ADR", "value": "449.74", "valueClass": "rise", "delta": "+0.71%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "南山人壽投入51.68億　購置竹北昌益科技產發園區大樓", "teaser": "壽險資金加碼竹北商辦", "full": "南山人壽近期斥資逾51億元出手購置竹北昌益科技產發園區大樓，顯示大型法人機構對於新竹科學園區周邊的高科技商辦與廠辦資產依舊看好。這筆交易不僅活化了區域房地產市場，也凸顯資金持續流向具備實質產業支撐的精華地段。", "think": "大型壽險資金的動向往往是實體經濟與房市的風向球，顯示竹科周邊的商用不動產依舊是法人眼中的優質避風港與收息標的。對上班族而言，這也間接說明科技廊帶的就業與經濟動能短期內依然穩固。", "question": "當壽險資金持續卡位科技園區商辦，對我們選址置產或觀察區域發展有何啟示？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609240361.aspx", "name": "中央社"}]}, {"title": "外資賣超338億元　調節友達、敲進主動式ETF", "teaser": "外資大舉調節與換股", "full": "集中市場今日遭外資大幅賣超338億元，其中面板大廠友達成為主要調節對象之一，但同時資金也轉向敲進主動式ETF。這顯示外資在台股高檔震盪之際，正積極進行投資組合的換股操作，降低單一個股風險並尋求更靈活的配置。", "think": "外資單日大幅賣超容易引發市場短線恐慌，但透過買進主動式ETF的動作可以看出，機構法人並非全面看空台股，而是更傾向由專業經理人來挑選具防禦力或潛力的標的。我們在面對波動時，也應思考自身持股是否具備足夠的抗震能力。", "question": "面對外資的大幅調節與換股潮，你的投資組合是否也需要定期檢視調整？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609240359.aspx", "name": "中央社"}]}, {"title": "中小企業貸款不順？金管會：銀行放款持續且高度成長", "teaser": "銀行放款維持高度成長", "full": "針對中小企業貸款是否面臨卡關疑慮，金管會公開表示目前銀行對中小企業的放款依然維持持續且高度的成長態勢。這數據反映出金融機構對中小企業的資金支援力道並未縮手，市場整體的流動性與融資管道仍保持暢通。", "think": "資金是企業營運的活水，銀行放款持續成長代表基層經濟與中小企業的資金需求有被滿足，有助於支撐就業市場穩定。對於一般上班族來說，這意味著實體經濟的基礎依然健全，不必過度擔憂系統性緊縮。", "question": "在銀行放款維持成長的環境下，中小企業如何善用資金來突破營運瓶頸？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609240343.aspx", "name": "中央社"}]}, {"title": "洋基工程：搶下美光台南工程　在手訂單逾553億元", "teaser": "在手訂單突破五百億", "full": "廠務工程大廠洋基工程傳出捷報，成功拿下美光台南廠區的工程案，推升公司在手訂單總額突破553億元大關。受惠於半導體大廠持續在台灣擴廠與升級，相關的機電與廠務工程需求依舊強勁，為業者帶來長期的營收保障。", "think": "半導體產業的資本支出不僅造就科技巨頭，也養活了龐大的供應鏈與工程服務商，形成穩固的產業聚落。這類手握龐大訂單的隱形冠軍，往往是觀察台灣科技基建熱度的重要指標。", "question": "當科技大廠持續擴廠帶動周邊工程需求時，我們該如何掌握這波供應鏈紅利？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609240321.aspx", "name": "中央社"}]}, {"title": "市場資金緊俏　央行罕見連2季減發364天期存單", "teaser": "央行連續減發存單釋水", "full": "面對市場資金相對緊俏的現狀，中央銀行採取了罕見的舉措，連續兩個季度減少發行364天期定期存單。此舉主要是為了釋放資金留在金融體系中，以緩解市場的資金壓力，維持金融機構的流動性穩定。", "think": "央行的存單發行量是調節市場資金溫度的重要工具，連續減發釋放了官方關注流動性並適度寬鬆的訊號。對於一般投資人而言，了解利率與資金面鬆緊，有助於掌握整體市場的資金成本變化。", "question": "央行主動調節存單發行以緩解資金緊俏，對你的資金配置與利率敏感資產有何影響？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609240315.aspx", "name": "中央社"}]}], "robotics": [{"title": "去年裝設35.4萬台 陸工業機器人冠全球", "teaser": "工業機器人裝設量奪冠", "full": "根據統計，中國在去年一年內就裝設了高達35.4萬台的工業機器人，穩居全球裝設量之冠。這反映出製造業自動化轉型的腳步極為迅速，透過機器人大規模替代人力來維持生產效率與應對勞動成本上升。", "think": "全球工廠持續擴大導入自動化設備，不僅改變了傳統製造業的生態，也帶動了整個機械與零組件供應鏈的龐大商機。對於上班族來說，了解製造業的自動化趨勢，有助於評估相關科技與工業類股的長期成長潛力。", "question": "當全球工廠加速引進工業機器人，傳統製造業的就業結構將面臨怎樣的轉變？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTE0xR1dYTTMwRW1JdW1BdU1IaEFpVVJTWDl3SjVaV04xS0tsS2RyQWh4Ty1ESDV3SEJ6SXBueTlGT29xc3c4VXNwcVpUVnFWcXVr0gFWQVVfeXFMT2tPMjVReWtQa1luMi1pZEE3U1M3bU00YXV0c2dRckg1QXhlM2RXQVFFMHVHN1JDOHFHSF9JbU11N3p2UzNienNLdDFOeXBZcmNORmZKd2c?oc=5", "name": "UDN"}]}, {"title": "馬斯克唱旺人形機器人！成長空間上看「數萬倍」 法人首選「2台廠」、目標價曝光", "teaser": "馬斯克喊旺人形機器人", "full": "特斯拉執行長馬斯克持續強力看好人形機器人的未來發展，甚至預言其成長空間可達數萬倍之譜。法人機構也在此波熱潮中點名看好特定的台灣供應鏈夥伴，並積極關注相關指標股的後市表現與目標價。", "think": "名人效應往往能迅速炒熱一個新興產業，人形機器人從科幻走向商業化的速度正在加快。然而，面對市場的高度期待，投資人除了看題材外，更需要檢視相關台廠是否真的打入核心供應鏈並具備實質獲利能力。", "question": "面對市場高度炒熱的人形機器人題材，我們該如何分辨是題材過熱還是真正具備長期價值的投資？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiS0FVX3lxTFBnZVZZRmpiZTJuWkpuQjRFMXMzQVRwQlBJbTlQaFJ4NGlEZHoxRzR5SWZYTC1IWWYzRDZHZE9oOVhmdnZWS0Jua1FDdw?oc=5", "name": "ftnn.com.tw"}]}, {"title": "梅卡曼德機器人發佈上市後首份中期業績：收入訂單雙增，機器人大腦突破打開產業級成長空間", "t <script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
