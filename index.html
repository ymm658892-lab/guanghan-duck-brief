  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

2VZ?oc=5", "name": "中時新聞網"}]}, {"title": "2026機器人與自動化展規模再創高", "teaser": "展覽規模創新高見證產業熱度", "full": "業界預期隨著智慧製造與人形機器人熱度攀升，機器人與自動化展的參展規模與攤位數將持續刷新紀錄。海內外重量級大廠紛紛卡位展位，顯示全球對智慧自動化設備與技術的需求依舊強勁且長線看好。", "think": "展會規模擴大是產業景氣與資本投入的晴雨表。這代表智動化已非短暫炒作，而是全球製造業在少子化與工資上漲壓力下的剛性需求。", "question": "面對少子化與勞動力短缺，智慧自動化設備是否已成為企業不可或缺的標配？", "sources": [{"url": "https://news.google.com/rss/articles/CBMia0FVX3lxTE5zM0MxeHNEZnlaWEU1aHRLX3BCSHh4QzV3VGZoQWFDdEdCbGJ0WExjT1p5NFhFLWNQOFZNZU9QU1VlejEzNkoyX181aHNvc2ZPaFVGNzhoMXNxQmlFckZfQzJnQkxnb0t0a3dZ?oc=5", "name": "中時新聞網"}]}, {"title": "Waymo先驅塞巴斯蒂安・特倫打造新機器人新創公司", "teaser": "自駕車先驅跨足新創機器人", "full": "曾帶領谷歌無人車專案Waymo的科技先鋒塞巴斯蒂安・特倫宣布成立全新機器人新創公司，計畫將頂尖自駕感知與規劃演算法移植至通用機器人領域。頂尖創業家的加入，為機器人賽道注入更多創新活力。", "think": "自動駕駛本質上就是輪式機器人，其視覺感知與決策系統與人形機器人高度相通。頂尖自駕人才跨界轉向機器人，將大幅縮短具身智能的研發週期。", "question": "當自駕車領域的頂尖技術全面外溢至機器人領域，下一個爆發的應用會是什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE9LMGg3bEtTQjFPTWhBel9ISGxhUFVKOWxTVGNfSjNSSko0V2VWOWllbUNzaS1LTHY1VlhONGZrU0V3YWJBd1FKcGU2N3ZQd2NCeER1NV9B?oc=5", "name": "Business Insider Taiwan"}]}], "tech": [{"title": "先修流程再談自動化 揭密企業AI轉型四大隱形地雷", "teaser": "企業AI轉型關鍵在於重整流程", "full": "專家指出企業在導入AI自動化時常盲目追求新工具，卻忽略底層業務流程的梳理，容易踩到效益不彰的隱形地雷。唯有先釐清作業痛點、標準化工作流程，導入的AI系統才能發揮提升生產力的實質成效。", "think": "這對職場工作者是一大啟發：AI是放大器而非萬靈丹。在日常工作中，先理順自己的工作邏輯與流程架構，使用AI輔助才能事半功倍。", "question": "在嘗試使用AI工具前，你是否已經把現有的繁瑣工作流程標準化了？", "sources": [{"url": "https://technews.tw/2026/08/19/truth-behind-enterprise-ai-implementation-failures/", "name": "科技新報"}]}, {"title": "AI真的聽得懂台灣人嗎？從主權語料庫看見下回合資料戰", "teaser": "主權語料庫成AI本土化關鍵", "full": "隨著大型語言模型普及，AI對在地文化與台灣慣用語的理解能力成為焦點。產業專家呼籲建立屬於台灣的主權語料庫，不僅能防止文化與語言流失，更是打造具備本土脈絡與資安可控AI服務的關鍵基石。", "think": "主權AI與語料庫代表了數位文化主權與資料安全。掌握高品質在地資料的企業與機構，未來在AI應用落地與商業化競爭中將更具不可替代性。", "question": "在依賴國外生成式AI工具時，你是否曾因文化隔閡或語意誤差而感到困擾？", "sources": [{"url": "https://technews.tw/2026/08/19/ai-understand-taiwanese-sovereign-language-corpora-next-data-war/", "name": "科技新報"}]}, {"title": "科技戰延伸：FCC將無人機LiDAR定為軍用技術", "teaser": "美列LiDAR為軍用防外國滲透", "ful <script type="application/json" id="slot-2000">{"date": "8月18日．週二", "tldr": "今日台股終結連買拉回整理，但美股半導體與台積電ADR逆勢走強，預示硬體與光通訊長線需求依然火熱，建議逢低布局。", "indicators": {"note": "台股與那指今日拉回整理，但費半與台積電ADR逆勢收紅，顯示半導體主流地位仍穩，短線震盪免驚。", "tiles": [{"label": "台股加權指數", "value": "45,308.68", "valueClass": "fall", "delta": "-1.10%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "26,644.91", "valueClass": "fall", "delta": "-0.32%", "deltaClass": "fall"}, {"label": "費半指數", "value": "12,621.00", "valueClass": "rise", "delta": "+1.64%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "430.97", "valueClass": "rise", "delta": "+1.08%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "台日創新高峰會升級三方合作，串聯美國拓全球市場", "teaser": "台日美三方聯手闖天下", "full": "台日創新高峰會今年迎來升級，重點在於深化台灣與日本的合作，並進一步串聯美國市場，攜手開拓全球商機。這項合作旨在結合台灣的硬體優勢與日本的研發實力，並透過美國的市場管道，建立更具韌性的跨國產業鏈。", "think": "對投資人來說，台日美三方合作的深化，意味著未來在半導體、資安與智慧製造等領域，將有更多跨國合作的案子落地。這不僅能分散單一市場風險，也為台灣中小企業與新創帶來進軍國際的絕佳跳板。", "question": "在這波台日美合作潮中，有哪些潛力產業最容易受惠並脫穎而出？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608180288.aspx", "name": "中央社"}]}, {"title": "台灣大公開收購精誠起跑，已獲逾14%應賣承諾", "teaser": "電信巨頭跨界搶攻資訊服務", "full": "台灣大哥大公開收購精誠資訊的股權計畫正式啟動，目前已取得超過14%的應賣承諾，顯示出市場對這項收購案的積極回應。台灣大此舉意在深化雙方在雲端、資安及大數據領域的合作，加速推動企業客戶的數位轉型。", "think": "電信業與資訊服務業的結合，是產業大者恆大的趨勢。對於上班族來說，這意味著未來的數位工具與雲端服務可能會更加整合，而相關概念股的長線綜效也值得持續追蹤。", "question": "電信業者紛紛併購資訊服務商，這對未來的軟體產業格局會帶來什麼改變？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608180284.aspx", "name": "中央社"}]}, {"title": "AI使用強度下滑？黃志芳：台灣是硬體巨人應用侏儒", "teaser": "台灣AI產業面臨應用挑戰", "full": "外貿協會董事長黃志芳指出，雖然台灣在AI硬體製造上高居全球核心，但在AI軟體應用強度上卻出現下滑趨勢，宛如「硬體巨人、應用侏儒」。他呼籲台灣產業應加速導入AI應用，才能在國際競爭中保持長遠優勢。", "think": "這提醒我們，雖然台灣靠硬體賺飽飽，但軟體實力與AI應用的普及才是決定未來競爭力的關鍵。身為上班族，提早學會將AI工具融入日常工作流程，就是避開「應用侏儒」困境的最佳個人策略。", "question": "面對AI應用落差，你準備好在工作中扮演「AI先行者」的角色了嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608180282.aspx", "name": "中央社"}]}, {"title": "外資賣超台股119億終止連6買，調節力積電與面板股", "teaser": "外資轉賣終結連買行情", "full": "外資今日在台股賣超119億元，正式終結了先前的連續6個交易日買超，主要調節對象包括力積電及面板相關個股。市場分析指出，這顯示出外資在高檔震盪之際，開始進行部分獲利了結與持股部位的調整。", "think": "雖然大盤短線受到外資調節而承壓，但這屬於多頭行情中的正常洗盤。對於一般投資人而言，不必過度恐慌，反而可以藉此觀察哪些基本面佳的個股，在回檔時展現出抗跌的韌性。", "question": "外資籌碼出現鬆動時，你的投資組合是否有足夠的防禦性配置？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608180279.aspx", "name": "中央社"}]}, {"title": "聯鈞看好光通訊前景：COSA產能幾乎翻倍，新產品進入試產", "teaser": "光通訊大廠產能大爆發", "full": "聯鈞表示其COSA產品線的產能每年幾乎都呈現翻倍成長，且新一代的ELSFP產品已經順利進入試產階段。這反映出在AI伺服器與高速資料中心需求爆發下，光通訊關鍵零組件的供需依然非常吃緊，未來成長動能強勁。", "think": "矽光子與光通訊是今年科技股的重頭戲。聯鈞的產能擴張與新產品進展，證實了這個產業並非空穴來風，而是有實質訂單支撐，投資人可持續留意相關供應鏈的營收兌現狀況。", "question": "在高速傳輸需求持續攀升的趨勢下，你是否已經布局了相關的光通訊概念股？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608180277.aspx", "name": "中央社"}]}], "robotics": [{"title": "DARPA推動水下機器人，運用3D列印技術修復港口", "teaser": "水下3D列印開啟新紀元", "full": "美國國防高等研究計劃署（DARPA）正計劃開發能在水下運作的機器人，利用3D列印技術直接澆灌混凝土，以進行港口等基礎設施的建造與修復。這項技術若研發成功，將大幅降低水下工程的危險性與作業成本。", "think": "機器人正從陸地、空中走向極端的深海環境。這不僅是軍事科技的突破，未來在海洋綠能、海底電纜維護等商業領域，也將創造出全新的高難度技術市場與投資機會。", "question": "當機器人能勝任極端水下工作時，哪些傳統海洋工程職位將面臨轉型？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE8wbXVVYjdvdmhUSmkzZDRyakp0R0VmUVRkWm9BeWRWVmFIZlo4V1BRX1hTMkFJSEZ0aTZ1Ry1kLVJfQTRzbFBSQ1pYVEUyY2Q1ZXQ0bi1n?oc=5", "name": "Business Insider Taiwan"}]}, {"title": "供應機器人短缺，烏克蘭部隊改用突擊機器人執行後勤任務", "teaser": "戰場機器人轉型後勤主力", "full": "面對前線運補人力與常規供應機器人的短缺，烏克蘭部隊開始彈性調整，將原本設計用於前線交火的突擊機器人，改為執行危險的後勤物資運送任務。這展現了戰場科技在極端環境下的快速適應與多功能轉型。", "think": "科技的價值往往在於其靈活性。在商業世界中也是如此，當原本的計畫面臨資源短缺時，如何將現有工具「不務正業」地發揮新價值，是考驗企業與個人應變能力的關鍵。", "question": "面對資源受限的困境，你是否能像烏克蘭軍隊一樣，靈活重組手邊的工具來解決問題？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1odGREOTNBeWpPOGdLdVRWUXpEbXdSMUNmNUxtbDJWV3Noa3dVbFpvZnNubHlPbndEN21Xa2dQRmZQN0pmOU5HWjF3QVlGZlVhWVNfYm9B?oc=5", "name": "Business Insider Taiwan"}]}, {"title": "中國機器人加速外銷歐洲與東南亞，海外營收能否轉化為獲利？", "teaser": "中國機器人搶攻海外市場", "full": "中國的機器人製造商正積極將版圖擴張至歐洲與東南亞等海外市場，試圖透過外銷來減緩國內價格戰的壓力。然而，海外營收的增長是否能有效轉化為實質利潤，仍面臨當地法規、售後服務成本等諸多考驗。", "think": "低價搶市的策略在國際市場上不一定行得通。這提醒我們，企業出海除了產品力，更考驗在地化營運與毛利率的控制，投資人在評估相關概念股時，應更關注其獲利品質而非僅看營收成長。", "question": "當中國品牌大舉出海，台灣的工業機器人供應鏈該如何發揮差異化優勢？", "sources": [{"url": "https://news.google.com/rss/articles/CBMigwFBVV95cUxQOThmeTY5OGpCUDdCX2JHM1JDYnBPNlowOWE3U2NzM1R0SlBMYlFOZFdJbG1ZV0pPakVkY2x1T0ZiUDRfQnp0OG5wQUQ4Z3JzVkxocXBsSFVWN2RsRi1ZWkpra0cwOW05NjRkT1dUMnBNWmp1S2ZqNHA4MHg2Zms0d1hYYw?oc=5", "name": "cmnews.com.tw"}]}, {"title": "阿里巴巴投資人形機器人逐際動力，擬赴港IPO募資達3億美元", "teaser": "人形機器人獨角獸衝刺上市", "full": "獲得阿里巴巴等大咖投資的人形機器人新創公司「逐際動力」，傳出正計劃赴香港進行IPO，預計募集最高3億美元的資金。這筆資金將用於加速足式機器人的技術研發、商業化落地以及擴大生產規模。", "think": "人形機器人市場正處於資本熱潮中，大廠的資金挹注與IPO動作頻頻，顯示出市場對於這項顛覆性技術的未來充滿期待。這對投資人來說，是觀察產業是否進入實質商業化階段的重要風向球。", "question": "隨著越來越多機器人企業走向資本市場，這會加速人形機器人走入日常生活的速度嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiZkFVX3lxTE9VUEpUNFRvaVhVUUY1VDZOaXJQLVlabkwyeWJFbTVhd0locjRpaWk5OFJIZ1k0bVQyYVFEZXlCdWNTcHc5SFljcGJDTWdXX0hFQXM1N2I0YVl0X2pfM29UQ1pUbjhzUQ?oc=5", "name": "tw.tradingview.com"}]}, {"title": "人形機器人2030年後加速商用，台灣供應鏈迎來龐大商機", "teaser": "台廠供應鏈搭上機器人列車", "full": "分析師預估人形機器人將在2030年後迎來大規模商用與加速落地。由於人形機器人需要精密的關節馬達、感測器及減速器，台灣憑藉著強大的光電與精密機械製造實力，將在這一波全球供應鏈中扮演不可或缺的角色。", "think": "雖然距離大規模商用還有幾年時間，但科技投資往往看重的是未來的想像空間。台廠在硬體零組件的優勢，讓我們在機器人時代來臨時，能率先分到一杯羹，值得中長線投資人提早做功課。", "question": "面對2030年的機器人爆發期，你現在的投資布局是否已經納入相關關鍵零組件台廠？", "sources": [{"url": "https://news.google.com/rss/articles/CBMihgFBVV95cUxQeWZaQkJGQU82X2hmTldOcm5UbGgyVFF4RENUN016UldlX0c2dVEtR0dYMWJRbTB5ZGpTZGt2d1pkQ3RhbXdyWWdUMm5ETF9CMFU3UXZEY3FyM1dsTmY2MHVtZHZnSjFlLWdySW9LTjRRT3ZBZm12dDQ3LXQyQmxTd3U4ZTNjdw?oc=5", "name": "news.videoland.com.tw"}]}], "tech": [{"title": "AI治病不只是口號，前OpenAI高層指出生物資料與設施才是關鍵", "teaser": "生物數據成AI醫療勝負手", "full": "前OpenAI高層指出，要讓AI在醫療與疾病治療上發揮實質作用，關鍵不在於演算法的宣傳，而是必須擁有高質量的生物資料與先進的研究設施。只有將AI與真實的生物實驗數據結合，才能真正加速新藥開發與精準醫療。", "think": "這點出了AI發展的下一階段：從虛擬的文字生成走向真實世界的科學突破。對於投資人而言，那些掌握獨家生醫數據或實驗平台的生技資訊公司，將是未來「AI+醫療」領域中最具護城河的標的。", "question": "當AI醫療的勝負關鍵轉向數據品質，這對傳統製藥廠會帶來怎樣的轉型壓力？", "sources": [{"url": "https://technews.tw/2026/08/18/ai-will-cure-cancer-is-more-a-cliche-than-it-is-inspiring/", "name": "科 <script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
