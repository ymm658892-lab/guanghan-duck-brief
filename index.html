  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

"tech": [{"title": "拒絕垃圾內容 YouTube與TikTok等平台收緊AI規則", "teaser": "社群巨頭嚴審AI生成垃圾內容", "full": "為防堵大量生成的低質虛假內容氾濫，主流社群影音平台同步更新規範，要求創作者標註AI產出，並針對濫用演算法洗版或誤導閱聽人的AI垃圾內容展開降權與審查處置。此舉促使內容創作生態朝向注重真實性與優質敘事發展。", "think": "AI讓內容生產門檻降至零，但資訊過載與虛假訊息也隨之暴增。在數位行銷或個人自媒體運營中，結合真實專業與個人洞見的價值將遠高於單純用AI量產內容。", "question": "當平台全面過濾AI生成內容，創作者如何利用AI輔助又能保持人性的真實感？", "sources": [{"url": "https://technews.tw/2026/10/17/from-substack-to-youtube-here-are-the-social-platforms-cracking-down-on-ai-slop/", "name": "科技新報"}]}, {"title": "AI記憶體下一步 三星聚焦速度與可擴展性", "teaser": "三星揭示AI記憶體三大關鍵走向", "full": "面對AI運算模型規模呈指數級成長，記憶體大廠三星確立未來研發核心將鎖定速度、可擴展性與耐用持久性。除了現有的HBM高頻寬記憶體競爭，更先進的封裝技術與CXL架構將成為打破記憶體牆、維持AI晶片高效運作的下一波勝負手。", "think": "AI軍備競賽的真正瓶頸往往在記憶體傳輸頻寬與功耗。投資半導體不能只看GPU算力，支援高頻寬傳輸與先進封裝的記憶體供應鏈同樣具備強勁成長力。", "question": "高頻寬記憶體與先進架構更迭迅速，後進廠商是否有機會在下一代技術彎道超車？", "sources": [{"url": "https://finance.technews.tw/2026/10/17/samsung-confirms-speed-scalability-and-durability-as-key-focuses-for-ai-memory-development/", "name": "科技新報"}]}, {"title": "最賺錢時押注下一步 黃仁勳帶領輝達歷史性轉型", "teaser": "輝達獲利登頂仍力推架構大轉型", "full": "儘管目前在AI加速晶片領域坐擁極高市占與豐厚利潤，輝達執行長黃仁勳仍積極推動公司轉型，將核心競爭力擴展至軟體生態系、超級運算平台及企業級AI架構。輝達試圖建立難以撼動的閉環生態，以防堵雲端大廠自研晶片的替代威脅。", "think": "居安思危是頂尖科技企業的生存之道。在看似毫無對手時大膽自我顛覆，才能拉開與追趕者的差距。這也提醒上班族在事業順遂時更應儲備第二技能。", "question": "各大科技巨擘紛紛自研晶片，輝達以軟體架構建立的護城河能維持多久優勢？", "sources": [{"url": "https://technews.tw/2026/10/17/nvidia-completes-another-historic-transformation/", "name": "科技新報"}]}, {"title": "Agentic AI浪潮襲來 HPE剖析企業轉型與AI工廠策略", "teaser": "自主代理AI成企業轉型新關鍵", "full": "具備自主推理與工作流執行能力的「代理人AI」（Agentic AI）成為企業數位轉型焦點。企業不再滿足於單純的對話機器人，而是尋求打造能夠自動化跨部門任務的AI工廠架構，這推動了私有雲算力建置與內部資料治理的迫切需求。", "think": "AI工具正從「輔助回答」進化為「主動執行」。未來的職場白領需學習如何指導並管理多個AI代理人協同作業，工作模式面臨全新重構。", "question": "企業若要全面部署自主決策的AI代理人，其背後的資安防護與究責機制是否準備就緒？", "sources": [{"url": "https://finance.technews.tw/2026/10/17/hpe-analyzes-the-pain-points-of-enterprise-ai-transformation-and-enterprise-level-ai-factory-strategies/", "name": "科技新報"}]}, {"title": "AI泡沫疑慮升溫 友達董事長彭双浪：成長放緩但趨勢不變", "teaser": "彭双浪看AI：成長放緩但趨勢確立", "full": " <script type="application/json" id="slot-2000">{"date": "10月16日．週五", "tldr": "週五晚間市場情緒轉趨謹慎，台股與美股指數同步修正，除了關注輝達供應鏈與鴻海跨足移動領域的佈局外，政府收緊對中晶片出口管制與資安風險亦是投資人需留意的重點。", "indicators": {"note": "這些數據反映了今日台股收盤慘跌與美股盤前走勢，顯示半導體與科技股承受較大賣壓，投資人應關注台積電ADR表現以判斷下週開盤動向。", "tiles": [{"label": "台股加權指數", "value": "47,111.26", "valueClass": "fall", "delta": "-3.11%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "26,346.68", "valueClass": "fall", "delta": "-1.37%", "deltaClass": "fall"}, {"label": "費半指數", "value": "11,343.17", "valueClass": "fall", "delta": "-2.06%", "deltaClass": "fall"}, {"label": "台積電ADR", "value": "414.44", "valueClass": "fall", "delta": "-1.85%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "輝達高層駁斥 RTX 5090 停產傳聞", "teaser": "旗艦顯卡供應穩定，解除市場缺貨焦慮", "full": "針對市場傳出輝達旗艦顯卡 RTX 5090 可能停產的消息，官方高層已正式出面否認，並強調將會持續穩定供貨。這項聲明化解了電競玩家與硬體通路商的擔憂，也顯示輝達在高端消費市場的佈局並未因傳聞而改變，維持其市場領導地位。", "think": "對於硬體供應鏈投資人來說，這代表輝達的高階產品線營收動能依然穩健。在AI熱潮下，高階顯示卡的供需狀況是觀察半導體庫存循環的重要指標。", "question": "當市場消息滿天飛時，您如何過濾噪音並抓到真正的產業趨勢？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610160349.aspx", "name": "中央社"}]}, {"title": "台積電 CoWoS 助力輝達強攻高階市場", "teaser": "先進封裝產能立大功，推動運算升級", "full": "輝達 RTX Spark 電腦憑藉台積電先進的 CoWoS 封裝技術，成功強攻高階運算市場。這項技術合作再次證明了台積電在先進封裝領域的壟斷地位，也讓輝達能推出更具效能競爭力的產品，滿足市場對高效能運算的需求。", "think": "CoWoS 技術已成為半導體競爭的關鍵高地，台積電的技術領先為相關台廠供應鏈帶來了長期紅利。身為投資人，應持續關注先進封裝技術的產能配置與訂單流向。", "question": "您認為先進封裝技術會是未來幾年半導體產業最重要的獲利引擎嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610160345.aspx", "name": "中央社"}]}, {"title": "鴻海砸 233 億元取得三菱電機移動股權", "teaser": "深化電動車布局，鴻海進攻智慧移動", "full": "鴻海集團斥資約 233 億元台幣，取得三菱電機移動子公司 5 成股權，這標誌著鴻海在電動車與智慧移動領域的佈局再下一城。透過與日系大廠合作，鴻海將能整合更多核心技術，強化其在車用零組件市場的競爭力。", "think": "鴻海正加速從組裝代工轉型為科技平台公司，車用電子的比重提升有助於優化獲利結構。對於長期持有鴻海的投資者，這類策略性併購是觀察其轉型成效的重要里程碑。", "question": "隨著電動車競爭進入白熱化，鴻海的全球供應鏈整合能力是否能成為其制勝點？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610160320.aspx", "name": "中央社"}]}, {"title": "歐盟擬擴大對中貿易限制引發反彈", "teaser": "貿易壁壘威脅升溫，供應鏈面臨挑戰", "full": "歐盟正研議擴大對中國的貿易限制措施，對此中國 <script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
