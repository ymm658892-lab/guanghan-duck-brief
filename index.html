  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

<script type="application/json" id="slot-2000">{"date": "8月19日．週三", "tldr": "今晚美股科技股與費半重挫，台積電ADR跌逾4%；然而台韓AI合作深化與自動化展機器人熱潮，仍為長線科技產業注入強勁動能。", "indicators": {"note": "今晚指標顯示全球科技股面臨沉重拋壓，費半與台積電ADR跌幅深重，預示台股短期將面臨劇烈震盪回檔壓力。", "tiles": [{"label": "台股加權指數", "value": "44,719.35", "valueClass": "fall", "delta": "-2.48%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "26,289.71", "valueClass": "fall", "delta": "-1.33%", "deltaClass": "fall"}, {"label": "費半指數", "value": "11,992.46", "valueClass": "fall", "delta": "-4.98%", "deltaClass": "fall"}, {"label": "台積電ADR", "value": "413.41", "valueClass": "fall", "delta": "-4.07%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "台積電產能緊俏 傳三星先進晶圓代工趁勢漲價", "teaser": "晶圓代工產能供不應求", "full": "由於台積電先進製程產能持續吃緊，市場傳出競爭對手三星計畫調高其先進晶圓代工報價。這反映出全球AI與高效能運算晶片需求依然極為強勁，即使台積電產能滿載，外溢效應也讓其他晶圓代工廠獲得漲價空間。", "think": "這顯示出半導體先進製程目前是絕對的賣方市場。對投資人來說，台積電的龍頭地位短期內難以動搖，而三星的漲價舉動也間接證實了整體產業鏈的熱絡，科技股長線基本面依據扎實。", "question": "當龍頭產能滿載、二線廠商開始漲價，這對你的科技股投資布局有何啟示？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608190291.aspx", "name": "中央社"}]}, {"title": "運力受限支撐運價 台驊看好第3季航運行情", "teaser": "航運旺季運價有撐", "full": "貨代大廠台驊指出，在全球運力受到地緣政治與塞港等因素限制下，運價獲得強力支撐，預期第三季的貨運航運市場行情將維持穩健。這為航運族群在下半年的營收表現注入了一劑強心針。", "think": "航運股向來波動大，但在供應鏈干擾未完全消除前，運價欲小不易。上班族若有操作航運板塊，可多留意第三季季報行情，但仍需提防高檔震盪與景氣循環的快速反轉。", "question": "面對地緣政治帶來的航運紅利，你會將其視為短期投機還是長期配置的機會？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608190294.aspx", "name": "中央社"}]}, {"title": "對手變夥伴 CNN指AI使台灣成韓國通美廊道", "teaser": "台韓半導體競合新局", "full": "根據外媒報導，AI浪潮正重塑台韓半導體產業關係，從過去的激烈競爭走向合作。台灣憑藉先進封裝與代工優勢，成為韓國記憶體晶片銷往美國AI市場的重要橋樑，兩國在全球供應鏈中形成新型態的互補關係。", "think": "過去我們常把台韓視為死對頭，但AI時代講求的是生態系整合。這種「競合關係」提醒上班族，在職場或投資上，單打獨鬥的時代已過去，如何找到互補的合作夥伴才是勝出關鍵。", "question": "在AI生態系中，你認為台灣與韓國各自最強大且不可替代的優勢是什麼？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608190278.aspx", "name": "中央社"}]}, {"title": "亞股下殺新台幣震盪 貶破32元後翻升收復失土", "teaser": "匯市震盪外資動向受矚", "full": "受到亞洲股市普遍下挫影響，新台幣匯率盤中震盪加劇，一度貶破32元整數關卡，但隨後在出口商拋匯與市場逢低承接下翻升，最終收在31.937元。這顯示市場情緒在美股與亞股動盪之際顯得格外敏感。", "think": "匯率是外資動向的風向球。新台幣在32元關卡附近拉鋸，代表外資雖有匯出壓力，但本土資金支撐力道也不弱。對於有出國旅遊或美元資產需求的上班族，近期需多留意匯率波動風險。", "question": "面對台幣在32元附近的震盪，你的外幣資產配置計畫會做出調整嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202608190272.aspx", "name": "中央社"}]}, {"title": "加強回饋股東 SK海力士擬回購註銷巨額庫藏股", "teaser": "記憶體龍頭大手筆護盤", "full": "韓國記憶體巨頭SK海力士宣布，為加強回饋股東並提升股東價值，計畫進行大規模的庫藏股回購並予以註銷。此舉展現出公司對未來營運前景的強烈信心，也有助於在高階晶片市場競爭中穩定投資人信心。", "think": "企業回購並註銷庫藏股是提升每股盈餘與回饋股東的直接方式。這告訴投資人，在挑選優質標的時，除了看營收成長，公司是否願意將獲利回饋給股東，也是長期持有的重要指標。", "question": "當科技巨頭選擇用巨資回購股票而非盲目擴廠，這對產業景氣循環代表什麼訊號？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202608190290.aspx", "name": "中央社"}]}], "robotics": [{"title": "AI伺服器變重 達明機器人雙臂挑戰馱重百公斤", "teaser": "工業機器人負重力大升級", "full": "隨著AI伺服器體積與重量持續增加，工廠組裝與搬運難度隨之提升。達明機器人推出能承載高達100公斤的雙臂協作機器人，專為重型伺服器生產線設計，解決製造業在AI硬體升級過程中的搬運痛點。", "think": "AI不只存在於雲端演算法，更落地在硬體製造的工廠裡。這則新聞點出「自動化升級」是剛性需求，製造業的升級轉型將為工業機器人台廠帶來龐大且長期的硬體設備商機。", "question": "隨著工廠重體力活逐漸被協作機器人取代，未來藍領勞工的核心競爭力將如何轉變？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTE1MT3JJQWZyWW4wV3pickFoZDlkcUVVUmlQaXhUZFhoQjZuWDAySTlOeHRnTzJFbUd3YmxBLVVfYVVjcVFLa2l3SmdNQk1HSmJ2ZGx4cnZrZ2VjRVBHZ1ZfOE44N0JMYWdkNFE?oc=5", "name": "華視新聞網"}]}, {"title": "台達電首展具身智能雙臂協作 AI技術導入泰國廠", "teaser": "具身智能與數位雙生落地", "full": "台達電在自動化展上首次展示具備「具身智能」的雙臂協作機器人，並透過AI技術強化整條生產線的數位雙生模擬，目前已成功導入其泰國工廠。這顯示台達電正將AI深度融入智慧製造，提升跨國工廠的生產效率。", "think": "「具身智能」是AI與物理世界結合的未來。台達電將其導入海外工廠，代表台廠在智慧製造的系統整合能力已達國際水準。投資人可持續關注台達電在綠能與自動化雙引擎下的長線價值。", "question": "當工廠能在虛擬世界中完成100%模擬再上線，這對製造業的研發與生產週期會帶來多大變革？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiS0FVX3lxTE9Qem92NV9QV1VJZzZ6dDZPdXZaWjJhc2YtaDRidzBzZkF1a29QVlY3eEJMdXZLeHpFeHJwNnFzcGlKR0lQSTZkby05Zw?oc=5", "name": "鉅亨網"}]}, {"title": "阿里投資機器人獨角獸逐際動力 傳申請在港IPO", "teaser": "機器人新創掀上市熱潮", "full": "由阿里巴巴投資的中國機器人獨角獸企業「逐際動力」，傳出已秘密向港交所遞交上市申請。這反映出在AI技術突破推動下，人形機器人與移動機器人新創正迎來一波資本市場的上市與融資熱潮。", "think": "資本的嗅覺最靈敏。大廠與新創紛紛搶進機器人領域，預示著這個產業即將進入爆發期。雖然初期投資風險高，但這股熱潮勢必會帶動上游零組件的台廠供應鏈。", "question": "面對百家爭鳴的機器人新創，你認為決定誰能存活下來的關鍵是技術 法的強大壓力，蘋果公司宣布妥協，將於10月起全面重整歐盟地區的App Store收費架構。此舉將允許開發者引導用戶至外部付費，並調整相關運作佣金比例，打破長期以來的「蘋果稅」壟斷。", "think": "這代表地緣政治與法規監管對科技巨頭的影響力正在擴大。雖然這可能短期影響蘋果的服務收入，但對於廣大的App開發商與生態系夥伴來說，則是降低成本、提升自主權的歷史性利多。", "question": "隨著「蘋果稅」在歐洲鬆綁，你認為這會引發全球其他市場對應用程式商店收費模式的連鎖改革嗎？", "sources": [{"url": "https://finance.technews.tw/2026/08/19/apple-eu-app-store-oct/", "name": "科技新報"}]}, {"title": "特斯拉Robotaxi進軍賭城受挫 申請5千輛僅獲准10輛", "teaser": "自駕計程車落地監管嚴格", "full": "特斯拉計畫在拉斯維加斯大舉推廣其Robotaxi自駕計程車服務，原本申請營運5,000輛車，最終卻僅獲得內華達州監管機構批准10輛，且被限制不得進入機場載客。這項挫敗顯示出自動駕駛技術在實際商用與法規審查上面臨的巨大鴻溝。", "think": "馬斯克的自駕夢很美，但現實的法規安全防線極難突破。這提醒投資人，對於高科技新概念的變現時程不宜過度樂觀，技術成熟不等於能立刻合法商用，中間需要漫長的法規博弈。", "question": "在安全與創新之間，你認為監管機構對無人自駕車的嚴格限制是保護大眾還是阻礙進步？", "sources": [{"url": "https://technews.tw/2026/08/19/las-vegas-tesla-robotaxi-fleet-slashed-from-5000-to-10-in-july-approval/", "name": "科技新報"}]}, {"title": "先進封裝硬需求 倍利科看好檢測營收逐月成長", "teaser": "半導體檢測設備迎商機", "full": "隨著半導體製程走向3D堆疊與先進封裝，晶片結構愈趨複雜，量測與檢測成為維持良率的「硬需求」。檢測設備廠倍利科技表示，受惠於此趨勢，看好相關光學檢測需求持續旺盛，營收有望迎來逐月成長。", "think": "當大家都在追逐台積電等晶圓代工大廠時，其實設備與檢測等周邊供應鏈才是最穩健的受益者。製程越複雜，出錯率越高，檢測設備的黏著度就越高，是低調卻高毛利的投資好去處。", "question": "在淘金熱潮中，賣鏟子的人往往最穩賺不賠；你能在目前的AI與半導體熱潮中找到哪些「賣鏟子」的隱形冠軍嗎？", "sources": [{"url": "https://technews.tw/2026/08/19/v5-technologies-2026-q2-financial-report/", "name": "科技新報"}]}, {"title": "研調指記憶體荒波及 Q2全球平板出貨年減12.3%", "teaser": "零組件缺料衝擊消費電子", "full": "根據研究機構調查，由於AI伺服器與智慧型手機大舉排擠了記憶體產能，導致平板電腦面臨嚴重的記憶體缺料問題，第二季全球平板電腦出貨量因此年減12.3%。這顯示出半導體資源分配不均對傳統消費性電子產品帶來的衝擊。", "think": "AI的排擠效應已經實質影響到我們的日常生活。因為最先進的記憶體都拿去裝在AI伺服器裡了，傳統平板、PC只能面臨缺料或漲價。這也暗示消費電子復甦之路仍受制於上游產能分配。", "question": "當AI排擠了傳統電子的零組件供應，這會加速傳統電子產品的漲價，還是會逼使消費者延長換機週期？", "sources": [{"url": "https://technews.tw/2026/08/19/research-memory-shortage-q2-global-tablet-shipments-12-3-yoy-drop/", "name": "科技新報"}]}, {"title": "電子紙光明燈顯示信眾姓名 簡化管理又省電費", "teaser": "傳統宮廟科技化轉型", "full": "傳統宮廟的光明燈也迎來科技革命！新型態電子紙光明燈不僅能清晰顯示信眾姓名，更具備極低耗電、免拉線的優勢，大幅簡化了廟方每年更換名單的繁瑣管理工作，同時省下高額電費，成為環保與科技結合的新典範。", "think": "這是一個非常接地氣的科技應用！電子紙不只能看電子書，走入傳統民俗信仰更是龐大的藍海市場。這啟發我們，科技不一定要高大上，只要能解決痛點，即便是最傳統的行業也能創造新商機。", "question": "你身邊還有哪些看似傳統、一成不變的日常生活場景，其實也非常適合導入新科技來改善效率？", "sources": [{"url": "https://technews.tw/2026/08/19/e-ink-epaper-integrates-with-traditional-blessing-lamps/", "name": "科技新報"}]}]}}</script>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
