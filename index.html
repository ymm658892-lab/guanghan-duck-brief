  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

, {"title": "Cybercab 風暴來襲 特斯拉飆 5%、SpaceX 市值返 2 兆", "teaser": "特斯拉自動駕駛發表引爆市場", "full": "隨著特斯拉預計推出的自動駕駛計程車 Cybercab 備受關注，帶動股價大漲超過5%，同時馬斯克旗下的 SpaceX 市值也重返兩兆美元大關。市場對特斯拉在自動駕駛與人工智慧生態圈的佈局給予高度肯定。", "think": "自動駕駛技術的成熟將徹底變革交通與物流模式。資本市場對創新商業模式的高度追捧，展現了科技巨頭的市場影響力。", "question": "如果無人駕駛計程車正式營運，你敢成為第一批搭乘的乘客嗎？", "sources": [{"url": "https://finance.technews.tw/2026/09/04/tesla-investors-await-updates-on-cybercab-robotaxi-touted-as-the-future-of-transport/", "name": "科技新報"}]}, {"title": "AI 苦等不到「iPhone 時刻」，奧特曼點出痛點：FDE 成落地解方", "teaser": "奧特曼指明AI落地新解方", "full": "OpenAI 執行長奧特曼表示，生成式AI要迎來真正的普及殺手級時刻，重點在於解決前端部署與深度整合（FDE）問題。唯有讓AI能順暢融入企業現有工作流程，才能真正轉化為顯著的生產力效益與商業價值。", "think": "技術本身只是工具，解決實際場景的痛點才是商業成功的關鍵。在職場上，學習如何把AI工具導入實務流程遠比只懂概念重要。", "question": "在你的日常工作中，有哪些重複性高、最需要AI幫你自動化處理的流程？", "sources": [{"url": "https://technews.tw/2026/09/04/altman-point-fde-solution/", "name": "科技新報"}]}, {"title": "AI 時代拚職涯，你的「可讀性」比技能更關鍵", "teaser": "個人可讀性成為職場新優勢", "full": "最新職涯研究指出，在AI迅速替代單一專業技能的時代，上班族的「可讀性」——即跨領域溝通、將複雜概念白話表達以及與AI共創的能力——正成為最核心的競爭力。懂得清晢傳遞價值的人將更不易被取代。", "think": "純粹硬技能容易被AI自動化，但軟實力與高規格的溝通協調能力反而更顯珍貴。上班族應著重培養清晰表達與跨界思考的能力。", "question": "你認為自己目前在職場上的溝通與表達「可讀性」高嗎？", "sources": [{"url": "https://technews.tw/2026/09/04/the-new-career-currency-is-legibility/", "name": "科技新報"}]}, {"title": "漏洞早就修好了，企業為何還會中招？「更新速度」正在成為新的資安考題", "teaser": "更新速度成為資安關鍵防線", "full": "資安報告指出，許多企業遭到駭客入侵並非因為軟體無解，而是因為系統更新與修補程式的部署速度過慢。隨著AI輔助駭客攻擊效率提升，企業能否在漏洞公布後快速完成修復，已成為資安防護成敗的重要關鍵。", "think": "速度是現代資安戰場的最核心防禦。無論企業還是個人，養成定期更新系統與軟體的習慣，是最低成本且有效的安全防護。", "question": "你的個人電腦與公司設備，通常會在接到更新通知時第一時間更新嗎？", "sources": [{"url": "https://finance.technews.tw/2026/09/04/enterprise-update-delays-become-security-vulnerabilities/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-1300">{"date": "9月3日．週四", "tldr": "台股盤中回檔，外資持續提款，但AI產業利多頻傳，光寶科與台廠供應鏈積極全球佈局，長線趨勢依然看好。", "indicators": {"note": "台股盤中修正，但美股與台積電ADR微幅收紅，顯示國際科技股動能仍在，台股短期震盪不需過度恐慌。", "tiles": [{"label": "台股加權指數", "value": "45,857.66", "valueClass": "fall", "delta": "-2.32%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "26,217.83", "valueClass": "rise", "delta": "+0.45%", "deltaClass": "rise"}, {"label": "費半指數", "value": "11,339.25", "valueClass": "rise", "delta": "+0.45%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "415.50", "valueClass": "rise", "delta": "+0.36%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "外資賣超台股481億元連2賣　減碼記憶體和ETF", "teaser": "外資提款，記憶體受挫", "full": "外資連續兩天大舉賣超台股，單日賣超金額高達481億元。本次減碼主要集中在記憶體族群與多檔熱門ETF，顯示在外資調節資金的壓力下，台股短期內面臨較大的震盪整理考驗。", "think": "外資大提款可能讓大家心慌慌，但這也是檢視個股體質的好機會。建議通勤族先觀望，不急著在震盪期盲目追高或殺低。", "question": "面對外資大舉調節，你的投資組合有做好抗震的資產配置嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609030218.aspx", "name": "中央社"}]}, {"title": "記憶體漲價壓抑PC出貨　宏碁：預留零件升級空間因應", "teaser": "零件變貴，宏碁出奇招", "full": "面對記憶體價格持續上漲，進而壓抑PC出貨量的挑戰，宏碁提出應對策略。他們計畫在產品設計上預留零件升級空間，讓消費者未來能自行升級，以此減緩出貨壓力並維持市場競爭力。", "think": "供應鏈漲價考驗企業的應變能力。宏碁這種「留白」策略，既能控制初期成本，也給消費者彈性，是聰明的過渡方案。", "question": "當生活成本或工作預算受限時，你是否也能像宏碁一樣找到「預留空間」的彈性方案？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609030216.aspx", "name": "中央社"}]}, {"title": "光寶科加強散熱布局　砸56億取得波蘭DCX約25%股權", "teaser": "光寶科布局液冷新商機", "full": "光寶科宣布斥資56億元台幣，取得波蘭液冷散熱企業DCX約25%的股權，藉此強化在全球散熱市場的技術布局。此舉將有助於光寶科在AI伺服器高階散熱領域奪得先機。", "think": "AI時代「散熱」是剛需，光寶科大手筆投資歐洲企業，顯示台廠正加速卡位關鍵技術。散熱供應鏈仍是未來幾年不可忽視的投資亮點。", "question": "隨著AI算力需求暴增，除了晶片本身，你還注意到哪些像「散熱」一樣的隱形冠軍產業？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609030211.aspx", "name": "中央社"}]}, {"title": "經長：台廠追加200億美元赴美投資　聚焦半導體AI伺服器", "teaser": "台美半導體合作再加碼", "full": "經濟部長透露，台灣廠商將追加200億美元赴美國投資，投資重點將高度聚焦在半導體與AI伺服器等核心領域。這項合作將進一步深化台美科技產業鏈的共生關係。", "think": "台廠赴美投資雖然成本高，但這是貼近全球最大客戶的必要之惡。這代表台美科技結盟更加緊密，台廠在全球供應鏈的地位無可取代。", "question": "面對全球地緣政治與供應鏈重組，你認為台廠的「美式布局」會是長期利多嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609030176.aspx", "name": "中央社"}]}, {"title": "精測8月營收創新高、南電同期次高　AI加持給力", "teaser": "AI加持，科技大廠報喜", "full": "受惠於AI市場需求的強勁拉動，精測8月營收創下歷史新高，而南電也繳出歷史同期次高的亮眼成績單。這顯示AI相關供應鏈的拉貨動長依然非常強勁，實質業績已陸續兌現。", "think": "營收數據是檢驗AI行情有沒有「泡沫化」的最好指標。精測與南電的成績單證明，AI不只是題材，而是已經實實在在轉換成企業的營收。", "question": "在挑選AI概念股時，你是否會優先檢視其月營收是否有實質成長？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609030173.aspx", "name": "中央社"}]}], "robotics": [{"title": "機器人也上幼兒園？中國試錯式訓練場引外媒驚嘆", "teaser": "機器人幼兒園，試錯學習", "full": "中國近期出現類似「幼兒園」的機器人訓練場，讓AI機器人透過不斷試錯的方式學習日常動作，引發外媒高度關注。這種訓練模式能加速機器人適應人類生活環境。", "think": "機器人像小孩一樣透過「試錯」來學習，這正是生成式AI與具身智能結合的體現。未來的機器人將不再只是死板的機器，而是能自我進化的個體。", "question": "如果機器人都能透過不斷犯錯來學習，我們在工作中是不是也該給自己更多試錯的勇氣？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTE5JalZqc29UVHlxdHEwQWVIUXB5Z0ZEekNXZU50Z2VUVkhTWUp0SldPZ0FxQTJwYkZIZlFDaDg4NWxIT0ZHUExsdUJFUUgzdkpvTFN5bE1UYldBTXd4R3BFUjZXbUpTSE1wM0E?oc=5", "name": "hkcna.hk"}]}, {"title": "歐洲AI機器人亮相 大秀做家事新技能", "teaser": "家事免動手，科技解放雙手", "full": "歐洲最新研發的AI機器人正式亮相，在展覽中大秀整理房間、做家事等新技能。這顯示家用服務型機器人的技術已逐漸成熟，距離走入一般家庭的日常生活又更近了一步。", "think": "做家事機器人是所有上班族的終極夢想！雖然目前可能還很昂貴，但這代表科技正朝著「解決人類日常生活痛點」的方向快速前進。", "question": "當家用機器人普及到可以幫你做所有家事時，你會想把省下來的時間拿來做什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiYEFVX3lxTE1hNjJrMm9oZXpSZU8wdGJJbmUxQ043cUZKTlcycmRpQ0xkUWpsbC1aTGsyZDZBQllmS05IOGZxWXJhcDBUakljdGIwekxhejhMTjhrLXJlNlNjTWdDSzJabg?oc=5", "name": "民視新聞網"}]}, {"title": "機器人＋半導體自動化需求爆發！台廠卡位AI智慧工廠 8檔明星股出列", "teaser": "台廠搶灘AI智慧工廠", "full": "隨著半導體與自動化需求爆發，台廠正積極卡位AI智慧工廠商機，多檔明星概念股應運而生。結合機器人與自動化系統，將大幅提升工廠的生產效率與良率。", "think": "智慧製造是台灣的強項，當機器人遇上自動化，台廠的硬體製造優勢將會被無限放大。這些卡位成功的明星股，是值得長期追蹤的投資標的。", "question": "在勞動力短缺的時代，你認為自動化與機器人會如何重塑台灣的製造業優勢？", "sources": [{"url": "https://news.google.com/rss/articles/CBMie0FVX3lxTE95NU9heFpQSUdzYnNNdEhIZk1QQzhuV1RUWHF0eDRoRUM1cE1ibnJCMkl0SFM0a2pzRlBIRnNjRGg2cUkya1VORldPdFBZWThXUjhqNFZrOEhZbm9EZzJWU0NmSGpwa0tubE9UcDZOYWdRLTc3MjV3M1lCcw?oc=5", "name": "財訊"}]}, {"title": "工研院智慧農漁週展出番茄採摘及畜牧場保全機器人", "teaser": "農業機器人，採番茄也行", "full": "工研院在智慧農漁週展出最新研發的「小番茄採摘機器人」與「畜牧場保全機器人」。這些創新科技旨在解決農業勞動力老化與短缺問題，助攻台灣智慧農業精準升級。", "think": "科技不只在無塵室，也能落地到農田與牧場。農業機器人的發展，能有效緩解台灣農業缺工的痛點，讓傳統產業煥發新機。", "question": "看到機器人走入農田，你認為科技還能幫台灣的傳統產業解決哪些痛點？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTE0zejNfYlJYWmZmbHRFYXF1TFpyWkdHSlpBR1pkNjNNdjBrRXBEVklvWmtSMWxibktIcnNEVmtNcFJ6MXljbjRQR3B5d1VJLXdlcGc?oc=5", "name": "中華新聞雲／中華日報"}]}, {"title": "個股：精確集團旗下奧威科技攜手立信開發集團，進軍智慧機器人安保巿場", "teaser": "強強聯手，搶攻安防商機", "full": "精確集團旗下的奧威科技宣布與立信開發集團攜手合作，共同進軍智慧機器人安保市場。雙方將結合各自在硬體與系統開發的優勢，打造新一代的智慧安防解決方案。", "think": "機器人保全不僅能24小時不間斷巡邏，還能降低人力成本。這種跨界合作，顯示安防市場正迎來一波科技轉型潮。", "question": "未來社區保全如果換成智慧機器人，你會覺得更安心還是會有些不習慣？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxPdU1BWFZxWUNHOEtKVk53SDRqdU5CdlVRT0x5SVlZc2pqd0ZPZ2JqWWhLa3pjdFhkMF9rODNDX2RHd2trR09oNDdrZTd4NHRtazVLcVZjLU1vc19nZkY2QV9DanNLc3BiS2VaZmxiRC12VGRnSE1lVnJxelVsTDkxM3haOHVJcVFw?oc=5", "name": "富聯網"}]}], "tech": [{"title": "記憶體推推 iPhone 18 系列成本，AI 與定價成換機關鍵", "teaser": "下下代iPhone，可能變貴", "full": "業界消息指出，由於記憶體價格持續走高，預計將推升未來iPhone 18系列的生產成本。在AI功能需求增加與成本上漲的雙重壓力下，產品定價將成為消費者是否換機的關鍵。", "think": "雖然現在討論iPhone 18還太早，但記憶體等零組件漲價是趨勢。這提醒我們，AI功能雖然誘人，但消費者對價格的敏感度依然會決定科技新品的生死。", "question": "如果未來的AI手機因為成本增加而大幅漲價，你願意為了更聰明的AI功能買單嗎？", "sources": [{"url": "https://technews.tw/2026/09/03/memory-drives-up-iphone-18-series-costs-ai-pricing-key-upgrades/", "name": "科技新報"}]}, {"title": "今年展還沒結束、明年先廝殺！SEMICON 台灣 2027 搶攤大戰開打", "teaser": "半導體大展，熱度排到後年", "full": "雖然今年的SEMICON Taiwan國際半導體展還沒結束，但廠商早已開始爭奪2027年的參展攤位。這場搶攤大戰提前開打，顯見全球半導體產業對台灣供應鏈平台的高度重視。", "think": "展覽攤位居然搶到後年去，這熱度簡直超乎想像！這再次證明台灣在全球半導體產業中，擁有絕對核心且無法被忽視的平台地位。", "question": "半導體展的超前搶攤，是否讓你對台灣科技業的長期競爭力更有信心？", "sources": [{"url": "https://ccc.technews.tw/2026/09/03/semicon-taiwan-2027-booth-wars-kick-off-before-this-years-exhibition-concludes/", "name": "科技新報"}]}, {"title": "辛耘第二季獲利創單季新高，自製設備與再生晶圓營收首度超越代理", "teaser": "辛耘大豐收，自製設備發威", "full": "半導體設備廠辛耘第二季獲利創下單季歷史新高。值得注意的是，其自製設備與再生晶圓的營收首度超越代理業務，顯示公司自主研發轉型成功，獲利結構更加健康。", "think": "從「代理」走向「自製」是台廠升級的必經之路。辛耘的成功轉型，不僅提升了自身的毛利率，也代表台灣半導體自主設備的實力更上一層樓。", "question": "在你的工作或投資中，是否也曾思考過如何從「代理/代工」思維轉向「自創價值」？", "sources": [{"url": "https://finance.technews.tw/2026/09/03/xinyuns-second-quarter-profit-hit-a-new-quarterly-high/", "name": "科技新報"}]}, {"title": "HTC 手機業務走向尾聲？預告 Q4 推全新 AI 硬體、明年 AI 眼鏡再進化", "teaser": "宏達電轉型，AI硬體新局", "full": "宏達電（HTC）手機業務似乎正逐步淡出，公司預告將於今年第四季推出全新的AI硬體產品，並計畫在明年讓AI眼鏡產品再度進化。這顯示HTC正全力轉向AI與XR生態系的布局。", "think": "曾經的手機帝國如今全力轉攻AI硬體，雖然令人唏噓，但這也是企業面臨時代巨輪不得不做的斷捨離。轉型雖然痛苦，但新方向或許能帶來新曙光。", "question": "面對市場環境的劇烈變遷，你認為企業該堅持原有的光環，還是果斷轉向全新的未知領域？", "sources": [{"url": "https://technews.tw/2026/09/03/htc-vive-eagle/", "name": "科技新報"}]}, {"title": "光寶砸 1.76 億美元強攻液冷，入股 DCX", "teaser": "大手筆砸錢，光寶科拼液冷", "full": "光寶科技宣布將投入1.76億美元強攻液冷散熱技術，並入股波蘭DCX公司。此舉顯示光寶科正加速在AI伺服器高階散熱市場的戰略布局。", "think": "這則新聞與Markets分類呼應，但從科技角度看，1.76億美元的投資金額相當龐大，顯示液冷技術在AI時代的關鍵性。這將是未來伺服器規格的標準配備。", "question": "當科技巨頭紛紛重金押寶某一項技術（如液冷）時，你是否會順藤摸瓜尋找相關的投資機會？", "sources": [{"url": "https://finance.technews.tw/2026/09/03/lite-on-176m-liquid-cooling-expansion-dcx-stake/", "name": "科技新報"}]}]}}</script>

    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
