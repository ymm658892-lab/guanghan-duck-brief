  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

<script type="application/json" id="slot-1300">{"date": "11月19日．週四", "tldr": "台股盤中震盪劇烈，市場傳出美方擴大對中晶片管制，導致台積電與相關供應鏈面臨不確定性，投資人需留意科技股波動風險。", "indicators": {"note": "今日台股領先指標顯著回檔，顯示本土市場受地緣政治與產業管制消息影響較深，與美股科技股的穩定表現形成明顯反差。", "tiles": [{"label": "台股加權指數", "value": "38,426.89", "valueClass": "fall", "delta": "-4.15%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "24,429.88", "valueClass": "rise", "delta": "+0.42%", "deltaClass": "rise"}, {"label": "費半指數", "value": "9,652.80", "valueClass": "rise", "delta": "+0.10%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "362.62", "valueClass": "rise", "delta": "+0.81%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "美出口管制新規衝擊　台積電、三星暫停對中晶片出貨", "teaser": "美方擴大技術管制，科技供應鏈出貨添變數。", "full": "近期傳出美國正研擬新的晶片出口管制，旨在進一步限制先進技術流入中國。受此消息影響，台積電與三星等代工大廠已暫停部分對中相關晶片出貨，以配合法規變動並降低潛在風險。", "think": "地緣政治已成為影響科技業獲利的最大變數，對於持有半導體權值股的投資人來說，這類政策風險將直接衝擊相關公司的營收與庫存去化速度。", "question": "當全球科技供應鏈被迫選邊站時，台廠該如何調整全球佈局以分散單一市場風險？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202611190353.aspx", "name": "中央社"}]}, {"title": "華新迎60週年　焦佑倫看好液冷、核能等九大商機", "teaser": "華新集團聚焦AI與能源轉型，佈局多元長線動能。", "full": "華新董事長焦佑倫在60週年活動上明確指出，未來將瞄準AI液冷技術、小型核能反應爐（SMR）等九大關鍵領域發展。公司將透過轉型與技術升級，深耕這些具備高成長潛力的基礎設施與科技應用市場。", "think": "老牌傳產大廠積極轉型AI供應鏈，顯示出AI熱潮已從軟體擴散至電力與散熱等硬體基礎設施，這是長期投資者應關注的產業結構性機會。", "question": "傳統產業如何透過自身優勢成功切入高門檻的AI與能源科技市場？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611190375.aspx", "name": "中央社"}]}, {"title": "世界、萬泰科違約交割　合計逾8719萬元", "teaser": "台股盤中出現違約交割，提醒投資人槓桿操作風險。", "full": "近期證券市場出現兩家公司股票發生違約交割情事，總金額超過8700萬元。這顯示在市場震盪期間，部分投資人因槓桿過大或誤判行情，導致無法履行交割義務，進而影響市場穩定。", "think": "違約交割往往是市場過熱或信心崩盤的警訊之一，這提醒我們在波動劇烈的行情下，務必審慎評估自己的資金水位與風險承受能力。", "question": "在台股高檔震盪時，你是否保持了足夠的現金流以應對突發的帳戶風險？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611190348.aspx", "name": "中央社"}]}, {"title": "富邦媒mo店+出貨資料遭盜取　主動通知受影響客戶", "teaser": "電商個資外洩風險再起，企業資安管理備受考驗。", "full": "富邦媒旗下服務平台「mo店+」近日發生出貨資料遭外部非法存取的資安事件。業者已主動通知受影響的客戶，並採取後續強化資安防護措施，以防止個資進一步外流並降低對用戶的損害。", "think": " ps://news.google.com/rss/articles/CBMiT0FVX3lxTE1od2FRSW9MbG96RDlDVUoyb2pBVUdBSWVLQzZMZVo0SFpSQWZwUDJfODVDQkpNaW9uVTVzMm9jcjBVWVVoUl8yc3Bhb1lFc0E?oc=5", "name": "鉅亨網"}]}, {"title": "蠡湖股份：部分機器人零部件已實現小批量量產", "teaser": "機器人零組件量產突破，產業鏈成熟度持續提升。", "full": "蠡湖股份表示，公司研發的部分機器人零部件已正式通過測試並進入小批量量產階段。這標誌著公司在精密機械製造領域的技術已達標，未來將持續擴大產能，以應對市場對機器人核心組件的增長需求。", "think": "從樣品測試到小批量量產是機器人產業邁向規模經濟的關鍵一步，這類零組件供應商的進度，直接反映了整體產業鏈的成熟速度。", "question": "量產能力的提升對於降低機器人終端售價，會帶來什麼樣的市場連鎖反應？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiakFVX3lxTE5fSWR0OVlpcUY5cWVqbmEzWmRlSmtUX1owVlJObjFiX1M0b2tDNVJxVUlCUUthMzhvLUNEMDMyeEp2b0ZiQ1pObHA5QnRLUFViWkRld3hDQVY2dS15UndjME5USW9GQmtKckE?oc=5", "name": "TradingView"}]}, {"title": "華沿機器人斥資324萬港元回購股份", "teaser": "公司回購彰顯信心，機器人業者動態值得關注。", "full": "華沿機器人於11月19日動用約324.4萬港元進行股份回購，共買回50萬股。此舉通常被視為管理層認為目前股價被低估，並對公司未來在機器人市場的發展前景抱持信心，意圖向市場傳遞穩健經營的訊號。", "think": "在市場波動劇烈時，公司採取庫藏股回購措施，不僅能提升每股盈餘，也是向投資人示好並穩定股價的重要手段，值得列入長期觀察名單。", "question": "公司回購股份時，投資人應如何判斷這是短期護盤行為還是長期價值被低估？", "sources": [{"url": "https://news.google.com/rss/articles/CBMicEFVX3lxTE1oNjlXVVZ5MmdXeXF0ekZ1cFRfNUJYZVZoaC1KUWFnOV9paDlMckNzR3JwMGV4anNlc2ZfbUliVHZsNDl6TEg0YUU1TVpMSUo4TTljeTJzd1lRV2EtX283R1Z0dFdad0JtUGtVVWZlbHI?oc=5", "name": "Investing.com 香港 - 股市報價& 財經新聞"}]}], "tech": [{"title": "美光新加坡HBM封裝廠機台進駐，2027年產出", "teaser": "美光佈局高頻寬記憶體，搶佔AI算力硬體商機。", "full": "美光位於新加坡的HBM（高頻寬記憶體）先進封裝廠近日完成首部機台進駐。這座新廠將作為美光在全球AI記憶體供應鏈的重要節點，預計於2027年初正式投產，以支援日益龐大的AI算力需求。", "think": "HBM已成為AI伺服器的核心瓶頸，美光的擴產計畫顯示記憶體廠已將重心移往高階AI應用，這對相關設備供應鏈而言是長達數年的利多訊號。", "question": "隨著AI應用對記憶體容量需求暴增，未來記憶體產業的週期性是否會被結構性改變？", "sources": [{"url": "https://finance.technews.tw/2026/11/19/micron-singapore-hbm-advanced-packaging-plant-installs-first-machine/", "name": "科技新報"}]}, {"title": "美封殺海外算力，三星嚴查代工來源", "teaser": "美國擴大科技出口管制，全球晶片代工鏈受壓。", "full": "美國近期進一步擴大對中國海外算力的封殺力度，市場傳出三星電子為配合法規，正嚴格審查代工訂單的最終來源。此舉使得中國AI業者在取得先進算力晶片上壓力倍增，全球供應鏈也面臨更嚴謹的合規要求。", "think": "技術圍堵已從單純的成品出口，延伸到代工與算力租賃的層面，這將迫使全球半導體產業在合規性與獲利之間進行更痛苦的取捨。", "question": "面對全球科技地緣政治的複雜化，企業在獲取海外訂單時該如何建立防禦性的合規機制？", "sources": [{"url": "https://technews.tw/2026/11/19/us-china-ai-chip-export/", "name": "科技新報"}]}, {"title": "群聯發表AI Data Platform，提供企業智慧分析", "teaser": "群聯推動AI數據平台，深化企業級資料應用服務。", "full": "群聯電子正式發表AI Data Platform，旨在協助企業運用自有資料進行智慧分析應用。透過此平台，企業能更高效地處理與儲存大規模數據，並進一步開發客製化的AI模型，解決資料儲存與運算之間的瓶頸。", "think": "單純販售硬體的時代已過，提供軟硬整合的數據解決方案，是科技公司從硬體代工轉型為價值服務提供者的關鍵策略，這能有效提升客戶黏著度。", "question": "企業在導入AI數據平台時，最該優先解決的瓶頸是技術成本還是資料隱私問題？", "sources": [{"url": "https://finance.technews.tw/2026/11/19/phison-releases-ai-data-platform/", "name": "科技新報"}]}, {"title": "AI熱潮背後的現實：哈佛研究揭獲利三大挑戰", "teaser": "AI產業發展回歸理性，訂閱制獲利模式面臨挑戰。", "full": "一份哈佛研究指出，AI產業在熱潮背後正面臨現實的挑戰，包括訂閱價格過高、用戶留存率不穩定以及難以實現規模化獲利。研究建議企業需重新審視AI產品的商業模式，以確保長期營運的健康度。", "think": "任何新興技術在熱潮過後終須面對獲利考驗，投資人對於AI相關標的應保持理性，觀察企業是否能成功將技術優勢轉化為穩定的現金流。", "question": "你認為目前的AI應用產品，有多少比例能真正達成長期且具備獲利能力的用戶黏著？", "sources": [{"url": "https://technews.tw/2026/11/19/ai-spending-spree-payback-harvard-study-2-9-paid-rate/", "name": "科技新報"}]}, {"title": "最常用密碼「123456」第七次登榜首", "teaser": "網路資安意識仍待加強，簡易密碼洩漏風險高。", "full": "根據資安監測報告，最簡單的密碼「123456」連續第七次成為年度最常用密碼榜首，同時「starwars」等流行文化詞彙也榜上有名。這顯示儘管資安威脅日益嚴峻，大眾在帳號保護上的意識仍極為薄弱。", "think": "密碼安全是數位生活中最基本的一環，卻也是資安防護最脆弱的缺口，這提醒我們在追求科技便利的同時，務必採取雙重驗證等更安全的保護措施。", "question": "在便利與安全之間，你是否有定期更換並強化個人帳號密碼的習慣？", "sources": [{"url": "https://infosecu.technews.tw/2026/11/19/123456-tops-most-used-password-list-for-seventh-time/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-2000">{"date": "11月19日．週四", "tldr": "今晚美台股市面臨回歸修正壓力，不過 AI 巨頭 Anthropic 成功上市與硬體供應鏈持續推進，長遠產業轉型趨勢依然明確。", "indicators": {"note": "展現今晚台股盤後大跌與美股期指、科技權值股接連收低的深層修正壓力，投資人需密切注意科技板塊動向。", "tiles": [{"label": "台股加權指數", "value": "38,426.89", "valueClass": "fall", "delta": "-4.15%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "23,895.31", "valueClass": "fall", "delta": "-2.19%", "deltaClass": "fall"}, {"label": "費半指數", "value": "9,434.41", "valueClass": "fall", "delta": "-2.26%", "deltaClass": "fall"}, {"label": "台積電ADR", "value": "353.81", "valueClass": "fall", "delta": "-2.43%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "Anthropic上市首日開盤大漲34% 市值突破2兆美元", "teaser": "AI獨角獸強勢掛牌上市", "full": "AI巨頭 Anthropic 正式登錄資本市場，上市首日開盤股價隨即大漲三成以上，帶動整體市值突破兩兆美元關卡。這顯示出全球資本市場對於生成式 AI 龍頭企業的成長潛力依然保持高度熱情與期待。", "think": "儘管整體大盤遭遇回檔壓力，頂尖 AI 科技股的強勁表現依然是市場焦點。這代表市場資金並未退場，而是更加集中於真正具有關鍵技術優勢的產業領頭羊。", "question": "當科技權值股估值不斷推升，你的投資組合是否做好了抗震準備？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611200004.aspx", "name": "中央社"}]}, {"title": "Anthropic掛牌上市提振AI交易 美股開盤走高", "teaser": "科技巨頭上市激勵美股", "full": "受益於 Anthropic 熱烈掛牌帶動的科技股追價意願，美股開盤展現亮眼強勢。AI 相關概念股普遍獲得買盤挹注，市場情緒受到顯著提振，為近日震盪的股市帶來短線支撐力量。", "think": "科技龍頭的上市常能扮演市場多頭的催化劑。然而，盤中市場情緒變化迅速，投資人不宜過度追高，仍需密切關注後續籌碼面與總體經濟數據的變化。", "question": "你會因為單一龍頭股的強勢表現而調整整體資產配置嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611190391.aspx", "name": "中央社"}]}, {"title": "Anthropic掛牌掀AI熱潮 歐股仍收低", "teaser": "歐美市場走勢呈現分化", "full": "雖然 Anthropic 掛牌上市帶來龐大的 AI 申購與交易熱潮，但歐洲股市受制於區域經濟放緩與地緣政治疑慮，整體指數最終仍告收低。顯示出跨國市場間對於科技題材的反應程度存在差異。", "think": "全球市場走勢並非完全同步，歐洲市場對科技題材的敏感度較低，反應出傳統產業比重較高。投資人在進行全球資產配置時，應適度分散區域風險。", "question": "在面對不同區域市場的分化走勢時，你如何決定資金分配？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611200005.aspx", "name": "中央社"}]}, {"title": "金管會推企業TISA 集保結算所率先試行", "teaser": "企業級投資帳戶正式啟動", "full": "金管會積極推動企業版台灣個人投資專戶（TISA），並由集保結算所率先進行內部試行。此政策旨在鼓勵企業協助員工進行長期投資規劃，健全國內資本市場的長線資金結構。", "think": "企業 TISA 的推動有助於上班族建立規律的長期理財習慣 <script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
