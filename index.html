  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

跌防守的根本。", "question": "在AI概念股進入獲利驗證階段時，你手上的持股符合實質獲利成長的標準嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611110021.aspx", "name": "中央社"}]}, {"title": "傳洽購肯德基必勝客業務估年底前達協議 統一：無法置評", "teaser": "民生餐飲版圖傳重組", "full": "市場傳出統一集團有意洽購台灣肯德基與必勝客之餐飲業務，並預計於年底前達成協議，統一官方對此表示無法置評。此項潛在併購案若最終成真，將大幅刷新台灣連鎖餐飲與零售市場的競爭版圖。", "think": "內需零售與餐飲市場的併購重組，反映出大型集團整合通路與營運資源的趨勢。民生消費產業集中化，有利於發揮規模經濟並提升整體營利效率。", "question": "連鎖餐飲若跨國品牌與本土通路大廠深度整合，你認為對消費者是利多還是利空？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202611110028.aspx", "name": "中央社"}]}], "robotics": [{"title": "輝達發表 GR00T 2 機器人模型，靠人類影片學會精細手部技能", "teaser": "通用機器人模型進化", "full": "輝達發表全新GR00T 2人形機器人模型，強調能透過直接觀看人類操作影片進行自主學習。該模型大幅提升了手部精細操作技能，可望顯著加速人形機器人進入工廠與實際場景應用的時程。", "think": "機器人透過視覺學習精細技能，突破了傳統程式碼設定的瓶頸。未來人形機器人在製造業與服務業的導入速度將比想像中更快。", "question": "如果人形機器人能在幾年內走入職場，你認為自己的工作有哪些部分最難被取代？", "sources": [{"url": "https://news.google.com/rss/articles/CBMilgFBVV95cUxQQjF1UVNzUWEya2JLdkdaczRwTkFSWWtZaHJSbDkzbGdocFhSSHlqXzRGTHFRS05FZDdPOHhJOFBCZEtvVzZsU2pXVTQ1ZVJDRjBTemhWbWotU0lhVXd5M055ZlZFWWx4Yjg3ZUFMN3d3c0MtN0FZU2lna252Ullzc2gzaFNjYTJHRnR4VGRIeXd4S2VsdVE?oc=5", "name": "TechNews 科技新報"}]}, {"title": "《慕尼黑電子展》研華秀AI視覺語言模型，醫療及機器人成長強", "teaser": "研華展出AI視覺模型", "full": "工業電腦龍頭研華於慕尼黑電子展大舉展出AI視覺語言模型，並將其深度整合至醫療與機器人相關應用中。此舉凸顯出智慧製造與醫療自動化市場需求強勁，為邊緣AI應用注入全新成長動能。", "think": "台灣工業電腦業者透過邊緣AI與視覺模型結盟，正逐步搶占高附加價值的醫療與機器人應用，這是台廠轉型升級的重要指標。", "question": "邊緣AI與機器人深度結合，是否會成為台灣硬體大廠下一個十年的主要成長引擎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMikgFBVV95cUxOcEhnZGpfS091R3lQYlN6ZUdhSzQxbER1TGJtRkFvSlpaY0h6SWdES3Y0bHZVWmxoTVA5TjlXSFpFamVIVUtoNXpqUE5Pd3cwRHpHelJ2OEEzLW5WQW1WM2trUE5NTDhVWTA3SVBQVVIxcFlEbmo2VVRQNnpFbEhQcUhVTTc2X3I4Q016UVR5S19yQQ?oc=5", "name": "MoneyDJ"}]}, {"title": "瀧澤科Q3 EPS近兩年高；機器人應用已有實績", "teaser": "工具機廠轉型迎獲利", "full": "瀧澤科公布第三季單季EPS創近兩年新高，營運表現亮眼。除了傳統工具機需求回穩外，公司在機器人相關自動化與智慧製造應用領域已展現具體營運實績，吸引市場法人買盤高度關注。", "think": "傳統精密機械業者切入機器人與自動化供應鏈，能顯著提升產品附加價值與毛利率，為轉型成功的優質範例。", "question": "在選股時，你會傾向挑選純AI題材股，還是像瀧澤科這種有實體業績支撐的轉型股？", "sources": [{"url": "https://news.google.com/rss/articles/CBMikgFBVV95cUxON01mVU41Q1dwOGZMLV9pcG1KdWt4MTVUbDRNcUFia0pycUtRcFBXcFBQTnpELUduZHM5bjhfNjk5TVBHNGxlNFZLZk9CZ0Q2LTFfdHhLdm85c2lIRzJfM3k3SHRIY0ljclZGVHpHOFNaUUx5SlUxMVpTeWxabmhvb1kyYld1cVRmNWxVMTJCdnZ6QQ?oc=5", "name": "MoneyDJ"}]}, {"title": "物理AI加速落地！Anthropic、蘋果等陸續迭代相關模型，港股物理AI概念股走強", "teaser": "物理AI帶動軟硬整合", "full": "科技巨頭Anthropic與蘋果相繼發表與物理空間互動相關的AI模型，帶動物理AI概念熱度全面爆發。相關技術加速落地，不僅激勵港股相關概念股強勢走高，也掀起軟硬體整合的新一波熱潮。", "think": "AI正從軟體對話框延伸到實體物理世界的感知與操控，這將帶動感測器、晶片與機器人硬體設備的下一波強勁需求。", "question": "從純軟體生成式AI走向物理AI實體應用，你覺得哪個產業會最先迎來爆發性成長？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiSEFVX3lxTE9tZWwzM0dseWJCbzhhRGx1YzltdnF1R3BINU9fQVFUNEV4X0hkMnJ2OEx3SWZOYUd4OThFVVA5SEhtS0FCazBaVg?oc=5", "name": "鉅亨號"}]}, {"title": "實體AI安全落地免等數月！恩智浦推出「整合式機器人平台」 30分鐘內解鎖無人機開發", "teaser": "機器人開發平台革新", "full": "車用半導體巨頭恩智浦發表整合式機器人平台，標榜能將原本需時數月的無人機與實體AI系統開發時程縮短至30分鐘內。該平台提供一站式軟硬體支援，能大幅降低製造商的開發技術門檻。", "think": "模組化與平台化的軟硬體解決方案，正極速降低機器人開發的技術壁壘，未來將促成更多中小型創新企業加入實體AI戰局。", "question": "當機器人開發門檻大幅降低，市場競爭焦點將轉向技術研發還是場景應用？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTFBsZU5LODdDRHNwSDFKeXdSdTJqYnZHYnJfS3ZvY2p3WndDelJDbTNXQzJ2RUdJaGR2cXQ2WmlFWF90ZDBXNktwR3h5UDZLbEFubmc?oc=5", "name": "蕃新聞"}]}], "tech": [{"title": "Diraq 開發矽量子晶片，可望解決 AI 資料中心用電問題", "teaser": "量子晶片紓解AI用電", "full": "新創公司Diraq成功開發出新型矽量子晶片，技術具備極高算力與超低功耗特性。這項創新成果被寄予厚望，可望成為解決當前AI資料中心面臨龐大用電瓶頸與散熱難題的突破性解決方案。", "think": "AI資料中心的電力消耗已成為科技發展最大痛點之一，量子技術若能在商業上落地，將為算力革命注入全新永續動能。", "question": "面對AI帶來的龐大能源危機，你認為新世代晶片技術還是綠能建設更能根治問題？", "sources": [{"url": "https://technews.tw/2026/11/11/quantum-could-solve-ai-energy-drain/", "name": "科技新報"}]}, {"title": "Bloom Energy 擴產帶動商機，康舒、高力、宏致 10 月營收齊揚", "teaser": "燃料電池供應鏈亮眼", "full": "燃料電池大廠Bloom Energy因應AI資料中心龐大的急迫電力需求而大幅擴產，帶動台灣相關供應鏈夥伴營收齊揚。康舒、高力與宏致等台廠10月營收表現亮眼，充分展現綠能與算力結合的商機。", "think": "AI熱潮不僅嘉惠半導體與伺服器，更直接跨界帶動電力與能源設備需求，相關電力供應鏈已成為AI浪潮下的實質受惠者。", "question": "除了傳統半導體外，你有將AI引發的「缺電與電力設備」商機納入投資考量嗎？", "sources": [{"url": "https://finance.technews.tw/2026/11/11/bloom-energy-expansion-boosts-kss-koalaty-aces-october-revenues/", "name": "科技新報"}]}, {"title": "不再只聽 AI 公司說了算，紐約州啟動全美首創「獨立 AI 測試計畫」", "teaser": "紐約啟動獨立AI監管", "full": "紐約州政府啟動全美首個由第三方獨立進行的AI測試計畫，旨在客觀評估AI系統的安全、隱私與潛在風險。此舉打破了過去由科技巨頭自主宣稱安全的模式，為全球AI監管樹立全新典範。", "think": "AI技術快速擴張帶來隱私與安全隱憂，政府與第三方獨立監管機構的介入，將促使AI發展邁向更負責任且可信任的軌道。", "question": "你認為對AI進行嚴格的第三方安全審查，會阻礙技術創新還是促進長期健康發展？", "sources": [{"url": "https://technews.tw/2026/11/11/new-york-will-independently-test-ai-models/", "name": "科技新報"}]}, {"title": "從數年縮短至四週，DeepMind AI 成功完成 Signal 核心加密「形式化驗證」", "teaser": "AI大幅提昇資安驗證", "full": "Google DeepMind利用先進AI技術，將原本需耗費數年的人力安全驗證時間大幅縮短至僅僅四週，成功完成了知名加密通訊軟體Signal核心安全協定的形式化驗證，寫下資安防護新頁。", "think": "AI不僅能寫程式，更能以極高效率驗證軟體底層安全性，大幅提升資安維護效能，這將徹底改變軟體工程與資安防護的發展路徑。", "question": "當AI大幅提升資安檢測效率時，網路安全威脅是否也會同步以同樣速度升級？", "sources": [{"url": "https://infosecu.technews.tw/2026/11/11/deepmind-ai-successfully-completes-formal-verification-signals-core-encryption/", "name": "科技新報"}]}, {"title": "網路攻擊日益猖獗，Hugging Face 示警：開源 AI 恐被迫走向「封閉」", "teaser": "資安威脅衝擊開源AI", "full": "知名開源AI模型平台Hugging Face發出警告，指稱隨著針對開源模型的網路攻擊與惡意濫用日益猖獗，社群未來恐被迫提高存取門檻甚至走向封閉，這將對開源生態系的健全發展造成嚴峻挑戰。", "think": "開源AI是推動近年技術蓬勃發展的核心基石，若因安全性問題轉向封閉，可能抬高AI創新的門檻，對中小型開發者影響深遠。", "question": "如果開源AI社群因資安考量被迫走向封閉，對整體科技產業的創新速度是利還是弊？", "sources": [{"url": "https://infosecu.technews.tw/2026/11/11/open-source-ai-faces-cybersecurity-crisis/", "name": "科技新報"}]}]}}</script>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
