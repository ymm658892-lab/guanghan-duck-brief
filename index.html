  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

 "匯率的小幅貶值，會如何影響你對外幣資產或海外基金的配置想法？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609290026.aspx", "name": "中央社"}]}, {"title": "摩根大通估全球AI題材回檔後有望復甦 看多半導體股", "teaser": "外資看好AI回檔後再出發", "full": "摩根大通最新報告指出，全球AI相關題材在經歷近期震盪回檔後，未來有望迎來復甦，並明確表態看好整體半導體產業的後市表現。這為市場長線發展注入了一劑強心針。", "think": "短期的股價修正往往是消化過熱情緒的健康過程，長線大趨勢如AI與半導體的核心價值並未改變。對於定期定額的上班族而言，拉回反而是分批布局的好時機。", "question": "面對外資看好的AI長線題材，你有沒有耐受力在市場回檔時持續累積籌碼？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609280244.aspx", "name": "中央社"}]}], "robotics": [{"title": "人形機器人迎來快速增長，優必選拿下雙賽道市場份額全球第一", "teaser": "人形機器人市佔奪全球第一", "full": "隨著全球對自動化與智慧製造的需求激增，人形機器人產業迎來了爆發式的快速成長期。相關企業在特定賽道中脫穎而出，搶下全球市場份額第一的佳績，顯示商用落地正加速實現。", "think": "人形機器人不再只是科幻電影情節，而是實實在在正在發生的資本與技術競賽。這類硬體與AI軟體結合的產業，將是未來十年科技投資不可忽視的主流方向。", "question": "你覺得人形機器人最快會在哪一個日常工作領域全面取代人力？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiSEFVX3lxTE8xc1FZX0ROU3J6WDVCTjFiOHVPQXVlNTJ5ODZLa202UlY5WXp1bWx3Q0lxeUdUVVNIOXNzeVZwSXV5QWVDbEsxMg?oc=5", "name": "鉅亨號"}]}, {"title": "聯傑搭上機器人題材！營收年增30%，一顆網路晶片如何卡位具身AI？", "teaser": "台廠網路晶片卡位具身AI", "full": "國內 IC 設計公司聯傑成功搭上機器人題材熱潮，近期營收繳出年增30%的亮眼成績單。透過關鍵的網路晶片技術，該公司成功切入具身AI與智慧聯網的供應鏈體系。", "think": "台股的魅力就在於總能在龐大的國際科技趨勢中，找到利基型的零組件供應商。對投資人而言，與其去猜整機品牌的勝負，不如關注具備獨家技術的中小型供應鏈。", "question": "在龐大的機器人供應鏈中，台灣中小企業最難被取代的護城河是什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiT0FVX3lxTE5NNjg5b1dHc1lWeTVOQjBGeXBkVUd6UXhDRzd1T003WnM5Q3l2VmczUjhwb2xkTGlocWdGWXUzWWZETE9FVUtTamFvQmhtbTA?oc=5", "name": "news.cnyes.com"}]}, {"title": "盤前／AMD大戰輝達Jetson生態系 進補台股這3檔", "teaser": "晶片巨頭交戰台廠供應鏈受惠", "full": "隨著 AMD 與輝達在邊緣AI與機器人晶片生態系（如 Jetson）展開激烈競爭，相關的硬體需求水漲船高。這場巨頭之爭預期將為台股中特定的供應鏈夥伴帶來實質的訂單進補。", "think": "大廠打架、供應鏈吃香，這是科技產業不變的鐵律。當兩大巨頭為了搶佔市場而互相競爭時，台廠只要技術到位，就能成為最大的實質受益者。", "question": "當國際晶片大廠競爭白熱化時，身為投資人該如何挑選真正賺到錢的供應商？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiS0FVX3lxTFBsTEVRbVA5MUdOeWd1QzhicmszYUhOMVBfRWZ5Z2RXVHZINm80YUstYzcxY0I2eXE5S1ozZnE1cmVYaUlOV2tHNUI0Yw?oc=5", "name": "三立新聞"}]}, {"title": "11 秒完成 10 次後空翻，MIT 研發 AI 微型機器人速度狂飆 450%", "teaser": "MIT微型機器人速度大增", "full": "美國麻省理工學院（MIT）最新研發的 AI 微型機器人展現驚人性能，不僅能在短短 11 秒內完成 10 次後空翻，整體移動速度更是狂飆 450%，技術取得重大突破。", "think": "機器人的運動控制與靈活性正在以超乎想像的速度進化，這背後仰賴的是更先進的演算法與微型化工程。這種技術未來不論在搜救或工業檢測上都有極高的應用潛力。", "question": "當機器人的運動能力超越人類極限時，會為我們的社會帶來哪些新挑戰？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiWEFVX3lxTE9ROEZGV09jM3J5b1JZOFJwVUgxWmk2SmFvM0JjbXA0OW5IYzZKLXVacTdQX0RJRVdZRDhlOENFajVSM1JkSGtMOFdRWnNfSVpBektIY2d6NTA?oc=5", "name": "CMoney"}]}, {"title": "英童「情緒性拒學」可在家連線上課 機器人代替出席", "teaser": "英國推機器人代學童出席", "full": "針對英國部分有情緒性拒學或心理健康考量的兒童，當地學校開始導入遠端機器人代替學童「出席」教室。這讓孩子們能夠透過機器人的視訊與雙向互動，維持社交連結與學習進度。", "think": "科技的溫度往往展現在解決特定族群的痛點上，機器人不只用來工廠自動化，也能成為心理與教育支持的工具。這類創新應用的普及，將創造出全新類型的社會服務商機。", "question": "你會放心讓機器人代替真人去學校或特定場合幫你互動嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiYkFVX3lxTE5sZGYycXNHMmV4dEtubEFDRTVoYkxldjhLLXNfSEMwX2kzcUNrRWdsdVlBSDQ4WnQ2MUFNdndCdEp3LVU0SkFBQW9iZlVaUU1QR2k4VU1HYy1vMjNWVkRGN3FB0gFnQVVfeXFMUGNxelA0VThPcUdNNWZPQ2NaamxkeHgtMUducUZnczA5SzMwcDBDaThDZGtWYUVmYV9STFVXMVVHcFhRZk9INWpWZUhHVHBPbEM4RjNucFljcHFLaE1KVHJNOTd0bllkZw?oc=5", "name": "世界新聞網"}]}], "tech": [{"title": "OpenAI 首款自研 AI 推論晶片 Jalapeño 核心細節曝光", "teaser": "OpenAI首款自研晶片細節曝", "full": "人工智慧領頭羊 OpenAI 的首款自研 AI 推論晶片「Jalapeño」核心細節正式曝光。該晶片在設計過程中高度採用了 AI 輔助設計工具，藉此大幅縮短開發周期並重塑產業設計基準。", "think": "當軟體巨頭紛紛跨足硬體自研晶片，代表算力成本與供應鏈自主性已經成為生死關鍵。這也預示著半導體設計工具（EDA）與先進製程將迎來全新的需求形態。", "question": "科技巨頭紛紛投入自研晶片，傳統半導體廠該如何維持其競爭優勢？", "sources": [{"url": "https://technews.tw/2026/09/29/openai-jalapeno-ai-inference-chip-details/", "name": "科技新報"}]}, {"title": "核三再運轉計畫通過審查，台電啟動後續安全作業", "teaser": "核三延役審查通過啟動作業", "full": "備受關注的核三廠再運轉計畫已正式通過相關審查，台電隨即啟動後續的各項安全作業與評估。這項政策與電力供應的調整，將對國內未來的能源結構與產業用電帶來實質影響。", "think": "穩定且充足的電力是高科技製造業（尤其是半導體與AI資料中心）的生存命脈。能源政策的轉向不僅是政治議題，更是攸關台灣經濟命脈的關鍵基礎建設。", "question": "在追求AI算力的同時，我們該如何平衡綠能轉型與穩定的電力供應？", "sources": [{"url": "https://technews.tw/2026/09/29/third-nuclear-restart-approved-taipower-safety-operations/", "name": "科技新報"}]}, {"title": "深化與台積電合作外，魏哲家盼英特爾晶圓代工能成功因應市場需求", "teaser": "台積電董座談英特爾代工挑戰", "full": "台積電總裁魏哲家在深化雙方合作的同時，也公開表示期盼英特爾的晶圓代工業務能成功因應市場需求。這展現了龍頭企業的高度，也突顯出全球半導體供應鏈既競爭又合作的複雜態勢。", "think": "成熟的領導者懂得在競爭中看到合作的空間，半導體產業早已不是你死我活的零和遊戲，而是分工極細的生態系。觀察巨頭們的互動，能幫我們看清產業的大局。", "question": "當同業同時也是競爭對手時，企業該如何拿捏合作與防守的分際？", "sources": [{"url": "https://technews.tw/2026/09/29/intel-deepens-its-cooperation-with-tsmc/", "name": "科技新報"}]}, {"title": "OpenAI、Anthropic、微軟、Meta 研究領袖罕見聯手示警", "teaser": "AI巨頭罕見聯手發布示警", "full": "來自 OpenAI、Anthropic、微軟與 Meta 等頂尖 AI 巨頭的研究領袖罕見聯手發出公開警告，指出 AI 研究若過度自動化，恐將引發失控的「智慧爆炸」風險，呼籲業界正視安全防線。", "think": "當競賽對手願意坐下來一起對外示警，代表AI技術發展的潛在風險已經大到讓科技巨頭感到不安。對一般大眾而言，這提醒我們在享受科技便利的同時，法規與倫理監管刻不容緩。", "question": "如果 AI 的研發速度真的超越人類控制，我們該建立什麼樣的安全閥？", "sources": [{"url": "https://technews.tw/2026/09/29/top-ai-researchers-call-for-urgent-oversight-of-self-improving-systems/", "name": "科技新報"}]}, {"title": "耶魯大學抗老研究，減緩生物衰老靠自律", "teaser": "耶魯研究指減緩老化靠自律", "full": "根據耶魯大學最新發布的抗老研究指出，想要有效減緩生物學上的衰老速度，關鍵往往不在昂貴的藥物，而是在於長期的生活自律與良好的健康習慣。", "think": "在快節奏的通勤與工作壓力中，我們常常把「賺錢」擺在「健康」前面。但研究再次證明，維持自律與健康的生活型態，才是每個人最划算、報酬率最高的長期投資。", "question": "今天開始，你願意為了自己的長期健康做出哪一個微小而自律的改變？", "sources": [{"url": "https://technews.tw/2026/09/29/yale-study-reveals-key-to-anti-aging-self-discipline-beats-supplements/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-1300">{"date": "9月28日．週一", "tldr": "午安！今日台股受國際油價攀升與地緣政治牽動表現震盪，但半導體供應鏈如世界先進海外新廠落成及AI機器人應用則持續為市場注入亮點與成長動能。", "indicators": {"note": "美股四大指數科技股表現強勢帶動費半走揚，但台股盤中受國際油價與地緣政治干擾呈現小幅拉回整理格局。", "tiles": [{"label": "台股加權指數", "value": "48,024.60", "valueClass": "fall", "delta": "-0.28%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "27,068.72", "valueClass": "rise", "delta": "+0.48%", "deltaClass": "rise"}, {"label": "費半指數", "value": "12,668.93", "valueClass": "rise", "delta": "+1.41%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "450.61", "valueClass": "fall", "delta": "-0.12%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "川普拒絕伊朗停火提議　亞股收盤互有漲跌油價攀升", "teaser": "地緣政治牽動油價與亞股", "full": "美國前總統川普近期拒絕伊朗的停火提議，導致中東地緣政治緊張情勢再度升溫。受此影響，國際原油價格應聲攀升，連帶使得亞股在盤中與收盤時表現互有漲跌，投資人對能源成本上升的擔憂也隨之加劇。", "think": "國際政治紛擾往往是牽動全球金融市場的最外在變數。對上班族投資人來說，面對突發的地緣政治新聞無須過度恐慌，反而應藉此檢視自己持股的抗震能力與資產配置。", "question": "當國際局勢引發原油價格波動時，你的投資組合是否具備足夠的防禦性？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609280158.aspx", "name": "中央社"}]}, {"title": "原油價格上漲等因素牽連　印度股市暴跌", "teaser": "油價高漲重擊新興市場", "full": "受到國際原油價格持續上漲等多重經濟因素的牽連，印度股市近期出現了明顯的暴跌走勢。身為能源進口大國，油價飆升直接加重了印度的通膨壓力與貿易赤字，進而引發外資從當地市場撤離的骨牌效應。", "think": "新興市場股市往往對原物料價格的變動極度敏感。這提醒我們在追求高報酬的同時，必須隨時留意全球總體經濟的骨牌效應，避免將資金過度集中於單一高風險區域。", "question": "你有沒有注意到自己投資的海外基金或ETF，是否過度曝險於容易受原物料價格衝擊的國家？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202609280147.aspx", "name": "中央社"}]}, {"title": "油價上漲強化升息預期　金價重挫逾2%創近2個月低點", "teaser": "通膨壓力壓抑黃金表現", "full": "國際油價的攀升進一步強化了市場對於全球央行可能維持高利率或再度升息的預期。在資金成本可能走高的環境下，不具孳息特性的黃金吸引力大減，導致金價重挫超過2%，創下近兩個月以來的波段新低紀錄。", "think": "傳統上被視為避險抗通膨的黃金，在實質利率預期走高時也可能面臨修正。這顯示市場邏輯隨時在變，投資不能只靠刻板印象，必須跟著總經數據靈活調整。", "question": "當市場升息預期增溫時，你的避險資產配置是否也需要跟著做出動態調整？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202609280138.aspx", "name": "中央社"}]}, {"title": "油價和債券殖利率攀升　日股收黑", "teaser": "雙重壓力導致日股收黑", "full": "日本股市在盤中受到國際油價走高以及全球債券殖利率攀升的雙重夾擊，市場資金成本與企業營運壓力同步增加。多重利空匯聚之下，投資人信心受挫，終場使得日股黯然收黑，反映出市場對外部總     '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
