  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

tle": "特斯拉董事會力挺馬斯克續任，提請12月股東大會表決", "teaser": "特斯拉董事會續挺馬斯克", "full": "特斯拉董事會表態全面支持執行長馬斯克續任，並正式提案於12月股東會進行表決。儘管市場對其兼顧多家企業有雜音，但董事會強調馬斯克的願景對推動全自動駕駛與機器人計程車不可或缺。", "think": "馬斯克個人光環與特斯拉股價高度綁定。董事會的力挺有助於穩固內部軍心，但在轉型AI與自駕計程車的關鍵時刻，股東更在乎承諾能否兌現。", "question": "在掌舵多家巨頭的情況下，單一核心人物對企業究竟是最大資產還是經營風險？", "sources": [{"url": "https://technews.tw/2026/10/20/tesla-asks-shareholders-to-re-elect-musk-denholm-and-straubel-at-december-annual-meeting/", "name": "科技新報"}]}, {"title": "Toyota傳2028年推出純電Corolla，國民神車迎來純電轉型", "teaser": "神車Corolla傳純電化", "full": "日系龍頭豐田傳出正研發純電動版本Corolla，預計最快於2028年問世，象徵這款全球最暢銷國民神車將正式邁向純電時代。豐田計畫搭配次世代電池技術，在續航力與價格親民度之間取得平衡。", "think": "國民神車轉向純電，意味著電動車即將真正步入平價大眾市場。傳統車廠一旦發揮產能與造車工藝規模，將對造車新勢力帶來極大定價壓力。", "question": "當百萬級國民神車也轉為純電，大眾消費者換購電動車的最大顧慮解決了嗎？", "sources": [{"url": "https://technews.tw/2026/10/20/toyota-corolla-going-electric/", "name": "科技新報"}]}, {"title": "馬斯克宣布送SpaceX股票，計畫明年發給全美每位孩童1股", "teaser": "馬斯克豪語發童太空股票", "full": "特斯拉執行長馬斯克語出驚人，宣稱計畫明年向全美每位孩童贈送1股SpaceX股票，旨在激發下一代對太空探索的熱情。此舉引發市場熱烈討論，外界高度關注其法律可行性與背後的行銷意圖。", "think": "馬斯克擅長利用破天荒的公關手法創造話題，同時深化個人與太空產業的偶像符號。無論最終能否落實，這都成功再次將大眾目光聚焦於星際商業價值。", "question": "此類將私營未上市股票大眾化的話題操作，背後真實的商業或稅務考量為何？", "sources": [{"url": "https://finance.technews.tw/2026/10/20/elon-musk-vows-to-give-a-share-of-spacex-stock-to-every-us-child/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-1300">{"date": "10月19日．週一", "tldr": "受美科技股重挫拖累，台股盤中承壓震盪，外資大舉調節匯市走貶，但低接買盤逐步浮現，布局應回歸基本面。", "indicators": {"note": "美科技股與半導體重挫引發外資調節，台股盤中同步承壓，需觀察費半何時止跌築底。", "tiles": [{"label": "台股加權指數", "value": "46,822.08", "valueClass": "fall", "delta": "-0.61%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "26,140.03", "valueClass": "fall", "delta": "-2.14%", "deltaClass": "fall"}, {"label": "費半指數", "value": "11,137.29", "valueClass": "fall", "delta": "-3.83%", "deltaClass": "fall"}, {"label": "台積電ADR", "value": "412.61", "valueClass": "fall", "delta": "-2.28%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "台股跌勢收斂終場挫289點　法人：後市觀察費半動向", "teaser": "盤中跌勢收斂留意費半", "full": "受到美股科技股重挫影響，台股開盤承受沉重賣壓，盤中跌幅逐步收斂。法人指出，目前全球科技股正處於財報公布前的敏感期，短線波動加劇，台股走勢關鍵仍在於費城半導體指數能否止跌回穩。", "think": "面對美股震盪，台股展現一定韌性，不必過度恐慌殺跌。通勤族在操作上應先停看聽，等待國際半導體走勢明朗再做布局決策。", "question": "當國際科技股大幅修正時，你手上的核心持股是否具備足夠的下檔防禦力？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610190128.aspx", "name": "中央社"}]}, {"title": "三大法人賣超台股899.54億元", "teaser": "三大法人賣超近九百億", "full": "外資與三大法人今日在台股大舉提款，單日賣超金額逼近900億元，顯示國際地緣與美股財報前夕避險情緒高漲。主要權值股成為提款重心，市場整體成交量能同步放大，籌碼面短期面臨換手整理考驗。", "think": "法人大舉提款往往代表外圍資金正在去槓桿或避險，並非單一公司的基本面轉差。投資人可趁此觀察哪些個股在巨額賣壓下依然抗跌，往往是下一波領跑者。", "question": "外資大幅提款權值股時，你是否會順勢檢視整體部位的現金比例？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610190137.aspx", "name": "中央社"}]}, {"title": "新台幣重貶1.07角　收32.445元", "teaser": "新台幣重貶外資匯出", "full": "隨著台股走跌與外資大舉賣超，外匯市場資金持續外流，新台幣匯率盤中重挫超過1角，失守32.4元關卡。美元指數走強加上亞洲主要貨幣普遍疲軟，加深了台幣短線的貶值壓力。", "think": "台幣貶值短期對外資持股不利，但也提升了出口導向電子大廠的匯兌收益預期。一般上班族可留意以外銷為主的供應鏈受惠程度，並適度配置美元資產防禦。", "question": "面對匯率貶值趨勢，你的投資組合中有沒有能受惠於匯兌利益的出口型企業？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610190154.aspx", "name": "中央社"}]}, {"title": "美股延長交易吸走台股資金？金管會：關注後續影響", "teaser": "美股延長交易主管機關緊盯", "full": "針對美股交易所計畫大幅延長交易時間，市場擔憂可能瓜分台股早盤流動性，金管會表示將密切觀察對台股資金動能的實質影響。主管機關強調台股具備高殖利率與產業競爭力，將持續評估整體交易機制。", "think": "美股交易時間拉長讓全球散戶更易即時參與，但也意味著台股面臨更直接的資金競爭。對上班族而言，全球投資管道更便捷，跨國資產配置已成日常必備策略。", "question": "如果美股能全天候交易，你會把更多投資資金從台股轉移到海外市場嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610190149.aspx", "name": "中央社"}]}, {"title": "10月電子期金融期齊跌", "teaser": "期貨雙主流同步走跌", "full": "期貨市場盤中全面承壓，10月份電子期與金融期雙雙走低，反映市場在結算前夕對雙主流族群的避險情緒升溫。科技權值股疲軟壓抑電子期表現，金融股亦未能發揮撐盤作用，整體期現貨基差維持保守震盪。", "think": "電子與金融雙雙疲弱，說明今日盤面缺乏明確的多方護盤重心。在期貨率先反映市場情緒下，短線進出者應提防波動擴大的融資斷頭與洗盤風險。", "question": "當金融股與電子股同步轉弱時，你的應對方式是減碼觀望還是逢低分批布局？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610190124.aspx", "name": "中央社"}]}], "robotics": [{"title": "第一傳動登興櫃，深耕歐美農機、機器人立柱小量交貨", "teaser": "傳動元件切入機器人", "full": "專精於傳動機構的第一傳動登錄興櫃，除了穩健布局歐美智慧農機設備，其應用於機器人升降立柱的模組已開始小量交貨。公司預期在工業與機器人應用持續發酵下，明年工業應用相關營收比重有望進一步提高。", "think": "傳統精密製造業透過關鍵機構件切入機器人供應鏈，是台廠最擅長的升級路徑。投資人可多關注這類具備扎實製造利基、本業有支撐且享有新題材溢價的隱形冠軍。", "question": "在挑選機器人概念股時，你偏好純軟體AI廠商還是有實體硬體出貨的製造商？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiT0FVX3lxTE9jemZHWUhYa0wyNFMzWkVWNHNiX0xDUzh0cVpTOWFLckxES1dJNU42WEpKWjRxQktsb1YtNkp6YUJNRzJIZFFlZW1JYlFQN0E?oc=5", "name": "鉅亨網"}]}, {"title": "法奧機器人獲近10億元融資，聚焦協作機器人應用", "teaser": "協作機器人吸十億融資", "full": "中國協作機器人品牌法奧機器人宣布完成近10億元的新一輪融資，資金將全力投入產品研發與全球生態布局。隨著各行各業面臨缺工問題，兼具安全性、易操作與彈性部署特性的協作機器人正迎來商業化爆發期。", "think": "工業自動化正由大型封閉機具轉向人機協同，龐大資本的湧入加速了協作設備的普及。對於製造業從業人員來說，熟悉人機協同操作將是不可逆的職場技能轉型。", "question": "你所處的產業或工作現場，是否已經開始出現人機協同作業的場景？", "sources": [{"url": "https://news.google.com/rss/articles/CBMicEFVX3lxTE1xY0VjWk5vaXN4LVV6YUVnUm54c2RqaFBJcWJ5VUNTWGU4VDd6U2g2OVh5NzUzcmlnaWpVUUlTUzZaQnRLMDhyMk5pUzJOX3dfOU9uZks2WnZSTTh3NkJKb1ZEa2ZZSlRhb0VoX1FRdEM?oc=5", "name": "Investing.com 香港 - 股市報價& 財經新聞"}]}, {"title": "人力還是Token？清大機器人論壇探討實體AI人才需求", "teaser": "實體AI引爆新人才荒", "full": "清華大學舉辦機器人論壇，產學界聚焦於「實體AI」的崛起，探討當人工智慧從純文字運算跨入實體具身控制時的人才缺口。專家認為，未來能整合機械硬體工程、感知運算與大型模型落地的跨領域人才將極為搶手。", "think": "AI不再只是螢幕裡的生成工具，驅動機械手臂與移動車輛的具身智能才是下一階段主戰場。這提醒上班族，跨領域整合軟硬體的能力，將是未來十年最具含金量的職涯護城河。", "question": "面對AI走入實體硬體控制，你是否有計畫充實跨領域的技術或管理認知？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTFBwUVJWd1I0MHY2bUptOE   try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
