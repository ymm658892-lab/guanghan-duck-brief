  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

": "最新發布的金融建言白皮書聚焦五大主題，特別呼籲主管機關應加速研擬代理式AI的應用指引，並逐步推動穩定幣的相關應用。這顯示隨著新科技快速滲透，金融市場正積極尋求法規鬆綁與創新發展的平衡點。", "think": "金融與科技的結合是未來的必然趨勢，從AI指引到穩定幣的探討，都預示著未來上班族在理財與支付工具上將有更多元選擇。政策的開放往往能創造全新的產業藍海，值得投資人長期追蹤其法規落地進度。", "question": "你期待未來在日常理財或支付中，加入穩定幣或代理式AI的應用嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610270239.aspx", "name": "中央社"}]}, {"title": "和泰車：新車市場持穩第4季不錯　AI產業帶動高級車銷售", "teaser": "車市穩健結合AI熱潮", "full": "國內車市龍頭和泰車表示，國內新車市場整體表現持穩，對第四季的銷售展望維持不錯的看法。特別的是，受惠於近期AI產業蓬勃發展所帶動的財富效應，高端高級車款的銷售表現也隨之受惠，展現出不同以往的消費動能。", "think": "科技業的繁榮往往會外溢到高端消費市場，從高級車銷售的熱絡可以看出特定族群的荷包確實因為AI浪潮而膨脹。這也提醒我們，產業趨勢帶來的經濟效應會逐步擴散到內需與非科技類股。", "question": "你覺得科技產業帶動的財富效應，還會延伸到哪些國內的民生消費市場？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610270220.aspx", "name": "中央社"}]}], "robotics": [{"title": "通寶從列印晶片跨向機器人！高通技術打底 布局機器人小腦控制、ASIC新事業", "teaser": "晶片大廠跨足機器人小腦", "full": "通寶積極將原本在列印晶片的技術延伸，結合高通技術作為底層架構，正式跨入機器人領域並布局小腦控制與ASIC全新事業。此舉顯示出科技大廠正加速搶占人形與自動化機器人的核心控制商機，開闢全新的成長曲線。", "think": "機器人的核心不只是外表的外殼，關鍵的控制晶片與運算能力才是各大廠兵家必爭之地。對於關注科技趨勢的上班族來說，這類從既有強項切入AI硬體核心的企業，往往具備不錯的技術護城河。", "question": "當傳統晶片廠紛紛轉向機器人控制領域，你認為哪一類技術最容易勝出？", "sources": [{"url": "https://news.google.com/rss/articles/CBMie0FVX3lxTE9qaFZzUFY5M0RtaDRVSG5YcXVvem15aS0xd2RTalNjTzQ3OVgtVjJqOWU2Z0RHZ1c0T0VoUTdBSzNydU5wVmVRVlBJSG43X3REMkhXWDF6dkNGMVhOS1ZUTGFydHphNk03dUtIUk4wOTVjYzFEZHBzM1pCRQ?oc=5", "name": "財訊"}]}, {"title": "馬斯克：機器人的記憶體需求 將為地表最強", "teaser": "馬斯克看好記憶體需求", "full": "特斯拉執行長馬斯克公開表示，未來人形機器人對於記憶體的龐大需求，將會達到堪稱地表最強的等級。這項預測直接點名了機器人產業對上游半導體元件的重度依賴，為記憶體族群帶來了全新的想像空間與題材。", "think": "電動車之後，機器人被視為下一個吃掉大量電子零組件的巨獸，其中記憶體更是不可或缺的關鍵角色。這類來自產業領袖的前瞻言論，往往能成為市場資金追捧特定族群的重要催化劑。", "question": "你認同機器人會成為繼手機與電動車之後，下一波撐起記憶體需求的救世主嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiWkFVX3lxTFBhRVRqUUdnMkFDQjcxZEdUVFNwMmttTk1WRGpPdWpqLVFxclNXUHh4eUtwMkZ5SkhVYUJ4bU9adnR1eU8zY0dHMEowTnU1aHE1Ynk3VFdQYTJvZ9IBX0FVX3lxTE5CbEdsb1U4VWxZQUtWdGNqZVpOT0dUUXJlak9xSTE3SXV2dVY4QjBIRkZNcGtRaHlJcDEzM1loYW9keWhBdUV0UGcxZlo5TEZ0NmJpTUFXcWQzZmFRY2lN?oc=5", "name": "經濟日報"}]}, {"title": "人形機器人供應鏈發威！豐田砸64億美元擴張，自動化與先進封裝迎輪動", "teaser": "國際大廠重金砸向自動化", "full": "國際汽車巨頭豐田大舉投入64億美元擴張相關產能與技術，帶動人形機器人供應鏈再度發威。市場資金也因此在自動化設備與先進封裝等相關類股之間產生輪動，成為支撐盤面人氣的重要亮點。", "think": "當全球指標性車廠都願意砸下重本押注自動化與機器人，代表這絕對不是短期的炒作話題，而是長線的產業轉型。上班族在挑選相關概念股時，可以優先關注已經切入國際大廠供應鏈的實質受惠者。", "question": "面對國際大廠爭相砸重金投入機器人，你會如何評估供應鏈台廠的真實受惠程度？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiggFBVV95cUxNd2JxSG92T0lOam9GZ0ZTY19SNXl5a1VQRkZzZmVqb0ZnaUhac3F4Tl9xWFBtWGgwdHFtYUd6VmdidjNnSjBrV2RKQ1docnllblhiR3FLRHlOTUJkMEt3TXZLbEpBeWNlVWZzb2ZHX0xjNGx5VmdQMWYyUzdUZk1RcEhn?oc=5", "name": "CMoney投資網誌"}]}, {"title": "韓國金浦機場國際線啟用機器人代客停車，車交給機器人即可直接出境", "teaser": "機場導入機器人代客停車", "full": "南韓金浦機場的國際線航廈正式啟用機器人代客停車服務，旅客只要將車輛交給專屬機器人，便能直接前往辦理出境手續。這項應用不僅大幅提升了機場的停車效率，也讓自動化科技在實體場景的落地再添一例。", "think": "科技落實到日常生活的便利性往往最能直接感受，機場代客停車的自動化展示了機器人技術在狹窄空間精密操作的能力。這也讓我們看見，未來不需要等到完全人形機器人普及，功能型機器人就會先一步改變生活。", "question": "如果國內機場也推出機器人代客停車，你會放心把車鑰匙交給它嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiekFVX3lxTE1uaEtIOE1lNWh6NGt0TmF2WmxjRXlYM0xieGhyVHMxVl9WdXBJNkFyenU2V0RJdDVqak1RSU8tU04yb3pkR1BySWRBamtNT0pRN2JYYVFWZHVOZkhQTXZXUmhNQnZ1RmNkZFoxTV8yNDVyUzhaZzhYc0hR?oc=5", "name": "BigGo 財經"}]}, {"title": "機器人吃掉多少記憶體？馬斯克一句話引爆話題，3 大產業變化、2 檔記憶體股解析", "teaser": "解析機器人與記憶體關聯", "full": "隨著馬斯克對於機器人記憶體需求的言論引爆市場話題，法人與分析機構紛紛針對產業結構的3大變化以及相關的2檔記憶體個股進行深入解析。這反映出市場正在積極尋找AI實體化後，實際能受惠的零組件黑馬。", "think": "市場話題往往能迅速轉化為投資熱度，但投資人更需要透過專業解析去蕪存菁，找出真正有營收支撐的公司。在資訊爆炸的時代，學會過濾雜訊並鎖定核心供應商是必修的投資功課。", "question": "面對市場熱議的題材股，你通常會花多少時間研究其背後的真實財報數據？", "sources": [{"url": "https://news.google.com/rss/articles/CBMifkFVX3lxTE1LSzV0N0VoMXpmLUlJVks2NjhVb2xDRlFITEVkWjFaS0E0bWZfSzgwWlRBdXlsa01WWXF4OGcxWjQ5ei1zbFAzQTBLeHl5RE5yOGJsRGVyX1RudFlXNC1KSTZBdklIUjVDbFJpV2NWd1JhOEVQWmRhVURVWVRCdw?oc=5", "name": "CMoney投資網誌"}]}], "tech": [{"title": "半導體用電翻倍、電力需求攀升！台電啟動十年供電布局", "teaser": "半導體帶動龐大電力需求", "full": "隨著先進製程與AI晶片產能持續擴充，半導體產業的用電量面臨翻倍成長的壓力，電力需求急遽攀升。為了因應這項挑戰，台電正式啟動了長達十年的穩定供電布局與電網強韌計畫，以確保台灣科技命脈不缺電。", "think": "「缺電」一直是台灣發展高科技產業的最大隱憂之一，半導體用電量的暴增也帶動了重電與綠能相關產業的長線需求。這類國家級的基礎建設布局，背後往往隱藏著非常扎實且長達數年的產業紅利。", "question": "你認為台灣未來的綠能與重電產業，是否能順利跟上台積電等半導體擴廠的用電腳步？", "sources": [{"url": "https://technews.tw/2026/10/27/semiconductor-power-consumption-doubles-electricity-demand-soars-taipower-10-year-supply-plan/", "name": "科技新報"}]}, {"title": "吳敏求：旺宏章程明定 15% 員工分紅，業務鎖定太空、醫療與資料中心市場", "teaser": "旺宏鎖定高階利基市場", "full": "旺宏董事長吳敏求強調公司章程明定提撥15%作為員工分紅以留才，同時在業務策略上明確鎖定太空、醫療以及資料中心等高附加價值的利基型市場。透過避開殺戮戰場，轉向高門檻應用來確保公司的毛利率與競爭力。", "think": "在競爭激烈的半導體紅海中，能夠主動轉向太空與醫療等特殊利基市場的企業，通常具備較強的抗景氣循環能力。同時，願意祭出高比例員工分紅的企業，也比較能吸引並留住頂尖人才，對公司長遠發展絕對是加分項。", "question": "你會傾向投資毛利率高但規模較小的利基型科技廠，還是規模龐大但競爭激烈的代工廠？", "sources": [{"url": "https://finance.technews.tw/2026/10/27/macronixs-bylaws-stipulate-that-15-of-employee-profits-will-be-distributed/", "name": "科技新報"}]}, {"title": "800VDC 明後年樂觀？台達電、光寶科法說揭關鍵進度", "teaser": "電源大廠看好800VDC", "full": "針對資料中心與AI伺服器所需的800VDC高壓直流電技術，國內電源大廠台達電與光寶科在法說會中釋出樂觀的關鍵進度。隨著AI運算中心對電源轉換效率的要求越來越高，這項新技術有望在明後年迎來顯著的放量成長。", "think": "AI伺服器的耗電量驚人，如何有效散熱與提升電源轉換效率，成為各大廠技術競賽的勝負關鍵。電源供應大廠不只是賣硬體，更是解決AI吃電怪獸問題的核心功臣，後續的營收貢獻值得密切追蹤。", "question": "你覺得未來AI資料中心的省電技術，會不會成為各大廠拉開差距的護城河？", "sources": [{"url": "https://technews.tw/2026/10/27/800-vdc-outlook-optimistic-next-year-delta-electronics-liteon-technology-investor-conferences-key-progress/", "name": "科技新報"}]}, {"title": "旺宏第三季獲利創歷史單季新高，毛利率突破七成促 EPS 達 5.52 元", "teaser": "單季獲利創下歷史新高", "full": "旺宏公布最新第三季財報表現亮眼，單季獲利創下歷史新高紀錄，受惠於產品結構優化，毛利率成功突破七成大關，推升單季每股盈餘（EPS）達到5.52元。這項亮眼的成績單充分證明了其轉型策略的階段性成果。", "think": "高達七成的毛利率在科技製造業中相當罕見，這顯示出公司在特定高階市場具備極強的定價能力與議價優勢。當基本面交出如此出色的成績單時，往往能為股價提供最強而有力的基本面支撐。", "question": "看到單季EPS繳出亮眼數字時，你會直接進場，還是會先思考這是否為曇花一現的高峰？", "sources": [{"url": "https://finance.technews.tw/2026/10/27/macronixs-third-quarter-financial-report-hit-a-record-high/", "name": "科技新報"}]}, {"title": "餐飲缺工祭採購自動化！CocoMart 串聯 5,000 家餐飲填補 ERP 斷層", "teaser": "餐飲業靠採購自動化解缺工", "full": "面對嚴重的餐飲缺工與營運成本壓力，業界積極導入採購自動化方案，例如CocoMart成功串聯全台高達5,000家餐飲業者，有效填補了傳統系統與日常營運之間的ERP斷層，協助餐飲業數位轉型。", "think": "缺工問題不只出現在科技廠，連傳統的餐飲服務業也必須靠自動化與數位工具來解套。這類軟體服務或系統整合商雖然沒有半導體那般耀眼的光環，但能切中痛點的SaaS服務往往具備黏著度高、現金流穩定的優勢。", "question": "你觀察到身邊的餐飲小店，是否也越來越依賴各種自動化點餐或採購系統了呢？", "sources": [{"url": "https://finance.technews.tw/2026/10/27/erp-cocomart/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-2000">{"date": "10月26日．週一", "tldr": "美股與科技股表現強勁帶動夜盤氣氛，雖然台股今日震盪拉回，但Anthropic申請上市與Meta加碼AI支出，顯見全球AI產業熱潮依然十分強勁。", "indicators": {"note": "台股盤後拉回整理，但美股與費半表現強勁，台積電ADR上揚預示夜盤與明日台股開高氣氛。", "tiles": [{"label": "台股加權指數", "value": "46,041.43", "valueClass": "fall", "delta": "-1.81%", "deltaClass": "fall"}, {"label": "那斯達克", "value": "26,224.97", "valueClass": "rise", "delta": "+1.04%", "deltaClass": "rise"}, {"label": "費半指數", "value": "11,166.38", "valueClass": "rise", "delta": "+3.59%", "deltaClass": "rise"}, {"label": "台積電ADR", "value": "428.38", "valueClass": "rise", "delta": "+2.36%", "deltaClass": "rise"}]}, "modules": {"markets": [{"title": "國際油價小幅回落 歐洲股市收盤揚升", "teaser": "通膨壓力趨緩帶動歐股升檔", "full": "隨著國際原油價格小幅拉回，市場對通膨居高不下的擔憂有所減緩。歐洲主要股市在買盤湧入下收盤紛紛上揚，顯示出市場對於整體宏觀經濟韌性與企業獲利前景仍抱持樂觀態度。", "think": "原油價格下滑能有效減輕企業營運成本與通膨壓力。對投資人而言，能源市場趨穩往往是全球股市短期止跌回升的正面訊號。", "question": "當國際油價波動影響整體通膨時，你的投資組合是否具備抗通膨的資產配置？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610270003.aspx", "name": "中央社"}]}, {"title": "AI熱潮助攻 ASML今年對荷蘭經濟貢獻估達1.6%", "teaser": "半導體巨頭成國家經濟柱石", "full": "受惠於全球生成式AI爆發帶動的高端晶片需求，半導體設備龍頭ASML接單暢旺。最新評估指出，ASML今年對荷蘭國內生產毛額的貢獻率預估將達到1.6%，充分凸顯關鍵科技產業對單一國家經濟的巨大影響力。", "think": "科技巨頭已超越單一公司範疇，躍升為國家經濟的核心命脈。這提醒我們在進行全球資產配置時，應高度關注科技供應鏈關鍵節點的領頭羊。", "question": "你是否觀察過半導體與高端設備供應鏈在各國經濟中所扮演的關鍵角色？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202610260257.aspx", "name": "中央社"}]}, {"title": "蘋果新iPad mini首換OLED螢幕 售價2.29萬元起", "teaser": "小尺寸平板迎面板重大升級", "full": "蘋果公司正式推出了新款iPad mini，最大亮點在於首次採用了OLED面板，能提供更出色的對比度與色彩表現。產品定價自新台幣2.29萬元起，預期將帶動一波中小尺寸高端平板的換機潮與相關供應鏈拉貨。", "think": "蘋果逐步將產品線轉向OLED面板，將推動顯示器供應鏈的規格升級與產能消納。對於關心消費電子供應鏈的投資人來說，可密切觀察面板與組裝廠的後續動能。", "question": "面對消費電子產品規格提升與售價調整，你會因為螢幕升級而產生換機意願嗎？", "sources": [{"url": "https://www.cna.com.tw/news/ait/202610260248.aspx", "name": "中央社"}]}, {"title": "Anthropic公開IPO遞件 那斯達克上市股票代碼ANT", "teaser": "生成式AI巨頭邁向資本市場", "full": "知名AI獨角獸Anthropic已正式向美國證券交易委員會提交IPO申請，預計將於那斯達克交易所掛牌上市，股票代碼定為ANT。此舉標誌著頂級AI模型開發商正式跨入公開資本市場，為A <script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SLOT_LABELS = {'0730':'07:30 晨間','1300':'13:00 午間','2000':'20:00 晚間'};

function renderIndicators(ind) {
  document.getElementById('indicators-note').textContent = ind.note || '';
  var grid = document.getElementById('indicators-grid');
  grid.innerHTML = (ind.tiles || []).map(function(t) {
    return '<div class="indicator">' +
      '<div class="label">' + escapeHtml(t.label) + '</div>' +
      '<div class="value ' + (t.valueClass || '') + '">' + escapeHtml(t.value) + '</div>' +
      '<div class="delta ' + (t.deltaClass || '') + '">' + escapeHtml(t.delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderNewsItem(item) {
  var sources = (item.sources || []).map(function(s) {
    return '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>';
  }).join('・');
  return '<details class="news"><summary><div class="n-head">' +
    '<div class="n-title">' + escapeHtml(item.title) + '</div>' +
    '<div class="n-teaser">' + escapeHtml(item.teaser) + '</div>' +
    '</div>' + CHEVRON + '</summary>' +
    '<div class="n-body">' +
    '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
