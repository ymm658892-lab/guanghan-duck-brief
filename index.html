  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

布的企業財報，那才是決定第四季走勢的關鍵。", "question": "通膨降溫後，您認為接下來最值得關注的總體經濟指標是什麼？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610010011.aspx", "name": "中央社"}]}, {"title": "美國第2季GDP成長上修至2.2% 消費支出強勁推動經濟", "teaser": "美經濟強韌消費動能足", "full": "美國商務部將第二季國內生產毛額成長率上修至百分之二點二，主要受到強勁的個人消費支出帶動。這項數據化解了市場對於經濟衰退的疑慮，顯示美國經濟基本面依然相當穩健。", "think": "美國強勁的消費力是台灣出口科技產品的終端保證。只要美國不衰退，台股的電子外銷產業就能維持成長動能，這對台股下半年的營收表現是一劑強心針。", "question": "在美國經濟展現韌性的背景下，您會如何調整您的台美股資產配置比例？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202610010005.aspx", "name": "中央社"}]}], "robotics": [{"title": "Intel說明Core Ultra搭配OpenVINO實體AI自主機器人優勢", "teaser": "英特爾邊緣運算新突破", "full": "英特爾詳細說明了其最新處理器搭配OpenVINO實體AI框架的優勢，強調這套組合能大幅提升自主機器人的邊緣運算能力。這項技術能讓機器人在不依賴雲端的情況下，更快速地做出即時反應與決策。", "think": "邊緣運算（Edge AI）是機器人走入日常生活的關鍵。當晶片能在本地端處理複雜視覺與感測數據，機器人才能真正實現自主化，這將帶動下一波邊緣晶片的商機。", "question": "隨著邊緣AI晶片效能提升，您認為最快會被機器人取代的日常工作是什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiYkFVX3lxTE0tTkkwN0JlajFXTDlxdnN3RFctU2F2VzJKX3BmbE9CRDdOSDdSQ3hNUzMyOFFEaTRtazNHRmNQcE81Y0M3NG44VTJjSE96b3h5M2tGd0JPRklORXNoMnFXWFZB?oc=5", "name": "T客邦"}]}, {"title": "美軍相隔7年再設新司令部 統籌AI、無人機與機器人作戰", "teaser": "軍事科技化迎向新戰場", "full": "美國國防部宣布相隔七年首度成立全新司令部，專責統籌人工智慧、無人機與機器人等先進科技的作戰應用。此舉顯示美軍正加速將自動化與智能化技術導入現代化國防，以確保科技領先優勢。", "think": "國防軍工一直是頂尖科技的搖籃，軍事需求的爆發將加速機器人與AI技術的成熟，並逐漸外溢到民用市場。相關軍工科技與無人機概念股值得長期追蹤。", "question": "軍用機器人技術的快速發展，是否會加速民用服務型機器人的普及？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiZkFVX3lxTE5LUmwzUEJCdVdGT3lhYXRtYUh6alNVTUo3ejBEOFBmZ0FRZnd1Ry0zOGxDZ1J3OWV3WUZ2cWxhejhsMU9XSE9ncTRxMmYzcGRYTW05aU9jQngtTWM2VDFjcWE0c0w3Z9IBa0FVX3lxTE5Pa1kxaFNnMDNBMnFFbHhGSmxuVWd1cmVWYzA4c2NqMFQ0QzM3bl9ldVJBUnN3QVFtdnIwcXp3TFRvU1FVTTZ5ZlpyeTZrd2JfRFV6QkwyY3hXc2t0dV95Z1ZMd1ZuN0N2Nkhz?oc=5", "name": "自由時報"}]}, {"title": "AI下一棒浮現 創投專家看好推論與機器人躍新戰場", "teaser": "創投看好機器人新戰場", "full": "創投專家指出，隨著生成式AI的基礎建設逐漸完備，市場焦點將轉移到「推論」應用與「實體機器人」上。這些領域被視為AI產業的下一波爆發點，吸引了大量資金與頂尖人才投入研發。", "think": "過去兩年是AI基礎建設（算力）的天下，接下來則是應用的時代。機器人作為AI的最佳實體載體，其軟硬體整合能力將是未來新創企業勝出的關鍵。", "question": "當AI發展從「算力競賽」轉向「實體應用」，您會調整您的科技股投資策略嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiTEFVX3lxTE5Lb0xDeTJOY3FTaUVmU3I5Um9XNEN1N3ZMbWxablh5eEViSkVwbHI4ek5HT3R1SjcxdUhfNm9ScWJ6TWpZdWlqVk02T3c?oc=5", "name": "聚財網"}]}, {"title": "大陸人形機器人出貨占全球逾9成 智元出貨量超越宇樹", "teaser": "中國人形機器人出貨爆發", "full": "根據最新產業報告，中國在人形機器人出貨量上已佔全球九成以上，其中新創公司智元上半年的出貨表現更超越了傳統強手宇樹。這顯示中國在供應鏈完整度與量產成本上，已取得極大的競爭優勢。", "think": "雖然高階晶片受限，但中國憑藉強大的製造供應鏈，在機器人硬體量產上展現驚人速度。這提醒投資人，機器人硬體降本的速度可能比想像中更快，有利於商業化普及。", "question": "面對中國在機器人硬體製造的低成本優勢，台廠該如何發揮系統整合的價值？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTFBOMDgyNVN6MU03QXFMdW1yMVg3TDVfbVJtcVlHcU5PUEJ0LXRuMElHa1Q2a2M2NTdQVzNwb3RaNWxIdV9XTUhzQ3ZwUm85T2RQTVE?oc=5", "name": "n.yam.com"}]}, {"title": "美防長啟動子午線計畫！鎖定AI與機器人技術", "teaser": "子午線計畫引爆軍工科技", "full": "美國國防部長正式啟動「子午線計畫」，旨在加速將人工智慧與機器人技術整合至國家安全體系中。此計畫預期將帶動大量政府採購合約，為相關軍工科技與自動化設備業者注入強勁成長動能。", "think": "政府政策與國防預算的直接挹注，是科技產業最穩固的護城河。這類國家級計畫通常合約期長、利潤穩定，相關受惠的供應鏈廠商將迎來長線利多。", "question": "在政策紅利推動下，您是否會考慮將軍工科技或政府標案概念股納入配置？", "sources": [{"url": "https://news.google.com/rss/articles/CBMikAFBVV95cUxPRWhsZFhoaUdFZUFENE1Xc01IN3Rkd3dOMVB5djNpWlNJUDllSHBPM29XUXJ3M0Y1NWxkLXI0UXdzUTBYLVlwbUh0SW0tODByMldHSmU0aTM3YkNGWlh4TG9scVI4UnRUdGdQNkpVSXA5T3dzS2dLQ3lVYWI1cGFWVDY4MU9lSDBxSmIxUHEwLWw?oc=5", "name": "CMoney投資網誌"}]}], "tech": [{"title": "台積 2 奈米良率甩三星／Intel？先進製程滿到 2028", "teaser": "台積先進製程訂單爆滿", "full": "市場消息指出，台積電在二奈米先進製程的良率上持續領先競爭對手三星與英特爾，訂單能見度已一路看好排到二零二八年。這項領先優勢確保了台積電在未來數年內，仍將獨佔全球高階晶片代工市場。", "think": "技術領先就是硬實力，台積電在先進製程的絕對壟斷地位，讓其具備強大的定價權。對於長期投資人而言，這無疑是最令人安心的資產。", "question": "面對台積電無人能及的製程領先，您認為競爭對手還有翻盤的機會嗎？", "sources": [{"url": "https://technews.tw/2026/10/01/piper-says-tsmc-capacity-sold-out-through-2028-on-strong-ai-demand/", "name": "科技新報"}]}, {"title": "三星 Galaxy S27 系列傳迎來有感漲價，大容量版本價差恐再拉大", "teaser": "旗艦手機恐迎來漲價潮", "full": "供應鏈傳出三星下一代旗艦手機Galaxy S27系列將因關鍵零組件成本上升而面臨有感漲價，特別是大容量版本的價差可能會進一步拉大。這反映出高階晶片與記憶體價格居高不下對消費電子的衝擊。", "think": "科技新品漲價已成趨勢，這也考驗消費者的荷包。對投資人來說，這代表上游零組件廠商（如台積電、記憶體大廠）成功轉嫁成本，其獲利能力依然穩健。", "question": "面對不斷上漲的旗艦手機價格，您會選擇延長手機使用壽命還是照樣買單？", "sources": [{"url": "https://technews.tw/2026/10/01/samsung-s27-series-price-increase/", "name": "科技新報"}]}, {"title": "「HomePad」傳 10/13 亮相，將復刻 iMac G4 經典設計", "teaser": "蘋果復古風新品將登場", "full": "蘋果傳出將於十月中旬發表全新智慧家居裝置「HomePad」，外觀設計將向經典的iMac G4致敬，採用復古的半球形底座與可調角度螢幕。這款產品被視為蘋果搶攻智慧家庭生態系的重要武器。", "think": "蘋果將經典設計與現代智慧家居結合，展現出其獨特的工業設計美學。這不僅能吸引老果粉的懷舊情懷，也為沉寂已久的智慧家居市場注入新活力。", "question": "蘋果的復古風智慧家居新品，會激起您將家中設備全面智慧化的慾望嗎？", "sources": [{"url": "https://technews.tw/2026/10/01/homepad-apple-event/", "name": "科技新報"}]}, {"title": "路透：麥當勞推 AI 定價工具，曾建議大麥克套餐賣 570 元", "teaser": "AI定價考驗消費者荷包", "full": "根據外媒報導，連鎖速食龍頭麥當勞正嘗試導入人工智慧定價工具，該系統曾根據市場供需與成本大膽建議將大麥克套餐定價調升至台幣五百七十元。這項嘗試引發了市場對於AI動態定價是否合理的討論。", "think": "AI動態定價雖然能幫企業追求利潤最大化，但若過度偏離消費者認知，可能會引發公關危機。這顯示AI在應用於民生消費時，仍需考量人性與社會觀感。", "question": "如果速食店全面採用AI動態定價，您會因為離峰時段便宜而改變用餐習慣嗎？", "sources": [{"url": "https://technews.tw/2026/10/01/inside-mcdonalds-push-to-have-ai-price-your-big-mac/", "name": "科技新報"}]}, {"title": "牧德訂單能見度達 1 年，2027 年 AI 營收占比上看 9 成", "teaser": "牧德受惠AI設備需求旺", "full": "光學檢測設備大廠牧德科技表示，受惠於半導體客戶對AI相關設備的強勁需求，目前訂單能見度已長達一年。公司更樂觀預估，到了二零二七年，AI相關業務的營收占比有機會一舉衝上九成。", "think": "AI浪潮不僅利多晶片廠，周邊的檢測、封裝設備廠也同樣吃香。牧德的亮眼展望，印證了AI資本支出正實質轉化為設備台廠的營收，是具體的業績支撐。", "question": "在尋找AI投資標的時，您是否會將目光從晶片大廠移向這些默默賺錢的設備供應商？", "sources": [{"url": "https://technews.tw/2026/10/01/motech-order-visibility-1-year-ai-revenue-90-percent-2027/", "name": "科技新報"}]}]}}</script>
<script type="application/json" id="slot-1300">{"date": "10月1日．週四", "tldr": "午安鴨！台股盤中展現強韌走勢，AI軍備競賽與科技股帶動景氣回溫，全球債市與科技動態同步牽動投資人的中午休息心情。", "indicators": {"note": "四大指標在午盤展現高檔震盪格局，台股加權指數延續強勢勁揚，費半與台積電ADR則在美股高檔區間進行短暫的類股健康調節。", "tiles": [{"label": "台股加權指數", "value": "48,353.49", "valueClass": "rise", "delta": "+1.51%", "deltaClass": "rise"}, {"label": "那斯達克", "value": "26,861.06", "valueClass": "rise", "delta": "+0.24%", "deltaClass": "rise"}, {"label": "費半指數", "value": "12,628.62", "valueClass": "fall", "delta": "-0.00%", "deltaClass": "fall"}, {"label": "台積電ADR", "value": "456.19", "valueClass": "fall", "delta": "-0.16%", "deltaClass": "fall"}]}, "modules": {"markets": [{"title": "台股創高新台幣貶幅收斂　尾盤翻升收31.842元", "teaser": "台股指數創高，匯市同步翻升", "full": "在台股頻創新高的帶動下，匯市也出現明顯變化。原本偏弱的新台幣在盤中貶幅逐漸收斂，午後甚至一度翻升，顯示外資與出口商資金在盤中各有交錯拉鋸。", "think": "匯市與股市往往具有高度連動性，新台幣回穩代表資金並未大規模匯出。對上班族投資人來說，這有助於維持市場信心，降低外資熱錢亂竄帶來的系統性風險。", "question": "當台股創高而匯市同步翻升時，你認為外資對台股的下一步動作會是什麼？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610010314.aspx", "name": "中央社"}]}, {"title": "9月PMI創逾5年新高　專家：AI軍備競賽支撐景氣", "teaser": "PMI創五年新高，AI成最強支柱", "full": "最新公布的9月份採購經理人指數（PMI）創下超過五年來的新高紀錄。專家指出，這波景氣擴張主要受惠於全球持續延燒的AI軍備競賽，帶動相關產業鏈的強勁拉貨動能。", "think": "總體經濟數據轉強，直接反映在實質產業的訂單上。上班族在關注股市之餘，也可以從中看出哪些產業正享有結構性的成長紅利，作為長期布局的參考方向。", "question": "面對AI軍備競賽帶動的景氣擴張，你的投資組合是否也搭上了這班順風車？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610010292.aspx", "name": "中央社"}]}, {"title": "亞股走勢不一　美光財報利多帶動科技股走高", "teaser": "美光財報報喜，亞股科技股走高", "full": "今日亞洲股市表現呈現分歧，不過受惠於記憶體大廠美光釋出優於預期的財報利多，激勵了相關科技類股在盤中的走高表現。這也為台股的電子族群注入了一劑強心針。", "think": "國際大廠的財報往往是科技產業的領先指標。當記憶體或特定晶片傳出好消息，代表終端需求正在復甦，也提醒我們隨時留意供應鏈的上下游連動關係。", "question": "國際大廠的單一財報利多，會如何影響你對整體半導體產業短期走勢的判斷？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610010285.aspx", "name": "中央社"}]}, {"title": "AI擴大應用金融市場　韓專家示警資金過度集中風險", "teaser": "AI應用擴大，專家示警資金集中", "full": "隨著人工智慧在金融市場的應用日益廣泛，南韓專家近期提出警告，指出過度依賴AI相關題材可能導致市場資金過度集中。這種現象一旦遇到波動，容易放大市場的風險。", "think": "投資最怕「把雞蛋放在同一個籃子裡」。當市場一面倒追逐熱門題材時，一般散戶更需要保持冷靜，檢視自己的資產配置是否過度集中單一產業。", "question": "當市場熱錢全面湧向AI相關題材時，你如何平衡追求報酬與分散風險的比重？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610010268.aspx", "name": "中央社"}]}, {"title": "全球公債遭拋售　10年期美債殖利率創24年新高", "teaser": "美債遭拋售，殖利率創24年新高", "full": "全球公債市場近期面臨明顯的拋售壓力，其中10年期美國公債殖利率更創下24年來的新高紀錄。這反映出市場對於資金成本與總體經濟走向的最新預期正在調整。", "think": "債券殖利率攀高會直接影響資金的定價與風險偏好。對於一般投資人而言，債市的劇烈波動提醒我們，除了股票之外，無風險利率的變化也需要列入資產配置的考量。", "question": "面對創下多年新高的債券殖利率，你的資產配置會不會想要調高固定收益的比例？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202610010267.aspx", "name": "中央社"}]}], "robotics": [{"title": "美軍隔7年再推新司令部　掌管AI、無人機、機器人部署", "teaser": "美軍設新司令部，統籌AI與機器人", "full": "美國軍方睽違七年再度成立全新司令部，主要任務為統籌與掌管人工智慧、無人機以及各類機器人的實際戰術部署。這顯示出無人化與智慧化科技在國防戰略中的地位正急遽上升。", "think": "軍事科技往往是民間商業應用的先驅，許多自動化技術未來都會轉移到民生產業。這類發展不僅改變地緣政治，也預示著未來機器人供應鏈的龐大潛力。", "question": "國防需求的升級會如何加速自動化與機器人技術的商業化落地？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiWEFVX3lxTE8xdFFWTHFUdEx5ZUR5cmVwWjZja05feENoclFiclU0OVplZFNTVElqN3NvcWg5ZWxoQkEtVkxBODRFVXNDdENKWFhWOEt3QktSbXZEWGs5Nm7SAV5BVV95cUxQM2dKY29PaVBFMVVsUDhGRTlVZ0tTaWR2Q3lZcHY4dml6UjNBTFluWG9MNTBfUXdPY2ZRN1JyVk8tVGUwX2Y5c24yM1A2bXZfWktzX1NXWXVrRU5jZlFR?oc=5", "name": "鏡新聞"}]}, {"title": "全國農業機器人競賽登場 屏科大秀智慧農業創新能量", "teaser": "農業機器人競賽，展現智慧農業能量", "full": "全國農業機器人競賽於今日盛大登場，各校菁英齊聚一堂展現最新研發成果，其中屏科大更展現了深厚的智慧農業創新能量。這項活動凸顯了自動化技術正深入傳統農漁業，解決勞動力短缺問題。", "think": "缺工問題不只存在於科技業與製造業，農業更是首當其衝。透過機器人技術的導入，不僅能提升生產效率，也為傳統產業帶來全新的轉型契機與投資想像空間。", "question": "如果傳統農業全面導入機器人與自動化，你覺得下一個被翻轉的傳統產業會是什麼？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTE0wdzBpMktfVlpVdm9ObFVFamd6b2xBakR2R0lLcjZScTBic3JsblM3cDVpY21lcjBTM3dWc2tRZlFrTVRYMmdpTjdEYXd3SnhlM3c?oc=5", "name": "中華新聞雲"}]}, {"title": "福特執行長表示，人工智慧正接手試算表工作 但修理機器人仍需要人類", "teaser": "AI接手試算表，修理機器人仍靠人", "full": "汽車巨頭福特執行長公開表示，隨著人工智慧快速發展，許多繁複的試算表與文書工作正逐漸被AI取代；然而在產線端，維護與修理機器人依然高度依賴人類的專業技術與雙手。", "think": "這給了職場工作者很好的啟發，單純的行政計算與資料整理正快速被科技取代，但具備實作、除錯與應變能力的人才，其獨特性與價值反而更加凸顯。", "question": "面對AI與機器人的普及，你的職場技能中有哪些是無法輕易被取代的？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE0tSUNTWVlWbmktamhub2U1NEpiRVh0WmNJRXM1X0pJdUt2NTZxMGRkcEI4STVQTVFMMERaQkcyVzF1NjJTcTYwNzN4OFNEYXkxVmcyUHV3?oc=5", "name": "Business Insider Taiwan"}]}, {"title": "全球工業機器人突破500萬台，關節導體耐久性成關鍵", "teaser": "全球工業機器人破五百萬台", "full": "全球工業機器人的累計運作數量正式突破500萬台大關，隨著應用規模擴大，機器人關節與導體的耐用度與穩定性，成了各大製造商能否勝出的關鍵技術指標。", "think": "機器人數量大增代表硬體零組件的消耗與升級需求同步放大。對投資人來說，比起組裝廠，掌握上游關鍵零組件與耐磨導體技術的公司，往往具備更高的護城河。", "question": "當工業機器人數量破千萬台在即，供應鏈中最賺錢的會是哪些關鍵零組件廠？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTE8yV3lNT3NoR1VmTl9QT3VPZHl1N1Z4T1J2cnAzOVZveHlpbUZBc0xwb0I2d3lqZXZ6c2VWVTVJZzRBRmExOHVoTUhQdkxGbkdJMEE?oc=5", "name": "蕃新聞"}]}, {"title": "Figure 讓退役機器人自己跳進熔爐，史瓦辛格一句話促成", "teaser": "Figure退役機器人自行銷毀", "full": "人形機器人新創公司 Figure 近期展示了一項獨特的運作方式，讓退役的機器人能夠自主跳進熔爐進行回收，據傳這項概念背後還有一段由知名影星阿諾史瓦辛格一句話促成的趣事。", "think": "這類新聞雖然帶有科幻色彩，但背後反映的是高科技硬體生命週期結束後的回收與循環經濟問題。當未來路上都是機器人時，如何環保地處理它們將成為一門新生意。", "question": "想像一下，當你家裡的智慧機器人「退休」時，你希望它用什麼方式退場？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiZkFVX3lxTE0yWUFoSEt4MDFXMXMycTFVcXRlMjl3b1JVWktONlgzMHYzTlJfYXBJOVJPT3NNQUVqdG4tSkVJREgyMmljSVcwT3d1cGtxXzc5M0ZMLU5EbV9jaXJXc0gtVjBVeXJldw?oc=5", "name": "鏈新聞 ABMedia"}]}], "tech": [{"title": "Snapdragon 高峰會重點在哪？代理 AI 全布局，高通已準備搶攻個人 AI 入口", "teaser": "高通 Snapdragon 高峰會布局代理AI", "full": "高通年度 Snapdragon 高峰會即將展開，市場焦點全數鎖定在其「代理 AI」的全方位布局上。高通正試圖透過軟硬體整合，搶先卡位成為未來消費者進入個人 AI 世界的主要入口。", "think": "個人 AI 的入口之爭已經從雲端延伸到終端裝置。對消費者而言，這意味著我們手中的手機與筆電將變得更聰明；對產業來說，晶片商與軟體商的競合將更加白熱化。", "question": "你期待未來的個人手機或電腦具備哪一種專屬的 AI 代理功能？", "sources": [{"url": "https://technews.tw/2026/10/01/qualcomm-2026-snapdragon-summit/", "name": "科技新報"}]}, {"title": "科學園區審議會通過 13 件投資案，南亞科將進駐南科屏東園區", "teaser": "科管局通過13案，南亞科進駐屏東", "full": "最新一期科學園區審議會順利通過了多達13件投資案，其中記憶體大廠南亞科確定將進駐南科屏東園區。這項投資案預期將為南部科技廊帶再添動能，帶動區域產業升級。", "think": "大廠擴廠與園區投資是觀察台灣實體經濟擴張的重要風向球。土地與廠房需求的增加，也間接反映出企業對未來中長期景氣的樂觀態度。", "question": "科技大廠持續在台灣南北擴廠，對上班族的職涯選擇與區域發展帶來了什麼轉變？", "sources": [{"url": "https://finance.technews.tw/2026/10/01/nanya-in-stsp/", "name": "科技新報"}]}, {"title": "AI 教父駁斥末日論，楊立昆痛批 OpenAI、Anthropic 散播恐懼", "teaser": "AI教父楊立昆痛批同業散播恐懼", "full": "被譽為 AI 教父之一的學者楊立昆（Yann LeCun）再度公開駁斥人工智慧的末日論調，甚至直接痛批 OpenAI 與 Anthropic 等企業刻意散播恐懼，藉此來鞏固自身的市場利益。", "think": "科技巨頭之間的路線之爭往往伴隨輿論戰。身為一般使用者與投資人，我們需要學習在「過度恐慌」與「盲目樂觀」之間找到平衡，理性看待技術發展的真實進程。", "question": "你覺得科技巨頭們在 AI 安全議題上的爭辯，是在保護大眾還是商業利益？", "sources": [{"url": "https://technews.tw/2026/10/01/yann-lecun-slams-ai-doomsday-theories/", "name": "科技新報"}]}, {"title": "Arm 機櫃級伺服器已超越 x86，Arm 攜手 NVIDIA 搶代理 AI 商機", "teaser": "Arm機櫃級伺服器超越x86", "full": "市場傳出最新產業動態，Arm 架構的機櫃級伺服器在效能與市佔上已逐漸超越傳統的 x86 架構。同時，Arm 也正式宣布攜手 NVIDIA，準備大舉搶攻接下來的代理 AI 龐大商機。", "think": "伺服器架構的世代交替正在加速發生。這種底層運算架構的轉移，會重新洗牌晶片設計與硬體代工的版圖，是科技投資人絕對不能忽略的宏觀趨勢。", "question": "當 Arm 架構在伺服器領域超越傳統 x86 時，哪些台灣供應鏈會是最大受惠者？", "sources": [{"url": "https://technews.tw/2026/10/01/arm-talk-about-agentic-ai/", "name": "科技新報"}]}, {"title": "2025 年全球跨國投資金額年增 2.2% 達 1.3 兆美元，台積電站上第一名寶座", "teaser": "全球跨國投資成長，台積電登頂", "full": "最新研究報告指出，2025年全球跨國投資金額預估將微幅成長至1.3兆美元，其中台灣的護國神山台積電更在多項評比中脫穎而出，正式站上全球跨國投資指標的第一名寶座。", "think": "台灣企業能站上全球跨國投資的頂峰，不僅是企業自身的成就，也彰顯了台灣在全球半導體供應鏈中不可動搖的核心地位，讓台灣投資人在國際舞台上更有底氣。", "question": "台積電站上全球跨國投資第一名，對台灣整體的國際能見度與經濟安全有何意義？", "sources": [{"url": "https://finance.technews.tw/2026/10/01/global-cross-border-investment-is-projected-to-grow-by-2-2-annually-to-reach-us1-3-trillion-by-2025/", "name": "科技新報"}]}]}}</script>

": "身為通勤族，網路是不可或缺的生存工具。電信業開始落實流量管理，提醒我們在享受「吃到飽」的同時，也要注意合理使用規範，這或許會是未來資費結構改變的起點。", "question": "你認為電信公司限制超高流量用戶，對於維護整體網路品質是否合理？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610010351.aspx", "name": "中央社"}]}, {"title": "歐盟柴油價格創歷史新高，中東衝突衝擊燃料供應", "teaser": "能源危機恐再度推升通膨", "full": "受到中東地區局勢動盪與衝突升溫影響，國際燃料供應面臨挑戰，導致歐盟柴油價格每公升突破新高。能源價格的飆升不僅增加運輸成本，也讓市場擔憂通膨壓力可能再度死灰復燃，影響各國央行的降息決策。", "think": "油價與通膨息息相關，一旦通膨復燃，各國央行可能延後降息，這會直接壓抑股市估值。投資人應密切關注中東局勢對能源市場的衝擊，並適度配置避險資產。", "question": "面對可能因地緣衝突再度引發的通膨壓力，你準備好調整你的避險資產配置了嗎？", "sources": [{"url": "https://www.cna.com.tw/news/aopl/202610010347.aspx", "name": "中央社"}]}], "robotics": [{"title": "美光看好人形機器人成為記憶體下一個成長引擎", "teaser": "機器人也要超大記憶體", "full": "記憶體大廠美光在AI資料中心獲利創佳績後，預告未來人形機器人的普及將需要搭載更龐大的記憶體容量。這意味著機器人產業的爆發，將成為繼智慧型手機與伺服器後，記憶體市場的全新爆發性需求來源。", "think": "機器人不僅是硬體組裝，其背後帶動的半導體與記憶體升級才是台廠的真正商機。投資記憶體相關族群時，除了看PC與手機，機器人的長線需求更值得提早佈局。", "question": "當人形機器人成為下一個科技硬體戰場，你認為台灣哪些供應鏈最先受惠？", "sources": [{"url": "https://news.google.com/rss/articles/CBMilwFBVV95cUxPYXJTcklnZ0FOaWo3aVZCWmF3bW5ZZUZkTTJ2d1NfTExKbkVCX3F6ak9haVJtZEwyRndKc3h3ZzAtMnphUzZ0T2xBSXRiR1Z4T2ZfUktvdzFIUnB1eDlINnE4QWY0Z1d0SnRQb01TOUxWcU5fcmlqZ25wdmpLdDUwenZwaFlQTXZtekZDZmU2YmZoa0N4MFNN?oc=5", "name": "DIGITIMES"}]}, {"title": "僧侶與機器人，探討科技與心靈的共生關係", "teaser": "當科技遇上心靈的對話", "full": "本週好書推薦《僧侶與機器人》，透過文學視角探討在高度科技化的未來，人類心靈與機器人之間的共生與衝突。這本書引導讀者思考在AI與自動化普及的時代，什麼才是人類獨特且無法被機器取代的價值。", "think": "下班後的通勤時間，除了看盤，也適合沉澱心靈。這本書提醒我們，在追求科技進步與投資獲利的同時，如何保持內心的平靜與人性的溫度，是現代人最重要的課題。", "question": "在高度自動化的未來，你認為人類有哪些特質是機器人永遠無法取代的？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiYkFVX3lxTFBpcXFIbDg0bVJ2N3RuZzNRTk51Z0lSd0RlcEM4MXRWUFBQeFk3dHNINVA4X2RNUUdFMTItWTVwNS1oOFVQT2VRZmdaLVNqdXpTeXMxazZLRmpINXg1YTYxbS1R?oc=5", "name": "中央社 CNA"}]}, {"title": "特斯拉空頭撤退，AI與機器人敘事持續升溫", "teaser": "不要做空馬斯克成暗語", "full": "隨著特斯拉在人工智慧與機器人領域的布局逐漸明朗，華爾街空頭紛紛撤退，持有評級大幅飆升。市場對於特斯拉已不再僅視為純電動車廠，而是將其定位為頂尖的AI與機器人科技巨頭，帶動估值重新想像。", "think": "投資大師常說不要低估創新者。特斯拉的轉型告訴我們，買股票買的是未來的想像空間與科技落地能力，單純用傳統汽車估值看待新科技，容易錯失波段行情。", "question": "你認     '<p class="n-full">' + escapeHtml(item.full) + '</p>' +
    '<div class="n-block"><p class="n-label">延伸思考</p><p>' + escapeHtml(item.think) + '</p></div>' +
    '<div class="n-block"><p class="n-label">思考題</p><p>' + escapeHtml(item.question) + '</p></div>' +
    '<p class="n-source">來源：' + sources + '</p>' +
    '</div></details>';
}

function renderModule(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(renderNewsItem).join('');
}

function renderEmpty(slot) {
  document.getElementById('tldr-text').textContent = SLOT_LABELS[slot] + '還沒有更新過，等下一次自動更新後就會有內容。';
  document.getElementById('indicators-note').textContent = '';
  document.getElementById('indicators-grid').innerHTML = '';
  ['news-markets','news-robotics','news-tech'].forEach(function(id) {
    document.getElementById(id).innerHTML = '<p class="empty-state">這個時段還沒有內容。</p>';
  });
}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
