  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1217;
      --surface: #1A2029;
      --surface-hover: #1F2631;
      --ink: #EDEFF2;
      --muted: #A2ABB8;
      --faint: #6B7482;
      --line: #2A323D;
      --accent: #F0803D;
      --accent-soft: #3D2A1C;
      --lane-markets: #F0803D;
      --lane-robotics: #3FC3B5;
      --lane-tech: #A585E8;
      --up: #3FBE84;
      --down: #E8695F;
      --rise: #E8695F;
      --fall: #3FBE84;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1217;
    --surface: #1A2029;
    --surface-hover: #1F2631;
    --ink: #EDEFF2;
    --muted: #A2ABB8;
    --faint: #6B7482;
    --line: #2A323D;
    --accent: #F0803D;
    --accent-soft: #3D2A1C;
    --lane-markets: #F0803D;
    --lane-robotics: #3FC3B5;
    --lane-tech: #A585E8;
    --up: #3FBE84;
    --down: #E8695F;
    --rise: #E8695F;
    --fall: #3FBE84;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --surface-hover: #F6F7FA;
    --ink: #14181F;
    --muted: #545E6D;
    --faint: #838DA0;
    --line: #E0E3E9;
    --accent: #E2621F;
    --accent-soft: #FBE3D3;
    --lane-markets: #C7551C;
    --lane-robotics: #1E7A72;
    --lane-tech: #6E4CB8;
    --up: #1E8E5A;
    --down: #C4453D;
    --rise: #C4453D;
    --fall: #1E8E5A;
    --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .masthead-label {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .masthead-date {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .masthead-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
  }

  .masthead-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 5px;
    vertical-align: middle;
  }

  .tldr {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--ink);
  }

  .tldr .tag {
    flex: none;
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
    padding-top: 1px;
  }

  section.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--lane);
    border-radius: 10px 14px 14px 10px;
    padding: 16px 18px 6px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  section.module.markets { --lane: var(--lane-markets); }
  section.module.robotics { --lane: var(--lane-robotics); }
  section.module.tech { --lane: var(--lane-tech); }

  .module-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .module-eyebrow .en {
    font-family: 'Fraunces Label', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lane);
    text-transform: uppercase;
  }

  .module-eyebrow .zh {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
  }

  .section-note {
    font-size: 11.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }

  .indicators {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    background: var(--surface-hover);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .indicator .label {
    font-size: 11px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .indicator .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .indicator .value.rise { color: var(--rise); }
  .indicator .value.fall { color: var(--fall); }

  .indicator .delta {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .indicator .delta.rise { color: var(--rise); }
  .indicator .delta.fall { color: var(--fall); }
  .indicator .delta.tag { color: var(--faint); font-weight: 500; }

  .news-list { margin-bottom: 4px; }

  details.news {
    border-top: 1px solid var(--line);
  }

  details.news:first-of-type { border-top: none; }

  details.news summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  details.news summary::-webkit-details-marker { display: none; }

  details.news summary:focus-visible {
    outline: 2px solid var(--lane);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .n-head { flex: 1; min-width: 0; }

  .n-title {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.4;
  }

  .n-teaser {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .chevron { transition: transform 0.2s ease; }
  }

  details[open] .chevron { transform: rotate(180deg); }

  .n-body {
    padding: 0 2px 16px 2px;
  }

  .n-full {
    font-size: 15px;
    line-height: 1.62;

ww.cna.com.tw/news/afe/202610080025.aspx", "name": "中央社"}]}, {"title": "中東局勢升溫 歐股收跌油價走高", "teaser": "地緣政治緊張油價再飆升", "full": "中東地區地緣政治局勢再度升溫，引發市場對原油供應中斷的擔憂，導致國際油價應聲走高。與此同時，地緣政治風險也衝擊了歐洲市場，導致歐股主要指數全線收跌。", "think": "地緣政治風險是市場的黑天鵝，油價上漲可能再次推升通膨壓力。對上班族而言，除了關注股市，也需留意日常物價與通膨指標的變動。", "question": "面對地緣政治帶來的油價波動，你的資產配置有納入避險資產嗎？", "sources": [{"url": "https://www.cna.com.tw/news/afe/202610080003.aspx", "name": "中央社"}]}], "robotics": [{"title": "黃仁勳對AI需求感到焦慮 輝達擬再投資人形機器人Figure逾300億", "teaser": "輝達重金砸向人形機器人", "full": "輝達執行長黃仁勳透露對AI強勁需求的焦慮感，為了加速布局，輝達計劃再度對人形機器人新創公司Figure投資超過300億台幣。這筆資金將協助Figure加速研發能融入人類生活與工作的自主機器人。", "think": "輝達的投資風向標正從純軟體AI轉向硬體實體化的「具身智能」。人形機器人很可能是下一個十年的關鍵成長引擎，相關供應鏈值得提早關注。", "question": "你認為人形機器人最先會在哪個工作場景取代人類？", "sources": [{"url": "https://news.google.com/rss/articles/CBMib0FVX3lxTE1WUmZXTGJENjc1R01qRmZpTHk0Q3NENWVFeEZWeF9VdzZjVDdqbjVTTk0tZWFXT21FSnhRQUg4cUlEOFZoRXpsbWMzMG13UGNtWXRrOUxaaXRIaVVCWW1mVTY3YUU4WGRnTjdqcmwyRQ?oc=5", "name": "知新聞"}]}, {"title": "機器人的ChatGPT時刻何時到來？AI還有4大難題", "teaser": "機器人爆發前仍有四大難題", "full": "雖然生成式AI發展迅速，但專家指出，機器人要迎來像ChatGPT般的爆發時刻，仍面臨硬體成本、環境適應力、安全法規及數據收集等四大難題。要實現真正的通用機器人仍需時間突破。", "think": "科技的想像很豐滿，但現實的物理限制很骨感。投資機器人概念股時，不應盲目跟風，要分清哪些是短期題材、哪些是長期能落實的技術。", "question": "你覺得要克服這四大難題，最關鍵的突破會是硬體還是軟體？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTFAzRURETnV1MV9fR1BjWi1tRGo3dUEzTEpFYUM3cHhzbTdYWTIyejdGaUJZcXRrSTU4Q2NjcVZuM3pYS0tRN0NTSmpMVXcyekhvY0lfWHd4cW9yZllHZ1Zj?oc=5", "name": "工商時報"}]}, {"title": "視覺 AI 為建築工地打造「感知層」，讓機器人讀懂人類在哪裡、正要做什麼", "teaser": "視覺AI讓機器人更懂人類", "full": "視覺AI技術正為高風險的建築工地打造全新的「感知層」。透過這項技術，工地機器人能精準讀懂人類工人的位置與意圖，進而實現人機協作，大幅提升工地安全並減少意外發生。", "think": "機器人不再只是冷冰冰的重複性工具，而是能理解人類行為的協作夥伴。這種感知技術的普及，將使更多高風險行業實現安全升級。", "question": "如果你的工作環境多了一個能讀懂你意圖的機器人，你會感到安心還是壓力？", "sources": [{"url": "https://news.google.com/rss/articles/CBMifkFVX3lxTE1lcENTREJRZVRpRHUtc1cyQzFVams4RVAwZ2dKN282d3EzbHlnUk0tWWRsaVFNOUIwZHlpLTl5Z2UyOER2MzdsbHNyVXgwS0QtRXVRdFV3RjJHTHVGM3BUTFRfS3BhTlc1a2x3bklXdXEyaXA4MnV4clE1dHlvQQ?oc=5", "name": "TechOrange 科技報橘"}]}, {"title": "烏克蘭前防長：部署AI機器人抗俄刻不容緩 無暇顧及社會風險", "teaser": "戰火迫使AI機器人投入戰場", "full": "烏克蘭前國防部長表示，面對嚴峻的戰事，部署AI與機器人科技來抗衡俄羅斯已是刻不容緩的決定，目前根本無暇顧及潛在的社會或倫理風險。這顯示戰爭正在加速前沿軍事科技的實際應用。", "think": "科技發展在極端環境下往往會脫離常規監管。軍事AI的快速推進，雖然是情勢所迫，但其帶來的倫理與失控風險，是全球在戰後必須面對的嚴肅課題。", "question": "當生存面臨威脅時，科技倫理是否應該暫時向現實妥協？", "sources": [{"url": "https://news.google.com/rss/articles/CBMihANBVV95cUxPVmJjbERxVWR0Nk9KTXdoXy16Z2VaeEh3WXJYS1BFelQ2emlaSjNCTHZoemFSMi1GTkRLenNENDNsaEIyMER4TXRkdWJnbmJaMUFiYV8xd2lyUWp1ZkdlTk10V0tYY2MzQVp2YUpYVjZ1LWhMZ1NHVjRkOW10TUxIRlJoOTBpYnM5dnExT2xsQThCTEdQYW0xY3dpNDB5bTQtYUxqRDVCbVdjNGlOenc1WjJGaG9tcjV3eHljeXVOYjM2Q2wxaFh0em5oTHRERWNRTDc0aFRHZHI2aThobk1DMHBiVnFJQy1yMkRNQ2c3dTlxbEV5bGFFR2xPdmtVVHNLV0NDOUl0djZaRjQ5RnJWM3BNQXVpS0FseTNXWEZJZVV1Zms0WGR6Q0h6dlpITmZZV0VkU2JvV21mQjh1N1JKTHdBYmxEdzBxUE5welIzU1pFNWdvWHYzNUwxV0pldEduTWlBZDZ6a3IxVW9zMEJlUk1MemlWT3prYllZZllMczYtU2Nr?oc=5", "name": "Yahoo新聞"}]}, {"title": "2026通用設計論壇登場 首創「通用設計×主動安全×機器人照護」未來宅", "teaser": "機器人照護走入未來住宅", "full": "2026通用設計論壇揭幕，首度提出結合通用設計、主動安全與機器人照護的「未來宅」概念。這項設計旨在利用機器人技術，在居家空間中提供長者與行動不便者更主動、安全的照護服務。", "think": "隨著高齡化社會來臨，居家照護機器人將從奢侈品變成剛需。這不僅是房地產與科技業的新藍海，也為解決照護人力短缺提供了實質的解決方案。", "question": "你會考慮在未來的家中，配置一台專職照護與安全的機器人嗎？", "sources": [{"url": "https://news.google.com/rss/articles/CBMiW0FVX3lxTE5aRHdQQVktYkVfVlJBa25xc2U0WkpENjdLRWNGZTdhR1Q2dHlobkl2QzF6T0Z4UnZYcXdqOUFEdzBJTFVMeWU3eDdBZkpxZThqTWt3QWVDN3ZHelk?oc=5", "name": "經濟日報"}]}], "tech": [{"title": "家登 9 月營收創單月新高，先進封裝載具接獲韓系客戶大單", "teaser": "家登營收創高大咬韓系訂單", "full": "半導體載具大廠家登公布9月營收創下單月歷史新高，主要得益於先進封裝載具成功接獲韓系半導體巨頭的大單。這顯示台廠在先進封裝供應鏈中的關鍵地位依然穩固且持續擴張。", "think": "營收創高代表實質基本面的支撐。在台積電大建先進封裝產能的趨勢下，相關設備與載具供應商的成長動能非常明確，是台股中相對吸睛的族群。", "question": "台廠供應鏈大啃韓系訂單，這對台韓半導體競爭格局有何啟示？", "sources": [{"url": "https://finance.technews.tw/2026/10/08/gudengs-september-revenue-hit-a-new-monthly-high/", "name": "科技新報"}]}, {"title": "成本狂降 75%！Anthropic 推出最快小模型 Claude Haiku 5.5，效能輾壓前代", "teaser": "成本降七成五的最強小模型", "full": "AI新創巨頭Anthropic推出了全新小模型Claude Haiku 5.5，不僅運算速度極快，成本更比前代大幅降低了75%，效能甚至超越了先前的中大型模型。這項突破將使AI應用的普及門檻大大降低。", "think": "AI的競爭焦點已從單純追求模型規模，轉向追求「高性價比」與「邊緣運算」。成本大降意味著更多中小企業能負擔得起AI升級，AI應用的爆發期即將到來。", "question": "當AI運算成本降低75%，你的工作有哪些部分可以立刻導入AI來省時省力？", "sources": [{"url": "https://technews.tw/2026/10/08/anthropic-claude-haiku-5-5/", "name": "科技新報"}]}, {"title": "砸 2,200 億美元強攻 AI！亞馬遜再爆裁員，波及客服與零售部門", "teaser": "亞馬遜強攻AI同時精簡人力", "full": "亞馬遜宣布將砸下2,200億美元的驚人資金強攻AI技術與基礎建設，但與此同時，公司內部也再度爆出裁員消息，主要波及客服與零售部門。這顯示企業正積極調整資源配置，將人力轉向高科技研發。", "think": "企業「一手大買AI、一手裁減傳統人力」的趨勢越來越明顯。這對通勤族是個警訊：重複性高、容易被AI替代的崗位正在加速消失，提升自我數位技能已是生存必修課。", "question": "面對企業資源向AI傾斜，我們該如何培養不易被AI取代的「核心競爭力」？", "sources": [{"url": "https://technews.tw/2026/10/08/amazon-more-layoffs/", "name": "科技新報"}]}, {"title": "蘇姿丰訪韓固樁 AI 記憶體產能，結盟三星、SK 海力士展開長期戰略合作", "teaser": "超微蘇媽訪韓固樁記憶體", "full": "超微（AMD）執行長蘇姿丰親自訪問韓國，旨在鞏固AI所需的高頻寬記憶體（HBM）產能。超微正積極與三星及SK海力士展開長期戰略合作，以確保在與輝達的AI晶片爭霸戰中擁有穩定的供應鏈。", "think": "AI晶片的勝負不只看設計，更看誰能搶到關鍵的HBM記憶體與先進封裝產能。超微與韓廠的結盟，顯示地緣政治與供應鏈管理在科技戰中扮演著決定性角色。", "question": "超微與韓廠結盟抗衡輝達，你認為這會如何影響未來的AI晶片市場版圖？", "sources": [{"url": "https://technews.tw/2026/10/08/lisa-su-south-korea-deepens-ai-chip-cooperation/", "name": "科技新報"}]}, {"title": "Google 推出 AI 平台 Playground，用提示詞就能建立、分享自製遊戲", "teaser": "用提示詞就能無痛自製遊戲", "full": "Google推出了全新AI平台Playground，使用者只需輸入簡單的提示詞，就能自動建立並分享自製的互動遊戲。這項工具徹底降低了遊戲開發的技術門檻，讓沒有程式背景的普通人也能成為創作者。", "think": "「人人都是開發者」的時代真的來臨了。這類無代碼AI平台的出現，將極大釋放人類的創意，未來內容創作的關鍵將不再是技術，而是獨特的想法與說故事的能力。", "question": "如果今天就能用提示詞做出一款遊戲，你想創造一個什麼樣的世界？", "sources": [{"url": "https://technews.tw/2026/10/08/google-now-lets-you-make-games-with-ai/", "name": "科技新報"}]}]}}</script>

}

function loadSlot(slot) {
  var el = document.getElementById('slot-' + slot);
  var data = null;
  try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
  document.getElementById('slot-select').value = slot;
  if (!data || data.pending || !data.modules) {
    renderEmpty(slot);
    return;
  }
  document.getElementById('masthead-date').textContent = data.date;
  document.getElementById('tldr-text').textContent = data.tldr;
  renderIndicators(data.indicators);
  renderModule('news-markets', data.modules.markets);
  renderModule('news-robotics', data.modules.robotics);
  renderModule('news-tech', data.modules.tech);
}

function getDefaultSlot() {
  var parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit'}).formatToParts(new Date());
  var h = parseInt(parts.find(function(p){return p.type==='hour';}).value, 10);
  var m = parseInt(parts.find(function(p){return p.type==='minute';}).value, 10);
  var mins = h * 60 + m;
  if (mins >= 7*60+30 && mins < 13*60) return '0730';
  if (mins >= 13*60 && mins < 20*60) return '1300';
  return '2000';
}

document.getElementById('slot-select').addEventListener('change', function(e) {
  loadSlot(e.target.value);
});

loadSlot(getDefaultSlot());

(function () {
  var stage = document.getElementById('duck-stage');
  var pos = document.getElementById('duck-pos');
  var face = document.getElementById('duck-face');
  var actionEl = document.getElementById('duck-action');
  var svg = document.getElementById('duck-svg');
  var bubble = document.getElementById('duck-bubble');
  if (!stage || !pos || !face || !actionEl || !svg || !bubble) {
    console.error('duck mascot: missing DOM element(s), aborting init', {stage: !!stage, pos: !!pos, face: !!face, actionEl: !!actionEl, svg: !!svg, bubble: !!bubble});
    return;
  }
  var ACTIONS = ['jump', 'spin', 'bow', 'wave', 'shiver', 'salute', 'dance'];
  var WALK_SPEED = 55; // px/sec
  var dir = 1;
  var x = 0;
  var walking = false;
  var mascotData = null;
  var bubbleTimer = null;

  function duckWidth() { return pos.offsetWidth || 72; }
  function maxX() { return Math.max(0, stage.offsetWidth - duckWidth()); }

  function currentX() {
    var cs = getComputedStyle(pos).transform;
    if (!cs || cs === 'none') return x;
    var m = cs.match(/matrix\(([^)]+)\)/);
    if (!m) return x;
    var parts = m[1].split(',');
    return parseFloat(parts[4]) || 0;
  }

  function stepTo(targetX) {
    var dist = Math.abs(targetX - x);
    var duration = Math.max(1.2, dist / WALK_SPEED);
    face.style.transform = 'scaleX(' + dir + ')';
    pos.style.transition = 'transform ' + duration + 's linear';
    pos.style.transform = 'translateX(' + targetX + 'px)';
    x = targetX;
  }

  function walkNext() {
    if (!walking) return;
    var target = dir === 1 ? maxX() : 0;
    if (Math.abs(target - x) < 1) { dir *= -1; target = dir === 1 ? maxX() : 0; }
    stepTo(target);
  }

  pos.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform' || !walking) return;
    dir *= -1;
    walkNext();
  });

  function startWalking() {
    walking = true;
    walkNext();
  }

  window.addEventListener('resize', function () {
    x = Math.min(currentX(), maxX());
    if (walking) walkNext();
  });

  function playAction(name) {
    if (ACTIONS.indexOf(name) === -1) name = 'jump';
    var freezeX = currentX();
    walking = false;
    pos.style.transition = 'none';
    pos.style.transform = 'translateX(' + freezeX + 'px)';
    x = freezeX;
    stage.classList.add('is-acting');
    actionEl.className = 'duck-action';
    void actionEl.offsetWidth;
    actionEl.className = 'duck-action action-' + name;
    var onDone = function () {
      actionEl.removeEventListener('animationend', onDone);
      actionEl.className = 'duck-action';
      stage.classList.remove('is-acting');
      startWalking();
    };
    actionEl.addEventListener('animationend', onDone);
  }

  function showBubble(text) {
    bubble.textContent = text;
    bubble.style.left = Math.max(0, Math.min(x, maxX())) + 'px';
    bubble.classList.add('is-visible');
    requestAnimationFrame(function () {
      var bw = bubble.offsetWidth;
      var maxLeft = stage.offsetWidth - bw - 4;
      if (parseFloat(bubble.style.left) > maxLeft) {
        bubble.style.left = Math.max(0, maxLeft) + 'px';
      }
    });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('is-visible');
    }, 5000);
  }

  function loadMascot() {
    var el = document.getElementById('mascot-today');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }
    if (!data || data.pending) { mascotData = null; svg.setAttribute('class', 'duck-svg'); return; }
    mascotData = data;
    var wearClasses = (Array.isArray(data.outfit) ? data.outfit : []).map(function (name) {
      return 'wear-' + name;
    });
    svg.setAttribute('class', 'duck-svg ' + wearClasses.join(' '));
  }

  pos.addEventListener('click', function () {
    var action = (mascotData && mascotData.action) || 'jump';
    var message = (mascotData && mascotData.message) || '今天也要好好加油，通勤路上小心喔！';
    playAction(action);
    showBubble(message);
  });

  loadMascot();
  startWalking();
})();
</script>
</body>
</html>
